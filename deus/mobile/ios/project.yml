name: DEUSMobileNode
options:
  bundleIdPrefix: io.blinfinity
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  DEUSMobileNode:
    type: application
    platform: iOS
    sources:
      - DEUSMobileNode
    info:
      path: DEUSMobileNode/Info.plist
      properties:
        CFBundleDisplayName: DEUS Mobile Node
        UILaunchScreen: {}
        BGTaskSchedulerPermittedIdentifiers:
          - io.blinfinity.deus.mobile.maintenance
        UIBackgroundModes:
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.blinfinity.deus.mobile
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.2.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
