name: DEUSMobileNode
options:
  bundleIdPrefix: io.blinfinity
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  DEUSMobileNode:
    type: application
    platform: iOS
    sources:
      - DEUSMobileNode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.blinfinity.deus.mobile
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
