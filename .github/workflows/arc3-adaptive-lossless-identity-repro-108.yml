name: ARC3 identity-grounded adaptive lossless repro 108

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - '.github/workflows/arc3-adaptive-lossless-identity-repro-108.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-repro-after-rate-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile exact identity-grounded harness
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/temporal_state_target_blind_ab.py \
            public_benchmark/arc3/kaggle_candidates/segmentation_target_blind_ab.py \
            public_benchmark/arc3/kaggle_candidates/adaptive_lossless_scene.py \
            public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab.py \
            public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab_v2.py \
            public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab_v3_identity.py

      - name: Download exact fixed public traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p schema_public
          base='https://huggingface.co/datasets/schema-harness/arc-agi-3-schema-traces/resolve/main/gpt_5_6_sol'
          declare -A traces=(
            [bp35]='gpt_5_6_sol_max_bp35'
            [sp80]='gpt_5_6_sol_max_sp80'
            [wa30]='gpt_5_6_sol_xhigh_wa30'
          )
          for game in bp35 sp80 wa30; do
            d="${traces[$game]}"
            curl --fail --location --retry 3 --silent --show-error "$base/$d/events.jsonl?download=true" -o "schema_public/${game}.jsonl"
            test -s "schema_public/${game}.jsonl"
          done
          sha256sum schema_public/*.jsonl | sort > schema_public/SHA256SUMS.txt

      - name: Deliberate cooldown after observed 429 window
        run: sleep 120

      - name: Execute one clean fixed identity-grounded reproduction pass
        id: reproduce
        continue-on-error: true
        run: |
          python public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab_v3_identity.py \
            --input schema_public/bp35.jsonl \
            --input schema_public/sp80.jsonl \
            --input schema_public/wa30.jsonl \
            --cases-per-game 6 \
            --receipt repro-pass.json

      - name: Summarize and enforce identity truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s repro-pass.json
          sha256sum repro-pass.json > RECEIPT_SHA256SUMS.txt
          jq '{schema,requested_model,selection,target_design,arms,per_game,cross_game_comparison,promotion_gate,identity_repair:{requested_model,call_count,http200_count,exact_identity_count,all_calls_exact_identity,served_models},truth}' repro-pass.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '
            .schema=="deus/arc3-adaptive-lossless-cross-game-behavior-ab/3"
            and .requested_model=="nvidia/llama-3.2-11b-vision"
            and .identity_repair.all_calls_exact_identity==true
            and .identity_repair.call_count==37
            and .identity_repair.http200_count==37
            and .identity_repair.exact_identity_count==37
            and .truth.provider_model_identity_verified==true
            and .truth.provider_execution_is_not_kaggle_execution==true
            and .truth.kaggle_submission_attempted==false
            and .truth.submission_quota_spent==false
            and .truth.owner_score_claim==false
          ' repro-pass.json >/dev/null

      - name: Upload exact reproduction receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-adaptive-lossless-identity-repro-108
          path: |
            repro-pass.json
            RECEIPT_SHA256SUMS.txt
            schema_public/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on inconclusive provider execution
        shell: bash
        run: |
          gate="$(jq -r '.promotion_gate' repro-pass.json)"
          case "$gate" in
            INCONCLUSIVE_*) exit 2 ;;
            *) exit 0 ;;
          esac
