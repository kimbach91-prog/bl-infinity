name: ARC3 ft09 relational mismatch discriminant 209

on:
  push:
    branches:
      - deus/arc3-remaining14-coverage-20260922
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_relational_mismatch_discriminant_209.py
      - .github/workflows/arc3-ft09-relational-mismatch-discriminant-209.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-ft09-relational-mismatch-discriminant:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_v5_canonical_patch_router_191.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_macro_neighbor_rule_207.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_relational_mismatch_discriminant_209.py
      - name: Download exact ft09 p0..p19 public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          game='ft09-0d8bbf25'
          for p in $(seq 0 19); do
            f="${game}_p${p}_events.jsonl"
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute exact two-mismatch discriminant diagnostic
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_ft09_relational_mismatch_discriminant_209.py \
            "${args[@]}" --output r209-ft09-relational-mismatch-discriminant.json
      - name: Verify truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r209-ft09-relational-mismatch-discriminant.json'))
          assert d['schema']=='deus/arc3-ft09-relational-mismatch-discriminant/1'
          assert d['verdict']['base_reproduced'] is True
          t=d['truth']
          assert t['heldout_never_updates_model'] is True
          assert t['independent_generalization_claim'] is False
          assert t['diagnostic_only'] is True
          assert t['full_frame_solver_claim'] is False
          assert t['kaggle_execution'] is False
          assert t['submission_quota_spent'] is False
          print(json.dumps({'base':d['base_heldout'],'zero_wrong':d['zero_wrong_variants'],'verdict':d['verdict']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r209-ft09-relational-mismatch-discriminant
          path: |
            r209-ft09-relational-mismatch-discriminant.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
