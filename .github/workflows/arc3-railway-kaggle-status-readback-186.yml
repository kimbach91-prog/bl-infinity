name: ARC3 Railway Kaggle status readback 186

on:
  push:
    branches: [deus/arc3-kaggle-rank-climb-20260921]
    paths:
      - '.github/workflows/arc3-railway-kaggle-status-readback-186.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe existing authorized Railway executor without mutation
        shell: bash
        run: |
          set -u
          base='https://deus-cpu-executor-b-production.up.railway.app'
          mkdir -p receipt
          for ep in health kaggle-status arc3-c8-status arc3-c8-launch-receipt kaggle-submissions; do
            echo "=== $ep ===" | tee "receipt/${ep}.txt"
            curl --silent --show-error --location --max-time 120 \
              -w '\nHTTP_CODE:%{http_code}\n' \
              "$base/$ep" | tee -a "receipt/${ep}.txt" || true
          done
          date -u +'%Y-%m-%dT%H:%M:%SZ' > receipt/probed_at_utc.txt
          sha256sum receipt/*.txt | sort > receipt/SHA256SUMS
          cat receipt/SHA256SUMS

      - name: Upload readback receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-railway-kaggle-status-readback-186
          path: receipt/
          if-no-files-found: error
          retention-days: 30
