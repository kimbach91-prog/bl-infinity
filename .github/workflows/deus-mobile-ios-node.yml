name: DEUS Mobile iOS Node

on:
  push:
    branches:
      - deus/iphone13-1-node-agent
      - deus/iphone13-1-node-agent-v02
    paths:
      - 'deus/mobile/ios/**'
      - '.github/workflows/deus-mobile-ios-node.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: deus/mobile/ios
        run: xcodegen generate

      - name: Build unsigned simulator target
        working-directory: deus/mobile/ios
        run: >-
          xcodebuild
          -project DEUSMobileNode.xcodeproj
          -scheme DEUSMobileNode
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Assert mobile truth boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("deus/mobile/ios/node-manifest.json").read_text())
          required={"JAILBREAK","ROOT","KERNEL_CONTROL","PERSISTENT_BACKGROUND_DAEMON","GUARANTEED_BACKGROUND_CADENCE"}
          missing=required-set(m["not_claimed"])
          assert not missing, f"truth-boundary regression: {sorted(missing)}"
          assert m["kernel_gate"]["state"].startswith("HOLD_")
          assert m["offload_policy"]["default"]=="OFFLOAD_FIRST"
          print("mobile truth boundary PASS")
          PY
