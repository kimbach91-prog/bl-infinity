name: Owner Publish Fast Lane

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "owner-pages-fastlane"
  cancel-in-progress: true

jobs:
  build:
    if: contains(github.event.head_commit.message, '[OWNER-PUBLISH]')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owner publish snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-security.txt

      - name: Install pinned build and security dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-security.txt

      - name: Audit dependency vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Build and audit owner Pages artifact
        run: python scripts/build_owner_pages.py

      - name: Upload owner Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: "site"

  deploy:
    if: contains(github.event.head_commit.message, '[OWNER-PUBLISH]')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Notify IndexNow for root and novel surfaces
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail-with-body --retry 2 -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @- <<'JSON'
          {
            "host": "kimbach91-prog.github.io",
            "key": "7d4a9f38b25c4e7aa6d0c913b8e42f61",
            "keyLocation": "https://kimbach91-prog.github.io/bl-infinity/7d4a9f38b25c4e7aa6d0c913b8e42f61.txt",
            "urlList": [
              "https://kimbach91-prog.github.io/bl-infinity/",
              "https://kimbach91-prog.github.io/bl-infinity/novel/",
              "https://kimbach91-prog.github.io/bl-infinity/novel/chapter-001.html"
            ]
          }
          JSON
