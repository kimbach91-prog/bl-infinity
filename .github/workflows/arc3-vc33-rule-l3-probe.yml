name: ARC3 vc33 L3 live observation probe

on:
  push:
    branches: [deus/arc3-vc33-rule-probe-20260920]
    paths: [.github/workflows/arc3-vc33-rule-l3-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Replay live-derived L1/L2 then dump L3 public observation
        run: |
          python - <<'PY'
          import copy,json,logging,hashlib
          from collections import Counter
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.CRITICAL)

          def fr(o): return np.asarray(o.frame[-1],dtype=np.uint8)
          def comps(a,color):
              m=(a==color);H,W=a.shape;seen=np.zeros_like(m,bool);out=[]
              for y in range(H):
                  for x in range(W):
                      if not m[y,x] or seen[y,x]: continue
                      st=[(x,y)];seen[y,x]=1;pts=[]
                      while st:
                          xx,yy=st.pop();pts.append((xx,yy))
                          for nx,ny in ((xx+1,yy),(xx-1,yy),(xx,yy+1),(xx,yy-1)):
                              if 0<=nx<W and 0<=ny<H and m[ny,nx] and not seen[ny,nx]:
                                  seen[ny,nx]=1;st.append((nx,ny))
                      xs=[p[0] for p in pts];ys=[p[1] for p in pts]
                      out.append({'area':len(pts),'bbox':[min(xs),min(ys),max(xs),max(ys)],
                                  'center':[round(sum(xs)/len(xs),2),round(sum(ys)/len(ys),2)]})
              return sorted(out,key=lambda z:(-z['area'],z['bbox']))
          def brown(o):
              return sorted([x for x in comps(fr(o),9) if x['area']>=8],key=lambda z:(z['bbox'][0],z['bbox'][1]))
          def click(e,o,xy):
              amap={a.value:a for a in e.action_space}
              return e.step(amap[6],data={'x':int(xy[0]),'y':int(xy[1])})

          a=arc_agi.Arcade(operation_mode=OperationMode.NORMAL)
          e=a.make('vc33',seed=0,save_recording=False,include_frame_data=True);o=e.observation_space
          b1=brown(o);t=max(b1,key=lambda z:z['center'][1])['center']
          for _ in range(3):
              o=click(e,o,t)
              if int(o.levels_completed)>=1: break
          b2=brown(o);cent=[x['center'] for x in b2]
          # validated L2 mapping from live-sorted left-edge brown components
          F=cent[3];E=cent[1]
          for role in ['F','F','F','E','F','E','F']:
              o=click(e,o,F if role=='F' else E)
              if int(o.levels_completed)>=2: break
          if int(o.levels_completed)<2: raise RuntimeError('L2_FAIL')

          g=fr(o)
          colors={int(c):int((g==c).sum()) for c in np.unique(g)}
          allc={str(int(c)):comps(g,int(c))[:40] for c in np.unique(g)}
          rec={'game':'vc33','level':int(o.levels_completed),'state':o.state.value,
               'available_actions':[int(x.value) if hasattr(x,'value') else int(x) for x in (o.available_actions or [])],
               'shape':list(g.shape),'frame_sha256':hashlib.sha256(g.tobytes()).hexdigest(),
               'colors':colors,'components':allc}
          print('VC33_L3_OBSERVATION='+json.dumps(rec,separators=(',',':')))
          PY
