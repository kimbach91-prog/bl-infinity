name: ARC3 public structural fixed selector 174
on:
  push:
    branches: [deus/arc3-kaggle-rank-climb-20260921]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_structural_fixed_selector_174.py
      - .github/workflows/arc3-public-structural-fixed-selector-174.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_structural_fixed_selector_174.py
      - name: Download exact pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in ar25-0c556536_p0_events.jsonl ar25-0c556536_p10_events.jsonl ar25-0c556536_p11_events.jsonl; do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute selector diagnostic
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_structural_fixed_selector_174.py \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" \
            --output "$GITHUB_WORKSPACE/structural-fixed-selector-public-174.json"
      - name: Enforce truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('structural-fixed-selector-public-174.json'))
          assert d['rung']==174
          t=d['truth']
          assert t['current_prediction_uses_preaction_and_prior_history_only']
          assert t['current_outcome_used_only_for_scoring_and_post_prediction_learning']
          assert not t['independent_generalization_claim']
          assert not t['kaggle_execution'] and not t['submission_quota_spent']
          print(json.dumps({'rung':174,'gate':d['diagnostic_gate'],'best':d['aggregate']['best_diagnostic_selector'],'selectors':d['aggregate']['selectors'],'truth':'PREQUENTIAL_PUBLIC_SOURCE_ASSISTED_ONLY'},sort_keys=True))
          PY
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-structural-fixed-selector-174
          path: |
            structural-fixed-selector-public-174.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
