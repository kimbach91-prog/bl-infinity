name: DEUS Kaggle machine auth canary

on:
  push:
    branches: [deus/arc3-kaggle-rank-climb-20260921]
    paths: [.github/workflows/deus-kaggle-machine-auth-canary.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_ARC_API_KEY: ${{ secrets.ARC_API_KEY }}
      VAR_ARC_API_KEY: ${{ vars.ARC_API_KEY }}
      SEC_KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      VAR_KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      SEC_KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      VAR_KAGGLE_KEY: ${{ vars.KAGGLE_KEY }}
      SEC_KAGGLE_API_KEY: ${{ secrets.KAGGLE_API_KEY }}
      VAR_KAGGLE_API_KEY: ${{ vars.KAGGLE_API_KEY }}
      SEC_KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      VAR_KAGGLE_API_TOKEN: ${{ vars.KAGGLE_API_TOKEN }}
      SEC_KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
      VAR_KAGGLE_JSON: ${{ vars.KAGGLE_JSON }}
      SEC_API_KEY: ${{ secrets.API_KEY }}
      VAR_API_KEY: ${{ vars.API_KEY }}
      SEC_KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      VAR_KAGGLE_TOKEN: ${{ vars.KAGGLE_TOKEN }}
      SEC_USERNAME: ${{ secrets.USERNAME }}
      VAR_USERNAME: ${{ vars.USERNAME }}
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
      ALL_VARS_JSON: ${{ toJSON(vars) }}
    steps:
      - name: Safe secret presence check
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          keys = ["SEC_ARC_API_KEY","VAR_ARC_API_KEY","SEC_KAGGLE_USERNAME","VAR_KAGGLE_USERNAME","SEC_KAGGLE_KEY","VAR_KAGGLE_KEY","SEC_KAGGLE_API_KEY","VAR_KAGGLE_API_KEY","SEC_KAGGLE_API_TOKEN","VAR_KAGGLE_API_TOKEN","SEC_KAGGLE_JSON","VAR_KAGGLE_JSON","SEC_API_KEY","VAR_API_KEY","SEC_KAGGLE_TOKEN","VAR_KAGGLE_TOKEN","SEC_USERNAME","VAR_USERNAME"]
          print("DEUS_AUTH_BINDING_PRESENCE="+json.dumps({k: bool(os.environ.get(k)) for k in keys}, sort_keys=True))
          try:
              sec=json.loads(os.environ.get("ALL_SECRETS_JSON") or "{}")
          except Exception:
              sec={}
          try:
              var=json.loads(os.environ.get("ALL_VARS_JSON") or "{}")
          except Exception:
              var={}
          print("DEUS_SECRET_NAMES="+json.dumps(sorted(sec.keys())))
          print("DEUS_VAR_NAMES="+json.dumps(sorted(var.keys())))
          PY

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Normalize Kaggle auth without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kaggle"
          ARC_API_KEY="${SEC_ARC_API_KEY:-${VAR_ARC_API_KEY:-}}"
          KAGGLE_USERNAME="${SEC_KAGGLE_USERNAME:-${VAR_KAGGLE_USERNAME:-}}"
          KAGGLE_KEY="${SEC_KAGGLE_KEY:-${VAR_KAGGLE_KEY:-}}"
          KAGGLE_API_KEY="${SEC_KAGGLE_API_KEY:-${VAR_KAGGLE_API_KEY:-}}"
          KAGGLE_API_TOKEN="${SEC_KAGGLE_API_TOKEN:-${VAR_KAGGLE_API_TOKEN:-}}"
          KAGGLE_JSON="${SEC_KAGGLE_JSON:-${VAR_KAGGLE_JSON:-}}"
          GENERIC_API_KEY="${SEC_API_KEY:-${VAR_API_KEY:-}}"
          GENERIC_KAGGLE_TOKEN="${SEC_KAGGLE_TOKEN:-${VAR_KAGGLE_TOKEN:-}}"
          GENERIC_USERNAME="${SEC_USERNAME:-${VAR_USERNAME:-}}"
          if [ -z "${KAGGLE_API_TOKEN:-}" ] && [ -n "${GENERIC_KAGGLE_TOKEN:-}" ]; then KAGGLE_API_TOKEN="$GENERIC_KAGGLE_TOKEN"; fi
          if [ -z "${KAGGLE_API_TOKEN:-}" ] && [ -n "${GENERIC_API_KEY:-}" ]; then KAGGLE_API_TOKEN="$GENERIC_API_KEY"; fi
          if [ -z "${KAGGLE_USERNAME:-}" ] && [ -n "${GENERIC_USERNAME:-}" ]; then KAGGLE_USERNAME="$GENERIC_USERNAME"; fi
          if [ -n "${KAGGLE_JSON:-}" ]; then
            printf '%s' "$KAGGLE_JSON" > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
          fi
          if [ -z "${KAGGLE_KEY:-}" ] && [ -n "${KAGGLE_API_KEY:-}" ]; then
            KAGGLE_KEY="$KAGGLE_API_KEY"
            echo "KAGGLE_KEY_FALLBACK_FROM_API_KEY=true"
          else
            echo "KAGGLE_KEY_FALLBACK_FROM_API_KEY=false"
          fi
          {
            echo "ARC_API_KEY=$ARC_API_KEY"
            echo "KAGGLE_USERNAME=$KAGGLE_USERNAME"
            echo "KAGGLE_KEY=$KAGGLE_KEY"
            echo "KAGGLE_API_TOKEN=$KAGGLE_API_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Verify authenticated Kaggle account
        id: kaggle_auth
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels list --mine > /tmp/kernels.txt
          python - <<'PY'
          from pathlib import Path
          rows=[x for x in Path('/tmp/kernels.txt').read_text(errors='replace').splitlines() if x.strip()]
          print("DEUS_KAGGLE_AUTH=PASS")
          print("DEUS_KAGGLE_KERNEL_ROWS="+str(max(0,len(rows)-1)))
          for line in rows[:12]:
              print("KERNEL_LIST "+line[:300])
          PY

      - name: Read ARC-AGI-3 submissions
        shell: bash
        run: |
          set -euo pipefail
          if kaggle competitions submissions arc-prize-2026-arc-agi-3 > /tmp/submissions.txt 2>/tmp/submissions.err; then
            echo "DEUS_KAGGLE_SUBMISSIONS=PASS"
            sed -n '1,20p' /tmp/submissions.txt
          else
            echo "DEUS_KAGGLE_SUBMISSIONS=FAIL"
            sed -n '1,20p' /tmp/submissions.err
            exit 2
          fi

      - name: Check candidate bundle is present
        shell: bash
        run: |
          test -f public_benchmark/arc3/kaggle_candidates/flash_next_340/arc-agi-flash-next-mtp.ipynb || true
          echo "DEUS_CANARY_DONE"
