name: DEUS Kaggle machine auth canary

on:
  push:
    branches: [deus/arc3-kaggle-rank-climb-20260921]
    paths: [.github/workflows/deus-kaggle-machine-auth-canary.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARC_API_KEY: ${{ secrets.ARC_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_KEY: ${{ secrets.KAGGLE_API_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
    steps:
      - name: Safe secret presence check
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          keys = ["ARC_API_KEY","KAGGLE_USERNAME","KAGGLE_KEY","KAGGLE_API_KEY","KAGGLE_API_TOKEN","KAGGLE_JSON"]
          print("DEUS_SECRET_PRESENCE="+json.dumps({k: bool(os.environ.get(k)) for k in keys}, sort_keys=True))
          PY

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle

      - name: Normalize Kaggle auth without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kaggle"
          if [ -n "${KAGGLE_JSON:-}" ]; then
            printf '%s' "$KAGGLE_JSON" > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
          fi
          if [ -z "${KAGGLE_KEY:-}" ] && [ -n "${KAGGLE_API_KEY:-}" ]; then
            export KAGGLE_KEY="$KAGGLE_API_KEY"
            echo "KAGGLE_KEY_FALLBACK_FROM_API_KEY=true"
          else
            echo "KAGGLE_KEY_FALLBACK_FROM_API_KEY=false"
          fi
          {
            echo "KAGGLE_USERNAME=$KAGGLE_USERNAME"
            echo "KAGGLE_KEY=$KAGGLE_KEY"
            echo "KAGGLE_API_TOKEN=$KAGGLE_API_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Verify authenticated Kaggle account
        id: kaggle_auth
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels list --mine > /tmp/kernels.txt
          python - <<'PY'
          from pathlib import Path
          rows=[x for x in Path('/tmp/kernels.txt').read_text(errors='replace').splitlines() if x.strip()]
          print("DEUS_KAGGLE_AUTH=PASS")
          print("DEUS_KAGGLE_KERNEL_ROWS="+str(max(0,len(rows)-1)))
          for line in rows[:12]:
              print("KERNEL_LIST "+line[:300])
          PY

      - name: Read ARC-AGI-3 submissions
        shell: bash
        run: |
          set -euo pipefail
          if kaggle competitions submissions arc-prize-2026-arc-agi-3 > /tmp/submissions.txt 2>/tmp/submissions.err; then
            echo "DEUS_KAGGLE_SUBMISSIONS=PASS"
            sed -n '1,20p' /tmp/submissions.txt
          else
            echo "DEUS_KAGGLE_SUBMISSIONS=FAIL"
            sed -n '1,20p' /tmp/submissions.err
            exit 2
          fi

      - name: Check candidate bundle is present
        shell: bash
        run: |
          test -f public_benchmark/arc3/kaggle_candidates/flash_next_340/arc-agi-flash-next-mtp.ipynb || true
          echo "DEUS_CANARY_DONE"
