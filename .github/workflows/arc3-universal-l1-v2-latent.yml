name: ARC3 universal L1 v2 latent-state sweep

on:
  push:
    branches: [deus/arc3-universal-l1-v2-latent-20260921]
    paths: [.github/workflows/arc3-universal-l1-v2-latent.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        game: [dc22,tr87,ft09,ka59,lf52,sb26,re86,g50t,tn36,sc25,bp35,ar25,wa30]
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Latent-aware public-observation search
        env:
          GAME: ${{ matrix.game }}
        run: |
          python - <<'PY'
          import copy,hashlib,json,os,time
          from collections import Counter,deque
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          GAME=os.environ['GAME']; OUT=Path('verification'); OUT.mkdir()

          def fr(o): return np.asarray(o.frame[-1],dtype=np.uint8)
          def norm(o):
              a=fr(o).copy()
              if a.shape[0]>=4:
                  a[:2,:]=0; a[-2:,:]=0
              return a
          def fh(o): return hashlib.sha256(norm(o).tobytes()).hexdigest()

          def aids(o):
              out=[]
              for a in (getattr(o,'available_actions',None) or []):
                  try:v=int(a.value)
                  except Exception:
                      try:v=int(a)
                      except Exception:continue
                  if v not in out:out.append(v)
              return out

          def object_points(o,cap=72):
              a=fr(o); H,W=a.shape
              bg=Counter(int(v) for v in a.ravel()).most_common(1)[0][0]
              seen=np.zeros((H,W),bool);out=[];used=set()
              for y in range(2,max(2,H-2)):
                  for x in range(W):
                      if seen[y,x] or int(a[y,x])==bg: continue
                      col=int(a[y,x]);st=[(x,y)];seen[y,x]=1;pts=[]
                      while st:
                          xx,yy=st.pop();pts.append((xx,yy))
                          for nx,ny in ((xx+1,yy),(xx-1,yy),(xx,yy+1),(xx,yy-1)):
                              if 0<=nx<W and 0<=ny<H and not seen[ny,nx] and int(a[ny,nx])==col:
                                  seen[ny,nx]=1;st.append((nx,ny))
                      if not (1<=len(pts)<=384):continue
                      xs=[p[0] for p in pts];ys=[p[1] for p in pts]
                      samples=[pts[0],pts[len(pts)//2],pts[-1],
                               (int(round(sum(xs)/len(xs))),int(round(sum(ys)/len(ys))))]
                      for xx,yy in samples:
                          if yy<2 or yy>=H-2:continue
                          k=(int(xx),int(yy))
                          if k not in used:
                              used.add(k);out.append(k)
                              if len(out)>=cap:return out
              return out

          def coarse_lattice(o):
              a=fr(o);H,W=a.shape
              xs=list(range(4,W,8)); ys=list(range(6,max(7,H-4),8))
              return [(x,y) for y in ys for x in xs]

          def click_points(o):
              pts=[];used=set()
              for p in object_points(o)+coarse_lattice(o):
                  if p not in used:
                      used.add(p);pts.append(p)
              return pts[:128]

          def sig(act):
              aid,data=act
              if data:return f"{aid}:{int(data.get('x',-1))}:{int(data.get('y',-1))}"
              return str(aid)

          def cands(o,use_click=True):
              av=aids(o);out=[]
              for a in av:
                  if 1<=a<=5 or a==7:out.append((a,None))
              if use_click and 6 in av:
                  out.extend((6,{'x':x,'y':y}) for x,y in click_points(o))
              return out

          def step(e,act):
              aid,data=act;am={a.value:a for a in e.action_space}
              if aid not in am:return None
              try:return e.step(am[aid],data=data)
              except Exception:return None

          def search(e0,o0,max_exp=90000,seconds=300):
              start=int(o0.levels_completed)
              q=deque([(copy.deepcopy(e0),o0,[],())])
              seen={(fh(o0),())};exp=0;t0=time.monotonic();peak=1;latent_edges=0
              while q and exp<max_exp and time.monotonic()-t0<seconds:
                  e,o,path,suffix=q.popleft()
                  parent_fh=fh(o)
                  for act in cands(o,True):
                      ee=copy.deepcopy(e);nf=step(ee,act);exp+=1
                      if nf is None:continue
                      npth=path+[act]
                      if int(nf.levels_completed)>start:
                          return npth,{'expansions':exp,'seen':len(seen),'seconds':time.monotonic()-t0,
                                      'peak':peak,'latent_edges':latent_edges}
                      st=getattr(nf.state,'value',str(nf.state))
                      if st in ('GAME_OVER','WIN'):continue
                      child_fh=fh(nf)
                      if child_fh==parent_fh:
                          latent_edges+=1
                          ns=(suffix+(sig(act),))[-4:]
                      else:
                          ns=()
                      k=(child_fh,ns)
                      if k in seen:continue
                      seen.add(k);q.append((ee,nf,npth,ns));peak=max(peak,len(q))
              return None,{'expansions':exp,'seen':len(seen),'seconds':time.monotonic()-t0,
                           'peak':peak,'latent_edges':latent_edges}

          arc=arc_agi.Arcade(operation_mode=OperationMode.NORMAL)
          env=arc.make(GAME,seed=0,save_recording=False,include_frame_data=True)
          if env is None:raise RuntimeError('ENV_UNAVAILABLE')
          obs=env.observation_space
          path,meta=search(env,obs)
          discovery={'game':GAME,'result':'FOUND' if path else 'MISS',
                     'path_len':None if path is None else len(path),'path':path,'search':meta,
                     'available_actions':aids(obs),
                     'protocol':'PUBLIC_OBSERVATION_FRAME_PLUS_LATENT_ACTION_SUFFIX_SEARCH',
                     'latent_suffix_max':4,'coarse_lattice_step':8,
                     'game_source_inspected_by_solver':False,'external_route_used':False,
                     'environment_clone_used_for_search':True,'hidden_state_read':False}
          print('V2_DISCOVERY='+json.dumps(discovery,separators=(',',':')))
          receipt={'discovery':discovery,'online':None}
          if path:
              oa=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
              src='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/blob/'+os.environ['GITHUB_SHA']+'/.github/workflows/arc3-universal-l1-v2-latent.yml'
              cid=oa.open_scorecard(source_url=src,tags=['DEUS',GAME,'universal-l1-v2','latent-aware'])
              oe=oa.make(GAME,seed=0,scorecard_id=cid,save_recording=False,include_frame_data=True)
              if oe is None:raise RuntimeError('ONLINE_ENV_UNAVAILABLE')
              oo=oe.observation_space;used=0
              for i,act in enumerate(path,1):
                  nf=step(oe,act)
                  if nf is None:raise RuntimeError('ONLINE_STEP_FAIL_'+str(i))
                  oo=nf;used=i
                  if int(oo.levels_completed)>=1:break
              card=oa.close_scorecard(cid)
              receipt['online']={'result':'PASS' if int(oo.levels_completed)>=1 else 'FAIL',
                  'levels_completed':int(oo.levels_completed),'win_levels':int(getattr(oo,'win_levels',0) or 0),
                  'state':getattr(oo.state,'value',str(oo.state)),'actions_executed':used,
                  'scorecard_id':cid,'scorecard_score':None if card is None else card.score,
                  'route_sha256':hashlib.sha256(json.dumps(path,sort_keys=True,separators=(',',':')).encode()).hexdigest(),
                  'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],
                  'scope':'LEVEL_1_ONLY','competition_hidden_score_claim':False}
          (OUT/'receipt.json').write_text(json.dumps(receipt,indent=2))
          print('V2_RECEIPT='+json.dumps(receipt,separators=(',',':')))
          if path is None:raise RuntimeError('L1_NOT_FOUND')
          if receipt['online'] is None or receipt['online']['result']!='PASS':raise RuntimeError('ONLINE_VERIFY_FAIL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-v2-${{ matrix.game }}
          path: verification/
          retention-days: 30
