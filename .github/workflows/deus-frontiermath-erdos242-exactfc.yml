name: DEUS FrontierMath Erdos242 Exact-FC Lean Attempt

on:
  pull_request:
    paths:
      - '.github/workflows/deus-frontiermath-erdos242-exactfc.yml'
      - 'public_benchmark/wave1/frontiermath_erdos242_exactfc_attempt.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-fc-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: 488aade228ec37880b8fec178c173c07d279bb53
          path: vendor/formal-conjectures
      - name: Install exact FC Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          toolchain="$(cat vendor/formal-conjectures/lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          "$HOME/.elan/bin/elan" default "$toolchain"
      - name: Prepare exact FC proving environment
        shell: bash
        run: |
          cd vendor/formal-conjectures
          lake exe cache get
          lake build FormalConjecturesUtil
      - name: Execute hard proof candidate with Lean
        shell: bash
        run: |
          set +e
          cp public_benchmark/wave1/frontiermath_erdos242_exactfc_attempt.lean vendor/formal-conjectures/DeusErdos242ExactFCAttempt.lean
          cd vendor/formal-conjectures
          lake env lean DeusErdos242ExactFCAttempt.lean > ../../erdos242-exactfc.log 2>&1
          rc=$?
          cd ../..
          python - "$rc" <<'PY'
          import hashlib,json,pathlib,sys
          rc=int(sys.argv[1])
          candidate=pathlib.Path('public_benchmark/wave1/frontiermath_erdos242_exactfc_attempt.lean').read_bytes()
          log=pathlib.Path('erdos242-exactfc.log').read_text(errors='replace')
          receipt={
            'schema':'DEUS_FRONTIERMATH_ERDOS242_EXACT_FC_LEAN_V1',
            'dataset_source':'epoch-research/LeanOpenProblems@af3b82f9d2fd38bea33d59e637b6b4eff54a464c',
            'formal_conjectures_commit':'488aade228ec37880b8fec178c173c07d279bb53',
            'target':'Erdos242.erdos_242.disproof',
            'claim':'disproof',
            'lean_returncode':rc,
            'lean_verified':rc==0,
            'candidate_sha256':hashlib.sha256(candidate).hexdigest(),
            'log_tail':log[-6000:],
            'claim_boundary':'Exact pinned Formal Conjectures Lean environment. PASS proves only the submitted target under this source snapshot. FAIL is a proof-attempt receipt, not a mathematical verdict.'
          }
          pathlib.Path('erdos242-exactfc-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({k:v for k,v in receipt.items() if k!='log_tail'},sort_keys=True))
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: deus-frontiermath-erdos242-exactfc
          path: |
            erdos242-exactfc.log
            erdos242-exactfc-receipt.json
