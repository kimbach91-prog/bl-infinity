name: ARC3 Kaggle machine auth probe

on:
  workflow_dispatch:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - .github/workflows/arc3-kaggle-machine-auth-probe.yml

permissions:
  contents: read

jobs:
  kaggle-auth-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe binding without exposing credentials
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          token=bool(os.environ.get('KAGGLE_API_TOKEN'))
          user=bool(os.environ.get('KAGGLE_USERNAME'))
          key=bool(os.environ.get('KAGGLE_KEY'))
          mode='KAGGLE_API_TOKEN' if token else ('KAGGLE_USERNAME_KEY' if user and key else 'ABSENT')
          d={'schema':'deus/kaggle-machine-auth-probe/1','credential_values_exposed':False,'kaggle_api_token_bound':token,'kaggle_username_bound':user,'kaggle_key_bound':key,'usable_standard_binding_mode':mode,'network_query_attempted':False,'submission_attempted':False,'submission_quota_spent':False}
          open('kaggle-machine-auth-probe.json','w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'usable_standard_binding_mode':mode,'credential_values_exposed':False,'submission_quota_spent':False},sort_keys=True))
          PY
      - name: Read-only Kaggle API check when binding exists
        run: |
          set -euo pipefail
          mode=$(python -c "import json;print(json.load(open('kaggle-machine-auth-probe.json'))['usable_standard_binding_mode'])")
          if [ "$mode" = ABSENT ]; then
            echo 'No standard Kaggle machine credential binding; skipping network API call.'
            exit 0
          fi
          python -m pip install --quiet kaggle
          set +e
          kaggle competitions list -s arc-prize-2026-arc-agi-3 > kaggle-readonly.txt 2> kaggle-readonly.err
          rc=$?
          set -e
          python - "$rc" <<'PY'
          import json,sys
          p='kaggle-machine-auth-probe.json';d=json.load(open(p));d['network_query_attempted']=True;d['readonly_api_exit_code']=int(sys.argv[1]);d['readonly_api_success']=int(sys.argv[1])==0
          open(p,'w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'readonly_api_success':d['readonly_api_success'],'submission_quota_spent':False},sort_keys=True))
          PY
      - name: Upload auth probe receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-kaggle-machine-auth-probe
          path: |
            kaggle-machine-auth-probe.json
            kaggle-readonly.txt
            kaggle-readonly.err
          if-no-files-found: warn
          retention-days: 14
