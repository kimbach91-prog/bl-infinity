name: DEUS Machine Worker Trial Bot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deus-machine-worker-trial-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle-machine-message:
    if: github.event.issue.number == 182
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate offer/result and return machine receipt
        uses: actions/github-script@v7
        with:
          script: |
            const body = String(context.payload.comment?.body || "");
            const sender = String(context.payload.comment?.user?.login || "unknown");
            if (body.length > 12000) return;

            const m = body.match(/```json\s*([\s\S]*?)```/i);
            if (!m) return;

            let msg;
            try { msg = JSON.parse(m[1]); }
            catch {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: JSON.stringify({
                  schema: "deus-trial-error/1",
                  code: "INVALID_JSON",
                  source_comment_id: context.payload.comment.id
                }, null, 2)
              });
              return;
            }

            const forbiddenKeys = new Set([
              "password","passwd","private_key","privateKey","api_key","apiKey",
              "access_token","accessToken","refresh_token","refreshToken",
              "secret","credential","credentials","wallet_private_key"
            ]);
            const scan = (v) => {
              if (!v || typeof v !== "object") return false;
              for (const [k,val] of Object.entries(v)) {
                if (forbiddenKeys.has(k)) return true;
                if (typeof val === "object" && scan(val)) return true;
                if (typeof val === "string" && /-----BEGIN [A-Z ]*PRIVATE KEY-----/i.test(val)) return true;
              }
              return false;
            };
            if (scan(msg)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: JSON.stringify({
                  schema: "deus-trial-error/1",
                  code: "FORBIDDEN_SECRET_FIELD",
                  source_comment_id: context.payload.comment.id
                }, null, 2)
              });
              return;
            }

            const resourceClasses = new Set(["CPU","GPU","WEBGPU","LLM","CONTAINER","CI","WASM"]);
            const dataCeilings = new Set(["BL-S0","BL-S1"]);
            const settlements = new Set(["NO_SPEND","RESULT_SWAP","PUBLIC_BENEFIT","QUOTE_ONLY"]);

            const reply = async (payload) => {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: "\`\`\`json\\n" + JSON.stringify(payload, null, 2) + "\\n\`\`\`"
              });
            };

            if (msg.schema === "deus-worker-offer/1") {
              const errors = [];
              if (!/^[A-Za-z0-9._:-]{3,100}$/.test(String(msg.worker_id || ""))) errors.push("worker_id");
              if (!resourceClasses.has(msg.resource_class)) errors.push("resource_class");
              if (msg.owner_authorized !== true) errors.push("owner_authorized");
              if (msg.auto_trial_allowed !== true) errors.push("auto_trial_allowed");
              if (!dataCeilings.has(msg.data_ceiling)) errors.push("data_ceiling");
              if (!settlements.has(msg.settlement_class)) errors.push("settlement_class");
              const maxSeconds = Number(msg.max_trial_seconds);
              if (!Number.isFinite(maxSeconds) || maxSeconds < 1 || maxSeconds > 300) errors.push("max_trial_seconds");
              if (!Array.isArray(msg.capabilities) || msg.capabilities.length > 20) errors.push("capabilities");
              if (!msg.stop_condition || String(msg.stop_condition).length > 500) errors.push("stop_condition");

              if (errors.length) {
                await reply({
                  schema: "deus-trial-error/1",
                  code: "OFFER_HARD_GATE_FAILED",
                  invalid_fields: errors,
                  source_comment_id: context.payload.comment.id
                });
                return;
              }

              const mapping = {
                CPU: ["CANARY-A","INTEGER_EXACT","109992"],
                CONTAINER: ["CANARY-A","INTEGER_EXACT","109992"],
                CI: ["CANARY-A","INTEGER_EXACT","109992"],
                WASM: ["CANARY-A","INTEGER_EXACT","109992"],
                GPU: ["CANARY-C","INTEGER_EXACT","511370976"],
                WEBGPU: ["CANARY-C","INTEGER_EXACT","511370976"],
                LLM: ["CANARY-B","TEXT_EXACT","DEUS_PUBLIC_CANARY_OK"]
              };
              const [canaryId, verifier, expected] = mapping[msg.resource_class];
              const trialId = `TRIAL-${context.issue.number}-${context.payload.comment.id}`;

              await reply({
                schema: "deus-trial-contract/1",
                trial_id: trialId,
                worker_id: msg.worker_id,
                source_comment_id: context.payload.comment.id,
                source_actor: sender,
                canary_id: canaryId,
                verifier,
                expected_result: expected,
                data_class: "BL-S0",
                settlement_class: msg.settlement_class,
                max_trial_seconds: Math.min(maxSeconds, 300),
                authority_scope: "ONE_PUBLIC_SAFE_CANARY_ONLY",
                canonical_write: false,
                external_side_effects: false,
                stop_after_one_result: true,
                truth_boundary: "CONTRACT_ISSUED != CAPACITY_ADMITTED"
              });
              return;
            }

            if (msg.schema === "deus-worker-result/1") {
              const allowed = {
                "CANARY-A": "109992",
                "CANARY-B": "DEUS_PUBLIC_CANARY_OK",
                "CANARY-C": "511370976"
              };
              const expected = allowed[msg.canary_id];
              const errors = [];
              if (!/^TRIAL-182-[0-9]+$/.test(String(msg.trial_id || ""))) errors.push("trial_id");
              if (!/^[A-Za-z0-9._:-]{3,100}$/.test(String(msg.worker_id || ""))) errors.push("worker_id");
              if (!expected) errors.push("canary_id");
              if (msg.released !== true) errors.push("released");
              const elapsed = Number(msg.elapsed_ms);
              if (!Number.isFinite(elapsed) || elapsed < 0 || elapsed > 300000) errors.push("elapsed_ms");
              if (!msg.runtime_identity || String(msg.runtime_identity).length > 500) errors.push("runtime_identity");

              if (errors.length) {
                await reply({
                  schema: "deus-trial-error/1",
                  code: "RESULT_HARD_GATE_FAILED",
                  invalid_fields: errors,
                  source_comment_id: context.payload.comment.id
                });
                return;
              }

              const actual = String(msg.result).trim();
              const pass = actual === expected;
              await reply({
                schema: "deus-trial-receipt/1",
                receipt_id: `RCP-GH-${context.repo.repo}-182-${context.payload.comment.id}`,
                trial_id: msg.trial_id,
                worker_id: msg.worker_id,
                canary_id: msg.canary_id,
                result_verdict: pass ? "RESULT_VERIFIED_EXACT_SCOPE" : "RESULT_MISMATCH",
                expected_result: expected,
                observed_result: actual,
                elapsed_ms: elapsed,
                runtime_identity: String(msg.runtime_identity).slice(0,500),
                cost_or_non_cash_value: String(msg.cost_or_non_cash_value || "UNDECLARED").slice(0,200),
                released: true,
                capacity_credit: 0,
                authority_minted: false,
                sustained_capacity_proven: false,
                economic_yield_proven: false,
                source_comment_id: context.payload.comment.id,
                truth_boundary: "RESULT_VERIFIED != SUSTAINED_CAPACITY"
              });
              return;
            }
