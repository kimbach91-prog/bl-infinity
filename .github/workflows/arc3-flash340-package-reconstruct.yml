name: ARC3 Flash-Next 3.40 package reconstruction

on:
  push:
    branches: [deus/arc3-kaggle-rank-climb-20260921]
    paths:
      - .github/workflows/arc3-flash340-package-reconstruct.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct upstream full Kaggle package
        run: |
          set -euo pipefail
          ROOT="public_benchmark/arc3/kaggle_candidates/flash_next_340"
          TMP="/tmp/flashrepo"
          OUT="$GITHUB_WORKSPACE/flash340-full-package"
          mkdir -p "$TMP/scripts"
          cp "$ROOT/arc-agi-flash-next-mtp.ipynb" "$TMP/arc-agi-flash-next-mtp.ipynb"
          cp "$ROOT/upstream_build_flash_next_package.py" "$TMP/scripts/build_flash_next_package.py"
          cp "$ROOT/upstream_flash_teardown_patch.py" "$TMP/scripts/flash_teardown_patch.py"
          python "$TMP/scripts/build_flash_next_package.py" \
            --kernel-id deusplaceholder/arc-agi3-flash-next-mtp-full \
            --mode full \
            --output-dir "$OUT"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path('flash340-full-package')
          files=sorted(p.name for p in out.iterdir())
          nbs=list(out.glob('*.ipynb'))
          assert len(nbs)==1,(files,nbs)
          raw=nbs[0].read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          meta=json.loads((out/'kernel-metadata.json').read_text())
          rec={
            'schema':'deus/arc3-flash340-package-reconstruct/1',
            'notebook_file':nbs[0].name,
            'notebook_sha256':sha,
            'upstream_recorded_submitted_notebook_sha256':'6a141753f142ed0d683f34f9acb1ac732a6e333a193b2ad8612d66125e64d9d1',
            'matches_upstream_recorded_submitted_notebook':sha=='6a141753f142ed0d683f34f9acb1ac732a6e333a193b2ad8612d66125e64d9d1',
            'package_files':files,
            'kernel_id':meta.get('id'),
            'enable_gpu':meta.get('enable_gpu'),
            'enable_internet':meta.get('enable_internet'),
            'machine_shape':meta.get('machine_shape'),
            'competition_sources':meta.get('competition_sources'),
            'dataset_sources':meta.get('dataset_sources'),
            'model_sources':meta.get('model_sources'),
            'upstream_public_score':3.40,
            'deus_user_score_claim':False,
          }
          Path('flash340-package-receipt.json').write_text(json.dumps(rec,indent=2))
          print('FLASH340_PACKAGE_RECEIPT='+json.dumps(rec,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flash340-full-package
          path: |
            flash340-full-package/
            flash340-package-receipt.json
          retention-days: 30
