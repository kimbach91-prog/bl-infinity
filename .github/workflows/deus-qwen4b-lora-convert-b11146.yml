name: DEUS Qwen3-4B LoRA GGUF Convert b11146
on:
  pull_request:
    paths:
      - ".github/workflows/deus-qwen4b-lora-convert-b11146.yml"
permissions:
  contents: read
  actions: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DEUS repo
        uses: actions/checkout@v4
      - name: Download verified heldout-transfer artifact
        uses: actions/download-artifact@v4
        with:
          name: deus-qwen4b-heldout-transfer
          github-token: ${{ github.token }}
          run-id: 35972037226
          path: input
      - name: Checkout llama.cpp b11146
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: b11146
          path: llama.cpp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers safetensors numpy sentencepiece
      - name: Convert adapter with pinned converter
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER_DIR="$(dirname "$(find input -name adapter_config.json -print -quit)")"
          test -f "$ADAPTER_DIR/adapter_model.safetensors"
          mkdir -p output
          INPUT_SHA="$(sha256sum "$ADAPTER_DIR/adapter_model.safetensors" | awk '{print $1}')"
          test "$INPUT_SHA" = "aab38a5fe45404cca38413533c5ff30d610116ce04f3d3b929436aabd4c7538c"
          python llama.cpp/convert_lora_to_gguf.py             --outtype f16             --base-model-id Qwen/Qwen3-4B             --outfile output/deus-qwen3-4b-heldout-lora-f16.gguf             "$ADAPTER_DIR"
          test -s output/deus-qwen3-4b-heldout-lora-f16.gguf
          GGUF_SHA="$(sha256sum output/deus-qwen3-4b-heldout-lora-f16.gguf | awk '{print $1}')"
          GGUF_BYTES="$(stat -c %s output/deus-qwen3-4b-heldout-lora-f16.gguf)"
          python - <<PY
          import json
          from pathlib import Path
          r = {
            "schema": "deus-qwen4b-lora-gguf-conversion/1",
            "source_run": 35972037226,
            "source_adapter_sha256": "$INPUT_SHA",
            "converter_repo": "ggml-org/llama.cpp",
            "converter_ref": "b11146",
            "converter_script_sha": "47c09af53fb5075efd63485cc1fd389226aaa42c",
            "base_model_id": "Qwen/Qwen3-4B",
            "outtype": "f16",
            "gguf_sha256": "$GGUF_SHA",
            "gguf_bytes": int("$GGUF_BYTES"),
            "status": "PASS",
          }
          Path("output/conversion-receipt.json").write_text(json.dumps(r, indent=2), encoding="utf-8")
          print(json.dumps(r, separators=(",", ":")))
          PY
          cp input/receipt.json output/heldout-receipt.json
      - name: Upload converted adapter
        uses: actions/upload-artifact@v4
        with:
          name: deus-qwen4b-lora-gguf-b11146
          path: output
          if-no-files-found: error
