name: DEUS Cloud Receptor

on:
  push:
    branches:
      - main
    paths:
      - '.deus/dispatch/inbox/**'

permissions:
  contents: read
  issues: write

jobs:
  receptor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Read packet and emit durable ACK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          packet="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^.deus/dispatch/inbox/' | head -n1 || true)"
          [[ -n "$packet" && -f "$packet" ]] || { echo 'No packet found' >&2; exit 1; }

          task_id="$(sed -nE 's/^TASK_ID:[[:space:]]*([A-Za-z0-9._:-]{1,100})[[:space:]]*$/\1/p' "$packet" | head -n1)"
          mode="$(sed -nE 's/^MODE:[[:space:]]*([A-Z0-9_]{1,40})[[:space:]]*$/\1/p' "$packet" | head -n1)"
          [[ -n "$task_id" && -n "$mode" ]] || { echo 'Invalid packet schema' >&2; exit 1; }

          cat > /tmp/deus-return.md <<EOF
          ACK: CLOUD_RECEPTOR_READ
          TASK_ID: $task_id
          MODE: $mode
          STATUS: ACKED
          RUN_ID: $GITHUB_RUN_ID
          PACKET: $packet
          CANONICAL_WRITE: DENIED
          NODE_LEVEL_ACK: NOT_CLAIMED
          EOF

          gh issue create --repo "$REPO" --title "[DEUS-RETURN][ACK] $task_id" --body-file /tmp/deus-return.md
