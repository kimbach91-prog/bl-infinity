name: ARC3 FT09 repaired Markov lens world-model 247
on:
  push:
    branches: [deus/arc-r246-markov-worldmodel-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_markov_lens_worldmodel_247.py
      - .github/workflows/arc3-ft09-markov-lens-worldmodel-247.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python -m py_compile public_ft09_markov_lens_worldmodel_246.py public_ft09_markov_lens_worldmodel_247.py
      - name: Download pinned public FT09 traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'; game='ft09-0d8bbf25'
          for p in $(seq 0 19); do f="${game}_p${p}_events.jsonl"; curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"; test -s "public_trace/$f"; done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute R247
        run: |
          set -uo pipefail
          args=(); for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/public_benchmark/arc3/kaggle_candidates" python public_benchmark/arc3/kaggle_candidates/public_ft09_markov_lens_worldmodel_247.py "${args[@]}" --output r247-ft09-markov-worldmodel.json > r247-exec.log 2>&1
          rc=$?; echo "$rc" > r247-exit-code.txt; cat r247-exec.log; exit "$rc"
      - name: Verify truth boundary
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r247-ft09-markov-worldmodel.json'))
          assert d['schema']=='deus/arc3-ft09-markov-lens-worldmodel/2'
          t=d['truth']
          assert t['source_free_game_runtime'] and t['selection_uses_p0_p9_only'] and t['heldout_never_updates_adapter']
          assert t['p10_p19_reused_public_development'] and not t['independent_generalization_claim']
          assert not t['kaggle_execution'] and not t['competition_submission'] and not t['leaderboard_score_claim'] and not t['submission_quota_spent']
          print(json.dumps({'chosen':d['selection']['chosen'],'adapter':d['frozen_adapter'],'held':d['reused_public_development_p10_p19']['metrics'],'gate':d['reused_public_development_p10_p19']['strict_zero_wrong_gain_vs_r225']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-r247-ft09-markov-lens-worldmodel
          path: |
            r247-ft09-markov-worldmodel.json
            r247-exec.log
            r247-exit-code.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
