name: ARC3 vc33 L5 best-first alternative

on:
  push:
    branches: [deus/arc3-vc33-rule-probe-20260920]
    paths: [.github/workflows/arc3-vc33-rule-l5-bestfirst.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bestfirst:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Best-first search L5 using live-derived controls
        run: |
          python - <<'PY'
          import copy,hashlib,heapq,json,logging,os,time,itertools
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.CRITICAL)
          L3_PATH=[0,2,0,2,0,4,2,0,4,2,0,4,2,0,6,6,6,6,6,6,6,6,6]
          L4_PATH=[3,3,0,3,3,3,4,4,6,4,1,6,4,6,4,6,4,6,4,6,4]
          def fr(o):return np.asarray(o.frame[-1],dtype=np.uint8)
          def norm(o):
              a=fr(o).copy()
              if a.shape[0]>=4:a[0,:]=0;a[-1,:]=0
              return a
          def key(o):return hashlib.sha256(norm(o).tobytes()).hexdigest()
          def comps(a,color,lo=1,hi=256):
              m=(a==color);H,W=a.shape;seen=np.zeros_like(m,bool);out=[]
              for y in range(H):
                for x in range(W):
                  if not m[y,x] or seen[y,x]:continue
                  st=[(x,y)];seen[y,x]=1;pts=[]
                  while st:
                    xx,yy=st.pop();pts.append((xx,yy))
                    for nx,ny in ((xx+1,yy),(xx-1,yy),(xx,yy+1),(xx,yy-1)):
                      if 0<=nx<W and 0<=ny<H and m[ny,nx] and not seen[ny,nx]:
                        seen[ny,nx]=1;st.append((nx,ny))
                  if lo<=len(pts)<=hi:
                    xs=[p[0] for p in pts];ys=[p[1] for p in pts]
                    out.append({'area':len(pts),'bbox':[min(xs),min(ys),max(xs),max(ys)],
                                'center':[int(round(sum(xs)/len(xs))),int(round(sum(ys)/len(ys)))]})
              return sorted(out,key=lambda z:(z['bbox'][0],z['bbox'][1],z['area']))
          def brown(o):return sorted(comps(fr(o),9,4,32),key=lambda z:(z['bbox'][0],z['bbox'][1]))
          def anchors(o):
              z=[]
              for c in comps(fr(o),1,8,128):
                if c['bbox'][1]>2 and c['bbox'][3]<61:z.append({'center':c['center'],'bbox':c['bbox'],'area':c['area']})
              return sorted(z,key=lambda b:(b['center'][0],b['center'][1]))
          def cands(o,A):
              a=fr(o);z=[]
              for i,b in enumerate(A):
                x,y=b['center'];z.append({'kind':'blue','anchor':i,'color':int(a[y,x]),'center':[x,y]})
              for b in brown(o):z.append({'kind':'brown','center':b['center']})
              return z
          def click(e,o,xy):
              am={a.value:a for a in e.action_space};return e.step(am[6],data={'x':int(xy[0]),'y':int(xy[1])})
          def prefix(e):
              o=e.observation_space;b=brown(o);t=max(b,key=lambda z:z['center'][1])['center']
              for _ in range(3):
                o=click(e,o,t)
                if int(o.levels_completed)>=1:break
              b=brown(o);cs=[x['center'] for x in b];F=cs[3];E=cs[1]
              for r in ['F','F','F','E','F','E','F']:
                o=click(e,o,F if r=='F' else E)
                if int(o.levels_completed)>=2:break
              for idx in L3_PATH:
                b=brown(o);o=click(e,o,b[idx]['center'])
                if int(o.levels_completed)>=3:break
              A4=anchors(o)
              for idx in L4_PATH:
                cc=cands(o,A4);o=click(e,o,cc[idx]['center'])
                if int(o.levels_completed)>=4:break
              if int(o.levels_completed)<4:raise RuntimeError('PREFIX_FAIL')
              return o
          def heuristic(o,path,bc,A):
              active=sum(1 for c in cands(o,A) if c['kind']=='blue' and c['color']!=1)
              # Public prior = five effective blue activations, ~44 total actions.
              return len(path)+5.0*max(0,5-bc)-1.5*active

          n=arc_agi.Arcade(operation_mode=OperationMode.NORMAL);e=n.make('vc33',seed=0,save_recording=False,include_frame_data=True)
          if e is None:raise RuntimeError('ENV')
          o=prefix(e);A=anchors(o)
          if len(A)<3:raise RuntimeError('ANCHORS:'+json.dumps(A))
          counter=itertools.count();h0=key(o);seen={(h0,0):0}
          heap=[(heuristic(o,[],0,A),next(counter),copy.deepcopy(e),o,[],0)]
          found=None;exp=0;t0=time.monotonic();maxq=1
          while heap and exp<450000 and time.monotonic()-t0<900:
              _,_,ee,oo,path,bc=heapq.heappop(heap)
              if len(path)>=60:continue
              cc=cands(oo,A)
              order=sorted(range(len(cc)),key=lambda i:(0 if cc[i]['kind']=='blue' and cc[i]['color']!=1 else 1 if cc[i]['kind']=='brown' else 2,i))
              for idx in order:
                cand=cc[idx];e2=copy.deepcopy(ee);nf=click(e2,oo,cand['center']);exp+=1
                if nf is None:continue
                k=key(nf)
                if k==key(oo):continue
                nbc=bc+(1 if cand['kind']=='blue' else 0)
                if nbc>5:continue
                item={'idx':idx,'kind':cand['kind'],'anchor':cand.get('anchor'),'color_before':cand.get('color')}
                p=path+[item]
                if int(nf.levels_completed)>=5:
                  found=p;heap=[];break
                sk=(k,nbc)
                if len(p)>=seen.get(sk,10**9):continue
                seen[sk]=len(p)
                heapq.heappush(heap,(heuristic(nf,p,nbc,A),next(counter),e2,nf,p,nbc));maxq=max(maxq,len(heap))
          search={'expansions':exp,'seen':len(seen),'seconds':time.monotonic()-t0,'max_queue':maxq,'path':found,
                  'path_len':None if found is None else len(found),'blue_acts':None if found is None else sum(z['kind']=='blue' for z in found),
                  'anchors':A}
          print('VC33_L5_BESTFIRST_SEARCH='+json.dumps(search,separators=(',',':')))
          if found is None:raise RuntimeError('NO_PATH')

          oa=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          src='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/blob/'+os.environ['GITHUB_SHA']+'/.github/workflows/arc3-vc33-rule-l5-bestfirst.yml'
          cid=oa.open_scorecard(source_url=src,tags=['DEUS','vc33','l5-bestfirst','observation-derived'])
          oe=oa.make('vc33',seed=0,scorecard_id=cid,save_recording=False,include_frame_data=True);oo=prefix(oe);AO=anchors(oo);tr=[]
          for step,item in enumerate(found,1):
            cc=cands(oo,AO);idx=item['idx']
            if idx>=len(cc):raise RuntimeError('INDEX')
            cand=cc[idx];before=fr(oo);oo=click(oe,oo,cand['center']);after=fr(oo)
            tr.append({'step':step,'idx':idx,'cand':cand,'changed':int(np.count_nonzero(before!=after)),'level':int(oo.levels_completed)})
            if int(oo.levels_completed)>=5:break
          card=oa.close_scorecard(cid);passed=int(oo.levels_completed)>=5
          rec={'result':'PASS' if passed else 'FAIL','game':'vc33','levels_completed':int(oo.levels_completed),
               'scorecard_id':cid,'scorecard_score':None if card is None else card.score,'search':search,'trace':tr,
               'protocol':'PUBLIC_OBSERVATION_DERIVED_L5_BESTFIRST','external_full_route_used':False,'external_l5_coordinates_used':False,
               'game_source_inspected_by_solver':False,'hidden_state_read':False,'public_rule_prior':'5 blue activations, ~44 action difficulty',
               'competition_hidden_score_claim':False,'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA']}
          out=Path('verification');out.mkdir();(out/'receipt.json').write_text(json.dumps(rec,indent=2))
          print('VC33_L5_BESTFIRST_RECEIPT='+json.dumps(rec,separators=(',',':')))
          if not passed:raise RuntimeError('ONLINE_FAIL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vc33-l5-bestfirst
          path: verification/
          retention-days: 30
