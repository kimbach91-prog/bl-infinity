name: ARC3 ft09 source-compiled animation FSM 240

on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_animation_fsm_240.py
      - .github/workflows/arc3-ft09-source-compiled-animation-fsm-240.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-ft09-animation-fsm:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compile-only public runtime
        run: python -m pip install --disable-pip-version-check --quiet 'arcengine==0.9.3'
      - name: Compile harnesses
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_ft09_compiled_observation_mechanism_234.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_nonnode_noop_239.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_animation_fsm_240.py
      - name: Fetch pinned source and public traces
        run: |
          set -euo pipefail
          mkdir -p source public_trace
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/axobase001/arc-agi-games/41b87fe1ea8d9819a44eea35172ffe28d6c5ffe6/ft09/0d8bbf25/ft09.py' \
            -o source/ft09.py
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          game='ft09-0d8bbf25'
          for p in $(seq 0 19); do
            f="${game}_p${p}_events.jsonl"
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum source/ft09.py > source/SHA256SUMS.txt
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Compile base manifest and temporal animation spec
        run: |
          set -euo pipefail
          PYTHONPATH=public_benchmark/arc3/kaggle_candidates \
          python public_benchmark/arc3/kaggle_candidates/public_ft09_compiled_observation_mechanism_234.py \
            compile --source source/ft09.py --output r240-ft09-base-manifest.json
          PYTHONPATH=public_benchmark/arc3/kaggle_candidates \
          python public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_animation_fsm_240.py \
            compile --source source/ft09.py --base-manifest r240-ft09-base-manifest.json --output r240-ft09-manifest.json
      - name: Delete source and create clean inference venv
        run: |
          set -euo pipefail
          rm -f source/ft09.py
          test ! -e source/ft09.py
          python -m venv cleanenv
          cleanenv/bin/python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_ft09_compiled_observation_mechanism_234.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_nonnode_noop_239.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_animation_fsm_240.py
          set +e
          cleanenv/bin/python - <<'PY'
          try:
              import arcengine
          except ModuleNotFoundError:
              print('CLEAN_INFERENCE_ARCENGINE_ABSENT')
              raise SystemExit(0)
          raise SystemExit('clean inference venv unexpectedly has arcengine')
          PY
          test "$?" -eq 0
      - name: Execute source-free R240 temporal evaluation
        run: |
          set -euo pipefail
          test ! -e source/ft09.py
          args=()
          for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          PYTHONPATH=public_benchmark/arc3/kaggle_candidates \
          cleanenv/bin/python public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_animation_fsm_240.py \
            evaluate --manifest r240-ft09-manifest.json "${args[@]}" --output r240-ft09-source-compiled-animation-fsm.json
      - name: Verify truth boundary
        run: |
          cleanenv/bin/python - <<'PY'
          import json
          d=json.load(open('r240-ft09-source-compiled-animation-fsm.json'))
          assert d['schema']=='deus/arc3-ft09-source-compiled-animation-fsm/1'
          t=d['truth']
          assert t['animation_source_removed_before_evaluation'] is True
          assert t['non_mouse_actions_fail_closed'] is True
          assert t['independent_generalization_claim'] is False
          assert t['competition_submission'] is False
          assert d['decision']['solver_promotion'] is False
          print(json.dumps({
            'aggregate':d['aggregate'],
            'incremental':{k:v for k,v in d['incremental'].items() if k!='examples'},
            'branches':d['branches'],'abstain_reasons':d['abstain_reasons'],
            'non_mouse_action_names':d['non_mouse_action_names'],
            'gate':d['source_assisted_zero_wrong_gain_gate_pass'],
            'wrong':d['wrong_examples'],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r240-ft09-source-compiled-animation-fsm
          path: |
            r240-ft09-manifest.json
            r240-ft09-source-compiled-animation-fsm.json
            source/SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
