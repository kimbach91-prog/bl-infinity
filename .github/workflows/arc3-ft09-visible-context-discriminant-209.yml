name: ARC3 ft09 visible-context discriminant 209

on:
  push:
    branches:
      - deus/arc3-remaining14-coverage-20260922
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_visible_context_discriminant_209.py
      - .github/workflows/arc3-ft09-visible-context-discriminant-209.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-ft09-discriminants:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile             public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py             public_benchmark/arc3/kaggle_candidates/public_v5_canonical_patch_router_191.py             public_benchmark/arc3/kaggle_candidates/public_ft09_macro_neighbor_rule_207.py             public_benchmark/arc3/kaggle_candidates/public_ft09_visible_context_discriminant_209.py
      - name: Download exact ft09 p0..p19 public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          game='ft09-0d8bbf25'
          for p in $(seq 0 19); do
            f="${game}_p${p}_events.jsonl"
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute visible-context discriminant search
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_ft09_visible_context_discriminant_209.py             "${args[@]}" --output r209-ft09-visible-context-discriminant.json
      - name: Enforce truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r209-ft09-visible-context-discriminant.json'))
          assert d['schema']=='deus/arc3-ft09-visible-context-discriminant-search/1'
          t=d['truth']
          assert t['iterative_public_heldout_research'] is True
          assert t['family_search_uses_public_heldout_metrics'] is True
          assert t['independent_generalization_claim'] is False
          assert t['heldout_never_updates_fitted_tables'] is True
          assert t['kaggle_execution'] is False
          assert d['promotion']['solver_promotion'] is False
          print(json.dumps({'best':d['diagnostic_best'],'ranking':d['diagnostic_ranking'][:8]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r209-ft09-visible-context-discriminant
          path: |
            r209-ft09-visible-context-discriminant.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
