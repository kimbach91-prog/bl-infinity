name: ARC3 R283 lp85 masked-world delta diagnostic
on:
  push:
    branches: [deus/r278-object-region-phase-diagnostic-20260923]
    paths:
      - .github/workflows/arc3-r283-lp85-masked-world-delta.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r283-lp85:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify mechanism source revision and stage exact lp85 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 18d09a5320870187ac73f0c2de27c04538eb8c41^{commit}
          git merge-base --is-ancestor 18d09a5320870187ac73f0c2de27c04538eb8c41 HEAD
          mkdir -p public_trace
          for p in $(seq 0 9); do
            f="lp85-305b61c3_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/$f" "public_trace/$f"
          done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 10
          ! find public_trace -maxdepth 1 -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Compile
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py \
            public_benchmark/arc3/kaggle_candidates/public_ui_mask_markov_diag_268.py \
            public_benchmark/arc3/kaggle_candidates/public_action_canonical_topology_diag_275.py \
            public_benchmark/arc3/kaggle_candidates/public_object_region_phase_diag_278.py \
            public_benchmark/arc3/kaggle_candidates/public_lp85_masked_world_delta_283.py
      - name: Execute p0-p4 fit p5-p9 masked-world diagnostic
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in $(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_lp85_masked_world_delta_283.py \
            "${args[@]}" --output r283-lp85-masked-world.json \
            2> >(tee r283-runtime.txt >&2) | tee r283-stdout.txt
      - name: Truth-boundary audit and hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r283-lp85-masked-world.json'))
          assert d['schema']=='deus/arc3-r283-lp85-masked-world-delta/1'
          assert d['protocol']['fit']=='p0-p4 only'
          assert d['protocol']['diagnostic']=='p5-p9 only'
          assert d['protocol']['p10_p19_staged_or_read'] is False
          assert d['protocol']['full_frame_claim'] is False
          assert d['protocol']['exact_baseline_precedence'] is True
          assert d['truth']['p10_p19_read'] is False
          assert d['truth']['kaggle_execution'] is False
          assert d['truth']['competition_submission'] is False
          print(json.dumps({'verdict':d['verdict'],'fit':d['fit'],'diagnostic':d['diagnostic']},sort_keys=True))
          PY
          sha256sum r283-lp85-masked-world.json r283-runtime.txt r283-stdout.txt public_trace/SHA256SUMS.txt > R283_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r283-lp85-masked-world-delta
          path: |
            r283-lp85-masked-world.json
            r283-runtime.txt
            r283-stdout.txt
            R283_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
