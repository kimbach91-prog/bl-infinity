name: DIGE V8 C32 Dermal Hair Refinement

on:
  pull_request:
    paths:
      - '.github/workflows/dige-v8-c18-mature-convergence.yml'
      - 'experiments/dige-v8-executor-capsule/blender_render_v8.py'
      - 'experiments/dige-v8-executor-capsule/build_gnm_head_c28.py'
      - 'experiments/dige-v8-executor-capsule/DIGE_CANON_EXECUTION_MANIFEST.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: dige-v8-c32-dermal-hair-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  c32-finalist:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Pin exact head
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "APPROVED_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"

      - name: Resolve Blender 5.2.2
        run: |
          set -euxo pipefail
          ROOT=https://download.blender.org/release/Blender5.2
          TAR=blender-5.2.2-linux-x64.tar.xz
          curl -fL --retry 4 --retry-delay 3 "$ROOT/$TAR" -o "/tmp/$TAR"
          curl -fL --retry 4 --retry-delay 3 "$ROOT/blender-5.2.2.sha256" -o /tmp/blender.sha256
          grep " $TAR$" /tmp/blender.sha256 > /tmp/blender.expected
          (cd /tmp && sha256sum -c blender.expected)
          tar -xf "/tmp/$TAR" -C /tmp
          BLENDER=/tmp/blender-5.2.2-linux-x64/blender
          "$BLENDER" --version
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"

      - name: Pin mature MPFB2 material runtime
        run: |
          set -euxo pipefail
          MPFB_COMMIT=b58176c661a9680294eb75f127842cb8378e4974
          rm -rf /tmp/mpfb2
          git init /tmp/mpfb2
          git -C /tmp/mpfb2 remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C /tmp/mpfb2 fetch --depth=1 origin "$MPFB_COMMIT"
          git -C /tmp/mpfb2 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/mpfb2 rev-parse HEAD)" = "$MPFB_COMMIT"
          test -s /tmp/mpfb2/src/mpfb/data/node_trees/enhanced_skin.json
          test -s /tmp/mpfb2/src/mpfb/data/node_trees/procedural_eyes.json

      - name: Pin Google GNM high-fidelity head
        run: |
          set -euxo pipefail
          GNM_COMMIT=a424b5153eec9154f3dfa5ee7f214e5817918d54
          rm -rf /tmp/GNM
          git init /tmp/GNM
          git -C /tmp/GNM remote add origin https://github.com/google/GNM.git
          git -C /tmp/GNM fetch --depth=1 origin "$GNM_COMMIT"
          git -C /tmp/GNM checkout --detach FETCH_HEAD
          test "$(git -C /tmp/GNM rev-parse HEAD)" = "$GNM_COMMIT"
          test -s /tmp/GNM/LICENSE
          test -s /tmp/GNM/gnm/shape/gnm_numpy.py
          test -s /tmp/GNM/gnm/shape/data/versions/v3/head/gnm_head_v3.npz || true
          python -m pip install --disable-pip-version-check -q numpy scipy absl-py etils immutabledict importlib-resources opt-einsum typeguard
          python -m pip install --disable-pip-version-check -q tensorflow
          python -m pip install --disable-pip-version-check -q --no-deps -e /tmp/GNM/gnm/shape
          python - <<'PY'
          import tensorflow as tf
          from gnm.shape import semantic_sampler
          print("tensorflow", tf.__version__)
          print("semantic_identity_decoder", semantic_sampler.IdentitySampler().explain_classes())
          PY

      - name: Build stable MakeHuman body
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          mkdir -p runtime/assets runtime/system_assets
          python build_makehuman_v8.py | tee runtime/c31_body_geometry_execution.json
          test -s runtime/DIGE_V8_GEOMETRY_MANIFEST.json

      - name: Build deterministic GNM head
        working-directory: experiments/dige-v8-executor-capsule
        env:
          DIGE_GNM_COMMIT: a424b5153eec9154f3dfa5ee7f214e5817918d54
          DIGE_GNM_IDENTITY_SEED: '20263030'
          DIGE_GNM_IDENTITY_SIGMA: '0.34'
          DIGE_GNM_SEMANTIC_IDENTITY: '1'
        run: |
          set -euxo pipefail
          python build_gnm_head_c28.py | tee runtime/c31_gnm_build.log
          test -s runtime/gnm_c28/DIGE_C28_GNM_HEAD_MANIFEST.json
          test -s runtime/gnm_c28/gnm_skin.obj

      - name: Reuse verified mature assets
        uses: actions/download-artifact@v4
        with:
          name: DIGE-C18-MATURE-ASSETS
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: kimbach91-prog/bl-infinity
          run-id: 35503442060
          path: experiments/dige-v8-executor-capsule/runtime

      - name: Verify staged assets
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          echo "e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf  runtime/assets/young_eurasian_female_diffuse.png" | sha256sum -c -
          echo "4a9fc385718f2c46fb328ab99d33e3a946cecdb717987c8b324cf2466b59bd9c  runtime/system_assets/short03.obj" | sha256sum -c -
          echo "d80bbb8fd9b06721c481756fb3e1d6dce04fcfc9ca8a379edd4ea3c0d81ed17f  runtime/system_assets/short03.mhclo" | sha256sum -c -
          echo "fe6ed0bb14498a48a2e8fc07e80e2a6f62c8b67686fcd0a7a570d345faec97da  runtime/system_assets/short03_diffuse.png" | sha256sum -c -
          mkdir -p runtime/assets/c25_mpfb
          cp runtime/assets/young_eurasian_female_diffuse.png runtime/assets/c25_mpfb/young_eurasian_female_diffuse.png
          cat > runtime/assets/c25_mpfb/c25_skin.mhmat <<'EOF'
          name c25_mpfb_enhanced_skin
          diffuseColor 1.0 1.0 1.0
          diffuseTexture young_eurasian_female_diffuse.png
          EOF

      - name: Render C32 dermal-hair finalist
        working-directory: experiments/dige-v8-executor-capsule
        env:
          DIGE_CYCLES_DEVICE: CPU
          DIGE_RENDER_SET: HERO_ONLY
          DIGE_OUTPUT_TAG: c32_gnm_dermal_hair
          DIGE_C18_HYBRID_BULK: '1'
          DIGE_C19_HUMANIZATION: '0'
          DIGE_C19_PHOTO_LIGHTING: '0'
          DIGE_C20_VISUAL_REPAIR: '0'
          DIGE_C21_NATURAL_DETAIL: '0'
          DIGE_C22_PHYSICAL_SKIN: '0'
          DIGE_C22_LANDMARK_GROOM: '0'
          DIGE_C22_HAIR_MASS_WARP: '0'
          DIGE_C23_CALIBRATED_EYES: '0'
          DIGE_C23_FACE_PLANES: '0'
          DIGE_C23_HAIRLINE_REPAIR: '0'
          DIGE_C24_SURFACE_EYES: '0'
          DIGE_C24_SOURCE_ALBEDO: '0'
          DIGE_C24_HAIRLINE_REPAIR: '0'
          DIGE_C25_MATURE_STACK: '1'
          DIGE_C25_GROOM_CLIP: '0'
          DIGE_C26_PHOTOMETRIC: '1'
          DIGE_C26_SAFE_GROOM: '0'
          DIGE_C26_FIBER_GROOM: '0'
          DIGE_C27_SURFACE_FIBERS: '0'
          DIGE_C27_NATIVE_INTERFACES: '0'
          DIGE_C28_GNM_HEAD: '1'
          DIGE_C28_GNM_DIR: runtime/gnm_c28
          DIGE_C28_HEAD_SCALE_BIAS: '1.00'
          DIGE_C28_HEAD_Z_OFFSET: '0.000'
          DIGE_C29_GNM_PRESENTATION: '1'
          DIGE_C30_GNM_SEMANTIC_IDENTITY: '1'
          DIGE_C31_GNM_FACE_APPEARANCE: '1'
          DIGE_C32_GNM_DERMAL_HAIR: '1'
          DIGE_GNM_COMMIT: a424b5153eec9154f3dfa5ee7f214e5817918d54
          DIGE_MPFB2_SRC: /tmp/mpfb2/src
          DIGE_MPFB2_COMMIT: b58176c661a9680294eb75f127842cb8378e4974
          DIGE_C25_MHMAT_PATH: runtime/assets/c25_mpfb/c25_skin.mhmat
          DIGE_HAIR_ASSET_KEY: hair_short03
          DIGE_HAIR_STRANDS_PER_ROOT: '28'
          DIGE_HAIR_ACCENT_LENGTH_SCALE: '0.92'
          DIGE_HAIR_FRONT_SAFE_BLEND: '0.92'
          DIGE_SKIN_ALBEDO_PATH: runtime/assets/young_eurasian_female_diffuse.png
          DIGE_SKIN_ALBEDO_SHA256: e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf
          DIGE_SKIN_ALBEDO_NAME: onlytheghosts_young_eurasian_female
          DIGE_SKIN_SSS_WEIGHT: '0.045'
          DIGE_SKIN_SSS_SCALE: '0.0009'
          DIGE_SKIN_ROUGH_MIN: '0.44'
          DIGE_SKIN_ROUGH_MAX: '0.62'
          DIGE_SKIN_ALBEDO_SAT: '1.00'
          DIGE_SKIN_ALBEDO_VALUE: '1.00'
          DIGE_EYE_TEX_SAT: '0.78'
          DIGE_EYE_TEX_VALUE: '0.64'
          DIGE_HAIR_TEX_SAT: '0.56'
          DIGE_HAIR_TEX_VALUE: '0.23'
          DIGE_FACE_MESO_SCALE: '1.00'
          DIGE_SKIN_TONE_R: '0.60'
          DIGE_SKIN_TONE_G: '0.33'
          DIGE_SKIN_TONE_B: '0.22'
          DIGE_SKIN_TONE_MIX: '0.08'
          DIGE_SKIN_MICRO_STRENGTH: '0.20'
          DIGE_SKIN_MESO_FREQ: '95'
          DIGE_SKIN_PORE_FREQ: '2800'
          DIGE_SKIN_MICRO_FREQ: '9000'
          DIGE_SKIN_BUMP_DISTANCE: '0.000055'
          DIGE_SKIN_COAT_WEIGHT: '0.001'
          DIGE_SKIN_COAT_ROUGHNESS: '0.45'
          DIGE_SAMPLES_PREVIEW: '48'
          DIGE_SAMPLES_HERO: '384'
          DIGE_RENDER_SEED: '20263030'
          DIGE_RUNTIME_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python blender_render_v8.py | tee runtime/c32_gnm_dermal_hair.log

      - name: Verify C32 receipt
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, pathlib, os
          root=pathlib.Path("runtime/renders/c32_gnm_dermal_hair")
          r=json.loads((root/"DIGE_V8_RENDER_RECEIPT.json").read_text())
          assert r["runtime_commit"]==os.environ["APPROVED_SHA"]
          assert r["render_set"]=="HERO_ONLY"
          assert r["appearance_candidate"]=="C32_GNM_DERMAL_HAIR_REFINEMENT_V1"
          g=r["c28_gnm_head"]
          assert g["enabled"] is True
          assert g["source_repo"]=="google/GNM"
          assert g["source_commit"]=="a424b5153eec9154f3dfa5ee7f214e5817918d54"
          assert g["license"]=="Apache-2.0"
          assert "skin" in g["components"]
          assert g["brow_fibers"] >= 140
          assert g["lash_fibers"] >= 50
          assert g["hairline_fibers"] >= 60
          assert g["hairline_warp_vertices"] > 0
          assert g["c29_presentation"] is True
          assert g["c29_calibrated_iris_count"] == 2
          assert g["identity_source"]=="SEMANTIC_CVAE"
          assert g["semantic_identity_enabled"] is True
          assert g["semantic_gender"]=="FEMALE"
          assert g["semantic_ethnicity"]=="ASIAN"
          assert r["hair_surface_contract"]["mass_mesh_rendered"] is False
          assert r["appearance_selection"]["c29_gnm_presentation"] is True
          assert r["appearance_selection"]["c29_bulk_hair_hidden"] is True
          assert r["appearance_selection"]["c29_calibrated_iris_count"] == 2
          assert r["appearance_selection"]["c30_gnm_semantic_identity"] is True
          assert r["appearance_selection"]["c30_identity_source"]=="SEMANTIC_CVAE"
          assert r["appearance_selection"]["c30_semantic_gender"]=="FEMALE"
          assert r["appearance_selection"]["c30_semantic_ethnicity"]=="ASIAN"
          assert g["c31_face_appearance"] is True
          assert g["c31_mask_vertex_count"] >= 12000
          assert g["c31_wetline_count"] == 2
          assert g["c31_mouth_gap_count"] == 1
          assert g["skin_contract"]["model"]=="C32_GNM_DERMAL_MULTISCALE_SKIN"
          assert r["appearance_selection"]["c31_gnm_face_appearance"] is True
          assert r["appearance_selection"]["c32_gnm_dermal_hair"] is True
          assert r["hair_surface_contract"]["style"]=="C32_GNM_DERMAL_FIBER_GROOM_V1"
          assert r["hair_surface_contract"]["curve_count"] >= 24000
          assert r["hair_surface_contract"]["points_per_curve"] == 12
          assert r["hair_surface_contract"]["root_radius_m"] < 0.00005
          assert r["appearance_selection"]["c31_mask_vertex_count"] >= 12000
          assert r["appearance_selection"]["c31_wetline_count"] == 2
          assert r["appearance_selection"]["c31_mouth_gap_count"] == 1
          assert len(r["outputs"])==1 and r["outputs"][0]["sha256"]
          assert r["denoise_ab"]["raw_aov"]["sha256"]
          assert r["denoise_ab"]["denoised"]["sha256"]
          assert r["evidence_boundary"]["hyperreal_certified"] is False
          summary={
            "schema":"DIGE_C32_GNM_DERMAL_HAIR_RECEIPT_V1",
            "approved_sha":os.environ["APPROVED_SHA"],
            "hero_sha256":r["outputs"][0]["sha256"],
            "denoised_sha256":r["denoise_ab"]["denoised"]["sha256"],
            "c28_gnm_head":g,
            "skin_model":r["skin_model"],
            "hair_surface_contract":r["hair_surface_contract"],
            "claim_ceiling":"C32_EXECUTED; HUMAN_VISUAL_AUDIT_REQUIRED; HYPERREAL_NOT_YET_CERTIFIED"
          }
          (root/"DIGE_C32_SUMMARY.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Upload C32 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DIGE-C32-DERMAL-HAIR-${{ github.event.pull_request.head.sha }}
          path: |
            experiments/dige-v8-executor-capsule/runtime/renders/c32_gnm_dermal_hair/*.png
            experiments/dige-v8-executor-capsule/runtime/renders/c32_gnm_dermal_hair/*.exr
            experiments/dige-v8-executor-capsule/runtime/renders/c32_gnm_dermal_hair/*.json
            experiments/dige-v8-executor-capsule/runtime/gnm_c28/*.json
            experiments/dige-v8-executor-capsule/runtime/c32_gnm_dermal_hair.log
            experiments/dige-v8-executor-capsule/runtime/c31_gnm_build.log
          if-no-files-found: error
          retention-days: 14
