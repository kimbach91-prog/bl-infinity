name: DIGE V8 C27 Official Anatomy Finalist

on:
  pull_request:
    paths:
      - '.github/workflows/dige-v8-c18-mature-convergence.yml'
      - 'experiments/dige-v8-executor-capsule/blender_render_v8.py'
      - 'experiments/dige-v8-executor-capsule/DIGE_CANON_EXECUTION_MANIFEST.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: dige-v8-c27-anatomy-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  c27-finalist:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Pin exact head
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "APPROVED_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"

      - name: Resolve Blender 5.2.2
        run: |
          set -euxo pipefail
          ROOT=https://download.blender.org/release/Blender5.2
          TAR=blender-5.2.2-linux-x64.tar.xz
          curl -fL --retry 4 --retry-delay 3 "$ROOT/$TAR" -o "/tmp/$TAR"
          curl -fL --retry 4 --retry-delay 3 "$ROOT/blender-5.2.2.sha256" -o /tmp/blender.sha256
          grep " $TAR$" /tmp/blender.sha256 > /tmp/blender.expected
          (cd /tmp && sha256sum -c blender.expected)
          tar -xf "/tmp/$TAR" -C /tmp
          BLENDER=/tmp/blender-5.2.2-linux-x64/blender
          "$BLENDER" --version
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"

      - name: Pin mature MPFB2 material runtime
        run: |
          set -euxo pipefail
          MPFB_COMMIT=b58176c661a9680294eb75f127842cb8378e4974
          rm -rf /tmp/mpfb2
          git init /tmp/mpfb2
          git -C /tmp/mpfb2 remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C /tmp/mpfb2 fetch --depth=1 origin "$MPFB_COMMIT"
          git -C /tmp/mpfb2 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/mpfb2 rev-parse HEAD)" = "$MPFB_COMMIT"
          test -s /tmp/mpfb2/src/mpfb/data/node_trees/enhanced_skin.json
          test -s /tmp/mpfb2/src/mpfb/data/node_trees/procedural_eyes.json
          test -s /tmp/mpfb2/src/mpfb/data/settings/enhanced_settings.default.json
          test -s /tmp/mpfb2/src/mpfb/data/settings/eye_settings.default.json

      - name: Pin official MakeHuman modeling targets
        run: |
          set -euxo pipefail
          MH_COMMIT=a8bc2d54ff0ac92e78ff71431b1023eda42bf482
          rm -rf /tmp/makehuman
          git init /tmp/makehuman
          git -C /tmp/makehuman remote add origin https://github.com/makehumancommunity/makehuman.git
          git -C /tmp/makehuman fetch --depth=1 origin "$MH_COMMIT"
          git -C /tmp/makehuman checkout --detach FETCH_HEAD
          test "$(git -C /tmp/makehuman rev-parse HEAD)" = "$MH_COMMIT"
          test -s /tmp/makehuman/makehuman/data/modifiers/modeling_modifiers.json
          test -d /tmp/makehuman/makehuman/data/targets

      - name: Build C27 official-anatomy geometry
        working-directory: experiments/dige-v8-executor-capsule
        env:
          DIGE_C27_OFFICIAL_ANATOMY: '1'
          DIGE_C27_MAKEHUMAN_DATA: /tmp/makehuman/makehuman/data
          DIGE_C27_MAKEHUMAN_COMMIT: a8bc2d54ff0ac92e78ff71431b1023eda42bf482
        run: |
          set -euxo pipefail
          mkdir -p runtime/assets runtime/system_assets
          python build_makehuman_v8.py | tee runtime/c27_geometry_execution.json
          test -s runtime/DIGE_V8_GEOMETRY_MANIFEST.json

      - name: Reuse verified C18 mature asset stage
        uses: actions/download-artifact@v4
        with:
          name: DIGE-C18-MATURE-ASSETS
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: kimbach91-prog/bl-infinity
          run-id: 35503442060
          path: experiments/dige-v8-executor-capsule/runtime

      - name: Verify staged mature assets
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          echo "e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf  runtime/assets/young_eurasian_female_diffuse.png" | sha256sum -c -
          echo "4a9fc385718f2c46fb328ab99d33e3a946cecdb717987c8b324cf2466b59bd9c  runtime/system_assets/short03.obj" | sha256sum -c -
          echo "d80bbb8fd9b06721c481756fb3e1d6dce04fcfc9ca8a379edd4ea3c0d81ed17f  runtime/system_assets/short03.mhclo" | sha256sum -c -
          echo "fe6ed0bb14498a48a2e8fc07e80e2a6f62c8b67686fcd0a7a570d345faec97da  runtime/system_assets/short03_diffuse.png" | sha256sum -c -

          mkdir -p runtime/assets/c25_mpfb
          cp runtime/assets/young_eurasian_female_diffuse.png runtime/assets/c25_mpfb/young_eurasian_female_diffuse.png
          cat > runtime/assets/c25_mpfb/c25_skin.mhmat <<'EOF'
          name c25_mpfb_enhanced_skin
          diffuseColor 1.0 1.0 1.0
          diffuseTexture young_eurasian_female_diffuse.png
          EOF
          test -s runtime/assets/c25_mpfb/c25_skin.mhmat

      - name: Render C27 official-anatomy finalist
        working-directory: experiments/dige-v8-executor-capsule
        env:
          DIGE_CYCLES_DEVICE: CPU
          DIGE_RENDER_SET: HERO_ONLY
          DIGE_OUTPUT_TAG: c27_anatomy
          DIGE_C18_HYBRID_BULK: '1'
          DIGE_C19_HUMANIZATION: '0'
          DIGE_C19_PHOTO_LIGHTING: '0'
          DIGE_C20_VISUAL_REPAIR: '0'
          DIGE_C21_NATURAL_DETAIL: '0'
          DIGE_C22_PHYSICAL_SKIN: '0'
          DIGE_C22_LANDMARK_GROOM: '0'
          DIGE_C22_HAIR_MASS_WARP: '0'
          DIGE_C23_CALIBRATED_EYES: '0'
          DIGE_C23_FACE_PLANES: '0'
          DIGE_C23_HAIRLINE_REPAIR: '0'
          DIGE_C24_SURFACE_EYES: '0'
          DIGE_C24_SOURCE_ALBEDO: '0'
          DIGE_C24_HAIRLINE_REPAIR: '0'
          DIGE_C25_MATURE_STACK: '1'
          DIGE_C25_GROOM_CLIP: '0'
          DIGE_C26_PHOTOMETRIC: '1'
          DIGE_C26_SAFE_GROOM: '1'
          DIGE_C26_FIBER_GROOM: '1'
          DIGE_C27_OFFICIAL_ANATOMY: '1'
          DIGE_C27_MAKEHUMAN_DATA: /tmp/makehuman/makehuman/data
          DIGE_C27_MAKEHUMAN_COMMIT: a8bc2d54ff0ac92e78ff71431b1023eda42bf482
          DIGE_C27_SURFACE_FIBERS: '1'
          DIGE_C27_NATIVE_INTERFACES: '1'
          DIGE_MPFB2_SRC: /tmp/mpfb2/src
          DIGE_MPFB2_COMMIT: b58176c661a9680294eb75f127842cb8378e4974
          DIGE_C25_MHMAT_PATH: runtime/assets/c25_mpfb/c25_skin.mhmat
          DIGE_HAIR_ASSET_KEY: hair_short03
          DIGE_HAIR_STRANDS_PER_ROOT: '18'
          DIGE_HAIR_ACCENT_LENGTH_SCALE: '0.72'
          DIGE_HAIR_FRONT_SAFE_BLEND: '0.96'
          DIGE_C19_HAIRLINE_CENTER_Z: '1.600'
          DIGE_C19_HAIRLINE_TEMPLE_RISE: '0.08'
          DIGE_SKIN_ALBEDO_PATH: runtime/assets/young_eurasian_female_diffuse.png
          DIGE_SKIN_ALBEDO_SHA256: e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf
          DIGE_SKIN_ALBEDO_NAME: onlytheghosts_young_eurasian_female
          DIGE_SKIN_SSS_WEIGHT: '0.045'
          DIGE_SKIN_SSS_SCALE: '0.0009'
          DIGE_SKIN_ROUGH_MIN: '0.44'
          DIGE_SKIN_ROUGH_MAX: '0.62'
          DIGE_SKIN_ALBEDO_SAT: '1.00'
          DIGE_SKIN_ALBEDO_VALUE: '1.00'
          DIGE_EYE_TEX_SAT: '0.78'
          DIGE_EYE_TEX_VALUE: '0.64'
          DIGE_HAIR_TEX_SAT: '0.56'
          DIGE_HAIR_TEX_VALUE: '0.23'
          DIGE_FACE_MESO_SCALE: '1.00'
          DIGE_SKIN_TONE_R: '0.60'
          DIGE_SKIN_TONE_G: '0.33'
          DIGE_SKIN_TONE_B: '0.22'
          DIGE_SKIN_TONE_MIX: '0.08'
          DIGE_SKIN_MICRO_STRENGTH: '0.20'
          DIGE_SKIN_MESO_FREQ: '95'
          DIGE_SKIN_PORE_FREQ: '2800'
          DIGE_SKIN_MICRO_FREQ: '9000'
          DIGE_SKIN_BUMP_DISTANCE: '0.000055'
          DIGE_SKIN_COAT_WEIGHT: '0.001'
          DIGE_SKIN_COAT_ROUGHNESS: '0.45'
          DIGE_SAMPLES_PREVIEW: '64'
          DIGE_SAMPLES_HERO: '384'
          DIGE_RENDER_SEED: '20260920'
          DIGE_RUNTIME_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python blender_render_v8.py | tee runtime/c27_anatomy.log

      - name: Verify C27 receipt
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, pathlib, os
          root=pathlib.Path("runtime/renders/c27_anatomy")
          r=json.loads((root/"DIGE_V8_RENDER_RECEIPT.json").read_text())
          assert r["runtime_commit"]==os.environ["APPROVED_SHA"]
          assert r["render_set"]=="HERO_ONLY"
          assert r["appearance_candidate"]=="C27_OFFICIAL_ANATOMY_SURFACE_FIBERS_V1"
          h=r["hair_surface_contract"]
          assert h["style"]=="C27_OFFICIAL_ANATOMY_SURFACE_FIBERS_V1"
          assert h["mass_mesh_rendered"] is True
          assert h["curve_count"] >= 5000
          assert r["hair_curve_metrics"]["guide_mesh_rendered"] is True
          assert r["render_curve_shape"]=="CYLINDER"
          assert len(r["outputs"])==1 and r["outputs"][0]["sha256"]
          assert r["denoise_ab"]["raw_aov"]["sha256"]
          assert r["denoise_ab"]["denoised"]["sha256"]
          assert r["evidence_boundary"]["hyperreal_certified"] is False
          summary={
            "schema":"DIGE_C27_OFFICIAL_ANATOMY_RECEIPT_V1",
            "approved_sha":os.environ["APPROVED_SHA"],
            "hero_sha256":r["outputs"][0]["sha256"],
            "denoised_sha256":r["denoise_ab"]["denoised"]["sha256"],
            "hair_surface_contract":h,
            "hair_curve_metrics":r["hair_curve_metrics"],
            "skin_model":r["skin_model"],
            "appearance_selection":r["appearance_selection"],
            "c24_surface_eyes":r["appearance_selection"].get("c24_surface_eyes"),
            "c24_source_albedo":r["appearance_selection"].get("c24_source_albedo"),
            "c24_hairline_repair":r["appearance_selection"].get("c24_hairline_repair"),
            "c24_eye_count":r["appearance_selection"].get("c24_eye_count"),
            "c24_lid_curve_count":r["appearance_selection"].get("c24_lid_curve_count"),
            "c24_hairline_warp_vertices":r["appearance_selection"].get("c24_hairline_warp_vertices"),
            "c23_calibrated_eyes":r["appearance_selection"].get("c23_calibrated_eyes"),
            "c23_eye_count":r["appearance_selection"].get("c23_eye_count"),
            "c23_face_planes":r["appearance_selection"].get("c23_face_planes"),
            "c23_hairline_repair":r["appearance_selection"].get("c23_hairline_repair"),
            "c23_hairline_warp_vertices":r["appearance_selection"].get("c23_hairline_warp_vertices"),
            "c23_brow_fibers":r["appearance_selection"].get("c23_brow_fibers"),
            "c23_lash_fibers":r["appearance_selection"].get("c23_lash_fibers"),
            "c23_hairline_fibers":r["appearance_selection"].get("c23_hairline_fibers"),
            "c22_physical_skin":r["appearance_selection"].get("c22_physical_skin"),
            "c22_skin_coordinate_space":r["appearance_selection"].get("c22_skin_coordinate_space"),
            "c22_landmark_groom":r["appearance_selection"].get("c22_landmark_groom"),
            "c22_hair_mass_warp":r["appearance_selection"].get("c22_hair_mass_warp"),
            "c22_hair_mass_warp_vertices":r["appearance_selection"].get("c22_hair_mass_warp_vertices"),
            "c22_brow_fibers":r["appearance_selection"].get("c22_brow_fibers"),
            "c22_lash_fibers":r["appearance_selection"].get("c22_lash_fibers"),
            "c22_lid_margin_curves":r["appearance_selection"].get("c22_lid_margin_curves"),
            "c25_mature_stack":r["appearance_selection"].get("c25_mature_stack"),
            "c25_mpfb2_commit":r["appearance_selection"].get("c25_mpfb2_commit"),
            "c25_mpfb_skin":r["appearance_selection"].get("c25_mpfb_skin"),
            "c25_mpfb_eyes":r["appearance_selection"].get("c25_mpfb_eyes"),
            "c25_removed_fringe_faces":r["appearance_selection"].get("c25_removed_fringe_faces"),
            "c25_hairline_warp_vertices":r["appearance_selection"].get("c25_hairline_warp_vertices"),
            "c26_photometric":r["appearance_selection"].get("c26_photometric"),
            "c26_safe_groom":r["appearance_selection"].get("c26_safe_groom"),
            "c26_fiber_groom":r["appearance_selection"].get("c26_fiber_groom"),
            "c26_fringe_clear_vertices":r["appearance_selection"].get("c26_fringe_clear_vertices"),
            "c26_hairline_warp_vertices":r["appearance_selection"].get("c26_hairline_warp_vertices"),
            "c26_brow_fibers":r["appearance_selection"].get("c26_brow_fibers"),
            "c26_lash_fibers":r["appearance_selection"].get("c26_lash_fibers"),
            "c26_exposure":r["appearance_selection"].get("c26_exposure"),
            "c27_surface_fibers":r["appearance_selection"].get("c27_surface_fibers"),
            "c27_native_interfaces":r["appearance_selection"].get("c27_native_interfaces"),
            "c27_official_anatomy":r["appearance_selection"].get("c27_official_anatomy"),
            "claim_ceiling":"C27_EXECUTED; HUMAN_VISUAL_AUDIT_REQUIRED; HYPERREAL_NOT_YET_CERTIFIED"
          }
          assert summary["c25_mature_stack"] is True
          assert summary["c25_mpfb2_commit"]=="b58176c661a9680294eb75f127842cb8378e4974"
          assert summary["c25_mpfb_skin"]["enabled"] is True
          assert summary["c25_mpfb_skin"]["material_model"]=="ENHANCED_SSS"
          assert summary["c25_mpfb_eyes"]["enabled"] is True
          assert summary["c25_mpfb_eyes"]["material_model"]=="PROCEDURAL_EYES"
          assert r["appearance_selection"]["c25_removed_fringe_faces"] == 0
          assert r["appearance_selection"]["c26_photometric"] is True
          assert r["appearance_selection"]["c26_safe_groom"] is True
          assert r["appearance_selection"]["c26_fiber_groom"] is True
          assert r["appearance_selection"]["c26_fringe_clear_vertices"] > 0
          assert r["appearance_selection"]["c26_hairline_warp_vertices"] > 0
          assert r["appearance_selection"]["c26_brow_fibers"] >= 140
          assert r["appearance_selection"]["c26_lash_fibers"] >= 50
          assert r["appearance_selection"]["c26_exposure"] == -0.62
          assert r["skin_model"]["subsurface_method"]=="MPFB2_ENHANCED_SSS"
          assert summary["c27_surface_fibers"] is True
          assert summary["c27_native_interfaces"] is True
          anatomy=summary["c27_official_anatomy"]
          assert anatomy["enabled"] is True
          assert anatomy["makehuman_commit"]=="a8bc2d54ff0ac92e78ff71431b1023eda42bf482"
          assert len(anatomy["targets"]) >= 16
          assert all(t["active_components"] and t["modified_vertices"] > 0 for t in anatomy["targets"])
          (root/"DIGE_C27_SUMMARY.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Upload C27 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DIGE-C27-ANATOMY-${{ github.event.pull_request.head.sha }}
          path: |
            experiments/dige-v8-executor-capsule/runtime/renders/c27_anatomy/*.png
            experiments/dige-v8-executor-capsule/runtime/renders/c27_anatomy/*.exr
            experiments/dige-v8-executor-capsule/runtime/renders/c27_anatomy/*.json
            experiments/dige-v8-executor-capsule/runtime/c27_anatomy.log
          if-no-files-found: error
          retention-days: 14
