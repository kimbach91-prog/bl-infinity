name: ARC3 public world overlay decomposition audit 171
on:
  push:
    branches: [deus/arc3-kaggle-rank-climb-20260921]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py
      - public_benchmark/arc3/kaggle_candidates/public_dense_scroll_renderer_audit_167.py
      - public_benchmark/arc3/kaggle_candidates/public_world_overlay_decomposition_audit_171.py
      - .github/workflows/arc3-public-world-overlay-decomposition-audit-171.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py public_benchmark/arc3/kaggle_candidates/public_dense_scroll_renderer_audit_167.py public_benchmark/arc3/kaggle_candidates/public_world_overlay_decomposition_audit_171.py
      - name: Download exact pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in ar25-0c556536_p0_events.jsonl ar25-0c556536_p10_events.jsonl ar25-0c556536_p11_events.jsonl; do curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"; test -s "public_trace/$f"; done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute audit
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_world_overlay_decomposition_audit_171.py --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" --output "$GITHUB_WORKSPACE/world-overlay-public-171.json"
      - name: Enforce truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('world-overlay-public-171.json'))
          assert d['rung']==171 and d['truth']['outcome_assisted_analysis'] is True
          assert d['truth']['preoutcome_prediction_made'] is False and d['truth']['submission_quota_spent'] is False
          print(json.dumps({'rung':171,'gate':d['diagnostic_gate'],'aggregate':d['aggregate'],'per_action':d['per_action'],'recommendation':d['recommendation']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-public-world-overlay-decomposition-audit-171
          path: |
            world-overlay-public-171.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
