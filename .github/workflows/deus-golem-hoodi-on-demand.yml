name: DEUS Golem Hoodi On-Demand Canary

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: deus-golem-hoodi-on-demand
  cancel-in-progress: false

jobs:
  golem-hoodi-canary:
    if: >
      github.event.issue.number == 182 &&
      github.actor == 'kimbach91-prog' &&
      contains(github.event.comment.body, '"schema": "deus-golem-requestor-canary/1"') &&
      contains(github.event.comment.body, '"owner_authorized": true') &&
      contains(github.event.comment.body, '"real_money_spend_authorized": false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YAGNA_AUTOCONF_APPKEY: try_golem
      YAGNA_APPKEY: try_golem
    steps:
      - uses: actions/checkout@v4

      - name: Mark stage install
        run: echo "INSTALL_OFFICIAL_GOLEM_NODE_0_17" > /tmp/deus-golem-stage.txt

      - name: Install current official Yagna binary package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-deps --index-url https://test.pypi.org/simple 'golem-node==0.17.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v yagna
          yagna --version | tee /tmp/yagna-version.txt
          grep -Eq 'yagna 0\.17\.0' /tmp/yagna-version.txt

      - name: Mark stage yagna
        run: echo "START_YAGNA" > /tmp/deus-golem-stage.txt

      - name: Start Yagna requestor
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          nohup yagna service run >/tmp/yagna.log 2>&1 &
          echo $! >/tmp/yagna.pid
          for i in $(seq 1 45); do
            if yagna app-key list >/tmp/appkeys.txt 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 80 /tmp/yagna.log || true
          exit 1

      - name: Mark stage testnet funds
        run: echo "INIT_HOODI_TESTNET" > /tmp/deus-golem-stage.txt

      - name: Initialize Hoodi and obtain testnet tGLM
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.yagna/bin:$PATH"
          timeout 120s yagna payment fund >/tmp/payment-fund.log 2>&1
          yagna payment status --network=hoodi --driver=erc20 >/tmp/payment-status.log 2>&1
          grep -Ei 'hoodi|tGLM|GLM|total amount|amount' /tmp/payment-status.log | head -n 30 || cat /tmp/payment-status.log

      - name: Mark stage client
        run: echo "INSTALL_TASK_EXECUTOR" > /tmp/deus-golem-stage.txt

      - name: Install task executor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/deus-golem-canary
          mkdir -p /tmp/deus-golem-canary
          cd /tmp/deus-golem-canary
          npm init -y >/dev/null
          npm install --no-audit --no-fund @golem-sdk/task-executor @golem-sdk/pino-logger
          cp "$GITHUB_WORKSPACE/public-compute/golem-testnet-canary.mjs" ./canary.mjs

      - name: Mark stage provider
        run: echo "MATCH_PROVIDER_AND_EXECUTE" > /tmp/deus-golem-stage.txt

      - name: Match Golem provider and execute CANARY-A
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/deus-golem-canary
          timeout 240s node ./canary.mjs 2>&1 | tee /tmp/deus-golem-canary.log
          grep -q '"exact_match":true' /tmp/deus-golem-canary.log
          grep -q '"payment_network":"hoodi"' /tmp/deus-golem-canary.log
          grep -q '"real_money_spend_authorized":false' /tmp/deus-golem-canary.log

      - name: Post verified provider receipt
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const receipt = JSON.parse(fs.readFileSync("/tmp/deus-golem-receipt.json", "utf8"));
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: 182,
              body: "\`\`\`json\\n" + JSON.stringify({
                schema: "deus-external-route-receipt/1",
                route_id: "GOLEM-HOODI-TESTNET",
                source_workflow: "DEUS Golem Hoodi On-Demand Canary",
                source_comment_id: context.payload.comment.id,
                github_run_id: context.runId,
                receipt,
                capacity_credit: 0,
                economic_yield_proven: false,
                mainnet_capacity_proven: false,
                truth_boundary: "TESTNET_RESULT_VERIFIED != MAINNET_CAPACITY_OR_ECONOMIC_YIELD"
              }, null, 2) + "\\n\`\`\`"
            });

      - name: Post bounded blocker
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const stage = fs.existsSync("/tmp/deus-golem-stage.txt")
              ? fs.readFileSync("/tmp/deus-golem-stage.txt","utf8").trim()
              : "UNKNOWN_STAGE";
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: 182,
              body: "\`\`\`json\\n" + JSON.stringify({
                schema: "deus-external-route-blocker/1",
                route_id: "GOLEM-HOODI-TESTNET",
                source_workflow: "DEUS Golem Hoodi On-Demand Canary",
                source_comment_id: context.payload.comment.id,
                github_run_id: context.runId,
                failed_stage: stage,
                verdict: "RUNTIME_CANARY_FAILED_BEFORE_VERIFIED_RESULT",
                provider_rejection_proven: false,
                capacity_credit: 0,
                economic_yield_proven: false,
                next_gate: "core inspects this exact stage/run and repairs only the proven blocker"
              }, null, 2) + "\\n\`\`\`"
            });
