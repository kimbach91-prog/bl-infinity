name: ARC3 AR25 matrix frozen stress 181M

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ar25_onepath_frozen_pipeline_181m.py
      - .github/workflows/arc3-ar25-matrix-frozen-181m.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        path:
          - p0
          - p1
          - p2
          - p3
          - p4
          - p5
          - p6
          - p7
          - p8
          - p9
          - p10
          - p11
          - p12
          - p13
          - p14
          - p15
          - p16
          - p17
          - p18
          - p19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned AR25 trajectory
        run: |
          set -euo pipefail
          mkdir -p public_trace
          f="ar25-0c556536_${{ matrix.path }}_events.jsonl"
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts/$f" \
            -o "public_trace/$f"
          test -s "public_trace/$f"
      - name: Run frozen one-path evaluator
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_ar25_onepath_frozen_pipeline_181m.py \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_${{ matrix.path }}_events.jsonl" \
            --output "$GITHUB_WORKSPACE/r181m-${{ matrix.path }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: r181m-${{ matrix.path }}
          path: r181m-${{ matrix.path }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: path
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r181m-*
          path: results
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggregate all 20 frozen results
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,glob
          rows=[json.load(open(p)) for p in glob.glob('results/r181m-*.json')]
          assert len(rows)==20, len(rows)
          rows.sort(key=lambda x:int(x['path'][1:]))
          selection=[x for x in rows if x['split']=='selection']
          heldout=[x for x in rows if x['split']=='heldout_same_game']
          def agg(xs):
              keys=('opportunities','exact','wrong','near4','near16','cell_errors')
              d={k:sum(int(x.get(k,0)) for x in xs) for k in keys}
              d['accuracy']=round(d['exact']/d['opportunities'],6) if d['opportunities'] else None
              d['mean_cell_errors']=round(d['cell_errors']/d['opportunities'],3) if d['opportunities'] else None
              return d
          out={
            'schema':'deus/arc3-ar25-r181m-matrix/1',
            'rung':'181M',
            'architecture':{'stage1':'patch_recent1_s2','stage2':'local_s1','stage3':'component_s1','frozen_from_r180':True},
            'aggregate':{'selection':agg(selection),'heldout_same_game':agg(heldout),'all20':agg(rows),'per_path':rows},
            'truth':{'architecture_frozen_before_heldout':True,'heldout_not_used_for_selection':True,'online_state_reset_per_trajectory':True,'kaggle_execution':False,'submission_quota_spent':False}
          }
          open('r181m-aggregate.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'selection':out['aggregate']['selection'],'heldout':out['aggregate']['heldout_same_game'],'all20':out['aggregate']['all20'],'per_path':[{'path':x['path'],'exact':x['exact'],'opportunities':x['opportunities'],'accuracy':x['accuracy']} for x in rows]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-ar25-matrix-frozen-181m
          path: r181m-aggregate.json
          if-no-files-found: error
          retention-days: 30
