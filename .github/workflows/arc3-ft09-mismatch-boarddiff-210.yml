name: ARC3 ft09 mismatch boarddiff 210
on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_mismatch_boarddiff_210.py
      - .github/workflows/arc3-ft09-mismatch-boarddiff-210.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate-ft09-mismatch-boarddiff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py public_benchmark/arc3/kaggle_candidates/public_v5_canonical_patch_router_191.py public_benchmark/arc3/kaggle_candidates/public_ft09_macro_neighbor_rule_207.py public_benchmark/arc3/kaggle_candidates/public_ft09_mismatch_boarddiff_210.py
      - name: Download exact ft09 p0..p19 public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'; game='ft09-0d8bbf25'
          for p in $(seq 0 19); do f="${game}_p${p}_events.jsonl"; curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"; test -s "public_trace/$f"; done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute structural residual diagnostic
        run: |
          set -euo pipefail
          args=(); for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_ft09_mismatch_boarddiff_210.py "${args[@]}" --output r210-ft09-mismatch-boarddiff.json
      - name: Verify truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r210-ft09-mismatch-boarddiff.json'))
          assert d['schema']=='deus/arc3-ft09-mismatch-boarddiff/1'
          assert d['verdict']['base_mistakes_reproduced'] is True
          assert d['verdict']['diagnostic_only'] is True
          assert d['truth']['heldout_never_updates_model'] is True
          assert d['truth']['independent_generalization_claim'] is False
          assert d['truth']['kaggle_execution'] is False
          print(json.dumps({'mistake_count':d['mistake_count'],'verdict':d['verdict']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r210-ft09-mismatch-boarddiff
          path: |
            r210-ft09-mismatch-boarddiff.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
