name: DEUS Peerwave Anonymous S0 Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-peerwave-anon-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peerwave-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Anonymous S0 inference canary
        shell: bash
        run: |
          set -euo pipefail
          start_ms="$(date +%s%3N)"
          cat >/tmp/request.json <<'JSON'
          {
            "model":"cheapest",
            "messages":[
              {"role":"user","content":"Public S0 canary. Reply with exactly: DEUS_PEERWAVE_CANARY_OK"}
            ]
          }
          JSON

          code="$(curl --max-time 90 -sS -D /tmp/headers.txt -o /tmp/response.json -w '%{http_code}'             -X POST 'https://api.peerwave.ai/api/chat'             -H 'Content-Type: application/json'             --data-binary @/tmp/request.json)"
          end_ms="$(date +%s%3N)"

          cat /tmp/response.json
          echo
          test "$code" = "200"

          sha="$(sha256sum /tmp/response.json | awk '{print $1}')"
          body="$(cat /tmp/response.json)"
          exact="false"
          if printf '%s' "$body" | grep -Fq 'DEUS_PEERWAVE_CANARY_OK'; then exact="true"; fi

          jq -n             --arg provider "PEERWAVE"             --arg endpoint "https://api.peerwave.ai/api/chat"             --arg status "$code"             --arg digest "$sha"             --argjson latency_ms "$((end_ms-start_ms))"             --argjson exact "$exact"             '{
              receipt_version:"DEUS-PUBLIC-COMPUTE-CANARY/1",
              provider:$provider,
              auth_mode:"ANONYMOUS_NO_ACCOUNT_NO_API_KEY",
              data_class:"S0_SYNTHETIC_ONLY",
              endpoint:$endpoint,
              provider_execution:true,
              http_status:($status|tonumber),
              latency_ms:$latency_ms,
              response_digest:$digest,
              exact_contract:$exact,
              canonical_write:false,
              settlement:false,
              commercial_default:false,
              verdict:(if $exact then "PEERWAVE_ANON_EXECUTION_PASS" else "PEERWAVE_HTTP_PASS_SEMANTIC_CONTRACT_WEAK" end)
            }' | tee /tmp/peerwave-receipt.json

          test "$exact" = "true"
