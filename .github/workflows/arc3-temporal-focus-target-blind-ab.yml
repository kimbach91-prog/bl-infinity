name: ARC3 temporal-focus target-blind public-development A/B

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - 'public_benchmark/arc3/kaggle_candidates/temporal_focus_target_blind_ab.py'
      - '.github/workflows/arc3-temporal-focus-target-blind-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile repair harness
        run: |
          python -m py_compile \
            public_benchmark/arc3/harness/representation_granularity_guard.py \
            public_benchmark/arc3/harness/public_trace_temporal_state_audit.py \
            public_benchmark/arc3/kaggle_candidates/temporal_state_target_blind_ab.py \
            public_benchmark/arc3/kaggle_candidates/temporal_focus_target_blind_ab.py

      - name: Download pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in \
            ar25-0c556536_p0_events.jsonl \
            ar25-0c556536_p10_events.jsonl \
            ar25-0c556536_p11_events.jsonl
          do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt

      - name: Execute action-local focus same-model A/B
        shell: bash
        run: |
          set +e
          final_rc=2
          for attempt in 1 2 3
          do
            python public_benchmark/arc3/kaggle_candidates/temporal_focus_target_blind_ab.py \
              --input public_trace/ar25-0c556536_p0_events.jsonl \
              --input public_trace/ar25-0c556536_p10_events.jsonl \
              --input public_trace/ar25-0c556536_p11_events.jsonl \
              --max-cases 8 \
              --receipt temporal-focus-target-blind-ab.json
            rc=$?
            gate="$(jq -r '.promotion_gate // "MISSING"' temporal-focus-target-blind-ab.json 2>/dev/null)"
            echo "attempt=$attempt rc=$rc gate=$gate"
            if [ "$gate" != "INCONCLUSIVE_PROVIDER_CANARY_FAIL" ]; then
              final_rc=$rc
              break
            fi
            final_rc=$rc
            sleep $((attempt * 2))
          done
          exit "$final_rc"

      - name: Enforce truth boundary and emit summary
        shell: bash
        run: |
          test -s temporal-focus-target-blind-ab.json
          jq -e '
            .schema=="deus/arc3-temporal-focus-target-blind-ab/1"
            and .truth.public_trace_only==true
            and .truth.source_assisted_replay==false
            and .truth.target_blind_public_development_behavior==true
            and .truth.independent_generalization_claim==false
            and .truth.kaggle_submission_attempted==false
            and .truth.submission_quota_spent==false
            and .selection.target_used_for_case_selection==false
            and .selection.target_used_for_prompt==false
            and .repair_hypothesis.current_outcome_used_to_build_focus==false
            and .predeclared_policy.no_target_matching==true
          ' temporal-focus-target-blind-ab.json >/dev/null
          jq '{provider,requested_model,repair_hypothesis,selection,arms,promotion_gate,truth}' \
            temporal-focus-target-blind-ab.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-temporal-focus-target-blind-ab-receipt
          path: |
            temporal-focus-target-blind-ab.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on inconclusive execution
        shell: bash
        run: |
          gate="$(jq -r '.promotion_gate' temporal-focus-target-blind-ab.json)"
          case "$gate" in
            INCONCLUSIVE_*) exit 2 ;;
            *) exit 0 ;;
          esac
