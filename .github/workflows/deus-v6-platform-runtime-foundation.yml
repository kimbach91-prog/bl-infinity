name: DEUS V6 Platform Runtime Foundation
on:
  push:
    branches:
      - deus/v6-platform-runtime-foundation-v1-20260927
    paths:
      - 'platform-runtime-foundation/**'
      - '.github/workflows/deus-v6-platform-runtime-foundation.yml'
  pull_request:
    paths:
      - 'platform-runtime-foundation/**'
      - '.github/workflows/deus-v6-platform-runtime-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check platform-runtime-foundation/index.mjs
      - name: Runtime foundation invariants
        run: node --test platform-runtime-foundation/test.mjs
