name: Probe VNXF guest thread creation

on:
  push:
    paths:
      - '.github/workflows/forum-vn-vnxf-guest-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect guest post-thread form only
        run: |
          python - <<'PY'
          import re, requests
          from html import unescape
          base='https://vnxf.vn'
          paths=['/forums/kham-pha-ai.65/post-thread','/forums/kham-pha-ai.65/']
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; BL-Infinity-public-forum-probe/1.0)'})
          for p in paths:
              r=s.get(base+p,timeout=25,allow_redirects=True)
              print('\nPATH',p,'STATUS',r.status_code,'FINAL',r.url)
              text=r.text
              for needle in ['_xfToken','name="title"','name="message"','name="username"','guest','đăng nhập','login','post-thread']:
                  print(needle, needle.lower() in text.lower())
              m=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
              if m: print('TITLE',unescape(re.sub('<.*?>','',m.group(1))).strip())
              forms=re.findall(r'<form\b[^>]*action="([^"]+)"[^>]*>',text,re.I)
              print('FORMS',forms[:20])
              print('SNIP',re.sub(r'\s+',' ',text[:2500])[:2500])
          PY
