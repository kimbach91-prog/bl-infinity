name: ARC3 R310 lp85 temporal-context p10-p19
on:
  push:
    branches: [deus/r310-lp85-temporal-context-p10p19-20260923]
    paths:
      - .github/workflows/arc3-r310-lp85-temporal-context-p10p19.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 64}
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify frozen source ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e a6cafd5611b3ca9bba183d78f5e7604e582274fe^{commit}
          git merge-base --is-ancestor f28dd34c1e787df90d77e06083a5063bbc453e7e HEAD
          git merge-base --is-ancestor a6cafd5611b3ca9bba183d78f5e7604e582274fe HEAD
      - name: Stage exact p0-p4 and p10-p19 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p train eval
          for p in $(seq 0 4); do
            f="lp85-305b61c3_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "train/${f}"
          done
          for p in $(seq 10 19); do
            f="lp85-305b61c3_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "eval/${f}"
          done
          test "$(find train -type f -name '*_events.jsonl' | wc -l)" -eq 5
          test "$(find eval -type f -name '*_events.jsonl' | wc -l)" -eq 10
          ! find train eval -type f -regex '.*_p[5-9]_events.jsonl' | grep -q .
          sha256sum train/*.jsonl eval/*.jsonl > TRACE_SHA256SUMS.txt
      - name: Execute R310
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_lp85_temporal_context_p10p19_310.py
          trainargs=(); for f in $(find train -type f -name '*_events.jsonl' | sort -V); do trainargs+=(--train "$f"); done
          evalargs=(); for f in $(find eval -type f -name '*_events.jsonl' | sort -V); do evalargs+=(--eval "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_lp85_temporal_context_p10p19_310.py "${trainargs[@]}" "${evalargs[@]}" --output r310-lp85.json 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r310-lp85.json'))
          assert d['schema']=='deus/arc3-r310-lp85-temporal-context-p10p19/1'
          p=d['protocol']; f=d['frozen_mechanism']; t=d['truth']
          assert p['structural_fit']=='p0-p4 only' and p['p5_p9_used_for_fit'] is False
          assert p['evaluation']=='p10-p19 reused public development'
          assert not p['p10_p19_updates_selector'] and not p['p10_p19_updates_mechanism']
          assert f['freeze_source']=='f28dd34c1e787df90d77e06083a5063bbc453e7e'
          assert f['selection_changed_after_p5p9'] is False and f['selection_changed_after_p10p19'] is False
          assert t['reused_public_development_holdout'] and not t['solver_promotion']
          assert not t['kaggle_execution'] and not t['competition_submission']
          print(json.dumps({'verdict':d['verdict'],'evaluation_total':d['evaluation_total'],'delta':d['delta']},sort_keys=True))
          PY
          sha256sum r310-lp85.json runtime.txt stdout.txt TRACE_SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r310-lp85-temporal-context-p10p19
          path: |
            r310-lp85.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
            TRACE_SHA256SUMS.txt
          retention-days: 30
