name: ARC3 Tycho-KHUB offline contract audit

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - .github/workflows/arc3-tycho-khub-contract-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned Tycho and KHUB sources
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/NIMI-research/Tycho.git /tmp/tycho
          git -C /tmp/tycho checkout f68912a764372ead0a610db2e1c011d41ce5197e
          git clone https://github.com/khub-ai/arc-agi-3.git /tmp/khub
          git -C /tmp/khub checkout a9bb82a6f0223609724509175b294c02858e6c2c
          test "$(git -C /tmp/tycho rev-parse HEAD)" = "f68912a764372ead0a610db2e1c011d41ce5197e"
          test "$(git -C /tmp/khub rev-parse HEAD)" = "a9bb82a6f0223609724509175b294c02858e6c2c"

      - name: Execute source-contract audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, re
          tycho = pathlib.Path('/tmp/tycho/tycho/serving/public_backends.py').read_text()
          khub_path = pathlib.Path('/tmp/khub/usecases/arc-agi-3/submission/kaggle/serve_vlm.py')
          khub = khub_path.read_text()
          oracle = pathlib.Path('/tmp/khub/usecases/arc-agi-3/submission/qwen_oracle.py').read_text()

          # Shared transport/vision surface is real.
          endpoint_match = '/v1/chat/completions' in khub and 'chat/completions' in tycho
          vision_match = 'image_url' in khub and 'image_url' in tycho and 'data:image/png;base64' in tycho

          # Tycho's public transport is a structured tool protocol; its OpenAI paths
          # serialize tools and consume structured tool calls.
          tycho_requires_tools = all(x in tycho for x in ['"tools"', 'tool_calls'])

          # KHUB's minimal Kaggle shim intentionally accepts messages/image_url only.
          # It does not consume request tools and returns assistant content only.
          khub_accepts_tools = 'body.get("tools"' in khub or "body.get('tools'" in khub
          khub_returns_tool_calls = '"tool_calls"' in khub or "'tool_calls'" in khub
          direct_native_tool_contract = tycho_requires_tools and khub_accepts_tools and khub_returns_tool_calls

          # KHUB also has a competition-clean text-oracle seam, which is useful for
          # a representation adapter but is not equivalent to Tycho native tool calls.
          khub_text_oracle = 'call_oracle' in oracle and 'return res.get("text"' in oracle

          assert endpoint_match, 'chat endpoint mismatch'
          assert vision_match, 'vision payload mismatch'
          assert tycho_requires_tools, 'Tycho structured-tool protocol not detected'
          assert not khub_accepts_tools, 'KHUB shim unexpectedly changed to accept request tools'
          assert not khub_returns_tool_calls, 'KHUB shim unexpectedly changed to emit tool_calls'
          assert khub_text_oracle, 'KHUB text-oracle seam missing'

          receipt = {
            'schema': 'deus.arc3.tycho_khub_contract_audit.v1',
            'tycho_commit': 'f68912a764372ead0a610db2e1c011d41ce5197e',
            'khub_commit': 'a9bb82a6f0223609724509175b294c02858e6c2c',
            'transport_endpoint_match': endpoint_match,
            'vision_payload_match': vision_match,
            'tycho_structured_tool_protocol': tycho_requires_tools,
            'khub_kaggle_shim_accepts_request_tools': khub_accepts_tools,
            'khub_kaggle_shim_emits_openai_tool_calls': khub_returns_tool_calls,
            'direct_native_tool_contract_match': direct_native_tool_contract,
            'khub_text_oracle_seam_present': khub_text_oracle,
            'serve_vlm_sha256': hashlib.sha256(khub.encode()).hexdigest(),
            'tycho_public_backends_sha256': hashlib.sha256(tycho.encode()).hexdigest(),
            'verdict': 'DIRECT_WIRE_FALSE_REPRESENTATION_ADAPTER_REQUIRED',
            'repair_representation': 'Preserve KHUB offline VLM serving; translate Tycho tool schemas/results into a text/structured action protocol at the adapter seam, then parse back into Tycho tool_calls. Do not claim compatibility until GPU model output is validated.',
            'truth_scope': {
              'cpu_source_contract_verified': True,
              'gpu_model_behavior_verified': False,
              'kaggle_offline_execution_verified': False,
              'hidden_kaggle_score_claim': False,
              'owner_score_claim': False,
              'submission_attempted': False,
            },
          }
          out = pathlib.Path('public_benchmark/arc3/kaggle_candidates/tycho_khub_contract_audit_receipt.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: arc3-tycho-khub-contract-audit
          path: public_benchmark/arc3/kaggle_candidates/tycho_khub_contract_audit_receipt.json
          if-no-files-found: error
