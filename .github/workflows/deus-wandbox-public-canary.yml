name: DEUS Wandbox Public Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-wandbox-public-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wandbox-public-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute bounded public compile/run canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/deus-wandbox
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.request

          out = pathlib.Path('/tmp/deus-wandbox')
          token = 'DEUS_WANDBOX_CANARY_20260922_OK'

          t0 = time.time()
          with urllib.request.urlopen('https://wandbox.org/api/list.json', timeout=20) as r:
              catalog_status = r.status
              catalog_ct = r.headers.get('content-type', '')
              catalog_raw = r.read()
          catalog_ms = round((time.time() - t0) * 1000)
          catalog = json.loads(catalog_raw)
          candidates = [x for x in catalog if str(x.get('language','')).lower() in ('c++','cpp')]
          preferred = [x for x in candidates if x.get('name') == 'gcc-head']
          chosen = (preferred or candidates)[0]
          compiler = chosen['name']

          code = '#include <iostream>\nint main(){ long long x=1234567LL*89LL; std::cout << "' + token + ':" << x << "\\n"; }\n'
          request_obj = {'compiler': compiler, 'code': code, 'options': ''}
          req_raw = json.dumps(request_obj, separators=(',',':')).encode()
          req = urllib.request.Request(
              'https://wandbox.org/api/compile.json',
              data=req_raw,
              headers={'content-type':'application/json','user-agent':'DEUS-S0-public-canary/1.0'},
              method='POST')
          t1 = time.time()
          with urllib.request.urlopen(req, timeout=45) as r:
              http_status = r.status
              content_type = r.headers.get('content-type', '')
              headers_text = ''.join(f'{k}: {v}\n' for k,v in r.headers.items())
              body = r.read()
          latency_ms = round((time.time() - t1) * 1000)
          response = json.loads(body)
          program_text = str(response.get('program_message') or response.get('program_output') or '')
          api_status = response.get('status')
          exact = (token + ':' + str(1234567*89)) in program_text
          zero_status = str(api_status) == '0'

          (out/'catalog.json').write_bytes(catalog_raw)
          (out/'request.json').write_bytes(req_raw)
          (out/'headers.txt').write_text(headers_text)
          (out/'response.json').write_bytes(body)
          receipt = {
              'schema':'deus-wandbox-public-canary/1',
              'provider':'Wandbox',
              'scope':'BL-S0 public/synthetic compile-and-run',
              'catalog_http_status':catalog_status,
              'catalog_content_type':catalog_ct,
              'catalog_latency_ms':catalog_ms,
              'compiler':compiler,
              'http_status':http_status,
              'content_type':content_type,
              'provider_status':api_status,
              'latency_ms':latency_ms,
              'exact_contract':exact,
              'zero_exit_status':zero_status,
              'expected_output':token + ':' + str(1234567*89),
              'request_sha256':hashlib.sha256(req_raw).hexdigest(),
              'response_sha256':hashlib.sha256(body).hexdigest(),
              'catalog_sha256':hashlib.sha256(catalog_raw).hexdigest(),
              'incremental_spend_observed':0,
              'auth_used':False,
          }
          (out/'receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True))
          print(json.dumps(receipt, sort_keys=True))
          if http_status != 200 or not exact or not zero_status:
              raise SystemExit('Wandbox exact contract failed')
          PY
          sha256sum /tmp/deus-wandbox/* | tee /tmp/deus-wandbox/file-sha256.txt

      - name: Upload exact canary custody
        uses: actions/upload-artifact@v4
        with:
          name: deus-wandbox-public-canary
          path: /tmp/deus-wandbox/
          if-no-files-found: error
          retention-days: 7
