name: ARC3 public structured effect-geometry A/B 122

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - 'public_benchmark/arc3/kaggle_candidates/public_structured_effect_geometry_ab_v2.py'
      - '.github/workflows/arc3-public-structured-effect-geometry-ab-122.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-structured-effect-geometry-ab-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official ARC toolkit
        run: pip install --disable-pip-version-check 'arc-agi==0.9.9'
      - name: Compile representation-repaired A/B
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_multiframe_probe.py \
            public_benchmark/arc3/kaggle_candidates/animation_delta_signature.py \
            public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab_v3_identity.py \
            public_benchmark/arc3/kaggle_candidates/public_animation_action_ab.py \
            public_benchmark/arc3/kaggle_candidates/public_effect_memory_rollout_ab.py \
            public_benchmark/arc3/kaggle_candidates/public_structured_effect_geometry_ab.py \
            public_benchmark/arc3/kaggle_candidates/public_structured_effect_geometry_ab_v2.py
      - name: Execute exact-model representation-repaired A/B
        shell: bash
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_structured_effect_geometry_ab_v2.py --receipt "$GITHUB_WORKSPACE/public-structured-effect-geometry-ab-v2.json"
      - name: Enforce truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s public-structured-effect-geometry-ab-v2.json
          sha256sum public-structured-effect-geometry-ab-v2.json > RECEIPT_SHA256SUMS_122.txt
          jq -e '
            .schema=="deus/arc3-public-structured-effect-geometry-ab/2"
            and .repair_kind=="REPRESENTATION_AND_FIXED_BUDGET_CHANGE_NOT_CALL_RETRY"
            and .source_grounding.upstream_ref=="khub-ai/arc-agi-3@de41a93e3a4557db24702fceddb2409c7bc06afd"
            and .source_grounding.license=="MIT-0"
            and .source_grounding.clean_room_implementation==true
            and .truth.public_development_environment_only==true
            and .truth.same_exact_current_visible_frame_contract_between_arms==true
            and .truth.no_new_frame_is_explicit_not_zero_effect==true
            and .truth.last_visible_frame_carry_forward_is_shared_between_arms==true
            and .truth.same_served_model_contract==true
            and .truth.same_targets_probe_and_policy_budget==true
            and .truth.candidate_adds_visible_same_run_geometry_only==true
            and .truth.provider_call_retries==false
            and .truth.promotion_requires_solver_behavior_gain==true
            and .truth.efficiency_alone_cannot_promote_zero_gain==true
            and .truth.game_source_read==false
            and .truth.hidden_state_read==false
            and .truth.kaggle_data_read==false
            and .truth.kaggle_execution==false
            and .truth.kaggle_submission_attempted==false
            and .truth.submission_quota_spent==false
            and .truth.owner_score_claim==false
            and .truth.independent_generalization_claim==false
          ' public-structured-effect-geometry-ab-v2.json >/dev/null
          jq '{repair_of,repair_kind,source_grounding,summary,promotion_gate,inconclusive,truth}' public-structured-effect-geometry-ab-v2.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload behavior receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-structured-effect-geometry-ab-122
          path: |
            public-structured-effect-geometry-ab-v2.json
            RECEIPT_SHA256SUMS_122.txt
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed on inconclusive execution
        shell: bash
        run: |
          gate="$(jq -r '.promotion_gate' public-structured-effect-geometry-ab-v2.json)"
          case "$gate" in INCONCLUSIVE_*) exit 2;; *) exit 0;; esac
