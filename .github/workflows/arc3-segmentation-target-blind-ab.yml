name: ARC3 segmentation target-blind public-development A/B

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - 'public_benchmark/arc3/kaggle_candidates/segmentation_target_blind_ab.py'
      - 'public_benchmark/arc3/kaggle_candidates/segmentation_target_blind_transport.py'
      - '.github/workflows/arc3-segmentation-target-blind-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segmentation-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile segmentation harness
        run: |
          python -m py_compile \
            public_benchmark/arc3/harness/public_trace_temporal_state_audit.py \
            public_benchmark/arc3/kaggle_candidates/temporal_state_target_blind_ab.py \
            public_benchmark/arc3/kaggle_candidates/segmentation_target_blind_ab.py \
            public_benchmark/arc3/kaggle_candidates/segmentation_target_blind_transport.py

      - name: Download pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in \
            ar25-0c556536_p0_events.jsonl \
            ar25-0c556536_p10_events.jsonl \
            ar25-0c556536_p11_events.jsonl
          do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt

      - name: Execute segmentation same-model A/B
        run: |
          python public_benchmark/arc3/kaggle_candidates/segmentation_target_blind_transport.py \
            --input public_trace/ar25-0c556536_p0_events.jsonl \
            --input public_trace/ar25-0c556536_p10_events.jsonl \
            --input public_trace/ar25-0c556536_p11_events.jsonl \
            --max-cases 8 \
            --receipt segmentation-target-blind-ab.json

      - name: Enforce truth boundary and emit summary
        shell: bash
        run: |
          test -s segmentation-target-blind-ab.json
          jq -e '
            .schema=="deus/arc3-segmentation-target-blind-ab/1"
            and .truth.public_trace_only==true
            and .truth.public_source_shaped_representation==true
            and .truth.source_assisted_replay==false
            and .truth.target_blind_public_development_behavior==true
            and .truth.independent_generalization_claim==false
            and .truth.kaggle_submission_attempted==false
            and .truth.submission_quota_spent==false
            and .selection.target_used_for_case_selection==false
            and .selection.target_used_for_prompt==false
            and .repair_hypothesis.current_outcome_used_to_build_segmentation==false
            and .predeclared_policy.no_target_matching==true
          ' segmentation-target-blind-ab.json >/dev/null
          jq '{provider,requested_model,repair_hypothesis,selection,arms,promotion_gate,truth}' \
            segmentation-target-blind-ab.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-segmentation-target-blind-ab-receipt
          path: |
            segmentation-target-blind-ab.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on inconclusive execution
        shell: bash
        run: |
          gate="$(jq -r '.promotion_gate' segmentation-target-blind-ab.json)"
          case "$gate" in
            INCONCLUSIVE_*) exit 2 ;;
            *) exit 0 ;;
          esac
