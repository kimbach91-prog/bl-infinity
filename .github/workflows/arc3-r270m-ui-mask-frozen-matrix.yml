name: ARC3 R270M UI-mask frozen matrix
on:
  push:
    branches: [deus/r270-ui-mask-frozen-gate-20260923]
    paths:
      - .github/workflows/arc3-r270m-ui-mask-frozen-matrix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-game:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        game:
          - ar25-0c556536
          - cd82-fb555c5d
          - cn04-2fe56bfb
          - dc22-fdcac232
          - ft09-0d8bbf25
          - ka59-38d34dbb
          - lf52-271a04aa
          - lp85-305b61c3
          - m0r0-492f87ba
          - r11l-495a7899
          - re86-8af5384d
          - s5i5-18d95033
          - sk48-d8078629
          - su15-1944f8ab
          - tn36-ef4dde99
          - tr87-cd924810
          - tu93-0768757b
          - vc33-5430563c
          - wa30-ee6fef47
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage game p0-p19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 19); do
            f="${{ matrix.game }}_p${p}_events.jsonl"
            test -s "upstream-duck/example-run/artifacts/$f"
            cp "upstream-duck/example-run/artifacts/$f" "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute frozen game gate
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_ui_mask_frozen_gate_270.py "${args[@]}" --output "r270m-${{ matrix.game }}.json" | tee "r270m-${{ matrix.game }}.stdout.txt"
      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          import json,glob,os
          p=glob.glob('r270m-*.json')[0]
          d=json.load(open(p))
          assert d['schema']=='deus/arc3-r270-ui-mask-frozen-gate/1'
          assert d['aggregate']['game_count']==1
          assert d['protocol']['retune_on_p10_p19'] is False
          print(json.dumps(d['aggregate'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r270m-${{ matrix.game }}
          path: |
            r270m-${{ matrix.game }}.json
            r270m-${{ matrix.game }}.stdout.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
