name: DEUS Training Foundry Canary

on:
  push:
    branches: [main]
    paths:
      - "training/deus_lora_canary.py"
      - ".github/workflows/deus-training-foundry-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lora-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers peft accelerate safetensors
      - name: Run DEUS LoRA canary
        run: |
          python training/deus_lora_canary.py --output training/canary-output
      - name: Show receipt
        if: always()
        run: |
          test -f training/canary-output/receipt.json && cat training/canary-output/receipt.json || true
      - name: Upload foundry receipt and adapter
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deus-training-foundry-canary
          path: training/canary-output
          if-no-files-found: error
