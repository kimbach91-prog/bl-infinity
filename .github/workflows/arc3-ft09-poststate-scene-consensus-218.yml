name: ARC3 ft09 poststate scene consensus 218
on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_poststate_scene_consensus_218.py
      - .github/workflows/arc3-ft09-poststate-scene-consensus-218.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate-ft09-poststate-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile             public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py             public_benchmark/arc3/kaggle_candidates/public_v5_canonical_patch_router_191.py             public_benchmark/arc3/kaggle_candidates/public_ft09_phase_hud_identity_gate_202.py             public_benchmark/arc3/kaggle_candidates/public_ft09_macro_neighbor_rule_207.py             public_benchmark/arc3/kaggle_candidates/public_ft09_mismatch_boarddiff_210.py             public_benchmark/arc3/kaggle_candidates/public_ft09_ring2_relational_gate_211.py             public_benchmark/arc3/kaggle_candidates/public_ft09_full_frame_composer_212.py             public_benchmark/arc3/kaggle_candidates/public_ft09_scene_exact_expert_216.py             public_benchmark/arc3/kaggle_candidates/public_ft09_structural_scene_delta_217.py             public_benchmark/arc3/kaggle_candidates/public_ft09_poststate_scene_consensus_218.py
      - name: Download exact ft09 p0..p19 public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'; game='ft09-0d8bbf25'
          for p in $(seq 0 19); do f="${game}_p${p}_events.jsonl"; curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"; test -s "public_trace/$f"; done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute poststate scene consensus
        run: |
          set -euo pipefail
          args=(); for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_ft09_poststate_scene_consensus_218.py "${args[@]}" --output r218-ft09-poststate-scene-consensus.json
      - name: Verify truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r218-ft09-poststate-scene-consensus.json'))
          assert d['schema']=='deus/arc3-ft09-poststate-scene-consensus/1'
          t=d['truth']
          assert t['p0_p9_fit_only'] is True
          assert t['heldout_never_updates_models'] is True
          assert t['all_occurrences_scene_required_per_key'] is True
          assert t['identical_delta_required'] is True
          assert t['multi_expert_agreement_required_when_multiple_match'] is True
          assert t['kaggle_execution'] is False
          assert d['promotion']['solver_promotion'] is False
          print(json.dumps({'models':d['models'],'heldout':d['heldout']['all'],'branches':d['heldout']['by_branch'],'gate':d['zero_wrong_gate_pass']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r218-ft09-poststate-scene-consensus
          path: |
            r218-ft09-poststate-scene-consensus.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
