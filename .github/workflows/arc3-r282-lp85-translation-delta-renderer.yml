name: ARC3 R282 lp85 translation-delta exact-frame renderer
on:
  push:
    branches: [deus/r278-object-region-phase-diagnostic-20260923]
    paths:
      - .github/workflows/arc3-r282-lp85-translation-delta-renderer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r282-lp85:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage exact lp85 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 9); do
            f="lp85-305b61c3_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/$f" "public_trace/$f"
          done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 10
          ! find public_trace -maxdepth 1 -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_lp85_translation_delta_renderer_282.py
      - name: Execute p0-p4 fit p5-p9 exact-frame renderer diagnostic
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in $(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_lp85_translation_delta_renderer_282.py \
            "${args[@]}" --output r282-lp85-translation-delta.json \
            2> >(tee r282-runtime.txt >&2) | tee r282-stdout.txt
      - name: Truth-boundary audit and hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r282-lp85-translation-delta.json'))
          assert d['protocol']['fit']=='p0-p4 only'
          assert d['protocol']['diagnostic']=='p5-p9 only'
          assert d['protocol']['p10_p19_staged_or_read'] is False
          assert d['protocol']['unique_anchor_required'] is True
          assert d['protocol']['exact_full_frame_scoring'] is True
          assert d['truth']['p10_p19_read'] is False
          assert d['truth']['kaggle_execution'] is False
          assert d['truth']['competition_submission'] is False
          print(json.dumps({'verdict':d['verdict'],'fit':d['fit'],'diagnostic':d['diagnostic']},sort_keys=True))
          PY
          sha256sum r282-lp85-translation-delta.json r282-runtime.txt r282-stdout.txt public_trace/SHA256SUMS.txt > R282_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r282-lp85-translation-delta-renderer
          path: |
            r282-lp85-translation-delta.json
            r282-runtime.txt
            r282-stdout.txt
            R282_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
