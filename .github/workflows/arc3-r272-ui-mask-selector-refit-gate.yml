name: ARC3 R272 UI-mask selector refit gate

on:
  push:
    branches: [deus/r272-ui-mask-selector-refit-gate-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ui_mask_selector_refit_gate_272.py
      - .github/workflows/arc3-r272-ui-mask-selector-refit-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-r272:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile integration gate
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py \
            public_benchmark/arc3/kaggle_candidates/public_action_conditional_markov_gate_251.py \
            public_benchmark/arc3/kaggle_candidates/public_ui_mask_markov_diag_268.py \
            public_benchmark/arc3/kaggle_candidates/public_ui_mask_selector_refit_gate_272.py
      - name: Stage exact 25-game p0-p19 public set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('upstream-duck/example-run/artifacts'); dst=Path('public_trace')
          files=sorted(src.glob('*_p*_events.jsonl'))
          by={}
          for f in files:
              m=re.match(r'(.+)_p(\d+)_events\.jsonl$',f.name)
              if not m: continue
              by.setdefault(m.group(1),{})[int(m.group(2))]=f
          valid={g:d for g,d in by.items() if set(d)==set(range(20))}
          if len(valid)!=25: raise SystemExit(f'expected 25 exact public games, got {len(valid)}')
          n=0
          for g,d in sorted(valid.items()):
              for p in range(20):
                  f=d[p]; (dst/f.name).write_bytes(f.read_bytes()); n+=1
          if n!=500: raise SystemExit(f'expected 500 traces, got {n}')
          PY
          test "$(find public_trace -maxdepth 1 -name '*_events.jsonl' -type f | wc -l)" -eq 500
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute R272 selector and frozen refit gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find public_trace -maxdepth 1 -name '*_events.jsonl' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--input "$f"); done
          /usr/bin/time -v python \
            public_benchmark/arc3/kaggle_candidates/public_ui_mask_selector_refit_gate_272.py \
            "${args[@]}" --output r272-ui-mask-selector-refit.json \
            2> >(tee r272-runtime.txt >&2) | tee r272-stdout.txt
      - name: Verify truth boundary and hash
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('r272-ui-mask-selector-refit.json').read_text())
          assert d['schema']=='deus/arc3-r272-ui-mask-selector-refit-gate/1'
          assert d['selector_matches_r268_receipt'] is True
          assert len(d['signal_games'])==14
          p=d['protocol']; t=d['truth']
          assert p['p10_p19_updates_selector'] is False and p['p10_p19_updates_model'] is False
          assert t['public_trace_only'] and t['source_assisted_representation_idea']
          assert not t['independent_generalization_claim'] and not t['full_frame_solver_claim']
          assert not t['kaggle_execution'] and not t['competition_submission'] and not t['submission_quota_spent_by_r272']
          Path('r272-verdict.json').write_text(json.dumps({'verdict':d['verdict'],'aggregate':d['aggregate'],'signal_game_count':len(d['signal_games']),'truth_lane':'PUBLIC_OFFLINE_SELECTOR_REFIT_STABILITY'},indent=2,sort_keys=True)+'\n')
          print(Path('r272-verdict.json').read_text())
          PY
          sha256sum r272-ui-mask-selector-refit.json r272-verdict.json r272-runtime.txt r272-stdout.txt public_trace/SHA256SUMS.txt > R272_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r272-ui-mask-selector-refit-gate
          path: |
            r272-ui-mask-selector-refit.json
            r272-verdict.json
            r272-runtime.txt
            r272-stdout.txt
            R272_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
