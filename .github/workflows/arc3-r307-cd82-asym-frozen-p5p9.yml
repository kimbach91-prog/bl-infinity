name: ARC3 R307 cd82 asymmetric frozen p5-p9
on:
  push:
    branches: [deus/r307-cd82-asym-frozen-p5p9-20260923]
    paths:
      - .github/workflows/arc3-r307-cd82-asym-frozen-p5p9.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 32}
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify frozen source predates evaluation staging
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 2cf6340c890de3a41a74f041cdf43ec3099be8d1^{commit}
          git merge-base --is-ancestor 2cf6340c890de3a41a74f041cdf43ec3099be8d1 HEAD
      - name: Stage exact traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 9); do
            game="cd82-fb555c5d"
            f="${game}_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "public_trace/${f}"
          done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 10
          ! find public_trace -maxdepth 1 -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_cd82_asym_frozen_p5p9_307.py
          args=(); for f in $(find public_trace -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_cd82_asym_frozen_p5p9_307.py "${args[@]}" --output r307-cd82.json 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r307-cd82.json'))
          assert d['schema']=='deus/arc3-r307-cd82-asym-frozen-p5p9/1'
          p=d['protocol']; t=d['truth']; assert p['p10_p19_staged_or_read'] is False and p['selector_frozen_before_replay'] is True; assert not p['p5_p9_updates_selector'] and not p['p5_p9_updates_representation'] and not p['p5_p9_updates_model']; assert t['p5_p9_replay_is_source_assisted'] and not t['p10_p19_read'] and not t['solver_promotion'] and not t['kaggle_execution'] and not t['competition_submission']
          print(json.dumps({'verdict':d['verdict'],'candidate':d['candidate'],'baseline':d['baseline']},sort_keys=True))
          PY
          sha256sum r307-cd82.json runtime.txt stdout.txt public_trace/SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r307-cd82-asym-frozen-p5p9
          path: |
            r307-cd82.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
