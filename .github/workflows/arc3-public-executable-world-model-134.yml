name: ARC3 public executable world model 134

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py
      - .github/workflows/arc3-public-executable-world-model-134.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executable-world-model-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and synthetic causality self-test
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py
          python public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            --self-test \
            --output executable-world-model-selftest-134.json
      - name: Verify pinned TWIN provenance and license
        run: |
          set -euo pipefail
          commit='b9b937cf571a9cbd33e2074d83949cd761677ae7'
          base="https://raw.githubusercontent.com/Alexyskoutnev/TWIN-ARC-AGI-3/$commit"
          curl --fail --location --retry 3 --silent --show-error "$base/LICENSE" -o TWIN_LICENSE.txt
          grep -q '^MIT License$' TWIN_LICENSE.txt
          printf '%s\n' "$commit" > TWIN_PIN.txt
      - name: Download exact pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in \
            ar25-0c556536_p0_events.jsonl \
            ar25-0c556536_p10_events.jsonl \
            ar25-0c556536_p11_events.jsonl
          do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute prefix-only executable-rule audit
        run: |
          set -euo pipefail
          python public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            --input public_trace/ar25-0c556536_p0_events.jsonl \
            --input public_trace/ar25-0c556536_p10_events.jsonl \
            --input public_trace/ar25-0c556536_p11_events.jsonl \
            --output executable-world-model-public-134.json
      - name: Enforce truth boundary and report gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('executable-world-model-public-134.json'))
          assert d['schema'] == 'deus/arc3-public-executable-world-model/1'
          assert d['rung'] == 134
          c=d['causality_contract']
          assert c['prediction_uses_current_outcome'] is False
          assert c['prediction_uses_future_transitions'] is False
          assert c['rule_is_learned_only_after_observed_outcome'] is True
          assert c['minimum_distinct_prior_states_per_rule'] == 2
          t=d['truth']
          assert t['source_assisted_replay'] is True
          assert t['independent_generalization_claim'] is False
          assert t['solver_behavior_gain_claim'] is False
          assert t['model_execution'] is False
          assert t['gpu_execution'] is False
          assert t['kaggle_execution'] is False
          assert t['submission_quota_spent'] is False
          assert d['promotion']['candidate_model_promotion'] is False
          a=d['aggregate']
          assert a['transitions'] == 823
          assert a['baseline_wrong'] == 0
          print(json.dumps({
              'rung': d['rung'],
              'next_gate_signal': d['next_gate_signal'],
              'aggregate': a,
              'truth_boundary': 'PUBLIC_PREFIX_RULE_AUDIT_ONLY_NO_MODEL_OR_KAGGLE_GAIN',
          }, sort_keys=True))
          PY
      - name: Upload rung 134 receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-executable-world-model-134
          path: |
            executable-world-model-public-134.json
            executable-world-model-selftest-134.json
            public_trace/SHA256SUMS.txt
            TWIN_LICENSE.txt
            TWIN_PIN.txt
          if-no-files-found: error
          retention-days: 30
