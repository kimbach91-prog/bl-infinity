name: DEUS LLM7 Anonymous S0 Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-llm7-anon-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm7-anon-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe anonymous chat completion
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/request.json <<'JSON'
          {
            "model":"default",
            "messages":[
              {"role":"user","content":"Public S0 canary. Reply with exactly: DEUS_LLM7_CANARY_OK"}
            ],
            "temperature":0
          }
          JSON

          start_ms="$(date +%s%3N)"
          code="$(curl --max-time 90 -sS -D /tmp/h1.txt -o /tmp/r1.json -w '%{http_code}'             -X POST 'https://api.llm7.io/v1/chat/completions'             -H 'Content-Type: application/json'             --data-binary @/tmp/request.json || true)"
          auth_mode="NO_AUTH_HEADER"

          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            code="$(curl --max-time 90 -sS -D /tmp/h2.txt -o /tmp/r2.json -w '%{http_code}'               -X POST 'https://api.llm7.io/v1/chat/completions'               -H 'Authorization: Bearer unused'               -H 'Content-Type: application/json'               --data-binary @/tmp/request.json || true)"
            cp /tmp/r2.json /tmp/response.json
            auth_mode="ANONYMOUS_PLACEHOLDER_UNUSED"
          else
            cp /tmp/r1.json /tmp/response.json
          fi
          end_ms="$(date +%s%3N)"

          cat /tmp/response.json
          echo
          test "$code" = "200"

          sha="$(sha256sum /tmp/response.json | awk '{print $1}')"
          exact="false"
          if grep -Fq 'DEUS_LLM7_CANARY_OK' /tmp/response.json; then exact="true"; fi

          jq -n             --arg provider "LLM7"             --arg endpoint "https://api.llm7.io/v1/chat/completions"             --arg auth_mode "$auth_mode"             --arg status "$code"             --arg digest "$sha"             --argjson latency_ms "$((end_ms-start_ms))"             --argjson exact "$exact"             '{
              receipt_version:"DEUS-PUBLIC-COMPUTE-CANARY/1",
              provider:$provider,
              endpoint:$endpoint,
              auth_mode:$auth_mode,
              data_class:"S0_SYNTHETIC_ONLY",
              provider_execution:true,
              http_status:($status|tonumber),
              latency_ms:$latency_ms,
              response_digest:$digest,
              exact_contract:$exact,
              canonical_write:false,
              settlement:false,
              verdict:(if $exact then "LLM7_ANON_EXECUTION_PASS" else "LLM7_HTTP_PASS_SEMANTIC_CONTRACT_WEAK" end)
            }' | tee /tmp/llm7-receipt.json

          test "$exact" = "true"
