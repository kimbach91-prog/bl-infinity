name: ARC3 g50t v5 carry-baseline depth

on:
  push:
    branches: [deus/arc3-g50t-depth-v5-carry-20260921]
    paths: [.github/workflows/arc3-g50t-depth-v5-carry.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [carry,baseline]
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Search with cross-level phase state and level-start baseline novelty
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          import copy,hashlib,heapq,itertools,json,os,time
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          GAME='g50t'; VARIANT=os.environ['VARIANT']; OUT=Path('verification'); OUT.mkdir(exist_ok=True)
          ACTS=(1,2,3,4,5,7); AIDX={a:i for i,a in enumerate(ACTS)}
          CFG={
            'carry': {'repeats':(1,2,3,5,8,13,21,34),'beam':4800,'seconds':330,'max_exp':260000,'base_w':30.0,'step_w':5.0,'latent_cap':12,'suffix_n':10},
            'baseline': {'repeats':(1,2,3,4,5,8,13,21,34,55),'beam':5200,'seconds':330,'max_exp':280000,'base_w':40.0,'step_w':2.0,'latent_cap':14,'suffix_n':12},
          }[VARIANT]

          def fr(o): return np.asarray(o.frame[-1],dtype=np.uint8)
          def norm(o):
              a=fr(o).copy()
              if a.shape[0]>=4:
                  a[:2,:]=0; a[-2:,:]=0
              return a
          def fh(o): return hashlib.sha256(norm(o).tobytes()).hexdigest()
          def aids(o):
              out=[]
              for a in (getattr(o,'available_actions',None) or []):
                  try:v=int(a.value)
                  except Exception:
                      try:v=int(a)
                      except Exception:continue
                  if v not in out:out.append(v)
              return out
          def step(e,act):
              aid,data=act; am={a.value:a for a in e.action_space}
              if aid not in am:return None
              try:return e.step(am[aid],data=data)
              except Exception:return None
          def arr_delta(a,b):
              if a.shape!=b.shape:return 1.0
              return float(np.mean(a!=b))
          def changed_bbox_frac(a,b):
              if a.shape!=b.shape:return 1.0
              ys,xs=np.where(a!=b)
              if len(xs)==0:return 0.0
              return float((xs.max()-xs.min()+1)*(ys.max()-ys.min()+1))/float(a.size)
          def counts_for(path):
              c=[0]*len(ACTS)
              for a,_ in path:
                  if a in AIDX:c[AIDX[a]]=min(127,c[AIDX[a]]+1)
              return tuple(c)
          def suffix_for(path,n): return tuple(a for a,_ in path[-n:])
          def macros(o):
              ks=[a for a in aids(o) if a in ACTS]
              out=[]
              for a in ks:
                  A=(a,None)
                  for n in CFG['repeats']:out.append(tuple(A for _ in range(n)))
              for a,b in itertools.permutations(ks,2):
                  A=(a,None);B=(b,None)
                  out += [(A,B),(A,B,A,B),(A,A,A,B),(A,B,B),(A,A,A,A,A,B),(A,B,B,B,B,A)]
              return out
          def run_macro(e,o,macro,start):
              cur=o;used=[]
              for act in macro:
                  nf=step(e,act)
                  if nf is None:return None,used,False
                  cur=nf;used.append(act)
                  if int(cur.levels_completed)>start:return cur,used,True
                  if getattr(cur.state,'value',str(cur.state)) in ('GAME_OVER','WIN'):break
              return cur,used,int(cur.levels_completed)>start
          def apply_path(e,path,target):
              cur=e.observation_space
              for act in path:
                  cur=step(e,act)
                  if cur is None:return None
                  if int(cur.levels_completed)>=target:return cur
              return cur

          def search(e0,o0,prefix_path):
              start=int(o0.levels_completed); t0=time.monotonic(); ctr=itertools.count(); exp=trials=latent=visible=trims=0
              base=norm(o0); prefix_counts=counts_for(prefix_path); prefix_suffix=suffix_for(prefix_path,CFG['suffix_n'])
              heap=[(0.0,0,next(ctr),copy.deepcopy(e0),o0,[],prefix_counts,prefix_suffix,0)]
              seen={(fh(o0),prefix_counts,prefix_suffix):0}; peak=1; best_base=0.0
              while heap and exp<CFG['max_exp'] and time.monotonic()-t0<CFG['seconds']:
                  pri,alen,_,e,o,path,counts,suffix,chain=heapq.heappop(heap)
                  if len(path)>520:continue
                  ph=fh(o); pa=norm(o)
                  for macro in macros(o):
                      if exp>=CFG['max_exp'] or time.monotonic()-t0>=CFG['seconds']:break
                      ee=copy.deepcopy(e); nf,used,won=run_macro(ee,o,macro,start); exp+=len(used); trials+=1
                      if nf is None or not used:continue
                      npth=path+used
                      if won:
                          return npth,{'result':'FOUND','level_from':start,'level_to':int(nf.levels_completed),'expansions':exp,'macro_trials':trials,'seen':len(seen),'seconds':time.monotonic()-t0,'peak':peak,'latent_macros':latent,'visible_macros':visible,'trims':trims,'variant':VARIANT,'best_level_start_delta':best_base,'prefix_counts':prefix_counts,'prefix_suffix':prefix_suffix}
                      if getattr(nf.state,'value',str(nf.state)) in ('GAME_OVER','WIN'):continue
                      na=norm(nf); nh=fh(nf); step_d=arr_delta(pa,na); base_d=arr_delta(base,na); base_box=changed_bbox_frac(base,na); best_base=max(best_base,base_d)
                      cc=list(counts)
                      for a,_ in used:
                          if a in AIDX:cc[AIDX[a]]=min(127,cc[AIDX[a]]+1)
                      cc=tuple(cc); ns=(suffix+tuple(a for a,_ in used))[-CFG['suffix_n']:]
                      if nh==ph:
                          latent+=1; nc=chain+1
                          if nc>CFG['latent_cap']:continue
                      else:
                          visible+=1; nc=0
                      sk=(nh,cc,ns)
                      if len(npth)>=seen.get(sk,10**9):continue
                      seen[sk]=len(npth)
                      novelty=(base_d*CFG['base_w'])+(base_box*10.0)+(step_d*CFG['step_w'])
                      phase_bonus=0.03*len(set(ns)) + 0.001*sum(cc)
                      score=(len(npth)*0.012)+(nc*0.34)-novelty-phase_bonus
                      heapq.heappush(heap,(score,len(npth),next(ctr),ee,nf,npth,cc,ns,nc)); peak=max(peak,len(heap))
                  if len(heap)>CFG['beam']*2:
                      heap=heapq.nsmallest(CFG['beam'],heap);heapq.heapify(heap);trims+=1
              return None,{'result':'MISS','level_from':start,'level_to':start,'expansions':exp,'macro_trials':trials,'seen':len(seen),'seconds':time.monotonic()-t0,'peak':peak,'latent_macros':latent,'visible_macros':visible,'trims':trims,'variant':VARIANT,'best_level_start_delta':best_base,'prefix_counts':prefix_counts,'prefix_suffix':prefix_suffix}

          arc=arc_agi.Arcade(operation_mode=OperationMode.NORMAL)
          env=arc.make(GAME,seed=0,save_recording=False,include_frame_data=True)
          if env is None:raise RuntimeError('ENV_UNAVAILABLE')
          obs=env.observation_space; total=[]; levels=[]; win_levels=int(getattr(obs,'win_levels',0) or 0)
          while int(obs.levels_completed)<min(win_levels,2):
              before=int(obs.levels_completed); path,meta=search(env,obs,total); levels.append(meta)
              if path is None:break
              target=before+1; obs=apply_path(env,path,target)
              if obs is None or int(obs.levels_completed)<target:raise RuntimeError('REAL_APPLY_DID_NOT_LEVEL')
              total.extend(path)
              if getattr(obs.state,'value',str(obs.state))=='WIN':break

          normal_levels=int(obs.levels_completed); normal_state=getattr(obs.state,'value',str(obs.state))
          oa=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          src='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/blob/'+os.environ['GITHUB_SHA']+'/.github/workflows/arc3-g50t-depth-v5-carry.yml'
          cid=oa.open_scorecard(source_url=src,tags=['DEUS','g50t','depth-v5',VARIANT,'carry-baseline','public-development'])
          oe=oa.make(GAME,seed=0,scorecard_id=cid,save_recording=False,include_frame_data=True)
          if oe is None:raise RuntimeError('ONLINE_ENV_UNAVAILABLE')
          oo=oe.observation_space; usedn=0
          for i,act in enumerate(total,1):
              nf=step(oe,act)
              if nf is None:raise RuntimeError('ONLINE_STEP_FAIL_'+str(i))
              oo=nf; usedn=i
              if int(oo.levels_completed)>=normal_levels:break
          card=oa.close_scorecard(cid); online_levels=int(oo.levels_completed)
          rec={'schema':'deus/arc3-g50t-depth-v5-carry/1','game':GAME,'variant':VARIANT,'result':'PASS' if online_levels>=2 and online_levels==normal_levels else 'NO_DEPTH_GAIN','normal_levels_completed':normal_levels,'online_levels_completed':online_levels,'win_levels':win_levels,'normal_state':normal_state,'online_state':getattr(oo.state,'value',str(oo.state)),'actions_executed':usedn,'total_route_len':len(total),'scorecard_id':cid,'scorecard_score':None if card is None else card.score,'route_sha256':hashlib.sha256(json.dumps(total,sort_keys=True,separators=(',',':')).encode()).hexdigest(),'levels':levels,'protocol':'PUBLIC_MULTI_LEVEL_CROSS_LEVEL_PHASE_BASELINE_NOVELTY_V5','representation_delta':'cross-level cumulative action counts and suffix retained at level boundary; search novelty measured against level-start baseline rather than only parent-child frame delta','environment_clone_used_for_search':True,'external_route_used':False,'game_source_inspected_by_solver':False,'hidden_state_read':False,'competition_hidden_score_claim':False,'full_game_generalization_claim':False,'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA']}
          (OUT/'receipt.json').write_text(json.dumps(rec,indent=2)); print('G50T_DEPTH_V5_RECEIPT='+json.dumps(rec,separators=(',',':')))
          if online_levels<normal_levels:raise RuntimeError('ONLINE_REPLAY_MISMATCH')
          if normal_levels<2:raise RuntimeError('NO_DEPTH_GAIN')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g50t-depth-v5-${{ matrix.variant }}
          path: verification/
          retention-days: 30
