name: ARC3 public Schema game identity inspect

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - '.github/workflows/arc3-schema-gameid-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned public Schema traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p schema_public
          base='https://huggingface.co/datasets/schema-harness/arc-agi-3-schema-traces/resolve/main/gpt_5_6_sol'
          for d in gpt_5_6_sol_max_bp35 gpt_5_6_sol_max_sp80 gpt_5_6_sol_xhigh_wa30; do
            curl --fail --location --retry 3 --silent --show-error "$base/$d/events.jsonl?download=true" -o "schema_public/${d}.jsonl"
            test -s "schema_public/${d}.jsonl"
          done
          sha256sum schema_public/*.jsonl > schema_public/SHA256SUMS.txt
      - name: Inspect game/task identity fields without outcome-based selection
        shell: bash
        run: |
          python - <<'PY'
          import collections, glob, json, pathlib, re
          pat = re.compile(r'ar25-[0-9a-fA-F]{6,}')
          out = {}
          def walk(v, path='$'):
              if isinstance(v, dict):
                  for k, x in v.items():
                      yield from walk(x, f'{path}.{k}')
              elif isinstance(v, list):
                  for i, x in enumerate(v):
                      yield from walk(x, f'{path}[{i}]')
              else:
                  yield path, v
          for fp in sorted(glob.glob('schema_public/*.jsonl')):
              ids = collections.Counter(); keyed = collections.Counter(); step0 = 0; level0 = 0; actions = 0
              examples = []
              with open(fp, encoding='utf-8') as f:
                  for line_no, line in enumerate(f, 1):
                      if not line.strip():
                          continue
                      e = json.loads(line)
                      if e.get('kind') == 'action_taken':
                          actions += 1
                          step0 += int(e.get('step_index') == 0)
                          level0 += int(e.get('level') == 0)
                      for p, v in walk(e):
                          low = p.lower()
                          if any(t in low for t in ('game', 'task', 'puzzle')):
                              keyed[f'{p}={str(v)[:120]}'] += 1
                          if isinstance(v, str):
                              for m in pat.findall(v):
                                  ids[m] += 1
                                  if len(examples) < 10:
                                      examples.append({'line': line_no, 'path': p, 'id': m})
              out[pathlib.Path(fp).stem] = {
                  'action_taken': actions,
                  'step_index_zero_count': step0,
                  'level_zero_action_count': level0,
                  'arc_game_ids': dict(ids),
                  'identity_field_examples': dict(keyed.most_common(30)),
                  'id_examples': examples,
              }
          pathlib.Path('schema-gameid-inspect.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-schema-gameid-inspect
          path: |
            schema-gameid-inspect.json
            schema_public/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
