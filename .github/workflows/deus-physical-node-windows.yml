name: DEUS Windows Physical Node Security

on:
  pull_request:
    paths:
      - 'nodes/windows/**'
      - 'runtime/federation/worker/**'
      - 'runtime/federation/lib/protocol.mjs'
      - '.github/workflows/deus-physical-node-windows.yml'
  push:
    branches:
      - 'deus/physical-node-windows-r1'
    paths:
      - 'nodes/windows/**'
      - 'runtime/federation/worker/**'
      - 'runtime/federation/lib/protocol.mjs'
      - '.github/workflows/deus-physical-node-windows.yml'

permissions:
  contents: read

jobs:
  physical-node-security:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse PowerShell 5.1 node scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'nodes/windows/bootstrap.ps1',
            'nodes/windows/recover-runtime-no-git.ps1',
            'nodes/windows/audit.ps1',
            'nodes/windows/rollback.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$file :: $($_.Message) at $($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber)" }
              exit 1
            }
          }

      - name: Test physical-node isolation and worker authentication
        shell: pwsh
        run: node --test nodes/windows/test/physical-node.test.mjs

      - name: Reject dangerous physical-node exposure primitives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            (Get-Content 'nodes/windows/bootstrap.ps1' -Raw),
            (Get-Content 'nodes/windows/recover-runtime-no-git.ps1' -Raw)
          )
          foreach ($script in $scripts) {
            if ($script -match '0\.0\.0\.0') { throw 'worker must not bind 0.0.0.0' }
            if ($script -match '\$env:BL_CONTROL_TOKEN\s*=') { throw 'worker must never receive BL_CONTROL_TOKEN' }
            if ($script -match 'New-NetFirewallRule[^\r\n]+8790') { throw 'node setup must not expose the worker port' }
            if ($script -match '(?i)(Invoke-Expression|\biex\b)') { throw 'node setup must not use dynamic PowerShell eval' }
          }
          $recovery = Get-Content 'nodes/windows/recover-runtime-no-git.ps1' -Raw
          if ($recovery -match 'winget') { throw 'recovery path must not depend on winget' }
          if ($recovery -match '(?i)git\.exe|\bgit\s+clone\b|\bgit\s+fetch\b') { throw 'recovery path must not depend on Git' }
          if ($recovery -notmatch 'remoteRoutable\)') { throw 'recovery must enforce remote-routable fail-closed state' }
          Write-Host 'physical-node exposure checks passed'
