name: ARC3 R294 lp85 LOTO sparse local delta
on:
  push:
    branches: [deus/r278-object-region-phase-diagnostic-20260923]
    paths:
      - .github/workflows/arc3-r294-lp85-loto-sparse-local-delta.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r294-lp85:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 20}
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify R294 source fixed before staging diagnostic traces
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 28837c1be362eef67230e6ee52b4b7bb0c9784ad^{commit}
          git merge-base --is-ancestor 28837c1be362eef67230e6ee52b4b7bb0c9784ad HEAD
          test "$(git show 28837c1be362eef67230e6ee52b4b7bb0c9784ad:public_benchmark/arc3/kaggle_candidates/public_lp85_loto_sparse_local_delta_diag_294.py | sha256sum | cut -d' ' -f1)" = "$(sha256sum public_benchmark/arc3/kaggle_candidates/public_lp85_loto_sparse_local_delta_diag_294.py | cut -d' ' -f1)"
      - name: Stage exact lp85 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 9); do f="lp85-305b61c3_p${p}_events.jsonl"; cp "upstream-duck/example-run/artifacts/$f" "public_trace/$f"; done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 10
          ! find public_trace -maxdepth 1 -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Compile and execute bounded verifier-first diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py \
            public_benchmark/arc3/kaggle_candidates/public_ui_mask_markov_diag_268.py \
            public_benchmark/arc3/kaggle_candidates/public_relational_topology_diag_274.py \
            public_benchmark/arc3/kaggle_candidates/public_action_canonical_topology_diag_275.py \
            public_benchmark/arc3/kaggle_candidates/public_object_region_phase_diag_278.py \
            public_benchmark/arc3/kaggle_candidates/public_lp85_loto_sparse_local_delta_diag_294.py
          args=(); for f in $(find public_trace -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_lp85_loto_sparse_local_delta_diag_294.py "${args[@]}" --output r294-lp85.json 2> >(tee r294-runtime.txt >&2) | tee r294-stdout.txt
      - name: Independent truth-boundary audit and hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r294-lp85.json'))
          assert d['schema']=='deus/arc3-r294-lp85-loto-sparse-local-delta/1'
          assert d['protocol']['fit_and_loto_verifier']=='p0-p4 only'
          assert d['protocol']['diagnostic']=='p5-p9 only'
          assert d['protocol']['p10_p19_staged_or_read'] is False
          assert d['protocol']['threshold_sweep'] is False
          assert d['truth']['p10_p19_read'] is False
          assert d['truth']['sparse_pixel_gain_is_not_full_frame_gain'] is True
          assert d['truth']['solver_promotion'] is False
          assert d['truth']['kaggle_execution'] is False
          assert d['truth']['competition_submission'] is False
          print(json.dumps({'verdict':d['verdict'],'fit_gate':d['fit_gate'],'validation':d['validation'],'delta':d['delta']},sort_keys=True))
          PY
          sha256sum r294-lp85.json r294-runtime.txt r294-stdout.txt public_trace/SHA256SUMS.txt > R294_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r294-lp85-loto-sparse-local-delta
          path: |
            r294-lp85.json
            r294-runtime.txt
            r294-stdout.txt
            R294_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
