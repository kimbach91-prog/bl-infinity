name: ARC3 R270 NVIDIA DreamTeam source-runtime grounding

on:
  push:
    branches: [deus/r270-dreamteam-source-runtime-grounding-20260923]
    paths:
      - .github/workflows/arc3-r270-dreamteam-source-runtime-grounding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ground-dreamteam:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/dream-team
          ref: bffef22f3e50fb7dcd6b2dc20005e6986e1479e9
          path: upstream-dreamteam
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned source and license
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-dreamteam
          test "$(git rev-parse HEAD)" = "bffef22f3e50fb7dcd6b2dc20005e6986e1479e9"
          grep -q 'Apache License' LICENSE
          python - <<'PY'
          from pathlib import Path
          r=Path('README.md').read_text()
          for s in ('shared, executable world model','critic checks the evidence','parallel offline/competition'):
              assert s in r, s
          PY
          git rev-parse HEAD > ../r270-upstream-head.txt
          sha256sum README.md LICENSE pyproject.toml > ../r270-source-sha256.txt
      - name: Install upstream package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ./upstream-dreamteam
      - name: Run credential-free release tests
        shell: bash
        env:
          ARC_API_KEY: ''
          LLM_API_KEY: ''
          LLM_API_KEY_POOL: ''
        run: |
          set -euo pipefail
          cd upstream-dreamteam
          /usr/bin/time -v python -m pytest -q tests/release -m 'not live_llm' \
            2> >(tee ../r270-runtime.txt >&2) | tee ../r270-pytest.txt
      - name: Verify and write receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          txt=Path('r270-pytest.txt').read_text()
          failed=bool(re.search(r'\bfailed\b',txt,re.I))
          passed_match=re.findall(r'(\d+) passed',txt)
          passed=int(passed_match[-1]) if passed_match else None
          assert not failed, txt[-2000:]
          assert passed is not None and passed > 0, txt[-2000:]
          out={
            'schema':'deus/arc3-r270-dreamteam-source-runtime-grounding/1',
            'upstream_repo':'NVIDIA/dream-team',
            'upstream_commit':'bffef22f3e50fb7dcd6b2dc20005e6986e1479e9',
            'license':'Apache-2.0',
            'credential_free_release_tests_passed':passed,
            'live_llm_tests_executed':False,
            'arc_competition_executed':False,
            'offline_score_claim':False,
            'kaggle_execution':False,
            'competition_submission':False,
            'owner_score_claim':False,
            'verdict':'SOURCE_RUNTIME_GROUNDED_NOT_PROMOTED'
          }
          Path('r270-receipt.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          sha256sum r270-receipt.json r270-pytest.txt r270-runtime.txt r270-upstream-head.txt r270-source-sha256.txt > R270_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r270-dreamteam-source-runtime-grounding
          path: |
            r270-receipt.json
            r270-pytest.txt
            r270-runtime.txt
            r270-upstream-head.txt
            r270-source-sha256.txt
            R270_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
