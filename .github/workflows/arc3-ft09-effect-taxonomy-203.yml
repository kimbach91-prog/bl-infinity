name: ARC3 ft09 effect taxonomy 203

on:
  push:
    branches:
      - deus/arc3-remaining14-coverage-20260922
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_effect_taxonomy_203.py
      - .github/workflows/arc3-ft09-effect-taxonomy-203.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-ft09-effect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_v5_canonical_patch_router_191.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_effect_taxonomy_203.py
      - name: Download exact ft09 p0..p9 public traces only
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          game='ft09-0d8bbf25'
          for p in $(seq 0 9); do
            f="${game}_p${p}_events.jsonl"
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute p0-p9 effect taxonomy
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_ft09_effect_taxonomy_203.py \
            "${args[@]}" --output r203-ft09-effect-taxonomy.json
      - name: Verify scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r203-ft09-effect-taxonomy.json'))
          assert d['schema']=='deus/arc3-ft09-effect-taxonomy/1'
          assert d['truth']['uses_only_p0_p9'] is True
          assert d['truth']['p10_p19_read'] is False
          assert d['truth']['diagnostic_only'] is True
          assert d['truth']['kaggle_execution'] is False
          print(json.dumps({'totals':d['totals'],'classes':d['classes'],'by_action':d['by_action']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r203-ft09-effect-taxonomy
          path: |
            r203-ft09-effect-taxonomy.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
