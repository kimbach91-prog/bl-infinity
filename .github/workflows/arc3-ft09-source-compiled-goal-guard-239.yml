name: ARC3 ft09 source-compiled goal guard 239

on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_goal_guard_239.py
      - .github/workflows/arc3-ft09-source-compiled-goal-guard-239.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-ft09-goal-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile harness
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_goal_guard_239.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_static_level_238.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_nti_repair_235.py
      - name: Fetch pinned source and traces
        run: |
          set -euo pipefail
          mkdir -p source public_trace
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/axobase001/arc-agi-games/41b87fe1ea8d9819a44eea35172ffe28d6c5ffe6/ft09/0d8bbf25/ft09.py' \
            -o source/ft09.py
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          game='ft09-0d8bbf25'
          for p in $(seq 0 19); do
            f="${game}_p${p}_events.jsonl"
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum source/ft09.py > source/SHA256SUMS.txt
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Compile goal spec
        run: |
          PYTHONPATH=public_benchmark/arc3/kaggle_candidates \
          python public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_goal_guard_239.py \
            compile --source source/ft09.py --output r239-ft09-goal-spec.json
      - name: Verify spec and delete source before inference
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r239-ft09-goal-spec.json'))
          assert d['schema']=='deus/arc3-ft09-static-level-goal-spec/1'
          assert d['source_commit']=='41b87fe1ea8d9819a44eea35172ffe28d6c5ffe6'
          assert len(d['levels'])==6
          assert d['truth']['cgj_relations_compiled_static'] is True
          assert d['truth']['goal_evaluation_observation_only_after_candidate_edit'] is True
          assert sum(len(x.get('goal_groups') or []) for x in d['levels'])>0
          print({'goal_groups':[len(x.get('goal_groups') or []) for x in d['levels']]})
          PY
          rm -f source/ft09.py
          test ! -e source/ft09.py
      - name: Execute source-free goal-guard audit
        run: |
          set -euo pipefail
          test ! -e source/ft09.py
          args=()
          for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          PYTHONPATH=public_benchmark/arc3/kaggle_candidates \
          python public_benchmark/arc3/kaggle_candidates/public_ft09_source_compiled_goal_guard_239.py \
            evaluate --spec r239-ft09-goal-spec.json "${args[@]}" --output r239-ft09-source-compiled-goal-guard.json
      - name: Verify truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r239-ft09-source-compiled-goal-guard.json'))
          assert d['schema']=='deus/arc3-ft09-source-compiled-goal-guard-audit/1'
          t=d['truth']
          assert t['evaluate_stage_does_not_read_or_execute_source'] is True
          assert t['goal_guard_uses_compiled_relations_and_candidate_observation_only'] is True
          assert t['goal_transition_fails_closed_instead_of_synthesizing_next_level'] is True
          assert t['independent_generalization_claim'] is False
          assert t['competition_submission'] is False
          assert d['decision']['solver_promotion'] is False
          print({'train':d['p0_p9_source_assisted_validation'],'dev':d['p10_p19_reused_development_only'],'decision':d['decision']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r239-ft09-source-compiled-goal-guard
          path: |
            r239-ft09-goal-spec.json
            r239-ft09-source-compiled-goal-guard.json
            source/SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
