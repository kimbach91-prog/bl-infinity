name: DEUS FrontierMath Erdos242 Hard Attempt

on:
  pull_request:
    paths:
      - '.github/workflows/deus-frontiermath-erdos242-hard.yml'
      - 'public_benchmark/wave1/frontiermath_erdos242_attempt.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  erdos242-hard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: epoch-research/LeanOpenProblems
          ref: af3b82f9d2fd38bea33d59e637b6b4eff54a464c
          path: vendor/LeanOpenProblems
      - uses: astral-sh/setup-uv@v6
      - name: Install Lean toolchain
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare upstream environment
        run: |
          cd vendor/LeanOpenProblems
          uv sync
          lake --version
      - name: Install DEUS proof attempt into upstream tree
        run: |
          cp public_benchmark/wave1/frontiermath_erdos242_attempt.lean vendor/LeanOpenProblems/DeusErdos242Attempt.lean
      - name: Lean verifier
        shell: bash
        run: |
          set +e
          cd vendor/LeanOpenProblems
          lake env lean DeusErdos242Attempt.lean > ../erdos242-lean.log 2>&1
          rc=$?
          cd ..
          echo "$rc" > erdos242-lean.rc
          cat erdos242-lean.log
          exit "$rc"
