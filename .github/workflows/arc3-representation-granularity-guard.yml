name: ARC3 representation granularity guard

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/harness/representation_granularity_guard.py
      - .github/workflows/arc3-representation-granularity-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run synthetic granularity tripwire
        shell: bash
        run: |
          set -euo pipefail
          TOOL=public_benchmark/arc3/harness/representation_granularity_guard.py
          python -m py_compile "$TOOL"
          python "$TOOL" --self-test --output representation-granularity-selftest.json
      - name: Exercise CLI on a bounded paired trace fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > trace.jsonl <<'EOF'
          {"outcome":0,"representations":{"pixel_hash":"p0","object_state":"left"}}
          {"outcome":0,"representations":{"pixel_hash":"p1","object_state":"left"}}
          {"outcome":0,"representations":{"pixel_hash":"p2","object_state":"left"}}
          {"outcome":0,"representations":{"pixel_hash":"p3","object_state":"left"}}
          {"outcome":0,"representations":{"pixel_hash":"p4","object_state":"left"}}
          {"outcome":1,"representations":{"pixel_hash":"p5","object_state":"right"}}
          {"outcome":1,"representations":{"pixel_hash":"p6","object_state":"right"}}
          {"outcome":1,"representations":{"pixel_hash":"p7","object_state":"right"}}
          {"outcome":1,"representations":{"pixel_hash":"p8","object_state":"right"}}
          {"outcome":1,"representations":{"pixel_hash":"p9","object_state":"right"}}
          EOF
          TOOL=public_benchmark/arc3/harness/representation_granularity_guard.py
          python "$TOOL" --input trace.jsonl \
            --representation pixel_hash \
            --representation object_state \
            --output representation-granularity-cli.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('representation-granularity-cli.json').read_text())
          by={x['name']:x for x in r['audits']}
          assert by['pixel_hash']['status']=='OVERFINE_OR_UNSUPPORTED', by
          assert by['object_state']['status']=='SUPPORTED_NONDEGENERATE', by
          assert r['gate']=='PASS', r
          assert r['truth']['kaggle_score'] is False
          assert r['truth']['model_behavior_gain'] is False
          print(json.dumps({
            'schema':'deus/arc3-representation-granularity-runtime-receipt/1',
            'gate':'PASS',
            'overfine_rejected':True,
            'supported_representation_accepted':True,
            'kaggle_score_claim':False,
            'model_behavior_gain_claim':False,
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-representation-granularity-guard-receipt
          path: |
            representation-granularity-selftest.json
            representation-granularity-cli.json
          if-no-files-found: error
