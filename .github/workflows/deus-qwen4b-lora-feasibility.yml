name: DEUS Qwen3-4B LoRA Feasibility

on:
  pull_request:
    paths:
      - "training/deus_qwen4b_lora_feasibility.py"
      - ".github/workflows/deus-qwen4b-lora-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen4b-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded CPU training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers peft accelerate safetensors psutil
      - name: Run Qwen3-4B one-step LoRA feasibility
        run: python training/deus_qwen4b_lora_feasibility.py
      - name: Show receipt
        if: always()
        run: test -f training/qwen4b-feasibility-output/receipt.json && cat training/qwen4b-feasibility-output/receipt.json || true
      - name: Upload feasibility receipt and adapter if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deus-qwen4b-lora-feasibility
          path: training/qwen4b-feasibility-output
          if-no-files-found: warn
