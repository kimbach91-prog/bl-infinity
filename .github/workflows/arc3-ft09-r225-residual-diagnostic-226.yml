name: ARC3 ft09 R225 residual temporal structural diagnostic 226
on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_r225_residual_temporal_structural_diagnostic_226.py
      - .github/workflows/arc3-ft09-r225-residual-diagnostic-226.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-ft09-r225-residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_v5_canonical_patch_router_191.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_phase_hud_identity_gate_202.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_macro_neighbor_rule_207.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_mismatch_boarddiff_210.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_ring2_relational_gate_211.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_cv_support_ensemble_212.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_full_frame_composer_212.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_scene_exact_expert_216.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_virtual_goal_scene_expert_217.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_structural_goal_scene_expert_218.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_low_support_base_abstain_union_221.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_low_confidence_goal_manifold_veto_225.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_r225_residual_temporal_structural_diagnostic_226.py
      - name: Download exact ft09 p0..p19 public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'; game='ft09-0d8bbf25'
          for p in $(seq 0 19); do f="${game}_p${p}_events.jsonl"; curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"; test -s "public_trace/$f"; done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute residual diagnostic
        run: |
          set -euo pipefail
          args=(); for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          PYTHONPATH=public_benchmark/arc3/kaggle_candidates python public_benchmark/arc3/kaggle_candidates/public_ft09_r225_residual_temporal_structural_diagnostic_226.py "${args[@]}" --output r226-ft09-r225-residual-diagnostic.json
      - name: Verify truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r226-ft09-r225-residual-diagnostic.json'))
          assert d['schema']=='deus/arc3-ft09-r225-residual-temporal-structural-diagnostic/1'
          assert d['population']['eligible']==914
          assert d['population']['covered_before_r225']==296
          assert d['population']['r225_added']==11
          assert d['population']['residual_abstain']==607
          t=d['truth']
          assert t['r225_models_fit_p0_p9_only'] is True
          assert t['r225_precedence_replayed_unchanged'] is True
          assert t['heldout_outcomes_used_for_diagnostic_taxonomy'] is True
          assert t['heldout_outcomes_used_for_predictor_selection'] is False
          assert t['heldout_updates_models'] is False
          assert t['kaggle_execution'] is False
          assert d['promotion']['diagnostic_only'] is True
          assert d['promotion']['solver_promotion'] is False
          print(json.dumps({'population':d['population'],'ranked_evidence':d['residual']['ranked_evidence'],'ranked_mechanisms':d['residual']['ranked_mechanisms'],'veto_counts':d['residual']['veto_counts']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r226-ft09-r225-residual-diagnostic
          path: |
            r226-ft09-r225-residual-diagnostic.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
