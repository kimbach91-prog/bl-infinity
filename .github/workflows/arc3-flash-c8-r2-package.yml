name: ARC3 Flash-Next c8-r2 package gate

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/**
      - .github/workflows/arc3-flash-c8-r2-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build upstream c8-r2-shaped full package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public_benchmark/arc3/kaggle_candidates/flash_next_340"
          TMP="$RUNNER_TEMP/flash-c8-r2"
          OUT="$TMP/build/flash-c8-r2-full-package"
          mkdir -p "$TMP/scripts"
          cp "$ROOT/arc-agi-flash-next-mtp.ipynb" "$TMP/arc-agi-flash-next-mtp.ipynb"
          cp "$ROOT/upstream_build_flash_next_package.py" "$TMP/scripts/build_flash_next_package.py"
          cp "$ROOT/upstream_flash_teardown_patch.py" "$TMP/scripts/flash_teardown_patch.py"
          python "$TMP/scripts/build_flash_next_package.py" \
            --kernel-id "deusplaceholder/arc-agi3-flash-next-mtp-c8-full-r2" \
            --mode full \
            --concurrency 8 \
            --full-runtime-seconds 7200 \
            --title "arc agi3 flash next mtp c8 full r2" \
            --output-dir "$OUT"
          rm -rf "$GITHUB_WORKSPACE/flash-c8-r2-full-package"
          cp -r "$OUT" "$GITHUB_WORKSPACE/flash-c8-r2-full-package"
      - name: Verify candidate invariants and write immutable receipt
        shell: bash
        run: |
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path

          out=Path("flash-c8-r2-full-package")
          nbs=sorted(out.glob("*.ipynb"))
          assert len(nbs)==1, nbs
          nb_path=nbs[0]
          nb=json.loads(nb_path.read_text(encoding="utf-8"))
          meta=json.loads((out/"kernel-metadata.json").read_text(encoding="utf-8"))
          code_cells=[]
          for i,cell in enumerate(nb.get("cells",[])):
              if cell.get("cell_type")=="code":
                  src="".join(cell.get("source",[]))
                  compile(src,f"cell-{i}","exec",flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)
                  code_cells.append(src)
          source="\n".join(code_cells)
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          semantic=json.dumps(
              [{"cell_type":c.get("cell_type"),"source":"".join(c.get("source",[]))}
               for c in nb.get("cells",[])],
              ensure_ascii=False,sort_keys=True,separators=(",",":"),
          ).encode()
          checks={
              "compiled_code_cells": len(code_cells)>0,
              "competition_source": "arc-prize-2026-arc-agi-3" in (meta.get("competition_sources") or []),
              "machine_shape": meta.get("machine_shape")=="NvidiaRtxPro6000",
              "gpu_enabled": meta.get("enable_gpu") is True,
              "internet_disabled": meta.get("enable_internet") is False,
              "concurrency_default_8": 'FLASH_RUNTIME_CONCURRENCY = int(os.environ.get("FLASH_RUNTIME_CONCURRENCY", "8"))' in source,
              "full_runtime_default_7200": 'FLASH_FULL_RUNTIME_S = float(os.environ.get("FLASH_FULL_RUNTIME_S", "7200"))' in source,
              "runtime_override_applied": "bm.solver.concurrency = (FLASH_RUNTIME_CONCURRENCY " in source,
              "schedule_guard_present": "FULL_RUNTIME_SCHEDULE" in source or "full_batch_count" in source,
          }
          receipt={
              "schema":"deus/arc3-flash-c8-r2-package/1",
              "upstream_repo":"1zuki/arg-agi",
              "upstream_reference_commit":"f1b15a9af41f2557ed564ba01e11568456dd4f27",
              "upstream_handoff":"kaggle/flash-next-c8-r2/README.md",
              "source_blob_sha":{
                  "notebook":"b28a7ba4c60b6dbb0ce4aa517761d61bcb996b1c",
                  "builder":"eddafbc9c5c5b84b2e4388995345bae7ebbd9cae",
                  "audit":"564c9657ae7d51941cd956f05ccde947534296f2",
                  "teardown_patch":"a19df05f4ca82fe0e065178bfd2991b56fc63a79",
                  "license":"bc9439e84f9a5c47202cd8cc591d3b30a7fbe17a"
              },
              "license":"MIT",
              "candidate":{
                  "concurrency":8,
                  "full_runtime_seconds_per_game":7200,
                  "analyzer_timeout_seconds":900,
                  "upstream_evidence_only":{
                      "incumbent_public_score":3.40,
                      "earlier_c8_offline_mean":9.05124079307816,
                      "earlier_c8_rejected_reason":"last game cancelled at nine-hour boundary",
                      "c8_r2_kaggle_run_verified":False
                  }
              },
              "notebook_file":nb_path.name,
              "notebook_sha256":sha(nb_path),
              "notebook_semantic_sha256":hashlib.sha256(semantic).hexdigest(),
              "metadata_sha256":sha(out/"kernel-metadata.json"),
              "checks":checks,
              "gate":"STATIC_READY" if all(checks.values()) else "HOLD",
              "truth":{
                  "network_calls":False,
                  "kaggle_auth_used":False,
                  "kaggle_kernel_pushed":False,
                  "kaggle_kernel_run":False,
                  "full_offline_audit_executed":False,
                  "competition_submission_attempted":False,
                  "submission_quota_spent":False,
                  "leaderboard_score_observed":False,
                  "candidate_promoted":False
              }
          }
          Path("flash-c8-r2-package-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          if receipt["gate"]!="STATIC_READY":
              raise SystemExit("c8-r2 static gate failed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flash-c8-r2-full-package
          path: |
            flash-c8-r2-full-package/
            flash-c8-r2-package-receipt.json
          if-no-files-found: error
          retention-days: 30
