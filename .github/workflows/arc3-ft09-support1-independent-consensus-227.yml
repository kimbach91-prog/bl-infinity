name: ARC3 ft09 support1 independent consensus 227
on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_support1_independent_consensus_227.py
      - .github/workflows/arc3-ft09-support1-independent-consensus-227.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate-ft09-support1-consensus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile             public_benchmark/arc3/kaggle_candidates/public_ft09_support1_independent_consensus_227.py             public_benchmark/arc3/kaggle_candidates/public_ft09_goal_manifold_veto_225.py             public_benchmark/arc3/kaggle_candidates/public_ft09_low_support_base_abstain_union_221.py
      - name: Download exact ft09 p0..p19 public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'; game='ft09-0d8bbf25'
          for p in $(seq 0 19); do
            f="${game}_p${p}_events.jsonl"
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute R227 support1 consensus gate
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_ft09_support1_independent_consensus_227.py             "${args[@]}" --output r227-ft09-support1-independent-consensus.json
      - name: Verify truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r227-ft09-support1-independent-consensus.json'))
          assert d['schema']=='deus/arc3-ft09-support1-independent-consensus/1'
          t=d['truth']
          assert t['r225_precedence_preserved'] is True
          assert t['family_and_support_selected_p0_p9_loto_only'] is True
          assert t['secondary_requires_cross_trace_support'] is True
          assert t['support1_requires_primary_secondary_target_agreement'] is True
          assert t['r226_heldout_support1_outcomes_not_used_for_selection'] is True
          assert t['heldout_never_updates_policy_or_models'] is True
          assert t['kaggle_execution'] is False
          assert d['promotion']['solver_promotion'] is False
          print(json.dumps({
            'policy':d['policy'],
            'heldout':d['heldout']['all'],
            'stages':d['heldout']['stage_metrics'],
            'gate':d['zero_wrong_coverage_gain_gate_pass'],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r227-ft09-support1-independent-consensus
          path: |
            r227-ft09-support1-independent-consensus.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
