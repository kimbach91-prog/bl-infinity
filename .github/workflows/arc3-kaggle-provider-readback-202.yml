name: ARC3 Kaggle provider fresh non-mutating readback 202

on:
  push:
    branches:
      - deus/arc3-remaining14-coverage-20260922
    paths:
      - .github/workflows/arc3-kaggle-provider-readback-202.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe existing authorized Railway executor without mutation
        shell: bash
        run: |
          set -u
          base='https://deus-cpu-executor-b-production.up.railway.app'
          mkdir -p receipt
          for ep in health kaggle-status arc3-c8-status arc3-c8-launch-receipt kaggle-submissions; do
            echo "=== $ep ===" | tee "receipt/${ep}.txt"
            curl --silent --show-error --location --max-time 120 \
              -w '\nHTTP_CODE:%{http_code}\n' \
              "$base/$ep" | tee -a "receipt/${ep}.txt" || true
          done
          date -u +'%Y-%m-%dT%H:%M:%SZ' > receipt/probed_at_utc.txt
          sha256sum receipt/*.txt | sort > receipt/SHA256SUMS
          cat receipt/SHA256SUMS
      - name: Summarize only provider-state boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          def read(name): return Path('receipt',name).read_text(errors='replace')
          raw={k:read(f'{k}.txt') for k in ['health','kaggle-status','arc3-c8-status','arc3-c8-launch-receipt','kaggle-submissions']}
          # Do not infer a Kaggle kernel state from wrapper language. Preserve exact returned text as receipt custody.
          out={
            'schema':'deus/arc3-kaggle-provider-readback/202',
            'probe_is_non_mutating':True,
            'competition_submission_performed':False,
            'quota_spent':False,
            'http_codes':{},
            'boundaries':{
              'queued_is_executed':False,
              'save_run_is_submission':False,
              'submission_is_leaderboard_score':False,
            }
          }
          for k,v in raw.items():
            m=re.findall(r'HTTP_CODE:(\d+)',v)
            out['http_codes'][k]=int(m[-1]) if m else None
          Path('receipt/provider-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-kaggle-provider-readback-202
          path: receipt/
          if-no-files-found: error
          retention-days: 30
