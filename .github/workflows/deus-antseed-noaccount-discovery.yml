name: DEUS Antseed No-Account Discovery Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-antseed-noaccount-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  antseed-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install CLI and discover network without account or spend
        shell: bash
        run: |
          set -euo pipefail
          export ANTSEED_DATA_DIR="$RUNNER_TEMP/antseed-deus-s0"
          mkdir -p "$ANTSEED_DATA_DIR"

          npm install -g @antseed/cli
          antseed --version | tee /tmp/antseed-version.txt

          (
            antseed --data-dir "$ANTSEED_DATA_DIR" buyer start --router local               > /tmp/antseed.log 2>&1
          ) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ok=0
          for i in $(seq 1 30); do
            if curl --max-time 3 -fsS http://127.0.0.1:8377/v1/models -o /tmp/models.json; then
              ok=1
              break
            fi
            sleep 2
          done

          echo "--- antseed log tail ---"
          tail -n 120 /tmp/antseed.log || true
          test "$ok" = "1"

          jq -e '.data and (.data|type=="array")' /tmp/models.json >/dev/null
          count="$(jq '.data|length' /tmp/models.json)"
          sha="$(sha256sum /tmp/models.json | awk '{print $1}')"
          version="$(tail -n 1 /tmp/antseed-version.txt | tr -d '\r')"

          jq -n             --arg provider "ANTSEED"             --arg version "$version"             --arg digest "$sha"             --argjson model_count "$count"             '{
              receipt_version:"DEUS-PUBLIC-DISCOVERY-CANARY/1",
              provider:$provider,
              auth_mode:"NO_ACCOUNT_EPHEMERAL_NODE_IDENTITY",
              data_class:"PUBLIC_NETWORK_DISCOVERY_ONLY",
              cli_version:$version,
              buyer_proxy_live:true,
              model_catalog_read:true,
              model_count:$model_count,
              response_digest:$digest,
              payment_deposit:false,
              paid_inference:false,
              seller_registration:false,
              stake:false,
              canonical_write:false,
              verdict:"ANTSEED_NOACCOUNT_DISCOVERY_PASS"
            }' | tee /tmp/antseed-receipt.json
