name: ARC3 ft09 R225 abstention diagnostic 226
on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_r225_abstention_diagnostic_226.py
      - .github/workflows/arc3-ft09-r225-abstention-diagnostic-226.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-ft09-r225-abstentions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile             public_benchmark/arc3/kaggle_candidates/public_ft09_r225_abstention_diagnostic_226.py             public_benchmark/arc3/kaggle_candidates/public_ft09_goal_manifold_veto_225.py
      - name: Download exact ft09 p0..p19 public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'; game='ft09-0d8bbf25'
          for p in $(seq 0 19); do
            f="${game}_p${p}_events.jsonl"
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute R226 diagnostic
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_ft09_r225_abstention_diagnostic_226.py             "${args[@]}" --output r226-ft09-r225-abstention-diagnostic.json
      - name: Verify truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r226-ft09-r225-abstention-diagnostic.json'))
          assert d['schema']=='deus/arc3-ft09-r225-abstention-diagnostic/1'
          t=d['truth']
          assert t['r225_anchor_rebuilt_from_p0_p9_only'] is True
          assert t['heldout_used_for_diagnostic_decomposition_only'] is True
          assert t['support1_outcomes_are_nonpromotable_diagnostic'] is True
          assert t['heldout_never_updates_model'] is True
          assert t['kaggle_execution'] is False
          assert d['promotion']['solver_promotion'] is False
          print(json.dumps({
            'anchor':d['r225_anchor'],
            'reasons':d['abstention_reasons'],
            'support1':{k:v for k,v in d['support1_diagnostic'].items() if k!='examples'},
            'unseen':{k:v for k,v in d['unseen_base_diagnostic'].items() if k!='examples'},
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r226-ft09-r225-abstention-diagnostic
          path: |
            r226-ft09-r225-abstention-diagnostic.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
