name: ARC3 ft09 public-source replay audit 233
on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_source_replay_audit_233.py
      - .github/workflows/arc3-ft09-source-replay-audit-233.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-source-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact public runtime
        run: |
          python -m pip install --disable-pip-version-check 'arcengine==0.9.3'
      - name: Compile harness
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_ft09_source_replay_audit_233.py
      - name: Fetch pinned MIT game source and pinned public traces
        run: |
          set -euo pipefail
          mkdir -p source public_trace
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/axobase001/arc-agi-games/41b87fe1ea8d9819a44eea35172ffe28d6c5ffe6/ft09/0d8bbf25/ft09.py' \
            -o source/ft09.py
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'; game='ft09-0d8bbf25'
          for p in $(seq 0 19); do f="${game}_p${p}_events.jsonl"; curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"; test -s "public_trace/$f"; done
          sha256sum source/ft09.py > source/SHA256SUMS.txt
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
          head -n 18 source/ft09.py
      - name: Execute exact source replay audit
        run: |
          set -euo pipefail
          args=(); for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          PYTHONPATH=public_benchmark/arc3/kaggle_candidates python public_benchmark/arc3/kaggle_candidates/public_ft09_source_replay_audit_233.py \
            "${args[@]}" --source source/ft09.py --output r233-ft09-source-replay.json
      - name: Verify truth boundaries
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r233-ft09-source-replay.json'))
          assert d['schema']=='deus/arc3-ft09-public-source-replay-audit/1'
          t=d['truth']
          assert t['public_source_assisted_replay'] is True
          assert t['independent_generalization'] is False
          assert t['hidden_kaggle_score'] is False
          assert t['competition_submission'] is False
          assert d['decision']['solver_promotion'] is False
          assert d['decision']['kaggle_packaging'] is False
          print(json.dumps({'aggregate':d['aggregate'],'decision':d['decision']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r233-ft09-public-source-replay-audit
          path: |
            r233-ft09-source-replay.json
            source/SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
