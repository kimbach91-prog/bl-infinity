name: ARC3 Windows313 Offline Dependency Compatibility
on:
  push:
    branches: ['deus/arc3-win313-offline-deps-20260924']
    paths: ['.github/workflows/arc3-win313-offline-deps.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arc3-win313-dependency-compatibility
  cancel-in-progress: false
jobs:
  dependency-compatibility:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare exact dependency lock from retained public pack
        shell: python
        run: |
          from pathlib import Path
          p=Path('out'); p.mkdir()
          (p/'requirements.lock').write_text('''annotated-types==0.8.0
          arc-agi==0.9.9
          arcengine==0.9.3
          blinker==1.9.0
          certifi==2026.7.22
          charset-normalizer==3.5.1
          click==8.5.0
          contourpy==1.4.0
          cycler==0.12.1
          Flask==3.1.3
          fonttools==4.66.0
          idna==3.20
          itsdangerous==2.2.0
          Jinja2==3.1.6
          kiwisolver==1.5.1
          MarkupSafe==3.0.3
          matplotlib==3.11.2
          numpy==2.5.3
          packaging==26.3
          pillow==12.3.0
          pydantic==2.13.5
          pydantic_core==2.46.5
          pyparsing==3.3.3
          python-dateutil==2.9.0.post0
          python-dotenv==1.2.3
          requests==2.34.2
          six==1.17.0
          typing-inspection==0.4.4
          typing_extensions==4.16.0
          urllib3==2.8.0
          Werkzeug==3.1.8
          ''',encoding='utf-8')
      - name: Cache wheels for real Windows Python313
        shell: pwsh
        run: python -m pip download --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple -r out/requirements.lock -d out/wheelhouse
      - name: Fresh separate no-index installation
        shell: pwsh
        run: |
          python -m venv .offlinevenv
          ./.offlinevenv/Scripts/python.exe -m pip install --disable-pip-version-check --no-index --find-links out/wheelhouse -r out/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import compatibility without game play or external calls
        shell: pwsh
        run: |
          @'
          import sys,json,platform,importlib,importlib.metadata,hashlib,os
          from pathlib import Path
          attempts=[]
          def guard(event,args):
              if event in ('socket.connect','socket.getaddrinfo','socket.sendto'):
                  attempts.append(event);raise RuntimeError('NETWORK_DENIED')
              if event=='socket.bind':raise RuntimeError('LOCAL_BIND_DENIED')
          sys.addaudithook(guard)
          modules=['numpy','pydantic','pydantic_core','PIL','requests','dotenv','flask','matplotlib','arc_agi','arcengine']
          for name in modules:importlib.import_module(name)
          versions={}
          for line in Path('out/requirements.lock').read_text().splitlines():
              if not line.strip():continue
              name,expected=line.strip().split('==');actual=importlib.metadata.version(name)
              assert actual==expected,(name,expected,actual)
              versions[name]=actual
          assert not attempts
          receipt={'schema':'arc3-windows313-offline-dependencies/1','source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'python':platform.python_version(),'platform':platform.platform(),'no_index_install':True,'imports_passed':modules,'versions':versions,'outbound_attempts':attempts,'game_play':False,'llm_inference':False,'owner_machine_install':False,'score':None,'submission':False}
          Path('out/COMPATIBILITY.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          '@ | Set-Content compatibility.py -Encoding utf8
          ./.offlinevenv/Scripts/python.exe compatibility.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hash inventory and package
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('out');files=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():files.append({'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          assert len(list((root/'wheelhouse').glob('*.whl')))==31
          assert not any('cp312' in p.name for p in (root/'wheelhouse').glob('*.whl'))
          (root/'MANIFEST.json').write_text(json.dumps({'schema':'arc3-win313-dependency-pack/1','files':files},indent=2)+'\n')
          Path('dist').mkdir()
          p=Path(shutil.make_archive('dist/ARC3_WINDOWS313_OFFLINE_DEPS','zip','out'))
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('dist/SHA256SUMS.txt').write_text(digest+'  '+p.name+'\n')
          print('DEPENDENCIES_PACK_READY',p.stat().st_size,digest)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-windows313-offline-dependencies
          path: |
            dist/*
            out/COMPATIBILITY.json
            out/requirements.lock
          if-no-files-found: error
          retention-days: 3
