name: ARC3 Windows313 Offline Dependencies
'on':
  push:
    branches:
    - deus/arc3-win313-offline-deps-20260924
    paths:
    - .github/workflows/arc3-win313-offline-deps.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: arc3-win313-dependency-compatibility
  cancel-in-progress: false
jobs:
  dependency-compatibility:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Cache wheels then verify isolated no-index Windows installation
      shell: python
      run: |
        from pathlib import Path
        import subprocess,sys,hashlib,json,shutil
        root=Path('out');root.mkdir()
        (root/'requirements.lock').write_text('annotated-types==0.8.0\narc-agi==0.9.9\narcengine==0.9.3\nblinker==1.9.0\ncertifi==2026.7.22\ncharset-normalizer==3.5.1\nclick==8.5.0\ncontourpy==1.4.0\ncycler==0.12.1\nFlask==3.1.3\nfonttools==4.66.0\nidna==3.20\nitsdangerous==2.2.0\nJinja2==3.1.6\nkiwisolver==1.5.1\nMarkupSafe==3.0.3\nmatplotlib==3.11.2\nnumpy==2.5.3\npackaging==26.3\npillow==12.3.0\npydantic==2.13.5\npydantic_core==2.46.5\npyparsing==3.3.3\npython-dateutil==2.9.0.post0\npython-dotenv==1.2.3\nrequests==2.34.2\nsix==1.17.0\ntyping-inspection==0.4.4\ntyping_extensions==4.16.0\nurllib3==2.8.0\nWerkzeug==3.1.8\n',encoding='utf-8')
        subprocess.run([sys.executable,'-m','pip','download','--disable-pip-version-check','--only-binary=:all:','--index-url','https://pypi.org/simple','-r',str(root/'requirements.lock'),'-d',str(root/'wheelhouse')],check=True,timeout=300)
        subprocess.run([sys.executable,'-m','venv','.offlinevenv'],check=True,timeout=90)
        py=str(Path('.offlinevenv/Scripts/python.exe').resolve())
        subprocess.run([py,'-m','pip','install','--disable-pip-version-check','--no-index','--find-links',str(root/'wheelhouse'),'-r',str(root/'requirements.lock')],check=True,timeout=180)
        Path('compatibility.py').write_text("import sys,json,platform,importlib,importlib.metadata,os\nfrom pathlib import Path\nattempts=[]\ndef guard(event,args):\n    if event in ('socket.connect','socket.getaddrinfo','socket.sendto'):\n        attempts.append(event);raise RuntimeError('NETWORK_DENIED')\n    if event=='socket.bind':raise RuntimeError('BIND_DENIED')\nsys.addaudithook(guard)\nmodules=['numpy','pydantic','pydantic_core','PIL','requests','dotenv','flask','matplotlib','arc_agi','arcengine']\nfor name in modules:importlib.import_module(name)\nversions={}\nfor line in Path('out/requirements.lock').read_text().splitlines():\n    name,expected=line.split('==');actual=importlib.metadata.version(name)\n    assert actual==expected,(name,actual,expected)\n    versions[name]=actual\nassert not attempts\nreceipt={'schema':'arc3-windows313-offline-dependencies/1','python':platform.python_version(),'platform':platform.platform(),'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'no_index_install':True,'imports_passed':modules,'versions':versions,'outbound_attempts':attempts,'game_play':False,'llm_inference':False,'owner_machine_install':False,'score':None,'submission':False}\nPath('out/COMPATIBILITY.json').write_text(json.dumps(receipt,indent=2)+'\\n')\nprint(json.dumps(receipt,sort_keys=True))\n",encoding='utf-8')
        subprocess.run([py,'compatibility.py'],check=True,timeout=90)
        assert len(list((root/'wheelhouse').glob('*.whl')))==31
        assert not any('cp312' in p.name for p in (root/'wheelhouse').glob('*.whl'))
        files=[{'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
        (root/'MANIFEST.json').write_text(json.dumps({'schema':'arc3-win313-dependency-pack/1','files':files},indent=2)+'\n')
        Path('dist').mkdir()
        p=Path(shutil.make_archive('dist/ARC3_WINDOWS313_OFFLINE_DEPS','zip','out'))
        digest=hashlib.sha256(p.read_bytes()).hexdigest()
        Path('dist/SHA256SUMS.txt').write_text(digest+'  '+p.name+'\n')
        print('DEPENDENCIES_PACK_READY',p.stat().st_size,digest)
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: arc3-windows313-offline-dependencies
        path: |-
          dist/*
          out/COMPATIBILITY.json
          out/requirements.lock
        if-no-files-found: error
        retention-days: 3
