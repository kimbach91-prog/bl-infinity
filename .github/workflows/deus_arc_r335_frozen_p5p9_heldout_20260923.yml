name: DEUS ARC R335 frozen p5-p9 heldout no-retrain
on:
  push:
    branches:
      - deus/r335-sourcefree-p0p4-gate-20260923
    paths:
      - '.github/workflows/deus_arc_r335_frozen_p5p9_heldout_20260923.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen verifier and model
        uses: actions/checkout@v4
        with:
          path: deus
      - name: Checkout pinned public p5-p9 traces only
        uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: tufa
          sparse-checkout: |
            example-run/artifacts/tr87-cd924810_p5_events.jsonl
            example-run/artifacts/tr87-cd924810_p6_events.jsonl
            example-run/artifacts/tr87-cd924810_p7_events.jsonl
            example-run/artifacts/tr87-cd924810_p8_events.jsonl
            example-run/artifacts/tr87-cd924810_p9_events.jsonl
          sparse-checkout-cone-mode: false
      - name: Enforce frozen heldout boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(find tufa/example-run/artifacts -maxdepth 1 -type f -name 'tr87-cd924810_p[5-9]_events.jsonl' | wc -l)" -eq 5
          test "$(find tufa/example-run/artifacts -maxdepth 1 -type f -name 'tr87-cd924810_p*_events.jsonl' | wc -l)" -eq 5
          ! find tufa/example-run/artifacts -maxdepth 1 -type f \( -name 'tr87-cd924810_p[0-4]_events.jsonl' -o -name 'tr87-cd924810_p1[0-9]_events.jsonl' \) | grep -q .
          test "$(git -C deus rev-parse HEAD)" = "$(git -C deus rev-parse HEAD)"
      - name: Execute frozen no-retrain heldout verifier
        run: |
          mkdir -p out
          python deus/public_benchmark/arc3/kaggle_candidates/r335_frozen_model_heldout_verify.py \
            --root tufa/example-run/artifacts \
            --model deus/public_benchmark/arc3/kaggle_candidates/r335_frozen_p0p4_model_v1.json \
            --out out/r335_frozen_p5p9_heldout.json | tee out/aggregate.json
          sha256sum deus/public_benchmark/arc3/kaggle_candidates/r335_frozen_p0p4_model_v1.json > out/FROZEN_MODEL_SHA256.txt
          sha256sum deus/public_benchmark/arc3/kaggle_candidates/r335_frozen_model_heldout_verify.py > out/VERIFIER_SHA256.txt
          sha256sum out/* | tee out/SHA256SUMS.txt
      - name: Upload heldout artifact
        uses: actions/upload-artifact@v4
        with:
          name: r335-frozen-p5p9-heldout-no-retrain
          path: out/
          if-no-files-found: error
          retention-days: 30
