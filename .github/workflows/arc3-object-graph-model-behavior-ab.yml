name: ARC3 object-graph same-model behavior A/B

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/model_behavior_ab.py
      - public_benchmark/arc3/kaggle_candidates/object_graph_representation.py
      - .github/workflows/arc3-object-graph-model-behavior-ab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-model-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile harness
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/object_graph_representation.py \
            public_benchmark/arc3/kaggle_candidates/model_behavior_ab.py
      - name: Run fixed-budget same-model A/B
        id: ab
        continue-on-error: true
        run: |
          python public_benchmark/arc3/kaggle_candidates/model_behavior_ab.py \
            --receipt arc3-object-graph-model-behavior-ab.json
      - name: Verify truth boundary and emit summary
        if: always()
        shell: bash
        run: |
          test -s arc3-object-graph-model-behavior-ab.json
          jq -e '
            .schema=="deus-arc3-object-graph-model-behavior-ab/1"
            and .truth.synthetic_public_only==true
            and .truth.hidden_kaggle_data_read==false
            and .truth.kaggle_submission_attempted==false
            and .truth.submission_quota_spent==false
            and .truth.leaderboard_score_observed==false
          ' arc3-object-graph-model-behavior-ab.json >/dev/null
          jq '{provider,requested_model,fixtures,arms,promotion_gate,truth}' arc3-object-graph-model-behavior-ab.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-object-graph-model-behavior-ab-receipt
          path: arc3-object-graph-model-behavior-ab.json
          if-no-files-found: error
      - name: Fail closed on provider-inconclusive execution
        if: always()
        shell: bash
        run: |
          gate="$(jq -r '.promotion_gate' arc3-object-graph-model-behavior-ab.json)"
          case "$gate" in
            INCONCLUSIVE_PROVIDER_*) exit 2 ;;
            *) exit 0 ;;
          esac
