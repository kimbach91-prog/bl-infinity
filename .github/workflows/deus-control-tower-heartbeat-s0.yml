name: DEUS Control Tower Heartbeat S0

on:
  push:
    paths:
      - ".github/workflows/deus-control-tower-heartbeat-s0.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: deus-control-tower-heartbeat-s0
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout controller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Advance durable S0 controller state
        id: controller
        shell: bash
        env:
          DEUS_EVENT: ${{ github.event_name }}
          DEUS_RUN_ID: ${{ github.run_id }}
          DEUS_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEUS_REPOSITORY: ${{ github.repository }}
          DEUS_SHA: ${{ github.sha }}
          STATE_BRANCH: deus-control-state-s0
        run: |
          set -euo pipefail
          git config user.name "deus-control-s0[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin "${STATE_BRANCH}:${STATE_BRANCH}" 2>/dev/null; then
            git switch "${STATE_BRANCH}"
          else
            git switch --orphan "${STATE_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p .deus-control-s0
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          state_path = Path(".deus-control-s0/controller-state.json")
          previous = {}
          if state_path.exists():
              previous = json.loads(state_path.read_text(encoding="utf-8"))

          prev_seq = int(previous.get("seq", 0))
          seq = prev_seq + 1
          now = datetime.now(timezone.utc)
          run_id = str(os.environ["DEUS_RUN_ID"])
          token_input = f"DEUS-GITHUB-CONTROLLER-S0-V1|{seq}|{run_id}|{os.environ['DEUS_RUN_ATTEMPT']}"
          fence_token = hashlib.sha256(token_input.encode()).hexdigest()

          state = {
              "schema": "deus-controller-state/1",
              "controller_id": "github-actions-public-s0",
              "failure_domain": "github-actions",
              "data_class": "S0_PUBLIC",
              "seq": seq,
              "previous_seq": prev_seq,
              "fence_token_sha256": fence_token,
              "event": os.environ["DEUS_EVENT"],
              "run_id": run_id,
              "run_attempt": os.environ["DEUS_RUN_ATTEMPT"],
              "repository": os.environ["DEUS_REPOSITORY"],
              "source_sha": os.environ["DEUS_SHA"],
              "observed_at": now.isoformat(),
              "lease_until": (now + timedelta(minutes=7)).isoformat(),
              "state_branch": os.environ["STATE_BRANCH"],
              "protected_payload": False,
              "canonical_write": False,
              "controller_action": "S0_HEARTBEAT_AND_FENCE_ADVANCE",
              "truth": "AUTONOMOUS_RUN_WITH_DURABLE_STATE; NOT_DEUS_CANONICAL_AUTHORITY"
          }
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          Path("controller-receipt.json").write_text(json.dumps(state, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("DEUS_CONTROLLER_RECEIPT=" + json.dumps(state, separators=(",", ":")))
          PY

          git add .deus-control-s0/controller-state.json
          git commit -m "controller: advance S0 fence state run ${DEUS_RUN_ID}"
          git push origin HEAD:"${STATE_BRANCH}"

      - name: Upload controller receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deus-controller-s0-${{ github.run_id }}-${{ github.run_attempt }}
          path: controller-receipt.json
          if-no-files-found: error
          retention-days: 30

