name: ARC3 R260 re86 transport error diagnostic

on:
  push:
    branches:
      - deus/r260-re86-transport-error-diag-20260923
    paths:
      - .github/workflows/arc3-r260-re86-transport-error-diag.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-r260-re86:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py public_benchmark/arc3/kaggle_candidates/public_action_conditional_markov_gate_251.py public_benchmark/arc3/kaggle_candidates/public_component_delta_operator_254.py public_benchmark/arc3/kaggle_candidates/public_object_motion_diag_256.py public_benchmark/arc3/kaggle_candidates/public_selective_object_transport_257.py public_benchmark/arc3/kaggle_candidates/public_transport_error_diag_260.py
      - name: Stage re86 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 9); do
            f="re86-8af5384d_p${p}_events.jsonl"
            src="upstream-duck/example-run/artifacts/$f"
            test -s "$src"; cp "$src" "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute diagnostic
        shell: bash
        run: |
          set -euo pipefail
          args=(); for f in public_trace/re86-8af5384d_p*_events.jsonl; do args+=(--input "$f"); done
          test "${#args[@]}" -eq 20
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_transport_error_diag_260.py "${args[@]}" --output r260-re86-transport-error.json 2> >(tee r260-runtime.txt >&2) | tee r260-stdout.txt
      - name: Verify and digest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('r260-re86-transport-error.json').read_text())
          assert d['schema']=='deus/arc3-r260-transport-error-diagnostic/1'
          t=d['truth']; assert t['public_trace_only'] and not t['game_source_read'] and not t['p10_p19_read'] and not t['kaggle_execution'] and not t['competition_submission']
          Path('r260-verdict.json').write_text(json.dumps({'verdict':'DIAGNOSTIC_ONLY_NO_PROMOTION','best':{a:x['best_variant'] for a,x in d['actions'].items()}},indent=2,sort_keys=True)+'\n')
          PY
          sha256sum r260-re86-transport-error.json r260-verdict.json r260-runtime.txt r260-stdout.txt public_trace/SHA256SUMS.txt > R260_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r260-re86-transport-error-diag
          path: |
            r260-re86-transport-error.json
            r260-verdict.json
            r260-runtime.txt
            r260-stdout.txt
            R260_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
