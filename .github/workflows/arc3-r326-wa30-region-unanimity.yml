name: ARC3 R326 WA30 region unanimity
on:
  push:
    branches: [deus/r326-wa30-region-unanimity-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_wa30_region_unanimity_326.py
      - .github/workflows/arc3-r326-wa30-region-unanimity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r326:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage exact WA30 p0-p4 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 4); do
            f="wa30-ee6fef47_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "public_trace/${f}"
          done
          test "$(find public_trace -name '*_events.jsonl' | wc -l)" -eq 5
          ! find public_trace -name '*_p[5-9]_events.jsonl' | grep -q .
          ! find public_trace -name '*_p1[0-9]_events.jsonl' | grep -q .
      - name: Execute R326
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in $(find public_trace -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_wa30_region_unanimity_326.py "${args[@]}" --output r326.json 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r326.json'))
          assert d['schema']=='deus/arc3-r326-wa30-region-unanimity/1'
          p=d['protocol']; t=d['truth']
          assert p['p5_p9_staged_or_read'] is False and p['p10_p19_staged_or_read'] is False
          assert not t['p5_p9_read'] and not t['p10_p19_read']
          assert not t['whole_game_solver_promotion'] and not t['kaggle_execution'] and not t['competition_submission']
          print(json.dumps({'verdict':d['verdict'],'best_mode':d['best_mode'],'modes':d['modes']},sort_keys=True))
          PY
          sha256sum r326.json runtime.txt stdout.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r326-wa30-region-unanimity
          path: |
            r326.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
          retention-days: 30
