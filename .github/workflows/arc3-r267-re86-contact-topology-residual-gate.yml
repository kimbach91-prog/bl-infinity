name: ARC3 R267 re86 contact topology residual gate

on:
  push:
    branches:
      - deus/r267-re86-contact-topology-residual-gate-20260923
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_contact_topology_residual_gate_267.py
      - .github/workflows/arc3-r267-re86-contact-topology-residual-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-r267-re86:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          python -m py_compile             public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py             public_benchmark/arc3/kaggle_candidates/public_action_conditional_markov_gate_251.py             public_benchmark/arc3/kaggle_candidates/public_component_delta_operator_254.py             public_benchmark/arc3/kaggle_candidates/public_object_motion_diag_256.py             public_benchmark/arc3/kaggle_candidates/public_selective_object_transport_257.py             public_benchmark/arc3/kaggle_candidates/public_contact_topology_residual_gate_267.py
      - name: Stage re86 p0-p19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 19); do
            f="re86-8af5384d_p${p}_events.jsonl"
            src="upstream-duck/example-run/artifacts/$f"
            test -s "$src"
            cp "$src" "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute R267 gate
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/re86-8af5384d_p*_events.jsonl; do args+=(--input "$f"); done
          test "${#args[@]}" -eq 40
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_contact_topology_residual_gate_267.py             "${args[@]}" --output r267-re86-contact-topology-residual.json             2> >(tee r267-runtime.txt >&2) | tee r267-stdout.txt
      - name: Verify
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("r267-re86-contact-topology-residual.json").read_text())
          assert d["schema"]=="deus/arc3-r267-contact-topology-residual-gate/1"
          assert list(d["games"])==["re86-8af5384d"]
          t=d["truth"]
          assert t["public_trace_only"] and not t["game_source_read"]
          assert t["selection_uses_p0_p9_only"] and t["p10_p19_never_updates_selection_or_model"]
          assert not t["independent_generalization_claim"] and not t["kaggle_execution"]
          assert not t["competition_submission"] and not t["submission_quota_spent"]
          h=d["games"]["re86-8af5384d"]["heldout"]
          verdict="PASS_NONDOMINATED_PUBLIC_OFFLINE" if d["non_dominated_source_side_gain"] else "NO_PROMOTION"
          Path("r267-verdict.json").write_text(json.dumps({
            "verdict":verdict,
            "candidate_predictions":h.get("candidate_predictions",0),
            "candidate_correct":h.get("candidate_correct",0),
            "candidate_wrong":h.get("candidate_wrong",0),
            "selected_by_action":d["games"]["re86-8af5384d"]["selected_by_action"],
            "truth_lane":"PUBLIC_OFFLINE_PUBLIC_DEVELOPMENT"
          },indent=2,sort_keys=True)+"\n")
          print(Path("r267-verdict.json").read_text())
          PY
          sha256sum r267-re86-contact-topology-residual.json r267-verdict.json r267-runtime.txt r267-stdout.txt public_trace/SHA256SUMS.txt > R267_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r267-re86-contact-topology-residual-gate
          path: |
            r267-re86-contact-topology-residual.json
            r267-verdict.json
            r267-runtime.txt
            r267-stdout.txt
            R267_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
