name: DEUS CX-001 causal work elimination benchmark

on:
  push:
    branches:
      - "main"
      - "deus/cx001-runtime-bench-20260923"
    paths:
      - "benchmarks/cx001_benchmark.py"
      - ".github/workflows/deus-cx001-causal-work-elimination.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deus-cx001-causal-work-elimination-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        regime:
          - SPARSE_CAUSAL_CONE
          - DENSE_GLOBAL_CAUSE
          - HIDDEN_LONG_RANGE_EDGE
          - FEEDBACK_SCC
          - MULTISCALE_LATENT_EFFECT
          - REVISION_INVALIDATION
        trial: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Execute CX-001 matched benchmark
        shell: bash
        env:
          REGIME: ${{ matrix.regime }}
          TRIAL: ${{ matrix.trial }}
        run: |
          set -euo pipefail
          out="cx-artifacts/${REGIME}/trial-${TRIAL}/receipt.json"
          python3 benchmarks/cx001_benchmark.py \
            --regime "${REGIME}" \
            --trial "${TRIAL}" \
            --output "${out}"

      - name: Upload CX-001 receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cx001-${{ matrix.regime }}-trial-${{ matrix.trial }}
          path: cx-artifacts/${{ matrix.regime }}/trial-${{ matrix.trial }}/receipt.json
          retention-days: 30
