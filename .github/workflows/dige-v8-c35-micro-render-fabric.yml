name: DIGE V8 C35 1T Micro Render Fabric

on:
  pull_request:
    paths:
      - '.github/workflows/dige-v8-c35-micro-render-fabric.yml'
      - 'experiments/dige-v8-executor-capsule/blender_render_v8.py'
      - 'experiments/dige-v8-executor-capsule/compile_c35_micro_render_plan.mjs'
      - 'experiments/dige-v8-executor-capsule/reduce_sample_shards_blender.py'
      - 'runtime/federation/test/dige-micro-render-plan.test.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: dige-v8-c35-micro-render-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  compile-micro-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.compile.outputs.matrix }}
      physical_shards: ${{ steps.compile.outputs.physical_shards }}
      plan_digest: ${{ steps.compile.outputs.plan_digest }}
      logical_microcells: ${{ steps.compile.outputs.logical_microcells }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: compile
        env:
          DEUS_LOGICAL_NAMESPACE: '1000000000000'
          DEUS_SIMUL_VCPU_LB: '28'
          DEUS_GPU_COUNT: '0'
          DEUS_VRAM_GIB: '0'
          DIGE_RENDER_VCPU_PER_SHARD: '4'
          DIGE_MAX_PHYSICAL_SHARDS: '7'
          DIGE_FRAME_WIDTH: '900'
          DIGE_FRAME_HEIGHT: '900'
          DIGE_TOTAL_SAMPLES: '384'
          DIGE_LOGICAL_PASS_COUNT: '1'
          DIGE_BASE_SEED: '20263030'
          DIGE_MICRO_PLAN_OUT: 'experiments/dige-v8-executor-capsule/runtime/DIGE_C35_MICRO_RENDER_PLAN.json'
        run: |
          set -euxo pipefail
          node experiments/dige-v8-executor-capsule/compile_c35_micro_render_plan.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('experiments/dige-v8-executor-capsule/runtime/DIGE_C35_MICRO_RENDER_PLAN.json','utf8'));
          if(p.logicalNamespace!=='1000000000000') throw new Error('1T namespace missing');
          if(p.logicalMicrocells!=='311040000') throw new Error('logical microcell count mismatch');
          if(p.physicalShards!==7) throw new Error('expected seven physical shards');
          if(p.matrix.reduce((s,x)=>s+x.samples,0)!==384) throw new Error('sample partition mismatch');
          if(!p.matrix.every(x=>x.execution==='CPU')) throw new Error('GPU0 snapshot must compile to CPU');
          console.log(JSON.stringify({verdict:'PASS',planDigest:p.planDigest,physicalShards:p.physicalShards,logicalMicrocells:p.logicalMicrocells,coalescingFactor:p.coalescingFactor}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: DIGE-C35-MICRO-PLAN-${{ github.event.pull_request.head.sha }}
          path: experiments/dige-v8-executor-capsule/runtime/DIGE_C35_MICRO_RENDER_PLAN.json
          if-no-files-found: error
          retention-days: 14

  c35-sample-shard:
    needs: compile-micro-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include: ${{ fromJSON(needs.compile-micro-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Reuse C34 verified shared runtime
        uses: actions/download-artifact@v4
        with:
          name: DIGE-C34-SHARED-RUNTIME
          path: experiments/dige-v8-executor-capsule/runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '35591781070'

      - name: Resolve Blender 5.2.2
        run: |
          set -euxo pipefail
          ROOT=https://download.blender.org/release/Blender5.2
          TAR=blender-5.2.2-linux-x64.tar.xz
          curl -fL --retry 4 --retry-delay 3 "$ROOT/$TAR" -o "/tmp/$TAR"
          curl -fL --retry 4 --retry-delay 3 "$ROOT/blender-5.2.2.sha256" -o /tmp/blender.sha256
          grep " $TAR$" /tmp/blender.sha256 > /tmp/blender.expected
          (cd /tmp && sha256sum -c blender.expected)
          tar -xf "/tmp/$TAR" -C /tmp
          echo "BLENDER=/tmp/blender-5.2.2-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Render one linear sample shard
        working-directory: experiments/dige-v8-executor-capsule
        env:
          DIGE_CYCLES_DEVICE: CPU
          DIGE_RENDER_SET: HERO_ONLY
          DIGE_SEARCH_ONLY: '0'
          DIGE_SAMPLE_SHARD_MODE: '1'
          DIGE_SAMPLE_SHARD_ID: ${{ matrix.id }}
          DIGE_SAMPLE_SHARD_SAMPLES: ${{ matrix.samples }}
          DIGE_SAMPLE_SHARD_SEED: ${{ matrix.seed }}
          DIGE_OUTPUT_TAG: c35_micro_${{ matrix.id }}
          DIGE_C18_HYBRID_BULK: '1'
          DIGE_C19_HUMANIZATION: '0'
          DIGE_C19_PHOTO_LIGHTING: '0'
          DIGE_C20_VISUAL_REPAIR: '0'
          DIGE_C21_NATURAL_DETAIL: '0'
          DIGE_C22_PHYSICAL_SKIN: '0'
          DIGE_C22_LANDMARK_GROOM: '0'
          DIGE_C22_HAIR_MASS_WARP: '0'
          DIGE_C23_CALIBRATED_EYES: '0'
          DIGE_C23_FACE_PLANES: '0'
          DIGE_C23_HAIRLINE_REPAIR: '0'
          DIGE_C24_SURFACE_EYES: '0'
          DIGE_C24_SOURCE_ALBEDO: '0'
          DIGE_C24_HAIRLINE_REPAIR: '0'
          DIGE_C25_MATURE_STACK: '1'
          DIGE_C25_GROOM_CLIP: '0'
          DIGE_C26_PHOTOMETRIC: '1'
          DIGE_C26_SAFE_GROOM: '0'
          DIGE_C26_FIBER_GROOM: '0'
          DIGE_C27_SURFACE_FIBERS: '0'
          DIGE_C27_NATIVE_INTERFACES: '0'
          DIGE_C28_GNM_HEAD: '1'
          DIGE_C28_GNM_DIR: runtime/gnm_c28
          DIGE_C28_HEAD_SCALE_BIAS: '1.00'
          DIGE_C28_HEAD_Z_OFFSET: '0.000'
          DIGE_C29_GNM_PRESENTATION: '1'
          DIGE_C30_GNM_SEMANTIC_IDENTITY: '1'
          DIGE_C31_GNM_FACE_APPEARANCE: '1'
          DIGE_C32_GNM_DERMAL_HAIR: '1'
          DIGE_C33_GUIDE_GATED_GROOM: '1'
          DIGE_C33_GUIDE_MAX_DIST: '0.021'
          DIGE_C33_SCALP_Z_DROP: '0.120'
          DIGE_GNM_COMMIT: a424b5153eec9154f3dfa5ee7f214e5817918d54
          DIGE_MPFB2_SRC: runtime/shared_mpfb2_src
          DIGE_MPFB2_COMMIT: b58176c661a9680294eb75f127842cb8378e4974
          DIGE_C25_MHMAT_PATH: runtime/assets/c25_mpfb/c25_skin.mhmat
          DIGE_HAIR_ASSET_KEY: hair_short03
          DIGE_HAIR_STRANDS_PER_ROOT: '24'
          DIGE_HAIR_ACCENT_LENGTH_SCALE: '0.88'
          DIGE_HAIR_FRONT_SAFE_BLEND: '0.94'
          DIGE_SKIN_ALBEDO_PATH: runtime/assets/young_eurasian_female_diffuse.png
          DIGE_SKIN_ALBEDO_SHA256: e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf
          DIGE_SKIN_ALBEDO_NAME: onlytheghosts_young_eurasian_female
          DIGE_SKIN_SSS_WEIGHT: '0.045'
          DIGE_SKIN_SSS_SCALE: '0.0009'
          DIGE_SKIN_ROUGH_MIN: '0.44'
          DIGE_SKIN_ROUGH_MAX: '0.62'
          DIGE_SKIN_ALBEDO_SAT: '1.00'
          DIGE_SKIN_ALBEDO_VALUE: '1.00'
          DIGE_EYE_TEX_SAT: '0.78'
          DIGE_EYE_TEX_VALUE: '0.64'
          DIGE_HAIR_TEX_SAT: '0.56'
          DIGE_HAIR_TEX_VALUE: '0.23'
          DIGE_FACE_MESO_SCALE: '1.00'
          DIGE_SKIN_TONE_R: '0.60'
          DIGE_SKIN_TONE_G: '0.33'
          DIGE_SKIN_TONE_B: '0.22'
          DIGE_SKIN_TONE_MIX: '0.08'
          DIGE_SKIN_MICRO_STRENGTH: '0.20'
          DIGE_SKIN_MESO_FREQ: '95'
          DIGE_SKIN_PORE_FREQ: '2800'
          DIGE_SKIN_MICRO_FREQ: '9000'
          DIGE_SKIN_BUMP_DISTANCE: '0.000055'
          DIGE_SKIN_COAT_WEIGHT: '0.001'
          DIGE_SKIN_COAT_ROUGHNESS: '0.45'
          DIGE_RENDER_SEED: '20263030'
          DIGE_RUNTIME_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python blender_render_v8.py | tee runtime/c35_micro_${{ matrix.id }}.log

      - name: Verify shard receipt
        working-directory: experiments/dige-v8-executor-capsule
        env:
          SHARD_ID: ${{ matrix.id }}
          SHARD_SAMPLES: ${{ matrix.samples }}
          SHARD_SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('runtime/renders/c35_micro_'+os.environ['SHARD_ID'])
          r=json.loads((root/'DIGE_V8_RENDER_RECEIPT.json').read_text())
          assert r['sample_shard_mode'] is True
          assert r['sample_shard_id']==os.environ['SHARD_ID']
          assert r['sample_shard_samples']==int(os.environ['SHARD_SAMPLES'])
          assert r['sample_shard_seed']==int(os.environ['SHARD_SEED'])
          assert r['device']=='CPU'
          assert r['hair_surface_contract']['c32_lower_central_root_count']==0
          assert r['denoise_ab']['sample_shard'] is True
          assert r['denoise_ab']['denoised'] is None
          assert len(r['outputs'])==1 and r['outputs'][0]['sample_shard'] is True
          assert (root/('DIGE_SAMPLE_SHARD_'+os.environ['SHARD_ID']+'.exr')).is_file()
          print(json.dumps({'verdict':'PASS','id':os.environ['SHARD_ID'],'samples':r['sample_shard_samples'],'seed':r['sample_shard_seed'],'sha256':r['outputs'][0]['sha256']}))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: DIGE-C35-SHARD-${{ matrix.id }}-${{ github.event.pull_request.head.sha }}
          path: |
            experiments/dige-v8-executor-capsule/runtime/renders/c35_micro_${{ matrix.id }}/DIGE_SAMPLE_SHARD_*.exr
            experiments/dige-v8-executor-capsule/runtime/renders/c35_micro_${{ matrix.id }}/DIGE_V8_RENDER_RECEIPT.json
            experiments/dige-v8-executor-capsule/runtime/c35_micro_${{ matrix.id }}.log
          if-no-files-found: error
          retention-days: 14

  reduce-micro-shards:
    needs: [compile-micro-plan, c35-sample-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: DIGE-C35-SHARD-*-${{ github.event.pull_request.head.sha }}
          path: micro-shards
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: DIGE-C35-MICRO-PLAN-${{ github.event.pull_request.head.sha }}
          path: micro-plan

      - name: Resolve Blender 5.2.2
        run: |
          set -euxo pipefail
          ROOT=https://download.blender.org/release/Blender5.2
          TAR=blender-5.2.2-linux-x64.tar.xz
          curl -fL --retry 4 --retry-delay 3 "$ROOT/$TAR" -o "/tmp/$TAR"
          curl -fL --retry 4 --retry-delay 3 "$ROOT/blender-5.2.2.sha256" -o /tmp/blender.sha256
          grep " $TAR$" /tmp/blender.sha256 > /tmp/blender.expected
          (cd /tmp && sha256sum -c blender.expected)
          tar -xf "/tmp/$TAR" -C /tmp
          echo "BLENDER=/tmp/blender-5.2.2-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Reduce seven linear EXR shards
        run: |
          set -euxo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 1             --python experiments/dige-v8-executor-capsule/reduce_sample_shards_blender.py --             --root micro-shards             --out-dir experiments/dige-v8-executor-capsule/runtime/c35_micro_reduce             --expected-samples 384

      - name: Evaluate combined preview
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -q pillow numpy
          python experiments/dige-v8-executor-capsule/evaluate_c33_candidate.py             --image experiments/dige-v8-executor-capsule/runtime/c35_micro_reduce/DIGE_C35_COMBINED_PREVIEW.png             --out experiments/dige-v8-executor-capsule/runtime/c35_micro_reduce/DIGE_C35_COMBINED_VISUAL_METRICS.json             --candidate-id c35-micro             --guide-dist 0.021

      - name: Build micro-fabric runtime receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100"             > /tmp/jobs.json
          python - <<'PY'
          import json, pathlib, datetime
          plan=json.load(open('micro-plan/DIGE_C35_MICRO_RENDER_PLAN.json'))
          reduce=json.load(open('experiments/dige-v8-executor-capsule/runtime/c35_micro_reduce/DIGE_C35_MICRO_REDUCE_RECEIPT.json'))
          visual=json.load(open('experiments/dige-v8-executor-capsule/runtime/c35_micro_reduce/DIGE_C35_COMBINED_VISUAL_METRICS.json'))
          jobs=json.load(open('/tmp/jobs.json'))['jobs']
          shard=[j for j in jobs if j['name'].startswith('c35-sample-shard')]
          if len(shard)!=7: raise SystemExit(f'expected 7 shard jobs, got {len(shard)}')
          def ts(x): return datetime.datetime.fromisoformat(x.replace('Z','+00:00')).timestamp()
          events=[]
          durations=[]
          for j in shard:
            s,e=ts(j['started_at']),ts(j['completed_at'])
            events += [(s,1),(e,-1)]
            durations.append(e-s)
          events.sort(key=lambda x:(x[0],-x[1]))
          active=mx=0
          for _,d in events:
            active+=d; mx=max(mx,active)
          window=max(ts(j['completed_at']) for j in shard)-min(ts(j['started_at']) for j in shard)
          receipt={
            'schema':'deus-dige-micro-render-fabric-receipt/1.0',
            'verdict':'PASS',
            'planDigest':plan['planDigest'],
            'logicalNamespace':plan['logicalNamespace'],
            'logicalMicrocells':plan['logicalMicrocells'],
            'physicalShards':plan['physicalShards'],
            'coalescingFactor':plan['coalescingFactor'],
            'totalSamples':reduce['total_samples'],
            'observedMaxShardJobOverlap':mx,
            'shardJobWallclockWindowSeconds':window,
            'sumShardJobSeconds':sum(durations),
            'parallelismObservationRatio':sum(durations)/window if window>0 else None,
            'combinedExr':reduce['combined_exr'],
            'combinedPng':reduce['combined_png'],
            'combinedVisualMetrics':visual,
            'truthBoundary':'PROVES_DIGE_FINAL_FRAME_SAMPLE_SPACE_WAS_DISTRIBUTED_AND_REDUCED_ACROSS_BOUNDED_PHYSICAL_SHARDS__LOGICAL_MICROCELLS_NE_PHYSICAL_WORKERS__JOB_TIMESTAMPS_INCLUDE_SETUP_OVERHEAD',
          }
          out=pathlib.Path('experiments/dige-v8-executor-capsule/runtime/c35_micro_reduce/DIGE_C35_MICRO_FABRIC_RECEIPT.json')
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: DIGE-C35-MICRO-FABRIC-${{ github.event.pull_request.head.sha }}
          path: |
            experiments/dige-v8-executor-capsule/runtime/c35_micro_reduce/*
            micro-plan/DIGE_C35_MICRO_RENDER_PLAN.json
          if-no-files-found: error
          retention-days: 14
