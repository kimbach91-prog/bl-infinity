name: ARC3 public relational-signature 163

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py
      - public_benchmark/arc3/kaggle_candidates/public_fullboard_translation_program_160.py
      - public_benchmark/arc3/kaggle_candidates/public_fullboard_markov_cache_161.py
      - public_benchmark/arc3/kaggle_candidates/public_relational_signature_prequential_163.py
      - .github/workflows/arc3-public-relational-signature-163.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relational-signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_fullboard_translation_program_160.py \
            public_benchmark/arc3/kaggle_candidates/public_relational_signature_prequential_163.py
      - name: Download exact pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in ar25-0c556536_p0_events.jsonl ar25-0c556536_p10_events.jsonl ar25-0c556536_p11_events.jsonl; do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute relational-signature diagnostic
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_relational_signature_prequential_163.py \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" \
            --output "$GITHUB_WORKSPACE/relational-signature-public-163.json"
      - name: Enforce truth boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('relational-signature-public-163.json'))
          assert d['schema']=='deus/arc3-public-relational-signature-prequential/1'
          assert d['rung']==163
          t=d['truth']
          assert t['exact_cache_misses_only_for_extension'] is True
          assert t['prediction_uses_preaction_and_prior_outcomes_only'] is True
          assert t['current_outcome_used_only_for_scoring_and_post_prediction_learning'] is True
          assert t['independent_generalization_claim'] is False
          assert t['kaggle_execution'] is False
          assert t['submission_quota_spent'] is False
          print(json.dumps({'rung':163,'gate':d['diagnostic_gate'],'aggregate':d['aggregate'],'truth':'PUBLIC_UNSEEN_STATE_EXECUTABLE_DIAGNOSTIC_ONLY'},sort_keys=True))
          PY
      - name: Upload rung 163 diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-relational-signature-163
          path: |
            relational-signature-public-163.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
