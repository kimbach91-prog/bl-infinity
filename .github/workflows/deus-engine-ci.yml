name: DEUS Engine v1.1 CI

on:
  push:
    branches:
      - proto/deus-engine-v1
    paths:
      - 'experiments/deus-engine-v1/**'
      - '.github/workflows/deus-engine-ci.yml'
      - '.github/workflows/deus-gcp-candidate.yml'
  pull_request:
    paths:
      - 'experiments/deus-engine-v1/**'
      - '.github/workflows/deus-engine-ci.yml'
      - '.github/workflows/deus-gcp-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile experimental engine
        run: python -m compileall experiments/deus-engine-v1
      - name: BL-INF-EGE regression tests
        working-directory: experiments/deus-engine-v1
        run: python -m unittest -v test_epistemic_grand_ending.py
      - name: Kernel-only smoke test
        working-directory: experiments/deus-engine-v1
        run: >-
          python engine.py
          "CI kernel-only smoke: distinguish same outcome from same reasoning and attack exhausted option spaces"
          --seed 7
          --backend none
      - name: Recombination smoke test
        working-directory: experiments/deus-engine-v1
        run: python recombiner.py
      - name: Provenance smoke test
        working-directory: experiments/deus-engine-v1
        run: python provenance.py
      - name: Writing-lab smoke test
        working-directory: experiments/deus-engine-v1
        run: python writing_lab.py

# Heavy inference/training is intentionally absent here. Use an authorized
# owner-controlled GPU runtime later and return sanitized metrics/artifacts only.
