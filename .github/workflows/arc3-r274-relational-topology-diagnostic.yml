name: ARC3 R274 relational topology diagnostic
on:
  push:
    branches: [deus/r274-relational-topology-diagnostic-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_relational_topology_diag_274.py
      - .github/workflows/arc3-r274-relational-topology-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag-r274:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py public_benchmark/arc3/kaggle_candidates/public_ui_mask_markov_diag_268.py public_benchmark/arc3/kaggle_candidates/public_relational_topology_diag_274.py
      - name: Stage unresolved 11 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('upstream-duck/example-run/artifacts'); dst=Path('public_trace')
          signal={'ar25-0c556536','ft09-0d8bbf25','ka59-38d34dbb','lf52-271a04aa','lp85-305b61c3','r11l-495a7899','re86-8af5384d','s5i5-18d95033','su15-1944f8ab','tn36-ef4dde99','tr87-cd924810','tu93-0768757b','vc33-5430563c','wa30-ee6fef47'}
          by={}
          for f in src.glob('*_p*_events.jsonl'):
              m=re.match(r'(.+)_p(\d+)_events\.jsonl$',f.name)
              if m: by.setdefault(m.group(1),{})[int(m.group(2))]=f
          valid={g:d for g,d in by.items() if set(d)>=set(range(10))}
          unresolved=sorted(set(valid)-signal)
          if len(valid)!=25 or len(unresolved)!=11: raise SystemExit(f'valid={len(valid)} unresolved={unresolved}')
          n=0
          for g in unresolved:
              for p in range(10):
                  f=valid[g][p]; (dst/f.name).write_bytes(f.read_bytes()); n+=1
          if n!=110: raise SystemExit(n)
          PY
          test "$(find public_trace -name '*_events.jsonl' -type f | wc -l)" -eq 110
          ! find public_trace -regex '.*_p1[0-9]_events.jsonl' -print -quit | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find public_trace -name '*_events.jsonl' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_relational_topology_diag_274.py "${args[@]}" --output r274-relational-topology.json 2> >(tee r274-runtime.txt >&2) | tee r274-stdout.txt
      - name: Verify and hash
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('r274-relational-topology.json').read_text())
          assert d['schema']=='deus/arc3-r274-relational-topology-diagnostic/1'
          assert len(d['unresolved_games'])==11
          assert d['protocol']['p10_p19_staged_or_read'] is False and d['protocol']['promotion_in_r274'] is False
          assert d['truth']['public_trace_only'] and d['truth']['source_free_runtime_logic']
          assert not d['truth']['kaggle_execution'] and not d['truth']['competition_submission']
          Path('r274-verdict.json').write_text(json.dumps({'verdict':d['verdict'],'signal_count':len(d['signals']),'signals':d['signals'],'truth_lane':'PUBLIC_OFFLINE_P5P9_RELATIONAL_DIAGNOSTIC'},indent=2,sort_keys=True)+'\n')
          print(Path('r274-verdict.json').read_text())
          PY
          sha256sum r274-relational-topology.json r274-verdict.json r274-runtime.txt r274-stdout.txt public_trace/SHA256SUMS.txt > R274_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r274-relational-topology-diagnostic
          path: |
            r274-relational-topology.json
            r274-verdict.json
            r274-runtime.txt
            r274-stdout.txt
            R274_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
# workflow-registration trigger
