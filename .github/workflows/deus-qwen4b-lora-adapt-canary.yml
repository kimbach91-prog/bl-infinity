name: DEUS Qwen3-4B LoRA Adaptation Canary
on:
  pull_request:
    paths:
      - "training/deus_qwen4b_lora_adapt_canary.py"
      - ".github/workflows/deus-qwen4b-lora-adapt-canary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qwen4b-adapt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install bounded CPU training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers peft accelerate safetensors psutil
      - name: Run Qwen3-4B three-step LoRA adaptation canary
        run: python training/deus_qwen4b_lora_adapt_canary.py
      - name: Show receipt
        if: always()
        run: test -f training/qwen4b-adapt-output/receipt.json && cat training/qwen4b-adapt-output/receipt.json || true
      - name: Upload receipt and adapter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deus-qwen4b-lora-adaptation-canary
          path: training/qwen4b-adapt-output
          if-no-files-found: warn
