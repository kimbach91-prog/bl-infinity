name: ARC3 R319 meter3 final audit
on:
  push:
    branches: [deus/r319-meter3-final-audit-20260923]
    paths: [public_benchmark/arc3/kaggle_candidates/public_meter3_final_audit_319.py, .github/workflows/arc3-r319-meter3-final-audit.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  r319:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 16}
      - name: Verify frozen source
        run: |
          git cat-file -e 4f7697eaefdb2b734a80554b54cf3f8aad2c66ce^{commit}
          git merge-base --is-ancestor 4f7697eaefdb2b734a80554b54cf3f8aad2c66ce HEAD
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage frozen games p0-p19
        run: |
          mkdir -p public_trace
          for game in ls20-9607627b sb26-7fbdac44 sp80-589a99af; do
            for p in $(seq 0 19); do cp "upstream-duck/example-run/artifacts/${game}_p${p}_events.jsonl" public_trace/; done
          done
          test "$(find public_trace -name '*_events.jsonl' | wc -l)" -eq 60
      - name: Execute
        run: |
          args=(); for f in $(find public_trace -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_meter3_final_audit_319.py "${args[@]}" --output r319.json | tee stdout.txt
      - name: Audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r319.json')); assert d['schema']=='deus/arc3-r319-meter3-final-audit/1'
          assert not d['protocol']['p10_p19_updates_selector'] and not d['protocol']['p10_p19_updates_model']
          print(json.dumps({'verdict':d['verdict'],'pass_games':d['pass_games']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r319-meter3-final-audit
          path: [r319.json, stdout.txt]
          retention-days: 30
