name: ARC3 object-graph representation test

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/object_graph_representation.py
      - .github/workflows/arc3-object-graph-representation-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  object-graph-cpu-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run representation invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          path = Path('public_benchmark/arc3/kaggle_candidates/object_graph_representation.py')
          spec = importlib.util.spec_from_file_location('ogr', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          def blank():
              return [[0 for _ in range(64)] for _ in range(64)]

          g1 = blank()
          # L triomino, rectangle, singleton: sparse objects on a large board.
          for r, c in [(2, 2), (3, 2), (3, 3)]: g1[r][c] = 2
          for r in range(12, 15):
              for c in range(30, 34): g1[r][c] = 7
          g1[50][50] = 4

          g2 = blank()
          for r, c in [(22, 12), (23, 12), (23, 13)]: g2[r][c] = 2
          for r in range(32, 35):
              for c in range(40, 44): g2[r][c] = 7
          g2[55][55] = 4

          e1 = mod.encode_object_graph(g1)
          e2 = mod.encode_object_graph(g2)
          assert e1['n'] == 3 == e2['n']
          assert mod.stable_shape_multiset(g1) == mod.stable_shape_multiset(g2), 'shape IDs must survive translation'
          assert [o['a'] for o in e1['o']] == [3, 12, 1]

          raw_len = len(mod.raw_ascii(g1))
          compact = mod.compact_json(g1)
          compact_len = len(compact)
          compression_ratio = compact_len / raw_len
          assert compression_ratio < 0.15, (raw_len, compact_len, compression_ratio)

          # Shape key is color-agnostic; color-shape key is not.
          recolor = [row[:] for row in g1]
          for r, c in [(2, 2), (3, 2), (3, 3)]: recolor[r][c] = 9
          er = mod.encode_object_graph(recolor)
          a = next(o for o in e1['o'] if o['a'] == 3)
          b = next(o for o in er['o'] if o['a'] == 3)
          assert a['s'] == b['s']
          assert a['cs'] != b['cs']

          invalid_rejected = 0
          for bad in ([], [[0, 1], [0]], [[-1]], [[16]], [[True]]):
              try:
                  mod.normalize_grid(bad)
              except ValueError:
                  invalid_rejected += 1
          assert invalid_rejected == 5

          receipt = {
              'schema': 'deus-arc3-object-graph-representation-audit/1',
              'scope': 'PUBLIC_DEVELOPMENT_CPU_REPRESENTATION_ONLY',
              'source_motivation': {
                  'repo': 'mariogemoll/arc-prize-2026-arc-agi-3',
                  'pinned_commit': '0a05c529ab58121843b5aaa29a411e175d159118',
                  'root_license_file': 'NOT_FOUND',
                  'code_copying': False,
                  'implementation': 'CLEAN_ROOM_FIRST_PRINCIPLES',
              },
              'tests': {
                  'translation_invariant_shape_ids': True,
                  'color_separation': True,
                  'malformed_fail_closed': True,
                  'invalid_cases_rejected': invalid_rejected,
                  'synthetic_object_count': e1['n'],
                  'raw_ascii_chars': raw_len,
                  'object_graph_chars': compact_len,
                  'compression_ratio': compression_ratio,
              },
              'truth': {
                  'gpu_model_output_verified': False,
                  'kaggle_offline_execution_verified': False,
                  'kaggle_submission_attempted': False,
                  'owner_kaggle_score_claim': False,
                  'submission_quota_spent': False,
              },
          }
          Path('arc3-object-graph-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True))
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Compile module
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/object_graph_representation.py
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-object-graph-representation-receipt
          path: arc3-object-graph-receipt.json
          if-no-files-found: error
