name: DEUS CX-001 DiGe C39 live application transfer

on:
  push:
    branches:
      - "deus/cx001-live-dige-c39-20260923"
    paths:
      - ".github/workflows/deus-cx001-dige-c39-live-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deus-cx001-dige-c39-live-transfer-${{ github.ref }}
  cancel-in-progress: false

env:
  C39_BASE_COMMIT: ef048af5736d930f739ce62e1b353bf0c1a3bb65

jobs:
  prepare-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact C39 lineage plus transfer workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Rebuild pinned public skin and system assets
        working-directory: experiments/dige-v8-executor-capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/assets runtime/system_assets

          SKINPACK=/tmp/skins01_cc0.zip
          curl -fL --retry 6 --retry-delay 5 https://files2.makehumancommunity.org/asset_packs/skins01/skins01_cc0.zip -o "$SKINPACK"
          echo "7495ab99287053bd19ff1636114e64b608994d9f7437fea6cc75ea387f96dba9  $SKINPACK" | sha256sum -c -
          unzip -p "$SKINPACK" "skins/onlytheghosts_young_eurasian_female/young_eurasian_female_diffuse.png" > runtime/assets/young_eurasian_female_diffuse.png
          echo "e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf  runtime/assets/young_eurasian_female_diffuse.png" | sha256sum -c -

          SYSPACK=/tmp/makehuman_system_assets_cc0.zip
          curl -fL --retry 6 --retry-delay 5 https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip -o "$SYSPACK"
          echo "b542127a8e25547c7c29c19f2d1d2adb9a664c80396ecd694095dbc8028a0107  $SYSPACK" | sha256sum -c -

          unzip -p "$SYSPACK" "hair/short03/short03.obj" > runtime/system_assets/short03.obj
          unzip -p "$SYSPACK" "hair/short03/short03.mhclo" > runtime/system_assets/short03.mhclo
          unzip -p "$SYSPACK" "hair/short03/short03_diffuse.png" > runtime/system_assets/short03_diffuse.png
          unzip -p "$SYSPACK" "eyes/high-poly/high-poly.obj" > runtime/system_assets/high-poly.obj
          unzip -p "$SYSPACK" "eyes/high-poly/high-poly.mhclo" > runtime/system_assets/high-poly.mhclo
          unzip -p "$SYSPACK" "eyes/materials/brown_eye.png" > runtime/system_assets/brown_eye.png
          unzip -p "$SYSPACK" "eyebrows/eyebrow001/eyebrow001.obj" > runtime/system_assets/eyebrow001.obj
          unzip -p "$SYSPACK" "eyebrows/eyebrow001/eyebrow001.mhclo" > runtime/system_assets/eyebrow001.mhclo
          unzip -p "$SYSPACK" "eyebrows/eyebrow001/eyebrow001.png" > runtime/system_assets/eyebrow001.png
          unzip -p "$SYSPACK" "eyelashes/eyelashes01/eyelashes01.obj" > runtime/system_assets/eyelashes01.obj
          unzip -p "$SYSPACK" "eyelashes/eyelashes01/eyelashes01.mhclo" > runtime/system_assets/eyelashes01.mhclo
          unzip -p "$SYSPACK" "eyelashes/eyelashes01/eyelashes01.png" > runtime/system_assets/eyelashes01.png

          unzip -p "$SYSPACK" "hair/long01/long01.obj" > runtime/system_assets/long01.obj
          unzip -p "$SYSPACK" "hair/long01/long01.mhclo" > runtime/system_assets/long01.mhclo
          unzip -p "$SYSPACK" "hair/long01/long01.mhmat" > runtime/system_assets/long01.mhmat
          unzip -p "$SYSPACK" "hair/long01/long01_diffuse.png" > runtime/system_assets/long01_diffuse.png

          echo "4a9fc385718f2c46fb328ab99d33e3a946cecdb717987c8b324cf2466b59bd9c  runtime/system_assets/short03.obj" | sha256sum -c -
          echo "d80bbb8fd9b06721c481756fb3e1d6dce04fcfc9ca8a379edd4ea3c0d81ed17f  runtime/system_assets/short03.mhclo" | sha256sum -c -
          echo "fe6ed0bb14498a48a2e8fc07e80e2a6f62c8b67686fcd0a7a570d345faec97da  runtime/system_assets/short03_diffuse.png" | sha256sum -c -
          echo "94ecbebfd834da2cbee2ce90b730972590eb22a252ecd9592038ea736e063646  runtime/system_assets/long01.mhclo" | sha256sum -c -
          echo "74ec88267e679d316f8037a074511ffc887b27e198ea381d0ae4a3f180f96760  runtime/system_assets/long01.mhmat" | sha256sum -c -
          echo "7f1d6dadbdf9e96435251955d6657e77ea5433c9bc7c85a5c5f5e4eae0cb9a8c  runtime/system_assets/long01.obj" | sha256sum -c -
          echo "e8dc25d90f8f62467e8630420e1240a400d070054fb7c3f1d3f7bf3e457d6c2c  runtime/system_assets/long01_diffuse.png" | sha256sum -c -

      - name: Rebuild pinned public MPFB2 and GNM runtime
        working-directory: experiments/dige-v8-executor-capsule
        shell: bash
        run: |
          set -euo pipefail
          MPFB_COMMIT=b58176c661a9680294eb75f127842cb8378e4974
          rm -rf /tmp/mpfb2
          git init -q /tmp/mpfb2
          git -C /tmp/mpfb2 remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C /tmp/mpfb2 fetch -q --depth=1 origin "$MPFB_COMMIT"
          git -C /tmp/mpfb2 checkout -q --detach FETCH_HEAD
          mkdir -p runtime/shared_mpfb2_src/mpfb
          cp -a /tmp/mpfb2/src/mpfb/data runtime/shared_mpfb2_src/mpfb/

          GNM_COMMIT=a424b5153eec9154f3dfa5ee7f214e5817918d54
          rm -rf /tmp/GNM
          git init -q /tmp/GNM
          git -C /tmp/GNM remote add origin https://github.com/google/GNM.git
          git -C /tmp/GNM fetch -q --depth=1 origin "$GNM_COMMIT"
          git -C /tmp/GNM checkout -q --detach FETCH_HEAD
          python -m pip install --disable-pip-version-check -q numpy scipy absl-py etils immutabledict importlib-resources opt-einsum typeguard
          python -m pip install --disable-pip-version-check -q tensorflow
          python -m pip install --disable-pip-version-check -q --no-deps -e /tmp/GNM/gnm/shape

          start_ns="$(date +%s%N)"
          python build_makehuman_v8.py > runtime/cx001_public_body_build.log
          DIGE_GNM_COMMIT="$GNM_COMMIT" DIGE_GNM_IDENTITY_SEED=20263030 DIGE_GNM_IDENTITY_SIGMA=0.34 DIGE_GNM_SEMANTIC_IDENTITY=1 \
            python build_gnm_head_c28.py > runtime/cx001_public_gnm_build.log
          end_ns="$(date +%s%N)"

          mkdir -p runtime/assets/c25_mpfb
          cp runtime/assets/young_eurasian_female_diffuse.png runtime/assets/c25_mpfb/young_eurasian_female_diffuse.png
          printf 'name c25_mpfb_enhanced_skin\ndiffuseColor 1.0 1.0 1.0\ndiffuseTexture young_eurasian_female_diffuse.png\n' > runtime/assets/c25_mpfb/c25_skin.mhmat

          test -s runtime/DIGE_V8_GEOMETRY_MANIFEST.json
          test -s runtime/gnm_c28/DIGE_C28_GNM_HEAD_MANIFEST.json

          python3 - "${start_ns}" "${end_ns}" <<'PY'
          import json,pathlib,sys
          ms=(int(sys.argv[2])-int(sys.argv[1]))/1_000_000
          pathlib.Path("runtime/CX001_C39_PUBLIC_RUNTIME_PREP_TIMING.json").write_text(
              json.dumps({"public_runtime_build_ms":ms})+"\n")
          PY

      - name: Freeze exact geometry reuse capsule
        working-directory: experiments/dige-v8-executor-capsule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path(".")
          rt=root/"runtime"
          names=[
            "makehuman_base.obj",
            "asian-female-young.target",
            "DIGE_V8_FIT_REFERENCE.json",
            "dige_makehuman_v8.obj",
            "dige_makehuman_tights_v8.obj",
            "dige_makehuman_l_eye_v8.obj",
            "dige_makehuman_r_eye_v8.obj",
            "dige_makehuman_hair_guide_v8.obj",
            "DIGE_V8_GEOMETRY_MANIFEST.json",
          ]
          hashes={n:hashlib.sha256((rt/n).read_bytes()).hexdigest() for n in names}
          receipt={
            "schema":"deus-cx001-c39-geometry-cache/2",
            "c39_base_commit":"ef048af5736d930f739ce62e1b353bf0c1a3bb65",
            "build_script_sha256":hashlib.sha256((root/"build_makehuman_v8.py").read_bytes()).hexdigest(),
            "benchmark_contract_sha256":hashlib.sha256((root/"DIGE_C39_HHIR_BENCHMARK.json").read_bytes()).hexdigest(),
            "geometry_manifest_sha256":hashes["DIGE_V8_GEOMETRY_MANIFEST.json"],
            "gnm_manifest_sha256":hashlib.sha256((rt/"gnm_c28/DIGE_C28_GNM_HEAD_MANIFEST.json").read_bytes()).hexdigest(),
            "files":hashes,
            "source_policy":"PUBLIC_PINNED_REBUILD_ONLY",
            "truth":"REUSE_REQUIRES_EXACT_SCRIPT_CONTRACT_AND_FILE_FINGERPRINTS"
          }
          (rt/"CX001_C39_GEOMETRY_CACHE_RECEIPT.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("DEUS_CX001_C39_CACHE="+json.dumps(receipt,sort_keys=True,separators=(",",":")))
          PY

          tar -czf /tmp/cx001-c39-geometry-cache.tgz -C runtime \
            makehuman_base.obj \
            asian-female-young.target \
            DIGE_V8_FIT_REFERENCE.json \
            dige_makehuman_v8.obj \
            dige_makehuman_tights_v8.obj \
            dige_makehuman_l_eye_v8.obj \
            dige_makehuman_r_eye_v8.obj \
            dige_makehuman_hair_guide_v8.obj \
            DIGE_V8_GEOMETRY_MANIFEST.json \
            CX001_C39_GEOMETRY_CACHE_RECEIPT.json

      - name: Upload rebuilt shared runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CX001-C39-SHARED-RUNTIME
          path: experiments/dige-v8-executor-capsule/runtime/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact geometry cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CX001-C39-GEOMETRY-CACHE
          path: /tmp/cx001-c39-geometry-cache.tgz
          retention-days: 30

  live-pair:
    needs: prepare-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trial: [1, 2]
    steps:
      - name: Checkout exact C39 lineage plus transfer workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download rebuilt shared runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CX001-C39-SHARED-RUNTIME
          path: experiments/dige-v8-executor-capsule/runtime

      - name: Download exact geometry cache
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CX001-C39-GEOMETRY-CACHE
          path: /tmp/cx001-cache

      - name: Resolve Blender 5.2.2 once
        shell: bash
        run: |
          set -euo pipefail
          ROOT=https://download.blender.org/release/Blender5.2
          TAR=blender-5.2.2-linux-x64.tar.xz
          curl -fL --retry 4 --retry-delay 3 "$ROOT/$TAR" -o "/tmp/$TAR"
          curl -fL --retry 4 --retry-delay 3 "$ROOT/blender-5.2.2.sha256" -o /tmp/blender.sha256
          grep " $TAR$" /tmp/blender.sha256 > /tmp/blender.expected
          (cd /tmp && sha256sum -c blender.expected)
          tar -xf "/tmp/$TAR" -C /tmp
          echo "BLENDER=/tmp/blender-5.2.2-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Create deterministic C39 verification renderer
        working-directory: experiments/dige-v8-executor-capsule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          src=Path("blender_render_v8.py")
          dst=Path("blender_render_cxverify.py")
          s=src.read_text()
          old="scene.cycles.use_adaptive_sampling=True"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,"scene.cycles.use_adaptive_sampling=False",1)
          dst.write_text(s)
          rec={
            "schema":"deus-cx001-c39-deterministic-render-verifier/1",
            "source_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),
            "verifier_sha256":hashlib.sha256(dst.read_bytes()).hexdigest(),
            "only_intentional_change":"CYCLES_ADAPTIVE_SAMPLING_TRUE_TO_FALSE",
            "search_denoise":False,
            "samples":96,
            "render_seed":20263939,
            "claim_ceiling":"DETERMINISTIC_EQUIVALENCE_VERIFICATION_ONLY__NOT_PRODUCTION_RENDER_POLICY"
          }
          Path("runtime/CX001_C39_DETERMINISTIC_VERIFIER.json").write_text(json.dumps(rec,indent=2,sort_keys=True)+"\n")
          print("DEUS_CX001_C39_VERIFIER="+json.dumps(rec,sort_keys=True,separators=(",",":")))
          PY

      - name: Run paired baseline and CX-001 update cycles on same runner
        working-directory: experiments/dige-v8-executor-capsule
        shell: bash
        env:
          TRIAL: ${{ matrix.trial }}
          DIGE_CYCLES_DEVICE: CPU
          DIGE_RENDER_SET: HERO_ONLY
          DIGE_SEARCH_ONLY: '1'
          DIGE_SEARCH_DENOISE: '0'
          DIGE_C18_HYBRID_BULK: '1'
          DIGE_C25_MATURE_STACK: '1'
          DIGE_C26_PHOTOMETRIC: '1'
          DIGE_C28_GNM_HEAD: '1'
          DIGE_C28_GNM_DIR: runtime/gnm_c28
          DIGE_C29_GNM_PRESENTATION: '1'
          DIGE_C30_GNM_SEMANTIC_IDENTITY: '1'
          DIGE_C31_GNM_FACE_APPEARANCE: '1'
          DIGE_C32_GNM_DERMAL_HAIR: '1'
          DIGE_C33_GUIDE_GATED_GROOM: '1'
          DIGE_C33_GUIDE_MAX_DIST: '0.021'
          DIGE_C33_SCALP_Z_DROP: '0.120'
          DIGE_C36_CANONICAL_APPEARANCE: '1'
          DIGE_C39_HHIR_HYPERREAL: '1'
          DIGE_C36_JAW_TAPER: '0.88'
          DIGE_C36_EYE_OPEN_SCALE: '0.64'
          DIGE_C36_EYE_GLOBE_SCALE: '0.88'
          DIGE_C36_HAIR_LENGTH_M: '0.30'
          DIGE_C36_HAIR_WAVE: '0.006'
          DIGE_GNM_COMMIT: a424b5153eec9154f3dfa5ee7f214e5817918d54
          DIGE_MPFB2_SRC: runtime/shared_mpfb2_src
          DIGE_MPFB2_COMMIT: b58176c661a9680294eb75f127842cb8378e4974
          DIGE_C25_MHMAT_PATH: runtime/assets/c25_mpfb/c25_skin.mhmat
          DIGE_HAIR_ASSET_KEY: hair_long01
          DIGE_HAIR_STRANDS_PER_ROOT: '24'
          DIGE_HAIR_ACCENT_LENGTH_SCALE: '1.00'
          DIGE_HAIR_FRONT_SAFE_BLEND: '0.78'
          DIGE_SKIN_ALBEDO_PATH: runtime/assets/young_eurasian_female_diffuse.png
          DIGE_SKIN_ALBEDO_SHA256: e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf
          DIGE_SKIN_ALBEDO_NAME: onlytheghosts_young_eurasian_female
          DIGE_SAMPLES_PREVIEW: '96'
          DIGE_SAMPLES_HERO: '96'
          DIGE_RENDER_SEED: '20263939'
          DIGE_RUNTIME_COMMIT: ef048af5736d930f739ce62e1b353bf0c1a3bb65
        run: |
          set -euo pipefail
          mkdir -p /tmp/cx001-cache/unpacked
          tar -xzf /tmp/cx001-cache/cx001-c39-geometry-cache.tgz -C /tmp/cx001-cache/unpacked

          verify_cache() {
            python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path(".")
          cache=pathlib.Path("/tmp/cx001-cache/unpacked")
          r=json.loads((cache/"CX001_C39_GEOMETRY_CACHE_RECEIPT.json").read_text())
          assert hashlib.sha256((root/"build_makehuman_v8.py").read_bytes()).hexdigest()==r["build_script_sha256"]
          assert hashlib.sha256((root/"DIGE_C39_HHIR_BENCHMARK.json").read_bytes()).hexdigest()==r["benchmark_contract_sha256"]
          for name,expected in r["files"].items():
              assert hashlib.sha256((cache/name).read_bytes()).hexdigest()==expected,(name,expected)
          PY
          }

          restore_cache() {
            verify_cache
            cp /tmp/cx001-cache/unpacked/makehuman_base.obj runtime/
            cp /tmp/cx001-cache/unpacked/asian-female-young.target runtime/
            cp /tmp/cx001-cache/unpacked/DIGE_V8_FIT_REFERENCE.json runtime/
            cp /tmp/cx001-cache/unpacked/dige_makehuman_v8.obj runtime/
            cp /tmp/cx001-cache/unpacked/dige_makehuman_tights_v8.obj runtime/
            cp /tmp/cx001-cache/unpacked/dige_makehuman_l_eye_v8.obj runtime/
            cp /tmp/cx001-cache/unpacked/dige_makehuman_r_eye_v8.obj runtime/
            cp /tmp/cx001-cache/unpacked/dige_makehuman_hair_guide_v8.obj runtime/
            cp /tmp/cx001-cache/unpacked/DIGE_V8_GEOMETRY_MANIFEST.json runtime/
          }

          measure_stage() {
            arm="$1"
            start_ns="$(date +%s%N)"
            if [ "$arm" = "BASELINE_REBUILD" ]; then
              python build_makehuman_v8.py > "runtime/cx001_geometry_${arm}_t${TRIAL}.log"
              build=true; reuse=false
            else
              restore_cache
              build=false; reuse=true
            fi
            end_ns="$(date +%s%N)"
            python3 - "${start_ns}" "${end_ns}" "$arm" "$build" "$reuse" "$TRIAL" <<'PY'
          import hashlib,json,pathlib,sys
          out={
            "arm":sys.argv[3],
            "trial":int(sys.argv[6]),
            "geometry_stage_ms":(int(sys.argv[2])-int(sys.argv[1]))/1_000_000,
            "build_executed":sys.argv[4]=="true",
            "reuse_verified":sys.argv[5]=="true",
            "fallback":False,
            "geometry_manifest_sha256":hashlib.sha256(pathlib.Path("runtime/DIGE_V8_GEOMETRY_MANIFEST.json").read_bytes()).hexdigest()
          }
          pathlib.Path(f"runtime/CX001_C39_GEOMETRY_STAGE_{out['arm']}_T{out['trial']}.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("DEUS_CX001_C39_GEOMETRY_STAGE="+json.dumps(out,sort_keys=True,separators=(",",":")))
          PY
          }

          render_arm() {
            arm="$1"
            export DIGE_OUTPUT_TAG="cx001_c39_${arm}_t${TRIAL}"
            start_ns="$(date +%s%N)"
            "$BLENDER" --background --factory-startup --python-exit-code 1 --python blender_render_cxverify.py > "runtime/cx001_c39_${arm}_t${TRIAL}.log"
            end_ns="$(date +%s%N)"
            python3 - "${start_ns}" "${end_ns}" "$arm" "$TRIAL" <<'PY'
          import hashlib,json,pathlib,sys
          arm=sys.argv[3]; trial=int(sys.argv[4])
          rt=pathlib.Path("runtime")
          stage=json.loads((rt/f"CX001_C39_GEOMETRY_STAGE_{arm}_T{trial}.json").read_text())
          root=rt/"renders"/f"cx001_c39_{arm}_t{trial}"
          r=json.loads((root/"DIGE_V8_RENDER_RECEIPT.json").read_text())
          assert r["device"]=="CPU"
          assert r["appearance_candidate"]=="C39_HHIR_HYPERREAL_UPDO_V1"
          assert len(r["outputs"])==1 and r["outputs"][0]["sha256"]
          assert r["geometry_manifest_sha256"]==stage["geometry_manifest_sha256"]
          out={
            "schema":"deus-cx001-c39-live-transfer-arm/2",
            "arm":arm,
            "trial":trial,
            "geometry_stage":stage,
            "render_wall_ms":(int(sys.argv[2])-int(sys.argv[1]))/1_000_000,
            "hero_sha256":r["outputs"][0]["sha256"],
            "scene_sha256":r["scene_sha256"],
            "appearance_candidate":r["appearance_candidate"],
            "receipt_geometry_manifest_sha256":r["geometry_manifest_sha256"],
            "deterministic_verifier":json.loads((rt/"CX001_C39_DETERMINISTIC_VERIFIER.json").read_text()),
            "truth_boundary":"LIVE_C39_HHIR_UPDATE_CYCLE__PAIRED_SAME_RUNNER__DETERMINISTIC_VERIFICATION_RENDER__GEOMETRY_STAGE_ONLY__NO_ENERGY_CREDIT"
          }
          pre=json.dumps(out,sort_keys=True,separators=(",",":")).encode()
          out["receipt_sha256"]=hashlib.sha256(pre).hexdigest()
          (root/"CX001_C39_LIVE_TRANSFER_ARM.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("DEUS_CX001_C39_LIVE_ARM="+json.dumps(out,sort_keys=True,separators=(",",":")))
          PY
          }

          # Counterbalance order to reduce warm-cache/order bias.
          if [ "$TRIAL" = "1" ]; then
            measure_stage BASELINE_REBUILD
            render_arm BASELINE_REBUILD
            measure_stage CX001_REUSE
            render_arm CX001_REUSE
          else
            measure_stage CX001_REUSE
            render_arm CX001_REUSE
            measure_stage BASELINE_REBUILD
            render_arm BASELINE_REBUILD
          fi

          python3 - "$TRIAL" <<'PY'
          import hashlib,json,pathlib,sys
          trial=int(sys.argv[1]); rt=pathlib.Path("runtime")
          def load(arm):
              root=rt/"renders"/f"cx001_c39_{arm}_t{trial}"
              return json.loads((root/"CX001_C39_LIVE_TRANSFER_ARM.json").read_text())
          b=load("BASELINE_REBUILD"); c=load("CX001_REUSE")
          assert b["geometry_stage"]["build_executed"] is True
          assert c["geometry_stage"]["build_executed"] is False
          assert c["geometry_stage"]["reuse_verified"] is True
          assert c["geometry_stage"]["fallback"] is False
          assert b["geometry_stage"]["geometry_manifest_sha256"]==c["geometry_stage"]["geometry_manifest_sha256"]
          assert b["hero_sha256"]==c["hero_sha256"],(b["hero_sha256"],c["hero_sha256"])
          summary={
            "schema":"deus-cx001-c39-live-transfer-pair/1",
            "trial":trial,
            "order":"BASELINE_FIRST" if trial==1 else "CX_FIRST",
            "baseline":b,
            "candidate":c,
            "exact_output":True,
            "physical_geometry_build_avoided":1,
            "stage_speed_ratio":b["geometry_stage"]["geometry_stage_ms"]/max(c["geometry_stage"]["geometry_stage_ms"],1e-9),
            "update_cycle_ratio":(
              b["geometry_stage"]["geometry_stage_ms"]+b["render_wall_ms"]
            )/max(c["geometry_stage"]["geometry_stage_ms"]+c["render_wall_ms"],1e-9),
            "energy_joules":"UNKNOWN",
            "claim_ceiling":"C39_UPDATE_CYCLE_GEOMETRY_REUSE_ONLY__PAIRED_SAME_RUNNER__DETERMINISTIC_VERIFICATION_RENDER__NO_GLOBAL_RENDER_SPEEDUP__NO_ENERGY_CREDIT"
          }
          pre=json.dumps(summary,sort_keys=True,separators=(",",":")).encode()
          summary["receipt_sha256"]=hashlib.sha256(pre).hexdigest()
          pathlib.Path(f"runtime/CX001_C39_LIVE_PAIR_T{trial}.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("DEUS_CX001_C39_LIVE_PAIR="+json.dumps(summary,sort_keys=True,separators=(",",":")))
          PY

      - name: Upload paired live transfer receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CX001-C39-LIVE-PAIR-T${{ matrix.trial }}
          path: experiments/dige-v8-executor-capsule/runtime/CX001_C39_LIVE_PAIR_T${{ matrix.trial }}.json
          retention-days: 30

  reduce-live:
    needs: live-pair
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download paired live transfer receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: CX001-C39-LIVE-PAIR-*
          path: live-transfer
          merge-multiple: false

      - name: Reduce live application-transfer verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,statistics,hashlib
          rows=[json.loads(p.read_text()) for p in pathlib.Path("live-transfer").rglob("CX001_C39_LIVE_PAIR_T*.json")]
          assert len(rows)==2, len(rows)
          rows=sorted(rows,key=lambda r:r["trial"])
          assert all(r["exact_output"] for r in rows)
          assert all(r["candidate"]["geometry_stage"]["reuse_verified"] for r in rows)
          assert all(not r["candidate"]["geometry_stage"]["build_executed"] for r in rows)
          assert all(r["baseline"]["geometry_stage"]["build_executed"] for r in rows)
          base_stage=[r["baseline"]["geometry_stage"]["geometry_stage_ms"] for r in rows]
          cx_stage=[r["candidate"]["geometry_stage"]["geometry_stage_ms"] for r in rows]
          stage_ratios=[r["stage_speed_ratio"] for r in rows]
          cycle_ratios=[r["update_cycle_ratio"] for r in rows]
          summary={
            "schema":"deus-cx001-c39-live-transfer-summary/2",
            "application":"DIGE_C39_HHIR_HYPERREAL",
            "transfer_scope":"LIVE_APPLICATION_UPDATE_CYCLE_GEOMETRY_STAGE",
            "trials":2,
            "counterbalanced_orders":["BASELINE_FIRST","CX_FIRST"],
            "exact_output_pairs":2,
            "false_exclusion_count":0,
            "baseline_geometry_build_executions":2,
            "cx001_geometry_build_executions":0,
            "physical_geometry_build_executions_avoided":2,
            "baseline_geometry_stage_ms":base_stage,
            "cx001_reuse_stage_ms":cx_stage,
            "stage_speed_ratio_conservative":min(stage_ratios),
            "stage_speed_ratio_median":statistics.median(stage_ratios),
            "update_cycle_ratio_conservative":min(cycle_ratios),
            "update_cycle_ratio_median":statistics.median(cycle_ratios),
            "render_output_exact":True,
            "transfer_verdict":"LIVE_APPLICATION_STAGE_ELIMINATION_PASS",
            "energy_joules":"UNKNOWN",
            "claim_ceiling":"C39_UPDATE_CYCLE_GEOMETRY_REUSE_ONLY__PAIRED_SAME_RUNNER__DETERMINISTIC_VERIFICATION_RENDER__NO_GLOBAL_SPEEDUP__NO_ENERGY_CREDIT"
          }
          raw=json.dumps(summary,sort_keys=True,separators=(",",":")).encode()
          summary["summary_sha256"]=hashlib.sha256(raw).hexdigest()
          pathlib.Path("CX001_C39_LIVE_TRANSFER_SUMMARY.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("DEUS_CX001_C39_LIVE_SUMMARY="+json.dumps(summary,sort_keys=True,separators=(",",":")))
          PY

      - name: Upload live transfer summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CX001-C39-LIVE-TRANSFER-SUMMARY
          path: CX001_C39_LIVE_TRANSFER_SUMMARY.json
          retention-days: 30
