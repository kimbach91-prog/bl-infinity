name: ARC3 AR25 all20 frozen pipeline 181

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ar25_all20_frozen_pipeline_181.py
      - .github/workflows/arc3-ar25-all20-frozen-pipeline-181.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ar25-all20:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile frozen pipeline
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_fullboard_translation_program_160.py \
            public_benchmark/arc3/kaggle_candidates/public_dense_scroll_renderer_audit_167.py \
            public_benchmark/arc3/kaggle_candidates/public_world_overlay_renderer_172.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_family_sweep_175.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_correction_178.py \
            public_benchmark/arc3/kaggle_candidates/public_ar25_all20_frozen_pipeline_181.py
      - name: Download all 20 pinned AR25 public trajectories
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          files=(
            "ar25-0c556536_p0_events.jsonl"
            "ar25-0c556536_p1_events.jsonl"
            "ar25-0c556536_p2_events.jsonl"
            "ar25-0c556536_p3_events.jsonl"
            "ar25-0c556536_p4_events.jsonl"
            "ar25-0c556536_p5_events.jsonl"
            "ar25-0c556536_p6_events.jsonl"
            "ar25-0c556536_p7_events.jsonl"
            "ar25-0c556536_p8_events.jsonl"
            "ar25-0c556536_p9_events.jsonl"
            "ar25-0c556536_p10_events.jsonl"
            "ar25-0c556536_p11_events.jsonl"
            "ar25-0c556536_p12_events.jsonl"
            "ar25-0c556536_p13_events.jsonl"
            "ar25-0c556536_p14_events.jsonl"
            "ar25-0c556536_p15_events.jsonl"
            "ar25-0c556536_p16_events.jsonl"
            "ar25-0c556536_p17_events.jsonl"
            "ar25-0c556536_p18_events.jsonl"
            "ar25-0c556536_p19_events.jsonl"
          )
          for f in "${files[@]}"; do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute frozen AR25 all20 stress
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_ar25_all20_frozen_pipeline_181.py \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p1_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p2_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p3_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p4_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p5_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p6_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p7_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p8_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p9_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p12_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p13_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p14_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p15_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p16_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p17_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p18_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p19_events.jsonl" \
            --output "$GITHUB_WORKSPACE/ar25-all20-frozen-public-181.json"
      - name: Enforce truth boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('ar25-all20-frozen-public-181.json'))
          assert d['schema']=='deus/arc3-ar25-all20-frozen-pipeline/1'
          assert d['rung']==181
          t=d['truth']
          assert t['architecture_frozen_before_heldout'] is True
          assert t['heldout_paths_not_used_for_architecture_selection'] is True
          assert t['online_state_reset_per_trajectory'] is True
          assert t['current_prediction_uses_preaction_and_prior_history_only'] is True
          assert t['independent_generalization_claim'] is False
          assert t['kaggle_execution'] is False and t['submission_quota_spent'] is False
          a=d['aggregate']
          print(json.dumps({
            'rung':181,'gate':d['diagnostic_gate'],
            'selection':a['selection'],
            'heldout':a['heldout_same_game'],
            'all20':a['all20'],
            'heldout_path_count':a['heldout_path_count'],
            'per_path':[{'path':x['path'],'split':x['split'],'opportunities':x['opportunities'],'exact':x['exact'],'accuracy':x['accuracy']} for x in a['per_path']],
            'truth':'FROZEN_PUBLIC_SAME_GAME_HELDOUT'
          },sort_keys=True))
          PY
      - name: Upload rung 181 receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-ar25-all20-frozen-pipeline-181
          path: |
            ar25-all20-frozen-public-181.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
