name: ARC3 public world overlay error topology 173

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py
      - public_benchmark/arc3/kaggle_candidates/public_fullboard_translation_program_160.py
      - public_benchmark/arc3/kaggle_candidates/public_dense_scroll_renderer_audit_167.py
      - public_benchmark/arc3/kaggle_candidates/public_world_overlay_renderer_172.py
      - public_benchmark/arc3/kaggle_candidates/public_world_overlay_error_topology_173.py
      - .github/workflows/arc3-public-world-overlay-error-topology-173.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_world_overlay_error_topology_173.py
      - name: Download exact pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in ar25-0c556536_p0_events.jsonl ar25-0c556536_p10_events.jsonl ar25-0c556536_p11_events.jsonl; do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute postscore topology diagnostic
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_world_overlay_error_topology_173.py \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" \
            --output "$GITHUB_WORKSPACE/world-overlay-error-topology-public-173.json"
      - name: Enforce truth boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('world-overlay-error-topology-public-173.json'))
          assert d['rung']==173
          assert d['truth']['outcome_assisted_analysis'] is True
          assert d['truth']['current_outcome_used_only_after_prediction_for_error_classification'] is True
          assert d['truth']['independent_generalization_claim'] is False
          assert d['truth']['kaggle_execution'] is False
          assert d['truth']['submission_quota_spent'] is False
          a=d['aggregate']
          print(json.dumps({'rung':173,'gate':d['diagnostic_gate'],'raw_candidates':a['raw_candidates'],'exact_frames':a['exact_frames'],'wrong_frames':a['wrong_frames'],'wrong_le4':a['wrong_frames_le4_cells'],'wrong_le16':a['wrong_frames_le16_cells'],'error_modes':a['error_mode_counts'],'error_fractions':a['error_mode_fractions'],'dominant':a['dominant_error_mode'],'recommendation':d['recommendation'],'truth':'POSTSCORE_PUBLIC_DIAGNOSTIC_ONLY'},sort_keys=True))
          PY
      - name: Upload rung 173 diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-world-overlay-error-topology-173
          path: |
            world-overlay-error-topology-public-173.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
