name: ARC3 public animation signature benchmark 112

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - 'public_benchmark/arc3/kaggle_candidates/animation_delta_signature.py'
      - 'public_benchmark/arc3/kaggle_candidates/public_animation_signature_benchmark.py'
      - '.github/workflows/arc3-public-animation-signature-benchmark-112.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signature-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned official ARC toolkit
        run: pip install --disable-pip-version-check 'arc-agi==0.9.9'

      - name: Compile compact animation representation
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_multiframe_probe.py \
            public_benchmark/arc3/kaggle_candidates/animation_delta_signature.py \
            public_benchmark/arc3/kaggle_candidates/public_animation_signature_benchmark.py

      - name: Execute fixed public footprint benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_animation_signature_benchmark.py \
            --receipt "$GITHUB_WORKSPACE/public-animation-signature-benchmark.json"

      - name: Enforce representation and truth boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s public-animation-signature-benchmark.json
          sha256sum public-animation-signature-benchmark.json > RECEIPT_SHA256SUMS.txt
          jq -e '
            .schema=="deus/arc3-public-animation-signature-benchmark/1"
            and .summary.executed==3
            and .truth.public_development_environment_only==true
            and .truth.fixed_actions_declared_before_outcomes==true
            and .truth.final_frame_remains_exact_current_board==true
            and .truth.animation_signature_is_additive_lossy_metadata==true
            and .truth.game_source_read==false
            and .truth.hidden_state_read==false
            and .truth.kaggle_data_read==false
            and .truth.kaggle_execution==false
            and .truth.kaggle_submission_attempted==false
            and .truth.submission_quota_spent==false
            and .truth.owner_score_claim==false
            and .truth.solver_behavior_gain_claim==false
          ' public-animation-signature-benchmark.json >/dev/null
          if jq -e '.summary.multiframe_cases > 0' public-animation-signature-benchmark.json >/dev/null; then
            jq -e '.summary.signature_to_full_ratio < 0.20' public-animation-signature-benchmark.json >/dev/null
          fi
          jq '{summary,results,truth}' public-animation-signature-benchmark.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload footprint receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-animation-signature-benchmark-112
          path: |
            public-animation-signature-benchmark.json
            RECEIPT_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
