name: ARC3 ft09 pixel exact mechanics validator 215

on:
  push:
    branches:
      - deus/arc3-remaining14-coverage-20260922
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_pixel_exact_mechanics_215.py
      - .github/workflows/arc3-ft09-pixel-exact-mechanics-215.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ft09-mechanics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_v5_canonical_patch_router_191.py \
            public_benchmark/arc3/kaggle_candidates/public_ft09_pixel_exact_mechanics_215.py
      - name: Download exact ft09 p0..p19 public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          game='ft09-0d8bbf25'
          for p in $(seq 0 19); do
            f="${game}_p${p}_events.jsonl"
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute frozen pixel-mechanics validator
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_ft09_pixel_exact_mechanics_215.py \
            "${args[@]}" --output r215-ft09-pixel-exact-mechanics.json
      - name: Verify truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r215-ft09-pixel-exact-mechanics.json'))
          assert d['schema']=='deus/arc3-ft09-pixel-exact-mechanics-validator/1'
          t=d['truth']
          assert t['source_code_not_loaded_at_runtime'] is True
          assert t['external_solver_code_imported'] is False
          assert t['p0_p9_only_updates_cycle_model'] is True
          assert t['p10_p19_never_update_model'] is True
          assert t['planner_or_solver_claim'] is False
          assert t['kaggle_execution'] is False
          assert d['development_oracle']['source_license']=='MIT'
          print(json.dumps({
            'cycle_model':d['cycle_model'],
            'heldout':d['heldout'],
            'gate':d['mechanism_gate_pass'],
            'mistake_count':len(d['mistakes']),
            'promotion':d['promotion'],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r215-ft09-pixel-exact-mechanics
          path: |
            r215-ft09-pixel-exact-mechanics.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
