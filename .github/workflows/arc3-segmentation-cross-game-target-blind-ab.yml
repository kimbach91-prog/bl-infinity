name: ARC3 segmentation cross-game target-blind public A/B

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - 'public_benchmark/arc3/kaggle_candidates/segmentation_cross_game_target_blind_ab.py'
      - '.github/workflows/arc3-segmentation-cross-game-target-blind-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-game-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile target-blind cross-game harness
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/temporal_state_target_blind_ab.py \
            public_benchmark/arc3/kaggle_candidates/segmentation_target_blind_ab.py \
            public_benchmark/arc3/kaggle_candidates/segmentation_cross_game_target_blind_ab.py

      - name: Download three distinct public Schema game traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p schema_public
          base='https://huggingface.co/datasets/schema-harness/arc-agi-3-schema-traces/resolve/main/gpt_5_6_sol'
          declare -A traces=(
            [bp35]='gpt_5_6_sol_max_bp35'
            [sp80]='gpt_5_6_sol_max_sp80'
            [wa30]='gpt_5_6_sol_xhigh_wa30'
          )
          for game in bp35 sp80 wa30; do
            d="${traces[$game]}"
            curl --fail --location --retry 3 --silent --show-error "$base/$d/events.jsonl?download=true" -o "schema_public/${game}.jsonl"
            test -s "schema_public/${game}.jsonl"
          done
          sha256sum schema_public/*.jsonl | sort > schema_public/SHA256SUMS.txt

      - name: Execute same-model cross-game A/B
        run: |
          python public_benchmark/arc3/kaggle_candidates/segmentation_cross_game_target_blind_ab.py \
            --input schema_public/bp35.jsonl \
            --input schema_public/sp80.jsonl \
            --input schema_public/wa30.jsonl \
            --cases-per-game 4 \
            --receipt segmentation-cross-game-target-blind-ab.json

      - name: Enforce truth boundary and emit summary
        shell: bash
        run: |
          test -s segmentation-cross-game-target-blind-ab.json
          jq -e '
            .schema=="deus/arc3-segmentation-cross-game-target-blind-ab/1"
            and .truth.public_trace_only==true
            and .truth.cross_game_public_development_proxy==true
            and .truth.source_assisted_replay==false
            and .truth.target_blind_public_development_behavior==true
            and .truth.independent_generalization_claim==false
            and .truth.provider_execution_is_not_kaggle_execution==true
            and .truth.kaggle_submission_attempted==false
            and .truth.submission_quota_spent==false
            and .selection.target_used_for_case_selection==false
            and .selection.target_used_for_prompt==false
            and .selection.distinct_game_count>=3
            and .predeclared_policy.no_target_matching==true
          ' segmentation-cross-game-target-blind-ab.json >/dev/null
          jq '{selection,arms,per_game,cross_game_comparison,promotion_gate,truth}' \
            segmentation-cross-game-target-blind-ab.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-segmentation-cross-game-target-blind-ab
          path: |
            segmentation-cross-game-target-blind-ab.json
            schema_public/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on inconclusive execution
        shell: bash
        run: |
          gate="$(jq -r '.promotion_gate' segmentation-cross-game-target-blind-ab.json)"
          case "$gate" in
            INCONCLUSIVE_*) exit 2 ;;
            *) exit 0 ;;
          esac
