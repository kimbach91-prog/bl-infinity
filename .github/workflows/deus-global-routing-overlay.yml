name: DEUS Global Routing Overlay V1
on:
  push:
    branches:
      - deus/global-routing-overlay-v1-20260924
    paths:
      - 'runtime/federation/scripts/global-routing-overlay.mjs'
      - '.github/workflows/deus-global-routing-overlay.yml'
      - 'runtime/federation/lib/internet-functional-fabric.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ingest RIPE RISwhois daily IPv4 and IPv6 dumps
        run: node runtime/federation/scripts/global-routing-overlay.mjs
      - name: Verify outputs
        run: |
          test -s .deus/internet-routing/v1/manifest.json
          test -s .deus/internet-routing/v1/ris-v4.jsonl
          test -s .deus/internet-routing/v1/ris-v6.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: deus-global-routing-overlay-${{ github.run_id }}
          path: .deus/internet-routing/v1/
          if-no-files-found: error
          compression-level: 6
