name: ARC3 public-trace housekeeping representation audit

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/harness/public_trace_housekeeping_audit.py
      - public_benchmark/arc3/harness/representation_granularity_guard.py
      - .github/workflows/arc3-public-trace-housekeeping-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and synthetic fail-closed test
        run: |
          python -m py_compile \
            public_benchmark/arc3/harness/representation_granularity_guard.py \
            public_benchmark/arc3/harness/public_trace_housekeeping_audit.py
          cd public_benchmark/arc3/harness
          python public_trace_housekeeping_audit.py --self-test > "$GITHUB_WORKSPACE/housekeeping-selftest.json"
      - name: Download pinned Tufa public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in \
            ar25-0c556536_p0_events.jsonl \
            ar25-0c556536_p10_events.jsonl \
            ar25-0c556536_p11_events.jsonl
          do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Run real public-trace representation audit
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/harness
          python public_trace_housekeeping_audit.py \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" \
            --output "$GITHUB_WORKSPACE/housekeeping-public-trace-audit.json"
      - name: Enforce v2 truth and representation contract
        run: |
          python - <<'PY'
          import json
          p='housekeeping-public-trace-audit.json'
          d=json.load(open(p))
          assert d['schema'] == 'deus/arc3-public-trace-housekeeping-audit/2'
          assert d['truth']['public_trace_only'] is True
          assert d['truth']['kaggle_hidden_score'] is False
          assert d['truth']['owner_score'] is False
          assert d['truth']['competition_submission'] is False
          assert d['truth']['model_behavior_gain'] is False
          assert d['promotion']['candidate_promotion'] is False
          assert d['aggregate']['transitions'] > 0
          assert d['promotion']['boundary_core_representation_evidence'] == 'PASS'
          assert d['aggregate']['boundary_core_char_ratio_vs_raw'] < 1.0
          print(json.dumps({
              'schema': d['schema'],
              'transitions': d['aggregate']['transitions'],
              'boundary_band_char_ratio_vs_raw': d['aggregate']['boundary_band_char_ratio_vs_raw'],
              'boundary_core_char_ratio_vs_raw': d['aggregate']['boundary_core_char_ratio_vs_raw'],
              'boundary_core_char_reduction_pct': d['aggregate']['boundary_core_char_reduction_pct'],
              'raw_repeat_support_ratio': d['audits']['raw_board_action']['repeat_support_ratio'],
              'core_repeat_support_ratio': d['audits']['boundary_core_action']['repeat_support_ratio'],
              'core_contradiction_ratio': d['audits']['boundary_core_action']['contradictory_repeated_state_ratio'],
              'core_status': d['audits']['boundary_core_action']['status'],
              'truth_boundary': 'PUBLIC_TRACE_ONLY_NO_KAGGLE_OR_MODEL_GAIN',
          }, sort_keys=True))
          PY
      - name: Upload audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-trace-housekeeping-audit-v2
          path: |
            housekeeping-public-trace-audit.json
            housekeeping-selftest.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
