name: ARC3 public effect taxonomy audit 166

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py
      - public_benchmark/arc3/kaggle_candidates/public_effect_taxonomy_audit_166.py
      - .github/workflows/arc3-public-effect-taxonomy-audit-166.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effect-taxonomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_effect_taxonomy_audit_166.py
      - name: Download exact pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in ar25-0c556536_p0_events.jsonl ar25-0c556536_p10_events.jsonl ar25-0c556536_p11_events.jsonl; do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute effect taxonomy audit
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_effect_taxonomy_audit_166.py \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" \
            --output "$GITHUB_WORKSPACE/effect-taxonomy-public-166.json"
      - name: Enforce truth boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('effect-taxonomy-public-166.json'))
          assert d['schema']=='deus/arc3-public-effect-taxonomy-audit/1'
          assert d['rung']==166
          t=d['truth']
          assert t['outcome_assisted_analysis'] is True
          assert t['preoutcome_prediction_made'] is False
          assert t['independent_generalization_claim'] is False
          assert t['kaggle_execution'] is False
          assert t['submission_quota_spent'] is False
          print(json.dumps({'rung':166,'gate':d['diagnostic_gate'],'aggregate':d['aggregate'],'truth':'OUTCOME_ASSISTED_EFFECT_TAXONOMY_ONLY'},sort_keys=True))
          PY
      - name: Upload rung 166 diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-effect-taxonomy-audit-166
          path: |
            effect-taxonomy-public-166.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

# explicit trigger after workflow registration
