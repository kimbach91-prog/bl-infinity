name: ARC3 Flash agent-state contract audit

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_flash_agent_state_patch.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_build_flash_next_package.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_flash_teardown_patch.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/arc-agi-flash-next-mtp.ipynb
      - .github/workflows/arc3-flash-agent-state-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage upstream-compatible builder tree
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public_benchmark/arc3/kaggle_candidates/flash_next_340"
          TMP="$RUNNER_TEMP/flash-agent-state-contract"
          mkdir -p "$TMP/scripts"
          cp "$ROOT/arc-agi-flash-next-mtp.ipynb" "$TMP/arc-agi-flash-next-mtp.ipynb"
          cp "$ROOT/upstream_build_flash_next_package.py" "$TMP/scripts/build_flash_next_package.py"
          cp "$ROOT/upstream_flash_teardown_patch.py" "$TMP/scripts/flash_teardown_patch.py"
          cp "$ROOT/upstream_flash_agent_state_patch.py" "$TMP/scripts/flash_agent_state_patch.py"
          echo "FLASH_CONTRACT_ROOT=$TMP" >> "$GITHUB_ENV"

      - name: Verify vendored patch identity and fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, hashlib, importlib.util, json, os
          from pathlib import Path

          root = Path(os.environ["FLASH_CONTRACT_ROOT"])
          patch_path = root / "scripts" / "flash_agent_state_patch.py"
          source = patch_path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          namespace = {}
          exec(compile(tree, str(patch_path), "exec"), namespace)

          checks = {
              "patch_name_exact": namespace.get("PATCH_NAME") == "reasoning-world-model-v1",
              "source_digest_bound": namespace.get("SOURCE_SHA256") == "535ee88b81b262fa5aedb785466ade9f3183a6417656fb6733427242baac7c9d",
              "patch_symbol_present": callable(namespace.get("patch_tool_agent")),
              "reasoning_update_present": "self._update_summarized_knowledge_from_assistant(reasoning)" in source,
              "markdown_label_parser_present": "re.IGNORECASE" in source and "rstrip" in source,
          }
          try:
              namespace["patch_tool_agent"](b"definitely-not-the-pinned-tool-agent")
              checks["digest_mismatch_fails_closed"] = False
          except ValueError as exc:
              checks["digest_mismatch_fails_closed"] = "digest changed" in str(exc)

          receipt = {
              "schema": "deus/arc3-flash-agent-state-source-contract/1",
              "upstream": {
                  "repo": "1zuki/arg-agi",
                  "commit": "f1b15a9af41f2557ed564ba01e11568456dd4f27",
                  "license": "MIT",
                  "upstream_path": "scripts/flash_agent_state_patch.py",
              },
              "vendored_patch_sha256": hashlib.sha256(patch_path.read_bytes()).hexdigest(),
              "checks": checks,
              "truth": {
                  "cpu_static_contract_only": True,
                  "gpu_model_behavior_verified": False,
                  "kaggle_kernel_run": False,
                  "competition_submission": False,
                  "submission_quota_spent": False,
                  "candidate_promoted": False,
              },
          }
          Path("flash-agent-state-source-contract.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          assert all(checks.values()), checks
          PY

      - name: Verify patch against pinned public Duck tool-agent source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/pinned-tool-agent.py"
          curl -fLsS --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/ARC3-Inference/inference/agent/tool_agent.py" \
            -o "$SRC"
          export PINNED_TOOL_AGENT="$SRC"
          python - <<'PY'
          import ast, hashlib, importlib.util, json, os, re
          from pathlib import Path
          from typing import Any

          root=Path(os.environ["FLASH_CONTRACT_ROOT"])
          patch_path=root/"scripts"/"flash_agent_state_patch.py"
          spec=importlib.util.spec_from_file_location("flash_agent_state_patch", patch_path)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          source_path=Path(os.environ["PINNED_TOOL_AGENT"])
          source=source_path.read_bytes()
          source_sha=hashlib.sha256(source).hexdigest()
          assert source_sha == mod.SOURCE_SHA256, (source_sha, mod.SOURCE_SHA256)
          patched=mod.patch_tool_agent(source)
          compile(patched, "patched-pinned-tool-agent.py", "exec")
          tree=ast.parse(patched)
          needed={"_normalize_summary_text","_extract_labeled_blocks","_extract_scientist_note"}
          nodes=[
              node for node in tree.body
              if isinstance(node, ast.FunctionDef) and node.name in needed
          ]
          assert {node.name for node in nodes} == needed
          ns={}
          exec(compile(ast.fix_missing_locations(ast.Module(
              body=[
                  ast.Import(names=[ast.alias(name="re")]),
                  ast.ImportFrom(module="typing", names=[ast.alias(name="Any")], level=0),
                  *nodes,
              ],
              type_ignores=[],
          )), "agent-state-parser-contract.py", "exec"), ns)
          note=ns["_extract_scientist_note"](
              "**World Model (v42):** newest scene\n**Plan:** take the verified route"
          )
          checks={
              "pinned_source_sha_matches": source_sha == mod.SOURCE_SHA256,
              "patched_compiles": True,
              "reasoning_state_update_present":
                  "self._update_summarized_knowledge_from_assistant(reasoning)" in patched,
              "markdown_world_model_parses": note.get("world_model") == "newest scene",
              "markdown_plan_parses": note.get("current_plan") == "take the verified route",
          }
          receipt={
              "schema":"deus/arc3-flash-agent-state-pinned-source-compat/1",
              "source":{
                  "repo":"Tufalabs/duck-harness",
                  "commit":"7652836056c59e044f093e3c13ed7438c814169e",
                  "path":"ARC3-Inference/inference/agent/tool_agent.py",
                  "sha256":source_sha,
              },
              "patched_sha256":hashlib.sha256(patched.encode()).hexdigest(),
              "checks":checks,
              "truth":{
                  "public_source_network_read":True,
                  "cpu_source_compatibility_verified":True,
                  "gpu_model_behavior_verified":False,
                  "kaggle_kernel_run":False,
                  "competition_submission":False,
                  "submission_quota_spent":False,
                  "candidate_promoted":False,
              },
          }
          Path("flash-agent-state-pinned-source-compat.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n", encoding="utf-8"
          )
          print(json.dumps(receipt,indent=2,sort_keys=True))
          assert all(checks.values()), checks
          PY

      - name: Build patched preflight package without provider execution
        shell: bash
        run: |
          set -euo pipefail
          OUT="$FLASH_CONTRACT_ROOT/build/agent-state-preflight"
          python "$FLASH_CONTRACT_ROOT/scripts/build_flash_next_package.py" \
            --kernel-id "deusplaceholder/arc-agi3-flash-agent-state-contract" \
            --mode preflight \
            --max-games 1 \
            --game-id tr87-cd924810 \
            --concurrency 1 \
            --runtime-seconds 300 \
            --agent-state-patch \
            --output-dir "$OUT"
          echo "FLASH_PATCHED_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Verify generated notebook carries overlay and base candidate remains untouched
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path

          out = Path(os.environ["FLASH_PATCHED_OUT"])
          nbs = list(out.glob("*.ipynb"))
          assert len(nbs) == 1, nbs
          notebook = json.loads(nbs[0].read_text(encoding="utf-8"))
          code = "\n".join(
              "".join(c.get("source", []))
              for c in notebook.get("cells", [])
              if c.get("cell_type") == "code"
          )
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") == "code":
                  compile(
                      "".join(cell.get("source", [])),
                      f"generated:cell-{index}",
                      "exec",
                      flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
                  )

          base = Path(
              "public_benchmark/arc3/kaggle_candidates/flash_next_340/"
              "arc-agi-flash-next-mtp.ipynb"
          )
          checks = {
              "agent_state_patch_marker": "FLASH_AGENT_STATE_PATCH" in code,
              "overlay_ready_marker": "FLASH_AGENT_OVERLAY_READY" in code,
              "overlay_reasserted_marker": "FLASH_AGENT_OVERLAY_REASSERTED" in code,
              "overlay_imported_marker": "FLASH_AGENT_OVERLAY_IMPORTED" in code,
              "base_notebook_sha256_unchanged": hashlib.sha256(base.read_bytes()).hexdigest()
                  == "6cff5483a6240cfe249310778a68e58df6f164acca25e5b4504eeaade838c899",
          }
          receipt = {
              "schema": "deus/arc3-flash-agent-state-build-contract/1",
              "generated_notebook_sha256": hashlib.sha256(nbs[0].read_bytes()).hexdigest(),
              "checks": checks,
              "truth": {
                  "build_executed": True,
                  "gpu_model_behavior_verified": False,
                  "kaggle_auth_used": False,
                  "kaggle_kernel_run": False,
                  "competition_submission": False,
                  "submission_quota_spent": False,
                  "base_c8r2_mutated": False,
                  "candidate_promoted": False,
              },
          }
          Path("flash-agent-state-build-contract.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          assert all(checks.values()), checks
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-flash-agent-state-contract-receipts
          path: |
            flash-agent-state-source-contract.json
            flash-agent-state-pinned-source-compat.json
            flash-agent-state-build-contract.json
          if-no-files-found: error
