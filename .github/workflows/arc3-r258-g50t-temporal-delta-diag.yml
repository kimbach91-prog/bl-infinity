name: ARC3 R258 g50t temporal delta diagnostic

on:
  push:
    branches:
      - deus/r258-g50t-temporal-delta-diag-20260923
    paths:
      - .github/workflows/arc3-r258-g50t-temporal-delta-diag.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-r258-g50t:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py public_benchmark/arc3/kaggle_candidates/public_transition_morphology_diag_253.py public_benchmark/arc3/kaggle_candidates/public_temporal_delta_diag_258.py
      - name: Stage g50t p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 9); do
            f="g50t-5849a774_p${p}_events.jsonl"
            src="upstream-duck/example-run/artifacts/$f"
            test -s "$src"; cp "$src" "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute diagnostic
        shell: bash
        run: |
          set -euo pipefail
          args=(); for f in public_trace/g50t-5849a774_p*_events.jsonl; do args+=(--input "$f"); done
          test "${#args[@]}" -eq 20
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_temporal_delta_diag_258.py "${args[@]}" --output r258-g50t-temporal-delta.json 2> >(tee r258-runtime.txt >&2) | tee r258-stdout.txt
      - name: Verify and digest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('r258-g50t-temporal-delta.json').read_text())
          assert d['schema']=='deus/arc3-r258-temporal-delta-diagnostic/1'
          t=d['truth']; assert t['public_trace_only'] and not t['game_source_read'] and not t['p10_p19_read'] and not t['kaggle_execution'] and not t['competition_submission']
          Path('r258-verdict.json').write_text(json.dumps({'verdict':'DIAGNOSTIC_ONLY_NO_PROMOTION','best_mode':d['best_mode'],'modes':{k:v['validation'] for k,v in d['modes'].items()}},indent=2,sort_keys=True)+'\n')
          PY
          sha256sum r258-g50t-temporal-delta.json r258-verdict.json r258-runtime.txt r258-stdout.txt public_trace/SHA256SUMS.txt > R258_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r258-g50t-temporal-delta-diag
          path: |
            r258-g50t-temporal-delta.json
            r258-verdict.json
            r258-runtime.txt
            r258-stdout.txt
            R258_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
