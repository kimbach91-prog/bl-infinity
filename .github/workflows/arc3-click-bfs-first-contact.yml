name: ARC3 generic click-BFS first-contact search

on:
  push:
    branches: [deus/arc3-click-bfs-first-contact-20260920]
    paths: [.github/workflows/arc3-click-bfs-first-contact.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        game: [lp85]
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Generic observation-derived search then ONLINE replay
        env:
          GAME: ${{ matrix.game }}
        run: |
          python - <<'PY'
          import copy, hashlib, json, os, platform, time
          from collections import deque, Counter
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          GAME=os.environ['GAME']
          OUT=Path('verification'); OUT.mkdir()

          def arr(obs):
              return np.asarray(obs.frame[-1], dtype=np.uint8)

          def normalized_frame(obs):
              g=arr(obs).copy()
              # ARC public environments often place countdown/timer HUD on an edge.
              # Remove only edge HUD rows from the search key; real state remains untouched.
              if g.shape[0] >= 4:
                  g[:2,:]=0; g[-2:,:]=0
              return g

          def state_hash(obs):
              g=normalized_frame(obs)
              return hashlib.sha256(g.tobytes()).hexdigest()

          def component_centroids(obs, cap=160):
              g=arr(obs)
              h,w=g.shape
              vals=Counter(int(x) for x in g.ravel())
              bg=vals.most_common(1)[0][0]
              seen=np.zeros((h,w),dtype=bool)
              comps=[]
              for y in range(2,max(2,h-2)):
                  for x in range(w):
                      if seen[y,x] or int(g[y,x])==bg:
                          continue
                      color=int(g[y,x]); q=[(y,x)]; seen[y,x]=True; pts=[]
                      while q:
                          yy,xx=q.pop(); pts.append((yy,xx))
                          for dy,dx in ((1,0),(-1,0),(0,1),(0,-1)):
                              ny,nx=yy+dy,xx+dx
                              if 0<=ny<h and 0<=nx<w and not seen[ny,nx] and int(g[ny,nx])==color:
                                  seen[ny,nx]=True; q.append((ny,nx))
                      n=len(pts)
                      # Ignore enormous background-like structures but keep both tiny controls and pieces.
                      if 1 <= n <= 512:
                          ys=[p[0] for p in pts]; xs=[p[1] for p in pts]
                          cx=int(round(sum(xs)/n)); cy=int(round(sum(ys)/n))
                          if 0<=cx<w and 2<=cy<h-2:
                              comps.append((n,color,cx,cy,min(xs),max(xs),min(ys),max(ys),pts))
              # prefer compact/small interactive-looking objects
              comps.sort(key=lambda z:(z[0], z[1], z[6], z[4]))
              pts=[]; used=set()
              for n,color,cx,cy,x0,x1,y0,y1 in comps:
                  for px,py in ((cx,cy),((x0+x1)//2,(y0+y1)//2)):
                      k=(px,py)
                      if k not in used:
                          used.add(k); pts.append(k)
                      if len(pts)>=cap: return pts
              return pts

          def action_ids(obs):
              raw=getattr(obs,'available_actions',None) or []
              ids=[]
              for a in raw:
                  try: v=int(a.value)
                  except Exception:
                      try: v=int(a)
                      except Exception: continue
                  if v not in ids: ids.append(v)
              return ids

          def candidates(obs):
              ids=action_ids(obs)
              out=[]
              for aid in ids:
                  if 1 <= aid <= 5:
                      out.append((aid,None))
              if 6 in ids:
                  for x,y in component_centroids(obs):
                      out.append((6,{'x':int(x),'y':int(y)}))
              return out

          def step(env, obs, act):
              aid,data=act
              amap={a.value:a for a in env.action_space}
              if aid not in amap: return None
              try:
                  return env.step(amap[aid],data=data)
              except Exception:
                  return None

          def solve_one_level(env0, obs0, max_expansions=12000):
              start=int(obs0.levels_completed)
              q=deque([(copy.deepcopy(env0), obs0, [])])
              seen={state_hash(obs0)}
              exp=0; t0=time.monotonic()
              max_queue=1
              while q and exp<max_expansions and time.monotonic()-t0<180:
                  env,obs,path=q.popleft()
                  for act in candidates(obs):
                      e2=copy.deepcopy(env)
                      nf=step(e2,obs,act)
                      exp+=1
                      if nf is None: continue
                      if int(nf.levels_completed)>start:
                          return {'path':path+[act],'expansions':exp,'seen':len(seen),'seconds':time.monotonic()-t0}
                      if getattr(nf.state,'value',str(nf.state)) in ('GAME_OVER','WIN'):
                          continue
                      h=state_hash(nf)
                      if h in seen: continue
                      seen.add(h)
                      q.append((e2,nf,path+[act]))
                      if len(q)>max_queue: max_queue=len(q)
              return {'path':None,'expansions':exp,'seen':len(seen),'seconds':time.monotonic()-t0,'queue_peak':max_queue}

          normal=arc_agi.Arcade(operation_mode=OperationMode.NORMAL)
          env=normal.make(GAME,seed=0,save_recording=False,include_frame_data=True)
          if env is None: raise RuntimeError('NORMAL_ENV_UNAVAILABLE')
          obs=env.observation_space
          discovered=[]
          level_search=[]
          start_t=time.monotonic()
          target_win=int(getattr(obs,'win_levels',0) or 0)

          # Search each level from observations only. No external action route is loaded.
          while getattr(obs.state,'value',str(obs.state))!='WIN':
              lv=int(obs.levels_completed)
              if target_win and lv>=target_win: break
              res=solve_one_level(env,obs)
              level_search.append({'level':lv,**{k:v for k,v in res.items() if k!='path'},'path_len':None if res['path'] is None else len(res['path'])})
              if res['path'] is None:
                  break
              before=lv
              for act in res['path']:
                  nf=step(env,obs,act)
                  if nf is None: raise RuntimeError('REAL_REPLAY_STEP_FAILED')
                  obs=nf; discovered.append(act)
              if int(obs.levels_completed)<=before:
                  raise RuntimeError('REAL_REPLAY_DID_NOT_LEVEL')
              if len(discovered)>1200:
                  raise RuntimeError('ROUTE_BUDGET_EXCEEDED')

          normal_done={
              'game':GAME,
              'levels_completed':int(obs.levels_completed),
              'win_levels':int(getattr(obs,'win_levels',0) or 0),
              'state':getattr(obs.state,'value',str(obs.state)),
              'actions':len(discovered),
              'search':level_search,
              'search_seconds':time.monotonic()-start_t,
              'route':discovered,
          }

          online_receipt=None
          if normal_done['state']=='WIN' or (normal_done['win_levels'] and normal_done['levels_completed']>=normal_done['win_levels']):
              source_url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/blob/'+os.environ['GITHUB_SHA']+'/.github/workflows/arc3-click-bfs-first-contact.yml'
              online=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
              card_id=online.open_scorecard(source_url=source_url,tags=['DEUS',GAME,'public-development','generic-click-bfs','first-contact-search'])
              oenv=online.make(GAME,seed=0,scorecard_id=card_id,save_recording=False,include_frame_data=True)
              if oenv is None: raise RuntimeError('ONLINE_ENV_UNAVAILABLE')
              o=oenv.observation_space
              t1=time.monotonic()
              for i,act in enumerate(discovered,1):
                  nf=step(oenv,o,act)
                  if nf is None: raise RuntimeError('ONLINE_STEP_FAILED_'+str(i))
                  o=nf
              card=online.close_scorecard(card_id)
              online_receipt={
                  'schema':'deus/arc3-generic-first-contact/1',
                  'system_label':'DEUS',
                  'game':GAME,
                  'seed':0,
                  'result':'PASS' if getattr(o.state,'value',str(o.state))=='WIN' else 'FAIL',
                  'levels_completed':int(o.levels_completed),
                  'win_levels':int(getattr(o,'win_levels',0) or 0),
                  'state':getattr(o.state,'value',str(o.state)),
                  'actions_executed':len(discovered),
                  'scorecard_id':card_id,
                  'scorecard_score':None if card is None else card.score,
                  'route_sha256':hashlib.sha256(json.dumps(discovered,sort_keys=True,separators=(',',':')).encode()).hexdigest(),
                  'final_frame_sha256':hashlib.sha256(arr(o).tobytes()).hexdigest(),
                  'online_seconds':time.monotonic()-t1,
                  'run_id':os.environ['GITHUB_RUN_ID'],
                  'source_sha':os.environ['GITHUB_SHA'],
                  'python':platform.python_version(),
                  'toolkit':'arc-agi 0.9.9',
                  'engine':'arcengine 0.9.3',
                  'protocol':'PUBLIC_OBSERVATION_DERIVED_GENERIC_BFS',
                  'external_full_route_used':False,
                  'game_source_inspected_by_solver':False,
                  'hidden_state_read':False,
                  'competition_hidden_score_claim':False,
              }

          rec={'normal':normal_done,'online':online_receipt}
          (OUT/'receipt.json').write_text(json.dumps(rec,indent=2))
          print('DEUS_GENERIC_SEARCH_RECEIPT='+json.dumps(rec,separators=(',',':')))
          if online_receipt is None or online_receipt['result']!='PASS':
              raise RuntimeError('FULL_WIN_NOT_REACHED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-click-bfs-${{ matrix.game }}
          path: verification/
          retention-days: 30
