name: ARC3 R316 dc22 phase frozen p10-p19

on:
  push:
    branches:
      - deus/r314-residual4-mode-sharded-loto-20260923
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_dc22_phase_frozen_p10p19_316.py
      - .github/workflows/arc3-r316-dc22-phase-frozen-p10p19.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage p0-p4 train and exact p10-p19 final only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 4) $(seq 10 19); do
            f="dc22-fdcac232_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "public_trace/${f}"
          done
          test "$(find public_trace -type f -name '*_events.jsonl' | wc -l)" -eq 15
          ! find public_trace -type f -name '*_p[5-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute frozen final audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_dc22_phase_frozen_p10p19_316.py
          train=(); for p in $(seq 0 4); do train+=(--train "public_trace/dc22-fdcac232_p${p}_events.jsonl"); done
          evals=(); for p in $(seq 10 19); do evals+=(--eval "public_trace/dc22-fdcac232_p${p}_events.jsonl"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_dc22_phase_frozen_p10p19_316.py "${train[@]}" "${evals[@]}" --output r316-dc22-phase-p10p19.json 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r316-dc22-phase-p10p19.json'))
          assert d['schema']=='deus/arc3-r316-dc22-phase-frozen-p10p19/1'
          assert d['game']=='dc22-fdcac232' and d['mode']=='phase'
          p=d['protocol']; t=d['truth']
          assert p['fit']=='public p0-p4 all five traces'
          assert p['evaluation']=='public p10-p19 one-shot frozen final audit'
          assert p['p5_p9_staged_or_read'] is False
          assert p['selector_or_representation_updates_after_final_read'] is False
          assert t['p10_p19_read'] is True and t['frozen_final_audit'] and not t['retuned_on_final']
          assert not t['solver_promotion'] and not t['kaggle_execution'] and not t['competition_submission']
          print(json.dumps({'verdict':d['verdict'],'eval_total':d['eval_total']},sort_keys=True))
          PY
          sha256sum r316-dc22-phase-p10p19.json runtime.txt stdout.txt public_trace/SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r316-dc22-phase-p10p19
          path: |
            r316-dc22-phase-p10p19.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
