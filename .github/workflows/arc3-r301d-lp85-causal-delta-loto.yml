name: ARC3 R301D lp85 causal-delta LOTO
on:
  push:
    branches: [deus/r301d-lp85-causal-delta-loto-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_lp85_causal_delta_loto_301d.py
      - .github/workflows/arc3-r301d-lp85-causal-delta-loto.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_lp85_causal_delta_loto_301d.py
      - name: Stage exact lp85 p0-p4 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 4); do
            f="lp85-305b61c3_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "public_trace/${f}"
          done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 5
          ! find public_trace -maxdepth 1 -type f -name '*_p[5-9]_events.jsonl' | grep -q .
          ! find public_trace -maxdepth 1 -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute diagnostic
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in $(find public_trace -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_lp85_causal_delta_loto_301d.py "${args[@]}" --output r301d-lp85.json 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit truth boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r301d-lp85.json'))
          assert d['schema']=='deus/arc3-r301d-lp85-causal-delta-loto/1'
          p=d['protocol']; t=d['truth']
          assert p['p5_p9_staged_or_read'] is False and p['p10_p19_staged_or_read'] is False
          assert t['public_trace_only'] and t['source_free_runtime_logic']
          assert not t['p5_p9_read'] and not t['p10_p19_read']
          assert not t['solver_promotion'] and not t['kaggle_execution'] and not t['competition_submission']
          print(json.dumps({'verdict':d['verdict']},sort_keys=True))
          PY
          sha256sum r301d-lp85.json runtime.txt stdout.txt public_trace/SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r301d-lp85-causal-delta-loto
          path: |
            r301d-lp85.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
