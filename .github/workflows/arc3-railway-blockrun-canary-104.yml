name: ARC3 Railway distinct-egress BlockRun canary 104

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - '.github/workflows/arc3-railway-blockrun-canary-104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distinct-egress-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Call fixed Railway canary endpoint
        shell: bash
        run: |
          set -euo pipefail
          url='https://deus-railway-controller-production.up.railway.app/arc3-blockrun-canary-104'
          code="$(curl --silent --show-error --location --max-time 60 -o railway-blockrun-canary-104.json -w '%{http_code}' "$url")"
          printf '%s\n' "$code" > railway-http-status.txt
          test "$code" = '200'
          jq -e '.probe=="ARC3_BLOCKRUN_CANARY_104" and (.upstream_status|type)=="number" and (.provider_execution|type)=="boolean"' railway-blockrun-canary-104.json >/dev/null
          jq '{probe,upstream_status,provider_execution,content,body_excerpt,error}' railway-blockrun-canary-104.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload exact distinct-egress receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-railway-blockrun-canary-104
          path: |
            railway-blockrun-canary-104.json
            railway-http-status.txt
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed unless upstream executed and calibration label matches
        shell: bash
        run: |
          jq -e '.upstream_status==200 and .provider_execution==true and ((.content // "")|ascii_upcase|contains("ALPHA"))' railway-blockrun-canary-104.json >/dev/null
