name: ARC3 alternate LLM7 route probe 130

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - '.github/workflows/arc3-llm7-route-probe-130.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm7-route-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe three fresh anonymous calls with model/readback grounding
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/rows.jsonl
          for i in 1 2 3; do
            marker="DEUS_ARC3_LLM7_ROUTE_${i}_OK"
            jq -n --arg marker "$marker" '{model:"default",messages:[{role:"user",content:("Public S0 route canary. Reply exactly: "+$marker)}],temperature:0,max_tokens:32}' >/tmp/request.json
            start_ms="$(date +%s%3N)"
            code="$(curl --max-time 90 -sS -o /tmp/response.json -w '%{http_code}' -X POST 'https://api.llm7.io/v1/chat/completions' -H 'Content-Type: application/json' --data-binary @/tmp/request.json || true)"
            end_ms="$(date +%s%3N)"
            served_model="$(jq -r '.model // ""' /tmp/response.json 2>/dev/null || true)"
            content="$(jq -r '.choices[0].message.content // ""' /tmp/response.json 2>/dev/null || true)"
            exact=false
            [ "$content" = "$marker" ] && exact=true
            digest="$(sha256sum /tmp/response.json | awk '{print $1}')"
            jq -n --argjson call "$i" --arg status "$code" --arg model "$served_model" --arg marker "$marker" --arg content "$content" --arg digest "$digest" --argjson latency_ms "$((end_ms-start_ms))" --argjson exact "$exact" '{call:$call,http_status:($status|tonumber),served_model:$model,expected:$marker,content:$content,exact_contract:$exact,latency_ms:$latency_ms,response_sha256:$digest}' >> /tmp/rows.jsonl
            if [ "$i" -lt 3 ]; then sleep 3; fi
          done
          jq -s '{schema:"deus/arc3-llm7-route-probe/1",rung:130,provider:"LLM7",endpoint:"https://api.llm7.io/v1/chat/completions",auth_mode:"NO_AUTH_HEADER",data_class:"S0_PUBLIC_ONLY",calls:.,summary:{call_count:length,http200_count:(map(select(.http_status==200))|length),exact_contract_count:(map(select(.exact_contract==true))|length),served_models:(map(.served_model)|unique)},truth:{provider_execution:(all(.[];.http_status==200)),stable_served_model:((map(.served_model)|unique|length)==1),no_secret_used:true,no_kaggle_data:true,no_kaggle_execution:true,no_submission:true,no_owner_score_claim:true}}' /tmp/rows.jsonl > /tmp/receipt.json
          cat /tmp/receipt.json
          sha256sum /tmp/receipt.json > /tmp/receipt.sha256
          jq -e '.summary.call_count==3 and .summary.http200_count==3 and .summary.exact_contract_count==3 and .truth.provider_execution==true and .truth.no_secret_used==true' /tmp/receipt.json >/dev/null

      - name: Upload route receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-llm7-route-probe-130
          path: |
            /tmp/receipt.json
            /tmp/receipt.sha256
          if-no-files-found: error
          retention-days: 30
