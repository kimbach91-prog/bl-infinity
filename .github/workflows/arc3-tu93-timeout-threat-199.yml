name: ARC3 TU93 timeout-threat symbolic 199

on:
  push:
    branches:
      - deus/arc3-remaining14-coverage-20260922
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_tu93_timeout_threat_symbolic_199.py
      - .github/workflows/arc3-tu93-timeout-threat-199.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tu93-symbolic-r199:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_tu93_symbolic_lattice_planner_198.py \
            public_benchmark/arc3/kaggle_candidates/public_tu93_timeout_threat_symbolic_199.py
      - name: Download TU93 p0-p19
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for p in $(seq 0 19); do
            f="tu93-0768757b_p${p}_events.jsonl"
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute repaired symbolic verifier
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/tu93-0768757b_p*_events.jsonl; do args+=(--input "$f"); done
          set +e
          python public_benchmark/arc3/kaggle_candidates/public_tu93_timeout_threat_symbolic_199.py \
            "${args[@]}" --output tu93-r199.json | tee tu93-r199.stdout
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > tu93-r199.rc
      - name: Verify receipt and preserve falsifier
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('tu93-r199.json'))
          t=d['truth']
          assert t['preaction_only_outcome_prediction'] is True
          assert t['postterminal_actions_excluded'] is True
          assert t['timeout_read_from_preaction_hud'] is True
          assert t['directional_threat_zone_from_preaction_board'] is True
          assert t['planner_state_includes_remaining_threats'] is True
          assert t['kaggle_execution'] is False
          print(json.dumps({
            'rung':199,'gate':d['diagnostic_gate'],
            'classifier':{k:v for k,v in d['transition_classifier'].items() if k not in ('per_trace','mismatch_examples')},
            'planner':{k:v for k,v in d['planner'].items() if k!='no_plan_examples'},
            'mismatches':d['transition_classifier']['mismatch_examples'][:12],
            'no_plan_examples':d['planner']['no_plan_examples'][:6]
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-tu93-r199
          path: |
            tu93-r199.json
            tu93-r199.stdout
            tu93-r199.rc
            public_trace/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Gate
        run: |
          set -euo pipefail
          test "$(cat tu93-r199.rc)" -eq 0
