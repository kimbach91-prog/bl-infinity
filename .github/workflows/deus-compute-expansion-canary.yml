name: DEUS Compute Expansion Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-compute-expansion-canary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expansion-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe new public compute lanes
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/deus-expansion

          probe_post() {
            name="$1"; url="$2"; model="$3"; token="$4"; auth="$5"; timeout="$6"
            req="/tmp/deus-expansion/$name.req.json"
            resp="/tmp/deus-expansion/$name.resp"
            codefile="/tmp/deus-expansion/$name.code"
            jq -n --arg model "$model" --arg token "$token" '{model:$model,messages:[{role:"user",content:("Public S0 canary. Reply with exactly: "+$token)}],temperature:0}' > "$req"
            start="$(date +%s%3N)"
            if [ -n "$auth" ]; then
              curl --max-time "$timeout" -sS -o "$resp" -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' -H "authorization: Bearer $auth" --data-binary @"$req" > "$codefile" || true
            else
              curl --max-time "$timeout" -sS -o "$resp" -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' --data-binary @"$req" > "$codefile" || true
            fi
            latency="$(( $(date +%s%3N) - start ))"
            code="$(cat "$codefile" 2>/dev/null || echo 0)"
            exact=false
            if [ "$code" = "200" ] && grep -Fq "$token" "$resp" 2>/dev/null; then exact=true; fi
            digest="$(sha256sum "$resp" 2>/dev/null | awk '{print $1}' || true)"
            jq -n --arg provider "$name" --arg endpoint "$url" --arg model "$model" --arg status "$code" --arg digest "$digest" --argjson latency "$latency" --argjson exact "$exact" '{provider:$provider,endpoint:$endpoint,model:$model,http_status:($status|tonumber),latency_ms:$latency,exact_contract:$exact,response_digest:$digest,provider_execution:($status=="200")}'
          }

          probe_pollinations() {
            token="DEUS_POLLINATIONS_EXPANSION_OK"
            prompt="$(jq -nr --arg s "Public S0 canary. Reply with exactly: DEUS_POLLINATIONS_EXPANSION_OK" '$s|@uri')"
            resp="/tmp/deus-expansion/POLLINATIONS.resp"
            codefile="/tmp/deus-expansion/POLLINATIONS.code"
            start="$(date +%s%3N)"
            curl -L --max-time 25 -sS -o "$resp" -w '%{http_code}' "https://text.pollinations.ai/$prompt?model=openai&seed=42" > "$codefile" || true
            latency="$(( $(date +%s%3N) - start ))"
            code="$(cat "$codefile" 2>/dev/null || echo 0)"
            exact=false
            if [ "$code" = "200" ] && grep -Fq "$token" "$resp" 2>/dev/null; then exact=true; fi
            digest="$(sha256sum "$resp" 2>/dev/null | awk '{print $1}' || true)"
            jq -n --arg status "$code" --arg digest "$digest" --argjson latency "$latency" --argjson exact "$exact" '{provider:"POLLINATIONS_LEGACY",endpoint:"https://text.pollinations.ai/{prompt}",http_status:($status|tonumber),latency_ms:$latency,exact_contract:$exact,response_digest:$digest,provider_execution:($status=="200")}'
          }

          probe_post "PERSORAI" "https://persorai.com/v1/chat/completions" "@cf/zai-org/glm-5.2" "DEUS_PERSORAI_EXPANSION_OK" "deus-public-canary" 25 > /tmp/deus-expansion/persorai.json
          probe_pollinations > /tmp/deus-expansion/pollinations.json
          probe_post "BLOCKRUN_ULTRA" "https://blockrun.ai/api/v1/chat/completions" "nvidia/nemotron-3-ultra-550b" "DEUS_BLOCKRUN_ULTRA_EXPANSION_OK" "" 25 > /tmp/deus-expansion/blockrun_ultra.json
          probe_post "BLOCKRUN_OMNI" "https://blockrun.ai/api/v1/chat/completions" "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning" "DEUS_BLOCKRUN_OMNI_EXPANSION_OK" "" 25 > /tmp/deus-expansion/blockrun_omni.json
          probe_post "BLOCKRUN_CODE" "https://blockrun.ai/api/v1/chat/completions" "cohere/north-mini-code" "DEUS_BLOCKRUN_CODE_EXPANSION_OK" "" 25 > /tmp/deus-expansion/blockrun_code.json
          probe_post "BLOCKRUN_LLAMA_VISION" "https://blockrun.ai/api/v1/chat/completions" "nvidia/llama-3.2-11b-vision" "DEUS_BLOCKRUN_LLAMA_EXPANSION_OK" "" 25 > /tmp/deus-expansion/blockrun_llama.json
          probe_post "BLOCKRUN_LAGUNA" "https://blockrun.ai/api/v1/chat/completions" "poolside/laguna-xs-2.1" "DEUS_BLOCKRUN_LAGUNA_EXPANSION_OK" "" 25 > /tmp/deus-expansion/blockrun_laguna.json

          jq -n \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile persorai /tmp/deus-expansion/persorai.json \
            --slurpfile pollinations /tmp/deus-expansion/pollinations.json \
            --slurpfile ultra /tmp/deus-expansion/blockrun_ultra.json \
            --slurpfile omni /tmp/deus-expansion/blockrun_omni.json \
            --slurpfile code /tmp/deus-expansion/blockrun_code.json \
            --slurpfile llama /tmp/deus-expansion/blockrun_llama.json \
            --slurpfile laguna /tmp/deus-expansion/blockrun_laguna.json \
            '{receipt_version:"DEUS-COMPUTE-EXPANSION/1",updated_at:$updated_at,routes:{persorai:$persorai[0],pollinations:$pollinations[0],blockrun_ultra:$ultra[0],blockrun_omni:$omni[0],blockrun_code:$code[0],blockrun_llama_vision:$llama[0],blockrun_laguna:$laguna[0]}}' \
            | tee /tmp/deus-expansion/receipt.json
          jq -e '.receipt_version=="DEUS-COMPUTE-EXPANSION/1"' /tmp/deus-expansion/receipt.json >/dev/null

      - name: Checkout durable expansion state
        uses: actions/checkout@v4
        with:
          ref: deus-compute-expansion-state
          fetch-depth: 1

      - name: Persist expansion receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deus-compute-expansion
          cp /tmp/deus-expansion/receipt.json .deus-compute-expansion/receipt.json
          jq -n --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_id "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg source_sha "$GITHUB_SHA" '{updated_at:$updated_at,run_id:$run_id,run_attempt:$attempt,source_sha:$source_sha}' > .deus-compute-expansion/runtime-meta.json
          git config user.name "DEUS Compute Expansion"
          git config user.email "actions@users.noreply.github.com"
          git add .deus-compute-expansion
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore: update DEUS compute expansion state [skip ci]"
            git push origin HEAD:deus-compute-expansion-state
          fi
