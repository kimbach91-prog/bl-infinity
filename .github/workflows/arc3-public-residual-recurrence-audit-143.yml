name: ARC3 public residual recurrence audit 143

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py
      - public_benchmark/arc3/kaggle_candidates/public_unique_component_motion_audit_140.py
      - public_benchmark/arc3/kaggle_candidates/public_residual_recurrence_audit_143.py
      - .github/workflows/arc3-public-residual-recurrence-audit-143.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-recurrence-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_object_role_transition_prequential_138.py \
            public_benchmark/arc3/kaggle_candidates/public_unique_component_motion_audit_140.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_recurrence_audit_143.py
          cd public_benchmark/arc3/kaggle_candidates
          python public_residual_recurrence_audit_143.py --self-test \
            --output "$GITHUB_WORKSPACE/residual-recurrence-selftest-143.json"
      - name: Download exact pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in \
            ar25-0c556536_p0_events.jsonl \
            ar25-0c556536_p10_events.jsonl \
            ar25-0c556536_p11_events.jsonl
          do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute residual recurrence diagnostic
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_residual_recurrence_audit_143.py \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" \
            --output "$GITHUB_WORKSPACE/residual-recurrence-public-143.json"
      - name: Enforce diagnostic truth boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('residual-recurrence-public-143.json'))
          assert d['schema']=='deus/arc3-public-residual-recurrence-audit/1'
          assert d['rung']==143
          assert d['diagnostic_gate']=='RESIDUAL_RECURRENCE_CHARACTERIZED'
          assert d['representation_change_from_rung141']['changed'] is True
          t=d['truth']
          assert t['diagnostic_only'] is True
          assert t['current_outcome_used_to_isolate_current_residual'] is True
          assert t['prequential_recurrence_counts_use_only_prior_seen_sets'] is True
          assert t['solver_behavior_gain_claim'] is False
          assert t['model_execution'] is False
          assert t['gpu_execution'] is False
          assert t['kaggle_execution'] is False
          assert t['submission_quota_spent'] is False
          print(json.dumps({'rung':143,'aggregate':d['aggregate'],'truth':'PUBLIC_RESIDUAL_RECURRENCE_DIAGNOSTIC_ONLY'},sort_keys=True))
          PY
      - name: Upload rung 143 diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-residual-recurrence-audit-143
          path: |
            residual-recurrence-public-143.json
            residual-recurrence-selftest-143.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
