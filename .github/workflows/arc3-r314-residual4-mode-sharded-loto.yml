name: ARC3 R314 residual4 mode-sharded LOTO
on:
  push:
    branches: [deus/r314-residual4-mode-sharded-loto-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_residual4_mode_shard_314.py
      - .github/workflows/arc3-r314-residual4-mode-sharded-loto.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        game:
          - dc22-fdcac232
          - ft09-0d8bbf25
          - tr87-cd924810
          - wa30-ee6fef47
        mode: [spatial, phase, delta]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage exact p0-p4 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 4); do
            f="${{ matrix.game }}_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "public_trace/${f}"
          done
          test "$(find public_trace -type f -name '*_events.jsonl' | wc -l)" -eq 5
          ! find public_trace -type f -name '*_p[5-9]_events.jsonl' | grep -q .
          ! find public_trace -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute shard
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_residual4_mode_shard_314.py
          args=(); for f in $(find public_trace -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          out="r314-${{ matrix.game }}-${{ matrix.mode }}.json"
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_residual4_mode_shard_314.py "${args[@]}" --game "${{ matrix.game }}" --mode "${{ matrix.mode }}" --output "${out}" 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit
        shell: bash
        run: |
          python - <<'PY'
          import json,glob
          d=json.load(open(glob.glob('r314-*.json')[0]))
          assert d['schema']=='deus/arc3-r314-residual4-mode-shard/1'
          p=d['protocol']; t=d['truth']
          assert p['p5_p9_staged_or_read'] is False and p['p10_p19_staged_or_read'] is False
          assert t['runtime_shard_only'] and not t['p5_p9_read'] and not t['p10_p19_read']
          assert not t['solver_promotion'] and not t['kaggle_execution'] and not t['competition_submission']
          print(json.dumps({'game':d['game'],'mode':d['mode'],'verdict':d['verdict']},sort_keys=True))
          PY
          sha256sum r314-*.json runtime.txt stdout.txt public_trace/SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r314-${{ matrix.game }}-${{ matrix.mode }}
          path: |
            r314-*.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
