name: DEUS Ω-DCRS continuity verifier tests

on:
  push:
    branches:
      - proto/deus-cognitive-loop-v0
      - proto/deus-dcrs-cleanroom
    paths:
      - experiments/virtual-cortex-v0/omega_dcrs.py
      - experiments/virtual-cortex-v0/test_omega_dcrs.py
      - experiments/virtual-cortex-v0/omega_evidence_assembler.py
      - experiments/virtual-cortex-v0/test_omega_evidence_assembler.py
      - experiments/virtual-cortex-v0/omega_reconstitution_challenge.py
      - experiments/virtual-cortex-v0/test_omega_reconstitution_challenge.py
      - experiments/virtual-cortex-v0/omega_genealogy_resolver.py
      - experiments/virtual-cortex-v0/test_omega_genealogy_resolver.py
      - experiments/virtual-cortex-v0/omega_handoff_receipt.py
      - experiments/virtual-cortex-v0/test_omega_handoff_receipt.py
      - experiments/virtual-cortex-v0/omega_identity_escrow.py
      - experiments/virtual-cortex-v0/test_omega_identity_escrow.py
      - experiments/virtual-cortex-v0/omega_retro_continuity_ceiling.py
      - experiments/virtual-cortex-v0/test_omega_retro_continuity_ceiling.py
      - .github/workflows/deus-dcrs-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deus-dcrs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile Ω stack
        run: |
          python -m py_compile \
            experiments/virtual-cortex-v0/omega_dcrs.py \
            experiments/virtual-cortex-v0/test_omega_dcrs.py \
            experiments/virtual-cortex-v0/omega_evidence_assembler.py \
            experiments/virtual-cortex-v0/test_omega_evidence_assembler.py \
            experiments/virtual-cortex-v0/omega_reconstitution_challenge.py \
            experiments/virtual-cortex-v0/test_omega_reconstitution_challenge.py \
            experiments/virtual-cortex-v0/omega_genealogy_resolver.py \
            experiments/virtual-cortex-v0/test_omega_genealogy_resolver.py \
            experiments/virtual-cortex-v0/omega_handoff_receipt.py \
            experiments/virtual-cortex-v0/test_omega_handoff_receipt.py \
            experiments/virtual-cortex-v0/omega_identity_escrow.py \
            experiments/virtual-cortex-v0/test_omega_identity_escrow.py \
            experiments/virtual-cortex-v0/omega_retro_continuity_ceiling.py \
            experiments/virtual-cortex-v0/test_omega_retro_continuity_ceiling.py

      - name: Run Ω-DCRS fail-closed test suite
        run: python experiments/virtual-cortex-v0/test_omega_dcrs.py

      - name: Run Ω-Evidence Assembler test suite
        run: python experiments/virtual-cortex-v0/test_omega_evidence_assembler.py

      - name: Run Ω-Reconstitution Challenge test suite
        run: python experiments/virtual-cortex-v0/test_omega_reconstitution_challenge.py

      - name: Run Ω-Genealogy Resolver test suite
        run: python experiments/virtual-cortex-v0/test_omega_genealogy_resolver.py

      - name: Run Ω-Handoff Receipt test suite
        run: python experiments/virtual-cortex-v0/test_omega_handoff_receipt.py

      - name: Run Ω-Identity Escrow test suite
        run: python experiments/virtual-cortex-v0/test_omega_identity_escrow.py

      - name: Run Ω-Retro Continuity Ceiling test suite
        run: python experiments/virtual-cortex-v0/test_omega_retro_continuity_ceiling.py
