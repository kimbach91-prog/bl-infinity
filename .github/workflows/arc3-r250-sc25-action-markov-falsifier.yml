name: ARC3 R250 sc25 action-Markov falsifier

on:
  push:
    branches:
      - deus/r250-sc25-action-markov-falsifier-20260923
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-r250-sc25:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout DEUS candidate
        uses: actions/checkout@v4

      - name: Checkout pinned public traces
        uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile exact R246/R247 implementation
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py \
            public_benchmark/arc3/kaggle_candidates/public_action_conditional_markov_gate_247.py

      - name: Stage only exact failing family sc25 p0-p19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          game='sc25-635fd71a'
          for p in $(seq 0 19); do
            f="${game}_p${p}_events.jsonl"
            src="upstream-duck/example-run/artifacts/$f"
            test -s "$src"
            cp "$src" "public_trace/$f"
          done
          test "$(find public_trace -name '*_events.jsonl' | wc -l)" -eq 20
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt

      - name: Execute bounded R250 falsifier using unchanged R247 representation
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/*_events.jsonl; do args+=(--input "$f"); done
          /usr/bin/time -v python \
            public_benchmark/arc3/kaggle_candidates/public_action_conditional_markov_gate_247.py \
            "${args[@]}" \
            --output r250-sc25-action-markov-falsifier.json \
            2>r250-runtime.txt | tee r250-stdout.txt

      - name: Verify scoped truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('r250-sc25-action-markov-falsifier.json')
          d=json.loads(p.read_text())
          assert d['rung']==247
          assert d['aggregate']['game_count']==1
          assert set(d['games'])=={'sc25-635fd71a'}
          assert d['truth']['public_trace_only'] is True
          assert d['truth']['game_source_read'] is False
          assert d['truth']['selection_uses_p0_p9_only'] is True
          assert d['truth']['p10_p19_never_updates_selection_or_model'] is True
          assert d['truth']['independent_generalization_claim'] is False
          assert d['truth']['kaggle_execution'] is False
          assert d['truth']['submission_quota_spent'] is False
          summary={
            'schema':'deus/arc3-r250-sc25-action-markov-falsifier/1',
            'scope':'sc25-635fd71a_only',
            'implementation':'unchanged_r247_representation',
            'aggregate':d['aggregate'],
            'selected_by_action':d['games']['sc25-635fd71a']['selected_by_action'],
            'non_dominated_source_side_gain':d['non_dominated_source_side_gain'],
            'truth':d['truth'],
          }
          Path('r250-sc25-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
          sha256sum \
            r250-sc25-action-markov-falsifier.json \
            r250-sc25-summary.json \
            r250-runtime.txt \
            public_trace/SHA256SUMS.txt \
            > R250_SHA256SUMS.txt

      - name: Upload R250 evidence
        uses: actions/upload-artifact@v4
        with:
          name: r250-sc25-action-markov-falsifier
          path: |
            r250-sc25-action-markov-falsifier.json
            r250-sc25-summary.json
            r250-runtime.txt
            r250-stdout.txt
            R250_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
