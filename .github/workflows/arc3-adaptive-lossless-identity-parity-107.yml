name: ARC3 identity-grounded adaptive lossless parity 107

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - 'public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab_v3_identity.py'
      - '.github/workflows/arc3-adaptive-lossless-identity-parity-107.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-grounded-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile identity-grounded harness
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/temporal_state_target_blind_ab.py \
            public_benchmark/arc3/kaggle_candidates/segmentation_target_blind_ab.py \
            public_benchmark/arc3/kaggle_candidates/adaptive_lossless_scene.py \
            public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab.py \
            public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab_v2.py \
            public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab_v3_identity.py

      - name: Download fixed public cross-game traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p schema_public
          base='https://huggingface.co/datasets/schema-harness/arc-agi-3-schema-traces/resolve/main/gpt_5_6_sol'
          declare -A traces=(
            [bp35]='gpt_5_6_sol_max_bp35'
            [sp80]='gpt_5_6_sol_max_sp80'
            [wa30]='gpt_5_6_sol_xhigh_wa30'
          )
          for game in bp35 sp80 wa30; do
            d="${traces[$game]}"
            curl --fail --location --retry 3 --silent --show-error "$base/$d/events.jsonl?download=true" -o "schema_public/${game}.jsonl"
            test -s "schema_public/${game}.jsonl"
          done
          sha256sum schema_public/*.jsonl | sort > schema_public/SHA256SUMS.txt

      - name: Execute identity-grounded A/B pass 1
        id: pass1
        continue-on-error: true
        run: |
          python public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab_v3_identity.py \
            --input schema_public/bp35.jsonl \
            --input schema_public/sp80.jsonl \
            --input schema_public/wa30.jsonl \
            --cases-per-game 6 \
            --receipt parity-pass1.json

      - name: Execute identity-grounded A/B pass 2
        id: pass2
        continue-on-error: true
        run: |
          python public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab_v3_identity.py \
            --input schema_public/bp35.jsonl \
            --input schema_public/sp80.jsonl \
            --input schema_public/wa30.jsonl \
            --cases-per-game 6 \
            --receipt parity-pass2.json

      - name: Compare exact artifacts and deterministic semantics
        shell: bash
        run: |
          set -euo pipefail
          test -s parity-pass1.json
          test -s parity-pass2.json
          sha256sum parity-pass1.json parity-pass2.json > RECEIPT_SHA256SUMS.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          a=json.loads(Path('parity-pass1.json').read_text())
          b=json.loads(Path('parity-pass2.json').read_text())
          def projection(x):
              return {
                  'requested_model':x.get('requested_model'),
                  'selection':x.get('selection'),
                  'target_design':x.get('target_design'),
                  'arms':{
                      k:{kk:vv for kk,vv in v.items() if kk not in {'mean_latency_ms','median_latency_ms'}}
                      for k,v in x.get('arms',{}).items()
                  },
                  'per_game':x.get('per_game'),
                  'cross_game_comparison':x.get('cross_game_comparison'),
                  'promotion_gate':x.get('promotion_gate'),
                  'rows':[
                      {k:r.get(k) for k in ('case','game_id','case_hash','trace','trace_index','arm','threshold','changed_cells','expected','selected','correct','exact_format','representation_chars','http_status','provider_execution','error')}
                      for r in x.get('rows',[])
                  ],
                  'identity':{
                      'requested_model':x.get('identity_repair',{}).get('requested_model'),
                      'call_count':x.get('identity_repair',{}).get('call_count'),
                      'http200_count':x.get('identity_repair',{}).get('http200_count'),
                      'exact_identity_count':x.get('identity_repair',{}).get('exact_identity_count'),
                      'all_calls_exact_identity':x.get('identity_repair',{}).get('all_calls_exact_identity'),
                      'served_models':x.get('identity_repair',{}).get('served_models'),
                  },
              }
          pa,pb=projection(a),projection(b)
          sa=json.dumps(pa,sort_keys=True,separators=(',',':'))
          sb=json.dumps(pb,sort_keys=True,separators=(',',':'))
          cmp={
              'schema':'deus/arc3-identity-grounded-efficiency-parity/1',
              'pass1_full_sha256':hashlib.sha256(Path('parity-pass1.json').read_bytes()).hexdigest(),
              'pass2_full_sha256':hashlib.sha256(Path('parity-pass2.json').read_bytes()).hexdigest(),
              'pass1_semantic_sha256':hashlib.sha256(sa.encode()).hexdigest(),
              'pass2_semantic_sha256':hashlib.sha256(sb.encode()).hexdigest(),
              'semantic_equal':pa==pb,
              'pass1_gate':a.get('promotion_gate'),
              'pass2_gate':b.get('promotion_gate'),
              'pass1_identity_ok':a.get('truth',{}).get('provider_model_identity_verified') is True,
              'pass2_identity_ok':b.get('truth',{}).get('provider_model_identity_verified') is True,
              'truth':{
                  'public_development_only':True,
                  'kaggle_execution':False,
                  'kaggle_submission_attempted':False,
                  'submission_quota_spent':False,
                  'leaderboard_score_observed':False,
              },
          }
          Path('parity-comparison.json').write_text(json.dumps(cmp,indent=2,sort_keys=True)+'\n')
          print(json.dumps(cmp,indent=2,sort_keys=True))
          PY
          cat parity-comparison.json >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce truth and identity boundaries
        shell: bash
        run: |
          set -euo pipefail
          for f in parity-pass1.json parity-pass2.json; do
            jq -e '
              .schema=="deus/arc3-adaptive-lossless-cross-game-behavior-ab/3"
              and .requested_model=="nvidia/llama-3.2-11b-vision"
              and .identity_repair.all_calls_exact_identity==true
              and .truth.provider_model_identity_verified==true
              and .truth.provider_execution_is_not_kaggle_execution==true
              and .truth.kaggle_submission_attempted==false
              and .truth.submission_quota_spent==false
              and .truth.owner_score_claim==false
            ' "$f" >/dev/null
          done

      - name: Upload parity receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-adaptive-lossless-identity-parity-107
          path: |
            parity-pass1.json
            parity-pass2.json
            parity-comparison.json
            RECEIPT_SHA256SUMS.txt
            schema_public/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on inconclusive identity or execution
        shell: bash
        run: |
          set -euo pipefail
          for f in parity-pass1.json parity-pass2.json; do
            gate="$(jq -r '.promotion_gate' "$f")"
            case "$gate" in
              INCONCLUSIVE_*) exit 2 ;;
            esac
          done
