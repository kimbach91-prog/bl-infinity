name: DEUS Root Canary S0

on:
  push:
    paths:
      - ".github/workflows/deus-root-canary-s0.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deus-root-canary-s0
  cancel-in-progress: false

jobs:
  wikimedia-liftwing:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Wikimedia LiftWing exact-output canary
        shell: bash
        env:
          DEUS_RUN_ID: ${{ github.run_id }}
          DEUS_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEUS_SHA: ${{ github.sha }}
          DEUS_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          url = "https://api.wikimedia.org/service/lw/inference/v1/models/llm-qwen3-14b/openai/v1/chat/completions"
          expected = "DEUS_WIKIMEDIA_RUNTIME_20260920_OK"
          payload = {
              "model": "llm-qwen3-14b",
              "messages": [{"role": "user", "content": f"Return exactly this token and nothing else: {expected}"}],
              "temperature": 0,
              "max_tokens": 64,
          }
          body = json.dumps(payload).encode()
          req = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DEUS-S0-RUNTIME-CANARY/1.0 (contact: kimbach91@gmail.com)",
              },
          )
          started = time.time()
          status = 0
          raw = b""
          error = None
          try:
              with urllib.request.urlopen(req, timeout=45) as resp:
                  status = resp.status
                  raw = resp.read()
          except Exception as exc:
              error = repr(exc)
          elapsed_ms = round((time.time() - started) * 1000)
          text = ""
          if raw:
              try:
                  parsed = json.loads(raw.decode())
                  text = parsed["choices"][0]["message"]["content"]
              except Exception as exc:
                  error = (error + "; " if error else "") + "parse=" + repr(exc)
          receipt = {
              "schema": "deus-provider-root-canary/1",
              "provider": "Wikimedia LiftWing",
              "route_id": "GRX-WIKIMEDIA-LIFTWING-001",
              "model": "llm-qwen3-14b",
              "event": os.environ["DEUS_EVENT"],
              "run_id": os.environ["DEUS_RUN_ID"],
              "run_attempt": os.environ["DEUS_RUN_ATTEMPT"],
              "source_sha": os.environ["DEUS_SHA"],
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "http_status": status,
              "latency_ms": elapsed_ms,
              "response_sha256": hashlib.sha256(raw).hexdigest(),
              "content": text,
              "expected": expected,
              "exact": text.strip() == expected,
              "error": error,
              "data_class": "S0_PUBLIC",
              "canonical_write": False,
              "truth": "PROVIDER_RUNTIME_CANARY_NE_CONTROLLER_CREDIT_NE_SLA",
          }
          Path("deus-root-canary-receipt.json").write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print("DEUS_ROOT_CANARY_RECEIPT=" + json.dumps(receipt, separators=(",", ":"), ensure_ascii=False))
          if status != 200 or not receipt["exact"]:
              raise SystemExit(2)
          PY

      - name: Persist durable canary state
        if: always()
        shell: bash
        env:
          DEUS_RUN_ID: ${{ github.run_id }}
          DEUS_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEUS_SHA: ${{ github.sha }}
          STATE_BRANCH: deus-root-canary-state-s0
        run: |
          set -euo pipefail
          test -f deus-root-canary-receipt.json
          git config user.name "deus-root-canary-s0[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin "${STATE_BRANCH}:${STATE_BRANCH}" 2>/dev/null; then
            git switch "${STATE_BRANCH}"
          else
            git switch --orphan "${STATE_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p .deus-root-canary-s0
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          receipt = json.loads(Path("deus-root-canary-receipt.json").read_text(encoding="utf-8"))
          state_path = Path(".deus-root-canary-s0/wikimedia-liftwing.json")
          previous = {}
          if state_path.exists():
              previous = json.loads(state_path.read_text(encoding="utf-8"))
          prev_seq = int(previous.get("seq", 0))
          state = {
              **receipt,
              "seq": prev_seq + 1,
              "previous_seq": prev_seq,
              "state_branch": os.environ["STATE_BRANCH"],
              "durable_state": True,
              "truth": "PROVIDER_RUNTIME_CANARY_WITH_DURABLE_STATE_NE_CONTROLLER_CREDIT_NE_SLA",
          }
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True, ensure_ascii=False) + "\n", encoding="utf-8")
          print("DEUS_ROOT_CANARY_DURABLE_STATE=" + json.dumps(state, separators=(",", ":"), ensure_ascii=False))
          PY

          git add .deus-root-canary-s0/wikimedia-liftwing.json
          if git diff --cached --quiet; then
            echo "NO_STATE_DELTA"
          else
            git commit -m "canary: persist Wikimedia LiftWing S0 receipt run ${DEUS_RUN_ID}"
            git push origin HEAD:"${STATE_BRANCH}"
          fi

      - name: Upload typed canary receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deus-root-canary-s0-${{ github.run_id }}-${{ github.run_attempt }}
          path: deus-root-canary-receipt.json
          if-no-files-found: error
          retention-days: 30
\n# DEUS_ROOT_CANARY_TRIGGER_20260920T1448Z\n