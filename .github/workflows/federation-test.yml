name: Federation Router Tests

on:
  pull_request:
    paths:
      - 'runtime/federation/**'
      - '.github/workflows/federation-test.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/federation/**'
      - '.github/workflows/federation-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/federation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
