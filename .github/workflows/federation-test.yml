name: Federation Runtime Tests

on:
  pull_request:
    paths:
      - 'runtime/federation/**'
      - '.github/workflows/federation-test.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/federation/**'
      - '.github/workflows/federation-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/federation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Syntax check
        run: |
          find . -name '*.mjs' -type f -print0 | xargs -0 -n1 node --check
