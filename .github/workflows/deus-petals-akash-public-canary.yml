name: DEUS Petals + Akash Public Route Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-petals-akash-public-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-route-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Petals public swarm health read
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 30 -sS -o /tmp/petals-health.json -w '%{http_code}' 'https://health.petals.dev/api/v1/state' || true)"
          if [ -s /tmp/petals-health.json ]; then
            head -c 3000 /tmp/petals-health.json
            echo
            sha="$(sha256sum /tmp/petals-health.json | awk '{print $1}')"
            bytes="$(wc -c </tmp/petals-health.json | tr -d ' ')"
          else
            printf '{}' > /tmp/petals-health.json
            sha="$(sha256sum /tmp/petals-health.json | awk '{print $1}')"
            bytes=2
          fi
          jq -n --arg status "$code" --arg digest "$sha" --argjson bytes "$bytes" \
            '{receipt_version:"DEUS-PUBLIC-SWARM-HEALTH/1",provider:"PETALS_HEALTH",auth_mode:"NONE",http_status:(($status|tonumber?) // 0),response_bytes:$bytes,response_digest:$digest,network_state_read:($status=="200"),canonical_write:false}' \
            | tee /tmp/petals-health-receipt.json

      - name: Petals public swarm S0 inference canary
        shell: bash
        run: |
          set -u
          start_ms="$(date +%s%3N)"
          code="$(curl --max-time 180 -sS -o /tmp/petals.json -w '%{http_code}' \
            -X POST 'https://chat.petals.dev/api/v1/generate' \
            --data-urlencode 'model=petals-team/StableBeluga2' \
            --data-urlencode 'inputs=Public S0 canary. Reply with exactly: DEUS_PETALS_CANARY_OK' \
            --data-urlencode 'max_new_tokens=12' \
            --data-urlencode 'do_sample=0' || true)"
          end_ms="$(date +%s%3N)"
          test -s /tmp/petals.json || printf '{"ok":false,"traceback":"NO_RESPONSE"}' > /tmp/petals.json
          head -c 4000 /tmp/petals.json
          echo
          ok="$(jq -r 'if .ok == true and (.outputs|type=="string") then "true" else "false" end' /tmp/petals.json 2>/dev/null || echo false)"
          coverage_fail="$(jq -r '((.traceback // "") | contains("MissingBlocksError"))' /tmp/petals.json 2>/dev/null || echo false)"
          sha="$(sha256sum /tmp/petals.json | awk '{print $1}')"
          verdict="PETALS_PUBLIC_SWARM_EXECUTION_FAIL"
          provider_execution=false
          if [ "$code" = "200" ] && [ "$ok" = "true" ]; then
            verdict="PETALS_PUBLIC_SWARM_EXECUTION_PASS"
            provider_execution=true
          elif [ "$coverage_fail" = "true" ]; then
            verdict="PETALS_MODEL_BLOCK_COVERAGE_HOLD"
          fi
          jq -n \
            --arg status "$code" \
            --arg digest "$sha" \
            --arg verdict "$verdict" \
            --arg provider_execution "$provider_execution" \
            --arg coverage_fail "$coverage_fail" \
            --argjson latency_ms "$((end_ms-start_ms))" \
            '{receipt_version:"DEUS-PUBLIC-COMPUTE-CANARY/1.1",provider:"PETALS_PUBLIC_SWARM",auth_mode:"NONE",data_class:"S0_SYNTHETIC_ONLY",provider_execution:($provider_execution=="true"),model_block_coverage_fail:($coverage_fail=="true"),http_status:(($status|tonumber?) // 0),latency_ms:$latency_ms,response_digest:$digest,canonical_write:false,settlement:false,commercial_default:false,verdict:$verdict}' \
            | tee /tmp/petals-receipt.json

      - name: Akash public provider-network canary
        shell: bash
        run: |
          set -euo pipefail
          start_ms="$(date +%s%3N)"
          code="$(curl --max-time 60 -sS -o /tmp/akash.json -w '%{http_code}' 'https://console-api.akash.network/v1/providers')"
          end_ms="$(date +%s%3N)"
          head -c 3000 /tmp/akash.json
          echo
          test "$code" = "200"
          jq -e 'type == "array" or type == "object"' /tmp/akash.json >/dev/null
          sha="$(sha256sum /tmp/akash.json | awk '{print $1}')"
          bytes="$(wc -c </tmp/akash.json | tr -d ' ')"
          count="$(jq 'if type=="array" then length elif (.providers|type=="array") then .providers|length else 0 end' /tmp/akash.json)"
          jq -n \
            --arg status "$code" \
            --arg digest "$sha" \
            --argjson bytes "$bytes" \
            --argjson count "$count" \
            --argjson latency_ms "$((end_ms-start_ms))" \
            '{receipt_version:"DEUS-PUBLIC-DISCOVERY-CANARY/1.1",provider:"AKASH_NETWORK_DATA",auth_mode:"NONE",data_class:"PUBLIC_NETWORK_DATA",provider_execution:false,network_data_read:true,http_status:($status|tonumber),latency_ms:$latency_ms,response_bytes:$bytes,provider_records:$count,response_digest:$digest,canonical_write:false,settlement:false,verdict:"AKASH_PUBLIC_NETWORK_DATA_PASS"}' \
            | tee /tmp/akash-receipt.json

      - name: Consolidated truth receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile health /tmp/petals-health-receipt.json \
            --slurpfile petals /tmp/petals-receipt.json \
            --slurpfile akash /tmp/akash-receipt.json \
            '{receipt_version:"DEUS-MULTI-ROUTE-CANARY/1.1",petals_health:$health[0],petals:$petals[0],akash:$akash[0],truth_boundary:"Petals health proves swarm-state endpoint reachability. Petals inference is promoted only when response execution succeeds. Akash proves unauthenticated network-data reachability only, not a lease or workload execution."}' \
            | tee /tmp/deus-public-route-receipt.json
