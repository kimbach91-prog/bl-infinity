name: DEUS Azure Service Tag Atlas Expansion V1
on:
  push:
    branches: [deus/internet-azure-source-expansion-v1-20260924]
    paths:
      - runtime/federation/scripts/internet_atlas_azure.py
      - runtime/federation/scripts/test_internet_atlas_azure*.py
      - .github/workflows/deus-internet-azure-service-tags.yml
  workflow_dispatch:
  workflow_run:
    workflows: [DEUS Isolated Cloud Delta and Matched Performance V1]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: deus-internet-azure-service-tags-v1
  cancel-in-progress: false
jobs:
  expand:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate parsers and no-network cache tests
        run: |
          python -m unittest discover -s runtime/federation/scripts -p test_internet_atlas_cloud_delta.py -v
          python -m unittest discover -s runtime/federation/scripts -p 'test_internet_atlas_azure*.py' -v
      - name: Resolve successful parent and cross-branch source receipt
        id: input
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');const {owner,repo}=context.repo;
            const parentId=context.eventName==='workflow_run'?context.payload.workflow_run.id:36013638934;
            const p=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:parentId})).data;
            if(p.conclusion!=='success'||p.head_repository?.full_name!==`${owner}/${repo}`||p.path!=='.github/workflows/deus-internet-cloud-delta-performance.yml')throw Error('PARENT_AUTHORITY_GATE');
            async function artifact(run,prefix){
              const aa=(await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:run.id})).data.artifacts;
              const a=aa.find(x=>!x.expired&&x.name===prefix+run.id);
              if(!a||!/^sha256:[0-9a-f]{64}$/.test(a.digest||'')||a.size_in_bytes>128*1024*1024)throw Error('ARTIFACT_INTEGRITY_GATE');
              return {runId:run.id,headSha:run.head_sha,artifactId:a.id,sha256:a.digest.slice(7)};
            }
            const source={parent:await artifact(p,'deus-isolated-cloud-delta-perf-'),azureCache:null};
            try {
              const runs=(await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'.github/workflows/deus-internet-azure-service-tags.yml',status:'success',per_page:20})).data.workflow_runs;
              const prior=runs.find(x=>String(x.id)!==String(context.runId)&&x.head_repository?.full_name===`${owner}/${repo}`);
              if(prior)source.azureCache=await artifact(prior,'deus-azure-service-tag-atlas-');
            } catch(e) { if(e.status!==404)throw e; }
            fs.mkdirSync('.deus/azure-work',{recursive:true});fs.writeFileSync('.deus/azure-work/sources.json',JSON.stringify(source));
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .deus/azure-source-cache
          key: azure-source-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: azure-source-v1-${{ runner.os }}-
      - name: Restore verified parent and preserve source freshness across branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,sys,subprocess,zipfile
          from pathlib import Path
          sys.path.insert(0,'runtime/federation/scripts')
          import internet_atlas_cloud_delta as core
          import internet_atlas_azure as azure
          w=Path('.deus/azure-work');s=json.loads((w/'sources.json').read_text());cache=Path('.deus/azure-source-cache');cache.mkdir(parents=True,exist_ok=True)
          def archive(ref,label):
            p=w/(label+'.zip')
            with p.open('wb') as f:subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{ref["artifactId"]}/zip'],stdout=f,check=True)
            assert core.file_sha(p)==ref['sha256']
            z=zipfile.ZipFile(p);assert len(z.namelist())==len(set(z.namelist())) and sum(x.file_size for x in z.infolist())<512*1024*1024
            return z
          with archive(s['parent'],'parent') as z:
            m=json.loads(z.read('manifest.json'));assert m['verdict']=='PASS_ISOLATED_CLOUD_DELTA_MATCHED_BENCH' and m['executionAdmitted'] is False
            assert str(m['workflowRunId'])==str(s['parent']['runId']) and m['overlay']['noncloudPreserved']
            snap=m['overlay']['snapshot'];assert len(snap)==64 and all(c in '0123456789abcdef' for c in snap)
            b=z.read('snapshots/'+snap+'/overlay.sqlite');assert __import__('hashlib').sha256(b).hexdigest()==m['overlay']['overlaySha256']
            (w/'parent.sqlite').write_bytes(b);core.atomic(w/'parent-receipt.json',m['overlay'])
          handoff={'mode':'EXISTING_CACHE' if (cache/'azure.json').exists() else 'FIRST_SOURCE_READ','publicSourceRequests':0}
          if not (cache/'azure.json').exists() and s['azureCache']:
            with archive(s['azureCache'],'prior') as z:
              m=json.loads(z.read('manifest.json'));assert m['verdict']=='PASS_SOURCE_LOCAL_AZURE_EXPANSION' and m['executionAdmitted'] is False
              v=json.loads(z.read('azure-cache/azure.json'));raw=z.read('azure-cache/publisher-payload.raw.json')
              assert v['id']==azure.SID and v['url']==azure.PAGE and azure.valid_payload_url(v['payloadUrl'])
              assert core.digest(v['rows'])==v['semanticSha256']==m['source']['semanticSha256']
              assert __import__('hashlib').sha256(raw).hexdigest()==v['bodySha256']
              core.atomic(cache/'azure.json',v);(cache/'publisher-payload.raw.json').write_bytes(raw)
              if 'azure-cache/azure.hold.json' in z.namelist():core.atomic(cache/'azure.hold.json',json.loads(z.read('azure-cache/azure.hold.json')))
              handoff.update(mode='VERIFIED_CROSS_BRANCH_HANDOFF',sourceFreshnessPreserved=True)
          core.atomic(w/'cache-handoff.json',handoff);print(json.dumps(handoff))
          PY
      - name: Expand only Azure and collect actual CPU memory and matched query performance
        run: |
          SHA=$(python -c "import json;print(json.load(open('.deus/azure-work/parent-receipt.json'))['overlaySha256'])")
          python runtime/federation/scripts/internet_atlas_azure.py --parent-db .deus/azure-work/parent.sqlite --parent-sha256 "$SHA" --out .deus/azure-output --cache .deus/azure-source-cache
      - name: Preserve reproducible inputs and verified receipts
        if: always()
        run: |
          mkdir -p .deus/azure-output
          cp .deus/azure-work/sources.json .deus/azure-output/ || true
          cp .deus/azure-work/cache-handoff.json .deus/azure-output/ || true
          cp -r .deus/azure-source-cache .deus/azure-output/azure-cache || true
          cp runtime/federation/scripts/internet_atlas_cloud_delta.py runtime/federation/scripts/test_internet_atlas_azure*.py .deus/azure-output/
          find .deus/azure-output -name '*-wal' -o -name '*-shm' | xargs -r rm -f
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .deus/azure-source-cache
          key: azure-source-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deus-azure-service-tag-atlas-${{ github.run_id }}
          path: .deus/azure-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
