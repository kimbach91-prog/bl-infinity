name: ARC3 Kaggle actuator fail-closed dry run
on:
  push:
    branches: [deus/arc3-kaggle-rank-climb-20260921]
    paths:
      - public_benchmark/arc3/kaggle_actuator/**
      - .github/workflows/arc3-kaggle-actuator-dryrun.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Unit-test fail-closed gates
        run: python -m unittest public_benchmark/arc3/kaggle_actuator/test_kaggle_actuator.py -v
      - name: Dry-run actuator without submission
        run: python public_benchmark/arc3/kaggle_actuator/kaggle_actuator.py
      - name: Safe auth presence only
        run: |
          python - <<'PY'
          import json,os
          print("KAGGLE_ACTUATOR_AUTH="+json.dumps({
            "classic_pair":bool(os.getenv("KAGGLE_USERNAME") and os.getenv("KAGGLE_KEY")),
            "token":bool(os.getenv("KAGGLE_API_TOKEN") or os.getenv("KAGGLE_TOKEN")),
          },sort_keys=True))
          PY
