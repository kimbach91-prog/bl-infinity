name: One-shot public forum seed (Hacker News)

on:
  push:
    paths:
      - '.github/workflows/forum-seed-hn.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[forum-seed]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -q beautifulsoup4
      - name: Publish one transparent research link on Hacker News
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER_EMAIL: kimbach91@gmail.com
          TARGET_URL: https://github.com/kimbach91-prog/bl-infinity/issues/151
          TARGET_TITLE: 'BL Infinity: endstate-first planning and convergence-basin hypothesis'
        run: |
          python - <<'PY'
          import os, re, secrets, string, sys, time
          import requests
          from bs4 import BeautifulSoup

          BASE = 'https://news.ycombinator.com/'
          target_url = os.environ['TARGET_URL']
          target_title = os.environ['TARGET_TITLE']
          owner_email = os.environ['OWNER_EMAIL']

          s = requests.Session()
          s.headers.update({'User-Agent': 'BL-Infinity-public-research-seed/1.0 (+https://github.com/kimbach91-prog/bl-infinity)'})

          def random_pw():
              alphabet = string.ascii_letters + string.digits + '!@#%_-'
              return ''.join(secrets.choice(alphabet) for _ in range(28))

          def logged_in_as(html, username):
              return (f'user?id={username}' in html) and ('logout' in html.lower())

          candidates = ['lamkimbach', 'bachlam_bl', 'blinfinity2026']
          username = None

          # Create exactly one project/author account. If a candidate name is taken,
          # try the next name; stop immediately after the first successful account.
          for cand in candidates:
              pw = random_pw()
              try:
                  s.get(BASE + 'login?goto=news', timeout=20)
                  r = s.post(BASE + 'login', data={
                      'acct': cand,
                      'pw': pw,
                      'creating': 't',
                      'goto': 'news',
                  }, timeout=20, allow_redirects=True)
              except Exception as e:
                  print(f'REGISTRATION_NETWORK_ERROR: {type(e).__name__}')
                  sys.exit(20)
              if logged_in_as(r.text, cand):
                  username = cand
                  break
              low = r.text.lower()
              if 'already' in low or 'taken' in low or 'exists' in low:
                  continue
              print('REGISTRATION_BLOCKED_OR_UNKNOWN_GATE')
              sys.exit(21)

          if not username:
              print('NO_AVAILABLE_TRANSPARENT_USERNAME')
              sys.exit(22)

          # Best-effort recovery/profile binding. If HN exposes these fields,
          # use the owner's email so account recovery remains owner-controlled.
          try:
              p = s.get(BASE + f'user?id={username}', timeout=20)
              soup = BeautifulSoup(p.text, 'html.parser')
              form = soup.find('form')
              if form:
                  data = {}
                  for inp in form.find_all(['input','textarea','select']):
                      name = inp.get('name')
                      if not name:
                          continue
                      if inp.name == 'textarea':
                          data[name] = inp.text or ''
                      elif inp.name == 'select':
                          opt = inp.find('option', selected=True) or inp.find('option')
                          if opt: data[name] = opt.get('value','')
                      elif inp.get('type') not in ('submit','button'):
                          data[name] = inp.get('value','')
                  if 'email' in data:
                      data['email'] = owner_email
                  if 'about' in data:
                      data['about'] = ('Lâm Kim Bách (Bách Lâm) — independent BL Infinity / DEUS research. '
                                       'Public research seeds are hypotheses unless independently validated. '
                                       'Project: https://github.com/kimbach91-prog/bl-infinity')
                  action = form.get('action') or f'user?id={username}'
                  s.post(requests.compat.urljoin(BASE, action), data=data, timeout=20, allow_redirects=True)
          except Exception:
              pass

          try:
              r = s.get(BASE + 'submit', timeout=20)
          except Exception as e:
              print(f'SUBMIT_FORM_NETWORK_ERROR: {type(e).__name__}')
              sys.exit(30)

          soup = BeautifulSoup(r.text, 'html.parser')
          form = None
          for f in soup.find_all('form'):
              if f.find('input', {'name':'title'}) or f.find('input', {'name':'url'}):
                  form = f
                  break
          if not form:
              text = r.text.lower()
              if 'login' in text or 'create account' in text:
                  print('SESSION_NOT_AUTHENTICATED_AT_SUBMIT')
                  sys.exit(31)
              print('SUBMIT_FORM_NOT_FOUND_OR_PLATFORM_GATE')
              sys.exit(32)

          data = {}
          for inp in form.find_all('input'):
              name = inp.get('name')
              if not name or inp.get('type') in ('submit','button'):
                  continue
              data[name] = inp.get('value','')
          data['title'] = target_title
          data['url'] = target_url
          if 'text' in data:
              data['text'] = ''
          if 'fnop' not in data:
              data['fnop'] = 'submit-page'

          action = form.get('action') or 'r'
          try:
              s.post(requests.compat.urljoin(BASE, action), data=data, timeout=20, allow_redirects=True)
          except Exception as e:
              print(f'SUBMIT_NETWORK_ERROR: {type(e).__name__}')
              sys.exit(33)

          time.sleep(2)
          try:
              sub = s.get(BASE + f'submitted?id={username}', timeout=20)
          except Exception as e:
              print(f'RECEIPT_LOOKUP_ERROR: {type(e).__name__}')
              sys.exit(34)
          ss = BeautifulSoup(sub.text, 'html.parser')
          item_id = None
          for athing in ss.select('tr.athing'):
              titleline = athing.select_one('.titleline a')
              if titleline and titleline.get('href') == target_url:
                  nxt = athing.find_next_sibling('tr')
                  if nxt:
                      for a in nxt.find_all('a', href=True):
                          m = re.fullmatch(r'item\?id=(\d+)', a['href'])
                          if m:
                              item_id = m.group(1)
                              break
              if item_id:
                  break

          if not item_id:
              print('NO_PUBLIC_HN_RECEIPT_FOUND')
              sys.exit(35)

          public_url = BASE + 'item?id=' + item_id
          print('PUBLIC_FORUM_URL=' + public_url)
          print('PUBLIC_FORUM_USER=' + username)

          api = f"https://api.github.com/repos/{os.environ['GH_REPO']}/issues/151/comments"
          body = ("EXTERNAL_FORUM_RECEIPT\n\n"
                  f"- Forum: Hacker News\n- Public URL: {public_url}\n"
                  f"- Account: {username}\n- Source seed: {target_url}\n"
                  "- Disclosure: author/project account; no fake endorsement; hypothesis status retained.\n")
          rr = requests.post(api, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }, json={'body': body}, timeout=20)
          rr.raise_for_status()
          PY
