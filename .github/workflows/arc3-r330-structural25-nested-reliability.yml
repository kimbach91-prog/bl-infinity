name: ARC3 R330 nested structural reliability 25-game
on:
  push:
    branches: [deus/r330-structural25-nested-reliability-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_structural25_nested_reliability_330.py
      - .github/workflows/arc3-r330-structural25-nested-reliability.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        game:
          - ar25-0c556536
          - bp35-0a0ad940
          - cd82-fb555c5d
          - cn04-2fe56bfb
          - dc22-fdcac232
          - ft09-0d8bbf25
          - g50t-5849a774
          - ka59-38d34dbb
          - lf52-271a04aa
          - lp85-305b61c3
          - ls20-9607627b
          - m0r0-492f87ba
          - r11l-495a7899
          - re86-8af5384d
          - s5i5-18d95033
          - sb26-7fbdac44
          - sc25-635fd71a
          - sk48-d8078629
          - sp80-589a99af
          - su15-1944f8ab
          - tn36-ef4dde99
          - tr87-cd924810
          - tu93-0768757b
          - vc33-5430563c
          - wa30-ee6fef47
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage exact game p0-p4 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 4); do
            f="${{ matrix.game }}_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "public_trace/${f}"
          done
          test "$(find public_trace -name '*_events.jsonl' | wc -l)" -eq 5
          ! find public_trace -name '*_p[5-9]_events.jsonl' | grep -q .
          ! find public_trace -name '*_p1[0-9]_events.jsonl' | grep -q .
      - name: Execute R330
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in $(find public_trace -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          out="r330-${{ matrix.game }}.json"
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_structural25_nested_reliability_330.py             "${args[@]}" --game "${{ matrix.game }}" --output "${out}"             2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit
        shell: bash
        run: |
          python - <<'PY'
          import glob,json
          d=json.load(open(glob.glob('r330-*.json')[0]))
          assert d['schema']=='deus/arc3-r330-structural25-nested-reliability/1'
          assert d['freeze']['per_game_representation_selection'] is False
          p=d['protocol']; t=d['truth']
          assert p['p5_p9_staged_or_read'] is False and p['p10_p19_staged_or_read'] is False
          assert not t['p5_p9_read'] and not t['p10_p19_read']
          assert not t['whole_game_solver_promotion'] and not t['kaggle_execution'] and not t['competition_submission']
          print(json.dumps({'game':d['game'],'verdict':d['verdict'],'baseline':d['r329_equivalent_baseline'],'nested':d['nested_loto']},sort_keys=True))
          PY
          sha256sum r330-*.json runtime.txt stdout.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r330-${{ matrix.game }}
          path: |
            r330-*.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
          retention-days: 30
