name: ARC3 temporal-state same-model public-trace A/B

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/temporal_state_model_behavior_ab.py
      - public_benchmark/arc3/harness/public_trace_temporal_state_audit.py
      - public_benchmark/arc3/harness/representation_granularity_guard.py
      - .github/workflows/arc3-temporal-state-model-behavior-ab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-model-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile harness
        run: |
          python -m py_compile \
            public_benchmark/arc3/harness/representation_granularity_guard.py \
            public_benchmark/arc3/harness/public_trace_temporal_state_audit.py \
            public_benchmark/arc3/kaggle_candidates/temporal_state_model_behavior_ab.py
      - name: Download pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in \
            ar25-0c556536_p0_events.jsonl \
            ar25-0c556536_p10_events.jsonl \
            ar25-0c556536_p11_events.jsonl
          do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute fixed-case temporal same-model A/B
        id: ab
        continue-on-error: true
        run: |
          python public_benchmark/arc3/kaggle_candidates/temporal_state_model_behavior_ab.py \
            --input public_trace/ar25-0c556536_p0_events.jsonl \
            --input public_trace/ar25-0c556536_p10_events.jsonl \
            --input public_trace/ar25-0c556536_p11_events.jsonl \
            --max-cases 8 \
            --receipt temporal-state-model-behavior-ab.json
      - name: Enforce truth boundary and emit summary
        if: always()
        shell: bash
        run: |
          test -s temporal-state-model-behavior-ab.json
          jq -e '
            .schema=="deus/arc3-temporal-state-same-model-ab/1"
            and .truth.public_trace_only==true
            and .truth.source_assisted_replay==true
            and .truth.independent_generalization==false
            and .truth.hidden_kaggle_data_read==false
            and .truth.kaggle_submission_attempted==false
            and .truth.submission_quota_spent==false
            and .truth.leaderboard_score_observed==false
            and .selection.same_action_distractor==true
            and .selection.query_history2_equals_target_history2==true
            and .selection.query_raw_differs_from_target_raw==true
          ' temporal-state-model-behavior-ab.json >/dev/null
          jq '{provider,requested_model,selection,arms,promotion_gate,truth}' \
            temporal-state-model-behavior-ab.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-temporal-state-model-behavior-ab-receipt
          path: |
            temporal-state-model-behavior-ab.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed on inconclusive execution
        if: always()
        shell: bash
        run: |
          gate="$(jq -r '.promotion_gate' temporal-state-model-behavior-ab.json)"
          case "$gate" in
            INCONCLUSIVE_*) exit 2 ;;
            *) exit 0 ;;
          esac
