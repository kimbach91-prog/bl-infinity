name: Publish bilingual research notes to open publishing surfaces

on:
  push:
    paths:
      - '.github/workflows/forum-seed-wave2-index.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish distinct EN/VI research notes and record receipts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, requests
          ISSUE=151
          SOURCE='https://github.com/kimbach91-prog/bl-infinity/issues/151'
          CHESS='https://github.com/kimbach91-prog/bl-infinity/issues/152'
          MARKER='BLINF-INDEX-WAVE2-20260907-1333'
          AUTHOR='Lâm Kim Bách / Bách Lâm'
          gh={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          comments_api=f"https://api.github.com/repos/{os.environ['GH_REPO']}/issues/{ISSUE}/comments"
          prior=requests.get(comments_api,headers=gh,timeout=30); prior.raise_for_status()
          prior_bodies='\n'.join((c.get('body') or '') for c in prior.json())

          def existing(surface):
              m=re.search(rf"Surface: {re.escape(surface)}\n- Public URL: (https?://\\S+)",prior_bodies)
              return m.group(1) if m else None

          def receipt(surface,url,language,angle):
              global prior_bodies
              if url in prior_bodies: return
              body=("FORUM_SEED_WAVE2_RECEIPT\n\n"
                    f"- Surface: {surface}\n- Public URL: {url}\n- Language: {language}\n"
                    f"- Angle: {angle}\n- Identity: {AUTHOR}; BL Infinity / DEUS\n"
                    f"- Marker: `{MARKER}`\n"
                    "- Boundary: experimental research hypothesis; no proven-AGI, ASI, solved-chess, or empirical engine-win-rate claim.\n")
              rr=requests.post(comments_api,headers=gh,json={'body':body},timeout=30); rr.raise_for_status()
              prior_bodies+='\n'+body

          # One ephemeral Telegraph account for this run. The access token is never logged or persisted.
          r=requests.post('https://api.telegra.ph/createAccount',data={'short_name':'blinfinity-research','author_name':AUTHOR,'author_url':SOURCE},timeout=30)
          r.raise_for_status(); tg=r.json(); assert tg.get('ok')
          token=tg['result']['access_token']

          def telegraph(surface,title,language,nodes,angle):
              old=existing(surface)
              if old:
                  print('SKIP',surface,old); return old
              r=requests.post('https://api.telegra.ph/createPage',data={'access_token':token,'title':title,'author_name':AUTHOR,'author_url':SOURCE,'content':json.dumps(nodes,ensure_ascii=False)},timeout=30)
              r.raise_for_status(); data=r.json(); assert data.get('ok')
              url=data['result']['url']; v=requests.get(url,timeout=30); print(surface,v.status_code,url); assert v.status_code==200
              receipt(surface,url,language,angle); return url

          en=[
            {'tag':'p','children':['Research note by Lâm Kim Bách (Bách Lâm). BL Infinity (BL∞) / DEUS is an experimental research program exploring whether AI planning systems can increase useful reasoning per unit of compute by changing how they represent futures, convergence and failure.']},
            {'tag':'h3','children':['Path count is not the same as useful decision count']},
            {'tag':'p','children':['Forward search is appropriate when every branch can materially change the outcome. But many domains contain transpositions, equivalent subproblems, recurring constraints, or histories that eventually enter the same strategically relevant region. In those cases, raw path multiplicity can exaggerate the number of distinct decisions that matter.']},
            {'tag':'p','children':['The BL∞/DEUS hypothesis is not simply “search less.” It is to represent several plausible endstates, test which remain attainable, regress backward through the prerequisites required to reach them, and compress histories only when they are decision-equivalent. If confidence in a basin collapses, exploration must reopen.']},
            {'tag':'h3','children':['Convergence basins, backward reachability, and negative knowledge']},
            {'tag':'p','children':['A convergence basin is a set of histories whose remaining strategic problem is effectively the same for the decision being made. Backward reachability asks what must already be true for a candidate outcome to remain reachable. Negative knowledge retains failed routes, contradictions, scars and counterexamples so the system does not repeatedly pay to rediscover the same boundary.']},
            {'tag':'p','children':['This suggests a sparse-active / rich-cold architecture: only the small set of relations needed for the current decision stays active, while provenance, discarded alternatives, contradictions and recovery paths remain preserved in colder state. The goal is compression without amnesia.']},
            {'tag':'h3','children':['Why chess is a useful falsification surface']},
            {'tag':'p','children':['Chess already has strong prior art: transposition tables, pruning, value functions, retrograde analysis, endgame tablebases, graph search, policy learning and game theory. That makes it a good place to test whether endstate-first integration adds anything beyond relabeling known ideas.']},
            {'tag':'p','children':['A preregistered benchmark should compare equal-compute and asymmetric-compute settings, including 1:10 and 1:100, while measuring score, uncertainty, node expansions, wall-clock time, memory, energy, calibration and recovery cost after wrong basin predictions. Earlier illustrative figures such as roughly 8%, 95.4%, 99.1% and 99.91% were shadow-model outputs under simplifying assumptions, not empirical engine win rates.']},
            {'tag':'h3','children':['Falsification and claim boundary']},
            {'tag':'p','children':['The hypothesis should be narrowed or rejected if basin recognition does not improve useful-result-per-unit-compute after controlling for prior knowledge, if recovery costs erase the savings, if held-out transfer fails, or if the apparent gain disappears once the baseline receives comparable structural priors.']},
            {'tag':'p','children':['BL∞/DEUS should currently be read as an experimental architecture and research program, not as a demonstrated AGI, ASI, universal optimizer, or proof of superiority over existing systems. Independent reproducible benchmarks are the standard that matters.']},
            {'tag':'p','children':[f'Primary public source: {SOURCE}. Chess benchmark seed: {CHESS}. Timestamp marker: {MARKER}.']},
            {'tag':'p','children':['Discovery terms: compute-efficient AI, AI planning, reasoning efficiency, endstate-first reasoning, convergence basin, backward reachability, retrograde analysis, negative knowledge, chess AI, compute asymmetry, BL Infinity, DEUS, Lâm Kim Bách, Bách Lâm.']},
          ]
          vi=[
            {'tag':'p','children':['Ghi chú nghiên cứu của Lâm Kim Bách (Bách Lâm). BL Infinity (BL∞) / DEUS là một chương trình nghiên cứu thực nghiệm về cách tăng lượng suy luận hữu ích trên mỗi đơn vị tài nguyên tính toán, đặc biệt trong các bài toán có rất nhiều đường đi nhưng số quyết định thực sự khác biệt có thể nhỏ hơn đáng kể.']},
            {'tag':'h3','children':['Nhiều đường đi không đồng nghĩa nhiều quyết định hữu ích']},
            {'tag':'p','children':['Tìm kiếm xuôi hợp lý khi mỗi nhánh đều có thể làm thay đổi kết cục. Nhưng trong nhiều miền, các lịch sử khác nhau có thể chuyển vị, gặp lại cùng cấu trúc, chịu chung tập ràng buộc hoặc cuối cùng hội tụ vào cùng một vùng kết cục có ý nghĩa chiến lược. Khi đó, đếm đường đi có thể phóng đại số lượng quyết định thật sự cần tính.']},
            {'tag':'p','children':['Giả thuyết BL∞/DEUS không phải “cắt bớt tìm kiếm bằng niềm tin”. Cấu trúc đề xuất là mở nhiều đại kết cục khả dĩ, đánh giá mức còn-khả-thi, hồi quy ngược các điều kiện tiên quyết về hiện tại, rồi chỉ nén các lịch sử khi chúng thật sự tương đương đối với quyết định đang xét. Nếu độ tin cậy suy giảm, hệ phải mở lại miền khám phá.']},
            {'tag':'h3','children':['Vùng hội tụ, hồi quy ngược và tri thức âm']},
            {'tag':'p','children':['Vùng hội tụ là nhóm lịch sử khác nhau nhưng phần bài toán chiến lược còn lại gần như giống nhau. Hồi quy ngược hỏi: để một kết cục còn đạt được thì ngay bây giờ điều gì phải đúng? Tri thức âm giữ lại đường sai, phản ví dụ, mâu thuẫn và vết sẹo để hệ không phải trả chi phí khám phá lại cùng một biên giới nhiều lần.']},
            {'tag':'p','children':['Một kiến trúc như vậy có thể vận hành theo mô hình sparse-active / rich-cold: chỉ lát cắt nhỏ cần cho quyết định hiện tại được kích hoạt, còn provenance, phương án bị loại, mâu thuẫn và đường hồi phục vẫn được bảo toàn ở trạng thái lạnh. Mục tiêu là nén mà không mất trí nhớ nhân quả.']},
            {'tag':'h3','children':['Vì sao cờ vua là phép thử phản chứng tốt?']},
            {'tag':'p','children':['Cờ vua đã có nhiều prior art trưởng thành: transposition table, pruning, value function, retrograde analysis, endgame tablebase, graph search, policy learning và game theory. Vì vậy đây là miền phù hợp để kiểm xem endstate-first có tạo giá trị tích hợp mới hay chỉ đổi tên kỹ thuật cũ.']},
            {'tag':'p','children':['Benchmark đúng nên so compute ngang nhau và bất đối xứng 1:10, 1:100; đo score, độ bất định, số node, thời gian, bộ nhớ, năng lượng, calibration và chi phí hồi phục khi dự đoán vùng hội tụ sai. Các con số shadow-model khoảng 8%, 95,4%, 99,1% và 99,91% chỉ là minh họa dưới giả định đơn giản hóa, không phải tỷ lệ thắng engine thực nghiệm.']},
            {'tag':'h3','children':['Điều kiện bác bỏ và trạng thái nghiên cứu']},
            {'tag':'p','children':['Nếu lợi ích biến mất khi baseline được cấp prior tương đương; nếu chi phí sửa sai nuốt hết phần compute tiết kiệm; nếu không chuyển giao sang tập held-out; hoặc nếu không tăng useful-result-per-unit-compute sau kiểm soát biến quan trọng, giả thuyết phải bị thu hẹp hoặc bác bỏ.']},
            {'tag':'p','children':['Ở thời điểm hiện tại, BL∞/DEUS nên được mô tả là kiến trúc và chương trình nghiên cứu thực nghiệm. Chưa có cơ sở để gọi đây là AGI đã được chứng minh, ASI hay bộ tối ưu phổ quát. Giá trị khoa học chỉ hình thành khi benchmark độc lập cho kết quả tái lập được.']},
            {'tag':'p','children':[f'Nguồn công khai chính: {SOURCE}. Giả thuyết cờ vua: {CHESS}. Mốc thời gian: {MARKER}.']},
            {'tag':'p','children':['Cụm từ khám phá: tối ưu tính toán cho AI, AI planning, hiệu suất suy luận, tư duy từ đại kết cục, vùng hội tụ, hồi quy ngược, retrograde analysis, tri thức âm, AI cờ vua, bất đối xứng compute, BL Infinity, DEUS, Lâm Kim Bách, Bách Lâm.']},
          ]
          telegraph('Telegraph EN','Compute-Efficient AI Planning: Endstate-First Reasoning and Convergence Basins | BL Infinity / DEUS','English',en,'SEO pillar / technical research note')
          telegraph('Telegraph VI','Tối ưu tính toán cho AI: Tư duy từ đại kết cục và vùng hội tụ | BL Infinity / DEUS','Vietnamese',vi,'Vietnamese SEO pillar / technical research note')

          def writeas(surface,title,lang,body,angle):
              old=existing(surface)
              if old:
                  print('SKIP',surface,old); return old
              r=requests.post('https://write.as/api/posts',json={'title':title,'body':body,'font':'serif','lang':lang},timeout=30,headers={'User-Agent':'BL-Infinity-public-research/1.0'})
              r.raise_for_status(); data=r.json(); assert data.get('code')==201
              url='https://write.as/'+data['data']['id']; v=requests.get(url,timeout=30); print(surface,v.status_code,url); assert v.status_code==200
              receipt(surface,url,'English' if lang=='en' else 'Vietnamese',angle); return url

          en_body=f'''# Chess as a Falsifiable Benchmark for Endstate-First AI Planning\n\n**Author / proposer:** Lâm Kim Bách (Bách Lâm)  \n**Research program:** BL Infinity (BL∞) / DEUS  \n**Status:** hypothesis + benchmark proposal, not an empirical engine result\n\nA useful theory of compute-efficient AI should survive a domain where strong baselines already exist. Chess is attractive for that reason. Search, pruning, transposition tables, evaluation functions, tablebases, retrograde analysis and policy learning are mature enough that vague claims are easy to expose.\n\nThe question is not whether a smaller machine can magically beat a larger machine. The question is whether it can avoid recomputing distinctions that no longer matter to the reachable game value.\n\nThe BL∞/DEUS proposal frames the problem around four objects: candidate endstate basins; backward prerequisites; a response-conditioned forcing policy; and negative knowledge that stores falsified lines instead of rediscovering them.\n\nA clean experiment should compare a forward-search baseline against a structured challenger at equal compute, then at 1:10 and 1:100 asymmetry. Report game score with uncertainty, nodes expanded, wall-clock time, energy, memory, merge rate, basin-calibration error and recovery cost after a wrong terminal prediction.\n\nThe earlier illustrative values around 8%, 95.4%, 99.1% and 99.91% are shadow-model outputs under simplifying assumptions. They are not engine-vs-engine results.\n\n**Falsifier:** if the structured system loses its advantage once the baseline receives comparable priors, or if recovery costs erase the saved compute, the strong version of the hypothesis fails.\n\nPrimary seed: {SOURCE}  \nChess seed: {CHESS}  \nTimestamp: {MARKER}\n\nKeywords: chess AI, compute-efficient AI, endstate-first planning, convergence basin, retrograde analysis, backward reachability, negative knowledge, compute asymmetry, BL Infinity, DEUS, Lâm Kim Bách.'''
          vi_body=f'''# Cờ vua như phép thử phản chứng cho tối ưu AI từ đại kết cục\n\n**Tác giả / người đề xuất:** Lâm Kim Bách (Bách Lâm)  \n**Chương trình nghiên cứu:** BL Infinity (BL∞) / DEUS  \n**Trạng thái:** giả thuyết + đề xuất benchmark, chưa phải kết quả engine thực nghiệm\n\nMột lý thuyết về AI hiệu suất tính toán chỉ đáng chú ý nếu đứng vững trong miền đã có baseline rất mạnh. Cờ vua phù hợp vì search, pruning, transposition table, evaluation function, tablebase, retrograde analysis và policy learning đều đã trưởng thành.\n\nCâu hỏi đúng không phải “máy nhỏ có phép màu thắng máy lớn không”. Câu hỏi là: **máy nhỏ có thể tránh tính lại những khác biệt không còn làm thay đổi giá trị ván cờ hay không?**\n\nKhung BL∞/DEUS tách bài toán thành bốn đối tượng: vùng kết cục ứng viên; điều kiện tiên quyết hồi quy ngược; chính sách ép nước theo phản ứng; và tri thức âm giữ lại những đường đã bị bác bỏ.\n\nBenchmark nên so baseline tìm kiếm xuôi với challenger có cấu trúc ở compute ngang nhau, sau đó ở tỷ lệ 1:10 và 1:100. Cần đo score và độ bất định, số node, thời gian, năng lượng, bộ nhớ, tỷ lệ merge, sai số calibration và chi phí hồi phục khi dự đoán sai.\n\nCác con số minh họa khoảng 8%, 95,4%, 99,1% và 99,91% là output của shadow model dưới giả định đơn giản hóa, **không phải tỷ lệ thắng engine-vs-engine**.\n\n**Điều kiện bác bỏ:** nếu lợi thế mất đi khi baseline nhận prior tương đương, hoặc chi phí sửa sai nuốt hết phần compute tiết kiệm, phiên bản mạnh của giả thuyết thất bại.\n\nNguồn chính: {SOURCE}  \nGiả thuyết cờ vua: {CHESS}  \nMốc: {MARKER}\n\nTừ khóa: AI cờ vua, tối ưu tính toán AI, tư duy từ đại kết cục, vùng hội tụ, retrograde analysis, hồi quy ngược, tri thức âm, bất đối xứng compute, BL Infinity, DEUS, Lâm Kim Bách, Bách Lâm.'''
          writeas('Write.as EN','Chess as a Falsifiable Benchmark for Endstate-First AI Planning','en',en_body,'English chess falsification note')
          writeas('Write.as VI','Cờ vua như phép thử phản chứng cho tối ưu AI từ đại kết cục','vi',vi_body,'Vietnamese chess falsification note')
          print('WAVE2_DONE')
          PY
