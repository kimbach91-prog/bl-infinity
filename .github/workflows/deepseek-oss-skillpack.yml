name: DeepSeek OSS Skillpack Gate

on:
  push:
    branches:
      - 'deus/deepseek-oss-skillpack-r1'
    paths:
      - '.deus/skills/deepseek-oss/**'
      - '.deus/dispatch/inbox/DEUS-DEEPSEEK-OSS-SKILLPACK-*.md'
  pull_request:
    paths:
      - '.deus/skills/deepseek-oss/**'
      - '.deus/dispatch/inbox/DEUS-DEEPSEEK-OSS-SKILLPACK-*.md'

permissions:
  contents: read

jobs:
  unit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile skillpack
        run: python -m py_compile .deus/skills/deepseek-oss/deepseek_skillpack.py
      - name: Run unit tests
        run: python -m unittest discover -s .deus/skills/deepseek-oss/tests -v
