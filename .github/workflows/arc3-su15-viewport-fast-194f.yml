name: ARC3 SU15 generalized viewport fast lane 194F

on:
  push:
    branches:
      - deus/arc3-remaining14-coverage-20260922
    paths:
      - .github/workflows/arc3-su15-viewport-fast-194f.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  su15-viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_dense_scroll_renderer_audit_167.py \
            public_benchmark/arc3/kaggle_candidates/public_v5_canonical_patch_router_191.py \
            public_benchmark/arc3/kaggle_candidates/public_generalized_viewport_shift_194.py
      - name: Download SU15 p0-p19
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for p in $(seq 0 19); do
            f="su15-1944f8ab_p${p}_events.jsonl"
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute SU15 viewport heldout
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/su15-1944f8ab_p*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_generalized_viewport_shift_194.py \
            --game su15-1944f8ab "${args[@]}" --output su15-r194f.json
      - name: Verify
        run: |
          python - <<'PY'
          import json
          d=json.load(open('su15-r194f.json'))
          assert d['truth']['heldout_p10_p19_never_updates_shift_or_renderer'] is True
          print(json.dumps({'rung':'194F','selected':d['inner']['selected'],'heldout':d['heldout']['all'],'chosen':d['heldout']['chosen']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-su15-r194f
          path: |
            su15-r194f.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
