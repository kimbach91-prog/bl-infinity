name: Public S0 hosted compute canary

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/public-s0-compute-canary.yml"
      - "public-compute/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-s0-compute-canary
  cancel-in-progress: false

jobs:
  canary:
    if: github.actor == 'kimbach91-prog'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Execute deterministic BL-S0 compute
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');

          const N = 131072;
          const output = new Uint32Array(N);
          const expectedAt = (x) => (Math.imul(x >>> 0, 1664525) + 1013904223) >>> 0;

          let fnv = 2166136261 >>> 0;
          for (let i = 0; i < N; i++) {
            const x = (i + 1) >>> 0;
            const v = expectedAt(x);
            output[i] = v;
            fnv ^= v;
            fnv = Math.imul(fnv, 16777619) >>> 0;
          }

          const sampleIndexes = [0, 1, 2, 17, N - 1];
          const sample = sampleIndexes.map(i => {
            const actual = output[i] >>> 0;
            const expected = expectedAt((i + 1) >>> 0);
            if (actual !== expected) throw new Error(`sample mismatch at ${i}`);
            return [i, actual, expected];
          });

          const digest = crypto
            .createHash('sha256')
            .update(Buffer.from(output.buffer))
            .digest('hex');

          const receipt = {
            schema: 'public-s0-github-actions-receipt/1',
            route_id: 'PUBLIC-GITHUB-ACTIONS-CPU-S0',
            state: 'RESULT_VERIFIED_RUNNER_SCOPE',
            provider: 'GitHub Actions',
            source_commit: process.env.GITHUB_SHA || null,
            run_id: process.env.GITHUB_RUN_ID || null,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT || null,
            runner_os: process.env.RUNNER_OS || null,
            runner_arch: process.env.RUNNER_ARCH || null,
            data_class: 'BL-S0',
            workload: { kind: 'u32_lcg_transform', elements: N, bytes: output.byteLength },
            sample,
            checksum: fnv.toString(16).padStart(8, '0'),
            result_digest: digest,
            protected_core_export: false,
            private_memory_export: false,
            credentials_requested: false,
            canonical_write: false,
            external_network_workload_required: false,
            economic_yield_claim: false,
            capacity_scope: 'ONE_HOSTED_RUNNER_JOB_ONLY'
          };

          console.log('DEUS_PUBLIC_S0_RECEIPT=' + JSON.stringify(receipt));
          if (process.env.GITHUB_STEP_SUMMARY) {
            require('fs').appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              '## Public S0 compute canary\n\n' +
              '- State: RESULT_VERIFIED_RUNNER_SCOPE\n' +
              '- Route: PUBLIC-GITHUB-ACTIONS-CPU-S0\n' +
              '- Elements: ' + N + '\n' +
              '- Digest: ' + digest + '\n' +
              '- Economic yield claim: false\n'
            );
          }
          NODE
