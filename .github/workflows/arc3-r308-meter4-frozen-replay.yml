name: ARC3 R308 meter4 frozen replay
on:
  push:
    branches: [deus/r308-meter4-frozen-replay-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_meter4_frozen_replay_308.py
      - .github/workflows/arc3-r308-meter4-frozen-replay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r308:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 16}
      - name: Verify frozen candidate source precedes replay
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e e710a1a541ddbcda541440af45984ba5c1b74560^{commit}
          git merge-base --is-ancestor e710a1a541ddbcda541440af45984ba5c1b74560 HEAD
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_meter4_frozen_replay_308.py
      - name: Stage frozen four games p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for game in bp35-0a0ad940 sb26-7fbdac44 ls20-9607627b sp80-589a99af; do
            for p in $(seq 0 9); do
              f="${game}_p${p}_events.jsonl"
              cp "upstream-duck/example-run/artifacts/${f}" "public_trace/${f}"
            done
          done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 40
          ! find public_trace -maxdepth 1 -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute R308
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in $(find public_trace -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_meter4_frozen_replay_308.py "${args[@]}" --output r308.json 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r308.json'))
          assert d['schema']=='deus/arc3-r308-meter4-frozen-replay/1'
          assert d['lineage']['candidate_game_mode_pairs_frozen_before_p5_p9'] is True
          p=d['protocol']; t=d['truth']
          assert p['fit']=='p0-p4 only' and p['source_assisted_replay']=='p5-p9 only'
          assert p['p10_p19_staged_or_read'] is False and not p['p5_p9_updates_selector'] and not p['p5_p9_updates_model']
          assert t['p5_p9_replay_is_source_assisted'] and not t['p10_p19_read']
          assert not t['solver_promotion'] and not t['kaggle_execution'] and not t['competition_submission']
          print(json.dumps({'verdict':d['verdict'],'pass_games':d['pass_games']},sort_keys=True))
          PY
          sha256sum r308.json runtime.txt stdout.txt public_trace/SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r308-meter4-frozen-replay
          path: |
            r308.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
