name: ARC3 public residual semantic-frontier composition 158

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py
      - public_benchmark/arc3/kaggle_candidates/public_object_role_transition_prequential_138.py
      - public_benchmark/arc3/kaggle_candidates/public_unique_component_motion_audit_140.py
      - public_benchmark/arc3/kaggle_candidates/public_residual_shape_canonical_audit_145.py
      - public_benchmark/arc3/kaggle_candidates/public_residual_action_mobility_selector_audit_149.py
      - public_benchmark/arc3/kaggle_candidates/public_residual_placement_reconstruction_audit_150.py
      - public_benchmark/arc3/kaggle_candidates/public_residual_history_state_machine_audit_153.py
      - public_benchmark/arc3/kaggle_candidates/public_residual_ambiguous_motion_frontier_audit_157.py
      - public_benchmark/arc3/kaggle_candidates/public_residual_semantic_frontier_composition_158.py
      - .github/workflows/arc3-public-residual-semantic-frontier-composition-158.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-frontier-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_object_role_transition_prequential_138.py \
            public_benchmark/arc3/kaggle_candidates/public_unique_component_motion_audit_140.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_shape_canonical_audit_145.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_action_mobility_selector_audit_149.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_placement_reconstruction_audit_150.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_history_state_machine_audit_153.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_ambiguous_motion_frontier_audit_157.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_semantic_frontier_composition_158.py
      - name: Download exact pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in ar25-0c556536_p0_events.jsonl ar25-0c556536_p10_events.jsonl ar25-0c556536_p11_events.jsonl; do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute semantic-frontier composition diagnostic
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_residual_semantic_frontier_composition_158.py \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" \
            --output "$GITHUB_WORKSPACE/residual-semantic-frontier-composition-public-158.json"
      - name: Enforce truth boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('residual-semantic-frontier-composition-public-158.json'))
          assert d['schema']=='deus/arc3-public-residual-semantic-frontier-composition/1'
          assert d['rung']==158
          assert len(d['aggregate']['per_trace'])==3
          t=d['truth']
          assert t['semantic_prediction_prior_only'] is True
          assert t['frontier_location_and_pair_derived_pre_outcome'] is True
          assert t['expanded_correspondence_uses_current_outcome_for_scoring_target'] is True
          assert t['full_frame_prediction_claim'] is False
          assert t['kaggle_execution'] is False
          assert t['submission_quota_spent'] is False
          print(json.dumps({'rung':158,'gate':d['diagnostic_gate'],'aggregate':d['aggregate'],'truth':'PUBLIC_SEMANTIC_FRONTIER_DIAGNOSTIC_ONLY'},sort_keys=True))
          PY
      - name: Upload rung 158 diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-residual-semantic-frontier-composition-158
          path: |
            residual-semantic-frontier-composition-public-158.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
