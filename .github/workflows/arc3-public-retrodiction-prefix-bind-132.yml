name: ARC3 public retrodiction prefix bind 132

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_retrodiction_prefix_bind_132.py
      - .github/workflows/arc3-public-retrodiction-prefix-bind-132.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-prefix-bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and synthetic causality tripwire
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_retrodiction_prefix_bind_132.py
          python public_benchmark/arc3/kaggle_candidates/public_retrodiction_prefix_bind_132.py \
            --self-test \
            --output retrodiction-prefix-selftest-132.json
      - name: Download pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in \
            ar25-0c556536_p0_events.jsonl \
            ar25-0c556536_p10_events.jsonl \
            ar25-0c556536_p11_events.jsonl
          do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute prefix-only public retrodiction bind
        run: |
          set -euo pipefail
          python public_benchmark/arc3/kaggle_candidates/public_retrodiction_prefix_bind_132.py \
            --input public_trace/ar25-0c556536_p0_events.jsonl \
            --input public_trace/ar25-0c556536_p10_events.jsonl \
            --input public_trace/ar25-0c556536_p11_events.jsonl \
            --output retrodiction-prefix-public-132.json
      - name: Enforce truth and prefix-only contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('retrodiction-prefix-public-132.json'))
          assert d['schema'] == 'deus/arc3-public-retrodiction-prefix-bind/1'
          assert d['source_grounding']['public_trace_commit'] == '7652836056c59e044f093e3c13ed7438c814169e'
          assert d['causality_contract']['prediction_key_uses_current_outcome'] is False
          assert d['causality_contract']['prediction_uses_future_transitions'] is False
          assert d['causality_contract']['current_outcome_ingested_only_after_prediction_or_abstention'] is True
          assert d['truth']['public_trace_only'] is True
          assert d['truth']['source_assisted_replay'] is True
          assert d['truth']['independent_generalization_claim'] is False
          assert d['truth']['solver_behavior_gain_claim'] is False
          assert d['truth']['model_execution'] is False
          assert d['truth']['gpu_execution'] is False
          assert d['truth']['kaggle_execution'] is False
          assert d['truth']['kaggle_submission_attempted'] is False
          assert d['truth']['submission_quota_spent'] is False
          assert d['truth']['leaderboard_score_claim'] is False
          assert d['promotion']['candidate_model_promotion'] is False
          raw=d['aggregate']['visible_board_action']
          assert raw['transitions'] > 0
          assert raw['predictions'] > 0
          print(json.dumps({
              'rung': d['rung'],
              'next_gate_signal': d['next_gate_signal'],
              'raw': raw,
              'context_comparison': d['context_comparison'],
              'truth_boundary': 'PUBLIC_PREFIX_REPLAY_ONLY_NO_MODEL_OR_KAGGLE_GAIN',
          }, sort_keys=True))
          PY
      - name: Upload rung 132 receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-retrodiction-prefix-bind-132
          path: |
            retrodiction-prefix-public-132.json
            retrodiction-prefix-selftest-132.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
