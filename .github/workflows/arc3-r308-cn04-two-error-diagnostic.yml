name: ARC3 R308 cn04 two-error diagnostic
on:
  push:
    branches: [deus/r308-cn04-two-error-diagnostic-20260923]
    paths:
      - .github/workflows/arc3-r308-cn04-two-error-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 32}
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify source fixed before staging
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 14ca7462f56884020bbb152a8e2a3bb821810122^{commit}
          git merge-base --is-ancestor 14ca7462f56884020bbb152a8e2a3bb821810122 HEAD
      - name: Stage exact cn04-2fe56bfb p0-p19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 19); do
            f="cn04-2fe56bfb_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "public_trace/${f}"
          done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 20
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_cn04_two_error_diag_308.py
          args=(); for f in $(find public_trace -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_cn04_two_error_diag_308.py "${args[@]}" --output r308-cn04.json 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r308-cn04.json'))
          assert d['schema']=='deus/arc3-r308-cn04-two-error-diagnostic/1'
          p=d['protocol']; t=d['truth']; assert p['predictor_modified'] is False and p['future_hypothesis_may_use_diagnostic'] is True; assert t['reused_public_development_holdout'] and t['diagnostic_only'] and not t['solver_promotion'] and not t['kaggle_execution'] and not t['competition_submission']
          print(json.dumps({'verdict':d['verdict']},sort_keys=True))
          PY
          sha256sum r308-cn04.json runtime.txt stdout.txt public_trace/SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r308-cn04-two-error-diagnostic
          path: |
            r308-cn04.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
