name: ARC3 Flash agent-state matched provider A/B

on:
  push:
    branches:
      - deus/c9-agent-state-ab-tr87-20260923
    paths:
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/agent_state_ab_request.json
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_flash_agent_state_patch.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_build_flash_next_package.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_flash_teardown_patch.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_audit_flash_output.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/arc-agi-flash-next-mtp.ipynb
      - .github/workflows/arc3-flash-agent-state-ab.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  ROOT: public_benchmark/arc3/kaggle_candidates/flash_next_340

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      operation: ${{ steps.request.outputs.operation }}
      game_id: ${{ steps.request.outputs.game_id }}
      runtime_seconds: ${{ steps.request.outputs.runtime_seconds }}
      terminal_grace_seconds: ${{ steps.request.outputs.terminal_grace_seconds }}
      concurrency: ${{ steps.request.outputs.concurrency }}
      analyzer_timeout: ${{ steps.request.outputs.analyzer_timeout }}
      base_kernel_ref: ${{ steps.request.outputs.base_kernel_ref }}
      state_kernel_ref: ${{ steps.request.outputs.state_kernel_ref }}
      base_kernel_version: ${{ steps.request.outputs.base_kernel_version }}
      state_kernel_version: ${{ steps.request.outputs.state_kernel_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          path=Path("public_benchmark/arc3/kaggle_candidates/flash_next_340/agent_state_ab_request.json")
          req=json.loads(path.read_text())
          assert req.get("schema")=="deus/arc3-flash-agent-state-ab-request/1"
          assert req.get("operation") in {"dry_run","launch","readback"}
          assert re.fullmatch(r"[a-z0-9]{4}-[0-9a-f]{8}", str(req.get("game_id","")))
          for key in ("runtime_seconds","terminal_grace_seconds","concurrency","analyzer_timeout"):
              assert isinstance(req.get(key), int) and req[key] > 0
          assert 0 <= req["terminal_grace_seconds"] < 600
          for key in ("base_kernel_version","state_kernel_version"):
              assert isinstance(req.get(key), int) and req[key] >= 0
          for key in ("base_kernel_ref","state_kernel_ref"):
              assert re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", str(req.get(key,"")))
          assert req["base_kernel_ref"] != req["state_kernel_ref"]
          if req["operation"] == "readback":
              assert req["base_kernel_version"] > 0 and req["state_kernel_version"] > 0

          out=Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as f:
              for key in (
                  "operation","game_id","runtime_seconds","terminal_grace_seconds",
                  "concurrency","analyzer_timeout","base_kernel_ref","state_kernel_ref",
                  "base_kernel_version","state_kernel_version",
              ):
                  f.write(f"{key}={req[key]}\n")
          PY

      - name: Stage matched builder tree
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/flash-state-ab-contract"
          mkdir -p "$TMP/scripts"
          cp "$ROOT/arc-agi-flash-next-mtp.ipynb" "$TMP/arc-agi-flash-next-mtp.ipynb"
          cp "$ROOT/upstream_build_flash_next_package.py" "$TMP/scripts/build_flash_next_package.py"
          cp "$ROOT/upstream_flash_teardown_patch.py" "$TMP/scripts/flash_teardown_patch.py"
          cp "$ROOT/upstream_flash_agent_state_patch.py" "$TMP/scripts/flash_agent_state_patch.py"
          echo "AB_TMP=$TMP" >> "$GITHUB_ENV"

      - name: Build base and state packages with identical bounded settings
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
          RUNTIME: ${{ steps.request.outputs.runtime_seconds }}
          GRACE: ${{ steps.request.outputs.terminal_grace_seconds }}
          CONCURRENCY: ${{ steps.request.outputs.concurrency }}
          ANALYZER: ${{ steps.request.outputs.analyzer_timeout }}
        run: |
          set -euo pipefail
          BASE="$AB_TMP/build/base"
          STATE="$AB_TMP/build/state"
          python "$AB_TMP/scripts/build_flash_next_package.py"             --kernel-id "deusplaceholder/arc-agi3-flash-next-mtp-base-preflight"             --mode preflight --max-games 1 --game-id "$GAME_ID"             --concurrency "$CONCURRENCY" --runtime-seconds "$RUNTIME"             --terminal-grace-seconds "$GRACE" --analyzer-timeout "$ANALYZER"             --output-dir "$BASE"
          python "$AB_TMP/scripts/build_flash_next_package.py"             --kernel-id "deusplaceholder/arc-agi3-flash-next-mtp-state-preflight"             --mode preflight --max-games 1 --game-id "$GAME_ID"             --concurrency "$CONCURRENCY" --runtime-seconds "$RUNTIME"             --terminal-grace-seconds "$GRACE" --analyzer-timeout "$ANALYZER"             --agent-state-patch --output-dir "$STATE"
          echo "AB_BASE=$BASE" >> "$GITHUB_ENV"
          echo "AB_STATE=$STATE" >> "$GITHUB_ENV"

      - name: Verify matched contract and truth boundary
        id: verify
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
          RUNTIME: ${{ steps.request.outputs.runtime_seconds }}
          GRACE: ${{ steps.request.outputs.terminal_grace_seconds }}
          CONCURRENCY: ${{ steps.request.outputs.concurrency }}
          ANALYZER: ${{ steps.request.outputs.analyzer_timeout }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def load_one(root):
              root=Path(root)
              nbs=list(root.glob("*.ipynb"))
              assert len(nbs)==1, nbs
              nb=nbs[0]
              doc=json.loads(nb.read_text())
              code="\n".join(
                  "".join(c.get("source",[])) for c in doc.get("cells",[])
                  if c.get("cell_type")=="code"
              )
              meta=json.loads((root/"kernel-metadata.json").read_text())
              return nb,code,meta

          bnb,bcode,bmeta=load_one(os.environ["AB_BASE"])
          snb,scode,smeta=load_one(os.environ["AB_STATE"])
          base_hash=hashlib.sha256(bnb.read_bytes()).hexdigest()
          state_hash=hashlib.sha256(snb.read_bytes()).hexdigest()
          checks={
              "hashes_differ": base_hash != state_hash,
              "base_overlay_absent": "FLASH_AGENT_STATE_PATCH" not in bcode,
              "state_patch_marker": "FLASH_AGENT_STATE_PATCH" in scode,
              "state_overlay_ready": "FLASH_AGENT_OVERLAY_READY" in scode,
              "state_overlay_imported": "FLASH_AGENT_OVERLAY_IMPORTED" in scode,
              "same_machine": bmeta.get("machine_shape")==smeta.get("machine_shape")=="NvidiaRtxPro6000",
              "same_model_sources": bmeta.get("model_sources")==smeta.get("model_sources"),
              "same_dataset_sources": bmeta.get("dataset_sources")==smeta.get("dataset_sources"),
              "same_competition_sources": bmeta.get("competition_sources")==smeta.get("competition_sources"),
              "internet_off": bmeta.get("enable_internet") is False and smeta.get("enable_internet") is False,
          }
          receipt={
              "schema":"deus/arc3-flash-agent-state-ab-contract/1",
              "gate":"READY_FOR_AUTHENTICATED_MATCHED_PREFLIGHT" if all(checks.values()) else "HOLD",
              "base_notebook_sha256":base_hash,
              "state_notebook_sha256":state_hash,
              "matched_settings":{
                  "game_id":os.environ["GAME_ID"],
                  "runtime_seconds":int(os.environ["RUNTIME"]),
                  "terminal_grace_seconds":int(os.environ["GRACE"]),
                  "concurrency":int(os.environ["CONCURRENCY"]),
                  "analyzer_timeout":int(os.environ["ANALYZER"]),
              },
              "checks":checks,
              "promotion_policy":{
                  "state_offline_mean_gt_base":"PROMOTE_TO_WIDER_PROVIDER_TEST",
                  "equal_offline_mean_and_state_actions_lt_base":"PROMOTE_EFFICIENCY_ONLY",
                  "otherwise":"RETAIN_BASE",
                  "static_contract_never_promotes":True,
              },
              "truth":{
                  "network_calls":False,
                  "kaggle_auth_used":False,
                  "gpu_model_behavior_verified":False,
                  "kernel_push":False,
                  "competition_submission":False,
                  "submission_quota_spent":False,
                  "candidate_promoted":False,
              },
          }
          Path("flash-agent-state-ab-contract.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          assert receipt["gate"]=="READY_FOR_AUTHENTICATED_MATCHED_PREFLIGHT"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:
              f.write(f"base_hash={base_hash}\nstate_hash={state_hash}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: arc3-flash-agent-state-ab-contract
          path: flash-agent-state-ab-contract.json
          if-no-files-found: error

  provider:
    if: needs.contract.outputs.operation != 'dry_run'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPERATION: ${{ needs.contract.outputs.operation }}
      GAME_ID: ${{ needs.contract.outputs.game_id }}
      RUNTIME: ${{ needs.contract.outputs.runtime_seconds }}
      GRACE: ${{ needs.contract.outputs.terminal_grace_seconds }}
      CONCURRENCY: ${{ needs.contract.outputs.concurrency }}
      ANALYZER: ${{ needs.contract.outputs.analyzer_timeout }}
      BASE_KERNEL_REF: ${{ needs.contract.outputs.base_kernel_ref }}
      STATE_KERNEL_REF: ${{ needs.contract.outputs.state_kernel_ref }}
      BASE_KERNEL_VERSION: ${{ needs.contract.outputs.base_kernel_version }}
      STATE_KERNEL_VERSION: ${{ needs.contract.outputs.state_kernel_version }}
      SEC_KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      VAR_KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      SEC_KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      VAR_KAGGLE_KEY: ${{ vars.KAGGLE_KEY }}
      SEC_KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      VAR_KAGGLE_API_TOKEN: ${{ vars.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle CLI and audit dependency
        run: python -m pip install --disable-pip-version-check --quiet kaggle pyarrow

      - name: Fail closed before provider access
        shell: bash
        run: |
          set -euo pipefail
          for ref in "$BASE_KERNEL_REF" "$STATE_KERNEL_REF"; do
            if [[ "$ref" == replace-me/* ]] || [[ ! "$ref" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "Concrete authorized base/state owner/slug refs are required." >&2
              exit 3
            fi
          done
          if [ "$BASE_KERNEL_REF" = "$STATE_KERNEL_REF" ]; then
            echo "Base and state kernels must be separate immutable refs." >&2
            exit 3
          fi
          KAGGLE_USERNAME="${SEC_KAGGLE_USERNAME:-${VAR_KAGGLE_USERNAME:-}}"
          KAGGLE_KEY="${SEC_KAGGLE_KEY:-${VAR_KAGGLE_KEY:-}}"
          KAGGLE_API_TOKEN="${SEC_KAGGLE_API_TOKEN:-${VAR_KAGGLE_API_TOKEN:-}}"
          if [ -z "$KAGGLE_API_TOKEN" ] && { [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; }; then
            echo "No Kaggle machine credential is bound; holding before provider execution." >&2
            exit 4
          fi
          {
            echo "KAGGLE_USERNAME=$KAGGLE_USERNAME"
            echo "KAGGLE_KEY=$KAGGLE_KEY"
            echo "KAGGLE_API_TOKEN=$KAGGLE_API_TOKEN"
          } >> "$GITHUB_ENV"
          kaggle kernels list --mine --page-size 1 >/dev/null

      - name: Build exact matched provider packages
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/flash-state-ab-provider"
          mkdir -p "$TMP/scripts"
          cp "$ROOT/arc-agi-flash-next-mtp.ipynb" "$TMP/arc-agi-flash-next-mtp.ipynb"
          cp "$ROOT/upstream_build_flash_next_package.py" "$TMP/scripts/build_flash_next_package.py"
          cp "$ROOT/upstream_flash_teardown_patch.py" "$TMP/scripts/flash_teardown_patch.py"
          cp "$ROOT/upstream_flash_agent_state_patch.py" "$TMP/scripts/flash_agent_state_patch.py"
          BASE="$TMP/build/base"
          STATE="$TMP/build/state"
          python "$TMP/scripts/build_flash_next_package.py"             --kernel-id "$BASE_KERNEL_REF" --mode preflight --max-games 1             --game-id "$GAME_ID" --concurrency "$CONCURRENCY"             --runtime-seconds "$RUNTIME" --terminal-grace-seconds "$GRACE"             --analyzer-timeout "$ANALYZER" --output-dir "$BASE"
          python "$TMP/scripts/build_flash_next_package.py"             --kernel-id "$STATE_KERNEL_REF" --mode preflight --max-games 1             --game-id "$GAME_ID" --concurrency "$CONCURRENCY"             --runtime-seconds "$RUNTIME" --terminal-grace-seconds "$GRACE"             --analyzer-timeout "$ANALYZER" --agent-state-patch --output-dir "$STATE"
          echo "PROVIDER_BASE=$BASE" >> "$GITHUB_ENV"
          echo "PROVIDER_STATE=$STATE" >> "$GITHUB_ENV"

      - name: Launch matched private preflights
        if: env.OPERATION == 'launch'
        shell: bash
        run: |
          set -euo pipefail
          push_one () {
            local dir="$1" prefix="$2"
            set +e
            kaggle kernels push -p "$dir" -t 30000 > "$prefix.stdout" 2> "$prefix.stderr"
            local rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              sed -n '1,120p' "$prefix.stderr" >&2
              return "$rc"
            fi
            python - "$prefix.stdout" "$prefix.stderr" <<'PY'
          import re,sys
          text=open(sys.argv[1],errors="replace").read()+"\n"+open(sys.argv[2],errors="replace").read()
          m=re.search(r"Kernel version\s+(\d+)\s+successfully pushed",text,re.I)
          if not m: raise SystemExit("provider did not expose exact pushed version")
          print(m.group(1))
          PY
          }
          BASE_VERSION="$(push_one "$PROVIDER_BASE" base-push)"
          STATE_VERSION="$(push_one "$PROVIDER_STATE" state-push)"
          export BASE_VERSION STATE_VERSION
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def digest(root):
              nb=next(Path(root).glob("*.ipynb"))
              return hashlib.sha256(nb.read_bytes()).hexdigest()
          receipt={
              "schema":"deus/arc3-flash-agent-state-ab-launch/1",
              "status":"MATCHED_PRIVATE_PREFLIGHTS_LAUNCHED",
              "base":{"kernel_ref":os.environ["BASE_KERNEL_REF"],"version":int(os.environ["BASE_VERSION"]),"notebook_sha256":digest(os.environ["PROVIDER_BASE"])},
              "state":{"kernel_ref":os.environ["STATE_KERNEL_REF"],"version":int(os.environ["STATE_VERSION"]),"notebook_sha256":digest(os.environ["PROVIDER_STATE"])},
              "matched":{"game_id":os.environ["GAME_ID"],"runtime_seconds":int(os.environ["RUNTIME"]),"concurrency":int(os.environ["CONCURRENCY"]),"analyzer_timeout":int(os.environ["ANALYZER"])},
              "truth":{"kaggle_authenticated":True,"kernel_pushes":2,"competition_submission":False,"submission_quota_spent":False,"leaderboard_score_observed":False,"candidate_promoted":False},
          }
          Path("flash-agent-state-ab-launch.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Read exact matched versions and compare strict audits
        if: env.OPERATION == 'readback'
        shell: bash
        run: |
          set -euo pipefail
          for v in "$BASE_KERNEL_VERSION" "$STATE_KERNEL_VERSION"; do
            [[ "$v" =~ ^[1-9][0-9]*$ ]] || { echo "readback requires exact positive versions" >&2; exit 5; }
          done
          BASE_EXACT="$BASE_KERNEL_REF/$BASE_KERNEL_VERSION"
          STATE_EXACT="$STATE_KERNEL_REF/$STATE_KERNEL_VERSION"
          set +e
          kaggle kernels status "$BASE_EXACT" > base-status.stdout 2> base-status.stderr
          brc=$?
          kaggle kernels status "$STATE_EXACT" > state-status.stdout 2> state-status.stderr
          src=$?
          set -e
          [ "$brc" -eq 0 ] || { sed -n '1,120p' base-status.stderr >&2; exit "$brc"; }
          [ "$src" -eq 0 ] || { sed -n '1,120p' state-status.stderr >&2; exit "$src"; }
          if ! grep -Eqi 'complete|completed' base-status.stdout base-status.stderr ||              ! grep -Eqi 'complete|completed' state-status.stdout state-status.stderr; then
            export BASE_EXACT STATE_EXACT
            python - <<'PY'
          import json,os
          from pathlib import Path
          receipt={
              "schema":"deus/arc3-flash-agent-state-ab-readback/1",
              "status":"PENDING_PROVIDER",
              "base_exact":os.environ["BASE_EXACT"],
              "state_exact":os.environ["STATE_EXACT"],
              "truth":{"exact_versions_queried":True,"both_complete":False,"audits_executed":False,"competition_submission":False,"submission_quota_spent":False,"candidate_promoted":False},
          }
          Path("flash-agent-state-ab-readback.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
            exit 0
          fi

          BASE_OUT="$RUNNER_TEMP/base-output"
          STATE_OUT="$RUNNER_TEMP/state-output"
          mkdir -p "$BASE_OUT" "$STATE_OUT"
          kaggle kernels output "$BASE_EXACT" -p "$BASE_OUT"
          kaggle kernels output "$STATE_EXACT" -p "$STATE_OUT"

          BASE_LOG="$(find "$BASE_OUT" -maxdepth 1 -type f -name 'arc-agi3-flash-next-mtp-*.log' -printf '%f\n' | head -n1)"
          STATE_LOG="$(find "$STATE_OUT" -maxdepth 1 -type f -name 'arc-agi3-flash-next-mtp-*.log' -printf '%f\n' | head -n1)"
          test -n "$BASE_LOG"
          test -n "$STATE_LOG"

          set +e
          python "$ROOT/upstream_audit_flash_output.py"             --mode preflight --expected-games 1 --expected-concurrency "$CONCURRENCY"             --expected-game-id "$GAME_ID" --expected-runtime-seconds "$RUNTIME"             --expected-gameplay-budget-seconds "$RUNTIME" --require-runtime-from-ready             --expected-terminal-grace-seconds "$GRACE" --expected-analyzer-timeout "$ANALYZER"             --require-clean --kernel-log "$BASE_LOG" "$BASE_OUT" > base-audit.json
          BASE_AUDIT_RC=$?
          python "$ROOT/upstream_audit_flash_output.py"             --mode preflight --expected-games 1 --expected-concurrency "$CONCURRENCY"             --expected-game-id "$GAME_ID" --expected-runtime-seconds "$RUNTIME"             --expected-gameplay-budget-seconds "$RUNTIME" --require-runtime-from-ready             --expected-terminal-grace-seconds "$GRACE" --expected-analyzer-timeout "$ANALYZER"             --require-clean --require-agent-state-patch --kernel-log "$STATE_LOG"             "$STATE_OUT" > state-audit.json
          STATE_AUDIT_RC=$?
          set -e
          export BASE_EXACT STATE_EXACT BASE_AUDIT_RC STATE_AUDIT_RC
          python - <<'PY'
          import json,os
          from pathlib import Path
          def load(path):
              try: return json.loads(Path(path).read_text())
              except Exception: return {"passed":False,"error_type":"AuditReportParseError"}
          base=load("base-audit.json"); state=load("state-audit.json")
          bp=os.environ["BASE_AUDIT_RC"]=="0" and base.get("passed") is True
          sp=os.environ["STATE_AUDIT_RC"]=="0" and state.get("passed") is True
          if not (bp and sp):
              verdict="INCONCLUSIVE_AUDIT_FAILURE"
          else:
              bm=float(base.get("offline_mean",0)); sm=float(state.get("offline_mean",0))
              ba=int(base.get("total_actions",0)); sa=int(state.get("total_actions",0))
              if sm > bm:
                  verdict="PROMOTE_TO_WIDER_PROVIDER_TEST"
              elif sm == bm and sa < ba:
                  verdict="PROMOTE_EFFICIENCY_ONLY"
              else:
                  verdict="RETAIN_BASE"
          receipt={
              "schema":"deus/arc3-flash-agent-state-ab-readback/1",
              "status":"MATCHED_AUDIT_COMPLETE" if bp and sp else "MATCHED_AUDIT_FAILED",
              "verdict":verdict,
              "base_exact":os.environ["BASE_EXACT"],
              "state_exact":os.environ["STATE_EXACT"],
              "base_audit":base,
              "state_audit":state,
              "truth":{"kaggle_authenticated":True,"both_complete":True,"audits_executed":True,"competition_submission":False,"submission_quota_spent":False,"leaderboard_score_observed":False,"candidate_promoted":False},
          }
          Path("flash-agent-state-ab-readback.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"status":receipt["status"],"verdict":verdict,"base_mean":base.get("offline_mean"),"state_mean":state.get("offline_mean"),"base_actions":base.get("total_actions"),"state_actions":state.get("total_actions"),"submission_quota_spent":False},indent=2))
          if not (bp and sp): raise SystemExit(7)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-flash-agent-state-ab-provider-receipts
          path: |
            flash-agent-state-ab-launch.json
            flash-agent-state-ab-readback.json
            base-audit.json
            state-audit.json
            base-status.stdout
            base-status.stderr
            state-status.stdout
            state-status.stderr
          if-no-files-found: warn
          retention-days: 30
