name: DEUS Public Symbolic Oracle CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'public-symbolic-oracle/**'
      - '.github/workflows/deus-public-symbolic-oracle-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-symbolic-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      reused_source_head: ${{ steps.scope.outputs.reused_source_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve verified unchanged upstream shards during this draft repair
        id: scope
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          oracle=$(git rev-parse HEAD:public-symbolic-oracle/oracle.py)
          harness=$(git rev-parse HEAD:public-symbolic-oracle/verify.py)
          cases=$(git rev-parse HEAD:public-symbolic-oracle/public-cases.json)
          if [[ "$PR_NUMBER" == "367" && "$IS_DRAFT" == "true" && "$oracle" == "754dfb56c9ef20808635560a24b19bddba069cf8" && "$harness" == "3b94aaaf69e288675142732a4278cc9a17bf4f5d" && "$cases" == "77750300feca16ef70175c2ae3c87bee7b5b10ba" ]]; then
            printf '%s\n' 'matrix={"include":[{"os":"windows-2025","shard":1}]}' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'reused_source_head=b039072838e2da63dcddb5506b3f4e6a6de06865' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'matrix={"include":[{"os":"ubuntu-24.04","shard":0},{"os":"windows-2025","shard":1},{"os":"macos-15","shard":2}]}' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'reused_source_head=' >> "$GITHUB_OUTPUT"
          fi
  oracle:
    needs: select
    name: oracle-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify one bounded public regression shard
        env:
          DEUS_CI_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -I -B public-symbolic-oracle/verify.py --cases public-symbolic-oracle/public-cases.json --manifest public-symbolic-oracle/source-manifest.json --shard ${{ matrix.shard }} --shards 3 --output public-symbolic-oracle/out/result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-symbolic-oracle-${{ matrix.os }}
          path: public-symbolic-oracle/out/
          if-no-files-found: error
          retention-days: 3
