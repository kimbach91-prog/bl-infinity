name: ARC3 public temporal path-state 177

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_temporal_path_state_177.py
      - .github/workflows/arc3-public-temporal-path-state-177.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-path-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_fullboard_translation_program_160.py \
            public_benchmark/arc3/kaggle_candidates/public_dense_scroll_renderer_audit_167.py \
            public_benchmark/arc3/kaggle_candidates/public_world_overlay_renderer_172.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_family_sweep_175.py \
            public_benchmark/arc3/kaggle_candidates/public_temporal_path_state_177.py
      - name: Download exact pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in ar25-0c556536_p0_events.jsonl ar25-0c556536_p10_events.jsonl ar25-0c556536_p11_events.jsonl; do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute p11 temporal selection then frozen p0/p10 evaluation
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_temporal_path_state_177.py \
            --calibration "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" \
            --eval "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" \
            --eval "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" \
            --output "$GITHUB_WORKSPACE/temporal-path-state-public-177.json"
      - name: Enforce truth boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('temporal-path-state-public-177.json'))
          assert d['schema']=='deus/arc3-public-temporal-path-state/1'
          assert d['rung']==177
          t=d['truth']
          assert t['candidate_selected_on_p11_only'] is True
          assert t['p0_p10_not_used_for_candidate_selection'] is True
          assert t['current_prediction_uses_preaction_and_prior_history_only'] is True
          assert t['current_outcome_used_only_for_scoring_and_post_prediction_learning'] is True
          assert t['independent_generalization_claim'] is False
          assert t['kaggle_execution'] is False
          assert t['submission_quota_spent'] is False
          print(json.dumps({
            'rung':177,
            'gate':d['diagnostic_gate'],
            'chosen':d['calibration']['chosen_candidate'],
            'calibration':d['calibration']['candidates'].get(d['calibration']['chosen_candidate']) if d['calibration']['chosen_candidate'] else None,
            'evaluation':d['evaluation'],
            'truth':'P11_SELECTED_P0P10_FROZEN_PUBLIC_ONLY'
          },sort_keys=True))
          PY
      - name: Upload rung 177 diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-temporal-path-state-177
          path: |
            temporal-path-state-public-177.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
