name: ARC3 R316 tr87 wa30 nested verifier
on:
  push:
    branches: [deus/r316-tr87-wa30-nested-verifier-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_tr87_wa30_nested_verifier_316.py
      - .github/workflows/arc3-r316-tr87-wa30-nested-verifier.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  r316:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        game: [tr87-cd924810, wa30-ee6fef47]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage p0-p4 only
        run: |
          mkdir -p public_trace
          for p in $(seq 0 4); do cp "upstream-duck/example-run/artifacts/${{ matrix.game }}_p${p}_events.jsonl" public_trace/; done
          test "$(find public_trace -name '*_events.jsonl' | wc -l)" -eq 5
          ! find public_trace -name '*_p[5-9]_events.jsonl' | grep -q .
      - name: Execute
        run: |
          args=(); for f in $(find public_trace -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_tr87_wa30_nested_verifier_316.py "${args[@]}" --game "${{ matrix.game }}" --output r316.json | tee stdout.txt
      - name: Audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r316.json')); assert d['schema']=='deus/arc3-r316-tr87-wa30-nested-verifier/1'
          assert not d['protocol']['p5_p9_staged_or_read'] and not d['protocol']['p10_p19_staged_or_read']
          print(json.dumps({'game':d['game'],'mode':d['mode'],'verdict':d['verdict'],'loto':d['loto']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r316-${{ matrix.game }}
          path: |
            r316.json
            stdout.txt
          retention-days: 30
