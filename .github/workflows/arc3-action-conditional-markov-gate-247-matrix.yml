name: ARC3 action conditional Markov gate 247 matrix
on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - .github/workflows/arc3-action-conditional-markov-gate-247-matrix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  per-game:
    strategy:
      fail-fast: false
      matrix:
        game:
          - ar25-0c556536
          - bp35-0a0ad940
          - cd82-fb555c5d
          - cn04-2fe56bfb
          - dc22-fdcac232
          - ft09-0d8bbf25
          - g50t-5849a774
          - ka59-38d34dbb
          - lf52-271a04aa
          - lp85-305b61c3
          - ls20-9607627b
          - m0r0-492f87ba
          - r11l-495a7899
          - re86-8af5384d
          - s5i5-18d95033
          - sb26-7fbdac44
          - sc25-635fd71a
          - sk48-d8078629
          - sp80-589a99af
          - su15-1944f8ab
          - tn36-ef4dde99
          - tr87-cd924810
          - tu93-0768757b
          - vc33-5430563c
          - wa30-ee6fef47
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage one game's 20 pinned traces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace out
          for p in $(seq 0 19); do
            f="${{ matrix.game }}_p${p}_events.jsonl"
            src="upstream-duck/example-run/artifacts/$f"
            test -s "$src"
            cp "$src" "public_trace/$f"
          done
          test "$(find public_trace -name '*_events.jsonl' | wc -l)" -eq 20
      - name: Execute R247 one game
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in public_trace/*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_action_conditional_markov_gate_247.py             "${args[@]}" --output "out/${{ matrix.game }}.json"
      - name: Verify per-game truth boundary
        run: |
          python - <<'PY'
          import json,glob
          p=glob.glob('out/*.json')
          assert len(p)==1
          d=json.load(open(p[0]))
          assert d['schema']=='deus/arc3-r247-action-conditional-markov-gate/1'
          assert d['aggregate']['game_count']==1
          t=d['truth']
          assert t['game_source_read'] is False
          assert t['selection_uses_p0_p9_only'] is True
          assert t['p10_p19_never_updates_selection_or_model'] is True
          assert t['r246_wrong_locations_not_encoded_as_rules'] is True
          assert t['kaggle_execution'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r247-${{ matrix.game }}
          path: out/${{ matrix.game }}.json
          if-no-files-found: error
          retention-days: 30

  reduce:
    needs: per-game
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r247-*
          path: collected
          merge-multiple: true
      - name: Reduce exact aggregate
        run: |
          python - <<'PY'
          import json,glob
          from collections import Counter
          files=sorted(glob.glob('collected/*.json'))
          assert len(files)==25, len(files)
          agg=Counter(); games={}; gain_games=[]
          for p in files:
              d=json.load(open(p))
              assert d['schema']=='deus/arc3-r247-action-conditional-markov-gate/1'
              assert len(d['games'])==1
              g,x=next(iter(d['games'].items()))
              games[g]=x
              a=d['aggregate']
              for k in ('transitions','exact_baseline','baseline_abstain','candidate_predictions','candidate_correct','candidate_wrong'):
                  agg[k]+=int(a.get(k,0) or 0)
              if x.get('gain'): gain_games.append(g)
          p=agg['candidate_predictions']; opp=agg['baseline_abstain']
          aggregate={**dict(agg),
              'candidate_accuracy':round(agg['candidate_correct']/p,6) if p else None,
              'candidate_coverage_of_baseline_abstain':round(p/opp,6) if opp else 0.0,
              'gain_games':sorted(gain_games),'gain_game_count':len(gain_games),'game_count':25}
          nondominated=bool(p>0 and agg['candidate_wrong']==0 and agg['candidate_correct']>0)
          out={
            'schema':'deus/arc3-r247-action-conditional-markov-matrix-reduction/1',
            'source_run_protocol':'same R247 source, per-game parallel execution',
            'aggregate':aggregate,
            'games':games,
            'non_dominated_source_side_gain':nondominated,
            'truth':{
              'same_model_and_selection_logic_as_serial_r247':True,
              'public_trace_only':True,
              'p10_p19_never_updates_selection_or_model':True,
              'kaggle_execution':False
            }
          }
          open('r247-matrix-reduction.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'aggregate':aggregate,'gain':nondominated,
                            'sc25':games['sc25-635fd71a']['heldout'],
                            'selected_sc25':games['sc25-635fd71a']['selected_by_action']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r247-matrix-reduction
          path: r247-matrix-reduction.json
          if-no-files-found: error
          retention-days: 30
