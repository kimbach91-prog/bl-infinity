name: ARC3 R333 existing-artifact aggregate recovery

on:
  push:
    branches: [deus/r335-sourcefree-gate-20260923]
    paths:
      - .github/workflows/arc3-r333-existing-artifact-aggregate-recovery.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/frozen-r330/public_benchmark/arc3/kaggle_candidates
  SOURCE_RUN_ID: "35846360907"

jobs:
  recover-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen R330 dependency ancestry
        uses: actions/checkout@v4
        with:
          repository: kimbach91-prog/bl-infinity
          ref: 7358fa568414a96a2acf864a450ecc078bd8c433
          path: frozen-r330
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover only existing R333 per-game artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: r333-game-*
          path: r333_inputs
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: kimbach91-prog/bl-infinity
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verify custody and aggregate without replay
        shell: bash
        run: |
          set -euo pipefail
          test "$(find r333_inputs -maxdepth 1 -name 'r333-game-*.json' -type f | wc -l)" -eq 25
          test -f frozen-r330/public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py
          python public_benchmark/arc3/kaggle_candidates/public_crossgame_meta_gate_lgo_333.py \
            --aggregate-dir r333_inputs \
            --output r333-crossgame-meta-gate-lgo-recovered.json | tee aggregate-stdout.txt

      - name: Independent boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("r333-crossgame-meta-gate-lgo-recovered.json").read_text())
          assert d["schema"]=="deus/arc3-r333-crossgame-meta-gate-lgo/1"
          assert d["idempotency_key"]=="R333-CROSSGAME-META-GATE-LGO-20260923-001"
          assert d["protocol"]["game_count"]==25
          assert d["protocol"]["p5_p9_staged_or_read"] is False
          assert d["protocol"]["p10_p19_staged_or_read"] is False
          assert len(d["folds"])==25
          assert all(x["selection_used_held_outcome"] is False for x in d["folds"])
          assert d["truth"]["public_offline_only"] is True
          assert d["truth"]["game_level_cross_validation"] is True
          assert d["truth"]["kaggle_execution"] is False
          assert d["truth"]["competition_submission"] is False
          print(json.dumps({
            "verdict":d["verdict"],
            "aggregate":d["aggregate"],
            "threshold_histogram":d["threshold_histogram"]
          },sort_keys=True))
          PY
          sha256sum r333-crossgame-meta-gate-lgo-recovered.json aggregate-stdout.txt > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: r333-existing-artifact-aggregate-recovery
          path: |
            r333-crossgame-meta-gate-lgo-recovered.json
            aggregate-stdout.txt
            SHA256SUMS.txt
          retention-days: 30
