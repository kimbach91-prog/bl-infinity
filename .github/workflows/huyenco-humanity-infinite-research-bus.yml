name: Huyen Co Humanity Infinite Research Bus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/huyenco-humanity-infinite-research-bus.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: huyenco-humanity-infinite-research-bus
  cancel-in-progress: false

jobs:
  collect-public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run public evidence collector
        run: python tools/huyenco/humanity_infinite_evidence_sweep.py

      - name: Commit packet only when changed
        shell: bash
        run: |
          set -euo pipefail
          inbox='.deus/research/humanity-infinite/inbox'
          if [[ -z "$(git status --porcelain -- "$inbox")" ]]; then
            echo "No research packet delta."
            exit 0
          fi

          git config user.name "DEUS HuyenCo Research Bus"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$inbox"

          # `git diff --quiet` alone misses untracked files. After staging, this
          # cached diff is the authoritative material-delta check.
          if git diff --cached --quiet -- "$inbox"; then
            echo "No staged research packet delta."
            exit 0
          fi

          git commit -m "Huyen Co: update Humanity Infinite evidence packet"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
