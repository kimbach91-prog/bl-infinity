name: ARC3 Flash matched agent-state A/B actuator

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - .github/workflows/arc3-flash-agent-state-matched-ab.yml
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_build_flash_next_package.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_flash_agent_state_patch.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_flash_teardown_patch.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_audit_flash_output.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/arc-agi-flash-next-mtp.ipynb
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/agent_state_ab_request.json
  workflow_dispatch:
    inputs:
      operation:
        description: Contract only, launch one arm, or read back one exact completed arm
        required: true
        type: choice
        default: dry_run
        options:
          - dry_run
          - launch_base
          - launch_overlay
          - readback_base
          - readback_overlay
      base_kernel_ref:
        description: Authorized private Kaggle owner/slug for the BASE preflight arm
        required: true
        type: string
        default: replace-me/arc-agi3-flash-next-mtp-base-preflight
      overlay_kernel_ref:
        description: Authorized private Kaggle owner/slug for the AGENT-STATE preflight arm
        required: true
        type: string
        default: replace-me/arc-agi3-flash-next-mtp-state-preflight
      kernel_version:
        description: Exact positive Kaggle version for readback operations
        required: true
        type: string
        default: "0"

permissions:
  contents: read

env:
  AB_GAME_ID: tr87-cd924810
  AB_CONCURRENCY: "1"
  AB_RUNTIME_SECONDS: "1200"
  AB_TERMINAL_GRACE_SECONDS: "120"
  AB_ANALYZER_TIMEOUT: "900"
  BASE_SOURCE_NOTEBOOK_SHA256: 6cff5483a6240cfe249310778a68e58df6f164acca25e5b4504eeaade838c899
  AGENT_PATCH_SHA256: af64091b589c4c21f9a97736d24529ef59a13989c1fa16c4f54efb4b2c940f33

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify canonical bounded A/B request parity
        shell: bash
        run: |
          set -euo pipefail
          REQ="public_benchmark/arc3/kaggle_candidates/flash_next_340/agent_state_ab_request.json"
          jq -e \
            --arg game "$AB_GAME_ID" \
            --argjson runtime "$AB_RUNTIME_SECONDS" \
            --argjson concurrency "$AB_CONCURRENCY" \
            --argjson grace "$AB_TERMINAL_GRACE_SECONDS" \
            --argjson analyzer "$AB_ANALYZER_TIMEOUT" \
            '.schema=="deus/arc3-flash-agent-state-ab-request/1"
             and .operation=="dry_run"
             and .game_id==$game
             and .runtime_seconds==$runtime
             and .concurrency==$concurrency
             and .terminal_grace_seconds==$grace
             and .analyzer_timeout==$analyzer' "$REQ" >/dev/null

      - name: Stage identical builder source for both arms
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public_benchmark/arc3/kaggle_candidates/flash_next_340"
          TMP="$RUNNER_TEMP/flash-matched-ab"
          mkdir -p "$TMP/scripts"
          cp "$ROOT/arc-agi-flash-next-mtp.ipynb" "$TMP/arc-agi-flash-next-mtp.ipynb"
          cp "$ROOT/upstream_build_flash_next_package.py" "$TMP/scripts/build_flash_next_package.py"
          cp "$ROOT/upstream_flash_teardown_patch.py" "$TMP/scripts/flash_teardown_patch.py"
          cp "$ROOT/upstream_flash_agent_state_patch.py" "$TMP/scripts/flash_agent_state_patch.py"
          cp "$ROOT/upstream_audit_flash_output.py" "$TMP/scripts/audit_flash_output.py"
          got="$(sha256sum "$TMP/arc-agi-flash-next-mtp.ipynb" | awk '{print $1}')"
          test "$got" = "$BASE_SOURCE_NOTEBOOK_SHA256"
          got_patch="$(sha256sum "$TMP/scripts/flash_agent_state_patch.py" | awk '{print $1}')"
          test "$got_patch" = "$AGENT_PATCH_SHA256"
          echo "AB_ROOT=$TMP" >> "$GITHUB_ENV"

      - name: Build matched BASE and OVERLAY packages
        shell: bash
        run: |
          set -euo pipefail
          COMMON=(
            --mode preflight
            --max-games 1
            --game-id "$AB_GAME_ID"
            --concurrency "$AB_CONCURRENCY"
            --runtime-seconds "$AB_RUNTIME_SECONDS"
            --terminal-grace-seconds "$AB_TERMINAL_GRACE_SECONDS"
            --analyzer-timeout "$AB_ANALYZER_TIMEOUT"
          )
          python "$AB_ROOT/scripts/build_flash_next_package.py"             --kernel-id deusplaceholder/arc3-flash-base-preflight             --title "arc3 flash base preflight"             "${COMMON[@]}"             --output-dir "$AB_ROOT/build/base"
          python "$AB_ROOT/scripts/build_flash_next_package.py"             --kernel-id deusplaceholder/arc3-flash-agent-state-preflight             --title "arc3 flash agent state preflight"             "${COMMON[@]}"             --agent-state-patch             --output-dir "$AB_ROOT/build/overlay"

      - name: Verify matched contract and emit immutable hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path

          root = Path(os.environ["AB_ROOT"])
          arms = {}
          for name in ("base", "overlay"):
              out = root / "build" / name
              nbs = list(out.glob("*.ipynb"))
              assert len(nbs) == 1, (name, nbs)
              nb_path = nbs[0]
              nb = json.loads(nb_path.read_text(encoding="utf-8"))
              code = "\n".join(
                  "".join(c.get("source", []))
                  for c in nb.get("cells", [])
                  if c.get("cell_type") == "code"
              )
              for i, cell in enumerate(nb.get("cells", [])):
                  if cell.get("cell_type") == "code":
                      compile(
                          "".join(cell.get("source", [])),
                          f"{name}:cell-{i}",
                          "exec",
                          flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT,
                      )
              meta = json.loads((out / "kernel-metadata.json").read_text())
              arms[name] = {
                  "notebook_sha256": hashlib.sha256(nb_path.read_bytes()).hexdigest(),
                  "metadata": meta,
                  "has_agent_state_patch": "FLASH_AGENT_STATE_PATCH" in code,
                  "has_overlay_import": "FLASH_AGENT_OVERLAY_IMPORTED" in code,
                  "settings": {
                      "game_id": os.environ["AB_GAME_ID"],
                      "concurrency": int(os.environ["AB_CONCURRENCY"]),
                      "runtime_seconds": int(os.environ["AB_RUNTIME_SECONDS"]),
                      "terminal_grace_seconds": int(os.environ["AB_TERMINAL_GRACE_SECONDS"]),
                      "analyzer_timeout": int(os.environ["AB_ANALYZER_TIMEOUT"]),
                  },
              }

          comparable_keys = (
              "language", "kernel_type", "is_private", "enable_gpu", "enable_tpu",
              "enable_internet", "dataset_sources", "competition_sources",
              "kernel_sources", "model_sources", "docker_image", "machine_shape",
          )
          checks = {
              "same_builder_source": True,
              "same_game": arms["base"]["settings"]["game_id"] == arms["overlay"]["settings"]["game_id"],
              "same_concurrency": arms["base"]["settings"]["concurrency"] == arms["overlay"]["settings"]["concurrency"],
              "same_runtime": arms["base"]["settings"]["runtime_seconds"] == arms["overlay"]["settings"]["runtime_seconds"],
              "same_terminal_grace": arms["base"]["settings"]["terminal_grace_seconds"] == arms["overlay"]["settings"]["terminal_grace_seconds"],
              "same_analyzer_timeout": arms["base"]["settings"]["analyzer_timeout"] == arms["overlay"]["settings"]["analyzer_timeout"],
              "same_provider_metadata": all(
                  arms["base"]["metadata"].get(k) == arms["overlay"]["metadata"].get(k)
                  for k in comparable_keys
              ),
              "base_overlay_absent": not arms["base"]["has_agent_state_patch"] and not arms["base"]["has_overlay_import"],
              "overlay_present": arms["overlay"]["has_agent_state_patch"] and arms["overlay"]["has_overlay_import"],
              "submission_disabled": True,
          }
          receipt = {
              "schema": "deus/arc3-flash-agent-state-matched-ab-contract/1",
              "arms": {
                  "base": {
                      "notebook_sha256": arms["base"]["notebook_sha256"],
                      "settings": arms["base"]["settings"],
                  },
                  "overlay": {
                      "notebook_sha256": arms["overlay"]["notebook_sha256"],
                      "settings": arms["overlay"]["settings"],
                  },
              },
              "checks": checks,
              "promotion_policy": {
                  "static_contract_can_promote": False,
                  "provider_execution_required": True,
                  "same_model_game_runtime_concurrency_required": True,
                  "overlay_promotes_only_if_bounded_proxy_improves_without_new_failure": True,
                  "submission_quota_allowed": False,
              },
              "truth": {
                  "gpu_model_behavior_verified": False,
                  "kaggle_auth_used": False,
                  "kaggle_kernel_run": False,
                  "competition_submission": False,
                  "submission_quota_spent": False,
                  "candidate_promoted": False,
                  "c8r2_primary_mutated": False,
              },
          }
          Path("flash-agent-state-matched-ab-contract.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          assert all(checks.values()), checks
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: arc3-flash-agent-state-matched-ab-contract
          path: flash-agent-state-matched-ab-contract.json
          if-no-files-found: error

  provider:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'dry_run'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPERATION: ${{ inputs.operation }}
      BASE_KERNEL_REF: ${{ inputs.base_kernel_ref }}
      OVERLAY_KERNEL_REF: ${{ inputs.overlay_kernel_ref }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      SEC_KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      VAR_KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      SEC_KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      VAR_KAGGLE_KEY: ${{ vars.KAGGLE_KEY }}
      SEC_KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      VAR_KAGGLE_API_TOKEN: ${{ vars.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install provider tooling
        run: python -m pip install --disable-pip-version-check --quiet kaggle pyarrow

      - name: Normalize Kaggle machine auth and select arm
        shell: bash
        run: |
          set -euo pipefail
          KAGGLE_USERNAME="${SEC_KAGGLE_USERNAME:-${VAR_KAGGLE_USERNAME:-}}"
          KAGGLE_KEY="${SEC_KAGGLE_KEY:-${VAR_KAGGLE_KEY:-}}"
          KAGGLE_API_TOKEN="${SEC_KAGGLE_API_TOKEN:-${VAR_KAGGLE_API_TOKEN:-}}"
          if [ -z "$KAGGLE_API_TOKEN" ] && { [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; }; then
            echo "Kaggle machine auth absent; fail closed before provider execution." >&2
            exit 4
          fi
          {
            echo "KAGGLE_USERNAME=$KAGGLE_USERNAME"
            echo "KAGGLE_KEY=$KAGGLE_KEY"
            echo "KAGGLE_API_TOKEN=$KAGGLE_API_TOKEN"
          } >> "$GITHUB_ENV"
          kaggle kernels list --mine --page-size 1 >/dev/null

          case "$OPERATION" in
            launch_base|readback_base)
              ARM=base
              KERNEL_REF="$BASE_KERNEL_REF"
              ;;
            launch_overlay|readback_overlay)
              ARM=overlay
              KERNEL_REF="$OVERLAY_KERNEL_REF"
              ;;
            *)
              echo "Unsupported operation: $OPERATION" >&2
              exit 5
              ;;
          esac
          if [[ "$KERNEL_REF" == replace-me/* ]] || [[ ! "$KERNEL_REF" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Concrete authorized kernel ref required." >&2
            exit 6
          fi
          {
            echo "AB_ARM=$ARM"
            echo "AB_KERNEL_REF=$KERNEL_REF"
          } >> "$GITHUB_ENV"

      - name: Stage exact matched builder tree
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public_benchmark/arc3/kaggle_candidates/flash_next_340"
          TMP="$RUNNER_TEMP/flash-provider-ab"
          mkdir -p "$TMP/scripts"
          cp "$ROOT/arc-agi-flash-next-mtp.ipynb" "$TMP/arc-agi-flash-next-mtp.ipynb"
          cp "$ROOT/upstream_build_flash_next_package.py" "$TMP/scripts/build_flash_next_package.py"
          cp "$ROOT/upstream_flash_teardown_patch.py" "$TMP/scripts/flash_teardown_patch.py"
          cp "$ROOT/upstream_flash_agent_state_patch.py" "$TMP/scripts/flash_agent_state_patch.py"
          cp "$ROOT/upstream_audit_flash_output.py" "$TMP/scripts/audit_flash_output.py"
          echo "AB_PROVIDER_ROOT=$TMP" >> "$GITHUB_ENV"

      - name: Build selected provider arm
        shell: bash
        run: |
          set -euo pipefail
          OUT="$AB_PROVIDER_ROOT/build/$AB_ARM"
          EXTRA=()
          if [ "$AB_ARM" = "overlay" ]; then EXTRA+=(--agent-state-patch); fi
          python "$AB_PROVIDER_ROOT/scripts/build_flash_next_package.py"             --kernel-id "$AB_KERNEL_REF"             --mode preflight             --max-games 1             --game-id "$AB_GAME_ID"             --concurrency "$AB_CONCURRENCY"             --runtime-seconds "$AB_RUNTIME_SECONDS"             --terminal-grace-seconds "$AB_TERMINAL_GRACE_SECONDS"             --analyzer-timeout "$AB_ANALYZER_TIMEOUT"             "${EXTRA[@]}"             --output-dir "$OUT"
          echo "AB_PROVIDER_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Launch selected private preflight arm
        if: startsWith(inputs.operation, 'launch_')
        shell: bash
        run: |
          set -euo pipefail
          set +e
          kaggle kernels push -p "$AB_PROVIDER_OUT" -t 30000 > ab-push.stdout 2> ab-push.stderr
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            sed -n '1,120p' ab-push.stderr >&2
            exit "$rc"
          fi
          VERSION="$(python - <<'PY'
          import re
          text=open("ab-push.stdout",errors="replace").read()+"\n"+open("ab-push.stderr",errors="replace").read()
          m=re.search(r"Kernel version\s+(\d+)\s+successfully pushed",text,re.I)
          if not m:
              raise SystemExit("provider did not expose exact pushed version")
          print(m.group(1))
          PY
          )"
          export VERSION
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          nb = next(Path(os.environ["AB_PROVIDER_OUT"]).glob("*.ipynb"))
          receipt = {
              "schema": "deus/arc3-flash-agent-state-matched-ab-launch/1",
              "status": "LAUNCHED_PRIVATE_PREFLIGHT",
              "arm": os.environ["AB_ARM"],
              "kernel_ref": os.environ["AB_KERNEL_REF"],
              "kernel_version": int(os.environ["VERSION"]),
              "notebook_sha256": hashlib.sha256(nb.read_bytes()).hexdigest(),
              "settings": {
                  "game_id": os.environ["AB_GAME_ID"],
                  "concurrency": int(os.environ["AB_CONCURRENCY"]),
                  "runtime_seconds": int(os.environ["AB_RUNTIME_SECONDS"]),
                  "terminal_grace_seconds": int(os.environ["AB_TERMINAL_GRACE_SECONDS"]),
                  "analyzer_timeout": int(os.environ["AB_ANALYZER_TIMEOUT"]),
              },
              "truth": {
                  "kaggle_authenticated": True,
                  "kernel_push": True,
                  "competition_submission": False,
                  "submission_quota_spent": False,
                  "leaderboard_score_observed": False,
                  "candidate_promoted": False,
              },
          }
          Path("flash-agent-state-ab-launch.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Read back exact provider arm and strict-audit output
        if: startsWith(inputs.operation, 'readback_')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$KERNEL_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Readback requires a positive exact kernel version." >&2
            exit 7
          fi
          EXACT="$AB_KERNEL_REF/$KERNEL_VERSION"
          export EXACT
          kaggle kernels status "$EXACT" > ab-status.stdout 2> ab-status.stderr
          if ! grep -Eqi 'complete|completed' ab-status.stdout ab-status.stderr; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          r={
              "schema":"deus/arc3-flash-agent-state-matched-ab-readback/1",
              "status":"PENDING_PROVIDER",
              "arm":os.environ["AB_ARM"],
              "exact_kernel":os.environ["EXACT"],
              "truth":{
                  "kaggle_authenticated":True,
                  "exact_version_queried":True,
                  "kernel_complete":False,
                  "competition_submission":False,
                  "submission_quota_spent":False,
                  "candidate_promoted":False,
              },
          }
          Path("flash-agent-state-ab-readback.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          print(json.dumps(r,indent=2,sort_keys=True))
          PY
            exit 0
          fi

          OUTPUT="$RUNNER_TEMP/flash-ab-output"
          mkdir -p "$OUTPUT"
          kaggle kernels output "$EXACT" -p "$OUTPUT"

          EXTRA=()
          if [ "$AB_ARM" = "overlay" ]; then EXTRA+=(--require-agent-state-patch); fi
          set +e
          python "$AB_PROVIDER_ROOT/scripts/audit_flash_output.py"             --mode preflight             --expected-games 1             --expected-game-id "$AB_GAME_ID"             --expected-concurrency "$AB_CONCURRENCY"             --expected-runtime-seconds "$AB_RUNTIME_SECONDS"             --expected-terminal-grace-seconds "$AB_TERMINAL_GRACE_SECONDS"             --expected-analyzer-timeout "$AB_ANALYZER_TIMEOUT"             --require-runtime-from-ready             --require-clean             "${EXTRA[@]}"             "$OUTPUT" > flash-agent-state-ab-audit.json
          audit_rc=$?
          set -e
          export audit_rc OUTPUT
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          try:
              audit=json.loads(Path("flash-agent-state-ab-audit.json").read_text())
          except Exception:
              audit={"passed":False,"error_type":"AuditReportParseError"}
          passed=os.environ["audit_rc"]=="0" and audit.get("passed") is True
          files=[]
          root=Path(os.environ["OUTPUT"])
          for p in sorted(x for x in root.rglob("*") if x.is_file()):
              files.append({"path":str(p.relative_to(root)),"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
          r={
              "schema":"deus/arc3-flash-agent-state-matched-ab-readback/1",
              "status":"AUDIT_PASS" if passed else "AUDIT_FAIL",
              "arm":os.environ["AB_ARM"],
              "exact_kernel":os.environ["EXACT"],
              "audit":audit,
              "output_manifest":files,
              "truth":{
                  "kaggle_authenticated":True,
                  "exact_version_queried":True,
                  "kernel_complete":True,
                  "exact_output_downloaded":True,
                  "audit_executed":True,
                  "audit_passed":passed,
                  "competition_submission":False,
                  "submission_quota_spent":False,
                  "leaderboard_score_observed":False,
                  "candidate_promoted":False,
              },
          }
          Path("flash-agent-state-ab-readback.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "status":r["status"],
              "arm":r["arm"],
              "exact_kernel":r["exact_kernel"],
              "offline_mean":audit.get("offline_mean"),
              "total_actions":audit.get("total_actions"),
              "submission_quota_spent":False,
          },indent=2))
          if not passed:
              raise SystemExit(8)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-flash-agent-state-matched-ab-provider-receipts
          path: |
            flash-agent-state-ab-launch.json
            flash-agent-state-ab-readback.json
            flash-agent-state-ab-audit.json
            ab-status.stdout
            ab-status.stderr
          if-no-files-found: warn
          retention-days: 30
