name: DIGE S2.4 Source Material + Scalp Coverage Preview

on:
  pull_request:
    paths:
      - '.github/workflows/dige-s2-anatomy-preview.yml'
      - 'experiments/dige-v8-executor-capsule/blender_render_s2.py'
      - 'experiments/dige-v8-executor-capsule/DIGE_S2_TECHNICAL_CONTRACT.json'
      - 'experiments/dige-v8-executor-capsule/build_gnm_head_c28.py'
      - 'experiments/dige-v8-executor-capsule/dige_s2_cycles_gpu_admission.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: dige-s2-anatomy-preview-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  s2-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Stage hash-pinned DiGe source assets from upstream
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          mkdir -p runtime/assets runtime/system_assets runtime/assets/c25_mpfb

          SKINPACK=/tmp/skins01_cc0.zip
          curl -fL --retry 6 --retry-delay 5 https://files2.makehumancommunity.org/asset_packs/skins01/skins01_cc0.zip -o "$SKINPACK"
          echo "7495ab99287053bd19ff1636114e64b608994d9f7437fea6cc75ea387f96dba9  $SKINPACK" | sha256sum -c -
          unzip -p "$SKINPACK" "skins/onlytheghosts_young_eurasian_female/young_eurasian_female_diffuse.png" > runtime/assets/young_eurasian_female_diffuse.png
          echo "e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf  runtime/assets/young_eurasian_female_diffuse.png" | sha256sum -c -
          cp runtime/assets/young_eurasian_female_diffuse.png runtime/assets/c25_mpfb/young_eurasian_female_diffuse.png
          cat > runtime/assets/c25_mpfb/c25_skin.mhmat <<'EOF'
          name c25_mpfb_enhanced_skin
          diffuseColor 1.0 1.0 1.0
          diffuseTexture young_eurasian_female_diffuse.png
          EOF

          SYSPACK=/tmp/makehuman_system_assets_cc0.zip
          curl -fL --retry 6 --retry-delay 5 https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip -o "$SYSPACK"
          echo "b542127a8e25547c7c29c19f2d1d2adb9a664c80396ecd694095dbc8028a0107  $SYSPACK" | sha256sum -c -
          for spec in             "hair/short03/short03.obj:short03.obj"             "hair/short03/short03.mhclo:short03.mhclo"             "hair/short03/short03_diffuse.png:short03_diffuse.png"             "hair/short04/short04.obj:short04.obj"             "hair/short04/short04.mhclo:short04.mhclo"             "hair/short04/short04_diffuse.png:short04_diffuse.png"             "hair/long01/long01.obj:long01.obj"             "hair/long01/long01.mhclo:long01.mhclo"             "hair/long01/long01_diffuse.png:long01_diffuse.png"             "hair/long01/long01.mhmat:long01.mhmat"             "eyes/high-poly/high-poly.obj:high-poly.obj"             "eyes/high-poly/high-poly.mhclo:high-poly.mhclo"             "eyes/materials/brown_eye.png:brown_eye.png"             "eyebrows/eyebrow001/eyebrow001.obj:eyebrow001.obj"             "eyebrows/eyebrow001/eyebrow001.mhclo:eyebrow001.mhclo"             "eyebrows/eyebrow001/eyebrow001.png:eyebrow001.png"             "eyelashes/eyelashes01/eyelashes01.obj:eyelashes01.obj"             "eyelashes/eyelashes01/eyelashes01.mhclo:eyelashes01.mhclo"             "eyelashes/eyelashes01/eyelashes01.png:eyelashes01.png"
          do
            src="${spec%%:*}"; dst="${spec##*:}"
            unzip -p "$SYSPACK" "$src" > "runtime/system_assets/$dst"
          done

          echo "7f1d6dadbdf9e96435251955d6657e77ea5433c9bc7c85a5c5f5e4eae0cb9a8c  runtime/system_assets/long01.obj" | sha256sum -c -
          echo "94ecbebfd834da2cbee2ce90b730972590eb22a252ecd9592038ea736e063646  runtime/system_assets/long01.mhclo" | sha256sum -c -
          echo "e8dc25d90f8f62467e8630420e1240a400d070054fb7c3f1d3f7bf3e457d6c2c  runtime/system_assets/long01_diffuse.png" | sha256sum -c -
          echo "74ec88267e679d316f8037a074511ffc887b27e198ea381d0ae4a3f180f96760  runtime/system_assets/long01.mhmat" | sha256sum -c -
          echo "da2493215b708a344c33dc72f2a9a5b8fa985dcc5a70ad3b208995cf871da8e1  runtime/system_assets/high-poly.obj" | sha256sum -c -
          echo "b183cfe37120ab726f9b3f2ea6cd3a64c44ce7b4bd91a77c841cf70c04f83a0d  runtime/system_assets/high-poly.mhclo" | sha256sum -c -

          MPFB_COMMIT=b58176c661a9680294eb75f127842cb8378e4974
          rm -rf /tmp/mpfb2
          git init /tmp/mpfb2
          git -C /tmp/mpfb2 remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C /tmp/mpfb2 fetch --depth=1 origin "$MPFB_COMMIT"
          git -C /tmp/mpfb2 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/mpfb2 rev-parse HEAD)" = "$MPFB_COMMIT"
          test -s /tmp/mpfb2/src/mpfb/data/node_trees/enhanced_skin.json
          test -s /tmp/mpfb2/src/mpfb/data/node_trees/procedural_eyes.json

      - name: Verify S2 contract, source syntax and frozen assets
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          python -m py_compile blender_render_s2.py build_gnm_head_c28.py dige_s2_cycles_gpu_admission.py
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path("DIGE_S2_TECHNICAL_CONTRACT.json")
          d=json.loads(p.read_text())
          assert d["candidate"]=="DIGE_S2_ANATOMY_DYNAMICS_V1"
          assert d["hard_truth"]["prototype_pixels_in_renderer"] is False
          assert d["hard_truth"]["external_image_generation_calls"]==0
          assert d["hard_truth"]["static_s2_does_not_claim_unexecuted_dynamics"] is True
          assert len(d["preview_gate"])>=8
          print(json.dumps({
            "contract_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "owner_refs":len(d["owner_refs"]),
            "preview_gates":len(d["preview_gate"])
          }))
          PY
          cd runtime/system_assets
          echo "94ecbebfd834da2cbee2ce90b730972590eb22a252ecd9592038ea736e063646  long01.mhclo" | sha256sum -c -
          echo "74ec88267e679d316f8037a074511ffc887b27e198ea381d0ae4a3f180f96760  long01.mhmat" | sha256sum -c -
          echo "7f1d6dadbdf9e96435251955d6657e77ea5433c9bc7c85a5c5f5e4eae0cb9a8c  long01.obj" | sha256sum -c -
          echo "e8dc25d90f8f62467e8630420e1240a400d070054fb7c3f1d3f7bf3e457d6c2c  long01_diffuse.png" | sha256sum -c -

      - name: Pin Google GNM and bind S1 identity seed for S2
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          GNM_COMMIT=a424b5153eec9154f3dfa5ee7f214e5817918d54
          rm -rf /tmp/GNM
          git init /tmp/GNM
          git -C /tmp/GNM remote add origin https://github.com/google/GNM.git
          git -C /tmp/GNM fetch --depth=1 origin "$GNM_COMMIT"
          git -C /tmp/GNM checkout --detach FETCH_HEAD
          test "$(git -C /tmp/GNM rev-parse HEAD)" = "$GNM_COMMIT"
          python -m pip install --disable-pip-version-check -q numpy scipy absl-py etils immutabledict importlib-resources opt-einsum typeguard
          python -m pip install --disable-pip-version-check -q tensorflow
          python -m pip install --disable-pip-version-check -q --no-deps -e /tmp/GNM/gnm/shape
          python - <<'PY'
          import json, pathlib, os
          seed=20263001
          d={"schema":"dige-s2-identity-binding/1","selected":{"seed":seed},"source":"S1_VERIFIED_SELECTOR","truth_boundary":"IDENTITY_CONTINUITY_REUSE_NOT_NEW_SEARCH"}
          pathlib.Path("runtime/s2_identity_selection.json").write_text(json.dumps(d,indent=2)+"\n")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"DIGE_S1_IDENTITY_SEED={seed}\n")
          print(json.dumps(d))
          PY

      - name: Rebind deterministic body geometry
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          python build_makehuman_v8.py | tee runtime/s2_geometry_canon_rebind.json

      - name: Rebuild semantic GNM head for S2
        working-directory: experiments/dige-v8-executor-capsule
        env:
          DIGE_GNM_COMMIT: a424b5153eec9154f3dfa5ee7f214e5817918d54
          DIGE_GNM_IDENTITY_SEED: ${{ env.DIGE_S1_IDENTITY_SEED }}
          DIGE_GNM_IDENTITY_SIGMA: '0.34'
          DIGE_GNM_SEMANTIC_IDENTITY: '1'
        run: |
          set -euxo pipefail
          test -n "$DIGE_GNM_IDENTITY_SEED"
          python build_gnm_head_c28.py | tee runtime/s2_gnm_build.log
          test -s runtime/gnm_c28/DIGE_C28_GNM_HEAD_MANIFEST.json
          python - <<'PY'
          import json, os, pathlib
          sel=json.loads(pathlib.Path("runtime/s2_identity_selection.json").read_text())
          g=json.loads(pathlib.Path("runtime/gnm_c28/DIGE_C28_GNM_HEAD_MANIFEST.json").read_text())
          assert int(g["identity_seed"])==int(sel["selected"]["seed"])
          assert g["identity_source"]=="SEMANTIC_CVAE"
          assert g["semantic_gender"]=="FEMALE"
          assert g["semantic_ethnicity"]=="ASIAN"
          print(json.dumps({"selected_seed":sel["selected"]["seed"],"gnm_identity_source":g["identity_source"]}))
          PY

      - name: Resolve Blender 5.2.2
        run: |
          set -euxo pipefail
          ROOT=https://download.blender.org/release/Blender5.2
          TAR=blender-5.2.2-linux-x64.tar.xz
          curl -fL --retry 4 --retry-delay 3 "$ROOT/$TAR" -o "/tmp/$TAR"
          curl -fL --retry 4 --retry-delay 3 "$ROOT/blender-5.2.2.sha256" -o /tmp/blender.sha256
          grep " $TAR$" /tmp/blender.sha256 > /tmp/blender.expected
          (cd /tmp && sha256sum -c blender.expected)
          tar -xf "/tmp/$TAR" -C /tmp
          echo "BLENDER=/tmp/blender-5.2.2-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Render S2 anatomy-aware preview
        working-directory: experiments/dige-v8-executor-capsule
        env:
          DIGE_CYCLES_DEVICE: CPU
          DIGE_RENDER_SET: FULL
          DIGE_SEARCH_ONLY: '0'
          DIGE_OUTPUT_TAG: s2_4_preview
          DIGE_S1_ENDOGENOUS: '1'
          DIGE_S2_ANATOMY_DYNAMICS: '1'
          DIGE_S2_1_HYPERREAL: '1'
          DIGE_S2_2_SURFACE_INTEGRATION: '1'
          DIGE_S2_3_FACE_REALISM: '1'
          DIGE_S2_4_SOURCE_MATERIAL: '1'
          DIGE_C18_HYBRID_BULK: '1'
          DIGE_C25_MATURE_STACK: '1'
          DIGE_C26_PHOTOMETRIC: '1'
          DIGE_C28_GNM_HEAD: '1'
          DIGE_C28_GNM_DIR: runtime/gnm_c28
          DIGE_C29_GNM_PRESENTATION: '1'
          DIGE_C30_GNM_SEMANTIC_IDENTITY: '1'
          DIGE_C31_GNM_FACE_APPEARANCE: '1'
          DIGE_C32_GNM_DERMAL_HAIR: '1'
          DIGE_C33_GUIDE_GATED_GROOM: '1'
          DIGE_C33_GUIDE_MAX_DIST: '0.021'
          DIGE_C33_SCALP_Z_DROP: '0.120'
          DIGE_C36_CANONICAL_APPEARANCE: '1'
          DIGE_C39_HHIR_HYPERREAL: '1'
          DIGE_C40_HYPERREAL_REPAIR: '0'
          DIGE_C41_HYPERREAL_NATIVE_EYE: '1'
          DIGE_C42_GEOMETRY_EYE_HAIRLINE: '1'
          DIGE_C43_TANGENTIAL_GROOM: '1'
          DIGE_C44_FOLLICLE_FLOW: '1'
          DIGE_C28_HEAD_SCALE_BIAS: '1.00'
          DIGE_C36_JAW_TAPER: '0.82'
          DIGE_C36_EYE_OPEN_SCALE: '0.84'
          DIGE_C36_EYE_GLOBE_SCALE: '0.90'
          DIGE_C36_HAIR_LENGTH_M: '0.28'
          DIGE_C36_HAIR_WAVE: '0.004'
          DIGE_GNM_COMMIT: a424b5153eec9154f3dfa5ee7f214e5817918d54
          DIGE_GNM_SEMANTIC_IDENTITY: '1'
          DIGE_GNM_IDENTITY_SEED: ${{ env.DIGE_S1_IDENTITY_SEED }}
          DIGE_MPFB2_SRC: /tmp/mpfb2/src
          DIGE_MPFB2_COMMIT: b58176c661a9680294eb75f127842cb8378e4974
          DIGE_C25_MHMAT_PATH: runtime/assets/c25_mpfb/c25_skin.mhmat
          DIGE_HAIR_ASSET_KEY: hair_short03
          DIGE_HAIR_STRANDS_PER_ROOT: '4'
          DIGE_HAIR_ACCENT_LENGTH_SCALE: '0.68'
          DIGE_HAIR_FRONT_SAFE_BLEND: '0.88'
          DIGE_SKIN_ALBEDO_PATH: runtime/assets/young_eurasian_female_diffuse.png
          DIGE_SKIN_ALBEDO_SHA256: e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf
          DIGE_SKIN_ALBEDO_NAME: onlytheghosts_young_eurasian_female
          DIGE_SKIN_SSS_WEIGHT: '0.075'
          DIGE_SKIN_SSS_SCALE: '0.0010'
          DIGE_SKIN_ROUGH_MIN: '0.42'
          DIGE_SKIN_ROUGH_MAX: '0.62'
          DIGE_SKIN_MICRO_STRENGTH: '0.30'
          DIGE_SKIN_MESO_FREQ: '95.0'
          DIGE_SKIN_PORE_FREQ: '1800.0'
          DIGE_SKIN_MICRO_FREQ: '6200.0'
          DIGE_SKIN_BUMP_DISTANCE: '0.000055'
          DIGE_SKIN_ALBEDO_SAT: '0.88'
          DIGE_SKIN_ALBEDO_VALUE: '0.80'
          DIGE_SAMPLES_PREVIEW: '48'
          DIGE_SAMPLES_HERO: '128'
          DIGE_RENDER_SEED: '20260922'
          DIGE_RUNTIME_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          START=$(date +%s)
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python blender_render_s2.py | tee runtime/s2_preview.log
          END=$(date +%s)
          printf '{"wall_seconds":%s}\n' "$((END-START))" > runtime/s2_preview_timing.json

      - name: Verify S2 typed receipt and truth boundary
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("runtime/renders/s2_4_preview")
          r=json.loads((root/"DIGE_V8_RENDER_RECEIPT.json").read_text())
          t=json.loads(pathlib.Path("runtime/s2_preview_timing.json").read_text())
          assert r["device"]=="CPU"
          assert r["render_set"]=="FULL"
          assert r["appearance_candidate"]=="DIGE_S2_4_SOURCE_MATERIAL_SCALP_COVERAGE_V1"
          a=r["appearance_selection"]
          assert a["s2_anatomy_dynamics"] is True
          anat=a["s2_anatomy_metrics"]
          assert anat["enabled"] is True and anat["vertices_touched"]>0
          assert anat["max_offset_m"]<0.012
          expected={"01_FRONT50","02_LEFT_PROFILE50","03_THREE_QUARTER50","04_HERO85","05_BACK_THREE_QUARTER50","06_BACK50"}
          assert {x["view"] for x in r["outputs"]}==expected
          hero=[x for x in r["outputs"] if x["view"]=="04_HERO85"][0]
          assert hero["lens_mm"]==85 and abs(hero["fstop"]-2.8)<1e-6
          g=a["c41_groom_metrics"]
          assert g["enabled"] is True
          assert g["undercoat_lane_count"]==5
          assert g["bun_curves"]>=1000
          assert g["s1_face_frame_curves"]>0
          eye=r["c28_gnm_head"]["eye_contract"]
          assert eye["integration"]=="GNM_NATIVE_EYEBALL_MESH_GENERATED_COORD_IRIS_NO_UV_NO_OVERLAY"
          assert eye["material_model"]=="S2_3_NATIVE_GNM_GENERATED_COORD_EYE"
          assert eye["pupil_radius_norm"]<=0.060 and eye["iris_outer_radius_norm"]<=0.205
          skin=r["c28_gnm_head"]["skin_contract"]
          assert skin["model"]=="S2_4_GNM_INTERPOLATED_SOURCE_ALBEDO_SKIN"
          assert skin["pore_scale"]>=2200 and skin["micro_scale"]>=8200
          assert skin["source_uv_transfer"]=="POLYINTERP_NEAREST" and skin["source_uv_loops"]>0
          assert skin["source_albedo"]["enabled"] is True
          surf=a["s2_2_surface_metrics"]
          assert surf["enabled"] is True and surf["vertices"]>=400 and surf["faces"]>=300
          assert a["s2_2_surface_integration"] is True
          assert a["s2_3_face_realism"] is True
          assert a["s2_4_source_material"] is True
          assert a["hair_asset_key"]=="hair_short03"
          assert r["hair_surface_contract"]["mass_mesh_rendered"] is True
          garments=a["s1_garment_metrics"]
          assert garments["enabled"] is True
          assert garments["tank_polygons"]>0 and garments["leggings_polygons"]>0
          assert garments["source"]=="S2_ANATOMY_AWARE_OFFSET_BODY_SURFACE_SHELL"
          assert garments["s2_4_material_undercoat_faces"]["tank"]>0
          assert garments["s2_4_material_undercoat_faces"]["leggings"]>0
          ctl=a["s2_control_contract"]
          assert "NOT_EXECUTED" in ctl["hand_chain"]
          assert "NOT_EXECUTED" in ctl["tmj_jaw"]
          p=r["provenance"]
          assert p["reference_pixels_read_by_renderer"] is False
          assert p["reference_images_composited"] is False
          assert p["image_model_calls"]==0
          assert p["renderer_network_calls"]==0
          summary={
            "schema":"dige-s2-4-preview-runtime-receipt/1",
            "candidate":r["appearance_candidate"],
            "wall_seconds":t["wall_seconds"],
            "outputs":r["outputs"],
            "anatomy":anat,
            "groom":g,
            "eye_contract":eye,
            "skin_contract":skin,
            "garments":garments,
            "surface_integration":surf,
            "control_contract":ctl,
            "provenance":p,
            "truth_boundary":"STATIC_S2_4_SOURCE_MATERIAL_CPU_PASS_ONLY__LOCAL_CYCLES_GPU_ADMISSION_REQUIRES_SEPARATE_OWNER_WORKSTATION_RECEIPT__DIRECT_VISUAL_AUDIT_REQUIRED"
          }
          (root/"DIGE_S2_PREVIEW_SUMMARY.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DIGE-S2-4-PREVIEW-${{ github.event.pull_request.head.sha }}
          path: |
            experiments/dige-v8-executor-capsule/runtime/renders/s2_4_preview/*.png
            experiments/dige-v8-executor-capsule/runtime/renders/s2_4_preview/*.exr
            experiments/dige-v8-executor-capsule/runtime/renders/s2_4_preview/*.json
            experiments/dige-v8-executor-capsule/runtime/renders/s2_4_preview/*.blend
            experiments/dige-v8-executor-capsule/runtime/s2_preview.log
            experiments/dige-v8-executor-capsule/runtime/s2_preview_timing.json
            experiments/dige-v8-executor-capsule/runtime/s2_identity_selection.json
            experiments/dige-v8-executor-capsule/runtime/s2_gnm_build.log
            experiments/dige-v8-executor-capsule/runtime/gnm_c28/*.json
          if-no-files-found: error
          retention-days: 30
