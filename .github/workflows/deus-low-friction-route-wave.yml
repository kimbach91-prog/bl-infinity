name: DEUS Low-Friction Route Wave

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-low-friction-route-wave.yml'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deus-low-friction-route-wave
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  low-friction-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe no-account routes and emit one typed receipt
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/deus-wave
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          probe_chat() {
            name="$1"; url="$2"; model="$3"; token="$4"; timeout="$5"
            req="/tmp/deus-wave/$name.req.json"
            resp="/tmp/deus-wave/$name.json"
            codefile="/tmp/deus-wave/$name.code"
            jq -n --arg model "$model" --arg token "$token" '{model:$model,messages:[{role:"user",content:("Public S0 canary. Reply with exactly: "+$token)}],temperature:0}' > "$req"
            start="$(date +%s%3N)"
            curl --max-time "$timeout" -sS -o "$resp" -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' --data-binary @"$req" > "$codefile" || true
            latency="$(( $(date +%s%3N) - start ))"
            code="$(cat "$codefile" 2>/dev/null || echo 0)"
            exact=false
            if [ "$code" = "200" ] && grep -Fq "$token" "$resp" 2>/dev/null; then exact=true; fi
            digest="$(sha256sum "$resp" 2>/dev/null | awk '{print $1}' || true)"
            jq -n --arg provider "$name" --arg endpoint "$url" --arg requested_model "$model" --arg status "$code" --arg digest "$digest" --argjson latency "$latency" --argjson exact "$exact"               '{provider:$provider,endpoint:$endpoint,requested_model:$requested_model,http_status:($status|tonumber),latency_ms:$latency,exact_contract:$exact,response_digest:$digest,auth_mode:"NO_AUTH_HEADER",provider_execution:($status=="200"),canonical_write:false,settlement:false}'
          }

          probe_chat_bearer() {
            name="$1"; url="$2"; model="$3"; token="$4"; bearer="$5"; timeout="$6"
            req="/tmp/deus-wave/$name.req.json"
            resp="/tmp/deus-wave/$name.json"
            codefile="/tmp/deus-wave/$name.code"
            jq -n --arg model "$model" --arg token "$token" '{model:$model,messages:[{role:"user",content:("Public S0 canary. Reply with exactly: "+$token)}],temperature:0}' > "$req"
            start="$(date +%s%3N)"
            curl --max-time "$timeout" -sS -o "$resp" -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' -H "authorization: Bearer $bearer" --data-binary @"$req" > "$codefile" || true
            latency="$(( $(date +%s%3N) - start ))"
            code="$(cat "$codefile" 2>/dev/null || echo 0)"
            exact=false
            if [ "$code" = "200" ] && grep -Fq "$token" "$resp" 2>/dev/null; then exact=true; fi
            digest="$(sha256sum "$resp" 2>/dev/null | awk '{print $1}' || true)"
            jq -n --arg provider "$name" --arg endpoint "$url" --arg requested_model "$model" --arg status "$code" --arg digest "$digest" --argjson latency "$latency" --argjson exact "$exact" '{provider:$provider,endpoint:$endpoint,requested_model:$requested_model,http_status:($status|tonumber),latency_ms:$latency,exact_contract:$exact,response_digest:$digest,auth_mode:"PUBLIC_ANY_BEARER",provider_execution:($status=="200"),canonical_write:false,settlement:false}'
          }

          probe_pollinations_legacy() {
            token="DEUS_POLLINATIONS_WAVE_OK"
            prompt="$(python - <<'PY'
import urllib.parse
print(urllib.parse.quote("Public S0 canary. Reply with exactly: DEUS_POLLINATIONS_WAVE_OK", safe=""))
PY
)"
            url="https://text.pollinations.ai/$prompt?model=openai&seed=42"
            resp="/tmp/deus-wave/pollinations.json"
            codefile="/tmp/deus-wave/pollinations.code"
            start="$(date +%s%3N)"
            curl --max-time 60 -L -sS -o "$resp" -w '%{http_code}' "$url" > "$codefile" || true
            latency="$(( $(date +%s%3N) - start ))"
            code="$(cat "$codefile" 2>/dev/null || echo 0)"
            exact=false
            if [ "$code" = "200" ] && grep -Fq "$token" "$resp" 2>/dev/null; then exact=true; fi
            digest="$(sha256sum "$resp" 2>/dev/null | awk '{print $1}' || true)"
            jq -n --arg provider "POLLINATIONS_LEGACY" --arg endpoint "https://text.pollinations.ai/{prompt}" --arg status "$code" --arg digest "$digest" --argjson latency "$latency" --argjson exact "$exact" '{provider:$provider,endpoint:$endpoint,http_status:($status|tonumber),latency_ms:$latency,exact_contract:$exact,response_digest:$digest,auth_mode:"NO_AUTH_LEGACY_PROBE",provider_execution:($status=="200"),canonical_write:false,settlement:false}'
          }

          probe_chat_bearer "PERSORAI" "https://persorai.com/v1/chat/completions" "@cf/zai-org/glm-5.2" "DEUS_PERSORAI_WAVE_OK" "deus-public-canary" 60 > /tmp/deus-wave/persorai.receipt.json
          probe_pollinations_legacy > /tmp/deus-wave/pollinations.receipt.json

          probe_chat "LLM7" "https://api.llm7.io/v1/chat/completions" "default" "DEUS_LLM7_WAVE_OK" 60 > /tmp/deus-wave/llm7.receipt.json
          probe_chat "BLOCKRUN" "https://blockrun.ai/api/v1/chat/completions" "nvidia/nemotron-3.5-lightning" "DEUS_BLOCKRUN_WAVE_OK" 90 > /tmp/deus-wave/blockrun.receipt.json
          probe_chat "VIREONIX" "https://vireonix.ai/v1/chat/completions" "auto" "DEUS_VIREONIX_WAVE_OK" 90 > /tmp/deus-wave/vireonix.receipt.json
          probe_chat "ANIMICA" "https://animica.dev/v1/chat/completions" "kimi-k3" "DEUS_ANIMICA_WAVE_OK" 90 > /tmp/deus-wave/animica.receipt.json
          probe_chat "WIKIMEDIA_LIFTWING" "https://api.wikimedia.org/service/lw/inference/v1/models/llm-qwen3-14b/openai/v1/chat/completions" "llm-qwen3-14b" "DEUS_WIKIMEDIA_WAVE_OK" 120 > /tmp/deus-wave/wikimedia.receipt.json

          horde_heartbeat=false; horde_status=0; horde_exact=false; horde_model=""
          if curl --max-time 10 -fsS 'https://oai.aihorde.net/heartbeat' -o /tmp/deus-wave/horde-heartbeat.json; then
            if jq -e '.message=="OK"' /tmp/deus-wave/horde-heartbeat.json >/dev/null 2>&1; then horde_heartbeat=true; fi
          fi
          if [ "$horde_heartbeat" = "true" ] && curl --max-time 15 -fsS 'https://oai.aihorde.net/v1/models' -o /tmp/deus-wave/horde-models.json; then
            horde_model="$(jq -r '[.data[] | select(.known_to_horde==true and .worker_threads>0 and .size>0)] | sort_by(.size) | .[0].id // empty' /tmp/deus-wave/horde-models.json)"
            if [ -n "$horde_model" ]; then
              jq -n --arg model "$horde_model" '{model:$model,input:"Reply with exactly: DEUS_HORDE_WAVE_OK",max_tokens:16,temperature:0,timeout:60}' > /tmp/deus-wave/horde-request.json
              curl --max-time 90 -sS -o /tmp/deus-wave/horde.json -w '%{http_code}' -H 'authorization: Bearer 0000000000' -H 'content-type: application/json' --data-binary @/tmp/deus-wave/horde-request.json 'https://oai.aihorde.net/v1/responses' > /tmp/deus-wave/horde.code || true
              horde_status="$(cat /tmp/deus-wave/horde.code 2>/dev/null || echo 0)"
              if [ "$horde_status" = "200" ] && grep -Fq 'DEUS_HORDE_WAVE_OK' /tmp/deus-wave/horde.json 2>/dev/null; then horde_exact=true; fi
            fi
          fi
          horde_digest="$(sha256sum /tmp/deus-wave/horde.json 2>/dev/null | awk '{print $1}' || true)"
          jq -n --argjson heartbeat "$horde_heartbeat" --arg status "$horde_status" --argjson exact "$horde_exact" --arg model "$horde_model" --arg digest "$horde_digest"             '{provider:"AI_HORDE",heartbeat:$heartbeat,http_status:($status|tonumber),exact_contract:$exact,model:$model,digest:$digest,auth_mode:"ANONYMOUS_PUBLIC_KEY",canonical_write:false,settlement:false}' > /tmp/deus-wave/horde.receipt.json

          akash_status=0; akash_count=0
          curl --max-time 60 -sS -o /tmp/deus-wave/akash.json -w '%{http_code}' 'https://console-api.akash.network/v1/providers' > /tmp/deus-wave/akash.code || true
          akash_status="$(cat /tmp/deus-wave/akash.code 2>/dev/null || echo 0)"
          if [ "$akash_status" = "200" ]; then
            akash_count="$(jq 'if type=="array" then length elif .providers then (.providers|length) else 0 end' /tmp/deus-wave/akash.json 2>/dev/null || echo 0)"
          fi
          akash_digest="$(sha256sum /tmp/deus-wave/akash.json 2>/dev/null | awk '{print $1}' || true)"
          jq -n --arg status "$akash_status" --argjson count "$akash_count" --arg digest "$akash_digest"             '{provider:"AKASH_NETWORK_DATA",http_status:($status|tonumber),provider_records:$count,digest:$digest,auth_mode:"NONE",workload_execution:false,canonical_write:false,settlement:false}' > /tmp/deus-wave/akash.receipt.json

          peerwave_dns=false
          if getent hosts api.peerwave.ai >/tmp/deus-wave/peerwave-dns.txt 2>/dev/null; then peerwave_dns=true; fi
          jq -n --argjson dns "$peerwave_dns" '{provider:"PEERWAVE",dns_resolves:$dns,provider_execution:false}' > /tmp/deus-wave/peerwave.receipt.json

          antseed_proxy=false; antseed_models=0; antseed_version=""
          export ANTSEED_DATA_DIR="$RUNNER_TEMP/antseed-wave"
          mkdir -p "$ANTSEED_DATA_DIR"
          if npm install -g @antseed/cli >/tmp/deus-wave/antseed-install.log 2>&1; then
            antseed_version="$(antseed --version 2>/dev/null | tail -n 1 | tr -d '\r')"
            antseed --data-dir "$ANTSEED_DATA_DIR" buyer start --router local >/tmp/deus-wave/antseed.log 2>&1 &
            apid=$!
            for i in $(seq 1 25); do
              if curl --max-time 3 -fsS http://127.0.0.1:8377/v1/models -o /tmp/deus-wave/antseed-models.json; then
                antseed_proxy=true
                antseed_models="$(jq '.data|length' /tmp/deus-wave/antseed-models.json 2>/dev/null || echo 0)"
                break
              fi
              sleep 2
            done
            kill "$apid" 2>/dev/null || true
          fi
          antseed_digest="$(sha256sum /tmp/deus-wave/antseed-models.json 2>/dev/null | awk '{print $1}' || true)"
          jq -n --arg version "$antseed_version" --argjson proxy "$antseed_proxy" --argjson count "$antseed_models" --arg digest "$antseed_digest"             '{provider:"ANTSEED",cli_version:$version,buyer_proxy_live:$proxy,model_count:$count,digest:$digest,auth_mode:"NO_CENTRAL_ACCOUNT_EPHEMERAL_NODE_IDENTITY",payment_deposit:false,paid_inference:false,seller_registration:false,stake:false,canonical_write:false}' > /tmp/deus-wave/antseed.receipt.json

          jq -n             --arg timestamp "$now"             --slurpfile llm7 /tmp/deus-wave/llm7.receipt.json             --slurpfile blockrun /tmp/deus-wave/blockrun.receipt.json             --slurpfile wikimedia /tmp/deus-wave/wikimedia.receipt.json             --slurpfile vireonix /tmp/deus-wave/vireonix.receipt.json             --slurpfile animica /tmp/deus-wave/animica.receipt.json             --slurpfile horde /tmp/deus-wave/horde.receipt.json             --slurpfile akash /tmp/deus-wave/akash.receipt.json             --slurpfile peerwave /tmp/deus-wave/peerwave.receipt.json             --slurpfile antseed /tmp/deus-wave/antseed.receipt.json             --slurpfile persorai /tmp/deus-wave/persorai.receipt.json             --slurpfile pollinations /tmp/deus-wave/pollinations.receipt.json             '{receipt_version:"DEUS-LOW-FRICTION-ROUTE-WAVE/3",timestamp:$timestamp,constraints:{account_creation:false,deposit:false,paid_inference:false,seller_registration:false,stake:false,canonical_write:false,data_class:"S0_SYNTHETIC_OR_PUBLIC_DISCOVERY_ONLY"},routes:{llm7:$llm7[0],blockrun:$blockrun[0],wikimedia:$wikimedia[0],vireonix:$vireonix[0],animica:$animica[0],ai_horde:$horde[0],akash:$akash[0],peerwave:$peerwave[0],antseed:$antseed[0],persorai:$persorai[0],pollinations_legacy:$pollinations[0]}}' | tee /tmp/deus-wave/receipt.json

          echo "DEUS Low-Friction Route Wave v3" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/deus-wave/receipt.json >> "$GITHUB_STEP_SUMMARY"
          jq -e '.receipt_version=="DEUS-LOW-FRICTION-ROUTE-WAVE/3" and .routes.llm7 and .routes.blockrun and .routes.wikimedia and .routes.antseed' /tmp/deus-wave/receipt.json >/dev/null
