name: ARC3 fallback lp85 temporal-context p5-p9 replay
on:
  push:
    branches: [deus/r278-object-region-phase-diagnostic-20260923]
    paths:
      - .github/workflows/arc3-fallback-lp85-temporal-context-p5p9-replay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 32}
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage exact lp85 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p train replay
          for p in $(seq 0 4); do f="lp85-305b61c3_p${p}_events.jsonl"; cp "upstream-duck/example-run/artifacts/$f" "train/$f"; done
          for p in $(seq 5 9); do f="lp85-305b61c3_p${p}_events.jsonl"; cp "upstream-duck/example-run/artifacts/$f" "replay/$f"; done
          test "$(find train -type f -name '*_events.jsonl' | wc -l)" -eq 5
          test "$(find replay -type f -name '*_events.jsonl' | wc -l)" -eq 5
          ! find train replay -type f -regex '.*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum train/*.jsonl replay/*.jsonl > TRACE_SHA256SUMS.txt
      - name: Execute frozen p5-p9 replay
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_lp85_temporal_context_p5p9_replay_fallback.py
          trainargs=(); for f in $(find train -type f -name '*_events.jsonl' | sort -V); do trainargs+=(--train "$f"); done
          replayargs=(); for f in $(find replay -type f -name '*_events.jsonl' | sort -V); do replayargs+=(--replay "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_lp85_temporal_context_p5p9_replay_fallback.py "${trainargs[@]}" "${replayargs[@]}" --output replay.json 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('replay.json'))
          assert d['schema']=='deus/arc3-lp85-temporal-context-p5p9-replay-fallback/1'
          assert d['frozen_mechanism']['context']=='ACTION_REGION4'
          assert d['frozen_mechanism']['history']=='H3_STABLE_PERIOD_VELOCITY'
          assert d['frozen_mechanism']['selection_changed_after_replay_read'] is False
          assert d['protocol']['train']=='p0-p4' and d['protocol']['replay']=='p5-p9'
          assert d['protocol']['p10_p19_staged_or_read'] is False
          assert d['truth']['p10_p19_read'] is False
          assert d['truth']['independent_generalization'] is False
          assert d['truth']['competition_submission'] is False
          print(json.dumps({'verdict':d['verdict'],'replay_total':d['replay_total']},sort_keys=True))
          PY
          sha256sum replay.json runtime.txt stdout.txt TRACE_SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fallback-lp85-temporal-context-p5p9-replay
          path: |
            replay.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
            TRACE_SHA256SUMS.txt
          retention-days: 30
