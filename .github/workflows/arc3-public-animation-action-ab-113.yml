name: ARC3 public animation action A/B 113

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - 'public_benchmark/arc3/kaggle_candidates/public_animation_action_ab.py'
      - '.github/workflows/arc3-public-animation-action-ab-113.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-action-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned official ARC toolkit
        run: pip install --disable-pip-version-check 'arc-agi==0.9.9'

      - name: Compile solver-behavior A/B
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_multiframe_probe.py \
            public_benchmark/arc3/kaggle_candidates/animation_delta_signature.py \
            public_benchmark/arc3/kaggle_candidates/adaptive_lossless_behavior_ab_v3_identity.py \
            public_benchmark/arc3/kaggle_candidates/public_animation_action_ab.py

      - name: Execute exact-model public action A/B
        shell: bash
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_animation_action_ab.py \
            --receipt "$GITHUB_WORKSPACE/public-animation-action-ab.json"

      - name: Enforce public-development truth and promotion boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s public-animation-action-ab.json
          sha256sum public-animation-action-ab.json > RECEIPT_SHA256SUMS.txt
          jq -e '
            .schema=="deus/arc3-public-animation-action-ab/1"
            and .truth.public_development_environment_only==true
            and .truth.fixed_probe_actions==true
            and .truth.exact_final_frame_identical_between_arms==true
            and .truth.animation_metadata_additive_only==true
            and .truth.promotion_requires_immediate_level_gain==true
            and .truth.board_motion_alone_cannot_promote==true
            and .truth.provider_model_identity_verified==true
            and .truth.game_source_read==false
            and .truth.hidden_state_read==false
            and .truth.kaggle_data_read==false
            and .truth.kaggle_execution==false
            and .truth.kaggle_submission_attempted==false
            and .truth.submission_quota_spent==false
            and .truth.owner_score_claim==false
            and .truth.independent_generalization_claim==false
          ' public-animation-action-ab.json >/dev/null
          jq '{summary,promotion_gate,truth}' public-animation-action-ab.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload behavior receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-animation-action-ab-113
          path: |
            public-animation-action-ab.json
            RECEIPT_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on inconclusive behavior execution
        shell: bash
        run: |
          gate="$(jq -r '.promotion_gate' public-animation-action-ab.json)"
          case "$gate" in
            INCONCLUSIVE_*) exit 2 ;;
            *) exit 0 ;;
          esac
