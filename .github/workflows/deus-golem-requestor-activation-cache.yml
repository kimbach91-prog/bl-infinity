name: DEUS Golem Requestor Activation Cache

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deus-golem-requestor-activation-cache
  cancel-in-progress: false

jobs:
  activation-cache:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event.issue.number == 182 &&
        github.actor == 'kimbach91-prog' &&
        contains(github.event.comment.body, '"schema": "deus-golem-activation-probe/1"')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Mark resolve stage
        run: echo "RESOLVE_OFFICIAL_RELEASE" > /tmp/deus-golem-activation-stage.txt

      - name: Resolve current official requestor installer and release artifact
        id: release
        shell: bash
        run: |
          set -euo pipefail
          installer_url='https://join.golem.network/as-requestor'
          curl -fsSL "$installer_url" -o /tmp/golem-as-requestor.sh
          installer_sha="$(sha256sum /tmp/golem-as-requestor.sh | awk '{print $1}')"

          variant_line="$(grep -m1 '^YA_INSTALLER_VARIANT=' /tmp/golem-as-requestor.sh || true)"
          core_line="$(grep -m1 '^YA_INSTALLER_CORE=' /tmp/golem-as-requestor.sh || true)"
          core_url_line="$(grep -F -m1 'golem-${_variant}-${_ostype}-${YA_INSTALLER_CORE}.tar.gz' /tmp/golem-as-requestor.sh || true)"

          echo "DEUS_RESOLVE_VARIANT_LINE=$variant_line"
          echo "DEUS_RESOLVE_CORE_LINE=$core_line"
          echo "DEUS_RESOLVE_CORE_URL_LINE=$core_url_line"
          echo "DEUS_RESOLVE_INSTALLER_SHA=$installer_sha"

          variant="$(printf '%s\n' "$variant_line" | sed -E 's/^YA_INSTALLER_VARIANT="\$\{YA_INSTALLER_VARIANT:-([^}]*)\}"$/\1/')"
          test "$variant" = 'requestor'
          test -n "$core_line"
          tag="$(printf '%s\n' "$core_line" | sed -E 's/^YA_INSTALLER_CORE="\$\{YA_INSTALLER_CORE:-([^}]*)\}"$/\1/')"
          test -n "$tag"
          test "$tag" != "$core_line"

          asset_url="$(CORE_URL_LINE="$core_url_line" VARIANT="$variant" TAG="$tag" python3 - <<'PY'
import os, re
line = os.environ["CORE_URL_LINE"]
m = re.search(r'_url="([^"]+)"', line)
if not m:
    raise SystemExit("official requestor asset URL template not found")
url = m.group(1)
url = (url
       .replace('${_variant}', os.environ["VARIANT"])
       .replace('${_ostype}', 'linux')
       .replace('${YA_INSTALLER_CORE}', os.environ["TAG"]))
print(url)
PY
          )"
          case "$asset_url" in
            https://golem-releases.cdn.golem.network/yagna/golem-requestor-linux-*.tar.gz) ;;
            *) echo "unexpected official asset URL: $asset_url" >&2; exit 1 ;;
          esac

          version="${tag#v}"
          if dpkg --compare-versions "$version" ge '0.17.4'; then
            hoodi_supported=true
          else
            hoodi_supported=false
          fi
          echo "DEUS_RESOLVE_TAG=$tag"
          echo "DEUS_RESOLVE_ASSET_URL=$asset_url"
          echo "DEUS_RESOLVE_HOODI_SUPPORTED=$hoodi_supported"
          asset="${asset_url##*/}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"
          echo "asset_id=installer-derived-${tag}" >> "$GITHUB_OUTPUT"
          echo "installer_sha256=$installer_sha" >> "$GITHUB_OUTPUT"
          echo "hoodi_supported=$hoodi_supported" >> "$GITHUB_OUTPUT"
          echo "cache_key=golem-requestor-linux-${tag}-${installer_sha}" >> "$GITHUB_OUTPUT"

      - name: Restore activation artifact cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/deus-golem-requestor
          key: ${{ runner.os }}-${{ steps.release.outputs.cache_key }}

      - name: Mark artifact stage
        run: echo "CACHE_OFFICIAL_REQUESTOR_ARTIFACT" > /tmp/deus-golem-activation-stage.txt

      - name: Fetch official requestor artifact on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          ASSET_URL: ${{ steps.release.outputs.asset_url }}
        run: |
          set -euo pipefail
          dir="$HOME/.cache/deus-golem-requestor/$TAG"
          mkdir -p "$dir"
          curl -fL --retry 3 --retry-delay 2 "$ASSET_URL" -o "$dir/$ASSET"
          sha256sum "$dir/$ASSET" | tee "$dir/SHA256SUMS"
          tar -tzf "$dir/$ASSET" > "$dir/CONTENTS.txt"
          grep -Eq '(^|/)yagna$' "$dir/CONTENTS.txt"
          cat > "$dir/ACTIVATION-METADATA.json" <<JSON
          {
            "schema": "deus-golem-activation-artifact/1",
            "tag": "$TAG",
            "asset": "$ASSET",
            "source": "golem-releases.cdn.golem.network/yagna",
            "tos_accepted": false,
            "installed": false,
            "executed": false
          }
          JSON

      - name: Verify cached artifact without executing Yagna
        id: verify
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          dir="$HOME/.cache/deus-golem-requestor/$TAG"
          test -f "$dir/$ASSET"
          test -f "$dir/SHA256SUMS"
          test -f "$dir/CONTENTS.txt"
          test -f "$dir/ACTIVATION-METADATA.json"
          sha256sum -c "$dir/SHA256SUMS"
          grep -Eq '(^|/)yagna$' "$dir/CONTENTS.txt"
          grep -q '"tos_accepted": false' "$dir/ACTIVATION-METADATA.json"
          grep -q '"executed": false' "$dir/ACTIVATION-METADATA.json"
          sha="$(sha256sum "$dir/$ASSET" | awk '{print $1}')"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Post activation cache receipt
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
          ASSET_ID: ${{ steps.release.outputs.asset_id }}
          INSTALLER_SHA256: ${{ steps.release.outputs.installer_sha256 }}
          HOODI_SUPPORTED: ${{ steps.release.outputs.hoodi_supported }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
        with:
          script: |
            const cacheHit = String(process.env.CACHE_HIT || "false") === "true";
            const hoodiSupported = String(process.env.HOODI_SUPPORTED || "false") === "true";
            const payload = {
              schema: "deus-domain-activation-receipt/1",
              domain: "GOLEM_REQUESTOR_ARTIFACT",
              state: cacheHit ? "WARM_ACTIVATION_ARTIFACT_REUSED" : "COLD_ACTIVATION_ARTIFACT_FETCHED",
              github_run_id: context.runId,
              tag: process.env.TAG,
              version: process.env.VERSION,
              asset: process.env.ASSET,
              asset_id: process.env.ASSET_ID,
              installer_sha256: process.env.INSTALLER_SHA256,
              sha256: process.env.SHA256,
              cache_hit: cacheHit,
              source: "join.golem.network/as-requestor + installer-derived golem-releases.cdn.golem.network/yagna artifact",
              minimum_hoodi_version_satisfied: hoodiSupported,
              tos_accepted: false,
              yagna_executed: false,
              provider_contacted: false,
              capacity_credit: 0,
              economic_yield_proven: false,
              next_gate: hoodiSupported
                ? "explicit owner Golem TOS acceptance before install/run/network-provider canary"
                : "current official installer artifact is cached but below documented Hoodi minimum; keep Hoodi execution HOLD until official compatible source is proven",
              truth_boundary: "ARTIFACT_CACHED != TOS_ACCEPTED != YAGNA_RUNNING != PROVIDER_EXECUTED"
            };
            const issue = context.payload.issue?.number || 182;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue,
              body: "```json\n" + JSON.stringify(payload, null, 2) + "\n```"
            });

      - name: Post bounded activation blocker
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const stage = fs.existsSync("/tmp/deus-golem-activation-stage.txt")
              ? fs.readFileSync("/tmp/deus-golem-activation-stage.txt","utf8").trim()
              : "UNKNOWN_STAGE";
            const issue = context.payload.issue?.number || 182;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue,
              body: "```json\n" + JSON.stringify({
                schema: "deus-domain-activation-blocker/1",
                domain: "GOLEM_REQUESTOR_ARTIFACT",
                github_run_id: context.runId,
                failed_stage: stage,
                verdict: "ACTIVATION_ARTIFACT_NOT_VERIFIED",
                provider_rejection_proven: false,
                tos_accepted: false,
                capacity_credit: 0,
                economic_yield_proven: false,
                next_gate: "core inspects exact run; do not accept TOS or retry provider execution"
              }, null, 2) + "\n```"
            });
