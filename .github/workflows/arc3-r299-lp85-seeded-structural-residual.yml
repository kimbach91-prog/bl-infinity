name: ARC3 R299 lp85 seeded structural residual diagnostic
on:
  push:
    branches: [deus/r278-object-region-phase-diagnostic-20260923]
    paths:
      - .github/workflows/arc3-r299-lp85-seeded-structural-residual.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r299-lp85:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 28}
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify source fixed before staging
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 4bf684e1eb068835dbfb98b1122f35b2f80f5841^{commit}
          git merge-base --is-ancestor 4bf684e1eb068835dbfb98b1122f35b2f80f5841 HEAD
      - name: Stage exact lp85 p0-p4 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 4); do f="lp85-305b61c3_p${p}_events.jsonl"; cp "upstream-duck/example-run/artifacts/$f" "public_trace/$f"; done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 5
          ! find public_trace -maxdepth 1 -type f -name '*_p[5-9]_events.jsonl' | grep -q .
          ! find public_trace -maxdepth 1 -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute bounded residual diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_lp85_seeded_structural_residual_diag_299.py
          args=(); for f in $(find public_trace -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_lp85_seeded_structural_residual_diag_299.py "${args[@]}" --output r299-lp85.json 2> >(tee r299-runtime.txt >&2) | tee r299-stdout.txt
      - name: Audit and hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r299-lp85.json'))
          assert d['schema']=='deus/arc3-r299-lp85-seeded-structural-residual/1'
          assert d['protocol']['diagnostic']=='p0-p4 only'
          assert d['protocol']['p5_p9_staged_or_read'] is False
          assert d['protocol']['p10_p19_staged_or_read'] is False
          assert d['truth']['solver_promotion'] is False
          print(json.dumps({'verdict':d['verdict'],'summary':d['summary']},sort_keys=True))
          PY
          sha256sum r299-lp85.json r299-runtime.txt r299-stdout.txt public_trace/SHA256SUMS.txt > R299_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r299-lp85-seeded-structural-residual
          path: |
            r299-lp85.json
            r299-runtime.txt
            r299-stdout.txt
            R299_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
