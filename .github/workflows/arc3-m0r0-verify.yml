name: ARC3 m0r0 six-level route verification

on:
  push:
    branches: [deus/m0r0-public-dev-20260917]
    paths: [.github/workflows/arc3-m0r0-verify.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [ONLINE, NORMAL]
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Replay public actions and require six-level WIN
        env:
          REPLAY_MODE: ${{ matrix.mode }}
        run: |
          python - <<'PY'
          import json,logging,hashlib,time,os,platform
          from pathlib import Path
          from datetime import datetime,timezone
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.CRITICAL)
          levels=[[1,1,3,1,3,1,1,1,1,1,4,4,4,1,4],[2,3,3,3,2,2,2,4,4,1,4,4,2,2,2,2,2,2,4,4,4,1,3],[[6,12,20],1,4,1,[6,24,48],[6,32,16],4,1,4,4,4,4,2,2,2,3,3,1,[6,24,48],[6,40,32],4,4,4,[6,24,48],1,3,3,1,1,1,4,4,4,1,1,3,3,3,3,1,1,1,1,1,4,4,4,4,2,4,4,2,2,2,4],[[6,31,31],4,4,1,1,4,[6,16,36],1,1,2,4,4,4],[3,3,1,1,1,1,3,1,4,4,1,4,4,1,3,3,3,3,1,1,1,3,3,1,1,1,1,1,4,4,1,3,1,1,1,1,3,3,3],[1,1,[6,32,44],3,1,1,3,1,1,1,1,3,[6,20,16],2,2,2,[6,20,20],2,2,[6,20,16],2,3,2,2,2,4,4,4,4,4,4,2,4,2,1,1,1,1]]
          actions=[{'a':v} if isinstance(v,int) else {'a':v[0],'data':{'x':v[1],'y':v[2]}} for level in levels for v in level]
          digest=lambda value:hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert [len(x) for x in levels]==[15,23,55,13,39,38]
          assert len(actions)==183 and digest(actions)=='447eeb9b406ec8e9d7c57e9a645051bbb5c78d5c163c2c8a0f05c7e0a655dba3'
          mode=os.environ['REPLAY_MODE'];sha=os.environ['GITHUB_SHA']
          out=Path('verification');out.mkdir()
          source_url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/blob/'+sha+'/.github/workflows/arc3-m0r0-verify.yml'
          arc=arc_agi.Arcade(operation_mode=OperationMode[mode])
          card_id=arc.open_scorecard(source_url=source_url,tags=['DEUS','m0r0','public-development','frozen-route-replay',mode.lower()])
          env=arc.make('m0r0-492f87ba',seed=0,scorecard_id=card_id,save_recording=False,include_frame_data=True)
          if env is None:raise RuntimeError('ENV_UNAVAILABLE')
          amap={a.value:a for a in env.action_space};obs=env.observation_space
          transcript=[];milestones=[];before=0;expected={15:1,38:2,93:3,106:4,145:5,183:6}
          started=datetime.now(timezone.utc).isoformat();t0=time.monotonic()
          for i,item in enumerate(actions,1):
              obs=env.step(amap[item['a']],data=item.get('data'))
              if obs is None:raise RuntimeError('OBSERVATION_MISSING_AT_'+str(i))
              frame=np.asarray(obs.frame[-1],dtype=np.uint8)
              row={'i':i,'action':item,'levels_completed':obs.levels_completed,'state':obs.state.value,'frame_sha256':hashlib.sha256(frame.tobytes()).hexdigest()}
              transcript.append(row)
              if obs.levels_completed!=before:milestones.append(row);before=obs.levels_completed
              if i in expected and obs.levels_completed!=expected[i]:raise RuntimeError('MILESTONE_DIVERGENCE_AT_'+str(i))
          replay_seconds=time.monotonic()-t0
          passed=obs.levels_completed==6 and obs.state.value=='WIN'
          assert transcript[-1]['frame_sha256']=='52cf50ae7cc9145f27a3f80246aaf4bac868c722954934b77b188baec8c78ec2'
          card=arc.close_scorecard(card_id)
          receipt={'schema':'public-development-game-replay/1','system_label':'DEUS','result':'PASS' if passed else 'FAIL','game_id':'m0r0-492f87ba','seed':0,'mode':mode,'toolkit':'arc-agi 0.9.9','engine':'arcengine 0.9.3','python':platform.python_version(),'source_sha':sha,'run_id':os.environ['GITHUB_RUN_ID'],'started_at':started,'completed_at':datetime.now(timezone.utc).isoformat(),'replay_seconds':replay_seconds,'actions_executed':len(transcript),'per_level_actions':[len(x) for x in levels],'levels_completed':obs.levels_completed,'state':obs.state.value,'route_sha256':digest(actions),'final_frame_sha256':transcript[-1]['frame_sha256'],'milestones':milestones,'scorecard_id':card_id,'scorecard_score':None if card is None else card.score,'protocol':'PUBLIC_DEVELOPMENT_FROZEN_ROUTE_REPLAY','exploration_actions_included':False,'local_development_actions':265,'local_development_resets':9,'bootstrap_probe_actions':5,'external_source_exposure':'High-level public search snippets of m0r0 mechanics seen before execution; no external solver code or action route used.','hidden_game_state_read':False,'game_implementation_inspected':False,'private_core_or_credentials_in_payload':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          (out/'actions.json').write_text(json.dumps(actions,sort_keys=True,separators=(',',':')))
          (out/'transcript.json').write_text(json.dumps(transcript,separators=(',',':')))
          (out/'final_frame.json').write_text(json.dumps(frame.tolist()))
          print('VERIFIED_GAME_RECEIPT='+json.dumps(receipt,separators=(',',':')))
          if not passed:raise RuntimeError('SIX_LEVEL_WIN_REQUIRED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0r0-six-level-verification-${{ matrix.mode }}
          path: verification/
          retention-days: 30
