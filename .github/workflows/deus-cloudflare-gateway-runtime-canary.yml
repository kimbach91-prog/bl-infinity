name: DEUS Cloudflare Gateway Runtime Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-cloudflare-gateway-runtime-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://4ef47966-theory-group.kimbach91.workers.dev
      SOURCE_HEAD: c13cc5d573118b57fa63e1bdf77bb317293a8939
      CLOUDFLARE_VERSION: 4ef47966-b51d-4407-89c0-753e13c840c7
    steps:
      - uses: actions/checkout@v4

      - name: Health
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/healthz" | tee /tmp/health.json
          jq -e '.ok==true and .runtime=="cloudflare-workers" and .scope=="PUBLIC_S0_CANARY" and .response_executor_bound==false' /tmp/health.json

      - name: Discovery
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/.well-known/deus-gateway.json" | tee /tmp/discovery.json
          jq -e '.machine_discoverable==true and .opt_in_only==true and .compatibility.mcp_protocol_version=="2026-07-28" and .execution.response_executor_bound==false' /tmp/discovery.json

      - name: Models
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/v1/models" | tee /tmp/models.json
          jq -e '([.data[].id] | index("deus-auto") != null) and ([.data[].id] | index("deus-zero-model") != null)' /tmp/models.json

      - name: MCP server/discover
        run: |
          set -euo pipefail
          curl -fsS -H 'content-type: application/json'             -d '{"jsonrpc":"2.0","id":"mcp-canary","method":"server/discover","params":{}}'             "$BASE_URL/mcp" | tee /tmp/mcp.json
          jq -e '.jsonrpc=="2.0" and .id=="mcp-canary" and .result.protocolVersion=="2026-07-28" and .result._meta.discovery.machine_discoverable==true' /tmp/mcp.json

      - name: Responses fail closed before executor
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/responses.json -w '%{http_code}' -H 'content-type: application/json'             -d '{"model":"deus-auto","input":"runtime canary"}' "$BASE_URL/v1/responses")"
          cat /tmp/responses.json
          test "$code" = "503"
          jq -e '.error.code=="RESPONSE_EXECUTOR_NOT_BOUND"' /tmp/responses.json

      - name: Typed receipt
        run: |
          jq -n             --arg base "$BASE_URL"             --arg source "$SOURCE_HEAD"             --arg version "$CLOUDFLARE_VERSION"             '{
              receipt_version:"DEUS-CLOUDFLARE-GATEWAY-CANARY/1.0",
              base_url:$base,
              source_head:$source,
              cloudflare_version:$version,
              checks:{health:"PASS",discovery:"PASS",models:"PASS",mcp_server_discover:"PASS",responses_fail_closed:"PASS"},
              response_executor_bound:false,
              provider_execution:false,
              canonical_write:false,
              verdict:"PUBLIC_RUNTIME_DISCOVERY_MCP_MODELS_VERIFIED_EXECUTOR_HOLD"
            }' | tee /tmp/receipt.json
          cat /tmp/receipt.json
