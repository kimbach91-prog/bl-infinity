name: DEUS Cloudflare Gateway Runtime Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-cloudflare-gateway-runtime-canary.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  runtime-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://34e0f094-theory-group.kimbach91.workers.dev
      SOURCE_HEAD: 72ffebf3fe629ab821a2e63ce17cd0bda139e3cd
      CLOUDFLARE_VERSION: 34e0f094-8037-4788-b3a3-b1c1051906b2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Health
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/healthz" | tee /tmp/health.json
          jq -e '.ok==true and .runtime=="cloudflare-workers" and .scope=="PUBLIC_S0_CANARY" and .horde_s0_executor_bound==true' /tmp/health.json

      - name: Discovery
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/.well-known/deus-gateway.json" | tee /tmp/discovery.json
          jq -e '.machine_discoverable==true and .opt_in_only==true and .compatibility.mcp_protocol_version=="2026-07-28" and .execution.horde_s0_executor_bound==true and .execution.deus_auto_bound==false' /tmp/discovery.json

      - name: Models
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/v1/models" | tee /tmp/models.json
          jq -e '([.data[].id] | index("deus-auto") != null) and ([.data[].id] | index("deus-horde-s0") != null)' /tmp/models.json

      - name: MCP server/discover
        run: |
          set -euo pipefail
          curl -fsS -H 'content-type: application/json'             -d '{"jsonrpc":"2.0","id":"mcp-canary","method":"server/discover","params":{}}'             "$BASE_URL/mcp" | tee /tmp/mcp.json
          jq -e '.jsonrpc=="2.0" and .id=="mcp-canary" and .result.protocolVersion=="2026-07-28" and .result._meta.discovery.machine_discoverable==true' /tmp/mcp.json

      - name: Membrane rejects unconfirmed public route
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/membrane.json -w '%{http_code}'             -H 'content-type: application/json'             -d '{"model":"deus-horde-s0","input":"public canary"}'             "$BASE_URL/v1/responses")"
          cat /tmp/membrane.json
          test "$code" = "422"
          jq -e '.error.code=="S0_PUBLIC_CONFIRMATION_REQUIRED"' /tmp/membrane.json

      - name: Preferred deus-auto stays fail closed
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/auto.json -w '%{http_code}'             -H 'content-type: application/json'             -d '{"model":"deus-auto","input":"runtime canary"}'             "$BASE_URL/v1/responses")"
          cat /tmp/auto.json
          test "$code" = "503"
          jq -e '.error.code=="PREFERRED_RESPONSE_EXECUTOR_NOT_BOUND"' /tmp/auto.json

      - name: Public S0 fallback executor through DEUS gate
        run: |
          set -euo pipefail
          code="$(curl --max-time 120 -sS -D /tmp/horde.headers -o /tmp/horde.json -w '%{http_code}'             -H 'content-type: application/json'             -d '{"model":"deus-horde-s0","input":"Give a one sentence public S0 runtime canary response.","max_tokens":16,"metadata":{"data_class":"S0","public_content_confirmed":true}}'             "$BASE_URL/v1/responses")"
          cat /tmp/horde.json
          cat /tmp/horde.headers
          test "$code" = "200"
          jq -e '.id and .model and (.output | type=="array")' /tmp/horde.json
          grep -qi '^x-deus-route: ai-horde-s0' /tmp/horde.headers
          grep -qi '^x-deus-data-class: S0' /tmp/horde.headers
          grep -qi '^x-deus-commercial-default: false' /tmp/horde.headers

      - name: Typed receipt
        run: |
          set -euo pipefail
          rid="$(jq -r '.id' /tmp/horde.json)"
          model="$(jq -r '.model' /tmp/horde.json)"
          jq -n             --arg base "$BASE_URL"             --arg source "$SOURCE_HEAD"             --arg version "$CLOUDFLARE_VERSION"             --arg provider_response_id "$rid"             --arg provider_model "$model"             '{
              receipt_version:"DEUS-CLOUDFLARE-GATEWAY-EXECUTOR-CANARY/2.0",
              base_url:$base,
              source_head:$source,
              cloudflare_version:$version,
              checks:{
                health:"PASS",
                discovery:"PASS",
                models:"PASS",
                mcp_server_discover:"PASS",
                membrane_negative:"PASS",
                deus_auto_fail_closed:"PASS",
                horde_s0_gate_execution:"PASS"
              },
              fallback_executor:{
                route:"ai-horde-s0",
                provider_response_id:$provider_response_id,
                provider_model:$provider_model,
                data_class:"S0_PUBLIC_ONLY",
                commercial_default:false
              },
              preferred_executor_bound:false,
              canonical_write:false,
              verdict:"PUBLIC_RUNTIME_AND_S0_FALLBACK_EXECUTOR_VERIFIED_PREFERRED_EXECUTOR_HOLD"
            }' | tee /tmp/receipt.json
          cat /tmp/receipt.json
