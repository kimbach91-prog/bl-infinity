name: ARC3 Kaggle submission/readback actuator

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/kaggle_submission_actuator.py
      - .github/workflows/arc3-kaggle-submission-actuator.yml
  workflow_dispatch:
    inputs:
      execute_submission:
        description: Execute provider push/run/submission after all gates pass
        required: true
        type: boolean
        default: false
      authorize_submission_quota:
        description: Permit one competition submission if all other gates pass
        required: true
        type: boolean
        default: false
      promotion_decision:
        description: Candidate promotion decision
        required: true
        type: choice
        default: HOLD
        options:
          - HOLD
          - APPROVED_NON_DOMINATED
      candidate_root:
        description: Reconstruct candidate from this vetted source root
        required: true
        type: choice
        default: public_benchmark/arc3/kaggle_candidates/flash_next_340_exact
        options:
          - public_benchmark/arc3/kaggle_candidates/flash_next_340_exact
          - public_benchmark/arc3/kaggle_candidates/flash_next_340
      expected_notebook_sha256:
        description: Exact local package notebook SHA-256 required by gate
        required: true
        type: string
        default: 6a141753f142ed0d683f34f9acb1ac732a6e333a193b2ad8612d66125e64d9d1
      kernel_slug:
        description: Owner kernel slug
        required: true
        type: string
        default: deus-arc-agi3-flash-next-mtp-full

permissions:
  contents: read

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile actuator
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/kaggle_submission_actuator.py
      - name: Run fail-closed self-test
        run: |
          python public_benchmark/arc3/kaggle_candidates/kaggle_submission_actuator.py self-test \
            --receipt arc3-kaggle-actuator-self-test.json
          jq -e '.status=="PASS" and .truth.network_calls==false and .truth.kaggle_submission_attempted==false and .truth.submission_quota_spent==false' \
            arc3-kaggle-actuator-self-test.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-kaggle-actuator-self-test
          path: arc3-kaggle-actuator-self-test.json
          if-no-files-found: error

  provider-actuator:
    if: github.event_name == 'workflow_dispatch'
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SEC_KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      VAR_KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      SEC_KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      VAR_KAGGLE_KEY: ${{ vars.KAGGLE_KEY }}
      SEC_KAGGLE_API_KEY: ${{ secrets.KAGGLE_API_KEY }}
      VAR_KAGGLE_API_KEY: ${{ vars.KAGGLE_API_KEY }}
      SEC_KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      VAR_KAGGLE_API_TOKEN: ${{ vars.KAGGLE_API_TOKEN }}
      SEC_KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
      VAR_KAGGLE_JSON: ${{ vars.KAGGLE_JSON }}
      PROMOTION_DECISION: ${{ inputs.promotion_decision }}
      EXPECTED_NOTEBOOK_SHA256: ${{ inputs.expected_notebook_sha256 }}
      EXECUTE_SUBMISSION: ${{ inputs.execute_submission }}
      AUTHORIZE_SUBMISSION_QUOTA: ${{ inputs.authorize_submission_quota }}
      CANDIDATE_ROOT: ${{ inputs.candidate_root }}
      KERNEL_SLUG: ${{ inputs.kernel_slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet kaggle
      - name: Reconstruct candidate package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$CANDIDATE_ROOT"
          TMP="$RUNNER_TEMP/arc3-actuator-build"
          OUT="$RUNNER_TEMP/arc3-actuator-candidate"
          mkdir -p "$TMP/scripts"
          cp "$ROOT/arc-agi-flash-next-mtp.ipynb" "$TMP/arc-agi-flash-next-mtp.ipynb"
          cp "$ROOT/upstream_build_flash_next_package.py" "$TMP/scripts/build_flash_next_package.py"
          cp "$ROOT/upstream_flash_teardown_patch.py" "$TMP/scripts/flash_teardown_patch.py"
          python "$TMP/scripts/build_flash_next_package.py" \
            --kernel-id "deusplaceholder/$KERNEL_SLUG" \
            --mode full \
            --output-dir "$OUT"
          echo "ACTUATOR_CANDIDATE_DIR=$OUT" >> "$GITHUB_ENV"
      - name: Create explicit candidate gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          execute = os.environ["EXECUTE_SUBMISSION"].lower() == "true"
          quota = os.environ["AUTHORIZE_SUBMISSION_QUOTA"].lower() == "true"
          gate = {
              "schema": "deus/arc3-kaggle-submission-gate/1",
              "decision": os.environ["PROMOTION_DECISION"],
              "owner_incumbent_protection": True,
              "submission_quota_authorized": execute and quota,
              "competition": "arc-prize-2026-arc-agi-3",
              "required_output": "submission.parquet",
              "expected_notebook_sha256": os.environ["EXPECTED_NOTEBOOK_SHA256"],
          }
          open("arc3-kaggle-submission-gate.json","w").write(json.dumps(gate,indent=2)+"\n")
          PY
      - name: Preflight package and promotion gate
        id: preflight
        shell: bash
        run: |
          set +e
          python public_benchmark/arc3/kaggle_candidates/kaggle_submission_actuator.py preflight \
            --candidate-dir "$ACTUATOR_CANDIDATE_DIR" \
            --gate-file arc3-kaggle-submission-gate.json \
            --receipt arc3-kaggle-submission-preflight.json
          rc=$?
          set -e
          status="$(jq -r '.status' arc3-kaggle-submission-preflight.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$EXECUTE_SUBMISSION" = "true" ] && [ "$status" != "READY" ]; then
            echo "Execution requested but preflight is HOLD." >&2
            exit 3
          fi
          if [ "$EXECUTE_SUBMISSION" != "true" ]; then
            echo "Dry-run/hold mode: no Kaggle push or submission will run."
          fi
          exit 0
      - name: Normalize Kaggle machine auth
        if: inputs.execute_submission == true && steps.preflight.outputs.status == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kaggle"
          KAGGLE_USERNAME="${SEC_KAGGLE_USERNAME:-${VAR_KAGGLE_USERNAME:-}}"
          KAGGLE_KEY="${SEC_KAGGLE_KEY:-${VAR_KAGGLE_KEY:-}}"
          KAGGLE_API_KEY="${SEC_KAGGLE_API_KEY:-${VAR_KAGGLE_API_KEY:-}}"
          KAGGLE_API_TOKEN="${SEC_KAGGLE_API_TOKEN:-${VAR_KAGGLE_API_TOKEN:-}}"
          KAGGLE_JSON="${SEC_KAGGLE_JSON:-${VAR_KAGGLE_JSON:-}}"
          if [ -n "$KAGGLE_JSON" ]; then
            printf '%s' "$KAGGLE_JSON" > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
          fi
          if [ -z "$KAGGLE_KEY" ] && [ -n "$KAGGLE_API_KEY" ]; then KAGGLE_KEY="$KAGGLE_API_KEY"; fi
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "Kaggle username machine binding is absent; fail closed before push." >&2
            exit 4
          fi
          {
            echo "KAGGLE_USERNAME=$KAGGLE_USERNAME"
            echo "KAGGLE_KEY=$KAGGLE_KEY"
            echo "KAGGLE_API_TOKEN=$KAGGLE_API_TOKEN"
            echo "DEUS_KAGGLE_EXECUTE_APPROVED=TRUE"
            echo "ACTUATOR_KERNEL=$KAGGLE_USERNAME/$KERNEL_SLUG"
          } >> "$GITHUB_ENV"
      - name: Execute exact-version provider actuator
        if: inputs.execute_submission == true && steps.preflight.outputs.status == 'READY'
        shell: bash
        run: |
          set -euo pipefail
          python public_benchmark/arc3/kaggle_candidates/kaggle_submission_actuator.py execute \
            --candidate-dir "$ACTUATOR_CANDIDATE_DIR" \
            --gate-file arc3-kaggle-submission-gate.json \
            --kernel "$ACTUATOR_KERNEL" \
            --message "DEUS ARC3 verified non-dominated candidate" \
            --receipt arc3-kaggle-submission-execution.json \
            --kernel-timeout-seconds 18000 \
            --score-wait-seconds 18000
          jq -e '.status=="VERIFIED_DONE" or .status=="CHECKPOINT_KERNEL_STILL_RUNNING"' \
            arc3-kaggle-submission-execution.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-kaggle-submission-actuator-receipts
          path: |
            arc3-kaggle-submission-gate.json
            arc3-kaggle-submission-preflight.json
            arc3-kaggle-submission-execution.json
          if-no-files-found: warn
