name: DEUS Wikimedia LiftWing No-Auth Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-wikimedia-liftwing-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liftwing-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Public S0 chat completion without API key
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.wikimedia.org/service/lw/inference/v1/models/llm-qwen3-14b/openai/v1/chat/completions'
          cat >/tmp/request.json <<'JSON'
          {
            "model":"llm-qwen3-14b",
            "messages":[{"role":"user","content":"Public S0 canary. Reply with exactly: DEUS_WIKIMEDIA_CANARY_OK"}],
            "stream":false,
            "temperature":0
          }
          JSON
          start="$(date +%s%3N)"
          code="$(curl --max-time 120 -sS -o /tmp/response.json -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' --data-binary @/tmp/request.json || true)"
          latency="$(( $(date +%s%3N) - start ))"
          cat /tmp/response.json || true
          echo
          exact=false
          if [ "$code" = "200" ] && grep -Fq 'DEUS_WIKIMEDIA_CANARY_OK' /tmp/response.json; then exact=true; fi
          sha="$(sha256sum /tmp/response.json 2>/dev/null | awk '{print $1}' || true)"
          jq -n --arg url "$url" --arg status "$code" --arg digest "$sha" --argjson latency "$latency" --argjson exact "$exact"             '{receipt_version:"DEUS-PUBLIC-COMPUTE-CANARY/1",provider:"WIKIMEDIA_LIFTWING",endpoint:$url,auth_mode:"NO_API_KEY",data_class:"S0_SYNTHETIC_ONLY",http_status:($status|tonumber),latency_ms:$latency,exact_contract:$exact,response_digest:$digest,provider_execution:($status=="200"),canonical_write:false,settlement:false,verdict:(if $exact then "WIKIMEDIA_LIFTWING_NOAUTH_PASS" else "WIKIMEDIA_LIFTWING_WEAK_OR_FAIL" end)}'             | tee /tmp/receipt.json
          test "$code" = "200"
