name: DEUS Provider Scale Surface Scan

on:
  push:
    branches: [main]
    paths:
      - 'public-compute/provider-scale-manifest-v1.json'
      - '.github/workflows/deus-provider-scale-surface-scan.yml'
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

concurrency:
  group: deus-provider-scale-surface-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Classify and probe official surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, time, urllib.request, concurrent.futures, hashlib
          from pathlib import Path

          p=Path("public-compute/provider-scale-manifest-v1.json")
          data=json.loads(p.read_text())
          providers=data["providers"]

          def first_url(s):
              m=re.search(r'https?://[^\s;|]+', s or '')
              return m.group(0).rstrip('.,)') if m else None

          def probe(x):
              url=first_url(x.get("official_source"))
              out={"id":x["id"],"provider":x["provider"],"scale_class":x["scale_class"],"url":url}
              if not url:
                  out.update({"reachable":False,"status":"NO_URL"})
                  return out
              req=urllib.request.Request(url, headers={"User-Agent":"DEUS-PUBLIC-SURFACE-SCAN/1.0"})
              t=time.time()
              try:
                  with urllib.request.urlopen(req, timeout=12) as r:
                      out.update({"reachable":True,"http_status":r.getcode(),"latency_ms":int((time.time()-t)*1000)})
              except Exception as e:
                  code=getattr(e,"code",None)
                  out.update({"reachable":False,"http_status":code or 0,"error":type(e).__name__,"latency_ms":int((time.time()-t)*1000)})
              return out

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              results=list(ex.map(probe, providers))

          counts={}
          for x in providers:
              counts[x["scale_class"]]=counts.get(x["scale_class"],0)+1
          reachable=sum(1 for x in results if x.get("reachable"))
          failed=len(results)-reachable
          receipt={
            "receipt_version":"DEUS-PROVIDER-SCALE-SURFACE-SCAN/1",
            "provider_count":len(providers),
            "classification_counts":counts,
            "reachable_official_surfaces":reachable,
            "failed_or_unresolved_surfaces":failed,
            "constraints":{
              "account_creation":False,
              "authentication":False,
              "payment":False,
              "kyc":False,
              "terms_acceptance":False,
              "provider_mutation":False
            },
            "sample_failures":[x for x in results if not x.get("reachable")][:20],
            "results_digest":hashlib.sha256(json.dumps(results,sort_keys=True).encode()).hexdigest()
          }
          print(json.dumps(receipt,indent=2))
          Path("/tmp/provider-scale-scan-receipt.json").write_text(json.dumps(receipt,indent=2))
          PY

      - name: Publish compact receipt to job summary
        shell: bash
        run: |
          echo "DEUS Provider Scale Surface Scan" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/provider-scale-scan-receipt.json >> "$GITHUB_STEP_SUMMARY"
