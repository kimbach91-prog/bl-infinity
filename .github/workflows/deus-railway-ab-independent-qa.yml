name: DEUS Railway AB Independent QA

on:
  push:
    paths:
      - ".github/workflows/deus-railway-ab-independent-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Independently verify Railway A/B logical roots
        shell: bash
        run: |
          set -euo pipefail
          A_URL='https://deus-cpu-executor-a-production.up.railway.app/compute?loops=50001'
          B_URL='https://deus-cpu-executor-b-production.up.railway.app/compute?loops=50002'
          A_CODE="$(curl -fsS --max-time 60 -o /tmp/a.json -w '%{http_code}' "$A_URL" -H 'User-Agent: DEUS-Independent-QA-RailwayAB/1.0')"
          B_CODE="$(curl -fsS --max-time 60 -o /tmp/b.json -w '%{http_code}' "$B_URL" -H 'User-Agent: DEUS-Independent-QA-RailwayAB/1.0')"
          test "$A_CODE" = "200"
          test "$B_CODE" = "200"
          python3 - <<'PY'
          import json, hashlib, pathlib
          a_raw=pathlib.Path('/tmp/a.json').read_bytes()
          b_raw=pathlib.Path('/tmp/b.json').read_bytes()
          a=json.loads(a_raw); b=json.loads(b_raw)
          assert a.get('service') == 'deus-cpu-executor-a', a
          assert b.get('service') == 'deus-cpu-executor-b', b
          assert a.get('state') == 'EXECUTED', a
          assert b.get('state') == 'EXECUTED', b
          assert a.get('loops') == 50001, a
          assert b.get('loops') == 50002, b
          assert isinstance(a.get('checksum'), int)
          assert isinstance(b.get('checksum'), int)
          assert a.get('checksum') != b.get('checksum')
          receipt={
            "schema":"deus-railway-ab-independent-qa/1",
            "qa_runner":"github-hosted-ubuntu",
            "provider":"Railway",
            "region_scope":"sfo_same_provider_domain",
            "a":{"service":a["service"],"loops":a["loops"],"checksum":a["checksum"],"response_sha256":hashlib.sha256(a_raw).hexdigest()},
            "b":{"service":b["service"],"loops":b["loops"],"checksum":b["checksum"],"response_sha256":hashlib.sha256(b_raw).hexdigest()},
            "distinct_logical_roots":True,
            "independent_provider_domains":False,
            "aggregate_credit_mutation":False,
            "truth":"INDEPENDENT_QA_PASS_LOGICAL_ROOT_IDENTITY_NE_PROVIDER_DOMAIN_NE_AGGREGATE_PROMOTION"
          }
          print("DEUS_RAILWAY_AB_QA_RECEIPT="+json.dumps(receipt,separators=(',',':')))
          PY
