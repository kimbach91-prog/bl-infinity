name: ARC3 R263 re86 object-relative residual diagnostic

on:
  push:
    branches:
      - deus/r263-re86-object-relative-residual-diag-20260923
    paths:
      - .github/workflows/arc3-r262-g50t-visible-state-phase-diag.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-r263-re86:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py public_benchmark/arc3/kaggle_candidates/public_action_conditional_markov_gate_251.py public_benchmark/arc3/kaggle_candidates/public_component_delta_operator_254.py public_benchmark/arc3/kaggle_candidates/public_object_motion_diag_256.py public_benchmark/arc3/kaggle_candidates/public_selective_object_transport_257.py public_benchmark/arc3/kaggle_candidates/public_object_relative_residual_diag_263.py
      - name: Stage re86 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 9); do
            f="re86-8af5384d_p${p}_events.jsonl"
            src="upstream-duck/example-run/artifacts/$f"
            test -s "$src"; cp "$src" "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute R263 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          args=(); for f in public_trace/re86-8af5384d_p*_events.jsonl; do args+=(--input "$f"); done
          test "${#args[@]}" -eq 20
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_object_relative_residual_diag_263.py "${args[@]}" --output r263-re86-object-relative-residual.json 2> >(tee r263-runtime.txt >&2) | tee r263-stdout.txt
      - name: Verify and digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('r263-re86-object-relative-residual.json').read_text())
          assert d['schema']=='deus/arc3-r263-object-relative-residual-diagnostic/1'
          t=d['truth']
          assert t['public_trace_only'] and not t['game_source_read'] and not t['p10_p19_read']
          assert not t['independent_generalization_claim'] and not t['kaggle_execution'] and not t['competition_submission'] and not t['owner_score_claim']
          best=d.get('best_variant')
          b=d.get('variants',{}).get(best,{}) if best else {}
          Path('r263-verdict.json').write_text(json.dumps({'verdict':'DIAGNOSTIC_ONLY','best_variant':best,'mean_hamming_reduction_fraction':b.get('mean_hamming_reduction_fraction'),'exact_before':b.get('base_error',{}).get('exact'),'exact_after':b.get('corrected_error',{}).get('exact'),'improved_frames':b.get('improved_frames'),'regressed_frames':b.get('regressed_frames')},indent=2,sort_keys=True)+'\n')
          PY
          sha256sum r263-re86-object-relative-residual.json r263-verdict.json r263-runtime.txt r263-stdout.txt public_trace/SHA256SUMS.txt > R263_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r263-re86-object-relative-residual-diag
          path: |
            r263-re86-object-relative-residual.json
            r263-verdict.json
            r263-runtime.txt
            r263-stdout.txt
            R263_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
