name: Public S0 provider manifest audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/public-s0-provider-manifest-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-s0-provider-manifest-audit
  cancel-in-progress: false

jobs:
  shard:
    if: github.actor == 'kimbach91-prog'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Audit public-safe provider manifest shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const shard = Number(process.env.SHARD);
          const SHARDS = 4;
          const path = 'public-compute/provider-manifest-v1.json';
          const raw = fs.readFileSync(path);
          const manifest = JSON.parse(raw);
          const routes = manifest.routes || [];
          const selected = routes.filter((_, i) => i % SHARDS === shard);

          if (manifest.schema !== 'deus-public-provider-manifest/1') throw new Error('schema');
          if (!Array.isArray(routes) || routes.length === 0) throw new Error('routes_empty');
          if (manifest.invariants?.protected_core_export !== false) throw new Error('manifest_core_boundary');
          if (manifest.invariants?.canonical_write !== false) throw new Error('manifest_canonical_write');
          if (manifest.invariants?.verified_economic_yield !== 0) throw new Error('manifest_yield_boundary');

          const seen = new Set();
          for (const route of routes) {
            if (!route.id || seen.has(route.id)) throw new Error('duplicate_or_missing_id:' + route.id);
            seen.add(route.id);
          }

          const allowedRuntime = new Set(['github_actions']);
          for (const route of selected) {
            if (route.protected_core_export !== false) throw new Error('core_export:' + route.id);
            if (route.canonical_write !== false) throw new Error('canonical_write:' + route.id);
            if (route.verified_economic_yield !== 0) throw new Error('yield_overclaim:' + route.id);
            if (!route.requires_authority) throw new Error('missing_authority_gate:' + route.id);
            if (!route.scope || !route.scope.includes('BL-S0')) throw new Error('data_ceiling:' + route.id);
            if (route.runtime_verified === true && !allowedRuntime.has(route.id)) throw new Error('runtime_overclaim:' + route.id);
          }

          const subsetDigest = crypto.createHash('sha256')
            .update(JSON.stringify(selected))
            .digest('hex');
          const manifestDigest = crypto.createHash('sha256').update(raw).digest('hex');

          const receipt = {
            schema: 'public-s0-provider-manifest-audit-receipt/1',
            state: 'RESULT_VERIFIED_RUNNER_SCOPE',
            provider: 'GitHub Actions',
            source_commit: process.env.GITHUB_SHA || null,
            run_id: process.env.GITHUB_RUN_ID || null,
            shard,
            shard_count: SHARDS,
            route_count_total: routes.length,
            route_count_shard: selected.length,
            route_ids: selected.map(x => x.id),
            manifest_sha256: manifestDigest,
            subset_sha256: subsetDigest,
            data_class: 'BL-S0',
            semantic_authority: false,
            canonical_write: false,
            protected_core_export: false,
            economic_yield_claim: false,
            capacity_claim: false
          };
          console.log('DEUS_PROVIDER_MANIFEST_SHARD_RECEIPT=' + JSON.stringify(receipt));
          NODE

  reduce:
    if: github.actor == 'kimbach91-prog'
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Reduce provider manifest audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = 'public-compute/provider-manifest-v1.json';
          const raw = fs.readFileSync(path);
          const m = JSON.parse(raw);
          const routes = m.routes || [];
          const ids = routes.map(x => x.id);
          if (new Set(ids).size !== ids.length) throw new Error('duplicate_ids');

          const bad = routes.filter(x =>
            x.protected_core_export !== false ||
            x.canonical_write !== false ||
            x.verified_economic_yield !== 0 ||
            !x.requires_authority ||
            !String(x.scope || '').includes('BL-S0')
          );
          if (bad.length) throw new Error('boundary_fail:' + bad.map(x => x.id).join(','));

          const runtimeVerified = routes.filter(x => x.runtime_verified === true).map(x => x.id);
          if (runtimeVerified.length !== 1 || runtimeVerified[0] !== 'github_actions') {
            throw new Error('runtime_verified_scope_fail:' + runtimeVerified.join(','));
          }

          const summary = {
            schema: 'public-s0-provider-manifest-reduction-receipt/1',
            state: 'RESULT_VERIFIED_RUNNER_SCOPE',
            provider: 'GitHub Actions',
            source_commit: process.env.GITHUB_SHA || null,
            run_id: process.env.GITHUB_RUN_ID || null,
            manifest_sha256: crypto.createHash('sha256').update(raw).digest('hex'),
            route_count: routes.length,
            unique_route_count: new Set(ids).size,
            runtime_verified_ids: runtimeVerified,
            public_benefit_route_count: routes.filter(x => x.public_benefit === true).length,
            economic_yield_capable_candidate_count: routes.filter(x => x.native_monetary_yield_possible === true).length,
            verified_economic_yield_sum: routes.reduce((a,x) => a + Number(x.verified_economic_yield || 0), 0),
            protected_core_export_count: routes.filter(x => x.protected_core_export !== false).length,
            canonical_write_count: routes.filter(x => x.canonical_write !== false).length,
            semantic_authority: false,
            capacity_claim: false,
            truth_boundary: 'Manifest integrity audit only. It does not promote candidate providers to runtime capacity, authority, payout, or trust.'
          };
          console.log('DEUS_PROVIDER_MANIFEST_REDUCTION_RECEIPT=' + JSON.stringify(summary));
          NODE
