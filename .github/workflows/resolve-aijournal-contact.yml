name: Resolve AI Journal public contact

on:
  push:
    paths:
      - '.github/workflows/resolve-aijournal-contact.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve public Cloudflare-protected email
        run: |
          python - <<'PY'
          import re, requests
          u='https://aijourn.com/contact-us/'
          t=requests.get(u,timeout=30,headers={'User-Agent':'Mozilla/5.0'}).text
          xs=re.findall(r'data-cfemail=["\']([0-9a-fA-F]+)',t)
          print('CFEMAIL_COUNT',len(xs))
          def dec(h):
              b=bytes.fromhex(h); k=b[0]; return ''.join(chr(x^k) for x in b[1:])
          for h in xs: print('PUBLIC_EMAIL',dec(h))
          PY
