name: ARC3 R320 cn04 graph final audit
on:
  push:
    branches: [deus/r320-cn04-graph-final-audit-20260923]
    paths: [public_benchmark/arc3/kaggle_candidates/public_cn04_graph_final_audit_320.py, .github/workflows/arc3-r320-cn04-graph-final-audit.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  r320:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 16}
      - name: Verify frozen source
        run: |
          git cat-file -e c7581b5dd0a286e1d36ca61e1bb749f00337df1b^{commit}
          git merge-base --is-ancestor c7581b5dd0a286e1d36ca61e1bb749f00337df1b HEAD
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage cn04 p0-p19
        run: |
          mkdir -p public_trace
          for p in $(seq 0 19); do cp "upstream-duck/example-run/artifacts/cn04-2fe56bfb_p${p}_events.jsonl" public_trace/; done
          test "$(find public_trace -name '*_events.jsonl' | wc -l)" -eq 20
      - name: Execute
        run: |
          args=(); for f in $(find public_trace -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_cn04_graph_final_audit_320.py "${args[@]}" --output r320.json | tee stdout.txt
      - name: Audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r320.json')); assert d['schema']=='deus/arc3-r320-cn04-graph-final-audit/1'
          assert not d['protocol']['p10_p19_updates_selector'] and not d['protocol']['p10_p19_updates_model']
          print(json.dumps({'verdict':d['verdict'],'gate_pass':d['gate_pass'],'p10p19':d['public_p10_p19']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r320-cn04-graph-final-audit
          path: [r320.json, stdout.txt]
          retention-days: 30
