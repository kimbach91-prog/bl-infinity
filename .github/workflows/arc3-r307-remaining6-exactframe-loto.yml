name: ARC3 R307 remaining6 exact-frame LOTO
on:
  push:
    branches: [deus/r307-remaining6-exactframe-loto-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_remaining6_exactframe_loto_307.py
      - .github/workflows/arc3-r307-remaining6-exactframe-loto.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remaining6:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        game:
          - bp35-0a0ad940
          - g50t-5849a774
          - ls20-9607627b
          - sb26-7fbdac44
          - sc25-635fd71a
          - sp80-589a99af
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_remaining6_exactframe_loto_307.py
      - name: Stage exact game p0-p4 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 4); do
            f="${{ matrix.game }}_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "public_trace/${f}"
          done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 5
          ! find public_trace -maxdepth 1 -type f -name '*_p[5-9]_events.jsonl' | grep -q .
          ! find public_trace -maxdepth 1 -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute R307
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in $(find public_trace -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          out="r307-${{ matrix.game }}.json"
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_remaining6_exactframe_loto_307.py "${args[@]}" --game "${{ matrix.game }}" --output "${out}" 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit
        shell: bash
        run: |
          python - <<'PY'
          import json,glob
          d=json.load(open(glob.glob('r307-*.json')[0]))
          assert d['schema']=='deus/arc3-r307-remaining6-exactframe-loto/1'
          p=d['protocol']; t=d['truth']
          assert p['p5_p9_staged_or_read'] is False and p['p10_p19_staged_or_read'] is False
          assert t['public_trace_only'] and t['source_free_runtime_logic']
          assert not t['p5_p9_read'] and not t['p10_p19_read']
          assert not t['solver_promotion'] and not t['kaggle_execution'] and not t['competition_submission']
          print(json.dumps({'game':d['game'],'verdict':d['verdict'],'best_mode':d['best_mode']},sort_keys=True))
          PY
          sha256sum r307-*.json runtime.txt stdout.txt public_trace/SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r307-${{ matrix.game }}
          path: |
            r307-*.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
