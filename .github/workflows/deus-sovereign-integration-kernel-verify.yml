name: DEUS Sovereign Integration Kernel Verify
on:
  push:
    branches:
      - deus/v6-sovereign-integration-verifier-20260927
    paths:
      - 'sovereign-integration-verifier/**'
      - '.github/workflows/deus-sovereign-integration-kernel-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check sovereign-integration-verifier/integration-kernel.mjs
      - name: Invariants
        run: node --test sovereign-integration-verifier/integration-kernel.test.mjs
