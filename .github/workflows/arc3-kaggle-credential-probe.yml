name: Kaggle credential binding probe

on:
  push:
    branches: [deus/arc3-kaggle-rank-climb-20260921]
    paths: [.github/workflows/arc3-kaggle-credential-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Report only binding presence
        run: |
          python - <<'PY'
          import json,os
          keys=['KAGGLE_USERNAME','KAGGLE_KEY','KAGGLE_TOKEN','KAGGLE_API_TOKEN']
          rec={k:bool(os.environ.get(k)) for k in keys}
          rec['usable_classic_pair']=rec['KAGGLE_USERNAME'] and rec['KAGGLE_KEY']
          rec['any_token_binding']=rec['KAGGLE_TOKEN'] or rec['KAGGLE_API_TOKEN']
          print('KAGGLE_BINDING_PROBE='+json.dumps(rec,separators=(',',':')))
          PY

