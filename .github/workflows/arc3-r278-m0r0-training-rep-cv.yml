# Candidate set and p0-p9-only protocol frozen before execution.
name: ARC3 R278 m0r0 training-side representation CV
on:
  push:
    branches: [deus/r278-m0r0-training-side-representation-cv-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_m0r0_training_rep_cv_278.py
      - .github/workflows/arc3-r278-m0r0-training-rep-cv.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r278:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py public_benchmark/arc3/kaggle_candidates/public_ui_mask_markov_diag_268.py public_benchmark/arc3/kaggle_candidates/public_relational_topology_diag_274.py public_benchmark/arc3/kaggle_candidates/public_action_canonical_topology_diag_275.py public_benchmark/arc3/kaggle_candidates/public_m0r0_training_rep_cv_278.py
      - name: Stage p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('upstream-duck/example-run/artifacts'); dst=Path('public_trace'); game='m0r0-492f87ba'
          by={}
          for f in src.glob(f'{game}_p*_events.jsonl'):
              m=re.match(rf'{re.escape(game)}_p(\d+)_events\.jsonl$',f.name)
              if m and int(m.group(1))<10: by[int(m.group(1))]=f
          if set(by)!=set(range(10)): raise SystemExit(f'exact p0-p9 required; got {sorted(by)}')
          for p in range(10): (dst/by[p].name).write_bytes(by[p].read_bytes())
          PY
          test "$(find public_trace -type f -name 'm0r0-492f87ba_p*_events.jsonl' | wc -l)" -eq 10
          if find public_trace -type f -name 'm0r0-492f87ba_p1[0-9]_events.jsonl' | grep -q .; then echo 'forbidden p10-p19 staged' >&2; exit 42; fi
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute R278 p0-p9 LOTO
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find public_trace -type f -name 'm0r0-492f87ba_p*_events.jsonl' | sort)
          args=(); for f in "${files[@]}"; do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_m0r0_training_rep_cv_278.py "${args[@]}" --output r278.json 2> >(tee r278-runtime.txt >&2) | tee r278-stdout.txt
      - name: Verify and hash
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('r278.json').read_text())
          assert d['schema']=='deus/arc3-r278-m0r0-training-representation-cv/1'
          assert d['protocol']['p10_p19_staged_or_read'] is False
          assert d['truth']['p10_p19_read'] is False and d['truth']['diagnostic_only'] is True
          assert not d['truth']['kaggle_execution'] and not d['truth']['competition_submission'] and not d['truth']['independent_hidden_generalization_claim']
          Path('r278-verdict.json').write_text(json.dumps({'verdict':d['verdict'],'selected':d['selected_training_side_mode'],'zero_wrong_modes':d['zero_wrong_modes'],'baseline':d['baseline_nodes_coarse_ui'],'selected_metrics':d['modes'].get(d['selected_training_side_mode']) if d['selected_training_side_mode'] else None,'truth_lane':'PUBLIC_OFFLINE_P0_P9_CV_ONLY'},indent=2,sort_keys=True)+'\n')
          print(Path('r278-verdict.json').read_text())
          PY
          sha256sum r278.json r278-verdict.json r278-runtime.txt r278-stdout.txt public_trace/SHA256SUMS.txt > R278_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r278-m0r0-training-representation-cv
          path: |
            r278.json
            r278-verdict.json
            r278-runtime.txt
            r278-stdout.txt
            R278_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
