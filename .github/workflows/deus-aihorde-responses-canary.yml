name: DEUS AI Horde Responses Executor Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-aihorde-responses-canary.yml'
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read

jobs:
  executor-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HORDE_BASE: https://oai.aihorde.net
      HORDE_API_KEY: "0000000000"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Heartbeat
        run: |
          set -euo pipefail
          curl -fsS "$HORDE_BASE/heartbeat" | tee /tmp/heartbeat.json
          jq -e '.message == "OK"' /tmp/heartbeat.json

      - name: Pick small live model
        id: model
        run: |
          set -euo pipefail
          curl -fsS "$HORDE_BASE/v1/models" | tee /tmp/models.json
          preferred="meta-llama/Llama-3.2-3B-Instruct"
          if jq -e --arg id "$preferred" '.data[] | select(.id==$id and .worker_threads>0)' /tmp/models.json >/dev/null; then
            model="$preferred"
          else
            model="$(jq -r '[.data[] | select(.known_to_horde==true and .worker_threads>0 and .size>0)] | sort_by(.size) | .[0].id // empty' /tmp/models.json)"
          fi
          test -n "$model"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Selected model: $model"

      - name: Responses API synthetic S0 canary
        env:
          MODEL: ${{ steps.model.outputs.model }}
        run: |
          set -euo pipefail
          jq -n --arg model "$MODEL" '{
            model:$model,
            input:"Return exactly this ASCII token and nothing else: DEUS_HORDE_CANARY_OK",
            max_tokens:16,
            temperature:0,
            timeout:90
          }' > /tmp/request.json

          code="$(curl --max-time 120 -sS -o /tmp/response.json -w '%{http_code}'             -H "authorization: Bearer $HORDE_API_KEY"             -H 'content-type: application/json'             --data-binary @/tmp/request.json             "$HORDE_BASE/v1/responses")"

          cat /tmp/response.json
          test "$code" = "200"
          jq -e '.id and .model and (.output | type == "array")' /tmp/response.json
          actual="$(jq -r '[.output[]?.content[]? | select(.type=="output_text") | .text] | join("")' /tmp/response.json | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if test "$actual" != "DEUS_HORDE_CANARY_OK"; then
            digest="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
            printf '%s\n' "DEUS_HORDE_QUALITY_BLOCKER={\"schema\":\"deus-s0-executor-quality-blocker/1\",\"provider\":\"AI_HORDE\",\"model\":\"$MODEL\",\"provider_execution\":true,\"instruction_adherence\":false,\"observed_text_sha256\":\"$digest\",\"capacity_credit\":0,\"truth\":\"PROVIDER_EXECUTED_NE_TASK_CONTRACT_PASS\"}"
            exit 43
          fi
          printf '%s\n' '{"schema":"deus-s0-executor-quality/1","expected":"DEUS_HORDE_CANARY_OK","instruction_adherence":true,"truth":"EXACT_TASK_CONTRACT_PASS"}' | tee /tmp/quality.json

      - name: Emit typed receipt
        env:
          MODEL: ${{ steps.model.outputs.model }}
        run: |
          set -euo pipefail
          rid="$(jq -r '.id' /tmp/response.json)"
          out_count="$(jq '.output | length' /tmp/response.json)"
          jq -n             --arg provider "AI_HORDE"             --arg base "$HORDE_BASE"             --arg model "$MODEL"             --arg response_id "$rid"             --argjson output_count "$out_count"             '{
              receipt_version:"DEUS-S0-EXECUTOR-CANARY/1.1",
              provider:$provider,
              provider_base:$base,
              auth_mode:"ANONYMOUS_PUBLIC_KEY",
              data_class:"S0_SYNTHETIC_ONLY",
              model:$model,
              response_id:$response_id,
              output_count:$output_count,
              provider_execution:true,
              instruction_adherence:true,
              exact_task_contract:"DEUS_HORDE_CANARY_OK",
              canonical_write:false,
              settlement:false,
              commercial_default:false,
              verdict:"AI_HORDE_RESPONSES_EXECUTOR_CANARY_PASS"
            }' | tee /tmp/receipt.json
          cat /tmp/receipt.json

