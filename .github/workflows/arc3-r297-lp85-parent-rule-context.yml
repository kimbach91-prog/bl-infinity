name: ARC3 R297 lp85 parent-rule context diagnostic
on:
  push:
    branches: [deus/r278-object-region-phase-diagnostic-20260923]
    paths:
      - .github/workflows/arc3-r297-lp85-parent-rule-context.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r297-lp85:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 20}
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify R297 source fixed before staging traces
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 549968cfc22c45609f8b3402178e8517fda636fd^{commit}
          git merge-base --is-ancestor 549968cfc22c45609f8b3402178e8517fda636fd HEAD
          test "$(git show 549968cfc22c45609f8b3402178e8517fda636fd:public_benchmark/arc3/kaggle_candidates/public_lp85_parent_rule_context_diag_297.py | sha256sum | cut -d' ' -f1)" = "$(sha256sum public_benchmark/arc3/kaggle_candidates/public_lp85_parent_rule_context_diag_297.py | cut -d' ' -f1)"
      - name: Stage exact lp85 p0-p4 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 4); do f="lp85-305b61c3_p${p}_events.jsonl"; cp "upstream-duck/example-run/artifacts/$f" "public_trace/$f"; done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 5
          ! find public_trace -maxdepth 1 -type f -name '*_p[5-9]_events.jsonl' | grep -q .
          ! find public_trace -maxdepth 1 -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute bounded train-only hierarchy diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py \
            public_benchmark/arc3/kaggle_candidates/public_ui_mask_markov_diag_268.py \
            public_benchmark/arc3/kaggle_candidates/public_relational_topology_diag_274.py \
            public_benchmark/arc3/kaggle_candidates/public_action_canonical_topology_diag_275.py \
            public_benchmark/arc3/kaggle_candidates/public_object_region_phase_diag_278.py \
            public_benchmark/arc3/kaggle_candidates/public_lp85_loto_sparse_local_delta_diag_294.py \
            public_benchmark/arc3/kaggle_candidates/public_lp85_parent_rule_context_diag_297.py
          args=(); for f in $(find public_trace -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_lp85_parent_rule_context_diag_297.py "${args[@]}" --output r297-lp85.json 2> >(tee r297-runtime.txt >&2) | tee r297-stdout.txt
      - name: Independent truth-boundary audit and hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r297-lp85.json'))
          assert d['schema']=='deus/arc3-r297-lp85-parent-rule-context/1'
          assert d['protocol']['diagnostic']=='p0-p4 only'
          assert d['protocol']['p5_p9_staged_or_read'] is False
          assert d['protocol']['p10_p19_staged_or_read'] is False
          assert d['protocol']['predictor_modified'] is False
          assert d['truth']['p5_p9_read'] is False
          assert d['truth']['p10_p19_read'] is False
          assert d['truth']['solver_promotion'] is False
          print(json.dumps({'verdict':d['verdict'],'summary':d['summary']},sort_keys=True))
          PY
          sha256sum r297-lp85.json r297-runtime.txt r297-stdout.txt public_trace/SHA256SUMS.txt > R297_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r297-lp85-parent-rule-context
          path: |
            r297-lp85.json
            r297-runtime.txt
            r297-stdout.txt
            R297_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
