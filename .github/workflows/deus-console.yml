name: Kernel Lab Console

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  console:
    if: >-
      github.actor == 'kimbach91-prog' &&
      startsWith(github.event.issue.title, '[KERNEL-LAB]') &&
      startsWith(github.event.comment.body, '/kernel')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout experimental kernel branch
        uses: actions/checkout@v4
        with:
          ref: proto/deus-engine-v1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Extract stimulus
        env:
          RAW_COMMENT: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ['RAW_COMMENT']
          text = raw[len('/kernel'):].lstrip()
          if not text:
              text = 'No stimulus supplied. Hold unknown and request a concrete stimulus.'
          Path('/tmp/kernel_stimulus.txt').write_text(text, encoding='utf-8')
          PY

      - name: Run public model-independent kernel smoke surface
        run: |
          cd experiments/deus-engine-v1
          python github_console.py "$(cat /tmp/kernel_stimulus.txt)" > /tmp/kernel_reply.md

      - name: Reply to public lab thread
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/kernel_reply.md
