name: Federation v0.7 Diagnostic Matrix

on:
  pull_request:
    paths:
      - 'runtime/federation/**'
      - '.github/workflows/federation-v07-diagnostic.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v7
      - id: files
        shell: bash
        run: |
          files=$(find runtime/federation/test -maxdepth 1 -type f -name '*.test.mjs' -printf '%f\n' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "files=$files" >> "$GITHUB_OUTPUT"

  test-file:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    env:
      BL_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/blcf_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blcf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blcf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: runtime/federation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Run ${{ matrix.file }}
        run: node --test "test/${{ matrix.file }}"
