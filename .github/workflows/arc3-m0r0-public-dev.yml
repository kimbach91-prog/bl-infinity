name: ARC3 m0r0 public observation bootstrap

on:
  push:
    branches: [deus/m0r0-public-dev-20260917]
    paths: [.github/workflows/arc3-m0r0-public-dev.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Obtain public game and initial observations
        run: |
          python - <<'PY'
          import logging,json,hashlib,shutil,os,platform
          from pathlib import Path
          from datetime import datetime,timezone
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.CRITICAL)
          out=Path('public_bootstrap');out.mkdir()
          arc=arc_agi.Arcade(operation_mode=OperationMode.NORMAL)
          infos=[e for e in arc.get_environments() if str(e.game_id).split('-')[0]=='m0r0']
          if not infos:raise RuntimeError('PUBLIC_GAME_NOT_AVAILABLE')
          game_id=infos[0].game_id
          env=arc.make(game_id,seed=0,save_recording=False,include_frame_data=True)
          if env is None:raise RuntimeError('ENV_UNAVAILABLE')
          obs=env.observation_space
          amap={a.value:a for a in env.action_space}
          def rec(o,a=None):
              f=np.asarray(o.frame[-1],dtype=np.uint8)
              return {'action':a,'levels_completed':o.levels_completed,'state':o.state.value,'frame':f.tolist(),'frame_sha256':hashlib.sha256(f.tobytes()).hexdigest()}
          records=[rec(obs)]
          for a in [1,2,3,4,5]:
              if a in amap:
                  obs=env.step(amap[a])
                  if obs is None:raise RuntimeError('OBSERVATION_MISSING')
                  records.append(rec(obs,a))
                  if obs.levels_completed or obs.state.value!='NOT_FINISHED':break
          (out/'observations.json').write_text(json.dumps(records,separators=(',',':')))
          src=Path('environment_files')
          files=[p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix in {'.py','.json','.png','.npy'} and any('m0r0' in part for part in p.parts)]
          if not files:raise RuntimeError('LOCAL_PUBLIC_ENV_MISSING')
          manifest=[]
          for p in files:
              rel=p.relative_to(src);dest=out/'environment_files'/rel;dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,dest)
              manifest.append({'path':str(rel),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          receipt={'protocol':'PUBLIC_DEVELOPMENT_OBSERVATION_ONLY','game_id':game_id,'seed':0,'actions_available':list(amap),'bootstrap_actions_executed':len(records)-1,'levels_completed':obs.levels_completed,'state':obs.state.value,'toolkit':'0.9.9','engine':'0.9.3','python':platform.python_version(),'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'utc':datetime.now(timezone.utc).isoformat(),'game_source_inspected':False,'hidden_game_state_read':False,'private_core_or_credentials_exported':False,'files':manifest}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          print('PUBLIC_BOOTSTRAP_RECEIPT='+json.dumps(receipt,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0r0-public-observation-bootstrap
          path: public_bootstrap/
          retention-days: 1
