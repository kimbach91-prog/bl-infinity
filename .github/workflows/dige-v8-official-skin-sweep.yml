name: DIGE V8 Official Skin Texture Sweep

on:
  pull_request:
    paths:
      - '.github/workflows/dige-v8-official-skin-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dige-v8-official-skin-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skin-texture-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve Blender 5.2.2
        run: |
          set -euxo pipefail
          ROOT=https://download.blender.org/release/Blender5.2
          TAR=blender-5.2.2-linux-x64.tar.xz
          curl -fL --retry 4 --retry-delay 3 "$ROOT/$TAR" -o "/tmp/$TAR"
          curl -fL --retry 4 --retry-delay 3 "$ROOT/blender-5.2.2.sha256" -o /tmp/blender.sha256
          grep " $TAR$" /tmp/blender.sha256 > /tmp/blender.expected
          (cd /tmp && sha256sum -c blender.expected)
          tar -xf "/tmp/$TAR" -C /tmp
          BLENDER=/tmp/blender-5.2.2-linux-x64/blender
          test -x "$BLENDER"
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"

      - name: Build frozen geometry
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          mkdir -p runtime
          python build_makehuman_v8.py | tee runtime/geometry_execution.json
          test -s runtime/DIGE_V8_GEOMETRY_MANIFEST.json

      - name: Stage three official CC0 diffuse textures
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          mkdir -p runtime/assets /tmp/dige_c7b
          PRIMARY=https://files2.makehumancommunity.org/asset_packs/skins01/skins01_cc0.zip
          SECONDARY=https://files.makehumancommunity.org/asset_packs/skins01/skins01_cc0.zip
          if ! curl -fL --retry 4 --retry-delay 3 "$PRIMARY" -o /tmp/dige_c7b/skins01_cc0.zip; then
            curl -fL --retry 4 --retry-delay 3 "$SECONDARY" -o /tmp/dige_c7b/skins01_cc0.zip
          fi
          echo "7495ab99287053bd19ff1636114e64b608994d9f7437fea6cc75ea387f96dba9  /tmp/dige_c7b/skins01_cc0.zip" | sha256sum -c -
          unzip -p /tmp/dige_c7b/skins01_cc0.zip "skins/onlytheghosts_young_eurasian_female/young_eurasian_female_diffuse.png" > runtime/assets/young_eurasian_female_diffuse.png
          unzip -p /tmp/dige_c7b/skins01_cc0.zip "skins/bobby_03_young_female_hairless/Young_Female_Hairless.png" > runtime/assets/bobby_03_Young_Female_Hairless.png
          unzip -p /tmp/dige_c7b/skins01_cc0.zip "skins/blindsaypatten_uniform_skin_texture/skin_texture.png" > runtime/assets/blindsaypatten_skin_texture.png
          echo "e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf  runtime/assets/young_eurasian_female_diffuse.png" | sha256sum -c -
          echo "9e2fa4ab993dd938ba896bb98848bd65346500c4c0a07d8789d2f1e14bb3dd7f  runtime/assets/bobby_03_Young_Female_Hairless.png" | sha256sum -c -
          echo "b30c832a5610e9e1e981f913d25e7d7055e4cb90cdb59c23acd04a168392506a  runtime/assets/blindsaypatten_skin_texture.png" | sha256sum -c -
          sha256sum runtime/assets/*.png | sort | tee runtime/assets/DIGE_C7B_TEXTURE_SHA256SUMS.txt

      - name: Render three controlled texture hero candidates
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          for KEY in eurasian bobby_young uniform_asian; do
            DIGE_CYCLES_DEVICE=CPU \
            DIGE_RENDER_SET=HERO_ONLY \
            DIGE_OUTPUT_TAG="skin_${KEY}" \
            DIGE_SKIN_TEXTURE_KEY="$KEY" \
            DIGE_SKIN_SSS_WEIGHT="0.35" \
            DIGE_SKIN_SSS_SCALE="0.0025" \
            DIGE_SKIN_SSS_ANISO="0.80" \
            DIGE_SKIN_ROUGH_MIN="0.30" \
            DIGE_SKIN_ROUGH_MAX="0.48" \
            DIGE_SAMPLES_PREVIEW="12" \
            DIGE_SAMPLES_HERO="20" \
            DIGE_RENDER_SEED="20260919" \
            DIGE_RUNTIME_COMMIT="$GITHUB_SHA" \
            "$BLENDER" --background --factory-startup --python-exit-code 1 --python blender_render_v8.py \
              | tee "runtime/blender_skin_${KEY}.log"
          done

      - name: Verify texture sweep receipts
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, pathlib, hashlib
          expected={
            "eurasian":"e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf",
            "bobby_young":"9e2fa4ab993dd938ba896bb98848bd65346500c4c0a07d8789d2f1e14bb3dd7f",
            "uniform_asian":"b30c832a5610e9e1e981f913d25e7d7055e4cb90cdb59c23acd04a168392506a",
          }
          root=pathlib.Path("runtime/renders")
          for key,sha in expected.items():
              d=root/f"skin_{key}"
              j=json.loads((d/"DIGE_V8_RENDER_RECEIPT.json").read_text())
              p=j["public_skin_texture"]
              assert j["engine"]=="CYCLES" and j["device"]=="CPU"
              assert j["render_set"]=="HERO_ONLY"
              assert j["output_tag"]==f"skin_{key}"
              assert p["candidate_key"]==key
              assert p["texture_sha256"]==sha
              assert j["provenance"]["public_cc0_texture_used"] is True
              assert j["provenance"]["public_cc0_texture_sha256"]==sha
              assert len(j["outputs"])==1 and j["outputs"][0]["view"]=="04_HERO85"
              assert j["denoise_ab"]["raw_aov"]["sha256"]
              assert j["denoise_ab"]["denoised"]["sha256"]
          print("DIGE_C7B_TEXTURE_SWEEP_PASS")
          PY

      - name: Upload texture sweep evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DIGE-C7B-SKIN-SWEEP-${{ github.sha }}
          path: |
            experiments/dige-v8-executor-capsule/runtime/renders/skin_*/04_HERO85_V8.png
            experiments/dige-v8-executor-capsule/runtime/renders/skin_*/04_HERO85_DENOISED_V8.png
            experiments/dige-v8-executor-capsule/runtime/renders/skin_*/04_HERO85_RAW_AOV_V8.exr
            experiments/dige-v8-executor-capsule/runtime/renders/skin_*/DIGE_V8_RENDER_RECEIPT.json
            experiments/dige-v8-executor-capsule/runtime/assets/DIGE_C7B_TEXTURE_SHA256SUMS.txt
            experiments/dige-v8-executor-capsule/runtime/DIGE_V8_GEOMETRY_MANIFEST.json
          if-no-files-found: error
          retention-days: 14
