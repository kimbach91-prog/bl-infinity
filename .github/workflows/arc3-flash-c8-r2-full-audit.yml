name: ARC3 Flash c8-r2 private full-audit lane

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - .github/workflows/arc3-flash-c8-r2-full-audit.yml
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/**
  workflow_dispatch:
    inputs:
      operation:
        description: Dry-run contract, launch private full kernel, or read back exact completed version
        required: true
        type: choice
        default: dry_run
        options:
          - dry_run
          - launch
          - readback
      kernel_ref:
        description: Authorized Kaggle owner/slug for the private c8-r2 kernel
        required: true
        type: string
        default: replace-me/arc-agi3-flash-next-mtp-c8-full-r2
      kernel_version:
        description: Exact Kaggle version for readback; ignored for launch/dry_run
        required: true
        type: string
        default: "0"

permissions:
  contents: read

env:
  C8_NOTEBOOK_SHA256: d66abead0f14aeb0ddeb78f3f5c302d23e9fbe7fa012aee8b98ed8e1e785b90a
  C8_SEMANTIC_SHA256: e220e7a562d99a36e3251132aecacae6ca9e84fc27726db3174454542c53ab61
  C8_CONCURRENCY: "8"
  C8_RUNTIME_SECONDS: "7200"
  C8_ANALYZER_TIMEOUT: "900"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact c8-r2 candidate locally
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public_benchmark/arc3/kaggle_candidates/flash_next_340"
          TMP="$RUNNER_TEMP/c8-contract"
          OUT="$TMP/build/c8"
          mkdir -p "$TMP/scripts"
          cp "$ROOT/arc-agi-flash-next-mtp.ipynb" "$TMP/arc-agi-flash-next-mtp.ipynb"
          cp "$ROOT/upstream_build_flash_next_package.py" "$TMP/scripts/build_flash_next_package.py"
          cp "$ROOT/upstream_flash_teardown_patch.py" "$TMP/scripts/flash_teardown_patch.py"
          python "$TMP/scripts/build_flash_next_package.py" \
            --kernel-id "deusplaceholder/arc-agi3-flash-next-mtp-c8-full-r2" \
            --mode full \
            --concurrency "$C8_CONCURRENCY" \
            --full-runtime-seconds "$C8_RUNTIME_SECONDS" \
            --title "arc agi3 flash next mtp c8 full r2" \
            --output-dir "$OUT"
          echo "C8_CONTRACT_OUT=$OUT" >> "$GITHUB_ENV"
      - name: Verify immutable candidate and auditor contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_audit_flash_output.py
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          out=Path(os.environ["C8_CONTRACT_OUT"])
          notebooks=sorted(out.glob("*.ipynb"))
          assert len(notebooks)==1, notebooks
          nb=notebooks[0]
          digest=hashlib.sha256(nb.read_bytes()).hexdigest()
          assert digest==os.environ["C8_NOTEBOOK_SHA256"], (digest,os.environ["C8_NOTEBOOK_SHA256"])
          meta=json.loads((out/"kernel-metadata.json").read_text())
          checks={
              "notebook_hash_exact": digest==os.environ["C8_NOTEBOOK_SHA256"],
              "competition_source": "arc-prize-2026-arc-agi-3" in (meta.get("competition_sources") or []),
              "machine_shape": meta.get("machine_shape")=="NvidiaRtxPro6000",
              "gpu_enabled": meta.get("enable_gpu") is True,
              "internet_disabled": meta.get("enable_internet") is False,
          }
          receipt={
              "schema":"deus/arc3-c8-r2-full-audit-contract/1",
              "gate":"READY_FOR_AUTHENTICATED_PRIVATE_FULL_RUN" if all(checks.values()) else "HOLD",
              "candidate_notebook_sha256":digest,
              "candidate_semantic_sha256":os.environ["C8_SEMANTIC_SHA256"],
              "expected_full_audit":{
                  "mode":"full-offline",
                  "expected_games":25,
                  "expected_concurrency":int(os.environ["C8_CONCURRENCY"]),
                  "expected_runtime_seconds":int(os.environ["C8_RUNTIME_SECONDS"]),
                  "expected_analyzer_timeout":int(os.environ["C8_ANALYZER_TIMEOUT"]),
                  "require_clean":True,
              },
              "checks":checks,
              "truth":{
                  "network_calls":False,
                  "kaggle_auth_used":False,
                  "kernel_push":False,
                  "kernel_run":False,
                  "full_audit_executed":False,
                  "competition_submission":False,
                  "submission_quota_spent":False,
                  "candidate_promoted":False,
              },
          }
          Path("c8-r2-full-audit-contract.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          assert receipt["gate"]=="READY_FOR_AUTHENTICATED_PRIVATE_FULL_RUN"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c8-r2-full-audit-contract
          path: c8-r2-full-audit-contract.json
          if-no-files-found: error

  provider:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'dry_run'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPERATION: ${{ inputs.operation }}
      KERNEL_REF: ${{ inputs.kernel_ref }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      SEC_KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      VAR_KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      SEC_KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      VAR_KAGGLE_KEY: ${{ vars.KAGGLE_KEY }}
      SEC_KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      VAR_KAGGLE_API_TOKEN: ${{ vars.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle CLI and audit dependency
        run: python -m pip install --disable-pip-version-check --quiet kaggle pyarrow
      - name: Fail closed unless exact authorized kernel ref and machine auth are present
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$KERNEL_REF" == replace-me/* ]] || [[ ! "$KERNEL_REF" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "A concrete authorized owner/slug kernel_ref is required." >&2
            exit 3
          fi
          KAGGLE_USERNAME="${SEC_KAGGLE_USERNAME:-${VAR_KAGGLE_USERNAME:-}}"
          KAGGLE_KEY="${SEC_KAGGLE_KEY:-${VAR_KAGGLE_KEY:-}}"
          KAGGLE_API_TOKEN="${SEC_KAGGLE_API_TOKEN:-${VAR_KAGGLE_API_TOKEN:-}}"
          if [ -z "$KAGGLE_API_TOKEN" ] && { [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; }; then
            echo "No Kaggle machine credential is bound; holding before provider mutation/readback." >&2
            exit 4
          fi
          {
            echo "KAGGLE_USERNAME=$KAGGLE_USERNAME"
            echo "KAGGLE_KEY=$KAGGLE_KEY"
            echo "KAGGLE_API_TOKEN=$KAGGLE_API_TOKEN"
          } >> "$GITHUB_ENV"
          kaggle kernels list --mine --page-size 1 >/dev/null
      - name: Rebuild immutable c8-r2 with provider kernel id
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public_benchmark/arc3/kaggle_candidates/flash_next_340"
          TMP="$RUNNER_TEMP/c8-provider"
          OUT="$TMP/build/c8"
          mkdir -p "$TMP/scripts"
          cp "$ROOT/arc-agi-flash-next-mtp.ipynb" "$TMP/arc-agi-flash-next-mtp.ipynb"
          cp "$ROOT/upstream_build_flash_next_package.py" "$TMP/scripts/build_flash_next_package.py"
          cp "$ROOT/upstream_flash_teardown_patch.py" "$TMP/scripts/flash_teardown_patch.py"
          python "$TMP/scripts/build_flash_next_package.py" \
            --kernel-id "$KERNEL_REF" \
            --mode full \
            --concurrency "$C8_CONCURRENCY" \
            --full-runtime-seconds "$C8_RUNTIME_SECONDS" \
            --title "arc agi3 flash next mtp c8 full r2" \
            --output-dir "$OUT"
          NB="$(find "$OUT" -maxdepth 1 -name '*.ipynb' -type f)"
          GOT="$(sha256sum "$NB" | awk '{print $1}')"
          test "$GOT" = "$C8_NOTEBOOK_SHA256"
          echo "C8_PROVIDER_OUT=$OUT" >> "$GITHUB_ENV"
      - name: Launch private full kernel and checkpoint exact version
        if: inputs.operation == 'launch'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          kaggle kernels push -p "$C8_PROVIDER_OUT" -t 30000 > c8-push.stdout 2> c8-push.stderr
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            sed -n '1,120p' c8-push.stderr >&2
            exit "$rc"
          fi
          VERSION="$(python - <<'PY'
          import re
          text=open("c8-push.stdout",errors="replace").read()+"\n"+open("c8-push.stderr",errors="replace").read()
          m=re.search(r"Kernel version\s+(\d+)\s+successfully pushed",text,re.I)
          if not m:
              raise SystemExit("provider did not expose exact pushed version")
          print(m.group(1))
          PY
          )"
          export VERSION
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt={
              "schema":"deus/arc3-c8-r2-private-launch/1",
              "status":"LAUNCHED_PRIVATE_FULL_RUN",
              "kernel_ref":os.environ["KERNEL_REF"],
              "kernel_version":int(os.environ["VERSION"]),
              "candidate_notebook_sha256":os.environ["C8_NOTEBOOK_SHA256"],
              "truth":{
                  "kaggle_authenticated":True,
                  "kernel_push":True,
                  "kernel_version_readback":True,
                  "full_audit_executed":False,
                  "competition_submission":False,
                  "submission_quota_spent":False,
                  "leaderboard_score_observed":False,
                  "candidate_promoted":False,
              },
          }
          Path("c8-r2-private-launch.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - name: Read exact version status and strict-audit completed output
        if: inputs.operation == 'readback'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$KERNEL_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "readback requires a positive exact kernel_version." >&2
            exit 5
          fi
          EXACT="$KERNEL_REF/$KERNEL_VERSION"
          set +e
          kaggle kernels status "$EXACT" > c8-status.stdout 2> c8-status.stderr
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            sed -n '1,120p' c8-status.stderr >&2
            exit "$rc"
          fi
          if ! grep -Eqi 'complete|completed' c8-status.stdout c8-status.stderr; then
            export EXACT
            python - <<'PY'
          import json, os
          from pathlib import Path
          receipt={
              "schema":"deus/arc3-c8-r2-private-readback/1",
              "status":"PENDING_PROVIDER",
              "exact_kernel":os.environ["EXACT"],
              "candidate_notebook_sha256":os.environ["C8_NOTEBOOK_SHA256"],
              "truth":{
                  "kaggle_authenticated":True,
                  "exact_version_queried":True,
                  "kernel_complete":False,
                  "full_audit_executed":False,
                  "competition_submission":False,
                  "submission_quota_spent":False,
                  "candidate_promoted":False,
              },
          }
          Path("c8-r2-private-readback.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
            exit 0
          fi

          OUTPUT="$RUNNER_TEMP/c8-output"
          mkdir -p "$OUTPUT"
          kaggle kernels output "$EXACT" -p "$OUTPUT"

          set +e
          python public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_audit_flash_output.py \
            --mode full-offline \
            --expected-games 25 \
            --expected-concurrency "$C8_CONCURRENCY" \
            --expected-runtime-seconds "$C8_RUNTIME_SECONDS" \
            --expected-analyzer-timeout "$C8_ANALYZER_TIMEOUT" \
            --require-clean \
            "$OUTPUT" > c8-r2-full-audit.json
          audit_rc=$?
          set -e

          export EXACT OUTPUT audit_rc
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output=Path(os.environ["OUTPUT"])
          files=[]
          for p in sorted(x for x in output.rglob("*") if x.is_file()):
              files.append({
                  "path":str(p.relative_to(output)),
                  "bytes":p.stat().st_size,
                  "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
              })
          try:
              audit=json.loads(Path("c8-r2-full-audit.json").read_text())
          except Exception:
              audit={"passed":False,"error_type":"AuditReportParseError"}
          passed=(os.environ["audit_rc"]=="0" and audit.get("passed") is True)
          receipt={
              "schema":"deus/arc3-c8-r2-private-readback/1",
              "status":"FULL_AUDIT_PASS" if passed else "FULL_AUDIT_FAIL",
              "exact_kernel":os.environ["EXACT"],
              "candidate_notebook_sha256":os.environ["C8_NOTEBOOK_SHA256"],
              "audit":audit,
              "output_manifest":files,
              "truth":{
                  "kaggle_authenticated":True,
                  "exact_version_queried":True,
                  "kernel_complete":True,
                  "exact_output_downloaded":True,
                  "full_audit_executed":True,
                  "full_audit_passed":passed,
                  "competition_submission":False,
                  "submission_quota_spent":False,
                  "leaderboard_score_observed":False,
                  "candidate_promoted":False,
              },
          }
          Path("c8-r2-private-readback.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "status":receipt["status"],
              "exact_kernel":receipt["exact_kernel"],
              "offline_mean":audit.get("offline_mean"),
              "game_count":audit.get("game_count"),
              "total_actions":audit.get("total_actions"),
              "submission_quota_spent":False,
          },indent=2))
          if not passed:
              raise SystemExit(7)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c8-r2-private-full-audit-receipts
          path: |
            c8-r2-private-launch.json
            c8-r2-private-readback.json
            c8-r2-full-audit.json
            c8-status.stdout
            c8-status.stderr
          if-no-files-found: warn
          retention-days: 30
