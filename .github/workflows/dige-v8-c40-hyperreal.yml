name: DIGE V8 C40 Hyperreal HHIR Repair

on:
  pull_request:
    paths:
      - '.github/workflows/dige-v8-c40-hyperreal.yml'
      - 'experiments/dige-v8-executor-capsule/blender_render_c40.py'
      - 'experiments/dige-v8-executor-capsule/DIGE_C40_HYPERREAL_CONTRACT.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: dige-v8-c40-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  c40-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Reuse C34 verified runtime assets
        uses: actions/download-artifact@v4
        with:
          name: DIGE-C34-SHARED-RUNTIME
          path: experiments/dige-v8-executor-capsule/runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '35591781070'

      - name: Stage hash-verified CC0 long01 authored prior
        uses: actions/download-artifact@v4
        with:
          name: DIGE-C36-LONG01-PROBE-84ddfdaa7ead2a28a2f921b7734eda559312e1c5
          path: experiments/dige-v8-executor-capsule/runtime/system_assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '35605124719'

      - name: Verify contract and assets
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          cd runtime/system_assets
          echo "94ecbebfd834da2cbee2ce90b730972590eb22a252ecd9592038ea736e063646  long01.mhclo" | sha256sum -c -
          echo "74ec88267e679d316f8037a074511ffc887b27e198ea381d0ae4a3f180f96760  long01.mhmat" | sha256sum -c -
          echo "7f1d6dadbdf9e96435251955d6657e77ea5433c9bc7c85a5c5f5e4eae0cb9a8c  long01.obj" | sha256sum -c -
          echo "e8dc25d90f8f62467e8630420e1240a400d070054fb7c3f1d3f7bf3e457d6c2c  long01_diffuse.png" | sha256sum -c -
          cd ../..
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path("DIGE_C40_HYPERREAL_CONTRACT.json")
          d=json.loads(p.read_text())
          assert d["candidate"]=="C40_HHIR_HYPERREAL_SCALP_BOUND_UPDO_V1"
          assert d["baseline_receipt"]["visual_verdict"]=="FAIL"
          assert len(d["delta_only"])>=6
          print(json.dumps({"contract_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"scars":len(d["scars"])}))
          PY

      - name: Rebind deterministic body geometry
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          set -euxo pipefail
          python build_makehuman_v8.py | tee runtime/c40_geometry_canon_rebind.json

      - name: Resolve Blender 5.2.2
        run: |
          set -euxo pipefail
          ROOT=https://download.blender.org/release/Blender5.2
          TAR=blender-5.2.2-linux-x64.tar.xz
          curl -fL --retry 4 --retry-delay 3 "$ROOT/$TAR" -o "/tmp/$TAR"
          curl -fL --retry 4 --retry-delay 3 "$ROOT/blender-5.2.2.sha256" -o /tmp/blender.sha256
          grep " $TAR$" /tmp/blender.sha256 > /tmp/blender.expected
          (cd /tmp && sha256sum -c blender.expected)
          tar -xf "/tmp/$TAR" -C /tmp
          echo "BLENDER=/tmp/blender-5.2.2-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Render C40 hero candidate
        working-directory: experiments/dige-v8-executor-capsule
        env:
          DIGE_CYCLES_DEVICE: CPU
          DIGE_RENDER_SET: HERO_ONLY
          DIGE_SEARCH_ONLY: '1'
          DIGE_SEARCH_DENOISE: '0'
          DIGE_OUTPUT_TAG: c40_HHIR
          DIGE_C18_HYBRID_BULK: '1'
          DIGE_C25_MATURE_STACK: '1'
          DIGE_C26_PHOTOMETRIC: '1'
          DIGE_C28_GNM_HEAD: '1'
          DIGE_C28_GNM_DIR: runtime/gnm_c28
          DIGE_C29_GNM_PRESENTATION: '1'
          DIGE_C30_GNM_SEMANTIC_IDENTITY: '1'
          DIGE_C31_GNM_FACE_APPEARANCE: '1'
          DIGE_C32_GNM_DERMAL_HAIR: '1'
          DIGE_C33_GUIDE_GATED_GROOM: '1'
          DIGE_C33_GUIDE_MAX_DIST: '0.021'
          DIGE_C33_SCALP_Z_DROP: '0.120'
          DIGE_C36_CANONICAL_APPEARANCE: '1'
          DIGE_C39_HHIR_HYPERREAL: '1'
          DIGE_C40_HYPERREAL_REPAIR: '1'
          DIGE_C36_JAW_TAPER: '0.88'
          DIGE_C36_EYE_OPEN_SCALE: '0.58'
          DIGE_C36_EYE_GLOBE_SCALE: '0.86'
          DIGE_C36_HAIR_LENGTH_M: '0.28'
          DIGE_C36_HAIR_WAVE: '0.004'
          DIGE_GNM_COMMIT: a424b5153eec9154f3dfa5ee7f214e5817918d54
          DIGE_MPFB2_SRC: runtime/shared_mpfb2_src
          DIGE_MPFB2_COMMIT: b58176c661a9680294eb75f127842cb8378e4974
          DIGE_C25_MHMAT_PATH: runtime/assets/c25_mpfb/c25_skin.mhmat
          DIGE_HAIR_ASSET_KEY: hair_long01
          DIGE_HAIR_STRANDS_PER_ROOT: '4'
          DIGE_HAIR_ACCENT_LENGTH_SCALE: '0.80'
          DIGE_HAIR_FRONT_SAFE_BLEND: '0.82'
          DIGE_SKIN_ALBEDO_PATH: runtime/assets/young_eurasian_female_diffuse.png
          DIGE_SKIN_ALBEDO_SHA256: e4547a04bab2244d8ec6bcb1d239f4cddb83f145d4ce2a5c7734ec514c8bebcf
          DIGE_SKIN_ALBEDO_NAME: onlytheghosts_young_eurasian_female
          DIGE_SKIN_ALBEDO_SAT: '0.88'
          DIGE_SKIN_ALBEDO_VALUE: '0.68'
          DIGE_SAMPLES_PREVIEW: '128'
          DIGE_SAMPLES_HERO: '128'
          DIGE_RENDER_SEED: '20264040'
          DIGE_RUNTIME_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          START=$(date +%s)
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python blender_render_c40.py | tee runtime/c40_HHIR.log
          END=$(date +%s)
          printf '{"wall_seconds":%s}\n' "$((END-START))" > runtime/c40_HHIR_timing.json

      - name: Verify C40 typed receipt
        working-directory: experiments/dige-v8-executor-capsule
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path("runtime/renders/c40_HHIR")
          r=json.loads((root/"DIGE_V8_RENDER_RECEIPT.json").read_text())
          t=json.loads(pathlib.Path("runtime/c40_HHIR_timing.json").read_text())
          assert r["device"]=="CPU"
          assert r["appearance_candidate"]=="C40_HHIR_HYPERREAL_SCALP_BOUND_UPDO_V1"
          assert r["outputs"][0]["lens_mm"]==85
          assert abs(r["outputs"][0]["fstop"]-3.6)<1e-6
          assert r["appearance_selection"]["c40_hyperreal_repair"] is True
          m=r["appearance_selection"]["c39_updo_metrics"]
          assert m["enabled"] is True
          assert m["scalp_candidate_count"]>=500
          assert m["primary_curves"]>=500
          assert m["bun_curves"]==420
          assert m["fringe_curves"]>=100
          assert m["flyaway_curves"]==32
          assert r["hair_curve_metrics"]["c32_lower_central_root_count"]==0
          assert r["provenance"]["reference_pixels_read_by_renderer"] is False
          assert r["provenance"]["image_model_calls"]==0
          summary={
            "schema":"dige-c40-runtime-receipt/1",
            "candidate":r["appearance_candidate"],
            "wall_seconds":t["wall_seconds"],
            "hero":r["outputs"][0],
            "groom":m,
            "skin_settings":r["skin_model"].get("c25_mpfb2",{}).get("settings"),
            "truth_boundary":"RUNTIME_STRUCTURAL_PASS_ONLY__DIRECT_VISUAL_AUDIT_REQUIRED",
            "parent_benchmark":{"direct_seconds":302,"c39_seconds":85,"visual_parent":"FAIL"}
          }
          (root/"DIGE_C40_RUNTIME_SUMMARY.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DIGE-C40-HHIR-${{ github.event.pull_request.head.sha }}
          path: |
            experiments/dige-v8-executor-capsule/runtime/renders/c40_HHIR/*.png
            experiments/dige-v8-executor-capsule/runtime/renders/c40_HHIR/*.json
            experiments/dige-v8-executor-capsule/runtime/c40_HHIR.log
            experiments/dige-v8-executor-capsule/runtime/c40_HHIR_timing.json
          if-no-files-found: error
          retention-days: 14
