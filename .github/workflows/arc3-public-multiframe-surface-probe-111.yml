name: ARC3 public multi-frame surface probe 111

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - 'public_benchmark/arc3/kaggle_candidates/public_multiframe_surface_probe.py'
      - '.github/workflows/arc3-public-multiframe-surface-probe-111.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official ARC toolkit
        run: pip install --disable-pip-version-check 'arc-agi==0.9.9'
      - name: Compile fixed public probe
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_multiframe_probe.py \
            public_benchmark/arc3/kaggle_candidates/public_multiframe_surface_probe.py
      - name: Execute fixed public multi-frame surface probe
        run: |
          cd public_benchmark/arc3/kaggle_candidates
          python public_multiframe_surface_probe.py --receipt "$GITHUB_WORKSPACE/public-multiframe-surface-probe.json"
      - name: Enforce truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s public-multiframe-surface-probe.json
          sha256sum public-multiframe-surface-probe.json > RECEIPT_SHA256SUMS.txt
          jq -e '
            .schema=="deus/arc3-public-multiframe-surface-probe/1"
            and .outcome_adaptive_action_selection==false
            and .summary.executed==3
            and .truth.public_development_environment_only==true
            and .truth.official_online_toolkit_execution==true
            and .truth.include_frame_data_true==true
            and .truth.fixed_actions_declared_before_outcomes==true
            and .truth.game_source_read==false
            and .truth.hidden_state_read==false
            and .truth.kaggle_data_read==false
            and .truth.kaggle_execution==false
            and .truth.kaggle_submission_attempted==false
            and .truth.submission_quota_spent==false
            and .truth.owner_score_claim==false
            and .truth.solver_behavior_gain_claim==false
          ' public-multiframe-surface-probe.json >/dev/null
          jq '{summary,results,truth}' public-multiframe-surface-probe.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload public surface receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-multiframe-surface-probe-111
          path: |
            public-multiframe-surface-probe.json
            RECEIPT_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
