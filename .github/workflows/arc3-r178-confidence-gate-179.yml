name: ARC3 R178 confidence gate 179

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_r178_confidence_gate_179.py
      - .github/workflows/arc3-r178-confidence-gate-179.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r178-confidence-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_fullboard_translation_program_160.py \
            public_benchmark/arc3/kaggle_candidates/public_dense_scroll_renderer_audit_167.py \
            public_benchmark/arc3/kaggle_candidates/public_world_overlay_renderer_172.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_family_sweep_175.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_correction_178.py \
            public_benchmark/arc3/kaggle_candidates/public_r178_confidence_gate_179.py
      - name: Download exact pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in ar25-0c556536_p0_events.jsonl ar25-0c556536_p10_events.jsonl ar25-0c556536_p11_events.jsonl; do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute p11 calibration -> frozen p0/p10 evaluation
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_r178_confidence_gate_179.py \
            --calibration "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" \
            --eval "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" \
            --eval "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" \
            --output "$GITHUB_WORKSPACE/r178-confidence-gate-public-179.json"
      - name: Enforce truth boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r178-confidence-gate-public-179.json'))
          assert d['schema']=='deus/arc3-public-r178-confidence-gate/1'
          assert d['rung']==179
          t=d['truth']
          assert t['gate_selected_on_p11_only'] is True
          assert t['p0_p10_not_used_for_gate_selection'] is True
          assert t['r178_renderer_frozen'] is True
          assert t['independent_generalization_claim'] is False
          assert t['kaggle_execution'] is False and t['submission_quota_spent'] is False
          print(json.dumps({'rung':179,'gate':d['diagnostic_gate'],'calibration':d['calibration'],'evaluation':d['evaluation'],'truth':'P11_CALIBRATED_P0P10_FROZEN_PUBLIC_ONLY'},sort_keys=True))
          PY
      - name: Upload rung 179 diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-r178-confidence-gate-179
          path: |
            r178-confidence-gate-public-179.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
