name: DEUS Murakumo Public S0 Canary

on:
  push:
    paths:
      - ".github/workflows/deus-murakumo-s0-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe Murakumo public free inference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/murakumo
          READY_CODE="$(curl --silent --show-error --max-time 20 --output /tmp/murakumo/ready.json --write-out '%{http_code}' https://api.murakumo.cloud/ready)"
          MODELS_CODE="$(curl --silent --show-error --max-time 20 --output /tmp/murakumo/models.json --write-out '%{http_code}' https://api.murakumo.cloud/v1/models)"
          test "$READY_CODE" = "200"
          test "$MODELS_CODE" = "200"
          grep -q 'murakumo-main' /tmp/murakumo/models.json

          CHAT_CODE="$(curl --silent --show-error --max-time 150             --output /tmp/murakumo/chat.json             --write-out '%{http_code}'             https://api.murakumo.cloud/v1/chat/completions             -H 'content-type: application/json'             -d '{"model":"murakumo-main","messages":[{"role":"user","content":"Reply exactly: DEUS_MURAKUMO_CANARY_OK"}],"max_tokens":32,"temperature":0}')"
          test "$CHAT_CODE" = "200"

          python3 - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          ready=json.loads(Path('/tmp/murakumo/ready.json').read_text())
          models=json.loads(Path('/tmp/murakumo/models.json').read_text())
          chat=json.loads(Path('/tmp/murakumo/chat.json').read_text())
          choices=chat.get('choices') or []
          if not choices:
              raise SystemExit('NO_CHOICES')
          content=str((choices[0].get('message') or {}).get('content','')).strip()
          if content != 'DEUS_MURAKUMO_CANARY_OK':
              raise SystemExit('EXACT_TOKEN_MISMATCH:'+content[:120])
          raw=Path('/tmp/murakumo/chat.json').read_bytes()
          receipt={
            "schema":"deus-public-model-canary/1",
            "provider":"murakumo.cloud",
            "route":"https://api.murakumo.cloud/v1/chat/completions",
            "auth":"NONE",
            "payment":"NONE",
            "data_class":"S0_PUBLIC",
            "ready_ok": True,
            "model_catalog_contains_murakumo_main": True,
            "exact_output": content,
            "response_id": chat.get("id"),
            "model": chat.get("model"),
            "response_sha256": hashlib.sha256(raw).hexdigest(),
            "canonical_write": False,
            "truth":"DIRECT_PROVIDER_MODEL_EXECUTION_VERIFIED_FOR_EXACT_S0_CANARY_NE_GENERAL_QUALITY_NE_PERSISTENT_CAPACITY"
          }
          print("DEUS_MURAKUMO_S0_RECEIPT="+json.dumps(receipt,separators=(',',':')))
          PY
