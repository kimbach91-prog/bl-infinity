name: ARC3 Sonpham rank-lineage audit
# Second push intentionally activates this newly-added workflow.

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - .github/workflows/arc3-sonpham-rank-lineage-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-public-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch pinned upstream public history
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/sonpham-org/arc-3.git /tmp/arc3
          git -C /tmp/arc3 cat-file -e 65eba2b6dbd1b35509cdfdc6fdc8df714a01e7f5^{commit}
          git -C /tmp/arc3 cat-file -e bc2c607602456df0973d08b7624bfb7fd6f0a3dc^{commit}
          git -C /tmp/arc3 cat-file -e cf33a85372c3178ce8a7899123fc08b739210ce1^{commit}

      - name: Audit Kaggle lineage and reject ungrounded promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess

          repo = pathlib.Path('/tmp/arc3')
          def git(*args):
              return subprocess.check_output(['git', '-C', str(repo), *args], text=True)

          exact_sha = '65eba2b6dbd1b35509cdfdc6fdc8df714a01e7f5'
          flash_sha = 'bc2c607602456df0973d08b7624bfb7fd6f0a3dc'
          lora_sha = 'cf33a85372c3178ce8a7899123fc08b739210ce1'

          prep = git('show', f'{exact_sha}:scripts/prepare_kaggle_qwen38_chinese.py')
          assert 'derived_from_submission' in prep and '55551321' in prep
          assert 'derived_from_script_version_id' in prep and '342637750' in prep
          assert 'Qwen/Qwen3.8-27B-FP8' in prep
          assert 'kaggle-submission-55551321-v342637750' in prep
          assert 'ROOT / "work"' in prep

          flash_msg = git('show', '-s', '--format=%B', flash_sha)
          assert 'Flash-Next beats' in flash_msg and 'six of the seven' in flash_msg
          assert 'tr87' in flash_msg and '13.46 vs 0.60' in flash_msg

          lora_msg = git('show', '-s', '--format=%B', lora_sha)
          assert 'base    7 levels / 20.780 score' in lora_msg
          assert 'round3  2 levels /  0.705 score' in lora_msg
          assert '0/7 games improved' in lora_msg

          receipt = {
              'schema': 'deus.arc3.rank_lineage_audit.v1',
              'upstream_repo': 'sonpham-org/arc-3',
              'audited_commits': {
                  'qwen38_checkpoint8_kaggle_lineage': exact_sha,
                  'flash_next_vs_27b_runtime_comparison': flash_sha,
                  'lora_round3_regression': lora_sha,
              },
              'qwen38_checkpoint8': {
                  'kaggle_submission_lineage_id': 55551321,
                  'script_version_id': 342637750,
                  'model': 'Qwen/Qwen3.8-27B-FP8',
                  'status': 'SOURCE_GROUNDED_NOT_PUBLICLY_REPRODUCIBLE',
                  'reason': 'The public preparation script depends on an upstream local work/ downloaded submission artifact and source dataset that are not present as public repo artifacts.',
                  'public_lb_score_verified': False,
              },
              'flash_next_evidence': {
                  'status': 'PUBLIC_RUNTIME_CATALOG_EVIDENCE_ONLY',
                  'claim': 'At matched 2.21h median clock, upstream public run-catalog analysis reports Flash-Next beating 27B on six of seven slippery games.',
                  'owner_kaggle_score_claim': False,
                  'promotion_to_submission': False,
              },
              'lora_round3': {
                  'status': 'REJECTED_BY_UPSTREAM_HELDOUT_GAMEPLAY',
                  'base_levels': 7,
                  'base_score': 20.780,
                  'round3_levels': 2,
                  'round3_score': 0.705,
                  'improved_games': '0/7',
              },
              'decision': {
                  'submit_anything': False,
                  'protect_owner_incumbent': True,
                  'keep_flash340_as_intermediate': True,
                  'next_gate': 'Actual competition-clean Flash-Next/Qwen3-VL model-behavior comparison on an authorized GPU route, followed by bounded public ARC runtime gain before any package promotion.'
              },
              'truth_scope': {
                  'offline_or_public_score_is_hidden_kaggle_score': False,
                  'upstream_submission_id_is_owner_receipt': False,
                  'save_run_is_submission': False,
                  'submission_is_leaderboard_score': False,
              }
          }
          out = pathlib.Path('arc3-sonpham-rank-lineage-audit.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: arc3-sonpham-rank-lineage-audit
          path: arc3-sonpham-rank-lineage-audit.json
          if-no-files-found: error
