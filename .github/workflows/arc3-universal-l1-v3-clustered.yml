name: ARC3 universal L1 v3 clustered repair

on:
  push:
    branches: [deus/arc3-universal-l1-v3-clustered-20260921]
    paths: [.github/workflows/arc3-universal-l1-v3-clustered.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        game: [dc22,tr87,ft09,ka59,lf52,sb26,re86,g50t,tn36,sc25,bp35,ar25,wa30]
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Cluster-aware public-observation L1 search
        env:
          GAME: ${{ matrix.game }}
        run: |
          python - <<'PY'
          import copy,hashlib,heapq,json,os,time
          from collections import Counter,deque
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          GAME=os.environ['GAME']; OUT=Path('verification'); OUT.mkdir()

          def fr(o): return np.asarray(o.frame[-1],dtype=np.uint8)
          def norm(o):
              a=fr(o).copy()
              if a.shape[0]>=4:
                  a[:2,:]=0; a[-2:,:]=0
              return a
          def fh(o): return hashlib.sha256(norm(o).tobytes()).hexdigest()
          def aids(o):
              out=[]
              for a in (getattr(o,'available_actions',None) or []):
                  try:v=int(a.value)
                  except Exception:
                      try:v=int(a)
                      except Exception:continue
                  if v not in out:out.append(v)
              return out
          def sig(act):
              aid,data=act
              return f"{aid}:{int(data.get('x',-1))}:{int(data.get('y',-1))}" if data else str(aid)
          def step(e,act):
              aid,data=act;am={a.value:a for a in e.action_space}
              if aid not in am:return None
              try:return e.step(am[aid],data=data)
              except Exception:return None
          def frame_delta(a,b):
              aa=norm(a);bb=norm(b)
              if aa.shape!=bb.shape:return 1.0
              return float(np.mean(aa!=bb))

          def object_points(o,cap=48):
              a=fr(o);H,W=a.shape
              bg=Counter(int(v) for v in a.ravel()).most_common(1)[0][0]
              seen=np.zeros((H,W),bool);out=[];used=set()
              for y in range(2,max(2,H-2)):
                  for x in range(W):
                      if seen[y,x] or int(a[y,x])==bg:continue
                      col=int(a[y,x]);st=[(x,y)];seen[y,x]=1;pts=[]
                      while st:
                          xx,yy=st.pop();pts.append((xx,yy))
                          for nx,ny in ((xx+1,yy),(xx-1,yy),(xx,yy+1),(xx,yy-1)):
                              if 0<=nx<W and 0<=ny<H and not seen[ny,nx] and int(a[ny,nx])==col:
                                  seen[ny,nx]=1;st.append((nx,ny))
                      if not (1<=len(pts)<=512):continue
                      xs=[p[0] for p in pts];ys=[p[1] for p in pts]
                      samples=[pts[0],pts[len(pts)//2],pts[-1],(int(round(sum(xs)/len(xs))),int(round(sum(ys)/len(ys))))]
                      for p in samples:
                          if p[1]<2 or p[1]>=H-2:continue
                          p=(int(p[0]),int(p[1]))
                          if p not in used:
                              used.add(p);out.append(p)
                              if len(out)>=cap:return out
              return out
          def lattice(o,stepn=12):
              a=fr(o);H,W=a.shape
              return [(x,y) for y in range(6,max(7,H-4),stepn) for x in range(4,W,stepn)]
          def click_points(o):
              out=[];used=set()
              for p in object_points(o)+lattice(o):
                  if p not in used:
                      used.add(p);out.append(p)
              return out[:64]
          def cands(o,mixed):
              av=aids(o);out=[]
              for a in av:
                  if 1<=a<=5 or a==7:out.append((a,None))
              if mixed and 6 in av:
                  out.extend((6,{'x':x,'y':y}) for x,y in click_points(o))
              return out

          def keyboard_macro_search(e0,o0,max_exp=120000,seconds=300,latent_depth=12):
              start=int(o0.levels_completed);t0=time.monotonic();exp=0;visible_seen={fh(o0)}
              q=deque([(copy.deepcopy(e0),o0,[])]);latent_nodes=0;visible_nodes=1;peak=1
              keys=[a for a in aids(o0) if 1<=a<=5 or a==7]
              while q and exp<max_exp and time.monotonic()-t0<seconds:
                  base_e,base_o,base_path=q.popleft();base_h=fh(base_o)
                  # Same-frame macro search with explicit bounded action-count summary.
                  lq=deque([(copy.deepcopy(base_e),base_o,[],tuple(0 for _ in keys),())])
                  lseen={(tuple(0 for _ in keys),())}
                  while lq and exp<max_exp and time.monotonic()-t0<seconds:
                      e,o,mp,counts,suffix=lq.popleft();latent_nodes+=1
                      if len(mp)>=latent_depth:continue
                      for aid in keys:
                          act=(aid,None);ee=copy.deepcopy(e);nf=step(ee,act);exp+=1
                          if nf is None:continue
                          npth=mp+[act]
                          if int(nf.levels_completed)>start:
                              return base_path+npth,{'cluster':'keyboard_latent_macro','expansions':exp,'visible_seen':len(visible_seen),'latent_nodes':latent_nodes,'seconds':time.monotonic()-t0,'peak':peak,'latent_depth':latent_depth}
                          st=getattr(nf.state,'value',str(nf.state))
                          if st in ('GAME_OVER','WIN'):continue
                          nh=fh(nf)
                          if nh!=base_h:
                              if nh not in visible_seen:
                                  visible_seen.add(nh);q.append((ee,nf,base_path+npth));visible_nodes+=1;peak=max(peak,len(q))
                              continue
                          cc=list(counts);idx=keys.index(aid);cc[idx]=min(6,cc[idx]+1);cc=tuple(cc)
                          ns=(suffix+(str(aid),))[-3:]
                          k=(cc,ns)
                          if k in lseen:continue
                          lseen.add(k);lq.append((ee,nf,npth,cc,ns))
              return None,{'cluster':'keyboard_latent_macro','expansions':exp,'visible_seen':len(visible_seen),'latent_nodes':latent_nodes,'seconds':time.monotonic()-t0,'peak':peak,'latent_depth':latent_depth}

          def mixed_beam_search(e0,o0,max_exp=120000,seconds=300,beam=2500):
              start=int(o0.levels_completed);t0=time.monotonic();exp=0;counter=0
              h0=fh(o0);heap=[(0.0,0,counter,copy.deepcopy(e0),o0,[],(),0)]
              seen={(h0,())};peak=1;latent_edges=0;trimmed=0
              while heap and exp<max_exp and time.monotonic()-t0<seconds:
                  pri,plen,_,e,o,path,suffix,nochange=heapq.heappop(heap);ph=fh(o)
                  for act in cands(o,True):
                      ee=copy.deepcopy(e);nf=step(ee,act);exp+=1
                      if nf is None:continue
                      npth=path+[act]
                      if int(nf.levels_completed)>start:
                          return npth,{'cluster':'mixed_soft_beam','expansions':exp,'seen':len(seen),'seconds':time.monotonic()-t0,'peak':peak,'latent_edges':latent_edges,'trimmed':trimmed,'beam':beam}
                      st=getattr(nf.state,'value',str(nf.state))
                      if st in ('GAME_OVER','WIN'):continue
                      nh=fh(nf);d=frame_delta(o,nf)
                      if nh==ph:
                          latent_edges+=1;nn=nochange+1
                          if nn>8:continue
                          ns=(suffix+(sig(act),))[-6:]
                      else:
                          nn=0;ns=()
                      k=(nh,ns)
                      if k in seen:continue
                      seen.add(k);counter+=1
                      # Prefer visible novelty and shorter routes; no-change chains get a soft penalty.
                      score=(len(npth)*0.02)+(nn*0.30)-(min(1.0,d)*12.0)
                      heapq.heappush(heap,(score,len(npth),counter,ee,nf,npth,ns,nn));peak=max(peak,len(heap))
                  if len(heap)>beam*2:
                      heap=heapq.nsmallest(beam,heap);heapq.heapify(heap);trimmed+=1
              return None,{'cluster':'mixed_soft_beam','expansions':exp,'seen':len(seen),'seconds':time.monotonic()-t0,'peak':peak,'latent_edges':latent_edges,'trimmed':trimmed,'beam':beam}

          arc=arc_agi.Arcade(operation_mode=OperationMode.NORMAL)
          env=arc.make(GAME,seed=0,save_recording=False,include_frame_data=True)
          if env is None:raise RuntimeError('ENV_UNAVAILABLE')
          obs=env.observation_space;av=aids(obs);mixed=(6 in av)
          if mixed:path,meta=mixed_beam_search(env,obs)
          else:path,meta=keyboard_macro_search(env,obs)
          discovery={'game':GAME,'result':'FOUND' if path else 'MISS','path_len':None if path is None else len(path),'path':path,'search':meta,'available_actions':av,'protocol':'PUBLIC_OBSERVATION_CLUSTERED_V3','cluster':'mixed' if mixed else 'keyboard','game_source_inspected_by_solver':False,'external_route_used':False,'environment_clone_used_for_search':True,'hidden_state_read':False}
          print('V3_DISCOVERY='+json.dumps(discovery,separators=(',',':')))
          receipt={'discovery':discovery,'online':None}
          if path:
              oa=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
              src='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/blob/'+os.environ['GITHUB_SHA']+'/.github/workflows/arc3-universal-l1-v3-clustered.yml'
              cid=oa.open_scorecard(source_url=src,tags=['DEUS',GAME,'universal-l1-v3','clustered'])
              oe=oa.make(GAME,seed=0,scorecard_id=cid,save_recording=False,include_frame_data=True)
              if oe is None:raise RuntimeError('ONLINE_ENV_UNAVAILABLE')
              oo=oe.observation_space;used=0
              for i,act in enumerate(path,1):
                  nf=step(oe,act)
                  if nf is None:raise RuntimeError('ONLINE_STEP_FAIL_'+str(i))
                  oo=nf;used=i
                  if int(oo.levels_completed)>=1:break
              card=oa.close_scorecard(cid)
              receipt['online']={'result':'PASS' if int(oo.levels_completed)>=1 else 'FAIL','levels_completed':int(oo.levels_completed),'win_levels':int(getattr(oo,'win_levels',0) or 0),'state':getattr(oo.state,'value',str(oo.state)),'actions_executed':used,'scorecard_id':cid,'scorecard_score':None if card is None else card.score,'route_sha256':hashlib.sha256(json.dumps(path,sort_keys=True,separators=(',',':')).encode()).hexdigest(),'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'scope':'LEVEL_1_ONLY','competition_hidden_score_claim':False}
          (OUT/'receipt.json').write_text(json.dumps(receipt,indent=2))
          print('V3_RECEIPT='+json.dumps(receipt,separators=(',',':')))
          if path is None:raise RuntimeError('L1_NOT_FOUND')
          if receipt['online'] is None or receipt['online']['result']!='PASS':raise RuntimeError('ONLINE_VERIFY_FAIL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-v3-${{ matrix.game }}
          path: verification/
          retention-days: 30
