name: ARC3 Tycho-KHUB representation adapter test

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/tycho_khub_text_tool_adapter.py
      - .github/workflows/arc3-tycho-khub-adapter-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Execute fail-closed representation tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, json, pathlib
          path = pathlib.Path('public_benchmark/arc3/kaggle_candidates/tycho_khub_text_tool_adapter.py')
          spec = importlib.util.spec_from_file_location('adapter', path)
          adapter = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(adapter)

          tools = [{
            'name': 'arc_action',
            'description': 'Choose an ARC environment action',
            'schema': {
              'type': 'object',
              'properties': {
                'action': {'type': 'string', 'minLength': 1},
                'x': {'type': ['integer', 'null'], 'minimum': 0, 'maximum': 63},
                'y': {'type': ['integer', 'null'], 'minimum': 0, 'maximum': 63},
              },
              'required': ['action'],
              'additionalProperties': False,
            }
          }]

          contract = adapter.render_tool_contract(tools)
          assert '<tools>' in contract and 'arc_action' in contract
          assert adapter.parse_tool_calls('plain text', tools) == []

          good = '<tool_call>\n{"name":"arc_action","arguments":{"action":"ACTION1","x":2,"y":null}}\n</tool_call>'
          calls = adapter.parse_tool_calls(good, tools)
          assert len(calls) == 1
          assert calls[0]['name'] == 'arc_action'
          assert calls[0]['input'] == {'action': 'ACTION1', 'x': 2, 'y': None}
          assert calls[0]['id'].startswith('localcall-')
          bridged = adapter.bridge_response(good, tools)
          assert bridged['text'] == '' and bridged['stop'] == 'tool_call'

          bad_cases = [
            '<tool_call>{bad}</tool_call>',
            '<tool_call>{"name":"unknown","arguments":{}}</tool_call>',
            '<tool_call>{"name":"arc_action","arguments":[]}</tool_call>',
            '<tool_call>{"name":"arc_action","arguments":{}}</tool_call>',
            '<tool_call>{"name":"arc_action","arguments":{"action":1}}</tool_call>',
            '<tool_call>{"name":"arc_action","arguments":{"action":"ACTION1","x":"2"}}</tool_call>',
            '<tool_call>{"name":"arc_action","arguments":{"action":"ACTION1","x":64}}</tool_call>',
            '<tool_call>{"name":"arc_action","arguments":{"action":"ACTION1","extra":true}}</tool_call>',
            '<tool_call>{"name":"arc_action","arguments":{}}</tool_call><tool_call>{"name":"arc_action","arguments":{}}</tool_call>',
          ]
          rejected = 0
          for case in bad_cases:
            try:
              adapter.parse_tool_calls(case, tools)
            except ValueError:
              rejected += 1
          assert rejected == len(bad_cases)

          receipt = {
            'schema': 'deus.arc3.tycho_khub_text_adapter_test.v2',
            'adapter_path': str(path),
            'contract_rendered': True,
            'valid_tool_call_roundtrip': True,
            'schema_argument_validation_verified': True,
            'invalid_cases_rejected': rejected,
            'fail_closed': True,
            'semantic_barrier': 'TOOL_SCHEMA_VALIDATED_BEFORE_TYCHO_CALL_PROMOTION',
            'gpu_model_output_verified': False,
            'kaggle_offline_execution_verified': False,
            'hidden_kaggle_score_claim': False,
            'owner_score_claim': False,
            'submission_attempted': False,
            'verdict': 'CPU_SCHEMA_GUARDED_REPRESENTATION_ADAPTER_VERIFIED_GPU_GATE_REMAINS'
          }
          out = pathlib.Path('public_benchmark/arc3/kaggle_candidates/tycho_khub_text_tool_adapter_test_receipt.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: arc3-tycho-khub-adapter-test
          path: public_benchmark/arc3/kaggle_candidates/tycho_khub_text_tool_adapter_test_receipt.json
          if-no-files-found: error
