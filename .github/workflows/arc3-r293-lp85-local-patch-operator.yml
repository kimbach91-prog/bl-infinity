name: ARC3 R293 lp85 local patch operator diagnostic
on:
  push:
    branches: [deus/r278-object-region-phase-diagnostic-20260923]
    paths:
      - .github/workflows/arc3-r293-lp85-local-patch-operator.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r293-lp85:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 20}
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify R293 source fixed before staging diagnostic traces
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 9c5ea290da7d2a4b01caeae907b7f32817fd212f^{commit}
          git merge-base --is-ancestor 9c5ea290da7d2a4b01caeae907b7f32817fd212f HEAD
          test "$(git show 9c5ea290da7d2a4b01caeae907b7f32817fd212f:public_benchmark/arc3/kaggle_candidates/public_lp85_local_patch_operator_diag_293.py | sha256sum | cut -d' ' -f1)" = "$(sha256sum public_benchmark/arc3/kaggle_candidates/public_lp85_local_patch_operator_diag_293.py | cut -d' ' -f1)"
      - name: Stage exact lp85 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 9); do f="lp85-305b61c3_p${p}_events.jsonl"; cp "upstream-duck/example-run/artifacts/$f" "public_trace/$f"; done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 10
          ! find public_trace -maxdepth 1 -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Compile and execute bounded local operator diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py \
            public_benchmark/arc3/kaggle_candidates/public_ui_mask_markov_diag_268.py \
            public_benchmark/arc3/kaggle_candidates/public_relational_topology_diag_274.py \
            public_benchmark/arc3/kaggle_candidates/public_action_canonical_topology_diag_275.py \
            public_benchmark/arc3/kaggle_candidates/public_object_region_phase_diag_278.py \
            public_benchmark/arc3/kaggle_candidates/public_lp85_local_patch_operator_diag_293.py
          args=(); for f in $(find public_trace -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_lp85_local_patch_operator_diag_293.py "${args[@]}" --output r293-lp85.json 2> >(tee r293-runtime.txt >&2) | tee r293-stdout.txt
      - name: Independent truth-boundary audit and hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r293-lp85.json'))
          assert d['schema']=='deus/arc3-r293-lp85-local-patch-operator-diagnostic/1'
          assert d['mechanism']['radius']==1
          assert d['protocol']['fit']=='p0-p4 only'
          assert d['protocol']['diagnostic']=='p5-p9 only'
          assert d['protocol']['p10_p19_staged_or_read'] is False
          assert d['protocol']['threshold_sweep'] is False
          assert d['protocol']['promotion_in_r293'] is False
          assert d['truth']['p10_p19_read'] is False
          assert d['truth']['pixel_signal_is_not_exact_frame_gain'] is True
          assert d['truth']['solver_promotion'] is False
          assert d['truth']['kaggle_execution'] is False
          assert d['truth']['competition_submission'] is False
          print(json.dumps({'verdict':d['verdict'],'fit':d['fit'],'validation':d['validation'],'delta':d['delta']},sort_keys=True))
          PY
          sha256sum r293-lp85.json r293-runtime.txt r293-stdout.txt public_trace/SHA256SUMS.txt > R293_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r293-lp85-local-patch-operator
          path: |
            r293-lp85.json
            r293-runtime.txt
            r293-stdout.txt
            R293_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
