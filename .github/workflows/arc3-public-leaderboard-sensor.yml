name: ARC3 public leaderboard sensor

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - .github/workflows/arc3-public-leaderboard-sensor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public leaderboard JSON endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL='https://tonghuikang--arc3-leaderboard-monitor-get-history.modal.run'
          start="$(date +%s%3N)"
          code="$(curl -L --max-time 30 --retry 2 --retry-delay 1 -sS -o leaderboard.json -w '%{http_code}' "$URL" || true)"
          latency="$(( $(date +%s%3N) - start ))"
          export code latency
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          p=Path("leaderboard.json")
          body=p.read_bytes() if p.exists() else b""
          code=int(os.environ["code"] or 0)
          latency=int(os.environ["latency"])
          parsed=None
          if body:
              try:
                  parsed=json.loads(body)
              except Exception:
                  parsed=None
          positions=(parsed or {}).get("positions") if isinstance(parsed,dict) else None
          schema_ok=isinstance(positions,list) and all(
              isinstance(x,list) and len(x)>=5 for x in positions[:50]
          )
          top=[]
          if schema_ok:
              for row in positions[:50]:
                  top.append({
                      "team_id":str(row[0]),
                      "team_name":str(row[1]),
                      "position":int(row[2]),
                      "submission_count":str(row[3]),
                      "score":str(row[4]),
                  })
          names={
              "Tufa Labs","Daniel Franzen","NVARC3","Lord Han Solo",
              "Tong Hui Kang","Ebi","Third Intelligence",
              "Son Pham & Mark Barney","mostik.ai",
          }
          targets=[x for x in top if x["team_name"] in names]
          receipt={
              "schema":"deus/arc3-public-leaderboard-sensor/1",
              "source":{
                  "endpoint":"tonghuikang public Modal get_history",
                  "source_repo":"tonghuikang/arc3",
                  "source_commit":"d4ee21c99f4dc4a926f9fea34dae29172ee3c604",
                  "source_license":"NONE_DECLARED_NO_CODE_COPIED",
              },
              "http_status":code,
              "latency_ms":latency,
              "response_sha256":hashlib.sha256(body).hexdigest() if body else None,
              "schema_ok":schema_ok,
              "team_count":len(positions) if schema_ok else 0,
              "top50":top,
              "targets":targets,
              "truth":{
                  "public_mirror_not_official_kaggle_readback":True,
                  "provider_execution": code==200 and schema_ok,
                  "no_auth_used":True,
                  "no_competition_submission":True,
                  "submission_quota_spent":False,
                  "candidate_promoted":False,
              },
          }
          Path("arc3-public-leaderboard-sensor.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          print(json.dumps({
              "http_status":code,
              "schema_ok":schema_ok,
              "team_count":receipt["team_count"],
              "top10":top[:10],
              "targets":targets,
              "response_sha256":receipt["response_sha256"],
          },indent=2))
          if not (code==200 and schema_ok):
              raise SystemExit(2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-public-leaderboard-sensor-receipt
          path: arc3-public-leaderboard-sensor.json
          if-no-files-found: error
          retention-days: 30
