name: DEUS Wave 1 Tool Substrate Pretest

on:
  pull_request:
    paths:
      - '.github/workflows/deus-wave1-tool-substrate-pretest.yml'
      - 'public_benchmark/wave1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pretest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEUS benchmark surface
        uses: actions/checkout@v4

      - name: Guard self-test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          python public_benchmark/wave1/tool_substrate_guard.py self-test | tee receipts/tool-substrate-guard.json

      - name: Validate access manifest and issue opaque handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          p=pathlib.Path("public_benchmark/wave1/OFFICIAL_ACCESS_STATE.json")
          x=json.loads(p.read_text())
          assert x["schema"]=="DEUS_WAVE1_OFFICIAL_ACCESS_STATE_V1"
          assert x["arc_agi_3_private"]["access_state"]=="USER_ACCOUNT_RULE_ACCEPTANCE_REQUIRED"
          assert x["frontiermath_erdos"]["access_state"]=="PUBLIC_SOURCE_AVAILABLE"
          assert x["hle_rolling"]["access_state"]=="GATED_DATASET_REQUIRES_LOGGED_IN_ACCEPTANCE_AND_CONTACT_SHARE"
          handoff={
            "schema":"DEUS_WAVE1_PRETEST_HANDOFF_V1",
            "source_manifest_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "tool_substrate":"GPT_TOOL_SUBSTRATE",
            "semantic_executor":"DEUS_BENCH_EXECUTOR",
            "gpt_semantic_test_access":False,
            "hard_test_eligible":False,
            "lane_gates":{
              "ARC_AGI_3_PRIVATE":["OFFICIAL_KAGGLE_RULE_ACCEPTANCE","DEUS_OFFLINE_AGENT_FROZEN"],
              "FRONTIERMATH_ERDOS":["DEUS_GENERAL_REASONING_PROOF_EXECUTOR_RECEIPT"],
              "HLE_ROLLING":["HF_GATED_DATASET_ACCEPTANCE","DEUS_MODEL_ENDPOINT_RECEIPT"]
            },
            "claim_boundary":"PRETEST_READY is not a benchmark score."
          }
          pathlib.Path("receipts/pretest-handoff.json").write_text(json.dumps(handoff,indent=2)+"\n")
          print(json.dumps(handoff,indent=2))
          PY

      - name: Checkout official FrontierMath Erdős harness
        uses: actions/checkout@v4
        with:
          repository: epoch-research/LeanOpenProblems
          ref: af3b82f9d2fd38bea33d59e637b6b4eff54a464c
          path: vendor/LeanOpenProblems

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Revalidate FrontierMath Erdős non-semantic harness
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/LeanOpenProblems
          uv sync
          uv run pytest -q tests/test_erdos.py
          cd ../..
          python - <<'PY'
          import json, pathlib
          r={
            "lane":"FRONTIERMATH_ERDOS",
            "phase":"PREP",
            "source_repo":"epoch-research/LeanOpenProblems",
            "source_commit":"af3b82f9d2fd38bea33d59e637b6b4eff54a464c",
            "harness_test":"tests/test_erdos.py",
            "harness_state":"PASS",
            "semantic_test_executed":False,
            "next_gate":"DEUS_GENERAL_REASONING_PROOF_EXECUTOR_RECEIPT"
          }
          pathlib.Path("receipts/frontiermath-pretest.json").write_text(json.dumps(r,indent=2)+"\n")
          PY

      - name: Build pretest receipt bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, hashlib, json, pathlib
          rows=[]
          for p in sorted(glob.glob("receipts/*.json")):
            b=pathlib.Path(p).read_bytes()
            rows.append({"file":p,"sha256":hashlib.sha256(b).hexdigest(),"payload":json.loads(b)})
          out={
            "schema":"DEUS_WAVE1_GPT_TOOL_SUBSTRATE_PRETEST_RECEIPT_V1",
            "state":"PRETEST_TOOL_SUBSTRATE_VERIFIED_HARD_TEST_HELD",
            "gpt_role":"TOOL_CONTROL_PLANE",
            "deus_role":"SEMANTIC_BENCHMARK_EXECUTOR",
            "external_model_delegated_solving":False,
            "receipts":rows
          }
          pathlib.Path("receipts/wave1-pretest-receipt.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY

      - name: Upload pretest receipts
        uses: actions/upload-artifact@v4
        with:
          name: deus-wave1-tool-substrate-pretest
          path: receipts/*.json
          if-no-files-found: error
