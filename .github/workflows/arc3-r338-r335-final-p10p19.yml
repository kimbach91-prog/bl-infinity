name: ARC3 R338 frozen R335 final p10-p19 audit

on:
  push:
    branches: [deus/r335-sourcefree-gate-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_r335_final_p10p19_audit_338.py
      - .github/workflows/arc3-r338-r335-final-p10p19.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/public_benchmark/arc3/kaggle_candidates:${{ github.workspace }}/frozen-r330/public_benchmark/arc3/kaggle_candidates
  R336_FREEZE: "787eeda8b9b233aaf250dc4c2401b117c8b95232"
  TUFA_PIN: "7652836056c59e044f093e3c13ed7438c814169e"

jobs:
  final-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen candidate source bytes unchanged
        shell: bash
        run: |
          set -euo pipefail
          for p in             public_benchmark/arc3/kaggle_candidates/public_generic_relational_transducer_335.py             public_benchmark/arc3/kaggle_candidates/public_r335_sourcefree_p0p4_falsifier_336.py
          do
            git show "${R336_FREEZE}:${p}" > "/tmp/frozen-$(basename "$p")"
            cmp -s "$p" "/tmp/frozen-$(basename "$p")"
            printf '%s  %s\n' "$(sha256sum "$p" | awk '{print $1}')" "$p"
          done

      - name: Checkout frozen dependency ancestry
        uses: actions/checkout@v4
        with:
          repository: kimbach91-prog/bl-infinity
          ref: 7358fa568414a96a2acf864a450ecc078bd8c433
          path: frozen-r330
          persist-credentials: false

      - name: Checkout pinned public traces
        uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Stage p0-p4 fit and p10-p19 final only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fit final
          for p in $(seq 0 4); do
            f="tr87-cd924810_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "fit/${f}"
          done
          for p in $(seq 10 19); do
            f="tr87-cd924810_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "final/${f}"
          done
          test "$(find fit -name '*_events.jsonl' -type f | wc -l)" -eq 5
          test "$(find final -name '*_events.jsonl' -type f | wc -l)" -eq 10
          ! find fit final -name '*_p[5-9]_events.jsonl' | grep -q .

      - name: Execute immutable one-shot final audit
        shell: bash
        run: |
          set -euo pipefail
          fitargs=(); evalargs=()
          for p in $(seq 0 4); do fitargs+=(--fit "fit/tr87-cd924810_p${p}_events.jsonl"); done
          for p in $(seq 10 19); do evalargs+=(--eval "final/tr87-cd924810_p${p}_events.jsonl"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_r335_final_p10p19_audit_338.py             "${fitargs[@]}" "${evalargs[@]}"             --output r338-r335-final-p10p19.json             2> >(tee runtime.txt >&2) | tee stdout.txt

      - name: Independent final boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open("r338-r335-final-p10p19.json"))
          assert d["schema"]=="deus/arc3-r338-r335-final-p10p19-audit/1"
          assert d["protocol"]["fit"]=="public p0-p4 only"
          assert d["protocol"]["final_eval"]=="public p10-p19 one-shot"
          assert d["protocol"]["p5_p9_staged_or_read_by_this_audit"] is False
          assert d["protocol"]["retuning_after_final_audit"] is False
          assert d["truth"]["kaggle_submission"] is False
          assert d["truth"]["post_audit_retune_allowed"] is False
          print(json.dumps({
            "verdict":d["verdict"],
            "fit":d["fit"],
            "metrics":d["metrics"],
            "by_trace":d["by_trace"]
          },sort_keys=True))
          PY
          sha256sum r338-r335-final-p10p19.json runtime.txt stdout.txt > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: r338-r335-final-p10p19
          path: |
            r338-r335-final-p10p19.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
          retention-days: 30
