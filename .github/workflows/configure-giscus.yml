name: Configure giscus IDs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/configure-giscus.yml"

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve repository and Page Comments category IDs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(gh api graphql -f query='query { repository(owner:"kimbach91-prog", name:"bl-infinity") { id discussionCategories(first:25) { nodes { id name } } } }')
          repo_id=$(printf '%s' "$payload" | jq -r '.data.repository.id')
          category_id=$(printf '%s' "$payload" | jq -r '.data.repository.discussionCategories.nodes[] | select(.name == "Page Comments") | .id' | head -n1)
          test -n "$repo_id" && test "$repo_id" != "null"
          test -n "$category_id" && test "$category_id" != "null"
          echo "Resolved repo_id=$repo_id"
          echo "Resolved Page Comments category_id=$category_id"
          python - "$repo_id" "$category_id" <<'PY'
          from pathlib import Path
          import re, sys
          repo_id, category_id = sys.argv[1], sys.argv[2]
          p = Path('bl.config.yml')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(?m)^  enabled:\s*false\s*$', '  enabled: true', s)
          s = re.sub(r'(?m)^  repo_id:\s*.*$', f'  repo_id: {repo_id}', s)
          s = re.sub(r'(?m)^  category_id:\s*.*$', f'  category_id: {category_id}', s)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit giscus configuration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bl.config.yml; then
            echo "No config changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bl.config.yml
          git commit -m "Configure giscus for Page Comments"
          git push origin main
