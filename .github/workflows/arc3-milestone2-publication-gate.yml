name: ARC3 Milestone 2 publication gate

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/prepare_milestone2_publication.py
      - public_benchmark/arc3/kaggle_candidates/flash_next_340/**
      - .github/workflows/arc3-milestone2-publication-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-static-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct exact full candidate source package
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public_benchmark/arc3/kaggle_candidates/flash_next_340
          python "$ROOT/upstream_build_flash_next_package.py" \
            --kernel-id deusplaceholder/deus-arc-agi3-m2-publication-candidate \
            --mode full \
            --concurrency 8 \
            --analyzer-timeout 900 \
            --full-runtime-seconds 7200 \
            --output-dir public_benchmark/arc3/.m2-built

      - name: Prepare public-intent milestone bundle and fail-closed receipt
        shell: bash
        run: |
          set -euo pipefail
          python public_benchmark/arc3/kaggle_candidates/prepare_milestone2_publication.py \
            --built-package public_benchmark/arc3/.m2-built \
            --source-root public_benchmark/arc3/kaggle_candidates/flash_next_340 \
            --repo-root . \
            --output-dir public_benchmark/arc3/.m2-publication \
            --receipt arc3-m2-publication-receipt.json \
            --concurrency 8 \
            --games 25 \
            --runtime-seconds 7200 \
            --analyzer-timeout 900

      - name: Verify milestone truth boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('arc3-m2-publication-receipt.json'))
          assert r['schema']=='deus/arc3-milestone2-publication-gate/1'
          assert r['gate']=='PUBLICATION_READY_STATIC_REQUIRES_KAGGLE_PUBLIC_LICENSE_READBACK'
          assert all(r['checks'].values())
          m=r['publication_manifest']
          assert m['configured_runtime']['conservative_upper_bound_seconds']==29700
          assert m['configured_runtime']['conservative_upper_bound_seconds'] < 9*60*60
          t=r['truth']
          assert t['kaggle_publication_executed'] is False
          assert t['kaggle_public_visibility_readback'] is False
          assert t['kaggle_license_selected'] is False
          assert t['kaggle_license_readback'] is False
          assert t['competition_submission_attempted'] is False
          assert t['submission_quota_spent'] is False
          assert t['milestone_prize_eligibility_claim'] is False
          meta=json.load(open('public_benchmark/arc3/.m2-publication/kernel-metadata.json'))
          assert meta['is_private'] is False
          assert meta['enable_gpu'] is True
          assert meta['enable_internet'] is False
          assert meta['machine_shape']=='NvidiaRtxPro6000'
          assert 'arc-prize-2026-arc-agi-3' in meta['competition_sources']
          print(json.dumps({
            'gate':r['gate'],
            'notebook_sha256':m['notebook_sha256'],
            'semantic_sha256':m['notebook_semantic_sha256'],
            'runtime_upper_bound_hours':m['configured_runtime']['conservative_upper_bound_seconds']/3600,
            'provider_publication_executed':t['kaggle_publication_executed'],
            'license_readback':t['kaggle_license_readback'],
            'quota_spent':t['submission_quota_spent'],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: arc3-milestone2-publication-bundle
          path: |
            public_benchmark/arc3/.m2-publication/**
            arc3-m2-publication-receipt.json
          if-no-files-found: error
          retention-days: 30
