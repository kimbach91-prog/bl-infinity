name: ARC3 R285 phase-conditioned re86 repair
on:
  push:
    branches: [deus/r270-ui-mask-frozen-gate-20260923]
    paths:
      - .github/workflows/arc3-r285-phase-conditioned-re86.yml
      - public_benchmark/arc3/kaggle_candidates/public_phase_conditioned_local_delta_285.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r285-re86:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage exact re86 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 9); do
            f="re86-8af5384d_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/$f" "public_trace/$f"
          done
          test "$(find public_trace -type f | wc -l)" -eq 10
          ! find public_trace -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_phase_conditioned_local_delta_285.py
      - name: Execute p0-p4 LOTO selection then p5-p9 frozen diagnostic
        shell: bash
        run: |
          args=()
          for f in public_trace/*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_phase_conditioned_local_delta_285.py "${args[@]}" --output r285-re86.json | tee r285-re86.stdout.txt
      - name: Truth-boundary audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r285-re86.json'))
          assert d['protocol']['selection']=='leave-one-trace-out p0-p4 only'
          assert d['protocol']['diagnostic']=='p5-p9 only'
          assert d['protocol']['p10_p19_staged'] is False
          assert d['truth']['p10_p19_read'] is False
          assert d['truth']['source_free'] is True
          assert d['truth']['competition_submission'] is False
          print(json.dumps({'verdict':d['result']['verdict'],'chosen':d['result']['chosen']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r285-re86-phase-conditioned
          path: |
            r285-re86.json
            r285-re86.stdout.txt
          retention-days: 30
