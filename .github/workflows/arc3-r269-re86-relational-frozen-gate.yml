name: ARC3 R269 re86 frozen relational gate
on:
  push:
    branches: [deus/r269-re86-relational-frozen-gate-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_relational_frozen_gate_269.py
      - .github/workflows/arc3-r269-re86-relational-frozen-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate-r269-re86:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py public_benchmark/arc3/kaggle_candidates/public_action_conditional_markov_gate_251.py public_benchmark/arc3/kaggle_candidates/public_component_delta_operator_254.py public_benchmark/arc3/kaggle_candidates/public_selective_object_transport_257.py public_benchmark/arc3/kaggle_candidates/public_contextual_object_interaction_gate_266.py public_benchmark/arc3/kaggle_candidates/public_interaction_separator_diag_267.py public_benchmark/arc3/kaggle_candidates/public_relational_frozen_gate_269.py
      - name: Stage re86 p0-p19
        shell: bash
        run: |
          set -euo pipefail; mkdir -p public_trace
          for p in $(seq 0 19); do f="re86-8af5384d_p${p}_events.jsonl"; test -s "upstream-duck/example-run/artifacts/$f"; cp "upstream-duck/example-run/artifacts/$f" "public_trace/$f"; done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute R269 gate
        shell: bash
        run: |
          set -euo pipefail; args=(); for f in public_trace/re86-8af5384d_p*_events.jsonl; do args+=(--input "$f"); done; test "${#args[@]}" -eq 40
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_relational_frozen_gate_269.py "${args[@]}" --output r269-re86-frozen.json 2> >(tee r269-runtime.txt >&2) | tee r269-stdout.txt
      - name: Verify truth boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('r269-re86-frozen.json').read_text()); assert d['schema']=='deus/arc3-r269-relational-frozen-gate/1'
          t=d['truth']; assert t['public_trace_only'] and not t['game_source_read']; assert t['selection_uses_p0_p9_only'] and t['p10_p19_never_updates_selection_or_model']; assert not t['independent_generalization_claim'] and not t['kaggle_execution'] and not t['competition_submission'] and not t['submission_quota_spent']
          h=d['heldout']; verdict='PASS_NONDOMINATED_PUBLIC_OFFLINE' if d['non_dominated_source_side_gain'] else 'NO_PROMOTION'
          Path('r269-verdict.json').write_text(json.dumps({'verdict':verdict,'selection_replay':d['selection_replay'],'heldout':h,'truth_lane':'PUBLIC_OFFLINE_PUBLIC_DEVELOPMENT_REUSED'},indent=2,sort_keys=True)+'\n'); print(Path('r269-verdict.json').read_text())
          PY
          sha256sum r269-re86-frozen.json r269-verdict.json r269-runtime.txt r269-stdout.txt public_trace/SHA256SUMS.txt > R269_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r269-re86-relational-frozen-gate
          path: |
            r269-re86-frozen.json
            r269-verdict.json
            r269-runtime.txt
            r269-stdout.txt
            R269_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
