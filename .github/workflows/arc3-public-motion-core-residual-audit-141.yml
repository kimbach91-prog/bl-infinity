name: ARC3 public motion-core residual audit 141

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py
      - public_benchmark/arc3/kaggle_candidates/public_object_role_transition_prequential_138.py
      - public_benchmark/arc3/kaggle_candidates/public_unique_component_motion_audit_140.py
      - public_benchmark/arc3/kaggle_candidates/public_motion_core_residual_audit_141.py
      - .github/workflows/arc3-public-motion-core-residual-audit-141.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-core-residual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_object_role_transition_prequential_138.py \
            public_benchmark/arc3/kaggle_candidates/public_unique_component_motion_audit_140.py \
            public_benchmark/arc3/kaggle_candidates/public_motion_core_residual_audit_141.py
          cd public_benchmark/arc3/kaggle_candidates
          python public_motion_core_residual_audit_141.py --self-test \
            --output "$GITHUB_WORKSPACE/motion-core-residual-selftest-141.json"
      - name: Download exact pinned public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for f in \
            ar25-0c556536_p0_events.jsonl \
            ar25-0c556536_p10_events.jsonl \
            ar25-0c556536_p11_events.jsonl
          do
            curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"
            test -s "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute motion-core residual diagnostic
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_motion_core_residual_audit_141.py \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p0_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p10_events.jsonl" \
            --input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p11_events.jsonl" \
            --output "$GITHUB_WORKSPACE/motion-core-residual-public-141.json"
      - name: Enforce diagnostic truth boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('motion-core-residual-public-141.json'))
          assert d['schema']=='deus/arc3-public-motion-core-residual-audit/1'
          assert d['rung']==141
          assert d['diagnostic_gate']=='MOTION_CORE_RESIDUAL_CHARACTERIZED'
          assert d['aggregate']['transitions']==823
          t=d['truth']
          assert t['diagnostic_only'] is True
          assert t['outcome_used_retrospectively'] is True
          assert t['solver_behavior_gain_claim'] is False
          assert t['model_execution'] is False
          assert t['gpu_execution'] is False
          assert t['kaggle_execution'] is False
          assert t['submission_quota_spent'] is False
          print(json.dumps({'rung':141,'aggregate':d['aggregate'],'truth':'PUBLIC_MOTION_CORE_RESIDUAL_DIAGNOSTIC_ONLY'},sort_keys=True))
          PY
      - name: Upload rung 141 diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-motion-core-residual-audit-141
          path: |
            motion-core-residual-public-141.json
            motion-core-residual-selftest-141.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
