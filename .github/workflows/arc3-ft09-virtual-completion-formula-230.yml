name: ARC3 ft09 virtual completion formula 230
on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_virtual_completion_formula_gate_230.py
      - .github/workflows/arc3-ft09-virtual-completion-formula-230.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate-ft09-virtual-completion-formula:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_ft09_virtual_completion_formula_gate_230.py
      - name: Download exact ft09 p0..p19 public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'; game='ft09-0d8bbf25'
          for p in $(seq 0 19); do f="${game}_p${p}_events.jsonl"; curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"; test -s "public_trace/$f"; done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute virtual completion formula gate
        run: |
          set -euo pipefail
          args=(); for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          PYTHONPATH=public_benchmark/arc3/kaggle_candidates python public_benchmark/arc3/kaggle_candidates/public_ft09_virtual_completion_formula_gate_230.py "${args[@]}" --output r230-ft09-virtual-completion-formula.json
      - name: Verify truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r230-ft09-virtual-completion-formula.json'))
          assert d['schema']=='deus/arc3-ft09-virtual-completion-formula/1'
          t=d['truth'];assert t['formula_selection_excludes_p10_p19'] is True;assert t['heldout_never_updates_model_or_selection'] is True
          assert t['veto_can_only_abstain'] is True;assert t['r225_precedence_preserved'] is True;assert t['kaggle_execution'] is False
          assert d.get('promotion',{}).get('solver_promotion',False) is False
          print(json.dumps({'selection':d['selection'].get('selected'),'config':d['selection'].get('selected_config'),'refit':d.get('refit'),'heldout':d.get('heldout'),'gate':d['gate']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r230-ft09-virtual-completion-formula
          path: |
            r230-ft09-virtual-completion-formula.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
