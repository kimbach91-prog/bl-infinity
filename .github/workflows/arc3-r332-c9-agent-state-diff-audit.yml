name: ARC3 R332 C9 agent-state package diff audit
on:
  push:
    branches: [deus/r332-agent-state-diff-audit-20260923]
    paths:
      - .github/workflows/arc3-r332-c9-agent-state-diff-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: '4528b4a67c822e86f79e9f1a0d9724bc9cd6eea9'
      IDEMPOTENCY_KEY: 'R332-C9-AGENT-STATE-DIFF-20260923-001'
      GAME_ID: 'tr87-cd924810'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          unexpected="$(git diff --name-only "$SOURCE_SHA"..HEAD | grep -v '^.github/workflows/arc3-r332-c9-agent-state-diff-audit.yml$' || true)"
          test -z "$unexpected" || { echo "Unexpected delta from frozen source: $unexpected" >&2; exit 1; }
      - name: Build matched base and state packages offline
        shell: bash
        run: |
          set -euo pipefail
          B=public_benchmark/arc3/kaggle_candidates/flash_next_340/upstream_build_flash_next_package.py
          python "$B" \
            --kernel-id lmkimbch/deus-arc-agi3-r332-base-tr87 \
            --mode preflight --max-games 1 --concurrency 1 --game-id "$GAME_ID" \
            --runtime-seconds 1200 --terminal-grace-seconds 120 --analyzer-timeout 900 \
            --output-dir public_benchmark/arc3/kaggle_candidates/flash_next_340/build/r332-base
          python "$B" \
            --kernel-id lmkimbch/deus-arc-agi3-r332-state-tr87 \
            --mode preflight --max-games 1 --concurrency 1 --game-id "$GAME_ID" \
            --runtime-seconds 1200 --terminal-grace-seconds 120 --analyzer-timeout 900 \
            --agent-state-patch \
            --output-dir public_benchmark/arc3/kaggle_candidates/flash_next_340/build/r332-state
      - name: Differential audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path

          root=Path('public_benchmark/arc3/kaggle_candidates/flash_next_340/build')
          base_dir=root/'r332-base'; state_dir=root/'r332-state'
          base_nb=next(base_dir.glob('*.ipynb')); state_nb=next(state_dir.glob('*.ipynb'))
          b=json.loads(base_nb.read_text()); s=json.loads(state_nb.read_text())
          assert len(b['cells'])==len(s['cells'])
          required_markers=[
            'PATCH_NAME = "reasoning-world-model-v1"',
            'def patch_tool_agent(',
            'FLASH_AGENT_STATE_PATCH',
            'FLASH_AGENT_OVERLAY_READY',
            'FLASH_AGENT_OVERLAY_REASSERTED',
            'FLASH_AGENT_OVERLAY_IMPORTED',
          ]
          bt='\n'.join(''.join(c.get('source',[])) for c in b['cells'])
          st='\n'.join(''.join(c.get('source',[])) for c in s['cells'])
          assert all(m not in bt for m in required_markers)
          assert all(m in st for m in required_markers)
          diff=[]; code_diff=[]
          for i,(bc,sc) in enumerate(zip(b['cells'],s['cells'])):
              if bc==sc: continue
              diff.append(i)
              assert bc.get('cell_type')==sc.get('cell_type')
              if bc.get('cell_type')=='code':
                  code_diff.append(i)
                  ss=''.join(sc.get('source',[]))
                  assert any(m in ss for m in required_markers), (i,'unmarked code delta')
          assert code_diff, 'expected state-overlay code deltas'
          assert diff==code_diff, (diff, code_diff)
          for label,nb in [('base',b),('state',s)]:
              count=0
              for i,c in enumerate(nb['cells']):
                  if c.get('cell_type')!='code': continue
                  compile(''.join(c.get('source',[])),f'{label}:cell-{i}','exec',flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT)
                  count+=1
              assert count>0
          bm=json.loads((base_dir/'kernel-metadata.json').read_text())
          sm=json.loads((state_dir/'kernel-metadata.json').read_text())
          comparable=['language','kernel_type','is_private','enable_gpu','enable_tpu','enable_internet','dataset_sources','competition_sources','kernel_sources','model_sources','docker_image','machine_shape']
          for k in comparable: assert bm[k]==sm[k], (k,bm[k],sm[k])
          assert bm['is_private'] is True and bm['enable_internet'] is False
          out={
            'schema':'deus/arc3-r332-c9-agent-state-diff-audit/1',
            'idempotency_key':os.environ['IDEMPOTENCY_KEY'],
            'source_sha':os.environ['SOURCE_SHA'],
            'game_id':os.environ['GAME_ID'],
            'fixed_contract':{'runtime_seconds':1200,'terminal_grace_seconds':120,'concurrency':1,'analyzer_timeout':900,'max_games':1},
            'diff_cell_indices':diff,
            'code_diff_cell_indices':code_diff,
            'required_state_markers':required_markers,
            'base_notebook_sha256':hashlib.sha256(base_nb.read_bytes()).hexdigest(),
            'state_notebook_sha256':hashlib.sha256(state_nb.read_bytes()).hexdigest(),
            'base_metadata_sha256':hashlib.sha256((base_dir/'kernel-metadata.json').read_bytes()).hexdigest(),
            'state_metadata_sha256':hashlib.sha256((state_dir/'kernel-metadata.json').read_bytes()).hexdigest(),
            'truth':{'static_source_package_audit_only':True,'kaggle_api_called':False,'provider_execution':False,'competition_submission':False,'performance_claim':False},
            'verdict':'PASS_STATE_PATCH_ISOLATED_TO_EXPLICIT_MARKED_CODE_CELLS',
          }
          Path('r332-c9-agent-state-diff-audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          sha256sum r332-c9-agent-state-diff-audit.json \
            public_benchmark/arc3/kaggle_candidates/flash_next_340/build/r332-base/*.ipynb \
            public_benchmark/arc3/kaggle_candidates/flash_next_340/build/r332-state/*.ipynb \
            public_benchmark/arc3/kaggle_candidates/flash_next_340/build/r332-base/kernel-metadata.json \
            public_benchmark/arc3/kaggle_candidates/flash_next_340/build/r332-state/kernel-metadata.json > R332_SHA256SUMS.txt
      - name: Upload R332 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: r332-c9-agent-state-diff-audit
          path: |
            r332-c9-agent-state-diff-audit.json
            R332_SHA256SUMS.txt
          retention-days: 30
