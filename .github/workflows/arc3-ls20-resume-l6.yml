name: ARC3 ls20 L6 clean completion verification

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Clean replay L6 candidate and save verified receipt
        run: |
          python - <<'PY'
          import json,logging,time,hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          p4=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          p5=json.loads((ROOT/'l5-verified-completion.json').read_text())['l5_actions_executed']
          prefix=p4+p5
          SHAPE_E=[1,4,4,1,2,1,2,1,2,3,3,4,4,1,2,1]
          TO_REFILL=[2,3,3,3,3,3]
          TO_COLOR8=[1,1,4,1,4,1,4,4,4,4]
          TO_GATE=[4,4,1,4]
          DOOR_SUFFIX=[1,4,2,2,4,2,2]
          L6=SHAPE_E+TO_REFILL+TO_COLOR8+TO_GATE+DOOR_SUFFIX
          TM=[1,0,1,1,1,0,0,1,1]

          def pos(frame):
            f=np.asarray(frame,dtype=np.int16)
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5):continue
                vals,cts=np.unique(w,return_counts=True);d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:return (x,y)
            return None
          def key(frame):
            f=np.asarray(frame,dtype=np.int16);cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True);cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0];mask=[]
            for r in range(3):
              for c in range(3):
                b=cur[2*r:2*r+2,2*c:2*c+2];mask.append(1 if int((b==color).sum())>=2 else 0)
            return {'color':color,'mask':mask}

          last=None
          for attempt in range(1,4):
            try:
              arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
              env=arcade.make('ls20',save_recording=False,include_frame_data=True)
              if env is None:raise RuntimeError('ENV_CREATE_FAILED')
              amap={a.value:a for a in env.action_space};obs=env.observation_space
              for a in prefix:
                obs=env.step(amap[a])
                if obs is None:raise RuntimeError('NO_OBS_PREFIX')
              if obs.levels_completed!=5:
                raise RuntimeError(f'BAD_L6_ENTRY levels={obs.levels_completed}')
              break
            except Exception as e:
              last=f'{type(e).__name__}:{e}';time.sleep(min(2*attempt,5))
          else:raise RuntimeError('ENV_RETRY_EXHAUSTED '+str(last))

          trace=[];target_ready_receipt=None;completed_at=None
          for i,a in enumerate(L6,1):
            before=np.asarray(obs.frame[-1],dtype=np.int16);bp=pos(before);bk=key(before);be=int((before==11).sum())
            obs=env.step(amap[a])
            if obs is None:raise RuntimeError(f'NO_OBS_L6_{i}')
            after=np.asarray(obs.frame[-1],dtype=np.int16);ap=pos(after);ak=key(after);ae=int((after==11).sum())
            ev={'i':i,'a':a,'from':None if bp is None else list(bp),'to':None if ap is None else list(ap),
                'before_key':bk,'after_key':ak,'before_energy':be,'after_energy':ae,
                'levels':obs.levels_completed,'state':obs.state.value}
            trace.append(ev)
            if i==len(SHAPE_E)+len(TO_REFILL)+len(TO_COLOR8):
              target_ready_receipt={'i':i,'pos':None if ap is None else list(ap),'key':ak,'energy_proxy':ae,'levels':obs.levels_completed,'state':obs.state.value}
              if obs.levels_completed!=5 or ap!=(29,25) or ak!={'color':8,'mask':TM}:
                raise RuntimeError(f'TARGET_READY_GUARD_FAILED receipt={target_ready_receipt}')
            if obs.levels_completed>5:
              completed_at=i
              break

          final_frame=np.asarray(obs.frame[-1],dtype=np.int16)
          final={'levels':obs.levels_completed,'state':obs.state.value,'pos':None if pos(final_frame) is None else list(pos(final_frame)),
                 'key':key(final_frame),'energy_proxy':int((final_frame==11).sum()),'completed_at_l6_action':completed_at}
          receipt={'verified':obs.levels_completed>5,'game':'ls20','l6_actions_executed':L6,
                   'segments':{'shape_e':SHAPE_E,'to_refill':TO_REFILL,'to_color8':TO_COLOR8,'to_gate':TO_GATE,'door_suffix':DOOR_SUFFIX},
                   'prefix_actions':len(prefix),'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),
                   'l6_sha256':hashlib.sha256(','.join(map(str,L6)).encode()).hexdigest(),
                   'target_ready_receipt':target_ready_receipt,'final_receipt':final,'trace':trace}
          print('L6_VERIFICATION_RESULT='+json.dumps(receipt,separators=(',',':'),sort_keys=True))
          if not receipt['verified']:
            raise RuntimeError(f'L6_NOT_COMPLETED final={final}')
          (ROOT/'l6-verified-completion.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - name: Persist L6 verified completion receipt
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l6-verified-completion.json
          git commit -m 'benchmark: persist verified L6 completion [skip ci]'
          git push
