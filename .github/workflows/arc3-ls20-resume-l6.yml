name: ARC3 ls20 L6 upper-gate four-way probe

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        action: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTION: ${{ matrix.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Probe exact upper gate at 44,20
        run: |
          python - <<'PY'
          import os,json,logging,time,hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          p4=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          p5=json.loads((ROOT/'l5-verified-completion.json').read_text())['l5_actions_executed']
          prefix=p4+p5
          SHAPE_E=[1,4,4,1,2,1,2,1,2,3,3,4,4,1,2,1]
          TO_REFILL=[2,3,3,3,3,3]
          TO_COLOR8=[1,1,4,1,4,1,4,4,4,4]
          TO_GATE=[4,4,1,4]
          CORE=SHAPE_E+TO_REFILL+TO_COLOR8+TO_GATE
          TM=[1,0,1,1,1,0,0,1,1]
          a=int(os.environ['ACTION'])

          def candidates(frame):
            f=np.asarray(frame,dtype=np.int16);out=[]
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5):continue
                vals,cts=np.unique(w,return_counts=True);d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:out.append((x,y))
            return out
          def key(frame):
            f=np.asarray(frame,dtype=np.int16);cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True);cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0];mask=[]
            for r in range(3):
              for c in range(3):
                b=cur[2*r:2*r+2,2*c:2*c+2];mask.append(1 if int((b==color).sum())>=2 else 0)
            return {'color':color,'mask':mask}
          def crop(frame,x0=35,x1=63,y0=14,y1=31):
            f=np.asarray(frame,dtype=np.int16)
            return [''.join('0123456789ABCDEF'[int(v)] if 0<=int(v)<16 else '?' for v in f[y,x0:x1+1]) for y in range(y0,y1+1)]

          last=None
          for attempt in range(1,4):
            try:
              arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
              env=arcade.make('ls20',save_recording=False,include_frame_data=True)
              if env is None:raise RuntimeError('ENV_CREATE_FAILED')
              amap={x.value:x for x in env.action_space};obs=env.observation_space
              trace=[]
              for i,x in enumerate(prefix+CORE,1):
                obs=env.step(amap[x])
                if obs is None:raise RuntimeError('NO_OBS_REPLAY')
              f=np.asarray(obs.frame[-1],dtype=np.int16);cs=candidates(f);k=key(f)
              if obs.levels_completed!=5 or cs!=[(44,20)] or k!={'color':8,'mask':TM}:
                raise ValueError(f'GATE_GUARD_FAILED levels={obs.levels_completed} candidates={cs} key={k}')
              break
            except ValueError: raise
            except Exception as e:
              last=f'{type(e).__name__}:{e}';time.sleep(min(2*attempt,5))
          else: raise RuntimeError('ENV_RETRY_EXHAUSTED '+str(last))

          before=np.asarray(obs.frame[-1],dtype=np.int16)
          obs=env.step(amap[a])
          if obs is None:raise RuntimeError('NO_OBS_PROBE')
          after=np.asarray(obs.frame[-1],dtype=np.int16)
          diff=np.argwhere(before[:55,:64]!=after[:55,:64])
          if len(diff):
            ys=diff[:,0];xs=diff[:,1];db=[int(xs.min()),int(ys.min()),int(xs.max()),int(ys.max())]
          else: db=None
          out={'action':a,'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),
               'before':{'candidates':[list(x) for x in candidates(before)],'key':key(before),'energy_proxy':int((before==11).sum()),'crop':crop(before)},
               'after':{'candidates':[list(x) for x in candidates(after)],'key':key(after),'energy_proxy':int((after==11).sum()),'levels':obs.levels_completed,'state':obs.state.value,'crop':crop(after)},
               'playfield_diff_bbox':db,'playfield_diff_count':int(len(diff))}
          print('SUPERCELL_RESULT='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
