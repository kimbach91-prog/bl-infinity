name: ARC3 ls20 L3 key-to-exit candidate

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Run 30-step candidate
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          base=json.loads(Path('public_benchmark/arc-agi-3/route.json').read_text())['actions']
          suffix=[1]*8+[3]+[2]*8 + [1]*4+[4]*5+[1]*3+[3]
          arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          env=arcade.make('ls20',save_recording=False,include_frame_data=True)
          amap={a.value:a for a in env.action_space}; obs=env.observation_space
          trace=[]
          for a in base: obs=env.step(amap[a])
          for i,a in enumerate(suffix,1):
            obs=env.step(amap[a]); f=np.asarray(obs.frame[-1],dtype=np.int16)
            trace.append({'i':i,'a':a,'levels':obs.levels_completed,'state':obs.state.value,'meter11':int((f==11).sum())})
          f=np.asarray(obs.frame[-1],dtype=np.int16)
          specials={}
          for c in (0,1,8,9,12,14):
            yy,xx=np.where((f==c)&(np.indices(f.shape)[0]<50))
            specials[str(c)]={'n':int(len(xx)),'bbox':None if not len(xx) else [int(xx.min()),int(yy.min()),int(xx.max()),int(yy.max())]}
          r={'suffix':suffix,'suffix_actions':len(suffix),'total_actions':len(base)+len(suffix),'levels_completed':obs.levels_completed,'state':obs.state.value,'meter11':int((f==11).sum()),'specials':specials,'frame_sha256':hashlib.sha256(f.tobytes()).hexdigest(),'trace':trace}
          Path('result.json').write_text(json.dumps(r,indent=2,sort_keys=True))
          PY
      - name: Persist receipt
        run: |
          mkdir -p public_benchmark/arc-agi-3/dev
          cp result.json public_benchmark/arc-agi-3/dev/l3-key-to-exit-candidate.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l3-key-to-exit-candidate.json
          git commit -m 'benchmark: save L3 key-to-exit candidate [skip ci]'
          git push
