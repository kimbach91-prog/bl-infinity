name: ARC3 ls20 L6 right-branch transition trace

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Trace right branch from verified target-ready state
        run: |
          python - <<'PY'
          import json,logging,time,hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          p4=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          p5=json.loads((ROOT/'l5-verified-completion.json').read_text())['l5_actions_executed']
          prefix=p4+p5
          SHAPE_E=[1,4,4,1,2,1,2,1,2,3,3,4,4,1,2,1]
          TO_REFILL=[2,3,3,3,3,3]
          TO_COLOR8=[1,1,4,1,4,1,4,4,4,4]
          ROUTE=[4,4,1,4,1,4,1,1]
          BASE=SHAPE_E+TO_REFILL+TO_COLOR8
          TM=[1,0,1,1,1,0,0,1,1]

          def pos(frame):
            f=np.asarray(frame,dtype=np.int16)
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5):continue
                vals,cts=np.unique(w,return_counts=True);d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:return (x,y)
            return None
          def key(frame):
            f=np.asarray(frame,dtype=np.int16);cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True);cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0];mask=[]
            for r in range(3):
              for c in range(3):
                b=cur[2*r:2*r+2,2*c:2*c+2];mask.append(1 if int((b==color).sum())>=2 else 0)
            return {'color':color,'mask':mask}

          last=None
          for attempt in range(1,4):
            try:
              arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
              env=arcade.make('ls20',save_recording=False,include_frame_data=True)
              if env is None:raise RuntimeError('ENV_CREATE_FAILED')
              amap={a.value:a for a in env.action_space};obs=env.observation_space
              for a in prefix+BASE:
                obs=env.step(amap[a])
                if obs is None:raise RuntimeError('NO_OBS_BASE')
              f=np.asarray(obs.frame[-1],dtype=np.int16)
              if obs.levels_completed!=5 or pos(f)!=(29,25) or key(f)!={'color':8,'mask':TM}:
                raise ValueError(f'BASE_GUARD_FAILED levels={obs.levels_completed} pos={pos(f)} key={key(f)}')
              break
            except ValueError: raise
            except Exception as e:
              last=f'{type(e).__name__}:{e}';time.sleep(min(2*attempt,5))
          else:raise RuntimeError('ENV_RETRY_EXHAUSTED '+str(last))

          trace=[]
          for i,a in enumerate(ROUTE,1):
            before=np.asarray(obs.frame[-1],dtype=np.int16);bp=pos(before);bk=key(before);be=int((before==11).sum())
            obs=env.step(amap[a])
            if obs is None:raise RuntimeError(f'NO_OBS_{i}')
            after=np.asarray(obs.frame[-1],dtype=np.int16);ap=pos(after);ak=key(after);ae=int((after==11).sum())
            jump=None if ap is None or bp is None else abs(ap[0]-bp[0])+abs(ap[1]-bp[1])
            trace.append({'i':i,'a':a,'from':None if bp is None else list(bp),'to':None if ap is None else list(ap),
                          'jump':jump,'before_key':bk,'after_key':ak,'before_energy':be,'after_energy':ae,
                          'levels':obs.levels_completed,'state':obs.state.value})
          out={'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),
               'route':ROUTE,'trace':trace,'final':trace[-1] if trace else None}
          print('SUPERCELL_RESULT='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
