name: ARC3 public ls20 local replay environment

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Obtain official public development environment without source inspection
        run: |
          python - <<'PY'
          import arc_agi,logging,json,hashlib,shutil,os
          from arc_agi import OperationMode
          from pathlib import Path
          logging.disable(logging.CRITICAL)
          arc=arc_agi.Arcade(operation_mode=OperationMode.NORMAL)
          env=arc.make('ls20',save_recording=False,include_frame_data=True)
          if env is None:raise RuntimeError('ENV_UNAVAILABLE')
          out=Path('local_replay');out.mkdir()
          src=Path('environment_files')
          files=[p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix in {'.py','.json','.png','.npy'}]
          if not files:raise RuntimeError('OFFICIAL_LOCAL_ENV_MISSING')
          manifest=[]
          for p in files:
              rel=p.relative_to(src)
              dest=out/'environment_files'/rel;dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,dest)
              manifest.append({'path':str(rel),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          rec={'source_sha':os.environ.get('GITHUB_SHA'),'origin':'official ARC-AGI toolkit NORMAL public development download','toolkit_version':'0.9.9','engine_version':'0.9.3','protocol':'public observations and actions only; no hidden game source/state used by solver','official_competition_claim':False,'files':manifest}
          (out/'provenance.json').write_text(json.dumps(rec,indent=2))
          print('PUBLIC_LOCAL_REPLAY_READY files='+str(len(files)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-official-public-local-replay
          path: local_replay/
          retention-days: 1
