name: ARC3 ls20 L3 refiller no-op probe

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Probe ACTION5 while standing on refiller
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          base=json.loads(Path('public_benchmark/arc-agi-3/route.json').read_text())['actions']
          # reach color rotator then r5c2 refiller
          pre=[1]*8+[3]+[2]*8+[1]*3+[3]*2
          arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          env=arcade.make('ls20',save_recording=False,include_frame_data=True)
          amap={a.value:a for a in env.action_space}; obs=env.observation_space
          for a in base+pre: obs=env.step(amap[a])
          f=np.asarray(obs.frame[-1],dtype=np.int16)
          out={'available_actions':sorted(amap.keys()),'before_action5_meter11':int((f==11).sum()),'before_levels':obs.levels_completed,'before_state':obs.state.value}
          if 5 in amap:
            before=f.copy(); obs=env.step(amap[5]); f=np.asarray(obs.frame[-1],dtype=np.int16)
            out.update({'after_action5_meter11':int((f==11).sum()),'after_levels':obs.levels_completed,'after_state':obs.state.value,'diff_n':int((f!=before).sum())})
          else:
            out['action5_unavailable']=True
          Path('result.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist receipt
        run: |
          mkdir -p public_benchmark/arc-agi-3/dev
          cp result.json public_benchmark/arc-agi-3/dev/l3-refiller-action5-probe.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l3-refiller-action5-probe.json
          git commit -m 'benchmark: probe L3 refiller ACTION5 behavior [skip ci]'
          git push
