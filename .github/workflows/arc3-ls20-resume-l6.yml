name: ARC3 ls20 L4 corrected full completion

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Run corrected L4 composed route
        run: |
          python - <<'PY'
          import json, logging, hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          prefix=json.loads((ROOT/'l3-dual-refill-final-touch.json').read_text())['executed_actions']

          hub=[3,3,3,2,2,3,3,3,3]
          hub_to_color=[4,4,4,2,2,2,3,3,1,2]
          color_cycle=[1,2,1,2]
          color_exit=[1,4]  # verified result: (34,30)->(34,25)->(39,5)
          # Directed graph from (39,5): down to (39,20), portal RIGHT to (44,45), UP->(34,40), then DOWN twice to refill2 (34,50)
          color_exit_to_refill2=[2,2,2,4,1,2,2]
          refill2_to_shape=[1,3,3,1,1,1]
          shape_to_door=[2,2,4,1,1,1,1,4,1,4,1,1,3,3]
          final_touch=[3]
          l4=hub+hub_to_color+color_cycle+color_exit+color_exit_to_refill2+refill2_to_shape+shape_to_door+final_touch

          checkpoints={
            9:'hub_refill',19:'color_touch_1',21:'color_touch_2',23:'color_touch_3',25:'color_exit',
            32:'refill2',38:'shape_touch',52:'door_right',53:'door_touch'
          }

          def agent(frame):
            f=np.asarray(frame,dtype=np.int16)
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5): continue
                vals,cts=np.unique(w,return_counts=True); d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:return [x,y]
            return None

          def key(frame):
            f=np.asarray(frame,dtype=np.int16); cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True)
            cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0]
            mask=[]
            for r in range(3):
              row=[]
              for c in range(3):
                block=cur[2*r:2*r+2,2*c:2*c+2]
                row.append(1 if int((block==color).sum())>=2 else 0)
              mask.append(row)
            return {'color':color,'mask':mask}

          arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          env=arcade.make('ls20',save_recording=False,include_frame_data=True)
          if env is None: raise SystemExit('ENV_CREATE_FAILED')
          amap={a.value:a for a in env.action_space}; obs=env.observation_space
          executed=[]
          for a in prefix:
            obs=env.step(amap[a]); executed.append(a)
            if obs is None: raise SystemExit('NO_OBS_PREFIX')
          if obs.levels_completed!=3: raise SystemExit(f'PREFIX_NOT_3:{obs.levels_completed}')

          l4_executed=[]; milestones=[]
          for li,a in enumerate(l4,1):
            obs=env.step(amap[a])
            if obs is None: raise SystemExit(f'NO_OBS_L4_{li}')
            executed.append(a); l4_executed.append(a)
            if li in checkpoints or obs.levels_completed>=4 or obs.state.value!='NOT_FINISHED':
              f=np.asarray(obs.frame[-1],dtype=np.int16)
              milestones.append({'l4_i':li,'label':checkpoints.get(li,'event'),'a':a,'agent':agent(f),'key':key(f),'color11_total':int((f==11).sum()),'levels':obs.levels_completed,'state':obs.state.value})
            if obs.levels_completed>=4 or obs.state.value!='NOT_FINISHED': break

          out={
            'candidate_l4_actions':len(l4),'executed_l4':len(l4_executed),'total_executed':len(executed),
            'levels_completed':obs.levels_completed,'state':obs.state.value,
            'l4_actions_executed':l4_executed,'full_actions_executed':executed,
            'route_sha256':hashlib.sha256(','.join(map(str,executed)).encode()).hexdigest(),
            'milestones':milestones
          }
          (ROOT/'l4-corrected-full-completion.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist corrected receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l4-corrected-full-completion.json
          git commit -m 'benchmark: save corrected L4 completion receipt [skip ci]'
          git push
