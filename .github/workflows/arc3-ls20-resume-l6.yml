name: ARC3 ls20 L4 verified rotator cycles

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Probe rotators via confirmed refill hub
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          prefix=json.loads(Path('public_benchmark/arc-agi-3/dev/l3-dual-refill-final-touch.json').read_text())['executed_actions']
          to_hub=[3,3,3,2,2,3,3,3,3]  # confirmed refill at (19,15)
          routes={
            'color': to_hub+[4,4,4,2,2,2],              # (34,30)
            'shape': to_hub+[3,3,2,2,2,2,4,4,4,1],      # (24,30) via lower-left safe corridor
          }
          def key_state(f):
            cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True)
            cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0]
            mask=[]
            for r in range(3):
              row=[]
              for c in range(3): row.append(1 if int((cur[2*r:2*r+2,2*c:2*c+2]==color).sum())>=2 else 0)
              mask.append(row)
            return {'color':color,'mask':mask,'raw':cur.tolist()}
          def target_state(f):
            # L4 door body is unique color-5 component bbox x8..14,y4..10; target occupies 3x3 at x10..12,y6..8.
            tgt=f[6:9,10:13]
            vals,cts=np.unique(tgt,return_counts=True)
            cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0]
            return {'color':color,'mask':(tgt==color).astype(int).tolist(),'raw':tgt.tolist()}
          results={}
          for kind,route in routes.items():
            arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
            env=arcade.make('ls20',save_recording=False,include_frame_data=True)
            if env is None: raise SystemExit('ENV_CREATE_FAILED')
            amap={a.value:a for a in env.action_space}; obs=env.observation_space
            for a in prefix: obs=env.step(amap[a])
            initial=np.asarray(obs.frame[-1],dtype=np.int16)
            states=[{'touches':0,'key':key_state(initial),'target':target_state(initial),'color11_total':int((initial==11).sum())}]
            for a in route: obs=env.step(amap[a])
            f=np.asarray(obs.frame[-1],dtype=np.int16)
            states.append({'touches':1,'key':key_state(f),'target':target_state(f),'color11_total':int((f==11).sum())})
            # repeat 3 more touches by stepping to known adjacent floor and back.
            away,back=(1,2) if kind=='color' else (2,1)
            for touch in (2,3,4):
              obs=env.step(amap[away]); obs=env.step(amap[back])
              f=np.asarray(obs.frame[-1],dtype=np.int16)
              states.append({'touches':touch,'key':key_state(f),'target':target_state(f),'color11_total':int((f==11).sum())})
            results[kind]={'route':route,'states':states,'levels':obs.levels_completed,'state':obs.state.value}
          Path('public_benchmark/arc-agi-3/dev/l4-rotator-cycles.json').write_text(json.dumps(results,indent=2,sort_keys=True))
          PY
      - name: Persist receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l4-rotator-cycles.json
          git commit -m 'benchmark: save verified L4 rotator cycles [skip ci]'
          git push
