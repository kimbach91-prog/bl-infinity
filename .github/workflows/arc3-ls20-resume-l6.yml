name: ARC3 ls20 L6 valid-motion supercells

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cell: [upper_pingpong, lower_pingpong, side_loop, right_spine]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Advance L6 dynamics with reversible valid-movement loops
        run: |
          python - <<'PY'
          import os,json,logging,time,hashlib
          from pathlib import Path
          from collections import deque,Counter
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          p4=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          p5=json.loads((ROOT/'l5-verified-completion.json').read_text())['l5_actions_executed']
          prefix=p4+p5
          SHAPE_E=[1,4,4,1,2,1,2,1,2,3,3,4,4,1,2,1]
          TO_REFILL=[2,3,3,3,3,3]
          TO_COLOR8=[1,1,4,1,4,1,4,4,4,4]
          TO_RIGHT_PORTAL=[4,4,1,4,1,4,1,1]
          ACTIVATE_GATE1_AND_RETURN=[4,2,2,2,1]
          BASE=SHAPE_E+TO_REFILL+TO_COLOR8+TO_RIGHT_PORTAL+ACTIVATE_GATE1_AND_RETURN
          GATE1_MASK=[1,0,1,1,1,0,0,1,1]
          GATE1_COLOR=8
          loops={
            'upper_pingpong':[1,1,2,2]*4,
            'lower_pingpong':[2,2,1,1]*4,
            'side_loop':[1,1,3,4,2,2]*3,
            'right_spine':[1,1,3,1,1,1,2,2,2,4,2,2]*2,
          }
          seq=loops[os.environ['CELL']]

          def pos(frame):
            f=np.asarray(frame,dtype=np.int16)
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5):continue
                vals,cts=np.unique(w,return_counts=True);d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:return (x,y)
            return None
          def key(frame):
            f=np.asarray(frame,dtype=np.int16);cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True);cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0];mask=[]
            for r in range(3):
              for c in range(3):
                b=cur[2*r:2*r+2,2*c:2*c+2];mask.append(1 if int((b==color).sum())>=2 else 0)
            return {'color':color,'mask':mask}
          def mask_player_diff(before,after,bp,ap):
            a=np.asarray(before,dtype=np.int16)[:55,:64]
            b=np.asarray(after,dtype=np.int16)[:55,:64]
            m=(a!=b)
            for p in (bp,ap):
              if p is None:continue
              x,y=p
              y0=max(0,y);y1=min(55,y+5);x0=max(0,x);x1=min(64,x+5)
              m[y0:y1,x0:x1]=False
            return m,a,b
          def diff_components(before,after,bp,ap):
            m,a,b=mask_player_diff(before,after,bp,ap)
            seen=set();out=[]
            for y,x in np.argwhere(m):
              p=(int(x),int(y))
              if p in seen:continue
              q=deque([p]);seen.add(p);pts=[]
              while q:
                xx,yy=q.popleft();pts.append((xx,yy))
                for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                  nx,ny=xx+dx,yy+dy
                  if 0<=nx<64 and 0<=ny<55 and m[ny,nx] and (nx,ny) not in seen:
                    seen.add((nx,ny));q.append((nx,ny))
              xs=[v[0] for v in pts];ys=[v[1] for v in pts]
              bc=Counter(int(a[yy,xx]) for xx,yy in pts);ac=Counter(int(b[yy,xx]) for xx,yy in pts)
              out.append({'count':len(pts),'bbox':[min(xs),min(ys),max(xs),max(ys)],'before_colors':dict(bc),'after_colors':dict(ac)})
            return sorted(out,key=lambda z:(z['bbox'][1],z['bbox'][0]))
          def special_components(frame):
            f=np.asarray(frame,dtype=np.int16)[:55,:64]
            mask=np.isin(f,[0,1,8,9,11,12,14])
            seen=set();out=[]
            for y,x in np.argwhere(mask):
              p=(int(x),int(y))
              if p in seen:continue
              c=int(f[y,x]);q=deque([p]);seen.add(p);pts=[]
              while q:
                xx,yy=q.popleft();pts.append((xx,yy))
                for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                  nx,ny=xx+dx,yy+dy
                  if 0<=nx<64 and 0<=ny<55 and (nx,ny) not in seen and int(f[ny,nx])==c:
                    seen.add((nx,ny));q.append((nx,ny))
              if len(pts)>=2:
                xs=[v[0] for v in pts];ys=[v[1] for v in pts]
                out.append({'color':c,'count':len(pts),'bbox':[min(xs),min(ys),max(xs),max(ys)]})
            return sorted(out,key=lambda z:(z['color'],z['bbox'][1],z['bbox'][0]))

          last=None
          for attempt in range(1,4):
            try:
              arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
              env=arcade.make('ls20',save_recording=False,include_frame_data=True)
              if env is None:raise RuntimeError('ENV_CREATE_FAILED')
              amap={a.value:a for a in env.action_space};obs=env.observation_space
              for a in prefix+BASE:
                obs=env.step(amap[a])
                if obs is None:raise RuntimeError('NO_OBS_BASE')
              f=np.asarray(obs.frame[-1],dtype=np.int16);p=pos(f);k=key(f);e=int((f==11).sum())
              if obs.levels_completed!=5 or p!=(54,35) or k!={'color':GATE1_COLOR,'mask':GATE1_MASK}:
                raise ValueError(f'LOOP_GUARD_FAILED levels={obs.levels_completed} pos={p} key={k} energy={e}')
              guard={'pos':list(p),'key':k,'energy_proxy':e,'levels':obs.levels_completed,'special':special_components(f)}
              break
            except ValueError:raise
            except Exception as exc:
              last=f'{type(exc).__name__}:{exc}';time.sleep(min(2*attempt,5))
          else:raise RuntimeError('ENV_RETRY_EXHAUSTED '+str(last))

          trace=[];transition=None;settle_remaining=0;prev=np.asarray(obs.frame[-1],dtype=np.int16)
          for i,a in enumerate(seq,1):
            bp=pos(prev);bk=key(prev);be=int((prev==11).sum())
            obs=env.step(amap[a])
            if obs is None:break
            cur=np.asarray(obs.frame[-1],dtype=np.int16);ap=pos(cur);ak=key(cur);ae=int((cur==11).sum())
            ev={'i':i,'a':a,'from':None if bp is None else list(bp),'to':None if ap is None else list(ap),
                'before_key':bk,'after_key':ak,'before_energy':be,'after_energy':ae,
                'levels':obs.levels_completed,'state':obs.state.value,
                'nonplayer_diff':diff_components(prev,cur,bp,ap),'special':special_components(cur)}
            trace.append(ev)
            if obs.levels_completed>5:
              transition={'kind':'LEVEL_ADVANCED','i':i,'event':ev};break
            changed=(ak!=bk)
            if transition is None and changed:
              transition={'kind':'KEY_CHANGED','i':i,'event':ev};settle_remaining=4
            elif transition is not None and settle_remaining>0:
              settle_remaining-=1
              if settle_remaining==0:break
            prev=cur
          out={'cell':os.environ['CELL'],'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),
               'guard_receipt':guard,'sequence':seq,'transition':transition,'trace':trace,
               'final':trace[-1] if trace else None}
          print('SUPERCELL_RESULT='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
