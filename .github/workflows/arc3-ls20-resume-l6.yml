name: ARC3 ls20 L5 initial public decoder

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Replay verified 4/7 prefix and decode L5
        run: |
          python - <<'PY'
          import json, logging, hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          prefix=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']

          arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          env=arcade.make('ls20',save_recording=False,include_frame_data=True)
          if env is None: raise SystemExit('ENV_CREATE_FAILED')
          amap={a.value:a for a in env.action_space}; obs=env.observation_space
          for i,a in enumerate(prefix,1):
            obs=env.step(amap[a])
            if obs is None: raise SystemExit(f'NO_OBS_{i}')
          if obs.levels_completed!=4: raise SystemExit(f'PREFIX_NOT_4:{obs.levels_completed}')
          f=np.asarray(obs.frame[-1],dtype=np.int16); H,W=f.shape

          players=[]
          for y in range(0,55):
            for x in range(0,60):
              w=f[y:y+5,x:x+5]
              if w.shape!=(5,5): continue
              vals,cts=np.unique(w,return_counts=True); d={int(k):int(v) for k,v in zip(vals,cts)}
              if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25: players.append([x,y])
          if not players: raise SystemExit('PLAYER_NOT_FOUND')
          px,py=players[0]
          x0=px%5; y0=py%5
          xs=list(range(x0,60,5)); ys=list(range(y0,55,5))

          # Connected components, capped to useful top components per color.
          comps={}
          for color in sorted(map(int,np.unique(f))):
            seen=set(); arr=[]
            for yy,xx in zip(*np.where(f==color)):
              yy=int(yy);xx=int(xx)
              if (yy,xx) in seen: continue
              stack=[(yy,xx)]; seen.add((yy,xx)); pts=[]
              while stack:
                cy,cx=stack.pop();pts.append((cy,cx))
                for dy,dx in ((1,0),(-1,0),(0,1),(0,-1)):
                  ny,nx=cy+dy,cx+dx
                  if 0<=ny<H and 0<=nx<W and (ny,nx) not in seen and int(f[ny,nx])==color:
                    seen.add((ny,nx)); stack.append((ny,nx))
              yy2=[p[0] for p in pts];xx2=[p[1] for p in pts]
              arr.append({'n':len(pts),'bbox':[min(xx2),min(yy2),max(xx2),max(yy2)]})
            arr.sort(key=lambda z:(-z['n'],z['bbox']));comps[str(color)]=arr[:50]

          coarse=[]; cells=[]
          for r,y in enumerate(ys):
            chars=[]; row=[]
            for c,x in enumerate(xs):
              w=f[y:y+5,x:x+5]
              vals,cts=np.unique(w,return_counts=True);d={str(int(k)):int(v) for k,v in zip(vals,cts)}
              row.append({'r':r,'c':c,'x':x,'y':y,'counts':d})
              di={int(k):v for k,v in d.items()}
              if di.get(9,0)==15 and di.get(12,0)==10:ch='A'
              elif max(di.values())==25:ch=f'{max(di,key=di.get):X}'
              else:ch='?'
              chars.append(ch)
            cells.append(row);coarse.append(''.join(chars))

          cur=f[55:61,3:9]
          vals,cts=np.unique(cur,return_counts=True); cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
          kcolor=max(cand,key=lambda z:z[1])[0]
          kmask=[]
          for r in range(3):
            row=[]
            for c in range(3):
              block=cur[2*r:2*r+2,2*c:2*c+2]
              row.append(1 if int((block==kcolor).sum())>=2 else 0)
            kmask.append(row)

          out={
            'prefix_actions':len(prefix),'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),
            'levels_completed':obs.levels_completed,'state':obs.state.value,
            'frame_shape':list(f.shape),'frame_sha256':hashlib.sha256(f.tobytes()).hexdigest(),
            'player_candidates':players,'grid_origin_mod5':[x0,y0],'x_anchors':xs,'y_anchors':ys,
            'coarse':coarse,'cells':cells,'palette':{str(int(k)):int(v) for k,v in zip(*np.unique(f,return_counts=True))},
            'components':comps,'current_key':{'color':kcolor,'mask':kmask,'raw':cur.tolist()},
            'top_left_patch':f[0:18,0:20].tolist(),'top_right_patch':f[0:18,44:64].tolist(),
            'bottom_play_patch':f[42:55,0:64].tolist()
          }
          (ROOT/'l5-initial-decoder.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist L5 decoder
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l5-initial-decoder.json
          git commit -m 'benchmark: decode L5 initial public frame [skip ci]'
          git push
