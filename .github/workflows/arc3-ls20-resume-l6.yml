name: ARC3 ls20 L6 synchronized-motion survey

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Observe autonomous motion from activated Gate-1 safe wait context
        run: |
          python - <<'PY'
          import json,logging,time,hashlib
          from pathlib import Path
          from collections import deque,Counter
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          p4=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          p5=json.loads((ROOT/'l5-verified-completion.json').read_text())['l5_actions_executed']
          prefix=p4+p5
          SHAPE_E=[1,4,4,1,2,1,2,1,2,3,3,4,4,1,2,1]
          TO_REFILL=[2,3,3,3,3,3]
          TO_COLOR8=[1,1,4,1,4,1,4,4,4,4]
          TO_RIGHT_PORTAL=[4,4,1,4,1,4,1,1]
          ACTIVATE_GATE1_AND_RETURN=[4,2,2,2,1]
          BASE=SHAPE_E+TO_REFILL+TO_COLOR8+TO_RIGHT_PORTAL+ACTIVATE_GATE1_AND_RETURN
          TM=[1,0,1,1,1,0,0,1,1]
          WAITS=16

          def pos(frame):
            f=np.asarray(frame,dtype=np.int16)
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5):continue
                vals,cts=np.unique(w,return_counts=True);d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:return (x,y)
            return None
          def key(frame):
            f=np.asarray(frame,dtype=np.int16);cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True);cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0];mask=[]
            for r in range(3):
              for c in range(3):
                b=cur[2*r:2*r+2,2*c:2*c+2];mask.append(1 if int((b==color).sum())>=2 else 0)
            return {'color':color,'mask':mask}
          def diff_components(before,after):
            a=np.asarray(before,dtype=np.int16)[:55,:64];b=np.asarray(after,dtype=np.int16)[:55,:64]
            mask=a!=b
            # Player is intentionally stationary here; no manual masking needed.
            seen=set();out=[]
            for y,x in np.argwhere(mask):
              p=(int(x),int(y))
              if p in seen:continue
              q=deque([p]);seen.add(p);pts=[]
              while q:
                xx,yy=q.popleft();pts.append((xx,yy))
                for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                  nx,ny=xx+dx,yy+dy
                  if 0<=nx<64 and 0<=ny<55 and mask[ny,nx] and (nx,ny) not in seen:
                    seen.add((nx,ny));q.append((nx,ny))
              xs=[v[0] for v in pts];ys=[v[1] for v in pts]
              before_colors=Counter(int(a[yy,xx]) for xx,yy in pts)
              after_colors=Counter(int(b[yy,xx]) for xx,yy in pts)
              out.append({'count':len(pts),'bbox':[min(xs),min(ys),max(xs),max(ys)],
                          'before_colors':dict(before_colors),'after_colors':dict(after_colors)})
            return sorted(out,key=lambda z:(z['bbox'][1],z['bbox'][0]))
          def special_bboxes(frame):
            f=np.asarray(frame,dtype=np.int16)[:55,:64];out=[]
            for c in sorted(int(v) for v in np.unique(f)):
              if c in {3,4,5}:continue
              ys,xs=np.where(f==c)
              if len(xs):out.append({'color':c,'count':int(len(xs)),'bbox':[int(xs.min()),int(ys.min()),int(xs.max()),int(ys.max())]})
            return out

          last=None
          for attempt in range(1,4):
            try:
              arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
              env=arcade.make('ls20',save_recording=False,include_frame_data=True)
              if env is None:raise RuntimeError('ENV_CREATE_FAILED')
              amap={a.value:a for a in env.action_space};obs=env.observation_space
              for a in prefix+BASE:
                obs=env.step(amap[a])
                if obs is None:raise RuntimeError('NO_OBS_BASE')
              f=np.asarray(obs.frame[-1],dtype=np.int16);p=pos(f);k=key(f);e=int((f==11).sum())
              if obs.levels_completed!=5 or p!=(54,35) or k!={'color':8,'mask':TM}:
                raise ValueError(f'SURVEY_GUARD_FAILED levels={obs.levels_completed} pos={p} key={k} energy={e}')
              guard={'pos':list(p),'key':k,'energy_proxy':e,'levels':obs.levels_completed}
              break
            except ValueError:raise
            except Exception as exc:
              last=f'{type(exc).__name__}:{exc}';time.sleep(min(2*attempt,5))
          else:raise RuntimeError('ENV_RETRY_EXHAUSTED '+str(last))

          frames=[];prev=np.asarray(obs.frame[-1],dtype=np.int16)
          frames.append({'t':0,'energy_proxy':int((prev==11).sum()),'pos':list(pos(prev)),'key':key(prev),'special':special_bboxes(prev)})
          for t in range(1,WAITS+1):
            obs=env.step(amap[4])  # blocked right at Gate-1 marker = wait surrogate
            if obs is None:break
            cur=np.asarray(obs.frame[-1],dtype=np.int16)
            frames.append({'t':t,'energy_proxy':int((cur==11).sum()),'pos':None if pos(cur) is None else list(pos(cur)),'key':key(cur),
                           'diff_components':diff_components(prev,cur),'special':special_bboxes(cur),
                           'levels':obs.levels_completed,'state':obs.state.value})
            prev=cur
          out={'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),
               'guard_receipt':guard,'wait_action':4,'waits_requested':WAITS,'frames':frames}
          print('SUPERCELL_RESULT='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
