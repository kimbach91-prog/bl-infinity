name: ARC3 ls20 L3 corrected fresh-energy completion

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Run corrected L3 candidate
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          base=json.loads(Path('public_benchmark/arc-agi-3/route.json').read_text())['actions']
          # Phase A: color -> first refill -> shape rotator twice. At end key is pixel-for-pixel equal to target.
          pre=[1]*8+[3]+[2]*8 + [1]*3+[3]*2 + [4]*7+[1]*4+[3] + [4,3]
          # Phase B: nearest unused refill is only 4 moves away: (49,10)->(34,15).
          # Then descend to row 25, traverse to right corridor, descend into exit door.
          post=[2,3,3,3] + [2,2] + [4,4,4,4] + [2,2,2,2]
          l3=pre+post

          arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          env=arcade.make('ls20',save_recording=False,include_frame_data=True)
          if env is None: raise SystemExit('ENV_CREATE_FAILED')
          amap={a.value:a for a in env.action_space}; obs=env.observation_space
          executed=[]; trace=[]
          for i,a in enumerate(base+l3,1):
            obs=env.step(amap[a])
            if obs is None: raise SystemExit(f'NO_OBS_AT_{i}')
            executed.append(a)
            li=i-len(base)
            if li>=34:
              f=np.asarray(obs.frame[-1],dtype=np.int16)
              trace.append({'l3_i':li,'a':a,'levels':obs.levels_completed,'state':obs.state.value,'color11_total':int((f==11).sum())})
            if obs.levels_completed>=3 or obs.state.value!='NOT_FINISHED': break
          out={
            'candidate_l3_actions':len(l3),
            'executed_l3':len(executed)-len(base),
            'total_executed':len(executed),
            'levels_completed':obs.levels_completed,
            'state':obs.state.value,
            'route_sha256':hashlib.sha256(','.join(map(str,executed)).encode()).hexdigest(),
            'executed_actions':executed,
            'tail_trace':trace
          }
          Path('public_benchmark/arc-agi-3/dev/l3-corrected-fresh-energy-completion.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l3-corrected-fresh-energy-completion.json
          git commit -m 'benchmark: save corrected L3 completion receipt [skip ci]'
          git push
