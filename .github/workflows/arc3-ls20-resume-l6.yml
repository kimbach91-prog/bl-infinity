name: ARC3 ls20 L6 coarse-grid decoder

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Decode complete L6 coarse grid and gate transition
        run: |
          python - <<'PY'
          import json,logging,time,hashlib
          from pathlib import Path
          from collections import Counter
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          p4=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          p5=json.loads((ROOT/'l5-verified-completion.json').read_text())['l5_actions_executed']
          prefix=p4+p5
          SHAPE_E=[1,4,4,1,2,1,2,1,2,3,3,4,4,1,2,1]
          TO_REFILL=[2,3,3,3,3,3]
          TO_COLOR8=[1,1,4,1,4,1,4,4,4,4]
          TARGET_READY=SHAPE_E+TO_REFILL+TO_COLOR8
          TO_GATE=[4,4,1,4]
          TM=[1,0,1,1,1,0,0,1,1]

          def candidates(frame):
            f=np.asarray(frame,dtype=np.int16);out=[]
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5):continue
                vals,cts=np.unique(w,return_counts=True);d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:out.append((x,y))
            return out
          def key(frame):
            f=np.asarray(frame,dtype=np.int16);cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True);cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0];mask=[]
            for r in range(3):
              for c in range(3):
                b=cur[2*r:2*r+2,2*c:2*c+2];mask.append(1 if int((b==color).sum())>=2 else 0)
            return {'color':color,'mask':mask}

          X=list(range(4,60,5));Y=list(range(0,55,5))
          def tile_info(frame,x,y):
            f=np.asarray(frame,dtype=np.int16);w=f[y:y+5,x:x+5]
            c=Counter(map(int,w.flatten()))
            if c.get(9,0)==15 and c.get(12,0)==10:return 'A',dict(c)
            if c.get(5,0)==19 and c.get(8,0)==6:return 'D',dict(c)
            if c.get(5,0)==19 and c.get(9,0)==6:return 'd',dict(c)
            if c.get(11,0)>=8:return 'R',dict(c)
            if c.get(1,0)>=5:return 'P',dict(c)
            if c.get(3,0)>=20:return '.',dict(c)
            if c.get(4,0)>=20:return '#',dict(c)
            if c.get(5,0)>=15:return 'G',dict(c)
            return '?',dict(c)
          def grid(frame):
            rows=[];details=[]
            for y in Y:
              chars=[]
              for x in X:
                ch,c=tile_info(frame,x,y);chars.append(ch)
                if ch not in {'.','#'}:details.append({'anchor':[x,y],'type':ch,'counts':c})
              rows.append(''.join(chars))
            return rows,details

          last=None
          for attempt in range(1,4):
            try:
              arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
              env=arcade.make('ls20',save_recording=False,include_frame_data=True)
              if env is None:raise RuntimeError('ENV_CREATE_FAILED')
              amap={a.value:a for a in env.action_space};obs=env.observation_space
              for a in prefix+TARGET_READY:
                obs=env.step(amap[a])
                if obs is None:raise RuntimeError('NO_OBS_TARGET_READY')
              f0=np.asarray(obs.frame[-1],dtype=np.int16)
              if obs.levels_completed!=5 or candidates(f0)!=[(29,25)] or key(f0)!={'color':8,'mask':TM}:
                raise ValueError(f'READY_GUARD_FAILED levels={obs.levels_completed} candidates={candidates(f0)} key={key(f0)}')
              break
            except ValueError:raise
            except Exception as e:
              last=f'{type(e).__name__}:{e}';time.sleep(min(2*attempt,5))
          else:raise RuntimeError('ENV_RETRY_EXHAUSTED '+str(last))

          g0,d0=grid(f0)
          trace=[]
          for i,a in enumerate(TO_GATE,1):
            before=np.asarray(obs.frame[-1],dtype=np.int16);bc=candidates(before);bk=key(before)
            obs=env.step(amap[a]);after=np.asarray(obs.frame[-1],dtype=np.int16)
            trace.append({'i':i,'a':a,'before_candidates':[list(p) for p in bc],'after_candidates':[list(p) for p in candidates(after)],'before_key':bk,'after_key':key(after),'levels':obs.levels_completed,'energy_proxy':int((after==11).sum())})
          fg=np.asarray(obs.frame[-1],dtype=np.int16);gg,dg=grid(fg)
          obs=env.step(amap[4]);fe=np.asarray(obs.frame[-1],dtype=np.int16);ge,de=grid(fe)

          out={'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),
               'x_anchors':X,'y_anchors':Y,
               'target_ready':{'candidates':[list(p) for p in candidates(f0)],'key':key(f0),'grid':g0,'details':d0},
               'to_gate_trace':trace,
               'gate_before_east':{'candidates':[list(p) for p in candidates(fg)],'key':key(fg),'grid':gg,'details':dg},
               'gate_after_east':{'candidates':[list(p) for p in candidates(fe)],'key':key(fe),'levels':obs.levels_completed,'grid':ge,'details':de}}
          print('SUPERCELL_RESULT='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
