name: ARC3 ls20 L6 color14-to8 one-step probes

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        action: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTION: ${{ matrix.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Probe exactly one action from verified L6 color14 state
        run: |
          python - <<'PY'
          import os,json,logging,time,hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          p4=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          p5=json.loads((ROOT/'l5-verified-completion.json').read_text())['l5_actions_executed']
          prefix=p4+p5
          SHAPE_E=[1,4,4,1,2,1,2,1,2,3,3,4,4,1,2,1]
          TO_COLOR=[2,3,3,3,3,3,1,1,1,1,4,4]
          CORE=SHAPE_E+TO_COLOR
          START=(24,50); EXPECT=(19,25); TM=[1,0,1,1,1,0,0,1,1]
          a=int(os.environ['ACTION'])

          def pos(frame):
            f=np.asarray(frame,dtype=np.int16)
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5): continue
                vals,cts=np.unique(w,return_counts=True);d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:return (x,y)
            return None
          def key(frame):
            f=np.asarray(frame,dtype=np.int16);cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True);cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0];mask=[]
            for r in range(3):
              for c in range(3):
                b=cur[2*r:2*r+2,2*c:2*c+2];mask.append(1 if int((b==color).sum())>=2 else 0)
            return {'color':color,'mask':mask}
          def make_env():
            last=None
            for attempt in range(1,5):
              try:
                arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
                env=arcade.make('ls20',save_recording=False,include_frame_data=True)
                if env is None: raise RuntimeError('ENV_CREATE_FAILED')
                amap={x.value:x for x in env.action_space};obs=env.observation_space
                for x in prefix+CORE:
                  obs=env.step(amap[x])
                  if obs is None: raise RuntimeError('NO_OBS_REPLAY')
                f=np.asarray(obs.frame[-1],dtype=np.int16);p=pos(f);k=key(f)
                if obs.levels_completed!=5 or p!=EXPECT or k['color']!=14 or k['mask']!=TM:
                  raise RuntimeError(f'BAD_COLOR14_START levels={obs.levels_completed} pos={p} key={k}')
                return env,amap,obs
              except Exception as e:
                last=f'{type(e).__name__}:{e}';time.sleep(min(2*attempt,6))
            raise RuntimeError('ENV_RETRY_EXHAUSTED '+str(last))

          env,amap,obs=make_env()
          before=np.asarray(obs.frame[-1],dtype=np.int16);bk=key(before);bp=pos(before);b11=int((before==11).sum())
          obs=env.step(amap[a])
          if obs is None: raise RuntimeError('NO_OBS_PROBE')
          after=np.asarray(obs.frame[-1],dtype=np.int16);ak=key(after);ap=pos(after);a11=int((after==11).sum())
          out={'action':a,'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),
               'before':{'pos':list(bp),'key':bk,'energy_proxy':b11,'levels':5},
               'after':{'pos':None if ap is None else list(ap),'key':ak,'energy_proxy':a11,'levels':obs.levels_completed,'state':obs.state.value},
               'color8_preserved_target':ak['color']==8 and ak['mask']==TM}
          print('SUPERCELL_RESULT='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
