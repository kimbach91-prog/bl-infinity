name: ARC3 ls20 public-observation candidate runner

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC toolkit
        run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Run candidate from verified 2/7 public prefix
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          base = json.loads(Path('public_benchmark/arc-agi-3/route.json').read_text())['actions']
          # L3 geometry-only candidate: start bottom-left -> top corridor -> central shaft -> marked target.
          suffix = [1]*8 + [4]*4 + [2]*8
          arcade = arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          env = arcade.make('ls20', save_recording=False, include_frame_data=True)
          if env is None: raise SystemExit('ENV_CREATE_FAILED')
          amap = {a.value:a for a in env.action_space}
          obs = env.observation_space
          executed=[]
          for action_id in base + suffix:
              obs = env.step(amap[action_id])
              if obs is None: raise SystemExit('NO_OBS')
              executed.append(action_id)
          frame=np.asarray(obs.frame[-1],dtype=np.int16)
          values,counts=np.unique(frame,return_counts=True)
          result={
            'base_actions':len(base),
            'suffix':suffix,
            'suffix_actions':len(suffix),
            'total_actions':len(executed),
            'levels_completed':obs.levels_completed,
            'state':obs.state.value,
            'frame_sha256':hashlib.sha256(frame.tobytes()).hexdigest(),
            'route_sha256':hashlib.sha256(','.join(map(str,executed)).encode()).hexdigest(),
            'palette_counts':{str(int(k)):int(v) for k,v in zip(values,counts)},
          }
          Path('candidate-result.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          PY
      - name: Persist candidate receipt
        run: |
          mkdir -p public_benchmark/arc-agi-3/dev
          cp candidate-result.json public_benchmark/arc-agi-3/dev/l3-candidate-central-target.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l3-candidate-central-target.json
          git commit -m 'benchmark: save L3 geometry candidate receipt [skip ci]'
          git push
