name: ARC3 ls20 L5 target-ready door-exit supercells

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cell: [right_trace, down_exit, up_exit, left_exit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Trace exits from verified target-ready L5 state
        run: |
          python - <<'PY'
          import os,json,logging,time,hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          prefix=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          START=(49,40); TC=8; TM=[1,0,1,1,1,0,0,1,1]
          COLOR=[1,3,1,1,1,1,3,1,1,3,3,4,3,4,3]
          TO_UR=[4,1,1,3,1,1,4]
          UR_TO_U2_UL=[3,2,2,3,3,3,3,1,2,1,3,3]
          UL_TO_LL=[4,2,4,2,2,2,2,2,4,2]
          LOWER_TWO=[4,1,1,2,1]
          CORE=COLOR+TO_UR+UR_TO_U2_UL+UL_TO_LL+LOWER_TWO
          sequences={
            'right_trace':[4,2,4,4,1,4,4,4,4,2,2,2,1],
            'down_exit':[2,4,4,4,1,4,4,4,4,4,2,2,2,1],
            'up_exit':[1,4,4,2,4,4,1,4,4,4,4,2,2,2,1],
            'left_exit':[3,2,4,4,1,4,4,4,4,2,2,2,1],
          }
          seq=sequences[os.environ['CELL']]
          def pos(frame):
            f=np.asarray(frame,dtype=np.int16)
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5):continue
                vals,cts=np.unique(w,return_counts=True);d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:return (x,y)
            return None
          def key(frame):
            f=np.asarray(frame,dtype=np.int16);cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True);cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0];mask=[]
            for r in range(3):
              for c in range(3):
                b=cur[2*r:2*r+2,2*c:2*c+2];mask.append(1 if int((b==color).sum())>=2 else 0)
            return {'color':color,'mask':mask}
          def make_env():
            last=None
            for attempt in range(1,5):
              try:
                arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE);env=arcade.make('ls20',save_recording=False,include_frame_data=True)
                if env is None:raise RuntimeError('ENV_CREATE_FAILED')
                amap={a.value:a for a in env.action_space};obs=env.observation_space
                for a in prefix:
                  obs=env.step(amap[a])
                  if obs is None:raise RuntimeError('NO_OBS_PREFIX')
                f=np.asarray(obs.frame[-1],dtype=np.int16)
                if obs.levels_completed!=4 or pos(f)!=START:raise RuntimeError('BAD_START')
                return env,amap,obs
              except Exception as e:
                last=f'{type(e).__name__}:{e}';time.sleep(min(2*attempt,6))
            raise RuntimeError('ENV_RETRY_EXHAUSTED '+str(last))
          env,amap,obs=make_env()
          for a in CORE:
            obs=env.step(amap[a])
            if obs is None:raise RuntimeError('NO_OBS_CORE')
          f=np.asarray(obs.frame[-1],dtype=np.int16);core={'pos':list(pos(f)),'key':key(f),'e':int((f==11).sum()),'levels':obs.levels_completed}
          if core['key']['color']!=TC or core['key']['mask']!=TM: raise RuntimeError('CORE_NOT_TARGET_READY '+json.dumps(core))
          trace=[];first_change=None
          for i,a in enumerate(seq,1):
            bef=np.asarray(obs.frame[-1],dtype=np.int16);bp=pos(bef);bk=key(bef);b11=int((bef==11).sum())
            obs=env.step(amap[a])
            if obs is None:break
            aft=np.asarray(obs.frame[-1],dtype=np.int16);ap=pos(aft);ak=key(aft);a11=int((aft==11).sum())
            ev={'i':i,'a':a,'from':None if bp is None else list(bp),'to':None if ap is None else list(ap),'before_key':bk,'after_key':ak,'before11':b11,'after11':a11,'target_ready':ak['color']==TC and ak['mask']==TM,'levels':obs.levels_completed,'state':obs.state.value}
            trace.append(ev)
            if first_change is None and not ev['target_ready']:first_change=ev
            if obs.levels_completed>4 or obs.state.value!='NOT_FINISHED':break
          out={'cell':os.environ['CELL'],'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),'core_actions':len(CORE),'core':core,'sequence':seq,'first_target_loss':first_change,'levels_completed':obs.levels_completed if obs else None,'state':obs.state.value if obs else None,'trace':trace}
          print('SUPERCELL_RESULT='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
