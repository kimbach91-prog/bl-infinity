name: ARC3 ls20 L3 physical movement trace

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Trace physical movement via public frame diffs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          base=json.loads(Path('public_benchmark/arc-agi-3/route.json').read_text())['actions']
          l3=[1]*8+[3]+[2]*8 + [1]*3+[3]*2 + [4]*7+[1]*4+[3] + [4,3] + [4]+[2]*7
          arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          env=arcade.make('ls20',save_recording=False,include_frame_data=True)
          amap={a.value:a for a in env.action_space}; obs=env.observation_space
          for a in base: obs=env.step(amap[a])
          rows=[]
          for i,a in enumerate(l3,1):
            before=np.asarray(obs.frame[-1],dtype=np.int16)
            obs=env.step(amap[a]); after=np.asarray(obs.frame[-1],dtype=np.int16)
            mask=before[:50,:]!=after[:50,:]
            ys,xs=np.where(mask)
            bbox=None if len(xs)==0 else [int(xs.min()),int(ys.min()),int(xs.max()),int(ys.max())]
            rows.append({'i':i,'a':a,'play_diff':int(mask.sum()),'play_bbox':bbox,'meter11':int((after==11).sum()),'levels':obs.levels_completed,'state':obs.state.value})
          Path('public_benchmark/arc-agi-3/dev/l3-physical-movement-trace.json').write_text(json.dumps(rows,indent=2))
          PY
      - name: Persist trace
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l3-physical-movement-trace.json
          git commit -m 'benchmark: save L3 physical movement trace [skip ci]'
          git push
