name: ARC3 ls20 L5 upper operator cycle exhaust

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        touches: [4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOUCHES: ${{ matrix.touches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Exhaust upper L5 operator touch cycle
        run: |
          python - <<'PY'
          import os,json,logging,time,hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          prefix=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          START=(49,40); TARGET=[1,0,1,1,1,0,0,1,1]
          route=[1,3,1,1,1,1,3,3,3,3,3]  # verified start -> (19,15)
          n=int(os.environ['TOUCHES']); probe=[]
          for _ in range(n): probe.extend([1,2])

          def pos(frame):
            f=np.asarray(frame,dtype=np.int16)
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5):continue
                vals,cts=np.unique(w,return_counts=True);d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:return (x,y)
            return None
          def key(frame):
            f=np.asarray(frame,dtype=np.int16);cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True);cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0];mask=[]
            for r in range(3):
              for c in range(3):
                b=cur[2*r:2*r+2,2*c:2*c+2];mask.append(1 if int((b==color).sum())>=2 else 0)
            return {'color':color,'mask':mask}
          def make_env():
            last=None
            for attempt in range(1,5):
              try:
                arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE);env=arcade.make('ls20',save_recording=False,include_frame_data=True)
                if env is None:raise RuntimeError('ENV_CREATE_FAILED')
                amap={a.value:a for a in env.action_space};obs=env.observation_space
                for a in prefix:
                  obs=env.step(amap[a])
                  if obs is None:raise RuntimeError('NO_OBS_PREFIX')
                f=np.asarray(obs.frame[-1],dtype=np.int16)
                if obs.levels_completed!=4 or pos(f)!=START:raise RuntimeError('BAD_START')
                return env,amap,obs
              except Exception as e:
                last=f'{type(e).__name__}:{e}';time.sleep(min(2*attempt,6))
            raise RuntimeError('ENV_RETRY_EXHAUSTED '+str(last))
          env,amap,obs=make_env();trace=[];touch_states=[];found=None
          for i,a in enumerate(route,1):
            obs=env.step(amap[a]);
            if obs is None:raise RuntimeError('NO_OBS_ROUTE')
          for i,a in enumerate(probe,1):
            bef=np.asarray(obs.frame[-1],dtype=np.int16);bp=pos(bef);bk=key(bef);b11=int((bef==11).sum())
            obs=env.step(amap[a]);
            if obs is None:break
            aft=np.asarray(obs.frame[-1],dtype=np.int16);ak=key(aft);ap=pos(aft)
            ev={'i':i,'a':a,'from':list(bp),'to':None if ap is None else list(ap),'before_key':bk,'after_key':ak,'before11':b11,'after11':int((aft==11).sum()),'levels':obs.levels_completed,'state':obs.state.value}
            trace.append(ev)
            if a==1 and ap==(19,10): touch_states.append({'touch':len(touch_states)+1,'key':ak,'energy_proxy':ev['after11']})
            if ak['mask']==TARGET:
              found={'i':i,'actions':probe[:i],'event':ev};break
            if obs.levels_completed>4 or obs.state.value!='NOT_FINISHED':break
          out={'touches_requested':n,'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),'route':route,'probe':probe,'target_mask':TARGET,'touch_states':touch_states,'found':found,'final':trace[-1] if trace else None}
          print('SUPERCELL_RESULT='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
