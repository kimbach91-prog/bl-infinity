name: ARC3 ls20 L5 full completion supercells

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        finish: [up_once, up_twice, up_left, up_right]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINISH: ${{ matrix.finish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Execute composed L5 candidate
        run: |
          python - <<'PY'
          import os,json,logging,time,hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          prefix=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          START=(49,40)
          TARGET_COLOR=8
          TARGET_MASK=[1,0,1,1,1,0,0,1,1]

          color_route=[1,3,1,1,1,1,3,1,1,3]
          color_cycle=[3,4,3,4,3]                         # 12 -> 9 -> 14 -> 8
          to_upper_refill=[4,1,1,3,3,3,3,3,3,1,3]      # -> upper-left refill near (9,10)
          upper_two=[4,4,3,4]                            # A -> U1 -> U2
          to_lower_first=[2,4,4,4,4,4,2,2,2,2,3,3,2,3,3,1,3]
          to_lower_refill=[2,2,3]                        # -> lower-left refill at (14,45)
          lower_second=[4,1,1]                           # second 90deg rotation; U2 -> target E
          to_door_base=[4,2,4,4,1,4,4,4,4,2,2,2]       # -> (54,10) via verified bottom-right portal
          finishes={
            'up_once':[1],
            'up_twice':[1,1],
            'up_left':[1,3],
            'up_right':[1,4],
          }
          stages=[
            ('color_route',color_route),('color_cycle',color_cycle),('upper_refill',to_upper_refill),
            ('upper_two',upper_two),('lower_first',to_lower_first),('lower_refill',to_lower_refill),
            ('lower_second',lower_second),('door_base',to_door_base),('finish',finishes[os.environ['FINISH']])
          ]

          def pos(frame):
            f=np.asarray(frame,dtype=np.int16)
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5):continue
                vals,cts=np.unique(w,return_counts=True);d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:return (x,y)
            return None
          def key(frame):
            f=np.asarray(frame,dtype=np.int16);cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True);cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0];mask=[]
            for r in range(3):
              for c in range(3):
                b=cur[2*r:2*r+2,2*c:2*c+2];mask.append(1 if int((b==color).sum())>=2 else 0)
            return {'color':color,'mask':mask}
          def make_env():
            last=None
            for attempt in range(1,5):
              try:
                arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
                env=arcade.make('ls20',save_recording=False,include_frame_data=True)
                if env is None:raise RuntimeError('ENV_CREATE_FAILED')
                amap={a.value:a for a in env.action_space};obs=env.observation_space
                for a in prefix:
                  obs=env.step(amap[a])
                  if obs is None:raise RuntimeError('NO_OBS_PREFIX')
                f=np.asarray(obs.frame[-1],dtype=np.int16)
                if obs.levels_completed!=4 or pos(f)!=START:raise RuntimeError(f'BAD_START {obs.levels_completed} {pos(f)}')
                return env,amap,obs
              except Exception as e:
                last=f'{type(e).__name__}:{e}';time.sleep(min(2*attempt,6))
            raise RuntimeError('ENV_RETRY_EXHAUSTED '+str(last))

          env,amap,obs=make_env();milestones=[];executed=[];prev11=int((np.asarray(obs.frame[-1],dtype=np.int16)==11).sum())
          for label,actions in stages:
            for a in actions:
              obs=env.step(amap[a]);executed.append(a)
              if obs is None:break
              if obs.levels_completed>4 or obs.state.value!='NOT_FINISHED':break
            if obs is None:
              milestones.append({'stage':label,'obs':None});break
            f=np.asarray(obs.frame[-1],dtype=np.int16);k=key(f);p=pos(f);e=int((f==11).sum())
            milestones.append({'stage':label,'actions_executed':len(executed),'pos':None if p is None else list(p),'key':k,'energy_proxy':e,'energy_delta':e-prev11,'levels':obs.levels_completed,'state':obs.state.value})
            prev11=e
            if obs.levels_completed>4 or obs.state.value!='NOT_FINISHED':break

          f=np.asarray(obs.frame[-1],dtype=np.int16) if obs is not None else None
          result={
            'finish_variant':os.environ['FINISH'],
            'prefix_actions':len(prefix),'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),
            'candidate_actions':len(executed),'executed':executed,'milestones':milestones,
            'levels_completed':None if obs is None else obs.levels_completed,
            'state':None if obs is None else obs.state.value,
            'final_pos':None if f is None or pos(f) is None else list(pos(f)),
            'final_key':None if f is None else key(f),
            'target_color':TARGET_COLOR,'target_mask':TARGET_MASK,
          }
          print('SUPERCELL_RESULT='+json.dumps(result,separators=(',',':'),sort_keys=True))
          PY
