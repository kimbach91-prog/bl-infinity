name: ARC3 ls20 L4 graph route planner

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute directed routes between verified L4 landmarks
        run: |
          python - <<'PY'
          import json
          from collections import deque
          from pathlib import Path
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          data=json.loads((ROOT/'l4-color-rotator-explorer.json').read_text())
          graph={}
          for ps,edges in data['graph'].items():
            p=tuple(map(int,ps.split(',')))
            graph[p]={int(a):tuple(q) for a,q in edges.items()}
          def bfs(src,dst):
            q=deque([(src,[])])
            seen={src}
            while q:
              p,r=q.popleft()
              if p==dst:return r
              for a,nq in sorted(graph.get(p,{}).items()):
                if nq==p or nq in seen:continue
                seen.add(nq);q.append((nq,r+[a]))
            return None
          landmarks={
            'hub':(19,15),
            'shape':(24,30),
            'color':(34,30),
            'color_above':(34,25),
            'door_right':(14,5),
            'door_far_right':(19,5),
            'refill2':(34,50),
          }
          pairs={}
          for an,a in landmarks.items():
            for bn,b in landmarks.items():
              if an==bn:continue
              pairs[f'{an}->{bn}']=bfs(a,b)
          out={'landmarks':{k:list(v) for k,v in landmarks.items()},'routes':pairs}
          (ROOT/'l4-directed-landmark-routes.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist route plan
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l4-directed-landmark-routes.json
          git commit -m 'benchmark: save L4 directed landmark routes [skip ci]'
          git push
