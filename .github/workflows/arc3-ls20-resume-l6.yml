name: ARC3 ls20 compact semantic trace

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact existing semantic receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public_benchmark/arc-agi-3/dev/l3-semantic-events.json')
          events=json.loads(p.read_text())
          out=[]
          for e in events:
            out.append({k:e.get(k) for k in ('i','a','meter11','meter_delta','key_sha','key_changed','levels','state') if k in e})
          Path('public_benchmark/arc-agi-3/dev/l3-semantic-events-compact.json').write_text(json.dumps(out,indent=2))
          PY
      - name: Persist compact receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l3-semantic-events-compact.json
          git commit -m 'benchmark: compact L3 semantic events [skip ci]'
          git push
