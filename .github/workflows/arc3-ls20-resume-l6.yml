name: ARC3 ls20 L6 offline decoder summary

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summarize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize decoded L6 public frame
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public_benchmark/arc-agi-3/dev/l6-initial-decoder.json').read_text())
          frame=d['frame']
          special=[]
          for row in d['blocks']:
            for b in row:
              vals=b['counts']
              pure=(vals=={'3':25} or vals=={'4':25})
              agent=(vals.get('9')==15 and vals.get('12')==10 and sum(vals.values())==25)
              if not pure and not agent:
                special.append(b)
          comps={k:v for k,v in d['components'].items() if k in ['0','1','5','8','9','11','12','14']}
          doorish=[]
          for comp in comps.get('5',[]):
            if 30<=comp['n']<=120:
              x0,y0,x1,y1=comp['bbox'];pad=3
              yy0=max(0,y0-pad);yy1=min(63,y1+pad);xx0=max(0,x0-pad);xx1=min(63,x1+pad)
              patch=[r[xx0:xx1+1] for r in frame[yy0:yy1+1]]
              doorish.append({'component':comp,'patch_bbox':[xx0,yy0,xx1,yy1],'patch':patch})
          out={
            'levels':d['levels_completed'],'prefix_actions':d['prefix_actions'],'prefix_sha256':d['prefix_sha256'],
            'player':d['player_candidates'],'key':d['current_key'],'palette':d['palette'],
            'coarse':d['coarse'],'special_blocks':special,'components':comps,'doorish_color5':doorish
          }
          print('L6_SUMMARY='+json.dumps(out,separators=(',',':'),sort_keys=True))
          PY
