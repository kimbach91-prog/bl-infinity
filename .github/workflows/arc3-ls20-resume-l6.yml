name: ARC3 ls20 L4 one-way gate orientation probes

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Probe one-way gate orientations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          prefix=json.loads(Path('public_benchmark/arc-agi-3/dev/l3-dual-refill-final-touch.json').read_text())['executed_actions']
          hub=[3,3,3,2,2,3,3,3,3]
          cases={
            'G_r6c7_from_above': hub+[4,4,4,4,2,2,2],
            'G_r4c5_from_right': hub+[4,4,4,4,2,3,3],
            'G_r5c9_from_left': hub+[4,4,4,4,2,4,2,4],
            'G_r8c5_from_left': hub+[2,3,2,2,2,2,4,4,4],
            'G_r6c3_from_below': hub+[2,3,2,2,2,4,1],
          }
          def agent(f):
            out=[]
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5): continue
                vals,cts=np.unique(w,return_counts=True); d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25: out.append([x,y])
            return out
          results={}
          for name,path in cases.items():
            arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
            env=arcade.make('ls20',save_recording=False,include_frame_data=True)
            amap={a.value:a for a in env.action_space}; obs=env.observation_space
            for a in prefix: obs=env.step(amap[a])
            f=np.asarray(obs.frame[-1],dtype=np.int16); trace=[]
            for i,a in enumerate(path,1):
              prev=f.copy(); before=agent(prev)
              obs=env.step(amap[a]); f=np.asarray(obs.frame[-1],dtype=np.int16)
              if i>=len(path)-2:
                trace.append({'i':i,'a':a,'before_agent':before,'after_agent':agent(f),'diff_n':int((f!=prev).sum()),'color11_total':int((f==11).sum()),'levels':obs.levels_completed,'state':obs.state.value})
            results[name]={'path':path,'trace':trace}
          Path('public_benchmark/arc-agi-3/dev/l4-one-way-gate-probes.json').write_text(json.dumps(results,indent=2,sort_keys=True))
          PY
      - name: Persist gate receipts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l4-one-way-gate-probes.json
          git commit -m 'benchmark: save L4 one-way gate probes [skip ci]'
          git push
