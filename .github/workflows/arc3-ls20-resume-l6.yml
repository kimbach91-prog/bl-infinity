name: ARC3 ls20 L3 key-state rotator decoder

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Decode target/current key and accessible rotator cycle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          base=json.loads(Path('public_benchmark/arc-agi-3/route.json').read_text())['actions']
          arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          env=arcade.make('ls20',save_recording=False,include_frame_data=True)
          amap={a.value:a for a in env.action_space}; obs=env.observation_space
          for a in base: obs=env.step(amap[a])

          def key_state(f):
            # Current key is the 6x6 scaled key inside bottom-left panel; target is 3x3 key inside exit door.
            cur=f[55:61,3:9]
            tgt=f[51:54,55:58]
            # dominant non-panel color in current-key region
            cur_vals,cur_cts=np.unique(cur,return_counts=True)
            cur_color=int(cur_vals[np.argmax(cur_cts)])
            # choose non-door-border/background target color by most frequent in 3x3 region
            tgt_vals,tgt_cts=np.unique(tgt,return_counts=True)
            tgt_color=int(tgt_vals[np.argmax(tgt_cts)])
            cur_mask=[]
            for r in range(3):
              row=[]
              for c in range(3):
                block=cur[2*r:2*r+2,2*c:2*c+2]
                row.append(1 if int((block==cur_color).sum())>=2 else 0)
              cur_mask.append(row)
            tgt_mask=(tgt==tgt_color).astype(int).tolist()
            return {'current_color':cur_color,'current_mask':cur_mask,'target_color':tgt_color,'target_mask':tgt_mask,'current_raw':cur.tolist(),'target_raw':tgt.tolist()}

          states=[]
          f=np.asarray(obs.frame[-1],dtype=np.int16)
          states.append({'touches':0,'meter11':int((f==11).sum()),'key':key_state(f)})
          # Reach accessible rotator at r8c4: 8U, L, 8D.
          to_rot=[1]*8+[3]+[2]*8
          for a in to_rot: obs=env.step(amap[a])
          f=np.asarray(obs.frame[-1],dtype=np.int16)
          states.append({'touches':1,'meter11':int((f==11).sum()),'key':key_state(f)})
          # leave one cell up and re-enter down for additional rotations
          for touch in (2,3,4):
            obs=env.step(amap[1]); obs=env.step(amap[2])
            f=np.asarray(obs.frame[-1],dtype=np.int16)
            states.append({'touches':touch,'meter11':int((f==11).sum()),'key':key_state(f)})
          Path('result.json').write_text(json.dumps(states,indent=2,sort_keys=True))
          PY
      - name: Persist receipt
        run: |
          mkdir -p public_benchmark/arc-agi-3/dev
          cp result.json public_benchmark/arc-agi-3/dev/l3-key-state-rotator-cycle.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l3-key-state-rotator-cycle.json
          git commit -m 'benchmark: decode L3 key-state rotator cycle [skip ci]'
          git push
