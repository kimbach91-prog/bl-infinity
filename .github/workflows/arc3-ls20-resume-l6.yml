name: ARC3 ls20 L4 object probes

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Probe L4 refill and rotator candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          prefix=json.loads(Path('public_benchmark/arc-agi-3/dev/l3-dual-refill-final-touch.json').read_text())['executed_actions']
          cases={
            'candidate_color_r6c6':[3,3,3,2,2,2,2,3,2],
            'candidate_shape_r6c4':[3,3,3,2,2,3,3,3,2,3,3,2,2,2,4,4,1],
            'candidate_refill_r3c3':[3,3,3,2,2,3,3,3,3],
          }
          def key_state(f):
            cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True)
            candidates=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(candidates,key=lambda z:z[1])[0]
            mask=[]
            for r in range(3):
              row=[]
              for c in range(3): row.append(1 if int((cur[2*r:2*r+2,2*c:2*c+2]==color).sum())>=2 else 0)
              mask.append(row)
            return {'color':color,'mask':mask,'raw':cur.tolist()}
          def agent(f):
            out=[]
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5): continue
                vals,cts=np.unique(w,return_counts=True); d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25: out.append([x,y])
            return out
          results={}
          for name,suffix in cases.items():
            arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
            env=arcade.make('ls20',save_recording=False,include_frame_data=True)
            if env is None: raise SystemExit('ENV_CREATE_FAILED')
            amap={a.value:a for a in env.action_space}; obs=env.observation_space
            for a in prefix: obs=env.step(amap[a])
            before=np.asarray(obs.frame[-1],dtype=np.int16)
            before_key=key_state(before); trace=[]
            for i,a in enumerate(suffix,1):
              prev=np.asarray(obs.frame[-1],dtype=np.int16)
              obs=env.step(amap[a]); f=np.asarray(obs.frame[-1],dtype=np.int16)
              if i>=len(suffix)-1:
                trace.append({'i':i,'a':a,'agent':agent(f),'color11_total':int((f==11).sum()),'diff_n':int((f!=prev).sum()),'key':key_state(f),'levels':obs.levels_completed,'state':obs.state.value})
            results[name]={'suffix':suffix,'before_key':before_key,'trace':trace,'levels':obs.levels_completed,'state':obs.state.value}
          Path('public_benchmark/arc-agi-3/dev/l4-object-probes.json').write_text(json.dumps(results,indent=2,sort_keys=True))
          PY
      - name: Persist probe receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l4-object-probes.json
          git commit -m 'benchmark: save L4 object probes [skip ci]'
          git push
