name: ARC3 ls20 L4 color-rotator explorer

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Continue L4 graph until held-key color changes
        run: |
          python - <<'PY'
          import json, logging, hashlib, time
          from collections import deque
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          prefix=json.loads((ROOT/'l3-dual-refill-final-touch.json').read_text())['executed_actions']
          hub_route=[3,3,3,2,2,3,3,3,3]
          hub=(19,15)
          priority=[2,4,3,1]
          max_episodes=30
          max_steps=18

          def pos(frame):
            f=np.asarray(frame,dtype=np.int16)
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5): continue
                vals,cts=np.unique(w,return_counts=True)
                d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:
                  return (x,y)
            return None

          def key(frame):
            f=np.asarray(frame,dtype=np.int16)
            cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True)
            cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0]
            mask=[]
            for r in range(3):
              for c in range(3):
                block=cur[2*r:2*r+2,2*c:2*c+2]
                mask.append(1 if int((block==color).sum())>=2 else 0)
            return (color,tuple(mask))

          seed=json.loads((ROOT/'l4-resilient-transition-explorer.json').read_text())
          graph={}
          for ps,edges in seed.get('graph',{}).items():
            x,y=map(int,ps.split(',')); p=(x,y)
            graph[p]={int(a):tuple(q) for a,q in edges.items()}

          def edge(p,a,q):
            if p is not None and q is not None:
              graph.setdefault(tuple(p),{})[int(a)]=tuple(q)

          def bfs(src,predicate,depth=18):
            q=deque([(src,[])])
            seen={src}
            while q:
              p,path=q.popleft()
              if predicate(p): return path,p
              if len(path)>=depth: continue
              for a in priority:
                nq=graph.get(p,{}).get(a)
                if nq is None or nq==p or nq in seen: continue
                seen.add(nq); q.append((nq,path+[a]))
            return None,None

          def make_hub():
            last='unknown'
            for attempt in range(1,5):
              try:
                arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
                env=arcade.make('ls20',save_recording=False,include_frame_data=True)
                if env is None: raise RuntimeError('ENV_CREATE_FAILED')
                amap={a.value:a for a in env.action_space}; obs=env.observation_space
                for a in prefix+hub_route:
                  obs=env.step(amap[a])
                  if obs is None: raise RuntimeError('NO_OBS_PREFIX')
                f=np.asarray(obs.frame[-1],dtype=np.int16)
                if obs.levels_completed!=3 or pos(f)!=hub:
                  raise RuntimeError('BAD_HUB')
                return env,amap,obs
              except Exception as e:
                last=type(e).__name__; time.sleep(min(2*attempt,6))
            raise RuntimeError('MAKE_HUB_RETRIES_EXHAUSTED_'+last)

          initial_color=14
          found=None
          episodes=[]
          network_failures=0

          for ep in range(1,max_episodes+1):
            route,target=bfs(hub,lambda p:any(a not in graph.get(p,{}) for a in priority),depth=max_steps-1)
            if target is None: break
            try:
              env,amap,obs=make_hub()
            except Exception as e:
              network_failures+=1
              episodes.append({'episode':ep,'stage':'make_hub','error':type(e).__name__})
              continue

            cur=hub; actions=[]; discoveries=[]; failed=False
            f=np.asarray(obs.frame[-1],dtype=np.int16); ks=key(f)
            try:
              for a in route:
                before=cur
                obs=env.step(amap[a]); f=np.asarray(obs.frame[-1],dtype=np.int16)
                cur=pos(f); ks=key(f); actions.append(a)
                if cur is None: raise RuntimeError('NO_AGENT')
                edge(before,a,cur)
              if cur!=target: raise RuntimeError('ROUTE_DIVERGED')

              while len(actions)<max_steps:
                untried=[a for a in priority if a not in graph.get(cur,{})]
                if untried:
                  a=untried[0]
                else:
                  path2,t2=bfs(cur,lambda p:any(a not in graph.get(p,{}) for a in priority),depth=max_steps-len(actions))
                  if not path2: break
                  a=path2[0]
                before=cur; before_key=ks
                obs=env.step(amap[a]); f=np.asarray(obs.frame[-1],dtype=np.int16)
                cur=pos(f); ks=key(f); actions.append(a)
                if cur is None: raise RuntimeError('NO_AGENT_AFTER_STEP')
                is_new=a not in graph.get(before,{})
                edge(before,a,cur)
                if is_new:
                  discoveries.append({'a':a,'from':list(before),'to':list(cur),'before_key':{'color':before_key[0],'mask':list(before_key[1])},'after_key':{'color':ks[0],'mask':list(ks[1])},'color11_total':int((f==11).sum())})
                if ks[0]!=initial_color:
                  found={'episode':ep,'route_from_hub':actions,'l4_route_from_start':hub_route+actions,'position':list(cur),'key':{'color':ks[0],'mask':list(ks[1])},'color11_total':int((f==11).sum()),'levels_completed':obs.levels_completed,'state':obs.state.value}
                  break
            except Exception as e:
              failed=True; network_failures+=1
              discoveries.append({'error':type(e).__name__,'stage':'episode'})
            episodes.append({'episode':ep,'frontier':list(target),'route_to_frontier':route,'actions':actions,'discoveries':discoveries,'failed':failed,'end_pos':None if cur is None else list(cur)})
            if found: break

          # shortest position routes in final directed graph
          routes={}; q=deque([(hub,[])]); seen={hub}
          while q:
            p,r=q.popleft(); routes[f'{p[0]},{p[1]}']=r
            for a in priority:
              nq=graph.get(p,{}).get(a)
              if nq is None or nq==p or nq in seen: continue
              seen.add(nq); q.append((nq,r+[a]))

          out={'found':found,'episodes_run':len(episodes),'network_failures':network_failures,'graph_nodes':len(graph),'reachable_positions':len(routes),'graph':{f'{p[0]},{p[1]}':{str(a):list(q) for a,q in sorted(edges.items())} for p,edges in sorted(graph.items())},'shortest_routes_from_hub':routes,'episodes':episodes,'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest()}
          (ROOT/'l4-color-rotator-explorer.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist color explorer receipt
        if: always()
        run: |
          test -f public_benchmark/arc-agi-3/dev/l4-color-rotator-explorer.json || exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l4-color-rotator-explorer.json
          git commit -m 'benchmark: save L4 color-rotator explorer [skip ci]' || exit 0
          git push
