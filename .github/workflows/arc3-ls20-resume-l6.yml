name: ARC3 ls20 public-observation continuity canary

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Replay prefix and observe current-level reset through public API
        run: |
          mkdir -p observation_receipt
          python - <<'PY'
          import json,logging,time,hashlib,os
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.CRITICAL)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          p4=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          p5=json.loads((ROOT/'l5-verified-completion.json').read_text())['l5_actions_executed']
          prefix=p4+p5
          assert hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest()=='67668a7276c5c34eac4a538c5bc34f26f761f6a334af13be7f5743dc8fa71481'
          base=[1,4,4,1,2,1,2,1,2,3,3,4,4,1,2,1]+[2,3,3,3,3,3]+[1,1,4,1,4,1,4,4,4,4]+[4,4,1,4,1,4,1,1]+[4,2,2,2,1]
          arc=arc_agi.Arcade(operation_mode=OperationMode.NORMAL)
          env=arc.make('ls20',save_recording=False,include_frame_data=True)
          if env is None: raise RuntimeError('ENV_UNAVAILABLE')
          amap={a.value:a for a in env.action_space}
          obs=env.observation_space
          start=time.monotonic()
          for a in prefix:
              obs=env.step(amap[a])
              if obs is None: raise RuntimeError('OBSERVATION_MISSING')
          if obs.levels_completed!=5: raise RuntimeError('PREFIX_GUARD_FAILED')
          def record(tag,o):
              f=np.asarray(o.frame[-1],dtype=np.uint8)
              rec={'levels_completed':o.levels_completed,'state':o.state.value,'frame':f.tolist(),'frame_sha256':hashlib.sha256(f.tobytes()).hexdigest()}
              Path('observation_receipt/'+tag+'.json').write_text(json.dumps(rec,separators=(',',':')))
              return {k:v for k,v in rec.items() if k!='frame'}
          summary={'mode':'NORMAL_PUBLIC_DEVELOPMENT','source_sha':os.environ.get('GITHUB_SHA'),'prefix_actions':len(prefix),'prefix_seconds':time.monotonic()-start,'initial':record('l6_initial',obs)}
          for a in base: obs=env.step(amap[a])
          summary['gate1']=record('l6_gate1',obs)
          obs=env.reset()
          if obs is None: obs=env.observation_space
          summary['reset']=record('after_reset',obs)
          summary['local_game_files_present']=bool(list(Path('environment_files').glob('**/metadata.json')))
          summary['hidden_state_read']=False
          Path('observation_receipt/prefix.json').write_text(json.dumps({'actions':prefix,'base':base}))
          Path('observation_receipt/summary.json').write_text(json.dumps(summary,indent=2))
          print('PUBLIC_OBSERVATION_RECEIPT='+json.dumps(summary,separators=(',',':')))
          PY
      - name: Package pure-Python toolkit dependencies for offline analysis
        run: python -m pip download --disable-pip-version-check --no-deps -d observation_receipt/wheels 'arc-agi==0.9.9' 'arcengine==0.9.3' 'flask==3.1.3' 'werkzeug==3.1.8' 'blinker==1.9.0'
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-l6-public-observations
          path: observation_receipt/
          retention-days: 7
