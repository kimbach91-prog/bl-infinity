name: ARC3 ls20 L6 exact lock motif decoder

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Replay verified L6 world and scan exact 3x3 lock motifs
        run: |
          python - <<'PY'
          import json,logging,time,hashlib
          from pathlib import Path
          from collections import deque,Counter
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.INFO)
          ROOT=Path('public_benchmark/arc-agi-3/dev')
          p4=json.loads((ROOT/'l4-corrected-full-completion.json').read_text())['full_actions_executed']
          p5=json.loads((ROOT/'l5-verified-completion.json').read_text())['l5_actions_executed']
          prefix=p4+p5
          SHAPE_E=[1,4,4,1,2,1,2,1,2,3,3,4,4,1,2,1]
          TO_REFILL=[2,3,3,3,3,3]
          TO_COLOR8=[1,1,4,1,4,1,4,4,4,4]
          TO_RIGHT_PORTAL=[4,4,1,4,1,4,1,1]
          ACTIVATE_GATE1_AND_RETURN=[4,2,2,2,1]
          BASE=SHAPE_E+TO_REFILL+TO_COLOR8+TO_RIGHT_PORTAL+ACTIVATE_GATE1_AND_RETURN
          GATE1={'color':8,'mask':[1,0,1,1,1,0,0,1,1]}
          TO_INTERCEPT=[1,1,3,1,1,3,3,1,3]
          SETTLE=[4,3,4,3]
          X_ANCHORS=list(range(4,60,5));Y_ANCHORS=list(range(0,55,5))

          def pos(frame):
            f=np.asarray(frame,dtype=np.int16)
            for y in range(0,55):
              for x in range(0,60):
                w=f[y:y+5,x:x+5]
                if w.shape!=(5,5):continue
                vals,cts=np.unique(w,return_counts=True);d={int(k):int(v) for k,v in zip(vals,cts)}
                if d.get(9,0)==15 and d.get(12,0)==10 and sum(d.values())==25:return (x,y)
            return None

          def key(frame):
            f=np.asarray(frame,dtype=np.int16);cur=f[55:61,3:9]
            vals,cts=np.unique(cur,return_counts=True);cand=[(int(v),int(c)) for v,c in zip(vals,cts) if int(v)!=5]
            color=max(cand,key=lambda z:z[1])[0];mask=[]
            for r in range(3):
              for c in range(3):
                b=cur[2*r:2*r+2,2*c:2*c+2];mask.append(1 if int((b==color).sum())>=2 else 0)
            return {'color':color,'mask':mask}

          def motif_scan(frame, wanted=None):
            f=np.asarray(frame,dtype=np.int16)[:55,:64]
            colors=[wanted['color']] if wanted else [8,9,14]
            out=[]
            for color in colors:
              for y in range(0,53):
                for x in range(0,62):
                  w=f[y:y+3,x:x+3]
                  if w.shape!=(3,3) or not np.all((w==5)|(w==color)):continue
                  mask=(w==color).astype(np.int8).reshape(-1).tolist();ones=sum(mask)
                  if ones<4 or ones>8:continue
                  if wanted is not None and mask!=wanted['mask']:continue
                  y0=max(0,y-2);y1=min(55,y+5);x0=max(0,x-2);x1=min(64,x+5)
                  support=f[y0:y1,x0:x1]
                  five=int((support==5).sum());same=int((support==color).sum())
                  # Locksmith doors in earlier verified levels embed a 3x3 color/5 motif in a 5-rich enclosure.
                  if five<12:continue
                  out.append({'x':x,'y':y,'color':color,'mask':mask,'ones':ones,'support5':five,'support_same_color':same,
                              'patch7':support.tolist()})
            # exact duplicates can arise only from identical coordinates; order by strongest 5 enclosure first.
            return sorted(out,key=lambda z:(-z['support5'],z['y'],z['x']))

          def anchor_grid(frame):
            f=np.asarray(frame,dtype=np.int16)[:55,:64];rows=[]
            for r,y in enumerate(Y_ANCHORS):
              rr=[]
              for c,x in enumerate(X_ANCHORS):
                w=f[y:y+5,x:x+5]
                vals,cts=np.unique(w,return_counts=True)
                d={int(k):int(v) for k,v in zip(vals,cts)}
                # Compact symbolic class; retain exact counts only for non-uniform blocks.
                if len(d)==1:
                  cls=f"U{next(iter(d))}"
                  rec={'r':r,'c':c,'x':x,'y':y,'class':cls}
                else:
                  rec={'r':r,'c':c,'x':x,'y':y,'class':'MIX','counts':d}
                rr.append(rec)
              rows.append(rr)
            return rows

          last=None
          for attempt in range(1,4):
            try:
              arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
              env=arcade.make('ls20',save_recording=False,include_frame_data=True)
              if env is None:raise RuntimeError('ENV_CREATE_FAILED')
              amap={a.value:a for a in env.action_space};obs=env.observation_space
              for a in prefix+BASE:
                obs=env.step(amap[a])
                if obs is None:raise RuntimeError('NO_OBS_BASE')
              f=np.asarray(obs.frame[-1],dtype=np.int16);p=pos(f);k=key(f);e=int((f==11).sum())
              if obs.levels_completed!=5 or p!=(54,35) or k!=GATE1:
                raise ValueError(f'DECODER_GUARD_FAILED levels={obs.levels_completed} pos={p} key={k} energy={e}')
              gate1_frame=f.copy();gate1_matches=motif_scan(f,k)
              break
            except ValueError:raise
            except Exception as exc:
              last=f'{type(exc).__name__}:{exc}';time.sleep(min(2*attempt,5))
          else:raise RuntimeError('ENV_RETRY_EXHAUSTED '+str(last))

          seq=TO_INTERCEPT+SETTLE;trace=[];first_change=None
          for i,a in enumerate(seq,1):
            bk=key(obs.frame[-1]);bp=pos(obs.frame[-1]);be=int((np.asarray(obs.frame[-1])==11).sum())
            obs=env.step(amap[a])
            if obs is None:break
            ak=key(obs.frame[-1]);ap=pos(obs.frame[-1]);ae=int((np.asarray(obs.frame[-1])==11).sum())
            ev={'i':i,'a':a,'from':None if bp is None else list(bp),'to':None if ap is None else list(ap),
                'before_key':bk,'after_key':ak,'before_energy':be,'after_energy':ae,
                'levels':obs.levels_completed,'state':obs.state.value}
            trace.append(ev)
            if first_change is None and ak!=bk:first_change=ev
            if obs.levels_completed>5:break

          finalf=np.asarray(obs.frame[-1],dtype=np.int16);finalk=key(finalf);finalp=pos(finalf)
          exact=motif_scan(finalf,finalk)
          all_motifs=motif_scan(finalf,None)
          grid=anchor_grid(finalf)
          out={
            'decoder':'deus-l6-exact-lock-motif/1.0',
            'prefix_sha256':hashlib.sha256(','.join(map(str,prefix)).encode()).hexdigest(),
            'gate1_state':{'pos':list(pos(gate1_frame)),'key':key(gate1_frame),'energy_proxy':int((gate1_frame==11).sum()),
                           'exact_lock_matches_after_gate1_activation':gate1_matches},
            'shape_transform':{'actions':seq,'first_key_change':first_change,'trace':trace},
            'final_state':{'pos':None if finalp is None else list(finalp),'key':finalk,'energy_proxy':int((finalf==11).sum()),
                           'levels':obs.levels_completed,'state':obs.state.value,
                           'exact_lock_matches':exact,'all_doorlike_motifs':all_motifs},
            'anchor_grid':grid
          }
          print('DEUS_LOCK_DECODER='+json.dumps(out,separators=(',',':'),sort_keys=True))
          if not exact:
            print('DECODER_VERDICT=NO_EXACT_CURRENT_KEY_LOCK_MATCH')
          else:
            print('DECODER_VERDICT=EXACT_CURRENT_KEY_LOCK_MATCH_FOUND count='+str(len(exact)))
          PY