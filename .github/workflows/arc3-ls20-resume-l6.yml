name: ARC3 ls20 L3 dual-refill completion

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Run dual-refill L3 candidate
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          base=json.loads(Path('public_benchmark/arc-agi-3/route.json').read_text())['actions']
          to_r2=[1]*8+[3]+[2]*8+[1]*3+[3]*2
          r2_to_r1=[4]*3+[1]*3
          r1_to_shape=[2]*2+[4]*4+[1]*2+[3]+[1]
          second_rotation=[4,3]
          to_door=[4]+[2]*7
          l3=to_r2+r2_to_r1+r1_to_shape+second_rotation+to_door

          arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          env=arcade.make('ls20',save_recording=False,include_frame_data=True)
          amap={a.value:a for a in env.action_space}; obs=env.observation_space
          executed=[]; milestones=[]
          for i,a in enumerate(base+l3,1):
            obs=env.step(amap[a]); executed.append(a)
            li=i-len(base)
            if li in (17,22,28,38,40,47,48) or obs.levels_completed>=3 or obs.state.value!='NOT_FINISHED':
              f=np.asarray(obs.frame[-1],dtype=np.int16)
              milestones.append({'l3_i':li,'a':a,'levels':obs.levels_completed,'state':obs.state.value,'meter11':int((f==11).sum())})
            if obs.levels_completed>=3 or obs.state.value!='NOT_FINISHED': break
          out={
            'candidate_l3_actions':len(l3),
            'executed_l3':len(executed)-len(base),
            'total_executed':len(executed),
            'levels_completed':obs.levels_completed,
            'state':obs.state.value,
            'route_sha256':hashlib.sha256(','.join(map(str,executed)).encode()).hexdigest(),
            'executed_actions':executed,
            'milestones':milestones
          }
          Path('public_benchmark/arc-agi-3/dev/l3-dual-refill-completion.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l3-dual-refill-completion.json
          git commit -m 'benchmark: save dual-refill L3 completion receipt [skip ci]'
          git push
