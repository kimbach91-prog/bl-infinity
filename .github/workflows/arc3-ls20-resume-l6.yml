name: ARC3 ls20 L3 matched-key fresh-energy candidate

on:
  push:
    branches:
      - deus/arc3-ls20-resume-l6-20260916
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' numpy
      - name: Run matched key with post-rotation refill
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          base=json.loads(Path('public_benchmark/arc-agi-3/route.json').read_text())['actions']
          pre=[1]*8+[3]+[2]*8 + [1]*3+[3]*2 + [4]*7+[1]*4+[3] + [4,3]
          # matched at r1c8. Detour via r2c5 refiller, then approach door from above with fresh energy.
          post=[4]+[2]*3+[3]*4+[1]*2 + [2]*2+[4]*4+[2]*4
          l3=pre+post
          arcade=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          env=arcade.make('ls20',save_recording=False,include_frame_data=True)
          amap={a.value:a for a in env.action_space}; obs=env.observation_space
          executed=[]; trace=[]
          for i,a in enumerate(base+l3,1):
            obs=env.step(amap[a]); executed.append(a)
            if i>len(base)+len(pre)-2:
              f=np.asarray(obs.frame[-1],dtype=np.int16)
              trace.append({'l3_i':i-len(base),'a':a,'levels':obs.levels_completed,'state':obs.state.value,'meter11':int((f==11).sum())})
            if obs.levels_completed>=3 or obs.state.value!='NOT_FINISHED': break
          f=np.asarray(obs.frame[-1],dtype=np.int16)
          out={'candidate_actions':len(l3),'executed_l3':len(executed)-len(base),'levels_completed':obs.levels_completed,'state':obs.state.value,'meter11':int((f==11).sum()),'route_sha256':hashlib.sha256(','.join(map(str,executed)).encode()).hexdigest(),'executed_actions':executed,'tail_trace':trace}
          Path('result.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist receipt
        run: |
          mkdir -p public_benchmark/arc-agi-3/dev
          cp result.json public_benchmark/arc-agi-3/dev/l3-matched-key-fresh-energy.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public_benchmark/arc-agi-3/dev/l3-matched-key-fresh-energy.json
          git commit -m 'benchmark: save L3 fresh-energy door candidate [skip ci]'
          git push
