name: ARC3 R314 bp35 alternate replay
on:
  push:
    branches: [deus/r314-bp35-alt-replay-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_bp35_alt_replay_314.py
      - .github/workflows/arc3-r314-bp35-alt-replay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r314:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_bp35_alt_replay_314.py
      - name: Stage bp35 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 9); do
            f="bp35-0a0ad940_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "public_trace/${f}"
          done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 10
          ! find public_trace -maxdepth 1 -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute R314
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in $(find public_trace -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_bp35_alt_replay_314.py "${args[@]}" --output r314.json 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r314.json'))
          assert d['schema']=='deus/arc3-r314-bp35-alt-replay/1'
          p=d['protocol']; t=d['truth']
          assert p['fit']=='p0-p4 only' and p['source_assisted_replay']=='p5-p9 only'
          assert p['p10_p19_staged_or_read'] is False and p['selection_is_source_assisted'] is True
          assert t['p5_p9_replay_is_source_assisted'] and t['p5_p9_already_observed_before_r314'] and not t['p10_p19_read']
          assert not t['solver_promotion'] and not t['kaggle_execution'] and not t['competition_submission']
          print(json.dumps({'verdict':d['verdict'],'best_mode':d['best_mode'],'modes':d['modes']},sort_keys=True))
          PY
          sha256sum r314.json runtime.txt stdout.txt public_trace/SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r314-bp35-alt-replay
          path: |
            r314.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          retention-days: 30
