name: Publish B∞ curated public surface

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == 'kimbach91-prog' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[OWNER-PUBLISH]'))
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout curated public tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Apply verified owner release patch
        shell: bash
        run: |
          set -euo pipefail
          expected_sha=b23c4be326a34e1705a0d85f7f8296f09e41a59a83b12dcb3b9aac89a9ecdb12
          if compgen -G '.github/release/hcm-0.3.patch.gz.b64.*' > /dev/null; then
            cat .github/release/hcm-0.3.patch.gz.b64.* | base64 -d > /tmp/hcm-0.3.patch.gz
            actual_sha="$(sha256sum /tmp/hcm-0.3.patch.gz | awk '{print $1}')"
            test "$actual_sha" = "$expected_sha"
            gzip -dc /tmp/hcm-0.3.patch.gz | git apply --whitespace=fix
            rm -f .github/release/hcm-0.3.patch.gz.b64.*
            rmdir .github/release 2>/dev/null || true
          else
            echo "No staged owner release patch"
          fi

      - name: Validate shared reader and public books
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.').resolve()

          required_assets = [
              root / 'assets/css/main.css',
              root / 'assets/css/reader.css',
              root / 'assets/js/site.js',
              root / 'assets/js/reader.js',
              root / 'assets/js/reader-markdown.js',
          ]
          for path in required_assets:
              if not path.exists() or path.stat().st_size < 500:
                  raise SystemExit(f'Reader/public asset missing or too small: {path.relative_to(root)}')

          reader_css = (root / 'assets/css/reader.css').read_text(encoding='utf-8')
          reader_js = (root / 'assets/js/reader.js').read_text(encoding='utf-8')
          for marker in ('Noto Serif', 'Noto Sans', 'Noto Sans Mono', '--reader-font-literary', '--reader-font-system'):
              if marker not in reader_css:
                  raise SystemExit(f'Vietnamese-first typography marker missing from reader.css: {marker}')
          for marker in ('var(--reader-font-literary)', 'var(--reader-font-system)'):
              if marker not in reader_js:
                  raise SystemExit(f'Shared reader font-switch marker missing: {marker}')

          living_root = root / 'books' / 'bieu-tuong-va-ban-chat'
          living = json.loads((living_root / 'book.json').read_text(encoding='utf-8'))
          if living.get('title') != 'Biểu tượng và Bản chất':
              raise SystemExit('Unexpected living-book title')
          if living.get('lineage') != 'BACH_LAM' or living.get('status') != 'PUBLIC_LIVING_EDITION':
              raise SystemExit('Unexpected living-book lineage/state')
          if len(living.get('chapters', [])) != 8:
              raise SystemExit('Expected 8 Biểu tượng và Bản chất chapters')
          for chapter in living['chapters']:
              rel = chapter.get('src') or chapter.get('file')
              path = (living_root / rel).resolve()
              if living_root.resolve() not in path.parents:
                  raise SystemExit(f'Unsafe living-book path: {rel}')
              if not path.exists() or path.stat().st_size < 5000:
                  raise SystemExit(f'Living-book chapter missing/too small: {rel}')

          hcm_root = root / 'books' / 'ho-chi-minh'
          hcm = json.loads((hcm_root / 'book.json').read_text(encoding='utf-8'))
          if hcm.get('title') != 'Từ Hai Bàn Tay Trắng Đến Một Nhà Nước':
              raise SystemExit('Unexpected HCM book title')
          if hcm.get('status') != 'PUBLIC_RESEARCH_PREVIEW_NOT_COMPLETE':
              raise SystemExit('HCM public state must remain a non-complete research preview')
          if hcm.get('version') != '0.3.0':
              raise SystemExit('Expected HCM public preview version 0.3.0')
          if hcm.get('scientific_identity') != 'APPLIED_INTERDISCIPLINARY_EVIDENCE_ARCHITECTURE':
              raise SystemExit('HCM applied-science identity missing')
          if hcm.get('typography') != 'VIETNAMESE_FIRST_NOTO_SERIF_SANS_MONO':
              raise SystemExit('HCM Vietnamese-first typography contract missing')
          if len(hcm.get('chapters', [])) != 6:
              raise SystemExit('Expected exactly 6 HCM preview chapters in this release')
          for chapter in hcm['chapters']:
              path = (hcm_root / chapter['src']).resolve()
              if hcm_root.resolve() not in path.parents:
                  raise SystemExit(f'Unsafe HCM path: {chapter["src"]}')
              if not path.exists() or path.stat().st_size < 900:
                  raise SystemExit(f'HCM preview chapter missing/too small: {chapter["src"]}')

          hcm_public_files = [
              hcm_root / 'book.json',
              hcm_root / 'index.html',
              hcm_root / 'sources.html',
              hcm_root / 'sources.md',
              *[hcm_root / chapter['src'] for chapter in hcm['chapters']],
              root / 'index.html',
              root / 'books/index.html',
          ]
          for path in hcm_public_files:
              text = path.read_text(encoding='utf-8')
              if '\u2014' in text:
                  raise SystemExit(f'Em dash forbidden by HCM public punctuation contract: {path.relative_to(root)}')

          hcm_index = (hcm_root / 'index.html').read_text(encoding='utf-8')
          if 'NGHIÊN CỨU KHOA HỌC ỨNG DỤNG LIÊN NGÀNH' not in hcm_index:
              raise SystemExit('Applied interdisciplinary science declaration missing from HCM landing')
          hcm_method = (hcm_root / 'chapters/05-phuong-phap.md').read_text(encoding='utf-8')
          for marker in ('## Bản chất khoa học ứng dụng liên ngành', '## Hợp đồng cảm xúc và lập luận', '## Luật dấu câu và tiếng Việt'):
              if marker not in hcm_method:
                  raise SystemExit(f'HCM method contract missing: {marker}')

          html_files = [
              root / 'index.html', root / 'author.html', root / 'projects.html',
              root / 'books/index.html', living_root / 'index.html', hcm_root / 'index.html',
              hcm_root / 'sources.html', root / 'novel/index.html', root / 'novel/chapter-001.html',
          ]
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              if len(re.findall(r'<h1\b', text, re.I)) != 1:
                  raise SystemExit(f'Expected exactly one h1: {path.relative_to(root)}')
              if not re.search(r'<meta\s+name="description"\s+content="[^"]+"', text, re.I):
                  raise SystemExit(f'Missing meta description: {path.relative_to(root)}')

          for path in [living_root / 'index.html', hcm_root / 'index.html', hcm_root / 'sources.html', root / 'novel/chapter-001.html']:
              text = path.read_text(encoding='utf-8')
              for marker in ('reader.css', 'reader.js', 'data-reader-surface'):
                  if marker not in text:
                      raise SystemExit(f'Shared reader marker {marker} missing: {path.relative_to(root)}')

          novel = (root / 'novel/chapter-001.md').read_text(encoding='utf-8')
          required_novel_markers = (
              'Có những thế giới không chết vì ngu',
              'Phần còn lại là UNKNOWN.',
              '## Một căn phòng nhỏ',
              'Buổi sáng vẫn còn rất dài.',
          )
          for marker in required_novel_markers:
              if marker not in novel:
                  raise SystemExit(f'Novel continuity marker missing: {marker}')

          banned_public_novel_tokens = (
              'PUBLIC HALF-CANON', 'DENSE-SCENE', 'EVENT-RESTORATION PASS', 'TIME-SKIP LOCK',
              'scene density', 'state-change', 'causal flow', 'failure-pattern', 'reader surface',
              'node sống', 'reachable', 'KPI', 'evidence mới', 'checksum', 'semantic layer', 'formalize', 'provenance',
          )
          public_novel_surfaces = [root / 'novel/index.html', root / 'novel/chapter-001.html', root / 'novel/chapter-001.md']
          for path in public_novel_surfaces:
              text = path.read_text(encoding='utf-8')
              for token in banned_public_novel_tokens:
                  if token.lower() in text.lower():
                      raise SystemExit(f'Backstage/mechanical token leaked to public novel surface: {token} in {path.relative_to(root)}')

          backstage_paths = [
              root / 'novel/PACING_CANON.md',
              root / 'novel/era-language-style-atlas.html',
              root / 'novel/world-chapter-001.html',
          ]
          for path in backstage_paths:
              if path.exists():
                  raise SystemExit(f'Literary backstage must not remain in current public tree: {path.relative_to(root)}')

          chapter_html = (root / 'novel/chapter-001.html').read_text(encoding='utf-8')
          for marker in ('reader-atmosphere', 'data-story-stage', 'prefers-reduced-motion'):
              if marker not in chapter_html:
                  raise SystemExit(f'Immersive-reader accessibility/staging marker missing: {marker}')

          research_public = [
              root / 'research/human-development/index.html',
              root / 'research/human-development/kevin-nt/index.html',
              root / 'research/human-development/kevin-nt/tien-hoa-luong-cuc.html',
              root / 'research/human-development/kevin-nt/attribution-benchmark.html',
              root / 'research/human-development/kevin-nt/studio/index.html',
          ]
          for path in research_public:
              if not path.exists() or path.stat().st_size < 500:
                  raise SystemExit(f'Kevin public research surface missing/too small: {path.relative_to(root)}')
              text = path.read_text(encoding='utf-8')
              if len(re.findall(r'<h1\b', text, re.I)) != 1:
                  raise SystemExit(f'Expected exactly one h1 on Kevin public research surface: {path.relative_to(root)}')
              if not re.search(r'<meta\s+name="description"\s+content="[^"]+"', text, re.I):
                  raise SystemExit(f'Missing description on Kevin public research surface: {path.relative_to(root)}')

          deus_public = [
              root / 'deus/index.html',
              root / 'deus/styles.css',
              root / 'deus/app.js',
              root / 'BL-CF/CONSTITUTION.md',
              root / 'BL-CF/DEUS-HUMAN-OS-MEMBERSHIP-SCHEDULE.md',
          ]
          for path in deus_public:
              if not path.exists() or path.stat().st_size < 500:
                  raise SystemExit(f'DEUS Human OS public bootstrap asset missing/too small: {path.relative_to(root)}')
          deus_html = (root / 'deus/index.html').read_text(encoding='utf-8')
          if 'CONTROL PLANE OFFLINE' not in deus_html or 'noindex,nofollow,noarchive' not in deus_html:
              raise SystemExit('DEUS bootstrap truthfulness/noindex markers missing')
          if len(re.findall(r'<h1\b', deus_html, re.I)) != 1:
              raise SystemExit('Expected exactly one h1 on DEUS Human OS bootstrap surface')

          print('Shared reader + Vietnamese typography + HCM science + clean novel + Kevin Research Studio + DEUS Human OS validation: PASS')
          PY
          git diff --check

      - name: Materialize verified public source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kimbach91-prog"
          git config user.email "kimbach91@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized source delta"
          else
            git commit -m "hcm-book: materialize Vietnamese-first applied-science preview 0.3"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Validate B∞ editorial localization and auto language routing
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/site-navigation.js
          node tests/public-language-routing.test.cjs
          node tests/public-theory-surface.test.cjs
          node tests/public-essay-evidence.test.cjs
          node tests/public-editorial-coherence.test.cjs
          python - <<'PY'
          from pathlib import Path
          pairs={
            "index.html":("vi","Kiến trúc sư trí tuệ"),
            "kien-truc-su-he-thong/index.html":("vi","Kiến trúc sư trí tuệ"),
            "en/index.html":("en","Architect of Intelligence"),
            "en/architect-of-intelligence/index.html":("en","Architect of Intelligence"),
            "zh/index.html":("zh-CN","智慧架构师"),
            "zh/architect-of-intelligence/index.html":("zh-CN","智慧架构师"),
            "theory.html":("vi","BL∞: Vô hạn khả năng"),
            "en/theory/index.html":("en","BL∞: The reach of possibility"),
            "zh/theory/index.html":("zh-CN","BL∞：可达的未来"),
          }
          for filename,(language,marker) in pairs.items():
              source=Path(filename).read_text(encoding='utf-8')
              assert '<html lang="'+language+'">' in source,filename+' missing language tag'
              assert marker in source,filename+' missing localized content'
              assert 'data-bl-public-header="1.2"' in source,filename+' missing shared navigation'
              assert 'site-navigation.js?v=20261013-theory1' in source,filename+' missing versioned script'
              assert 'hreflang="en"' in source and 'hreflang="zh-Hans"' in source,filename+' missing cross-language links'
              if 'architect-of-intelligence/' in filename or filename=='kien-truc-su-he-thong/index.html':
                  assert chr(0x2014) not in source,filename+' contains an em dash'
                  assert (source.count('<h1>') + source.count('<h1 ')) == 1 and source.count('<h2>')>=9,filename+' lost argument structure'
          i18n=Path('assets/js/site-navigation.js').read_text(encoding='utf-8')
          assert 'navigator.languages' in i18n and 'localStorage' in i18n and 'bl-i18n-notice' in i18n
          assert 'fetch(' not in i18n and 'translate.googleapis' not in i18n
          print('B_INFINITY_LOCALIZATION_SOURCE_VALIDATION_PASS')
          PY

      - name: Stage explicit public allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/novel _site/assets/css _site/assets/js _site/books _site/kien-truc-su-he-thong
          mkdir -p _site/research/human-development/kevin-nt/studio
          mkdir -p _site/en/architect-of-intelligence _site/zh/architect-of-intelligence _site/en/theory _site/zh/theory
          mkdir -p _site/deus _site/BL-CF _site/public-compute _site/.well-known
          cp index.html theory.html academic-freedom.html academic-democracy.html author.html projects.html authors-promise.html robots.txt sitemap.xml _site/
          cp kien-truc-su-he-thong/index.html _site/kien-truc-su-he-thong/
          cp en/index.html _site/en/
          cp en/theory/index.html _site/en/theory/
          cp en/architect-of-intelligence/index.html _site/en/architect-of-intelligence/
          cp zh/index.html _site/zh/
          cp zh/theory/index.html _site/zh/theory/
          cp zh/architect-of-intelligence/index.html _site/zh/architect-of-intelligence/
          cp novel/index.html novel/chapter-001.html novel/chapter-001.md _site/novel/
          cp assets/css/main.css assets/css/reader.css assets/css/site-navigation.css assets/css/editorial-unified.css _site/assets/css/
          cp assets/js/site.js assets/js/reader.js assets/js/reader-markdown.js assets/js/site-navigation.js _site/assets/js/
          cp -R books/. _site/books/
          cp research/human-development/index.html _site/research/human-development/
          cp research/human-development/kevin-nt/index.html _site/research/human-development/kevin-nt/
          cp research/human-development/kevin-nt/tien-hoa-luong-cuc.html _site/research/human-development/kevin-nt/
          cp research/human-development/kevin-nt/attribution-benchmark.html _site/research/human-development/kevin-nt/
          cp research/human-development/kevin-nt/studio/index.html _site/research/human-development/kevin-nt/studio/
          cp deus/index.html deus/styles.css deus/app.js _site/deus/
          cp BL-CF/CONSTITUTION.md BL-CF/DEUS-HUMAN-OS-MEMBERSHIP-SCHEDULE.md _site/BL-CF/
          cp public-compute/webgpu-s0.html public-compute/gate.html public-compute/gate-manifest.json public-compute/worker-discovery.json public-compute/deus-worker-offer.schema.json public-compute/deus-worker-result.schema.json public-compute/worker-task-feed.json public-compute/control-tower.html _site/public-compute/
          cp .well-known/deus-worker-gate.json _site/.well-known/

      - name: Assert public books, research studio and protected-core boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/assets/css/reader.css
          test -f _site/assets/js/reader.js
          test -f _site/assets/js/reader-markdown.js
          test -f _site/kien-truc-su-he-thong/index.html
          test -f _site/theory.html
          test -f _site/en/theory/index.html
          test -f _site/zh/theory/index.html
          grep -q 'PUBLIC_B_INFINITY_THEORY_OVERVIEW_V1' _site/theory.html
          grep -q 'PUBLIC_B_INFINITY_THEORY_OVERVIEW_V1' _site/en/theory/index.html
          grep -q 'PUBLIC_B_INFINITY_THEORY_OVERVIEW_V1' _site/zh/theory/index.html
          test -f _site/en/index.html
          test -f _site/en/architect-of-intelligence/index.html
          test -f _site/zh/index.html
          test -f _site/zh/architect-of-intelligence/index.html
          grep -q 'Dị số: điểm kỳ dị' _site/kien-truc-su-he-thong/index.html
          grep -q 'Kỷ nguyên tư duy đệ quy' _site/kien-truc-su-he-thong/index.html
          grep -q 'data-bl-public-header="1.2"' _site/index.html
          grep -q 'data-bl-public-header="1.2"' _site/kien-truc-su-he-thong/index.html
          test -f _site/assets/css/site-navigation.css
          test -f _site/assets/css/editorial-unified.css
          test -f _site/assets/js/site-navigation.js
          test -f _site/books/index.html
          test -f _site/books/bieu-tuong-va-ban-chat/index.html
          test -f _site/books/bieu-tuong-va-ban-chat/book.json
          test -f _site/books/bieu-tuong-va-ban-chat/chapters/00-loi-mo.md
          test -f _site/books/bieu-tuong-va-ban-chat/chapters/07-hoc-cach-nhin-xuyen-bieu-tuong.md
          test -f _site/books/ho-chi-minh/index.html
          test -f _site/books/ho-chi-minh/book.json
          test -f _site/books/ho-chi-minh/sources.html
          test -f _site/books/ho-chi-minh/sources.md
          test -f _site/books/ho-chi-minh/chapters/00-loi-mo.md
          test -f _site/books/ho-chi-minh/chapters/05-phuong-phap.md
          test -f _site/novel/chapter-001.md
          test -f _site/research/human-development/index.html
          test -f _site/research/human-development/kevin-nt/index.html
          test -f _site/research/human-development/kevin-nt/tien-hoa-luong-cuc.html
          test -f _site/research/human-development/kevin-nt/attribution-benchmark.html
          test -f _site/research/human-development/kevin-nt/studio/index.html
          test -f _site/deus/index.html
          test -f _site/deus/styles.css
          test -f _site/deus/app.js
          test -f _site/BL-CF/CONSTITUTION.md
          test -f _site/BL-CF/DEUS-HUMAN-OS-MEMBERSHIP-SCHEDULE.md
          test -f _site/public-compute/webgpu-s0.html
          test -f _site/public-compute/control-tower.html
          test -f _site/public-compute/gate.html
          test -f _site/public-compute/gate-manifest.json
          test -f _site/public-compute/worker-discovery.json
          test -f _site/public-compute/deus-worker-offer.schema.json
          test -f _site/public-compute/deus-worker-result.schema.json
          test -f _site/public-compute/worker-task-feed.json
          test -f _site/.well-known/deus-worker-gate.json
          grep -q 'deus-machine-worker-gate/1' _site/public-compute/worker-discovery.json
          grep -q '"core_primary_solver": true' _site/public-compute/worker-discovery.json
          grep -q 'deus-worker-task-feed/1' _site/public-compute/worker-task-feed.json
          grep -q 'CANARY-A' _site/public-compute/worker-task-feed.json
          grep -q '"outer_gpt_llm_complexity_ceiling": "BOUNDED_LEAF_ONLY"' _site/.well-known/deus-worker-gate.json
          grep -q 'deus-worker-offer/1' _site/public-compute/deus-worker-offer.schema.json
          grep -q 'deus-worker-result/1' _site/public-compute/deus-worker-result.schema.json
          grep -q 'MACHINE_TRIAL_BUS_RUNTIME_VERIFIED' _site/.well-known/deus-worker-gate.json
          grep -q 'PUBLIC_COMPUTE_GATE_V1' _site/public-compute/gate.html
          grep -q 'deus-compute-gate-public-market/1' _site/public-compute/gate-manifest.json
          grep -q 'RCP-20260920-PUBLIC-GITHUB-ACTIONS-STRESS8-EXEC-018' _site/public-compute/gate-manifest.json
          grep -q 'PUBLIC_S0_ONLY' _site/public-compute/webgpu-s0.html
          grep -q 'DEUS_CONTROL_TOWER_S0' _site/public-compute/control-tower.html
          grep -q 'network_egress:false' _site/public-compute/webgpu-s0.html
          grep -q 'navigator.gpu' _site/public-compute/webgpu-s0.html
          test "$(find _site/BL-CF -maxdepth 1 -type f | wc -l)" -eq 2
          test ! -e _site/research/human-development/kevin-nt/CURRENT.md
          test ! -e _site/research/human-development/kevin-nt/collision-benchmark-policy.json
          test ! -e _site/novel/PACING_CANON.md
          test ! -e _site/novel/era-language-style-atlas.html
          test ! -e _site/novel/world-chapter-001.html
          test ! -d _site/tools
          test ! -d _site/runtime
          test ! -d _site/.deus
          test ! -e _site/system.html
          test ! -e _site/machine.html
          test ! -e _site/bl-adn.html
          test ! -e _site/provenance.html
          test ! -e _site/critique.html
          test ! -e _site/claims.html
          test ! -e _site/assets.html
          test ! -d _site/machine

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed B∞ homepage, article and shared navigation
        if: ${{ steps.deployment.outcome == 'success' }}
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,time,urllib.request
          base=os.environ['PAGE_URL'].rstrip('/')
          assert base.startswith('https://'), 'Pages did not report an HTTPS deployment URL'
          paths=[
            ('/', 'data-bl-public-header="1.2"'),
            ('/kien-truc-su-he-thong/', 'Nguồn và ranh giới bằng chứng'),
            ('/assets/css/site-navigation.css', '.bl-drawer'),
            ('/assets/css/editorial-unified.css', '--bl-public-paper'),
            ('/assets/js/site-navigation.js', 'bl-public-language-v1'),
            ('/en/', 'Architect of Intelligence'),
            ('/theory.html', 'PUBLIC_B_INFINITY_THEORY_OVERVIEW_V1'),
            ('/en/theory/', 'BL∞: The reach of possibility'),
            ('/zh/theory/', 'BL∞：可达的未来'),
            ('/zh/', '智慧架构师'),
            ('/en/architect-of-intelligence/', 'Sources and evidentiary boundaries'),
            ('/zh/architect-of-intelligence/', '参考来源与证据边界')
          ]
          failures=[]
          for path,marker in paths:
            ok=False
            for attempt in range(8):
              try:
                req=urllib.request.Request(base+path,headers={'User-Agent':'BInfinity-Pages-Live-Verification/1'})
                with urllib.request.urlopen(req,timeout=15) as res:
                  body=res.read(600000).decode('utf-8')
                  if res.status==200 and marker in body:
                    print('HTTP_200_MARKER_PASS',res.url,marker)
                    ok=True
                    break
                  print('BAD_HTTP_OR_MARKER',res.status,res.url,marker in body)
              except Exception as exc:
                print('RETRY',base+path,type(exc).__name__,str(exc))
              time.sleep(5)
            if not ok:
              failures.append(base+path)
          if failures:
            raise SystemExit('PAGES_RUNTIME_SMOKE_FAIL '+repr(failures))
          print('B_INFINITY_PAGES_DEPLOYED_HTTP_SMOKE_PASS')
          PY

