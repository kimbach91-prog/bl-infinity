# GitHub Pages deployment for the materialized BL∞ public source.
# Public-release throttle: internal repository evolution may continue rapidly,
# but the public site is released on a weekly cadence or by explicit manual dispatch.
name: Validate, secure, build and deploy BL∞

on:
  pull_request:
    branches: ["main"]
  schedule:
    # Monday 05:30 UTC = Monday 12:30 Asia/Bangkok.
    - cron: "30 5 * * 1"
  workflow_dispatch:

# Default-deny token posture. Jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable source snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-security.txt

      - name: Install pinned build and security dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-security.txt

      - name: Audit dependency vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Compile security/build scripts
        run: python -m compileall -q scripts

      - name: Validate epistemic object
        run: python scripts/audit.py --strict --release

      - name: Enforce BL-CPR source boundary
        run: python scripts/disclosure_audit.py --strict

      - name: Audit source security and bilingual integrity
        run: python scripts/security_audit.py --strict

      - name: Build static site
        run: python scripts/build.py

      - name: Publish Academic Democracy profile
        run: cp public/academic-democracy.html site/academic-democracy.html

      - name: Build multilingual SEO and AI discovery layer
        run: python scripts/run_discovery.py

      - name: Publish BL-REV public interface contract
        run: cp machine/bl-reverse-system.json site/machine/bl-reverse-system.json

      - name: Apply bilingual and browser hardening layer
        run: python scripts/harden_site.py

      - name: Audit materialized public site
        run: python scripts/security_audit.py --strict --site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: "site"

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Notify IndexNow of canonical discovery URLs
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail-with-body --retry 2 -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @- <<'JSON'
          {
            "host": "kimbach91-prog.github.io",
            "key": "7d4a9f38b25c4e7aa6d0c913b8e42f61",
            "keyLocation": "https://kimbach91-prog.github.io/bl-infinity/7d4a9f38b25c4e7aa6d0c913b8e42f61.txt",
            "urlList": [
              "https://kimbach91-prog.github.io/bl-infinity/",
              "https://kimbach91-prog.github.io/bl-infinity/theory.html",
              "https://kimbach91-prog.github.io/bl-infinity/en/",
              "https://kimbach91-prog.github.io/bl-infinity/en/theory.html",
              "https://kimbach91-prog.github.io/bl-infinity/author.html",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy.html",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/discovery.html",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/en/",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/es/",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/fr/",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/de/",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/pt/",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/zh/",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/ja/",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/ko/",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/ru/",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/ar/",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/hi/",
              "https://kimbach91-prog.github.io/bl-infinity/academic-democracy/id/"
            ]
          }
          JSON
