name: Publish B∞ curated public surface

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[OWNER-PUBLISH]')
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout curated public tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Materialize and validate living-book source
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_living_book_v1.py
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.').resolve()
          book_root = (root / 'books' / 'bieu-tuong-va-ban-chat').resolve()
          book = json.loads((book_root / 'book.json').read_text(encoding='utf-8'))
          chapters = book.get('chapters', [])

          if book.get('title') != 'Biểu tượng và Bản chất':
              raise SystemExit('Unexpected living-book title')
          if book.get('lineage') != 'BACH_LAM':
              raise SystemExit('Living book must remain in BACH_LAM lineage')
          if book.get('status') != 'PUBLIC_LIVING_EDITION':
              raise SystemExit('Unexpected living-book publication state')
          if len(chapters) != 8:
              raise SystemExit(f'Expected 8 living-book chapters, found {len(chapters)}')

          for chapter in chapters:
              path = (book_root / chapter['src']).resolve()
              if book_root not in path.parents:
                  raise SystemExit(f'Unsafe chapter path: {chapter["src"]}')
              if not path.exists() or path.stat().st_size < 5000:
                  raise SystemExit(f'Chapter missing or too small: {chapter["src"]}')

          html_files = [
              root / 'index.html',
              root / 'author.html',
              root / 'projects.html',
              root / 'books' / 'index.html',
              book_root / 'index.html',
          ]
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              if len(re.findall(r'<h1\b', text, re.I)) != 1:
                  raise SystemExit(f'Expected exactly one h1: {path.relative_to(root)}')
              if not re.search(r'<meta\s+name="description"\s+content="[^"]+"', text, re.I):
                  raise SystemExit(f'Missing meta description: {path.relative_to(root)}')

          reader = (book_root / 'index.html').read_text(encoding='utf-8')
          for marker in ('data-mode="scroll"', 'data-mode="page"', 'data-mode="focus"', 'localStorage', 'touchstart'):
              if marker not in reader:
                  raise SystemExit(f'Reader capability missing: {marker}')

          print('Living-book validation: PASS')
          PY
          git diff --check

      - name: Commit materialized public source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html author.html projects.html sitemap.xml books; then
            echo "Living-book source already materialized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html author.html projects.html sitemap.xml books
            git commit -m "[BOOK] Materialize Biểu tượng và Bản chất living edition"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Stage explicit public allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/novel _site/assets/css _site/assets/js _site/books
          cp index.html theory.html academic-freedom.html academic-democracy.html author.html projects.html authors-promise.html robots.txt sitemap.xml _site/
          cp novel/index.html novel/chapter-001.html novel/chapter-001.md novel/world-chapter-001.html novel/era-language-style-atlas.html _site/novel/
          cp assets/css/main.css _site/assets/css/
          cp assets/js/site.js _site/assets/js/
          cp -R books/. _site/books/

      - name: Assert public book and protected-core boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/books/index.html
          test -f _site/books/bieu-tuong-va-ban-chat/index.html
          test -f _site/books/bieu-tuong-va-ban-chat/book.json
          test -f _site/books/bieu-tuong-va-ban-chat/chapters/00-loi-mo.md
          test -f _site/books/bieu-tuong-va-ban-chat/chapters/07-hoc-cach-nhin-xuyen-bieu-tuong.md
          test ! -d _site/tools
          test ! -e _site/system.html
          test ! -e _site/machine.html
          test ! -e _site/bl-adn.html
          test ! -e _site/provenance.html
          test ! -e _site/critique.html
          test ! -e _site/claims.html
          test ! -e _site/assets.html
          test ! -d _site/machine

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164c5ed86f2b6aed7e0febac5b3c0c03e
