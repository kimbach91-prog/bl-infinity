name: ARC3 ft09 completion invariant diagnostic 229
on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_completion_invariant_diag_229.py
      - .github/workflows/arc3-ft09-completion-invariant-diag-229.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-ft09-completion-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_ft09_completion_invariant_diag_229.py
      - name: Download exact ft09 p0..p19 public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'; game='ft09-0d8bbf25'
          for p in $(seq 0 19); do f="${game}_p${p}_events.jsonl"; curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"; test -s "public_trace/$f"; done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute invariant diagnostic
        run: |
          set -euo pipefail
          args=(); for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          PYTHONPATH=public_benchmark/arc3/kaggle_candidates python public_benchmark/arc3/kaggle_candidates/public_ft09_completion_invariant_diag_229.py "${args[@]}" --output r229-ft09-completion-invariant-diagnostic.json
      - name: Verify diagnostic truth boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r229-ft09-completion-invariant-diagnostic.json'))
          assert d['schema']=='deus/arc3-ft09-completion-invariant-diagnostic/1'
          t=d['truth'];assert t['outcome_assisted_diagnostic'] is True;assert t['predictor_promotion'] is False
          assert t['next_predictor_must_refit_and_select_without_p10_p19'] is True;assert t['kaggle_execution'] is False
          print(json.dumps({'population':d['population'],'wrong':d['wrong_rows'],'top':d['top_pure_completion_single_features'][:10]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r229-ft09-completion-invariant-diagnostic
          path: |
            r229-ft09-completion-invariant-diagnostic.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
