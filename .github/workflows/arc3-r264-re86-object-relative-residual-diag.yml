name: ARC3 R264 re86 object relative residual diagnostic

on:
  push:
    branches:
      - deus/r264-re86-object-relative-residual-diag-20260923
    paths:
      - .github/workflows/arc3-r264-re86-object-relative-residual-diag.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-r264-re86:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py public_benchmark/arc3/kaggle_candidates/public_action_conditional_markov_gate_251.py public_benchmark/arc3/kaggle_candidates/public_component_delta_operator_254.py public_benchmark/arc3/kaggle_candidates/public_object_motion_diag_256.py public_benchmark/arc3/kaggle_candidates/public_selective_object_transport_257.py public_benchmark/arc3/kaggle_candidates/public_object_relative_residual_diag_264.py
      - name: Stage re86 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 9); do
            f="re86-8af5384d_p${p}_events.jsonl"
            src="upstream-duck/example-run/artifacts/$f"
            test -s "$src"; cp "$src" "public_trace/$f"
          done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute diagnostic
        shell: bash
        run: |
          set -euo pipefail
          args=(); for f in public_trace/re86-8af5384d_p*_events.jsonl; do args+=(--input "$f"); done
          test "${#args[@]}" -eq 20
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_object_relative_residual_diag_264.py "${args[@]}" --output r264-re86-object-relative-residual.json 2> >(tee r264-runtime.txt >&2) | tee r264-stdout.txt
      - name: Verify and digest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('r264-re86-object-relative-residual.json').read_text())
          assert d['schema']=='deus/arc3-r264-object-relative-residual-diagnostic/1'
          t=d['truth']; assert t['public_trace_only'] and not t['game_source_read'] and not t['p10_p19_read'] and not t['kaggle_execution'] and not t['competition_submission']
          Path('r264-verdict.json').write_text(json.dumps({'verdict':'DIAGNOSTIC_ONLY_NO_PROMOTION','actions':{a:{'screen10':x['screen_concentration']['top10'],'dest10':x['dest_offset_concentration']['top10'],'class_dest10':x['class_dest_offset_concentration']['top10']} for a,x in d['actions'].items()}},indent=2,sort_keys=True)+'\n')
          PY
          sha256sum r264-re86-object-relative-residual.json r264-verdict.json r264-runtime.txt r264-stdout.txt public_trace/SHA256SUMS.txt > R264_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r264-re86-object-relative-residual-diag
          path: |
            r264-re86-object-relative-residual.json
            r264-verdict.json
            r264-runtime.txt
            r264-stdout.txt
            R264_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
