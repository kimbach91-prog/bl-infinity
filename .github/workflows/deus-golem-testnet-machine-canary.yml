name: DEUS Golem Testnet Machine Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-golem-testnet-machine-canary.yml'
      - 'public-compute/golem-testnet-canary.mjs'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  golem-testnet-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YAGNA_AUTOCONF_APPKEY: try_golem
      YAGNA_APPKEY: try_golem
    steps:
      - uses: actions/checkout@v4

      - name: Install Yagna requestor from official Golem Python package path
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install golem-workers
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.yagna/bin" >> "$GITHUB_PATH"
          command -v yagna || {
            python3 - <<'PY'
import shutil, sys
print("yagna_path=", shutil.which("yagna"))
sys.exit(1)
PY
          }

      - name: Start Yagna
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.yagna/bin:$PATH"
          command -v yagna
          nohup yagna service run >/tmp/yagna.log 2>&1 &
          echo $! >/tmp/yagna.pid
          for i in $(seq 1 45); do
            if yagna app-key list >/tmp/appkeys.txt 2>/dev/null; then
              cat /tmp/appkeys.txt
              exit 0
            fi
            sleep 2
          done
          cat /tmp/yagna.log
          exit 1

      - name: Initialize Hoodi testnet and request faucet funds
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.yagna/bin:$PATH"
          yagna payment init --sender --network hoodi | tee /tmp/payment-init.log
          timeout 120s yagna payment fund --network hoodi | tee /tmp/payment-fund.log
          yagna payment status --network hoodi | tee /tmp/payment-status.log

      - name: Install Golem task client
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/deus-golem-canary
          mkdir -p /tmp/deus-golem-canary
          cd /tmp/deus-golem-canary
          npm init -y >/dev/null
          npm install --no-audit --no-fund @golem-sdk/task-executor @golem-sdk/pino-logger
          cp "$GITHUB_WORKSPACE/public-compute/golem-testnet-canary.mjs" ./canary.mjs

      - name: Match provider and execute CANARY-A
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/deus-golem-canary
          timeout 240s node ./canary.mjs 2>&1 | tee /tmp/deus-golem-canary.log
          grep -q '"exact_match":true' /tmp/deus-golem-canary.log
          grep -q '"payment_network":"hoodi"' /tmp/deus-golem-canary.log
          grep -q '"real_money_spend_authorized":false' /tmp/deus-golem-canary.log

      - name: Upload bounded diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deus-golem-testnet-machine-canary
          path: |
            /tmp/deus-golem-canary.log
            /tmp/yagna.log
            /tmp/payment-init.log
            /tmp/payment-fund.log
            /tmp/payment-status.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Post verified Golem receipt to Machine Trial Bus
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const receipt = JSON.parse(fs.readFileSync("/tmp/deus-golem-receipt.json", "utf8"));
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: 182,
              body: "\`\`\`json\\n" + JSON.stringify({
                schema: "deus-external-route-receipt/1",
                route_id: "GOLEM-HOODI-TESTNET",
                transport: "golem-yagna-task-executor",
                source_workflow: "DEUS Golem Testnet Machine Canary",
                github_run_id: context.runId,
                receipt,
                capacity_credit: 0,
                economic_yield_proven: false,
                mainnet_capacity_proven: false,
                truth_boundary: "TESTNET_RESULT_VERIFIED != MAINNET_CAPACITY_OR_ECONOMIC_YIELD"
              }, null, 2) + "\\n\`\`\`"
            });

      - name: Post bounded Golem blocker to Machine Trial Bus
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: 182,
              body: "\`\`\`json\\n" + JSON.stringify({
                schema: "deus-external-route-blocker/1",
                route_id: "GOLEM-HOODI-TESTNET",
                source_workflow: "DEUS Golem Testnet Machine Canary",
                github_run_id: context.runId,
                verdict: "RUNTIME_CANARY_FAILED_BEFORE_VERIFIED_RESULT",
                capacity_credit: 0,
                economic_yield_proven: false,
                next_gate: "inspect bounded workflow logs/artifact; do not infer provider rejection without provider evidence"
              }, null, 2) + "\\n\`\`\`"
            });
