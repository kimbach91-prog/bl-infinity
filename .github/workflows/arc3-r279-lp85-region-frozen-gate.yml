name: ARC3 R279 lp85 frozen region gate

on:
  push:
    branches: [deus/r279-lp85-region-frozen-gate-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_lp85_region_frozen_gate_279.py
      - .github/workflows/arc3-r279-lp85-region-frozen-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-r279:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile R279
        run: |
          python -m py_compile             public_benchmark/arc3/kaggle_candidates/public_sourcefree_markov_fidelity_adapter_246.py             public_benchmark/arc3/kaggle_candidates/public_action_conditional_markov_gate_251.py             public_benchmark/arc3/kaggle_candidates/public_ui_mask_markov_diag_268.py             public_benchmark/arc3/kaggle_candidates/public_relational_topology_diag_274.py             public_benchmark/arc3/kaggle_candidates/public_action_canonical_topology_diag_275.py             public_benchmark/arc3/kaggle_candidates/public_object_region_phase_diag_278.py             public_benchmark/arc3/kaggle_candidates/public_lp85_region_frozen_gate_279.py

      - name: Stage exact frozen lp85 p0-p19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          python - <<'PY'
          from pathlib import Path

          src=Path('upstream-duck/example-run/artifacts')
          dst=Path('public_trace')
          game='lp85-305b61c3'
          files=[]
          for p in range(20):
              f=src/f'{game}_p{p}_events.jsonl'
              if not f.is_file():
                  raise SystemExit(f'missing frozen trace: {f}')
              files.append(f)
          for f in files:
              (dst/f.name).write_bytes(f.read_bytes())
          PY

          test "$(find public_trace -maxdepth 1 -name 'lp85-305b61c3_p*_events.jsonl' -type f | wc -l)" -eq 20
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt

      - name: Execute R279 frozen gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find public_trace -maxdepth 1 -name 'lp85-305b61c3_p*_events.jsonl' -type f | sort -V)
          test "${#files[@]}" -eq 20
          args=()
          for f in "${files[@]}"; do args+=(--input "$f"); done
          /usr/bin/time -v python             public_benchmark/arc3/kaggle_candidates/public_lp85_region_frozen_gate_279.py             "${args[@]}"             --output r279-lp85-region-frozen.json             2> >(tee r279-runtime.txt >&2) | tee r279-stdout.txt

      - name: Verify R279 truth boundary and hash
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path('r279-lp85-region-frozen.json').read_text())
          assert d['schema']=='deus/arc3-r279-lp85-region-frozen-gate/1'
          assert d['rung']==279
          assert d['lineage']['r278_selector_frozen_before_p10_p19'] is True
          assert d['frozen_selector']=={'game':'lp85-305b61c3','mode':'canon_regions_ui'}
          p=d['protocol']; t=d['truth']
          assert p['model_fit']=='p0-p9 only after exact selector freeze'
          assert not p['p10_p19_updates_selector']
          assert not p['p10_p19_updates_representation']
          assert not p['p10_p19_updates_model']
          assert t['public_trace_only'] and t['source_free_runtime_logic']
          assert t['reused_public_development_holdout']
          assert t['selector_frozen_before_holdout_read']
          assert not t['independent_hidden_generalization_claim']
          assert not t['exact_frame_solver_claim'] and not t['full_game_policy_claim']
          assert not t['kaggle_execution'] and not t['competition_submission']
          assert not t['submission_quota_spent_by_r279']

          verdict={
              'verdict':d['verdict'],
              'candidate':d['candidate'],
              'controls':d['controls'],
              'truth_lane':'PUBLIC_OFFLINE_FROZEN_P10P19_LP85_REGION_GATE',
          }
          Path('r279-verdict.json').write_text(json.dumps(verdict,indent=2,sort_keys=True)+'\n')
          print(Path('r279-verdict.json').read_text())
          PY

          sha256sum             r279-lp85-region-frozen.json             r279-verdict.json             r279-runtime.txt             r279-stdout.txt             public_trace/SHA256SUMS.txt             > R279_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: r279-lp85-region-frozen-gate
          path: |
            r279-lp85-region-frozen.json
            r279-verdict.json
            r279-runtime.txt
            r279-stdout.txt
            R279_SHA256SUMS.txt
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
