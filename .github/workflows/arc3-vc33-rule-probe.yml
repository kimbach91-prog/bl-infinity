name: ARC3 vc33 observation-only rule probe

on:
  push:
    branches: [deus/arc3-vc33-rule-probe-20260920]
    paths: [.github/workflows/arc3-vc33-rule-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Inspect current vc33 public observation without game source
        run: |
          python - <<'PY'
          import json, logging, hashlib
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode

          logging.disable(logging.CRITICAL)
          arc=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          card=arc.open_scorecard(
              source_url='https://github.com/kimbach91-prog/bl-infinity',
              tags=['DEUS','vc33','public-development','observation-only','rule-probe']
          )
          env=arc.make('vc33',seed=0,scorecard_id=card,save_recording=False,include_frame_data=True)
          if env is None: raise RuntimeError('ENV_UNAVAILABLE')
          obs=env.observation_space
          frame=np.asarray(obs.frame[-1],dtype=np.uint8)
          grid=frame[-64:,-64:] if frame.ndim==2 else np.asarray(obs.frame[-1],dtype=np.uint8)

          def comps_for_color(arr, color):
              mask=(arr==color)
              h,w=arr.shape
              seen=np.zeros_like(mask,dtype=bool); out=[]
              for y in range(h):
                  for x in range(w):
                      if not mask[y,x] or seen[y,x]: continue
                      stack=[(x,y)]; seen[y,x]=True; pts=[]
                      while stack:
                          xx,yy=stack.pop(); pts.append((xx,yy))
                          for nx,ny in ((xx+1,yy),(xx-1,yy),(xx,yy+1),(xx,yy-1)):
                              if 0<=nx<w and 0<=ny<h and mask[ny,nx] and not seen[ny,nx]:
                                  seen[ny,nx]=True; stack.append((nx,ny))
                      xs=[p[0] for p in pts]; ys=[p[1] for p in pts]
                      out.append({'area':len(pts),'bbox':[min(xs),min(ys),max(xs),max(ys)],
                                  'center':[round(sum(xs)/len(xs),2),round(sum(ys)/len(ys),2)]})
              return sorted(out,key=lambda z:(-z['area'],z['bbox']))
          colors={int(c):int((grid==c).sum()) for c in np.unique(grid)}
          comps={str(c):comps_for_color(grid,int(c))[:30] for c in np.unique(grid)}
          receipt={
              'game':'vc33','seed':0,'levels_completed':int(obs.levels_completed),
              'state':obs.state.value,
              'available_actions':[int(a.value) if hasattr(a,'value') else int(a) for a in (obs.available_actions or [])],
              'shape':list(grid.shape),'frame_sha256':hashlib.sha256(grid.tobytes()).hexdigest(),
              'colors':colors,'components':comps,'scorecard_id':card,
              'claim':'observation-only public probe; no solver result'
          }
          print('VC33_OBSERVATION='+json.dumps(receipt,separators=(',',':')))
          arc.close_scorecard(card)
          PY
