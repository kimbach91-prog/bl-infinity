name: ARC3 R284 relational local delta diagnostic
on:
  push:
    branches: [deus/r270-ui-mask-frozen-gate-20260923]
    paths:
      - .github/workflows/arc3-r284-relational-local-delta.yml
      - public_benchmark/arc3/kaggle_candidates/public_relational_local_delta_284.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r284-game:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        game:
          - ar25-0c556536
          - ka59-38d34dbb
          - lf52-271a04aa
          - r11l-495a7899
          - re86-8af5384d
          - s5i5-18d95033
          - su15-1944f8ab
          - tn36-ef4dde99
          - tu93-0768757b
          - vc33-5430563c
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 9); do
            f="${{ matrix.game }}_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/$f" "public_trace/$f"
          done
          test "$(find public_trace -type f | wc -l)" -eq 10
          ! find public_trace -type f -name '*_p1[0-9]_events.jsonl' | grep -q .
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_relational_local_delta_284.py
      - name: Execute p0-p4 fit p5-p9 diagnostic
        shell: bash
        run: |
          args=()
          for f in public_trace/*_events.jsonl; do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_relational_local_delta_284.py "${args[@]}" --output "r284-${{ matrix.game }}.json" | tee "r284-${{ matrix.game }}.stdout.txt"
      - name: Truth-boundary audit
        shell: bash
        run: |
          python - <<'PY'
          import glob,json
          p=glob.glob('r284-*.json')[0]
          d=json.load(open(p))
          assert d['protocol']['fit']=='p0-p4 only'
          assert d['protocol']['diagnostic']=='p5-p9 only'
          assert d['protocol']['p10_p19_staged'] is False
          assert d['truth']['p10_p19_read'] is False
          assert d['truth']['kaggle_execution'] is False
          assert d['truth']['competition_submission'] is False
          print(json.dumps(d['aggregate'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r284-${{ matrix.game }}
          path: |
            r284-${{ matrix.game }}.json
            r284-${{ matrix.game }}.stdout.txt
          retention-days: 30
