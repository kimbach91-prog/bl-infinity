name: ARC3 vc33 L5 v4 macro enumeration repair

on:
  push:
    branches: [deus/arc3-vc33-l5-v4-macroenum-20260921]
    paths: [.github/workflows/arc3-vc33-l5-v4-macroenum.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l5-macro-enum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Enumerate compact public-frame L5 blue/brown macros and verify ONLINE
        run: |
          python - <<'PY'
          import copy,hashlib,itertools,json,logging,os,time
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.CRITICAL)

          L3_PATH=[0,2,0,2,0,4,2,0,4,2,0,4,2,0,6,6,6,6,6,6,6,6,6]
          L4_PATH=[3,3,0,3,3,3,4,4,6,4,1,6,4,6,4,6,4,6,4,6,4]

          def fr(o): return np.asarray(o.frame[-1],dtype=np.uint8)
          def comps(a,color,lo=1,hi=256):
              m=(a==color);H,W=a.shape;seen=np.zeros_like(m,bool);out=[]
              for y in range(H):
                for x in range(W):
                  if not m[y,x] or seen[y,x]:continue
                  st=[(x,y)];seen[y,x]=1;pts=[]
                  while st:
                    xx,yy=st.pop();pts.append((xx,yy))
                    for nx,ny in ((xx+1,yy),(xx-1,yy),(xx,yy+1),(xx,yy-1)):
                      if 0<=nx<W and 0<=ny<H and m[ny,nx] and not seen[ny,nx]:
                        seen[ny,nx]=1;st.append((nx,ny))
                  if lo<=len(pts)<=hi:
                    xs=[p[0] for p in pts];ys=[p[1] for p in pts]
                    out.append({'area':len(pts),'bbox':[min(xs),min(ys),max(xs),max(ys)],'center':[int(round(sum(xs)/len(xs))),int(round(sum(ys)/len(ys)))]})
              return sorted(out,key=lambda z:(z['bbox'][0],z['bbox'][1],z['area']))
          def brown(o):return sorted(comps(fr(o),9,4,32),key=lambda z:(z['bbox'][0],z['bbox'][1]))
          def anchors(o):
              z=[]
              for c in comps(fr(o),1,8,128):
                if c['bbox'][1]>2 and c['bbox'][3]<61:z.append({'center':c['center'],'bbox':c['bbox'],'area':c['area']})
              return sorted(z,key=lambda b:(b['center'][0],b['center'][1]))
          def cands(o,A):
              a=fr(o);z=[]
              for i,b in enumerate(A):
                x,y=b['center'];z.append({'kind':'blue','anchor':i,'color':int(a[y,x]),'center':[x,y]})
              for j,b in enumerate(brown(o)):z.append({'kind':'brown','brown_rank':j,'center':b['center']})
              return z
          def click(e,o,xy):
              am={a.value:a for a in e.action_space}
              return e.step(am[6],data={'x':int(xy[0]),'y':int(xy[1])})
          def prefix(e):
              o=e.observation_space
              b=brown(o);t=max(b,key=lambda z:z['center'][1])['center']
              for _ in range(3):
                o=click(e,o,t)
                if int(o.levels_completed)>=1:break
              if int(o.levels_completed)<1:raise RuntimeError('L1_FAIL')
              b=brown(o);cs=[x['center'] for x in b];F=cs[3];E=cs[1]
              for r in ['F','F','F','E','F','E','F']:
                o=click(e,o,F if r=='F' else E)
                if int(o.levels_completed)>=2:break
              if int(o.levels_completed)<2:raise RuntimeError('L2_FAIL')
              for idx in L3_PATH:
                b=brown(o)
                if idx>=len(b):raise RuntimeError('L3_INDEX')
                o=click(e,o,b[idx]['center'])
                if int(o.levels_completed)>=3:break
              if int(o.levels_completed)<3:raise RuntimeError('L3_FAIL')
              A4=anchors(o)
              for idx in L4_PATH:
                cc=cands(o,A4)
                if idx>=len(cc):raise RuntimeError('L4_INDEX')
                o=click(e,o,cc[idx]['center'])
                if int(o.levels_completed)>=4:break
              if int(o.levels_completed)<4:raise RuntimeError('L4_FAIL')
              return o
          def apply(e,o,route):
              trace=[]
              for item in route:
                before=fr(o).copy();o=click(e,o,item['center']);
                if o is None:return None,trace
                trace.append({'kind':item['kind'],'anchor':item.get('anchor'),'brown_rank':item.get('brown_rank'),'center':item['center'],'changed':int(np.count_nonzero(before!=fr(o))),'level':int(o.levels_completed)})
                if int(o.levels_completed)>=5:return o,trace
                st=getattr(o.state,'value',str(o.state))
                if st in ('GAME_OVER','WIN'):break
              return o,trace

          normal=arc_agi.Arcade(operation_mode=OperationMode.NORMAL)
          base=normal.make('vc33',seed=0,save_recording=False,include_frame_data=True)
          if base is None:raise RuntimeError('ENV_UNAVAILABLE')
          o4=prefix(base);A=anchors(o4)
          if len(A)<3:raise RuntimeError('EXPECTED_3_ANCHORS:'+json.dumps(A))
          blue=[{'kind':'blue','anchor':i,'center':b['center']} for i,b in enumerate(A[:3])]
          brow=[{'kind':'brown','brown_rank':i,'center':b['center']} for i,b in enumerate(brown(o4)[:6])]

          t0=time.monotonic();trials=0;actions=0;found=None;found_trace=None;phase=None
          # Search ordering uses the public approximately-five prior only for ordering, never as a hard pruning rule.
          lengths=[5,4,6,3,7,8,9]
          for L in lengths:
            if found is not None:break
            for seq in itertools.product(range(3),repeat=L):
              if set(seq)!={0,1,2}:continue
              e=copy.deepcopy(base);route=[blue[i] for i in seq];nf,tr=apply(e,o4,route);trials+=1;actions+=len(tr)
              if nf is not None and int(nf.levels_completed)>=5:
                found=route;found_trace=tr;phase='BLUE_ONLY_ENUM';break
              if time.monotonic()-t0>700:break
            if time.monotonic()-t0>700:break

          # If blue-only compact macros miss, insert one public-frame brown control into focused blue motifs.
          if found is None and time.monotonic()-t0<900:
            for L in [5,4,6,3,7]:
              if found is not None:break
              for seq in itertools.product(range(3),repeat=L):
                if set(seq)!={0,1,2}:continue
                broutes=[blue[i] for i in seq]
                for br in brow:
                  for pos in range(L+1):
                    route=broutes[:pos]+[br]+broutes[pos:]
                    e=copy.deepcopy(base);nf,tr=apply(e,o4,route);trials+=1;actions+=len(tr)
                    if nf is not None and int(nf.levels_completed)>=5:
                      found=route;found_trace=tr;phase='BLUE_PLUS_ONE_BROWN_ENUM';break
                    if time.monotonic()-t0>900:break
                  if found is not None or time.monotonic()-t0>900:break
                if found is not None or time.monotonic()-t0>900:break

          search={'result':'FOUND' if found else 'MISS','trials':trials,'actions_simulated':actions,'seconds':time.monotonic()-t0,'phase':phase,'path':found,'path_len':None if found is None else len(found),'anchors':A,'brown_candidates':brow,'protocol':'PUBLIC_RULE_DERIVED_L5_MACRO_ENUM_V4','search_order_prior':'all 3 blue controls relevant; approximately 5 effective activations; ordering only','external_l5_route_used':False,'game_source_inspected_by_solver':False,'hidden_state_read':False,'independent_first_contact_claim':False,'rule_derived_claim':True}
          out=Path('verification');out.mkdir(exist_ok=True);(out/'search.json').write_text(json.dumps(search,indent=2))
          print('VC33_L5_V4_SEARCH='+json.dumps(search,separators=(',',':')))
          if found is None:raise RuntimeError('L5_V4_NOT_FOUND')

          online=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          src='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/blob/'+os.environ['GITHUB_SHA']+'/.github/workflows/arc3-vc33-l5-v4-macroenum.yml'
          cid=online.open_scorecard(source_url=src,tags=['DEUS','vc33','l5-v4-macroenum','public-development'])
          oe=online.make('vc33',seed=0,scorecard_id=cid,save_recording=False,include_frame_data=True)
          if oe is None:raise RuntimeError('ONLINE_ENV_UNAVAILABLE')
          oo=prefix(oe);oo,otr=apply(oe,oo,found);card=online.close_scorecard(cid);passed=oo is not None and int(oo.levels_completed)>=5
          rec={'schema':'deus/arc3-vc33-l5-v4-macroenum/1','result':'PASS' if passed else 'FAIL','game':'vc33','levels_completed':None if oo is None else int(oo.levels_completed),'win_levels':None if oo is None else int(getattr(oo,'win_levels',0) or 0),'state':None if oo is None else getattr(oo.state,'value',str(oo.state)),'scorecard_id':cid,'scorecard_score':None if card is None else card.score,'l5_path':found,'l5_actions_executed':len(otr),'online_trace':otr,'search':search,'protocol':'PUBLIC_RULE_DERIVED_L5_MACRO_ENUM_V4','external_full_route_used':False,'external_l5_route_used':False,'game_source_inspected_by_solver':False,'hidden_state_read':False,'independent_first_contact_claim':False,'rule_derived_claim':True,'competition_hidden_score_claim':False,'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'final_frame_sha256':None if oo is None else hashlib.sha256(fr(oo).tobytes()).hexdigest()}
          (out/'receipt.json').write_text(json.dumps(rec,indent=2));print('VC33_L5_V4_RECEIPT='+json.dumps(rec,separators=(',',':')))
          if not passed:raise RuntimeError('L5_V4_ONLINE_FAIL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vc33-l5-v4-macroenum
          path: verification/
          retention-days: 30
