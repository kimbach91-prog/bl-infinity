name: Bootstrap BL Infinity source

on:
  push:
    branches: ["main"]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          count=$(find bootstrap -maxdepth 1 -type f -name 'part-*.txt' | wc -l)
          test "$count" -eq 12
          cat bootstrap/part-*.txt > /tmp/bl-source.b64
          base64 --decode /tmp/bl-source.b64 > /tmp/bl-source.tar.xz
          echo "5f2d071b5511af609163cd71b0255eeeb890af6f40645fa5ab5dca2ee5504140  /tmp/bl-source.tar.xz" | sha256sum --check --strict
          xz --test /tmp/bl-source.tar.xz

      - name: Expand canonical v0.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/bl-source.tar.xz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Configure canonical GitHub identity
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python scripts/configure.py --github kimbach91-prog --repo bl-infinity

      - name: Audit, build and hash before commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit.py --strict --release
          python scripts/build.py
          python scripts/hash_manifest.py
          python scripts/audit.py --strict --release

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import BL Infinity AEGIS Index Pilot v0.2.0"
          git push origin main
