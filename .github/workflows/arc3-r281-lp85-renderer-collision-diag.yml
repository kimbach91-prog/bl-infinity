name: ARC3 R281 lp85 renderer-collision diagnostic
on:
  push:
    branches: [deus/r278-object-region-phase-diagnostic-20260923]
    paths:
      - .github/workflows/arc3-r281-lp85-renderer-collision-diag.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r281-lp85:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage exact lp85 p0-p4 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 4); do
            f="lp85-305b61c3_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/$f" "public_trace/$f"
          done
          test "$(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | wc -l)" -eq 5
          ! find public_trace -maxdepth 1 -type f -name '*_p[5-9]_events.jsonl' -o -name '*_p1[0-9]_events.jsonl' | grep -q .
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_lp85_renderer_collision_diag_281.py
      - name: Execute fit-collision mechanism diagnostic
        shell: bash
        run: |
          args=()
          for f in $(find public_trace -maxdepth 1 -type f -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          python public_benchmark/arc3/kaggle_candidates/public_lp85_renderer_collision_diag_281.py "${args[@]}" --output r281-lp85-renderer-collision.json | tee r281-stdout.txt
      - name: Truth-boundary audit and hashes
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r281-lp85-renderer-collision.json'))
          assert d['protocol']['fit_collision_diagnostic']=='p0-p4 only'
          assert d['protocol']['p5_p19_staged_or_read'] is False
          assert d['truth']['p5_p19_read'] is False
          assert d['truth']['kaggle_execution'] is False
          assert d['truth']['competition_submission'] is False
          print(json.dumps({'verdict':d['verdict'],'summary':d['summary']},sort_keys=True))
          PY
          sha256sum r281-lp85-renderer-collision.json r281-stdout.txt > R281_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r281-lp85-renderer-collision-diagnostic
          path: |
            r281-lp85-renderer-collision.json
            r281-stdout.txt
            R281_SHA256SUMS.txt
          retention-days: 30
