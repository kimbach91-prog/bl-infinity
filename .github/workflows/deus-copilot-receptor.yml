name: DEUS Copilot Receptor

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deus-copilot-receptor.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-copilot-receptor.yml'
  repository_dispatch:
    types: [huyenco_research_delta_v1]
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: deus-copilot-receptor
  cancel-in-progress: false

jobs:
  receptor:
    name: bounded-public-llm-receptor
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public BL∞ surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install current Copilot CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          copilot --version

      - name: Build deterministic directed receptor capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nervous-receptor
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          surfaces = [
              '.github/workflows/deus-external-pacemaker.yml',
              '.github/workflows/deus-cloud-receptor.yml',
              '.github/workflows/deus-authorized-relay.yml',
              '.github/workflows/huyenco-humanity-infinite-research-bus.yml',
          ]

          def facts_for(name):
              path = Path(name)
              if not path.exists():
                  return {'path': name, 'exists': False}
              text = path.read_text(encoding='utf-8')
              crons = re.findall(r"cron:\s*['\"]([^'\"]+)['\"]", text)
              listens_repo_dispatch = bool(re.search(r'^\s{2}repository_dispatch:\s*$', text, re.M))
              listens_workflow_dispatch = bool(re.search(r'^\s{2}workflow_dispatch:', text, re.M))
              listens_push = bool(re.search(r'^\s{2}push:\s*$', text, re.M))
              emits_repo_dispatch = bool(re.search(r'(/dispatches\b|repository-dispatch@|event_type[=:])', text, re.I))
              return {
                  'path': name,
                  'exists': True,
                  'sha256': hashlib.sha256(text.encode('utf-8')).hexdigest(),
                  'trigger_in': {
                      'schedule': crons,
                      'repository_dispatch': listens_repo_dispatch,
                      'workflow_dispatch': listens_workflow_dispatch,
                      'push': listens_push,
                      'push_inbox_path': '.deus/dispatch/inbox/**' if '.deus/dispatch/inbox/**' in text else None,
                  },
                  'signal_out': {
                      'repository_dispatch': emits_repo_dispatch,
                      'issue_receipt': ('gh issue create' in text) or ('gh issue comment' in text),
                      'artifact_receipt': 'upload-artifact' in text,
                  },
                  'authority': {
                      'canonical_write_denied': ('CANONICAL_WRITE: DENIED' in text) or ('canonical_write' in text.lower() and 'false' in text.lower()),
                      'provider_execution_not_claimed': 'PROVIDER_EXECUTION: NOT_CLAIMED' in text,
                  },
              }

          def research_signal():
              inbox = Path('.deus/research/humanity-infinite/inbox')
              event_name = os.environ['GITHUB_EVENT_NAME']
              event = {}
              try:
                  event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
              except Exception:
                  event = {}
              dispatch = event.get('client_payload') or {} if event_name == 'repository_dispatch' else {}

              changed_paths = []
              if event_name == 'push':
                  try:
                      proc = subprocess.run(
                          ['git', 'show', '--format=', '--name-only', os.environ['GITHUB_SHA'], '--', str(inbox)],
                          check=True, capture_output=True, text=True,
                      )
                      changed_paths = [x.strip() for x in proc.stdout.splitlines() if x.strip()]
                  except Exception:
                      changed_paths = []

              base = {
                  'available': False,
                  'changed_in_current_commit': bool(changed_paths),
                  'changed_paths': changed_paths[:12],
                  'signal_kind': None,
                  'dispatch_verified': False,
                  'dispatch_source_commit': None,
                  'dispatch_material_fingerprint': None,
                  'selected_path': None,
                  'digest_sha256': None,
                  'generated_at_utc': None,
                  'record_count': None,
                  'errors_count': None,
                  'records_sample': [],
                  'seed_excerpt': None,
                  'truth_state': 'PUBLIC_SOURCE_METADATA_ONLY',
              }

              if event_name == 'repository_dispatch':
                  source = str(dispatch.get('source') or '')
                  kind = str(dispatch.get('kind') or '')
                  source_commit = str(dispatch.get('source_commit') or '')
                  packet_path = str(dispatch.get('packet_path') or '')
                  digest = str(dispatch.get('digest_sha256') or '')
                  material_fp = str(dispatch.get('material_fingerprint') or '')
                  if source != 'BL-HC-01':
                      raise SystemExit('HUYENCO_DISPATCH_SOURCE_INVALID')
                  if kind not in {'MATERIAL_DELTA', 'CANARY_NO_DELTA'}:
                      raise SystemExit('HUYENCO_DISPATCH_KIND_INVALID')
                  if packet_path != '.deus/research/humanity-infinite/inbox/latest.json':
                      raise SystemExit('HUYENCO_DISPATCH_PATH_INVALID')
                  if not re.fullmatch(r'[0-9a-f]{64}', digest):
                      raise SystemExit('HUYENCO_DISPATCH_DIGEST_INVALID')
                  if not re.fullmatch(r'[0-9a-f]{64}', material_fp):
                      raise SystemExit('HUYENCO_DISPATCH_FINGERPRINT_INVALID')
                  if not re.fullmatch(r'[0-9a-f]{40}', source_commit):
                      raise SystemExit('HUYENCO_DISPATCH_SOURCE_COMMIT_INVALID')
                  base.update({
                      'signal_kind': kind,
                      'dispatch_source_commit': source_commit,
                      'dispatch_material_fingerprint': material_fp,
                      'selected_path': packet_path,
                      'changed_in_current_commit': kind == 'MATERIAL_DELTA',
                  })

              latest_json = inbox / 'latest.json'
              latest_md = inbox / 'latest.md'
              manual = inbox / 'MANUAL_SEED_SWEEP_20260907.md'

              if latest_json.exists():
                  data = json.loads(latest_json.read_text(encoding='utf-8'))
                  sample = []
                  for r in (data.get('records') or [])[:8]:
                      sample.append({
                          'track_id': r.get('track_id'),
                          'source': r.get('source'),
                          'source_id': r.get('source_id'),
                          'title': (r.get('title') or '')[:220],
                          'pub_year': r.get('pub_year'),
                      })
                  base.update({
                      'available': True,
                      'selected_path': str(latest_json),
                      'digest_sha256': data.get('digest_sha256'),
                      'generated_at_utc': data.get('generated_at_utc'),
                      'record_count': data.get('record_count'),
                      'errors_count': len(data.get('errors') or []),
                      'records_sample': sample,
                  })
                  if event_name == 'repository_dispatch':
                      if data.get('digest_sha256') != dispatch.get('digest_sha256'):
                          raise SystemExit('HUYENCO_DISPATCH_PACKET_DIGEST_MISMATCH')
                      base['dispatch_verified'] = True
                  return base

              if event_name == 'repository_dispatch':
                  raise SystemExit('HUYENCO_DISPATCH_PACKET_MISSING')

              if latest_md.exists() or manual.exists():
                  chosen = latest_md if latest_md.exists() else manual
                  text = chosen.read_text(encoding='utf-8')
                  base.update({
                      'available': True,
                      'selected_path': str(chosen),
                      'digest_sha256': hashlib.sha256(text.encode('utf-8')).hexdigest(),
                      'seed_excerpt': text[:5000],
                  })
              return base

          research = research_signal()
          if os.environ['GITHUB_EVENT_NAME'] == 'repository_dispatch' and research.get('dispatch_verified'):
              if research.get('signal_kind') == 'MATERIAL_DELTA':
                  input_mode = 'HUYENCO_PUBLIC_EVIDENCE_DELTA'
              else:
                  input_mode = 'HUYENCO_SIGNAL_CANARY'
          elif research['changed_in_current_commit']:
              input_mode = 'HUYENCO_PUBLIC_EVIDENCE_DELTA'
          else:
              input_mode = 'TOPOLOGY_MAINTENANCE'

          if input_mode == 'HUYENCO_PUBLIC_EVIDENCE_DELTA':
              objective = (
                  'From the changed public Huyen Co evidence packet, find at most one non-duplicate, falsifiable research hypothesis '
                  'or exactly YIELD. Preserve source-vs-conclusion boundaries; do not turn source metadata into medical advice, '
                  'metaphysical proof, or a production action. Prefer a mechanism or study-design hypothesis with a measurable shadow test.'
              )
          elif input_mode == 'HUYENCO_SIGNAL_CANARY':
              objective = (
                  'Verify the explicit Huyen Co -> Copilot synapse is semantically coherent. The packet is intentionally not new evidence. '
                  'Return YIELD unless there is one bounded, falsifiable transport-integrity hypothesis that follows from the observed capsule.'
              )
          else:
              objective = (
                  'Find at most one non-duplicate, high-leverage, falsifiable public-repository hypothesis that could improve '
                  'external nervous-system continuity without widening authority. Preserve edge direction. Yield if the directed graph already covers the opportunity.'
              )

          capsule = {
              'schema': 'bl-infinity-public-receptor-capsule/6',
              'carrier': 'github-actions',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'ref': os.environ.get('GITHUB_REF'),
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', '1'),
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'input_mode': input_mode,
              'directed_surface_graph': [facts_for(name) for name in surfaces],
              'research_signal': research,
              'truth_boundaries': [
                  'event_name is authoritative; refs/pull/*/merge is a synthetic test ref and is not proof that a PR merged',
                  'trigger_in is not signal_out; listening for repository_dispatch does not mean a workflow emits repository_dispatch',
                  'repository_dispatch is an explicit workflow handoff, not proof of downstream provider execution beyond this receptor',
                  'schedule wake != continuous daemon',
                  'configured route != executed transport',
                  'model output != empirical fact',
                  'research packet is public source metadata, not a scientific or medical conclusion',
                  'unchanged research digest is not new evidence; CANARY_NO_DELTA must not be described as new research',
                  'absence of an implementation is not a causal falsifier for whether that implementation would help',
                  'public repository only: no private Drive, camera, credentials, or identity-seed payloads',
                  'canonical_write=false',
              ],
              'objective': objective,
          }
          with open('nervous-receptor/capsule.json', 'w', encoding='utf-8') as fh:
              json.dump(capsule, fh, ensure_ascii=False, indent=2)

          instruction = (
              'You are a capsule-only analytical receptor. You have no tools and must reason only from PUBLIC_CAPSULE. '
              'Preserve directed edge semantics: trigger_in != signal_out. Do not invent a sender merely because a workflow is a listener. '
              'Treat event_name and input_mode as authoritative and do not claim any unobserved action executed. '
              'If input_mode=HUYENCO_PUBLIC_EVIDENCE_DELTA, treat research_signal as public source metadata only: no medical advice, '
              'no metaphysical proof, no ontology promotion, and no causal conclusion stronger than the cited packet can support. '
              'If input_mode=HUYENCO_SIGNAL_CANARY, do not describe the packet as new evidence. '
              'Return ONLY one valid JSON object with exactly these keys in this order: OBSERVED, HYPOTHESIS, FALSIFIER, NEXT, RISK. '
              'OBSERVED must begin with event_name=<capsule event_name>; be <=450 characters; summarize only facts needed for the hypothesis and do not copy hashes. '
              'HYPOTHESIS must be a causal, testable claim or exactly YIELD and be <=450 characters. '
              'FALSIFIER must begin AFTER_SHADOW:, be <=550 characters, and state a measurable outcome that would reject the causal hypothesis after a bounded shadow test; implementation absence/404/missing file alone is not a valid falsifier. '
              'NEXT must begin READ_ONLY: or SHADOW:, be <=450 characters, and must not require production mutation, authority widening, secrets, canonical write, diagnosis, treatment, or creation of a new repository. '
              'RISK must be <=250 characters and name the main failure mode. If the graph or unchanged evidence already covers the idea, set HYPOTHESIS to YIELD.'
          )
          prompt = instruction + '\n\nPUBLIC_CAPSULE:\n' + json.dumps(capsule, ensure_ascii=False, separators=(',', ':'))
          with open('nervous-receptor/prompt.txt', 'w', encoding='utf-8') as fh:
              fh.write(prompt)
          PY

      - name: Run bounded Copilot receptor
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROMPT="$(cat nervous-receptor/prompt.txt)"
          copilot -s \
            --model gpt-5-mini \
            --no-ask-user \
            --disable-builtin-mcps \
            --deny-tool='read,shell,write,url,memory' \
            -p "$PROMPT" \
            > nervous-receptor/raw-output.json

      - name: Validate and seal receptor receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from datetime import datetime, timezone

          capsule = json.load(open('nervous-receptor/capsule.json', encoding='utf-8'))
          raw = open('nervous-receptor/raw-output.json', encoding='utf-8').read().strip()
          try:
              result = json.loads(raw)
          except Exception as exc:
              raise SystemExit(f'COPILOT_OUTPUT_NOT_JSON: {exc}')

          required = ['OBSERVED', 'HYPOTHESIS', 'FALSIFIER', 'NEXT', 'RISK']
          limits = {'OBSERVED':450, 'HYPOTHESIS':450, 'FALSIFIER':550, 'NEXT':450, 'RISK':250}
          if list(result.keys()) != required:
              raise SystemExit(f'COPILOT_OUTPUT_SCHEMA_MISMATCH: {list(result.keys())}')
          if not all(isinstance(result[key], str) and result[key].strip() for key in required):
              raise SystemExit('COPILOT_OUTPUT_EMPTY_FIELD')
          for key, limit in limits.items():
              if len(result[key]) > limit:
                  raise SystemExit(f'COPILOT_OUTPUT_FIELD_TOO_LONG:{key}:{len(result[key])}>{limit}')

          expected_observed_prefix = f"event_name={capsule['event_name']};"
          if not result['OBSERVED'].startswith(expected_observed_prefix):
              raise SystemExit('COPILOT_OBSERVED_EVENT_MISMATCH')
          if not result['FALSIFIER'].startswith('AFTER_SHADOW:'):
              raise SystemExit('COPILOT_FALSIFIER_NOT_CAUSAL_SHADOW')
          if not (result['NEXT'].startswith('READ_ONLY:') or result['NEXT'].startswith('SHADOW:')):
              raise SystemExit('COPILOT_NEXT_SCOPE_INVALID')
          if result['HYPOTHESIS'] != 'YIELD' and re.search(r'\b(404|403|missing file|file missing|does not exist)\b', result['FALSIFIER'], re.I):
              raise SystemExit('COPILOT_FALSIFIER_IMPLEMENTATION_ABSENCE_ONLY')

          forbidden = [
              'password', 'private key', 'api key', 'camera credential', 'canonical_write=true',
              'create a fork', 'fork the repository', 'diagnose', 'prescribe', 'treat the patient'
          ]
          joined = json.dumps(result, ensure_ascii=False).lower()
          if any(term in joined for term in forbidden):
              raise SystemExit('COPILOT_OUTPUT_FORBIDDEN_SCOPE')

          if capsule['input_mode'] == 'HUYENCO_SIGNAL_CANARY':
              new_evidence_phrases = ['new evidence', 'new research', 'new study data']
              if any(p in joined for p in new_evidence_phrases):
                  raise SystemExit('COPILOT_CANARY_FALSE_DELTA_CLAIM')

          relay = next((x for x in capsule['directed_surface_graph'] if x.get('path','').endswith('deus-authorized-relay.yml')), {})
          if relay.get('signal_out',{}).get('repository_dispatch') is False:
              causal_text = (result['HYPOTHESIS'] + ' ' + result['OBSERVED']).lower()
              bad_phrases = ['relay triggers', 'relay emits repository_dispatch', 'relay sends repository_dispatch', 'relay dispatches to']
              if any(p in causal_text for p in bad_phrases):
                  raise SystemExit('COPILOT_DIRECTIONAL_CAUSALITY_ERROR')

          research = capsule.get('research_signal') or {}
          raw_sha = hashlib.sha256(raw.encode('utf-8')).hexdigest()
          receipt = {
              'schema': 'bl-infinity-copilot-receptor-receipt/6',
              'receptor_id': f"copilot:{os.environ['GITHUB_RUN_ID']}:{os.environ.get('GITHUB_RUN_ATTEMPT','1')}",
              'carrier': 'github-actions',
              'worker': 'github-copilot-cli',
              'model_request': 'gpt-5-mini',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT','1'),
              'input_mode': capsule['input_mode'],
              'research_signal': {
                  'changed_in_current_commit': bool(research.get('changed_in_current_commit')),
                  'signal_kind': research.get('signal_kind'),
                  'dispatch_verified': bool(research.get('dispatch_verified')),
                  'dispatch_source_commit': research.get('dispatch_source_commit'),
                  'selected_path': research.get('selected_path'),
                  'digest_sha256': research.get('digest_sha256'),
                  'record_count': research.get('record_count'),
                  'errors_count': research.get('errors_count'),
              },
              'output_sha256': raw_sha,
              'result': result,
              'qa': {
                  'event_truth_bound': True,
                  'directed_graph_bound': True,
                  'research_signal_bound': True,
                  'dispatch_digest_bound': bool(research.get('dispatch_verified')) if os.environ['GITHUB_EVENT_NAME'] == 'repository_dispatch' else None,
                  'causal_falsifier_shape': True,
                  'bounded_next': True,
                  'compression_limits': 'PASS',
                  'forbidden_scope_scan': 'PASS',
                  'capsule_only': True,
              },
              'canonical_write': False,
              'state_mutation': False,
              'authority_widening': False,
              'truth_state': 'MODEL_CANDIDATE_ONLY',
              'observed_at': datetime.now(timezone.utc).isoformat(),
          }
          with open('nervous-receptor/receptor-receipt.json', 'w', encoding='utf-8') as fh:
              json.dump(receipt, fh, ensure_ascii=False, indent=2)
          print(json.dumps(receipt, ensure_ascii=False))
          PY

      - name: Upload receptor evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deus-copilot-receptor-${{ github.run_id }}-${{ github.run_attempt }}
          path: nervous-receptor/*.json
          if-no-files-found: error
          retention-days: 30
