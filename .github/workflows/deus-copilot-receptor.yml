name: DEUS Copilot Receptor

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deus-copilot-receptor.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-copilot-receptor.yml'
  repository_dispatch:
    types: [huyenco_research_delta_v1]
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: deus-copilot-receptor
  cancel-in-progress: false

jobs:
  receptor:
    name: bounded-public-llm-receptor
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public BL∞ surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install current Copilot CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          copilot --version

      - name: Build verified receptor capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nervous-receptor
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          surfaces = [
              '.github/workflows/deus-external-pacemaker.yml',
              '.github/workflows/deus-cloud-receptor.yml',
              '.github/workflows/deus-authorized-relay.yml',
              '.github/workflows/huyenco-humanity-infinite-research-bus.yml',
          ]

          def facts_for(name):
              p = Path(name)
              if not p.exists():
                  return {'path': name, 'exists': False}
              text = p.read_text(encoding='utf-8')
              return {
                  'path': name,
                  'exists': True,
                  'sha256': hashlib.sha256(text.encode()).hexdigest(),
                  'trigger_in': {
                      'schedule': re.findall(r"cron:\s*['\"]([^'\"]+)['\"]", text),
                      'repository_dispatch': bool(re.search(r'^\s{2}repository_dispatch:\s*$', text, re.M)),
                      'workflow_dispatch': bool(re.search(r'^\s{2}workflow_dispatch:', text, re.M)),
                      'push': bool(re.search(r'^\s{2}push:\s*$', text, re.M)),
                  },
                  'signal_out': {
                      'repository_dispatch': bool(re.search(r'(/dispatches\b|repository-dispatch@|event_type[=:])', text, re.I)),
                      'artifact_receipt': 'upload-artifact' in text,
                  },
              }

          event_name = os.environ['GITHUB_EVENT_NAME']
          try:
              event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          except Exception:
              event = {}
          dispatch = (event.get('client_payload') or {}) if event_name == 'repository_dispatch' else {}

          research = {
              'available': False,
              'signal_kind': None,
              'dispatch_verified': False,
              'dispatch_source_commit': None,
              'selected_path': None,
              'digest_sha256': None,
              'generated_at_utc': None,
              'record_count': None,
              'errors_count': None,
              'records_sample': [],
              'truth_state': 'PUBLIC_SOURCE_METADATA_ONLY',
          }

          latest = Path('.deus/research/humanity-infinite/inbox/latest.json')
          if latest.exists():
              data = json.loads(latest.read_text(encoding='utf-8'))
              research.update({
                  'available': True,
                  'selected_path': str(latest),
                  'digest_sha256': data.get('digest_sha256'),
                  'generated_at_utc': data.get('generated_at_utc'),
                  'record_count': data.get('record_count'),
                  'errors_count': len(data.get('errors') or []),
                  'records_sample': [
                      {
                          'track_id': r.get('track_id'),
                          'source': r.get('source'),
                          'source_id': r.get('source_id'),
                          'title': (r.get('title') or '')[:180],
                          'pub_year': r.get('pub_year'),
                      }
                      for r in (data.get('records') or [])[:6]
                  ],
              })

          if event_name == 'repository_dispatch':
              source = str(dispatch.get('source') or '')
              kind = str(dispatch.get('kind') or '')
              source_commit = str(dispatch.get('source_commit') or '')
              packet_path = str(dispatch.get('packet_path') or '')
              digest = str(dispatch.get('digest_sha256') or '')
              material_fp = str(dispatch.get('material_fingerprint') or '')
              if source != 'BL-HC-01':
                  raise SystemExit('HUYENCO_DISPATCH_SOURCE_INVALID')
              if kind not in {'MATERIAL_DELTA', 'CANARY_NO_DELTA'}:
                  raise SystemExit('HUYENCO_DISPATCH_KIND_INVALID')
              if packet_path != str(latest):
                  raise SystemExit('HUYENCO_DISPATCH_PATH_INVALID')
              if not re.fullmatch(r'[0-9a-f]{64}', digest):
                  raise SystemExit('HUYENCO_DISPATCH_DIGEST_INVALID')
              if not re.fullmatch(r'[0-9a-f]{64}', material_fp):
                  raise SystemExit('HUYENCO_DISPATCH_FINGERPRINT_INVALID')
              if not re.fullmatch(r'[0-9a-f]{40}', source_commit):
                  raise SystemExit('HUYENCO_DISPATCH_SOURCE_COMMIT_INVALID')
              if not latest.exists():
                  raise SystemExit('HUYENCO_DISPATCH_PACKET_MISSING')
              if research['digest_sha256'] != digest:
                  raise SystemExit('HUYENCO_DISPATCH_PACKET_DIGEST_MISMATCH')
              research.update({
                  'signal_kind': kind,
                  'dispatch_verified': True,
                  'dispatch_source_commit': source_commit,
                  'dispatch_material_fingerprint': material_fp,
              })

          if event_name == 'repository_dispatch' and research['dispatch_verified']:
              input_mode = 'HUYENCO_PUBLIC_EVIDENCE_DELTA' if research['signal_kind'] == 'MATERIAL_DELTA' else 'HUYENCO_SIGNAL_CANARY'
          else:
              input_mode = 'TOPOLOGY_MAINTENANCE'

          objectives = {
              'HUYENCO_PUBLIC_EVIDENCE_DELTA': (
                  'From the changed public Huyen Co evidence metadata, return at most one non-duplicate falsifiable research hypothesis, '
                  'or YIELD. Do not turn metadata into medical advice, metaphysical proof, ontology promotion, or production action.'
              ),
              'HUYENCO_SIGNAL_CANARY': (
                  'Verify only the explicit Huyen Co -> Copilot transport semantics. The packet is intentionally not new evidence. '
                  'Return YIELD unless one bounded transport-integrity hypothesis is justified.'
              ),
              'TOPOLOGY_MAINTENANCE': (
                  'Return at most one non-duplicate falsifiable public-repository hypothesis improving external nervous-system continuity '
                  'without widening authority; otherwise YIELD.'
              ),
          }

          capsule = {
              'schema': 'bl-infinity-public-receptor-capsule/7',
              'carrier': 'github-actions',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': event_name,
              'ref': os.environ.get('GITHUB_REF'),
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', '1'),
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'input_mode': input_mode,
              'directed_surface_graph': [facts_for(x) for x in surfaces],
              'research_signal': research,
              'truth_boundaries': [
                  'event_name is authoritative',
                  'trigger_in != signal_out',
                  'repository_dispatch proves this GitHub handoff only after receiver receipt',
                  'schedule wake != continuous daemon',
                  'configured route != executed transport',
                  'model output != empirical fact',
                  'research packet is public source metadata, not a scientific or medical conclusion',
                  'CANARY_NO_DELTA is not new research evidence',
                  'no private Drive, camera, credentials, or identity-seed payloads',
                  'canonical_write=false',
              ],
              'objective': objectives[input_mode],
          }
          json.dump(capsule, open('nervous-receptor/capsule.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)

          instruction = (
              'You are a capsule-only analytical receptor with no tools. Return ONLY one JSON object with keys exactly in this order: '
              'OBSERVED,HYPOTHESIS,FALSIFIER,NEXT,RISK. OBSERVED must start event_name=<event_name>; mention at most two decisive facts; <=300 chars. '
              'HYPOTHESIS is one causal testable claim or exactly YIELD; <=350 chars. FALSIFIER starts AFTER_SHADOW: and gives a measurable rejection test; <=450 chars. '
              'NEXT starts READ_ONLY: or SHADOW:; <=350 chars. RISK <=180 chars. Preserve trigger direction. '
              'Never claim unobserved execution. For HUYENCO_SIGNAL_CANARY, never call the packet new evidence. '
              'For research metadata: no diagnosis, treatment, medical advice, metaphysical proof, ontology promotion, secrets, canonical write, or production mutation.'
          )
          prompt = instruction + '\nPUBLIC_CAPSULE:\n' + json.dumps(capsule, ensure_ascii=False, separators=(',', ':'))
          Path('nervous-receptor/prompt.txt').write_text(prompt, encoding='utf-8')
          PY

      - name: Run bounded Copilot receptor
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot -s \
            --model gpt-5-mini \
            --no-ask-user \
            --disable-builtin-mcps \
            --deny-tool='read,shell,write,url,memory' \
            -p "$(cat nervous-receptor/prompt.txt)" \
            > nervous-receptor/raw-output.json

      - name: Validate, contain, and seal receptor receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          capsule = json.load(open('nervous-receptor/capsule.json', encoding='utf-8'))
          raw = Path('nervous-receptor/raw-output.json').read_text(encoding='utf-8').strip()
          raw_sha = hashlib.sha256(raw.encode()).hexdigest()
          required = ['OBSERVED','HYPOTHESIS','FALSIFIER','NEXT','RISK']
          limits = {'OBSERVED':450,'HYPOTHESIS':450,'FALSIFIER':550,'NEXT':450,'RISK':250}
          violations = []

          try:
              candidate = json.loads(raw)
          except Exception as exc:
              candidate = {}
              violations.append('OUTPUT_NOT_JSON')

          if list(candidate.keys()) != required:
              violations.append('SCHEMA_MISMATCH')
          if list(candidate.keys()) == required:
              for k in required:
                  if not isinstance(candidate[k], str) or not candidate[k].strip():
                      violations.append(f'EMPTY_FIELD:{k}')
                  elif len(candidate[k]) > limits[k]:
                      violations.append(f'FIELD_TOO_LONG:{k}:{len(candidate[k])}>{limits[k]}')

              if isinstance(candidate.get('OBSERVED'), str) and not candidate['OBSERVED'].startswith(f"event_name={capsule['event_name']};"):
                  violations.append('OBSERVED_EVENT_MISMATCH')
              if isinstance(candidate.get('FALSIFIER'), str) and not candidate['FALSIFIER'].startswith('AFTER_SHADOW:'):
                  violations.append('FALSIFIER_SHAPE')
              if isinstance(candidate.get('NEXT'), str) and not (candidate['NEXT'].startswith('READ_ONLY:') or candidate['NEXT'].startswith('SHADOW:')):
                  violations.append('NEXT_SCOPE')

              joined = json.dumps(candidate, ensure_ascii=False).lower()
              forbidden = ['password','private key','api key','camera credential','canonical_write=true','create a fork','fork the repository','diagnose','prescribe','treat the patient']
              if any(x in joined for x in forbidden):
                  violations.append('FORBIDDEN_SCOPE')
              if capsule['input_mode'] == 'HUYENCO_SIGNAL_CANARY' and any(x in joined for x in ['new evidence','new research','new study data']):
                  violations.append('CANARY_FALSE_DELTA_CLAIM')

          accepted = not violations
          if accepted:
              result = candidate
              truth_state = 'MODEL_CANDIDATE_ONLY'
          else:
              result = {
                  'OBSERVED': f"event_name={capsule['event_name']}; model output rejected by deterministic receptor contract; raw output preserved by hash/artifact.",
                  'HYPOTHESIS': 'YIELD',
                  'FALSIFIER': 'AFTER_SHADOW: a fresh receptor run must satisfy schema, size, direction, scope, and event-truth gates before any candidate can be promoted.',
                  'NEXT': 'READ_ONLY: preserve the rejected raw output as negative knowledge and wait for a fresh attributable signal or schedule wake.',
                  'RISK': 'Model contract violation; no analytical candidate is accepted from this run.',
              }
              truth_state = 'MODEL_REJECTED_CONTRACT'

          research = capsule.get('research_signal') or {}
          receipt = {
              'schema': 'bl-infinity-copilot-receptor-receipt/7',
              'receptor_id': f"copilot:{os.environ['GITHUB_RUN_ID']}:{os.environ.get('GITHUB_RUN_ATTEMPT','1')}",
              'carrier': 'github-actions',
              'worker': 'github-copilot-cli',
              'model_request': 'gpt-5-mini',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT','1'),
              'input_mode': capsule['input_mode'],
              'research_signal': {
                  'signal_kind': research.get('signal_kind'),
                  'dispatch_verified': bool(research.get('dispatch_verified')),
                  'dispatch_source_commit': research.get('dispatch_source_commit'),
                  'selected_path': research.get('selected_path'),
                  'digest_sha256': research.get('digest_sha256'),
                  'record_count': research.get('record_count'),
                  'errors_count': research.get('errors_count'),
              },
              'output_sha256': raw_sha,
              'result': result,
              'qa': {
                  'model_contract_accepted': accepted,
                  'contract_violations': violations,
                  'event_truth_bound': True,
                  'research_signal_bound': True,
                  'dispatch_digest_bound': bool(research.get('dispatch_verified')) if os.environ['GITHUB_EVENT_NAME'] == 'repository_dispatch' else None,
                  'fallback_yield_on_model_violation': True,
                  'capsule_only': True,
              },
              'canonical_write': False,
              'state_mutation': False,
              'authority_widening': False,
              'truth_state': truth_state,
              'observed_at': datetime.now(timezone.utc).isoformat(),
          }
          json.dump(receipt, open('nervous-receptor/receptor-receipt.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          print(json.dumps(receipt, ensure_ascii=False))
          PY

      - name: Upload receptor evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deus-copilot-receptor-${{ github.run_id }}-${{ github.run_attempt }}
          path: nervous-receptor/*.json
          if-no-files-found: error
          retention-days: 30
