name: ARC3 public scene-causal A/B 126

on:
  push:
    branches:
      - deus/arc3-kaggle-rank-climb-20260921
    paths:
      - 'public_benchmark/arc3/kaggle_candidates/public_scene_causal_ab.py'
      - '.github/workflows/arc3-public-scene-causal-ab-126.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-scene-causal-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official ARC toolkit
        run: pip install --disable-pip-version-check 'arc-agi==0.9.9'
      - name: Compile scene-causal A/B
        run: |
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_multiframe_probe.py \
            public_benchmark/arc3/kaggle_candidates/animation_delta_signature.py \
            public_benchmark/arc3/kaggle_candidates/public_animation_action_ab.py \
            public_benchmark/arc3/kaggle_candidates/public_effect_memory_rollout_ab.py \
            public_benchmark/arc3/kaggle_candidates/public_scene_causal_ab.py
      - name: Execute exact-model scene-causal A/B
        shell: bash
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          python public_scene_causal_ab.py --receipt "$GITHUB_WORKSPACE/public-scene-causal-ab.json"
      - name: Enforce truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s public-scene-causal-ab.json
          sha256sum public-scene-causal-ab.json > RECEIPT_SHA256SUMS_126.txt
          jq -e '
            .schema=="deus/arc3-public-scene-causal-ab/1"
            and .change_kind=="SCENE_CAUSAL_ABSTRACTION_NOT_FAILED_RUN_RETRY"
            and .source_grounding.duck_public_mirror.upstream_ref=="mariogemoll/arc-prize-2026-arc-agi-3@0a05c529ab58121843b5aaa29a411e175d159118"
            and .source_grounding.clean_room_implementation==true
            and .source_grounding.upstream_code_copied==false
            and .step_budget_per_arm==3
            and .truth.public_development_environment_only==true
            and .truth.same_served_model_contract==true
            and .truth.same_targets_probe_and_policy_budget==true
            and .truth.candidate_uses_same_run_visible_outcomes_only==true
            and .truth.candidate_changes_representation_and_planning_context==true
            and .truth.likely_hud_is_soft_hint_only==true
            and .truth.no_legal_action_hidden_or_hard_banned==true
            and .truth.no_new_frame_is_unknown_not_zero_effect==true
            and .truth.last_visible_frame_carry_forward_shared==true
            and .truth.provider_call_retries==false
            and .truth.promotion_requires_solver_behavior_gain==true
            and .truth.equal_positive_promotion_requires_strictly_nondominated_efficiency==true
            and .truth.game_source_read==false
            and .truth.hidden_state_read==false
            and .truth.kaggle_data_read==false
            and .truth.kaggle_execution==false
            and .truth.kaggle_submission_attempted==false
            and .truth.submission_quota_spent==false
            and .truth.owner_score_claim==false
            and .truth.independent_generalization_claim==false
          ' public-scene-causal-ab.json >/dev/null
          jq '{source_grounding,summary,promotion_gate,inconclusive,truth}' public-scene-causal-ab.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload behavior receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-public-scene-causal-ab-126
          path: |
            public-scene-causal-ab.json
            RECEIPT_SHA256SUMS_126.txt
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed on inconclusive execution
        shell: bash
        run: |
          gate="$(jq -r '.promotion_gate' public-scene-causal-ab.json)"
          case "$gate" in INCONCLUSIVE_*) exit 2;; *) exit 0;; esac
