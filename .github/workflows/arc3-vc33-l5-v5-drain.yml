name: ARC3 vc33 L5 v5 drain-aware search

on:
  push:
    branches: [deus/arc3-vc33-l5-v5-drain-20260921]
    paths: [.github/workflows/arc3-vc33-l5-v5-drain.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l5-drain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'arcengine==0.9.3' numpy
      - name: Search L5 with persisted live anchors and speculative public-frame drain
        run: |
          python - <<'PY'
          import copy,hashlib,heapq,itertools,json,logging,os,time
          from pathlib import Path
          import numpy as np
          import arc_agi
          from arc_agi import OperationMode
          logging.disable(logging.CRITICAL)

          L3_PATH=[0,2,0,2,0,4,2,0,4,2,0,4,2,0,6,6,6,6,6,6,6,6,6]
          L4_PATH=[3,3,0,3,3,3,4,4,6,4,1,6,4,6,4,6,4,6,4,6,4]

          def fr(o): return np.asarray(o.frame[-1],dtype=np.uint8)
          def norm(o):
              a=fr(o).copy()
              if a.shape[0]>=4:
                  a[0,:]=0; a[-1,:]=0
              return a
          def key(o): return hashlib.sha256(norm(o).tobytes()).hexdigest()
          def comps(a,color,lo=1,hi=256):
              m=(a==color);H,W=a.shape;seen=np.zeros_like(m,bool);out=[]
              for y in range(H):
                for x in range(W):
                  if not m[y,x] or seen[y,x]:continue
                  st=[(x,y)];seen[y,x]=1;pts=[]
                  while st:
                    xx,yy=st.pop();pts.append((xx,yy))
                    for nx,ny in ((xx+1,yy),(xx-1,yy),(xx,yy+1),(xx,yy-1)):
                      if 0<=nx<W and 0<=ny<H and m[ny,nx] and not seen[ny,nx]:
                        seen[ny,nx]=1;st.append((nx,ny))
                  if lo<=len(pts)<=hi:
                    xs=[p[0] for p in pts];ys=[p[1] for p in pts]
                    out.append({'area':len(pts),'bbox':[min(xs),min(ys),max(xs),max(ys)],'center':[int(round(sum(xs)/len(xs))),int(round(sum(ys)/len(ys)))]})
              return sorted(out,key=lambda z:(z['bbox'][0],z['bbox'][1],z['area']))
          def brown(o): return sorted(comps(fr(o),9,4,32),key=lambda z:(z['bbox'][0],z['bbox'][1]))
          def anchors(o):
              z=[]
              for c in comps(fr(o),1,8,128):
                  if c['bbox'][1]>2 and c['bbox'][3]<61:z.append({'center':c['center'],'bbox':c['bbox'],'area':c['area']})
              return sorted(z,key=lambda b:(b['center'][0],b['center'][1]))
          def cands(o,A):
              a=fr(o);z=[]
              for i,b in enumerate(A):
                  x,y=b['center'];z.append({'kind':'blue','anchor':i,'color':int(a[y,x]),'center':[x,y]})
              for j,b in enumerate(brown(o)):z.append({'kind':'brown','brown_rank':j,'center':b['center']})
              return z
          def click(e,o,xy):
              am={a.value:a for a in e.action_space}
              return e.step(am[6],data={'x':int(xy[0]),'y':int(xy[1])})
          def act_and_drain(e,o,xy,max_drain=220):
              nf=click(e,o,xy)
              if nf is None:return None,0
              drains=0
              while drains<max_drain and int(nf.levels_completed)==int(o.levels_completed):
                  probe=copy.deepcopy(e);po=probe.observation_space
                  pnf=click(probe,po,[0,0])
                  if pnf is None or key(pnf)==key(nf):break
                  e.__dict__.clear();e.__dict__.update(probe.__dict__);nf=e.observation_space;drains+=1
              return nf,drains
          def prefix(e):
              o=e.observation_space
              b=brown(o);t=max(b,key=lambda z:z['center'][1])['center']
              for _ in range(3):
                  o=click(e,o,t)
                  if int(o.levels_completed)>=1:break
              if int(o.levels_completed)<1:raise RuntimeError('L1_FAIL')
              b=brown(o);cs=[x['center'] for x in b];F=cs[3];E=cs[1]
              for r in ['F','F','F','E','F','E','F']:
                  o=click(e,o,F if r=='F' else E)
                  if int(o.levels_completed)>=2:break
              if int(o.levels_completed)<2:raise RuntimeError('L2_FAIL')
              for idx in L3_PATH:
                  b=brown(o)
                  if idx>=len(b):raise RuntimeError('L3_INDEX')
                  o=click(e,o,b[idx]['center'])
                  if int(o.levels_completed)>=3:break
              if int(o.levels_completed)<3:raise RuntimeError('L3_FAIL')
              A4=anchors(o)
              for idx in L4_PATH:
                  cc=cands(o,A4)
                  if idx>=len(cc):raise RuntimeError('L4_INDEX')
                  o=click(e,o,cc[idx]['center'])
                  if int(o.levels_completed)>=4:break
              if int(o.levels_completed)<4:raise RuntimeError('L4_FAIL')
              return o
          def ident(item):
              return ('b',int(item['anchor'])) if item['kind']=='blue' else ('r',int(item['brown_rank']))
          def resolve(o,A,item):
              if item['kind']=='blue':
                  i=int(item['anchor']);return A[i]['center'] if i<len(A) else None
              bs=brown(o);j=int(item['brown_rank']);return bs[j]['center'] if j<len(bs) else None

          normal=arc_agi.Arcade(operation_mode=OperationMode.NORMAL)
          base=normal.make('vc33',seed=0,save_recording=False,include_frame_data=True)
          if base is None:raise RuntimeError('ENV_UNAVAILABLE')
          o4=prefix(base);A=anchors(o4)
          if len(A)<3:raise RuntimeError('EXPECTED_3_ANCHORS:'+json.dumps(A))
          A=A[:3]
          t0=time.monotonic();counter=itertools.count();start=4;exp=0;latent=0;visible=0;peak=1;trimmed=0
          init_counts=(0,0,0);heap=[(0.0,0,next(counter),copy.deepcopy(base),o4,[],init_counts,())]
          seen={(key(o4),init_counts,()):0};found=None;found_o=None;limit=240000;beam=14000
          while heap and exp<limit and time.monotonic()-t0<1200:
              pri,plen,_,e,o,path,counts,suffix=heapq.heappop(heap)
              if plen>18:continue
              ph=key(o)
              for item in cands(o,A):
                  ee=copy.deepcopy(e);xy=resolve(o,A,item)
                  if xy is None:continue
                  nf,drains=act_and_drain(ee,o,xy);exp+=1
                  if nf is None:continue
                  rec={'kind':item['kind'],'anchor':item.get('anchor'),'brown_rank':item.get('brown_rank'),'drains':drains}
                  npth=path+[rec]
                  if int(nf.levels_completed)>=5:
                      found=npth;found_o=nf;break
                  st=getattr(nf.state,'value',str(nf.state))
                  if st in ('GAME_OVER','WIN'):continue
                  nh=key(nf);cc=list(counts)
                  if item['kind']=='blue':cc[int(item['anchor'])]=min(7,cc[int(item['anchor'])]+1)
                  cc=tuple(cc);sig=ident(item)
                  if nh==ph:
                      latent+=1;ns=(suffix+(sig,))[-2:]
                  else:
                      visible+=1;ns=()
                  sk=(nh,cc,ns)
                  if len(npth)>=seen.get(sk,10**9):continue
                  seen[sk]=len(npth)
                  distinct=sum(1 for x in cc if x>0);blue_total=sum(cc)
                  diff=float(np.mean(norm(o)!=norm(nf))) if norm(o).shape==norm(nf).shape else 1.0
                  # Public prior is ordering only: all 3 blue controls matter and roughly five effective activations are expected.
                  score=(len(npth)*0.9)-(distinct*5.0)-(min(5,blue_total)*1.2)-(diff*16.0)+(0.15*sum(1 for x in ns if x and x[0]=='r'))
                  heapq.heappush(heap,(score,len(npth),next(counter),ee,nf,npth,cc,ns));peak=max(peak,len(heap))
              if found is not None:break
              if len(heap)>beam*2:
                  heap=heapq.nsmallest(beam,heap);heapq.heapify(heap);trimmed+=1

          search={'result':'FOUND' if found else 'MISS','expansions':exp,'seen':len(seen),'seconds':time.monotonic()-t0,'peak':peak,'trimmed':trimmed,'latent_edges':latent,'visible_edges':visible,'path':found,'path_len':None if found is None else len(found),'anchors':A,'initial_candidates':cands(o4,A),'protocol':'PUBLIC_RULE_DERIVED_L5_DRAIN_AWARE_V5','representation_delta':'persist live-derived blue anchors across recoloring + speculative public-frame animation drain + blue activation count state','search_order_prior':'all 3 blue controls relevant; approximately five effective activations; ordering only','external_l5_route_used':False,'game_source_inspected_by_solver':False,'hidden_state_read':False,'independent_first_contact_claim':False,'rule_derived_claim':True}
          out=Path('verification');out.mkdir(exist_ok=True);(out/'search.json').write_text(json.dumps(search,indent=2));print('VC33_L5_V5_SEARCH='+json.dumps(search,separators=(',',':')))
          if found is None:raise RuntimeError('L5_V5_NOT_FOUND')

          online=arc_agi.Arcade(operation_mode=OperationMode.ONLINE)
          src='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/blob/'+os.environ['GITHUB_SHA']+'/.github/workflows/arc3-vc33-l5-v5-drain.yml'
          cid=online.open_scorecard(source_url=src,tags=['DEUS','vc33','l5-v5','drain-aware','public-development'])
          oe=online.make('vc33',seed=0,scorecard_id=cid,save_recording=False,include_frame_data=True)
          if oe is None:raise RuntimeError('ONLINE_ENV_UNAVAILABLE')
          oo=prefix(oe);OA=anchors(oo)[:3]
          if len(OA)!=len(A):raise RuntimeError('ANCHOR_COUNT_DIVERGENCE')
          trace=[]
          for stepn,item in enumerate(found,1):
              xy=resolve(oo,OA,item)
              if xy is None:raise RuntimeError('ONLINE_RESOLVE_FAIL_'+str(stepn))
              before=fr(oo).copy();oo=click(oe,oo,xy)
              if oo is None:raise RuntimeError('ONLINE_CLICK_FAIL_'+str(stepn))
              actual=0
              for _ in range(int(item['drains'])):
                  oo=click(oe,oo,[0,0]);actual+=1
                  if oo is None:raise RuntimeError('ONLINE_DRAIN_FAIL_'+str(stepn))
              trace.append({'step':stepn,'item':item,'resolved_xy':xy,'actual_drains':actual,'changed_pixels':int(np.count_nonzero(before!=fr(oo))),'level':int(oo.levels_completed)})
              if int(oo.levels_completed)>=5:break
          card=online.close_scorecard(cid);passed=int(oo.levels_completed)>=5
          rec={'schema':'deus/arc3-vc33-l5-v5-drain/1','result':'PASS' if passed else 'FAIL','game':'vc33','levels_completed':int(oo.levels_completed),'win_levels':int(getattr(oo,'win_levels',0) or 0),'state':getattr(oo.state,'value',str(oo.state)),'scorecard_id':cid,'scorecard_score':None if card is None else card.score,'l5_path':found,'online_trace':trace,'search':search,'protocol':'PUBLIC_RULE_DERIVED_L5_DRAIN_AWARE_V5','external_full_route_used':False,'external_l5_route_used':False,'game_source_inspected_by_solver':False,'hidden_state_read':False,'independent_first_contact_claim':False,'rule_derived_claim':True,'competition_hidden_score_claim':False,'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'final_frame_sha256':hashlib.sha256(fr(oo).tobytes()).hexdigest()}
          (out/'receipt.json').write_text(json.dumps(rec,indent=2));print('VC33_L5_V5_RECEIPT='+json.dumps(rec,separators=(',',':')))
          if not passed:raise RuntimeError('L5_V5_ONLINE_FAIL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vc33-l5-v5-drain-aware
          path: verification/
          retention-days: 30
