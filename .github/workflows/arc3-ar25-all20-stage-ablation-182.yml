name: ARC3 AR25 all20 stage ablation 182

on:
  push:
    branches: [deus/arc3-kaggle-rank-climb-20260921]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ar25_all20_stage_ablation_182.py
      - .github/workflows/arc3-ar25-all20-stage-ablation-182.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            public_benchmark/arc3/kaggle_candidates/public_executable_world_model_134.py \
            public_benchmark/arc3/kaggle_candidates/public_fullboard_translation_program_160.py \
            public_benchmark/arc3/kaggle_candidates/public_dense_scroll_renderer_audit_167.py \
            public_benchmark/arc3/kaggle_candidates/public_world_overlay_renderer_172.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_family_sweep_175.py \
            public_benchmark/arc3/kaggle_candidates/public_residual_correction_178.py \
            public_benchmark/arc3/kaggle_candidates/public_ar25_all20_stage_ablation_182.py
      - name: Download pinned all20
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'
          for i in $(seq 0 19); do f="ar25-0c556536_p${i}_events.jsonl"; curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"; test -s "public_trace/$f"; done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute frozen ablation
        run: |
          set -euo pipefail
          cd public_benchmark/arc3/kaggle_candidates
          args=(); for i in $(seq 0 19); do args+=(--input "$GITHUB_WORKSPACE/public_trace/ar25-0c556536_p${i}_events.jsonl"); done
          python public_ar25_all20_stage_ablation_182.py "${args[@]}" --output "$GITHUB_WORKSPACE/ar25-all20-stage-ablation-182.json"
      - name: Truth gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('ar25-all20-stage-ablation-182.json'))
          assert d['schema']=='deus/arc3-ar25-all20-stage-ablation/1' and d['rung']==182
          t=d['truth']; assert t['architecture_frozen_before_evaluation'] and t['current_prediction_uses_preaction_and_prior_history_only']
          assert not t['independent_generalization_claim'] and not t['kaggle_execution'] and not t['submission_quota_spent']
          print(json.dumps({'gate':d['diagnostic_gate'],'heldout':d['aggregate']['heldout_same_game'],'selection':d['aggregate']['selection'],'all20':d['aggregate']['all20']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-ar25-all20-stage-ablation-182
          path: |
            ar25-all20-stage-ablation-182.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
