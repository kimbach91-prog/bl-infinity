name: ARC3 R304 cn04 frozen graph-exact p5-p9 replay
on:
  push:
    branches: [deus/r303-subset4-exact-topology-loto-20260923]
    paths:
      - .github/workflows/arc3-r304-cn04-graph-exact-p5p9-replay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 32}
      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage exact cn04 p0-p9 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p train replay
          game=cn04-2fe56bfb
          for p in $(seq 0 4); do f="${game}_p${p}_events.jsonl"; cp "upstream-duck/example-run/artifacts/$f" "train/$f"; done
          for p in $(seq 5 9); do f="${game}_p${p}_events.jsonl"; cp "upstream-duck/example-run/artifacts/$f" "replay/$f"; done
          test "$(find train -type f -name '*_events.jsonl' | wc -l)" -eq 5
          test "$(find replay -type f -name '*_events.jsonl' | wc -l)" -eq 5
          ! find train replay -type f -regex '.*_p1[0-9]_events.jsonl' | grep -q .
          sha256sum train/*.jsonl replay/*.jsonl > TRACE_SHA256SUMS.txt
      - name: Execute frozen replay
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile public_benchmark/arc3/kaggle_candidates/public_cn04_graph_exact_p5p9_replay_304.py
          ta=(); for f in $(find train -type f -name '*_events.jsonl' | sort -V); do ta+=(--train "$f"); done
          ra=(); for f in $(find replay -type f -name '*_events.jsonl' | sort -V); do ra+=(--replay "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_cn04_graph_exact_p5p9_replay_304.py "${ta[@]}" "${ra[@]}" --output r304.json 2> >(tee runtime.txt >&2) | tee stdout.txt
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('r304.json'))
          assert d['schema']=='deus/arc3-r304-cn04-graph-exact-p5p9-replay/1'
          assert d['mode']=='graph_exact'
          assert d['protocol']['selection_changed_after_replay_read'] is False
          assert d['protocol']['p10_p19_staged_or_read'] is False
          assert d['truth']['p10_p19_read'] is False
          assert d['truth']['solver_promotion'] is False
          assert d['truth']['competition_submission'] is False
          print(json.dumps({'verdict':d['verdict'],'replay_total':d['replay_total']},sort_keys=True))
          PY
          sha256sum r304.json runtime.txt stdout.txt TRACE_SHA256SUMS.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r304-cn04-graph-exact-p5p9-replay
          path: |
            r304.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
            TRACE_SHA256SUMS.txt
          retention-days: 30
