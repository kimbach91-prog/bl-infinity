name: DEUS No-Account Expansion Wave

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deus-noaccount-expansion-wave.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noaccount-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe three zero-signup inference candidates
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/noacct

          probe() {
            name="$1"; url="$2"; model="$3"; token="$4"
            req="/tmp/noacct/$name.req.json"
            resp="/tmp/noacct/$name.resp.json"
            codefile="/tmp/noacct/$name.code"
            jq -n --arg model "$model" --arg token "$token" '{model:$model,messages:[{role:"user",content:("Public S0 canary. Reply with exactly: "+$token)}],temperature:0}' > "$req"
            start="$(date +%s%3N)"
            curl --max-time 90 -sS -o "$resp" -w '%{http_code}'               -X POST "$url" -H 'content-type: application/json' --data-binary @"$req" > "$codefile" || true
            latency="$(( $(date +%s%3N) - start ))"
            code="$(cat "$codefile" 2>/dev/null || echo 0)"
            exact=false
            if [ "$code" = "200" ] && grep -Fq "$token" "$resp" 2>/dev/null; then exact=true; fi
            digest="$(sha256sum "$resp" 2>/dev/null | awk '{print $1}' || true)"
            jq -n --arg name "$name" --arg url "$url" --arg model "$model" --arg status "$code" --arg digest "$digest" --argjson latency "$latency" --argjson exact "$exact"               '{provider:$name,endpoint:$url,requested_model:$model,http_status:($status|tonumber),latency_ms:$latency,exact_contract:$exact,response_digest:$digest,auth_mode:"NO_AUTH_HEADER",data_class:"S0_SYNTHETIC_ONLY",canonical_write:false,settlement:false}'
          }

          probe "VIREONIX" "https://vireonix.ai/v1/chat/completions" "auto" "DEUS_VIREONIX_CANARY_OK" > /tmp/noacct/vireonix.receipt.json
          probe "ANIMICA" "https://animica.dev/v1/chat/completions" "kimi-k3" "DEUS_ANIMICA_CANARY_OK" > /tmp/noacct/animica.receipt.json
          probe "BLOCKRUN" "https://blockrun.ai/api/v1/chat/completions" "nvidia/nemotron-3.5-lightning" "DEUS_BLOCKRUN_CANARY_OK" > /tmp/noacct/blockrun.receipt.json

          jq -n             --slurpfile a /tmp/noacct/vireonix.receipt.json             --slurpfile b /tmp/noacct/animica.receipt.json             --slurpfile c /tmp/noacct/blockrun.receipt.json             '{receipt_version:"DEUS-NOACCOUNT-EXPANSION-WAVE/1",constraints:{account_creation:false,api_key:false,payment:false,data_class:"S0_SYNTHETIC_ONLY"},routes:{vireonix:$a[0],animica:$b[0],blockrun:$c[0]}}'             | tee /tmp/noacct/wave.json

          cat /tmp/noacct/wave.json >> "$GITHUB_STEP_SUMMARY"
          jq -e '.receipt_version and .routes.vireonix and .routes.animica and .routes.blockrun' /tmp/noacct/wave.json >/dev/null
