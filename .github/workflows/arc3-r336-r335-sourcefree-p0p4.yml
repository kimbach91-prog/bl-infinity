name: ARC3 R336 R335 source-free p0-p4 gate

on:
  push:
    branches: [deus/r335-sourcefree-gate-20260923]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_generic_relational_transducer_335.py
      - public_benchmark/arc3/kaggle_candidates/public_r335_sourcefree_p0p4_falsifier_336.py
      - .github/workflows/arc3-r336-r335-sourcefree-p0p4.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/frozen-r330/public_benchmark/arc3/kaggle_candidates

jobs:
  game:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        game:
          - ar25-0c556536
          - bp35-0a0ad940
          - cd82-fb555c5d
          - cn04-2fe56bfb
          - dc22-fdcac232
          - ft09-0d8bbf25
          - g50t-5849a774
          - ka59-38d34dbb
          - lf52-271a04aa
          - lp85-305b61c3
          - ls20-9607627b
          - m0r0-492f87ba
          - r11l-495a7899
          - re86-8af5384d
          - s5i5-18d95033
          - sb26-7fbdac44
          - sc25-635fd71a
          - sk48-d8078629
          - sp80-589a99af
          - su15-1944f8ab
          - tn36-ef4dde99
          - tr87-cd924810
          - tu93-0768757b
          - vc33-5430563c
          - wa30-ee6fef47
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen source-free dependency ancestry
        uses: actions/checkout@v4
        with:
          repository: kimbach91-prog/bl-infinity
          ref: 7358fa568414a96a2acf864a450ecc078bd8c433
          path: frozen-r330
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Tufalabs/duck-harness
          ref: 7652836056c59e044f093e3c13ed7438c814169e
          path: upstream-duck
          sparse-checkout: example-run/artifacts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Stage exact p0-p4 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public_trace
          for p in $(seq 0 4); do
            f="${{ matrix.game }}_p${p}_events.jsonl"
            cp "upstream-duck/example-run/artifacts/${f}" "public_trace/${f}"
          done
          test "$(find public_trace -name '*_events.jsonl' -type f | wc -l)" -eq 5
          ! find public_trace -name '*_p[5-9]_events.jsonl' | grep -q .
          ! find public_trace -name '*_p1[0-9]_events.jsonl' | grep -q .

      - name: Run frozen R335 source-free falsifier
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in $(find public_trace -name '*_events.jsonl' | sort -V); do args+=(--input "$f"); done
          /usr/bin/time -v python public_benchmark/arc3/kaggle_candidates/public_r335_sourcefree_p0p4_falsifier_336.py \
            "${args[@]}" \
            --output "r336-game-${{ matrix.game }}.json" \
            2> >(tee runtime.txt >&2) | tee stdout.txt

      - name: Audit boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json
          p=glob.glob("r336-game-*.json")
          assert len(p)==1
          d=json.load(open(p[0]))
          assert d["schema"]=="deus/arc3-r336-r335-sourcefree-p0p4/1"
          assert d["idempotency_key"]=="R336-R335-SOURCEFREE-P0P4-20260923-001"
          assert d["protocol"]["game_id_branching"] is False
          assert d["protocol"]["p5_p9_staged_or_read"] is False
          assert d["protocol"]["p10_p19_staged_or_read"] is False
          assert d["truth"]["kaggle_submission"] is False
          print({"verdict":d["verdict"],"metrics":d["metrics"]})
          PY
          sha256sum r336-game-*.json runtime.txt stdout.txt > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: r336-game-${{ matrix.game }}
          path: |
            r336-game-*.json
            runtime.txt
            stdout.txt
            SHA256SUMS.txt
          retention-days: 30

  aggregate:
    needs: game
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen source-free dependency ancestry
        uses: actions/checkout@v4
        with:
          repository: kimbach91-prog/bl-infinity
          ref: 7358fa568414a96a2acf864a450ecc078bd8c433
          path: frozen-r330
          persist-credentials: false

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - uses: actions/download-artifact@v4
        with:
          pattern: r336-game-*
          path: r336_inputs
          merge-multiple: true

      - name: Aggregate all 25 game results
        shell: bash
        run: |
          set -euo pipefail
          test "$(find r336_inputs -maxdepth 1 -name 'r336-game-*.json' -type f | wc -l)" -eq 25
          python public_benchmark/arc3/kaggle_candidates/public_r335_sourcefree_p0p4_falsifier_336.py \
            --aggregate-dir r336_inputs \
            --output r336-r335-sourcefree-p0p4-aggregate.json | tee aggregate-stdout.txt

      - name: Independent aggregate audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open("r336-r335-sourcefree-p0p4-aggregate.json"))
          assert d["schema"]=="deus/arc3-r336-r335-sourcefree-p0p4-aggregate/1"
          assert d["game_count"]==25
          assert d["truth"]["p5_p19_unread"] is True
          assert d["truth"]["kaggle_execution"] is False
          assert d["truth"]["competition_submission"] is False
          print(json.dumps(d,sort_keys=True))
          PY
          sha256sum r336-r335-sourcefree-p0p4-aggregate.json aggregate-stdout.txt > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: r336-r335-sourcefree-p0p4-aggregate
          path: |
            r336-r335-sourcefree-p0p4-aggregate.json
            aggregate-stdout.txt
            SHA256SUMS.txt
          retention-days: 30
