name: ARC3 ft09 R227 LOTO confidence gate 232
on:
  push:
    branches: [deus/arc3-remaining14-coverage-20260922]
    paths:
      - public_benchmark/arc3/kaggle_candidates/public_ft09_r227_loto_confidence_gate_232.py
      - .github/workflows/arc3-ft09-r227-loto-confidence-232.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-r227-confidence-loto:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m py_compile public_benchmark/arc3/kaggle_candidates/public_ft09_r227_loto_confidence_gate_232.py
      - name: Download exact ft09 p0..p19 public traces
        run: |
          set -euo pipefail
          mkdir -p public_trace
          base='https://raw.githubusercontent.com/Tufalabs/duck-harness/7652836056c59e044f093e3c13ed7438c814169e/example-run/artifacts'; game='ft09-0d8bbf25'
          for p in $(seq 0 19); do f="${game}_p${p}_events.jsonl"; curl --fail --location --retry 3 --silent --show-error "$base/$f" -o "public_trace/$f"; test -s "public_trace/$f"; done
          sha256sum public_trace/*.jsonl > public_trace/SHA256SUMS.txt
      - name: Execute LOTO confidence gate validation
        run: |
          set -euo pipefail
          args=(); for f in public_trace/ft09-0d8bbf25_p*_events.jsonl; do args+=(--input "$f"); done
          PYTHONPATH=public_benchmark/arc3/kaggle_candidates python public_benchmark/arc3/kaggle_candidates/public_ft09_r227_loto_confidence_gate_232.py "${args[@]}" --output r232-ft09-r227-loto-confidence.json
      - name: Verify truth boundaries
        run: |
          python - <<'PY'
          import json
          d=json.load(open('r232-ft09-r227-loto-confidence.json'))
          assert d['schema']=='deus/arc3-ft09-r227-loto-confidence-gate/1'
          t=d['truth']
          assert t['gate_selected_from_p0_p9_loto_only'] is True
          assert t['confidence_features_preaction_training_derived_only'] is True
          assert t['p10_p19_status']=='PUBLIC_DEVELOPMENT_REUSED_NOT_INDEPENDENT_HELDOUT'
          assert t['p10_p19_used_for_gate_selection'] is False
          assert t['untouched_public_validation_done'] is False
          assert d['promotion']['source_assisted_coverage_expert_promotion'] is False
          assert d['promotion']['independent_generalization_promotion'] is False
          assert d['promotion']['kaggle_packaging'] is False
          print(json.dumps({'selected':d['selection']['selected'],'loto_pass':d['selection']['loto_gate_selection_pass'],'audit':d['reused_public_development_audit'],'status':d['promotion']['confidence_family_status']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arc3-r232-ft09-r227-loto-confidence
          path: |
            r232-ft09-r227-loto-confidence.json
            public_trace/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
