version: 2
updates:
  - package-ecosystem: npm
    directory: /runtime/human-os-gateway
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["security", "dependencies"]
  - package-ecosystem: npm
    directory: /runtime/federation
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["security", "dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["security", "dependencies"]
